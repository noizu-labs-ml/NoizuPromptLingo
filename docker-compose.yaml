services:
  db:
    image: noizu/timescaledb-ha-with-age:pg17.9-ts2.25.2-all-age1.7.0
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: boe
      POSTGRES_PASSWORD: boe_dev
      POSTGRES_DB: blade_of_eternity_dev
    volumes:
      - pgdata:/home/postgres/pgdata/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:

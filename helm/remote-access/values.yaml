replicas: 1

# frps server image. snowdreamtech/frps and fatedier/frps both ship the
# upstream frps binary; pin to a recent tag.
image: snowdreamtech/frps:0.61.1
imagePullPolicy: IfNotPresent

# Pin to the only public-facing node (binds host ports for ingress + control).
nodeSelector:
  kubernetes.io/hostname: noizu-server

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

# imagePullSecrets only needed if the image is mirrored to the private registry.
imagePullSecrets: []
# - name: ops-registry-secret

frps:
  # Control channel — frpc dials this directly (DNS-only tunnel.noizu.com).
  bindPort: 7000
  # HTTP vhost port — fronted by ingress-nginx for *.remote-access.noizu.com.
  vhostHTTPPort: 80
  # Per-client subdomain claims become <subdomain>.<subdomainHost>.
  subdomainHost: remote-access.noizu.com
  # Force TLS on the control channel (only frpc with TLS + token may connect).
  tlsForce: true
  # NPL server-plugin callback — validates the tunnel token + name ownership.
  auth:
    pluginName: npl-auth
    addr: http://npl-mcp.apps-ns.svc.cluster.local:4000
    path: /api/v1/remote-access/frp-auth
    ops:
      - Login
      - NewProxy
      - CloseProxy
  # Extra raw TOML appended verbatim to frps.toml (e.g. log level, limits).
  extraConfig: ""

# Control-port exposure. The frpc -> frps control channel cannot be HTTP-proxied
# by Cloudflare, so it is reached DNS-only via tunnel.noizu.com on noizu-server.
controlPort:
  # When set, bind the control port directly on the node (recommended path).
  hostPort: 7000
  # Optionally also publish a NodePort Service for the control port.
  nodePort:
    enabled: false
    port: 30700

# vhost HTTP Service (ClusterIP) — the Ingress backend.
service:
  type: ClusterIP

ingress:
  enabled: true
  className: nginx
  host: "*.remote-access.noizu.com"
  annotations:
    # frp vhost matching needs the original Host header preserved.
    nginx.ingress.kubernetes.io/upstream-vhost: "$host"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  # Restrict ingress source IPs to Cloudflare ranges (orange-cloud only).
  cloudflareOnly: true

tls:
  enabled: true
  # Dedicated *.remote-access.noizu.com origin cert synced from Infisical.
  # Override to cloudflare-tls-synced if using Cloudflare-terminated TLS only.
  secretName: remote-access-tls-synced

networkPolicy:
  enabled: true
  # CIDR of the data-ns pods to deny egress to (best-effort). Empty = skip the
  # explicit deny block and rely on the allow-list being the only egress.
  dataNsCidr: ""
  # npl-mcp callback target (egress allowed).
  nplMcp:
    namespace: apps-ns
    port: 4000

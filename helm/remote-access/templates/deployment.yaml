apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "remote-access.fullname" . }}
  labels:
    {{- include "remote-access.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "remote-access.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "remote-access.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the pod when frps.toml changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: frps
        image: {{ .Values.image }}
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        args:
        - -c
        - /etc/frp/frps.toml
        ports:
        - name: control
          containerPort: {{ .Values.frps.bindPort }}
          protocol: TCP
          {{- if .Values.controlPort.hostPort }}
          hostPort: {{ .Values.controlPort.hostPort }}
          {{- end }}
        - name: vhost-http
          containerPort: {{ .Values.frps.vhostHTTPPort }}
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /etc/frp
          readOnly: true
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        livenessProbe:
          tcpSocket:
            port: control
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          tcpSocket:
            port: control
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: config
        configMap:
          name: {{ include "remote-access.fullname" . }}-config
      restartPolicy: Always

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "start-app.fullname" . }}
  labels:
    {{- include "start-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "start-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "start-app.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: backend
        image: {{ .Values.backend.image }}
        imagePullPolicy: Always
        ports:
        - containerPort: {{ .Values.backend.port }}
          protocol: TCP
        env:
          {{- include "start-app.backendEnv" . | nindent 8 }}
          {{- with .Values.extraEnv }}
          {{- toYaml . | nindent 8 }}
          {{- end }}
          {{- include "start-app.otelEnv" . | nindent 8 }}
          {{- include "start-app.storageEnv" . | nindent 8 }}
        {{- if .Values.configMap.enabled }}
        envFrom:
        - configMapRef:
            name: {{ include "start-app.fullname" . }}-config
        {{- end }}
        resources:
          {{- toYaml .Values.backend.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.backend.port }}
          initialDelaySeconds: 15
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.backend.port }}
          initialDelaySeconds: 5
          periodSeconds: 10
      - name: frontend
        image: {{ .Values.frontend.image }}
        imagePullPolicy: Always
        ports:
        - containerPort: {{ .Values.frontend.port }}
          protocol: TCP
        env:
        - name: API_URL
          value: "https://{{ .Values.domain }}"
        - name: PORT
          value: {{ .Values.frontend.port | quote }}
        - name: HOSTNAME
          value: "0.0.0.0"
        - name: NODE_ENV
          value: "production"
        {{- if .Values.analytics.ga.measurementId }}
        - name: GA_MEASUREMENT_ID
          value: {{ .Values.analytics.ga.measurementId | quote }}
        {{- end }}
        {{- if .Values.analytics.posthog.key }}
        - name: POSTHOG_KEY
          value: {{ .Values.analytics.posthog.key | quote }}
        - name: POSTHOG_HOST
          value: {{ .Values.analytics.posthog.host | quote }}
        {{- end }}
        {{- if .Values.otel.enabled }}
        - name: OTEL_COLLECTOR_URL
          value: {{ .Values.otel.collectorHttpEndpoint | quote }}
        {{- end }}
        {{- if .Values.configMap.enabled }}
        envFrom:
        - configMapRef:
            name: {{ include "start-app.fullname" . }}-config
        {{- end }}
        resources:
          {{- toYaml .Values.frontend.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /
            port: {{ .Values.frontend.port }}
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: {{ .Values.frontend.port }}
          initialDelaySeconds: 5
          periodSeconds: 10
      restartPolicy: Always

{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "codefresh.fullname" . }}
  labels:
    {{- include "codefresh.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
    {{- if .Values.ingress.cloudflareOnly }}
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ include "codefresh.cloudflareWhitelist" . | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
  - hosts:
    - {{ .Values.domain }}
    secretName: {{ .Values.tls.secretName }}
  rules:
  - host: {{ .Values.domain }}
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: {{ include "codefresh.fullname" . }}
            port:
              number: {{ .Values.backend.port }}
      - path: /health
        pathType: Exact
        backend:
          service:
            name: {{ include "codefresh.fullname" . }}
            port:
              number: {{ .Values.backend.port }}
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "codefresh.fullname" . }}
            port:
              number: {{ .Values.frontend.port }}
{{- end }}

{{- /* Apex-style HTTP routing: backend (mcp) path split with the SPA
catch-all. Shared by the apex domain and every ingress.extraHosts entry. */}}
{{- define "npl-mcp.apexHttp" -}}
http:
  paths:
    - path: /mcp
      pathType: Prefix
      backend:
        service:
          name: {{ include "npl-mcp.fullname" . }}
          port:
            name: mcp
    - path: /sse
      pathType: Prefix
      backend:
        service:
          name: {{ include "npl-mcp.fullname" . }}
          port:
            name: mcp
    - path: /socket
      pathType: Prefix
      backend:
        service:
          name: {{ include "npl-mcp.fullname" . }}
          port:
            name: mcp
    - path: /browser-sessions
      pathType: Prefix
      backend:
        service:
          name: {{ include "npl-mcp.fullname" . }}
          port:
            name: mcp
    - path: /health
      pathType: Prefix
      backend:
        service:
          name: {{ include "npl-mcp.fullname" . }}
          port:
            name: mcp
    - path: /.well-known/oauth-authorization-server
      pathType: Prefix
      backend:
        service:
          name: {{ include "npl-mcp.fullname" . }}
          port:
            name: mcp
    - path: /.well-known/oauth-protected-resource
      pathType: Prefix
      backend:
        service:
          name: {{ include "npl-mcp.fullname" . }}
          port:
            name: mcp
    - path: /.well-known/jwks.json
      pathType: Exact
      backend:
        service:
          name: {{ include "npl-mcp.fullname" . }}
          port:
            name: mcp
    - path: /oauth
      pathType: Prefix
      backend:
        service:
          name: {{ include "npl-mcp.fullname" . }}
          port:
            name: mcp
    - path: /auth/oidc
      pathType: Prefix
      backend:
        service:
          name: {{ include "npl-mcp.fullname" . }}
          port:
            name: mcp
    - path: /auth/sso-callback
      pathType: Exact
      backend:
        service:
          name: {{ include "npl-mcp.fullname" . }}
          port:
            name: http
    - path: /auth/register
      pathType: Exact
      backend:
        service:
          name: {{ include "npl-mcp.fullname" . }}
          port:
            name: http
    - path: /custom
      pathType: Prefix
      backend:
        service:
          name: {{ include "npl-mcp.fullname" . }}
          port:
            name: mcp
    - path: /org
      pathType: Prefix
      backend:
        service:
          name: {{ include "npl-mcp.fullname" . }}
          port:
            name: mcp
    - path: /user
      pathType: Prefix
      backend:
        service:
          name: {{ include "npl-mcp.fullname" . }}
          port:
            name: mcp
    - path: /api/auth
      pathType: Prefix
      backend:
        service:
          name: {{ include "npl-mcp.fullname" . }}
          port:
            name: http
    - path: /api/keys
      pathType: Prefix
      backend:
        service:
          name: {{ include "npl-mcp.fullname" . }}
          port:
            name: http
    - path: /api/mcp-token
      pathType: Prefix
      backend:
        service:
          name: {{ include "npl-mcp.fullname" . }}
          port:
            name: http
    - path: /vfs
      pathType: Prefix
      backend:
        service:
          name: {{ include "npl-mcp.fullname" . }}
          port:
            name: mcp
    - path: /api/
      pathType: Prefix
      backend:
        service:
          name: {{ include "npl-mcp.fullname" . }}
          port:
            name: mcp
    - path: /
      pathType: Prefix
      backend:
        service:
          name: {{ include "npl-mcp.fullname" . }}
          port:
            name: http
{{- end }}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "npl-mcp.fullname" . }}
  labels:
    {{- include "npl-mcp.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.ingress.cloudflareWhitelist }}
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ include "npl-mcp.cloudflareWhitelist" . }}
    {{- end }}
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.domain }}
        - "*.{{ .Values.domain }}"
      secretName: {{ .Values.tls.secretName }}
    {{- range (.Values.ingress.extraTls | default list) }}
    - hosts:
        {{- range .hosts }}
        - {{ . }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range $host := prepend (default list .Values.ingress.extraHosts) .Values.domain }}
    - host: {{ $host }}
      {{- include "npl-mcp.apexHttp" $ | nindent 6 }}
    {{- end }}
    - host: "*.{{ .Values.domain }}"
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: {{ include "npl-mcp.fullname" . }}
                port:
                  name: mcp
          - path: /.well-known/oauth-protected-resource
            pathType: Prefix
            backend:
              service:
                name: {{ include "npl-mcp.fullname" . }}
                port:
                  name: mcp
          - path: /.well-known/jwks.json
            pathType: Exact
            backend:
              service:
                name: {{ include "npl-mcp.fullname" . }}
                port:
                  name: mcp
          - path: /assets/
            pathType: Prefix
            backend:
              service:
                name: {{ include "npl-mcp.fullname" . }}
                port:
                  name: mcp
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "npl-mcp.fullname" . }}
                port:
                  name: mcp
{{- end }}

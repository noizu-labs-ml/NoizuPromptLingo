replicas: 1
domain: tobor.locker
deployment:
  # The backend and frontend run in the same pod. RollingUpdate briefly starts a
  # second backend, which can exhaust the shared Postgres connection ceiling.
  strategy:
    type: Recreate
npl-mcp:
  image:
    repository: ops.noizu.com/npl-mcp/server
    tag: "v1.0.27"
# Shared pm_core — always-on until microservice split. See docs/pm-core-cutover.md.
pmCore:
  enabled: true
  secretName: pm-core-secrets
  databaseUrlKey: PM_CORE_DATABASE_URL
backend:
  image:
    repository: ops.noizu.com/npl-mcp/server
    tag: "v1.0.27"
    pullPolicy: IfNotPresent
  port: 4040
  # Authentik OIDC redirect flow (SSOController). issuer must NOT have a trailing
  # slash — runtime.exs appends "/.well-known/openid-configuration". client id/
  # secret are sourced from the npl-mcp-secrets AUTHENTIK_* keys.
  oidc:
    issuer: "https://auth.derobot.is/application/o/tobor-locker"
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "6"
      memory: 8Gi
  probes:
    liveness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 15
      failureThreshold: 3
    readiness:
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 10
      failureThreshold: 3
  env:
    secretName: npl-mcp-secrets
# ── Liquibase migration job (Option C) — GATED, default disabled ──────────────
# Applies pending Liquibase changesets as a pre-install/pre-upgrade hook so they
# reach prod on deploys. Previously only Ecto ran (at app boot), so Liquibase
# changesets — e.g. 071 (the mcp_custom_scopes columns) — never applied to prod.
#
# ENABLE ONLY AFTER:
#   1. Build + push the db image, then set liquibase.image.tag below to the tag:
#        docker buildx build --platform linux/amd64 --push \
#          -t ops.noizu.com/npl-mcp/db:<tag> ./backend/db
#   2. Pre-create the `vector` extension on tobor_locker (changeset 073a needs
#      superuser; without it the job fails at 073a and blocks the deploy).
#   3. Confirm mcp_custom_scopes exists (true on any bootstrapped DB — Ecto
#      creates it at app boot).
# Fresh-DB deploys also need Ecto to run BEFORE this hook; follow-up is to add
# mix releases config + an Ecto pre-install job (Ecto currently runs at pod boot,
# after pre-install hooks, so a pre-install Liquibase hook would HALT on 071's
# tableExists precondition against a brand-new DB).
liquibase:
  enabled: false
  image:
    repository: ops.noizu.com/npl-mcp/db
    tag: "v1.0.0"
    pullPolicy: IfNotPresent
  db:
    host: app-timescaledb.apps.svc.cluster.local
    port: 5432
    name: tobor_locker
    user: tobor_locker
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
frontend:
  image:
    repository: ops.noizu.com/npl-mcp/frontend
    tag: "v1.0.29"
    pullPolicy: IfNotPresent
  port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 512Mi
  probes:
    liveness:
      path: /
      initialDelaySeconds: 10
      periodSeconds: 15
      failureThreshold: 3
    readiness:
      path: /
      initialDelaySeconds: 5
      periodSeconds: 10
      failureThreshold: 3
ingress:
  enabled: true
  className: nginx
  cloudflareWhitelist: true
  annotations:
    # Carried over from the retired platform/tobor-locker TF module — larger
    # proxy buffer for auth headers/cookies on tobor.locker.
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
tls:
  enabled: true
  secretName: toborlocker-tls
  infisical:
    enabled: true
    hostAPI: https://infisical.noizu.com/api
    credentialsNamespace: infra
    secretName: universal-auth-credentials
    secretNamespace: infra
    projectSlug: k8-infra
    envSlug: prod
    secretsPath: /apps/tls/toborlocker
    crtKey: TOBORLOCKER_TLS_CRT
    keyKey: TOBORLOCKER_TLS_KEY
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
podDisruptionBudget:
  enabled: false
  minAvailable: 1

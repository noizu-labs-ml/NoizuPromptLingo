services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: starter
      POSTGRES_PASSWORD: starter_ci
      POSTGRES_DB: starter_test
    healthcheck:
      test: pg_isready -U starter
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: redis-cli ping
      interval: 5s
      timeout: 3s
      retries: 5

  migrations:
    build:
      context: ./backend/db
    environment:
      DB_HOST: postgres
      DB_USER: starter
      DB_PASS: starter_ci
      DB_NAME: starter_test
      DB_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    image: ghcr.io/the-robot-lives/start-app/backend:${IMAGE_TAG:-latest}
    environment:
      DB_HOST: postgres
      DB_USER: starter
      DB_PASS: starter_ci
      DB_NAME: starter_test
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY_BASE: ci-secret-key-base-must-be-at-least-64-bytes-long-for-phoenix-framework!!
      GUARDIAN_SECRET_KEY: ci-guardian-secret-key-for-testing-only
      PHX_SERVER: "true"
      PHX_HOST: localhost
      PORT: "4000"
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 5s
      timeout: 3s
      retries: 15

  frontend:
    image: ghcr.io/the-robot-lives/start-app/frontend:${IMAGE_TAG:-latest}
    environment:
      PORT: "3000"
      NEXT_PUBLIC_API_URL: /api
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: ghcr.io/the-robot-lives/start-app/nginx:${IMAGE_TAG:-latest}
    ports:
      - "8080:80"
    depends_on:
      - backend
      - frontend

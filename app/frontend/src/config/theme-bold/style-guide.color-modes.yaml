# Bold Expressive light: bright zinc surfaces, vivid violet/pink accents
# Bold Expressive dark (primary): void zinc surfaces, saturated gradient accents
color-modes:
  light:
    surface: "#FAFAFA"
    surface-alt: "#F4F4F5"
    surface-inverse: "#09090B"
    text: "#09090B"
    text-secondary: "#3F3F46"
    text-muted: "#71717A"
    text-inverse: "#FAFAFA"
    border: "#E4E4E7"
    border-strong: "#D4D4D8"
    shadow-color: "rgba(0,0,0,0.08)"
  dark:
    surface: "#09090B"
    surface-alt: "#111111"
    surface-inverse: "#FAFAFA"
    text: "#FAFAFA"
    text-secondary: "#A1A1AA"

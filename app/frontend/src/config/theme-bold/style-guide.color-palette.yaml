color-palette:
  - group: "Void Foundation"
    description: >
      Zinc dark scale. Pure void with warm-neutral undertones — no blue tint,
      no purple cast. Clean dark surfaces that let vivid gradients dominate.
      Each step earns its role: 09090B is the void, 111111 is the canvas,
      1A1A1A is the card, 27272A is the border.
    colors:
      - name: Void
        value: "#09090B"
        cssClass: gray-900
      - name: Canvas
        value: "#111111"
        cssClass: gray-800
      - name: Card Surface
        value: "#1A1A1A"
        cssClass: gray-700
      - name: Border
        value: "var(--border)"
        cssClass: border
      - name: Border Strong
        value: "var(--border-strong)"
        cssClass: border-strong
      - name: Muted Text
        value: "var(--text-muted)"
        cssClass: text-muted
      - name: Secondary Text
        value: "var(--text-secondary)"
        cssClass: text-secondary
      - name: Primary Text
        value: "var(--text)"
        cssClass: text

  - group: "Gradient Primaries"
    description: >
      Two gradient pairs define the Bold palette. Use as linear-gradient pairs —
      never as flat solids on interactive elements. Primary (Violet→Pink) anchors
      the brand identity. Secondary (Cyan→Blue) supports sub-products and
      secondary CTAs. Each gradient reads as intentional, not decorative.
    colors:
      - name: Electric Violet
        value: "#7C3AED"
        cssClass: violet
      - name: Hot Pink
        value: "#EC4899"
        cssClass: pink
      - name: Plasma Cyan
        value: "#06B6D4"
        cssClass: cyan
      - name: Signal Blue
        value: "#3B82F6"
        cssClass: blue
    notes:
      - label: "Primary Gradient"
        text: "Electric Violet → Hot Pink. linear-gradient(135deg, #7C3AED, #EC4899). Brand identity: CTAs, logo, hero text, gradient rules."
        cssClass: violet
      - label: "Secondary Gradient"
        text: "Plasma Cyan → Signal Blue. linear-gradient(135deg, #06B6D4, #3B82F6). Secondary actions, JustMCP sub-product, info gradients."
        cssClass: cyan
      - label: "Gradient Rule"
        text: "Only use gradient pairs together. Violet alone = valid. Pink alone = valid. Violet+Pink = gradient. Mix-matching across pairs = invalid."
        cssClass: pink

  - group: "Signal Palette"
    description: >
      Full vivid accent palette. More saturated and broader than other MCP Host themes.
      Each color anchors a sub-product or semantic role. Sub-products claim their
      gradient: JustMCP (Cyan), Jumpstart (Emerald), SafeMCP (Amber).
      Remaining accents fill semantic and UI roles.
    colors:
      - name: Violet
        value: "var(--violet)"
        cssClass: violet
      - name: Purple
        value: "var(--purple)"
        cssClass: purple
      - name: Pink
        value: "var(--pink)"
        cssClass: pink
      - name: Fuchsia
        value: "var(--fuchsia)"
        cssClass: fuchsia
      - name: Rose
        value: "var(--rose)"
        cssClass: rose
      - name: Indigo
        value: "var(--indigo)"
        cssClass: indigo
      - name: Cyan
        value: "var(--cyan)"
        cssClass: cyan
      - name: Sky
        value: "var(--sky)"
        cssClass: sky
      - name: Blue
        value: "var(--blue)"
        cssClass: blue
      - name: Teal
        value: "var(--teal)"
        cssClass: teal
      - name: Emerald
        value: "var(--emerald)"
        cssClass: emerald
      - name: Green
        value: "var(--green)"
        cssClass: green
      - name: Amber
        value: "var(--amber)"
        cssClass: amber
      - name: Orange
        value: "var(--orange)"
        cssClass: orange
    notes:
      - label: "Violet / Purple"
        text: "Primary brand gradient anchor and hover step. Most prominent accent."
        cssClass: violet
      - label: "Pink / Fuchsia"
        text: "Primary gradient terminus. Hover glows, gradient ends, emphasis."
        cssClass: pink
      - label: "Cyan"
        text: "JustMCP sub-product anchor. Secondary gradient start."
        cssClass: cyan
      - label: "Emerald"
        text: "MCP Jumpstart sub-product accent. Success states."
        cssClass: emerald
      - label: "Amber"
        text: "SafeMCP sub-product accent. Warning states."
        cssClass: amber

  - group: Semantic
    description: "Functional state colors. Vivid but disciplined — they signal, not decorate."
    colors:
      - name: Success
        value: "var(--success)"
        cssClass: success
      - name: Success Tint
        value: "var(--success-tint)"
        cssClass: success-tint
      - name: Warning
        value: "var(--warning)"
        cssClass: warning
      - name: Warning Tint
        value: "var(--warning-tint)"
        cssClass: warning-tint
      - name: Error
        value: "var(--error)"
        cssClass: error
      - name: Error Tint
        value: "var(--error-tint)"
        cssClass: error-tint
      - name: Info
        value: "var(--info)"
        cssClass: info
      - name: Info Tint
        value: "var(--info-tint)"
        cssClass: info-tint

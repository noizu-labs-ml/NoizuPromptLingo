# ═══════════════════════════════════════════════════════════════
# CSS SNIPPETS — style-guide.css-snippets.yaml
# ═══════════════════════════════════════════════════════════════
#
# Defines raw CSS rules injected into the generated stylesheet,
# organized by target section. This is where component-level
# styling lives.
#
# HOW IT WORKS:
#   - Each entry has a `target-section` matching a section `id` in
#     style-guide.page-sections.yaml
#   - `body` is a literal CSS string emitted inside the generated
#     stylesheet, scoped via html[data-design-theme="derobot"]
#   - The engine collects all snippets per target-section and emits
#     them in order
#
# HOW TO MODIFY:
#   - Add a snippet: append a `- name:` entry with slug, title,
#     description, target-section, and body (literal CSS)
#   - All selectors MUST be scoped to the theme:
#     html[data-design-theme="derobot"] .your-class { ... }
#   - target-section must match an `id` in page-sections.yaml
#   - Run `npm run regen` after changes
#
# CURRENT TARGET SECTIONS:
#   intro, sections, branding, cards, spacing, code-widgets,
#   hui, dividers, typography, ink-effects, screens, ui-elements
#
# RELATED: style-guide.page-sections.yaml (section IDs)
#          style-guide.scoped-vars.yaml (token-level overrides)
#          style-guide.vars.yaml (design tokens referenced in body CSS)
# ═══════════════════════════════════════════════════════════════

css-snippets:
  - name: Nocturne Intro Hero
    slug: nocturne-intro-hero
    title: "Nocturne intro hero — dark, centered, signal-forward"
    description: "Dark hero section with min-height 80vh. Display font title, cyan subtitle, muted quote, mono meta, and a 2px signal bar."
    target-section: intro
    body: |
      html[data-design-theme="derobot"] .sg-intro-hero {
        min-height: 80vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 64px 32px 0;
        margin-bottom: 48px;
        background: var(--black);
        color: var(--white);
      }
      html[data-design-theme="derobot"] .sg-intro-title {
        font-family: var(--font-display);
        font-size: clamp(40px, 6vw, 64px);
        font-weight: 800;
        color: var(--white);
        line-height: 1;
        letter-spacing: -0.03em;
      }
      html[data-design-theme="derobot"] .sg-intro-subtitle {
        font-family: var(--font-display);
        font-size: clamp(20px, 3vw, 28px);
        font-weight: 600;
        color: #22D3EE;
        margin-top: 16px;
      }
      html[data-design-theme="derobot"] .sg-intro-quote {
        font-family: var(--font-body);
        font-size: 16px;
        font-weight: 400;
        color: var(--gray-100);
        max-width: 560px;
        margin: 24px auto 48px;
        line-height: 1.6;
      }
      html[data-design-theme="derobot"] .sg-intro-meta {
        font-family: var(--font-mono);
        font-size: 12px;
        font-weight: 400;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--gray-200);
        display: flex;
        gap: 24px;
        justify-content: center;
        margin-top: 32px;
      }
      html[data-design-theme="derobot"] .sg-intro-color-bar {
        height: 2px;
        width: 100%;
        background: #22D3EE;
        margin-top: 40px;
      }

  - name: Portfolio Card
    slug: portfolio-card
    title: "Portfolio card — project entry in the venture grid"
    description: "Gray-700 card with cyan hover border and translateY lift. Sub-elements for category, name, domain, description, and link."
    target-section: ui-elements
    body: |
      html[data-design-theme="derobot"] .portfolio-card {
        background: var(--gray-700);
        border: 1px solid var(--gray-500);
        border-radius: 8px;
        padding: var(--space-5);
        transition: border-color 200ms ease-out, transform 200ms ease-out;
      }
      html[data-design-theme="derobot"] .portfolio-card:hover {
        border-color: rgba(34,211,238,0.2);
        transform: translateY(-2px);
      }
      html[data-design-theme="derobot"] .portfolio-card__category {
        font-family: var(--font-mono);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--gray-200);
        margin-bottom: 8px;
      }
      html[data-design-theme="derobot"] .portfolio-card__name {
        font-family: var(--font-display);
        font-size: 20px;
        font-weight: 600;
        color: var(--white);
        margin-bottom: 4px;
      }
      html[data-design-theme="derobot"] .portfolio-card__domain {
        font-family: var(--font-mono);
        font-size: 14px;
        color: #22D3EE;
        margin-bottom: 12px;
      }
      html[data-design-theme="derobot"] .portfolio-card__desc {
        font-family: var(--font-body);
        font-size: 14px;
        color: var(--gray-100);
        line-height: 1.6;
        margin-bottom: 16px;
      }
      html[data-design-theme="derobot"] .portfolio-card__link {
        font-size: 14px;
        color: #22D3EE;
        text-decoration: none;
      }
      html[data-design-theme="derobot"] .portfolio-card__link::before {
        content: "→ ";
      }

  - name: Category Header
    slug: category-header
    title: "Category header — mono label with extending rule"
    description: "Mono 12px uppercase label in gray-200. A ::after pseudo-element extends a 1px gray-500 line to fill remaining width."
    target-section: ui-elements
    body: |
      html[data-design-theme="derobot"] .category-header {
        font-family: var(--font-mono);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--gray-200);
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: var(--space-5);
      }
      html[data-design-theme="derobot"] .category-header::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--gray-500);
      }

  - name: Process Step
    slug: process-step
    title: "Process step — scroll-reveal card"
    description: "Gray-700 card initially invisible and offset. Adds .visible class to transition to full opacity and position at 400ms."
    target-section: ui-elements
    body: |
      html[data-design-theme="derobot"] .process-step {
        background: var(--gray-700);
        border: 1px solid var(--gray-500);
        border-radius: 8px;
        padding: var(--space-5);
        opacity: 0;
        transform: translateY(16px);
        transition: opacity 400ms ease-out, transform 400ms ease-out;
      }
      html[data-design-theme="derobot"] .process-step.visible {
        opacity: 1;
        transform: translateY(0);
      }

  - name: Button Primary
    slug: btn-primary
    title: "Button primary — cyan CTA"
    description: "Cyan background, black text, 6px radius. Hover brightens and scales up slightly."
    target-section: ui-elements
    body: |
      html[data-design-theme="derobot"] .btn-primary {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #22D3EE;
        color: var(--black);
        font-size: 16px;
        font-weight: 500;
        padding: 12px 24px;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        text-decoration: none;
        transition: filter 200ms ease-out, transform 200ms ease-out;
      }
      html[data-design-theme="derobot"] .btn-primary:hover {
        filter: brightness(1.1);
        transform: scale(1.02);
      }

  - name: Button Ghost
    slug: btn-ghost
    title: "Button ghost — secondary outlined action"
    description: "Transparent background, cyan text, gray-500 border. Hover fills with low-opacity cyan tint and promotes border to cyan."
    target-section: ui-elements
    body: |
      html[data-design-theme="derobot"] .btn-ghost {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: transparent;
        color: #22D3EE;
        font-size: 16px;
        font-weight: 500;
        padding: 12px 24px;
        border-radius: 6px;
        border: 1px solid var(--gray-500);
        cursor: pointer;
        text-decoration: none;
        transition: background 200ms ease-out, border-color 200ms ease-out;
      }
      html[data-design-theme="derobot"] .btn-ghost:hover {
        background: rgba(34,211,238,0.08);
        border-color: #22D3EE;
      }

  - name: Contact Input
    slug: contact-input
    title: "Contact input — dark form field"
    description: "Gray-700 background, gray-500 border, 6px radius. Placeholder in gray-200. Focus state promotes border to cyan with no shadow."
    target-section: ui-elements
    body: |
      html[data-design-theme="derobot"] .contact-input {
        width: 100%;
        background: var(--gray-700);
        border: 1px solid var(--gray-500);
        border-radius: 6px;
        padding: 12px 16px;
        font-size: 16px;
        color: var(--white);
        outline: none;
        transition: border-color 200ms ease-out;
      }
      html[data-design-theme="derobot"] .contact-input::placeholder {
        color: var(--gray-200);
      }
      html[data-design-theme="derobot"] .contact-input:focus {
        border-color: #22D3EE;
        box-shadow: none;
      }

  - name: Reduced Motion
    slug: reduced-motion
    title: "Reduced motion — accessibility overrides"
    description: "Disables transforms on portfolio-card hover, process-step reveal, and btn-primary hover for users who prefer reduced motion."
    target-section: ui-elements
    body: |
      @media (prefers-reduced-motion: reduce) {
        html[data-design-theme="derobot"] .portfolio-card:hover {
          transform: none;
        }
        html[data-design-theme="derobot"] .process-step {
          opacity: 1;
          transform: none;
          transition: none;
        }
        html[data-design-theme="derobot"] .process-step.visible {
          transform: none;
        }
        html[data-design-theme="derobot"] .btn-primary:hover {
          transform: none;
        }
      }

# ═══════════════════════════════════════════════════════════════
# PAGE SECTIONS — style-guide.page-sections.yaml
# ═══════════════════════════════════════════════════════════════
#
# Defines the navigation structure of the styleguide viewer —
# which sections appear, in what order, grouped under what headings.
#
# HOW IT WORKS:
#   - Each `- group:` is a collapsible category in the viewer sidebar
#   - `sections[]` within each group define individual panels
#   - `id` must match a target-section value in css-snippets.yaml
#     or a built-in viewer section (typography, color, design-tokens, etc.)
#   - `title` and `desc` are displayed in the viewer navigation
#
# HOW TO MODIFY:
#   - Reorder sections: move entries within their group
#   - Add a section: append a `- id:` entry (must match a css-snippet
#     target-section or built-in section ID)
#   - Add a group: append a new `- group:` entry
#   - Removing a section here hides it from the viewer but does not
#     delete its CSS — clean up css-snippets.yaml separately
#
# RELATED: style-guide.css-snippets.yaml (target-section must match id)
#          style-guide.design-sections.yaml (detailed component docs)
# ═══════════════════════════════════════════════════════════════

page-sections:
  - group: Visual Foundation
    desc: "The Nocturne palette — type, color, space, and the tokens everything is built from."
    sections:
      - id: typography
        title: Typography
        desc: "Three typefaces. Syne for display, Geist for body, JetBrains Mono for data."
      - id: color
        title: Color Palette
        desc: "Zinc scale, cyan accent, violet secondary. Dark surfaces, light text."
      - id: spacing
        title: "Spacing, Gutters & Whitespace"
        desc: "8px base unit. 24px card grid gap. 96px between sections. Generous whitespace."
      - id: dividers
        title: "Dividers & Rules"
        desc: "1px rules on gray-500. Subtle separation — the page breathes."
      - id: glyphs
        title: Glyph Language
        desc: "Unicode only — no icon library. Arrows, dots, and dashes."
      - id: code-blocks
        title: Code Blocks
        desc: "JetBrains Mono at 14px on dark surfaces."
      - id: terminal
        title: Terminal
        desc: "Monospaced output on near-black ground."

  - group: Structure
    desc: "How layout disciplines page assembly — shells, archetypes, and navigation."
    sections:
      - id: shell-layouts
        title: Shell Layouts
        desc: "Navbar-only and full-bleed. Minimal chrome for a landing page."
      - id: content-layouts
        title: Content Layouts
        desc: "1280px standard, 640px narrow, 720px article, full viewport."
      - id: site-archetypes
        title: Site Archetypes
        desc: "Landing page, portfolio grid, product detail, methodology, contact."
      - id: navigation
        title: Navigation
        desc: "Top bar: Portfolio, Process, About, Contact. Footer: meta links."

  - group: Interaction
    desc: "Semantic states and components — portfolio cards, pipeline steps, buttons, forms."
    sections:
      - id: semantic-classes
        title: Semantic Classes
        desc: "Pipeline states — danger, warning, success, info. Brand accents — cyan primary, violet secondary."
      - id: status-indicators
        title: Status Indicators
        desc: "Product stage badges — Concept, Validation, Building, Live."
      - id: ui-elements
        title: UI Elements
        desc: "Portfolio cards, buttons (primary cyan + ghost), contact form inputs. 1px border, 6-8px radius."
      - id: screens
        title: Screens
        desc: "Full-page compositions — landing, portfolio, product detail, process, contact."

  - group: Reference
    desc: "Source of truth — tokens, generated CSS, YAML config, and live snippets."
    sections:
      - id: design-tokens
        title: Design Tokens
        desc: "CSS custom properties. Zinc scale + cyan/violet accents + semantic states."
      - id: generated-css
        title: Generated CSS
        desc: "Output CSS by section — vars, cards, buttons, semantic, utilities."
      - id: theme-config
        title: Theme Config
        desc: "YAML source for this theme."
      - id: snippets
        title: Snippets & Demos
        desc: "CSS and JSX snippets — live previews of portfolio cards, buttons, process steps."
      - id: overrides
        title: Overrides
        desc: "Select which variant to use per section."

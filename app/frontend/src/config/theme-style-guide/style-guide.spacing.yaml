# ═══════════════════════════════════════════════════════════════
# SPACING CONTEXTS — style-guide.spacing.yaml
# ═══════════════════════════════════════════════════════════════
#
# Defines grid configuration, page container constraints, and
# section spacing roles for the spacing showcase section.
#
# HOW IT WORKS:
#   - `grid` defines the column system (columns, gutter, margin tokens)
#   - `page-container` sets the standard content max-width and padding
#   - `section-spacing` assigns semantic roles to spacing tokens
#   - The SpacingShowcase component renders all three as visual diagrams
#
# HOW TO MODIFY:
#   - Change grid columns or tokens to match your layout system
#   - Adjust page-container to match your content width presets
#   - Add/remove section-spacing roles as needed
#   - Token names must reference vars defined in style-guide.vars.yaml
#   - Run `npm run regen` after changes
#
# RELATED: style-guide.vars.yaml (spacing token definitions)
#          style-guide.page-layouts.yaml (content width presets)
#          style-guide.scoped-vars.yaml (layout CSS output)
# ═══════════════════════════════════════════════════════════════

spacing-contexts:
  grid:
    columns: 12
    gutter-token: col-gap
    margin-token: space-5

  page-container:
    max-width: "1280px"
    padding-x-token: space-5
    padding-y-token: space-8

  section-spacing:
    - role: "Major section gap"
      token: space-10
      description: "120px between major sections — let the dark canvas breathe"
    - role: "Subsection gap"
      token: space-8
      description: "80px subsection separation"
    - role: "Component gap"
      token: space-4
      description: "32px card grid gap"
    - role: "Content gap"
      token: space-3
      description: "24px between related content blocks"
    - role: "Element gap"
      token: space-2
      description: "16px inline element spacing"

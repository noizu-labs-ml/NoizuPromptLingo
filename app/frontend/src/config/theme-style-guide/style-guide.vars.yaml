# ═══════════════════════════════════════════════════════════════
# THEME DESIGN TOKENS — style-guide.vars.yaml
# ═══════════════════════════════════════════════════════════════
#
# This file defines all CSS custom properties (design tokens) for the theme.
# It is the primary configuration surface for the design system.
#
# HOW IT WORKS:
#   - Each group below becomes a set of --{name} CSS custom properties
#   - The engine's cascade (defaults.ts) auto-generates extended scales
#     from seed values (e.g. `unit: 8px` → full spacing scale)
#   - Values here override any engine defaults
#   - Generated output: frontend/src/app/design-system.generated.css
#
# HOW TO MODIFY:
#   - Change a value below and run `npm run regen` (or `make regen`)
#   - Add new vars to an existing group, or add a new `- name:` group
#   - The engine resolves var() references, so you can compose tokens
#   - To add component styles, edit style-guide.css-snippets.yaml
#
# RELATED FILES (all in this directory):
#   style-guide.meta.yaml          — theme name/slug/description
#   style-guide.typography.yaml    — font families and type classes
#   style-guide.color-palette.yaml — color definitions for the viewer
#   style-guide.scoped-vars.yaml   — dark mode, surfaces, layout containers
#   style-guide.css-snippets.yaml  — component CSS (intro, cards, spacing, etc.)
#   style-guide.page-sections.yaml — styleguide viewer section definitions
#   style-guide.globals.yaml       — global CSS resets
#   branding.yaml                  — logo, tone, audience, brand identity
#
# SEED VALUES (engine auto-expands these):
#   unit         → spacing scale (space-1 through space-160)
#   radius       → border-radius variants
#   font-sans    → type scale, component fonts
#   white, black → gray ramp (gray-50 through gray-900)
#   red, blue, yellow → light/mid color variants
# ═══════════════════════════════════════════════════════════════

vars:
  groups:
    # ── Neutrals ──
    # Inverted zinc scale for dark-first. white/black are the reading extremes.
    - name: Neutrals
      vars:
        white: "#FAFAFA"
        off-white: "#E4E4E7"
        gray-50: "#F4F4F5"
        gray-100: "#E4E4E7"
        gray-200: "#D4D4D8"
        gray-300: "#A1A1AA"
        gray-400: "#71717A"
        gray-500: "#52525B"
        gray-600: "#3F3F46"
        gray-700: "#27272A"
        gray-800: "#18181B"
        gray-900: "#09090B"
        black: "#09090B"

    # ── Accent Primaries ──
    # red = cyan (#22D3EE) — the robot signal.
    # blue = violet (#A78BFA) — secondary accent.
    # yellow = amber (#FBBF24) — warm highlight.
    - name: "Accent Primaries"
      vars:
        red: "#22D3EE"
        red-light: "rgba(34,211,238,0.08)"
        red-mid: "rgba(34,211,238,0.20)"
        blue: "#A78BFA"
        blue-light: "rgba(167,139,250,0.08)"
        blue-mid: "rgba(167,139,250,0.20)"
        yellow: "#FBBF24"
        yellow-light: "rgba(251,191,36,0.08)"
        yellow-mid: "rgba(251,191,36,0.20)"
        brand-red: "#22D3EE"
        brand-red-light: "rgba(34,211,238,0.08)"
        brand-red-mid: "rgba(34,211,238,0.20)"
        brand-blue: "#A78BFA"
        brand-blue-light: "rgba(167,139,250,0.08)"
        brand-blue-mid: "rgba(167,139,250,0.20)"
        brand-yellow: "#FBBF24"
        brand-yellow-light: "rgba(251,191,36,0.08)"
        brand-yellow-mid: "rgba(251,191,36,0.20)"

    # ── Named Colors ──
    # Use these for styling. Semantic names (success/warning/error/info)
    # point here — don't use semantic names for non-semantic styling.
    - name: "Named Colors"
      vars:
        emerald: "#34D399"
        emerald-tint: "rgba(52,211,153,0.10)"
        amber: "#FBBF24"
        amber-tint: "rgba(251,191,36,0.10)"
        rose: "#F87171"
        rose-tint: "rgba(248,113,113,0.10)"
        sky: "#60A5FA"
        sky-tint: "rgba(96,165,250,0.10)"

    # ── Extended Palette ──
    # Rich shade ramps for each accent color at varying opacity/lightness levels.
    # Use for decorative animations, layered text effects, and visual depth.
    - name: "Extended Palette"
      vars:
        cyan-100: "rgba(34,211,238,0.1)"
        cyan-200: "rgba(34,211,238,0.2)"
        cyan-300: "rgba(34,211,238,0.35)"
        cyan-400: "rgba(34,211,238,0.5)"
        cyan-500: "#22D3EE"
        cyan-600: "#0891B2"
        cyan-700: "#0E7490"
        cyan-800: "#155E75"
        violet-100: "rgba(167,139,250,0.1)"
        violet-200: "rgba(167,139,250,0.2)"
        violet-300: "rgba(167,139,250,0.35)"
        violet-400: "rgba(167,139,250,0.5)"
        violet-500: "#A78BFA"
        violet-600: "#7C3AED"
        violet-700: "#6D28D9"
        violet-800: "#5B21B6"
        amber-100: "rgba(251,191,36,0.1)"
        amber-200: "rgba(251,191,36,0.2)"
        amber-300: "rgba(251,191,36,0.35)"
        amber-400: "rgba(251,191,36,0.5)"
        amber-500: "#FBBF24"
        amber-600: "#D97706"
        amber-700: "#B45309"
        amber-800: "#92400E"
        emerald-100: "rgba(52,211,153,0.1)"
        emerald-200: "rgba(52,211,153,0.2)"
        emerald-300: "rgba(52,211,153,0.35)"
        emerald-400: "rgba(52,211,153,0.5)"
        emerald-500: "#34D399"
        emerald-600: "#059669"
        emerald-700: "#047857"
        emerald-800: "#065F46"
        rose-100: "rgba(248,113,113,0.1)"
        rose-200: "rgba(248,113,113,0.2)"
        rose-300: "rgba(248,113,113,0.35)"
        rose-400: "rgba(248,113,113,0.5)"
        rose-500: "#F87171"
        rose-600: "#DC2626"
        rose-700: "#B91C1C"
        rose-800: "#991B1B"
        sky-100: "rgba(96,165,250,0.1)"
        sky-200: "rgba(96,165,250,0.2)"
        sky-300: "rgba(96,165,250,0.35)"
        sky-400: "rgba(96,165,250,0.5)"
        sky-500: "#60A5FA"
        sky-600: "#2563EB"
        sky-700: "#1D4ED8"
        sky-800: "#1E40AF"
        zinc-100: "rgba(250,250,250,0.1)"
        zinc-200: "rgba(250,250,250,0.2)"
        zinc-300: "rgba(250,250,250,0.35)"
        zinc-400: "rgba(250,250,250,0.5)"
        zinc-500: "#FAFAFA"
        zinc-600: "#A1A1AA"
        zinc-700: "#71717A"
        zinc-800: "#3F3F46"

    # ── Semantic (pointers to named colors) ──
    # For state indicators only. Use named colors above for styling.
    - name: Semantic
      vars:
        success: "var(--emerald)"
        success-tint: "var(--emerald-tint)"
        warning: "var(--amber)"
        warning-tint: "var(--amber-tint)"
        error: "var(--rose)"
        error-tint: "var(--rose-tint)"
        info: "var(--sky)"
        info-tint: "var(--sky-tint)"

    - name: Typography
      vars:
        font-sans: "'Syne', 'Geist', 'Inter', system-ui, sans-serif"
        font-mono: "'JetBrains Mono', 'Fira Code', monospace"
        font-display: "'Syne', system-ui, sans-serif"
        font-body: "'Geist', 'Inter', system-ui, sans-serif"
        font-decorative: "'Syne', system-ui, sans-serif"
        size-xs: "12px"
        size-sm: "14px"
        size-md: "16px"
        size-lg: "20px"
        size-xl: "28px"
        font-size-2xs: "10px"
        font-size-xs: "var(--size-xs)"
        font-size-sm: "var(--size-sm)"
        font-size-md: "var(--size-md)"
        font-size-lg: "var(--size-lg)"
        font-size-xl: "var(--size-xl)"
        font-size-2xl: "36px"
        font-size-3xl: "48px"
        font-size-display: "64px"
        font-size-base: "var(--size-md)"

    # ── Palette ──
    # Full Tailwind-slot palette mapped to derobot color roles.
    - name: Palette
      vars:
        rose: "#22D3EE"
        rose-light: "rgba(34,211,238,0.08)"
        orange: "#FBBF24"
        orange-light: "rgba(251,191,36,0.08)"
        amber: "#FBBF24"
        amber-light: "rgba(251,191,36,0.08)"
        lime: "#34D399"
        lime-light: "rgba(52,211,153,0.08)"
        emerald: "#34D399"
        emerald-light: "rgba(52,211,153,0.08)"
        teal: "#22D3EE"
        teal-light: "rgba(34,211,238,0.08)"
        cyan: "#22D3EE"
        cyan-light: "rgba(34,211,238,0.08)"
        sky: "#60A5FA"
        sky-light: "rgba(96,165,250,0.08)"
        indigo: "#A78BFA"
        indigo-light: "rgba(167,139,250,0.08)"
        violet: "#A78BFA"
        violet-light: "rgba(167,139,250,0.08)"
        purple: "#A78BFA"
        purple-light: "rgba(167,139,250,0.08)"
        fuchsia: "#A78BFA"
        fuchsia-light: "rgba(167,139,250,0.08)"
        pink: "#A78BFA"
        pink-light: "rgba(167,139,250,0.08)"

    # ── Spacing ──
    # The engine auto-generates the full scale from `unit`.
    # Values below are explicit overrides — add or change any token.
    # Unlisted multipliers (space-7, space-9, etc.) are computed as unit × N.
    - name: Spacing
      vars:
        unit: "8px"
        space-half: "4px"
        space-1: "8px"
        space-2: "16px"
        space-3: "24px"
        space-4: "32px"
        space-5: "40px"
        space-6: "56px"
        space-8: "80px"
        space-10: "120px"
        col-gap: "32px"

    - name: Radius
      vars:
        radius: "6px"
        radius-sm: "4px"
        radius-md: "6px"
        radius-lg: "8px"

    - name: Base
      vars:
        base-font-size: "16px"
        base-line-height: "1.6"
        base-font-family: "var(--font-body)"
        base-font-color: "var(--text)"
        base-background: "var(--surface)"
        bg: "var(--surface)"

    - name: Branding
      vars:
        branding-logo-font-size: "32px"
        branding-logo-font-weight: "800"
        branding-logo-letter-spacing: "-0.03em"
        branding-logo-text-transform: "none"
        branding-logo-bg: "var(--surface)"
        branding-border: "1px solid var(--border)"

    - name: Cards
      vars:
        card-accent-side: "left"
        card-background: "var(--surface-alt)"
        card-border-color: "var(--border)"
        card-header-background: "var(--border-strong)"
        card-footer-background: "var(--border-strong)"
        card-footer-font-size: "12px"
        card-grid-gap: "var(--space-4)"
        card-padding: "var(--space-4)"
        card-min-width: "280px"

    - name: Buttons
      vars:
        btn-font-family: "var(--font-body)"
        btn-font-weight: "500"
        btn-font-size: "16px"
        btn-letter-spacing: "0"
        btn-background: "var(--text-link)"
        btn-color: "var(--surface)"
        btn-border-color: "transparent"
        btn-hover-background: "#2de5fc"
        btn-hover-border-color: "transparent"
        btn-outline-background: "transparent"
        btn-outline-color: "var(--text-link)"
        btn-outline-hover-background: "var(--surface-accent)"

    - name: Toggle
      vars:
        sg-section-title-font-family: "var(--font-display)"
        sg-section-title-text-transform: "uppercase"
        sg-section-title-letter-spacing: "0.04em"
        sg-section-title-color: "var(--text)"
        sg-section-number-bg: "var(--text-link)"
        sg-section-number-border: "none"
        sg-section-number-color: "var(--surface)"
        sg-section-number-radius: "4px"
        sg-section-desc-font-family: "var(--font-mono)"
        sg-section-desc-color: "var(--text-muted)"
        sg-type-specimen-bg: "var(--surface-alt)"
        sg-type-specimen-border: "1px solid var(--border)"
        sg-type-specimen-border-bottom: "2px solid var(--text-link)"
        sg-type-specimen-radius: "6px"
        sg-type-specimen-padding: "var(--space-3)"
        sg-type-specimen-margin: "0 0 var(--space-3) 0"
        sg-type-specimen-name-color: "var(--text)"
        sg-type-specimen-name-font: "var(--font-display)"
        hr-section-height: "1px"
        hr-section-color: "var(--border)"
        hr-subsection-color: "var(--border)"
        hr-subsection-height: "1px"
        hr-accent-color: "var(--text-link)"

    - name: "HUI: Focus & Interaction"
      vars:
        hui-focus-ring-color: "var(--focus-ring)"
        hui-focus-ring-width: "2px"

    - name: "HUI: Controls"
      vars:
        hui-control-color: "var(--text)"
        hui-control-bg: "var(--surface-alt)"
        hui-control-border: "var(--border)"
        hui-control-shadow: "none"
        hui-switch-track-on-bg: "var(--text-link)"
        hui-switch-track-off-bg: "var(--border-strong)"
        hui-switch-thumb-shadow: "none"
        hui-radio-option-border: "var(--border)"
        hui-radio-option-border-active: "var(--text-link)"
        hui-radio-option-bg-active: "var(--surface-accent)"

    - name: "HUI: Trigger Buttons"
      vars:
        hui-trigger-bg: "var(--surface-alt)"
        hui-trigger-border: "var(--border)"
        hui-trigger-border-hover: "var(--text-link)"
        hui-trigger-color: "var(--text)"

    - name: "HUI: Overlay Panels"
      vars:
        hui-panel-bg: "var(--surface)"
        hui-panel-border: "var(--border)"
        hui-panel-shadow: "0 8px 32px var(--shadow-color)"
        hui-panel-item-active-bg: "var(--surface-accent)"
        hui-panel-item-active-color: "var(--text-link)"
        hui-panel-sep-color: "var(--border)"

    - name: "HUI: Tabs"
      vars:
        hui-tab-color: "var(--text-muted)"
        hui-tab-color-selected: "var(--text)"
        hui-tab-border-selected: "var(--text-link)"
        hui-tab-color-hover: "var(--text-secondary)"
        hui-tab-list-border: "var(--border)"

    - name: "HUI: Disclosure"
      vars:
        hui-disclosure-bg: "var(--surface-alt)"
        hui-disclosure-bg-hover: "var(--border-strong)"
        hui-disclosure-border: "var(--border)"
        hui-disclosure-color: "var(--text)"
        hui-disclosure-panel-bg: "var(--surface)"
        hui-disclosure-panel-color: "var(--text-secondary)"
        hui-disclosure-chevron-color: "var(--text-muted)"

    - name: "HUI: Field Controls"
      vars:
        hui-field-bg: "var(--surface-alt)"
        hui-field-border: "var(--border)"
        hui-field-border-hover: "var(--border-strong)"
        hui-field-focus-border: "var(--text-link)"
        hui-field-color: "var(--text)"
        hui-field-shadow: "none"
        hui-combo-placeholder-color: "var(--text-muted)"
        hui-combo-btn-color: "var(--text-muted)"

    - name: "HUI: Dialog"
      vars:
        hui-dialog-bg: "var(--surface)"
        hui-dialog-shadow: "0 8px 32px var(--shadow-color)"
        hui-dialog-title-color: "var(--text)"
        hui-dialog-body-color: "var(--text-secondary)"
        hui-dialog-backdrop: "rgba(0,0,0,0.5)"

    - name: "HUI: Showcase Grid"
      vars:
        hui-showcase-accent: "var(--text-link)"
        hui-showcase-bg: "var(--surface)"
        hui-showcase-border: "var(--border)"
        hui-showcase-cell-bg: "var(--surface-alt)"
        hui-showcase-cell-border: "var(--border)"
        hui-showcase-label-color: "var(--text-muted)"

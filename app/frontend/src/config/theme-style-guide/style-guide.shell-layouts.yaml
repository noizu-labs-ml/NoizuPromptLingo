# ═══════════════════════════════════════════════════════════════
# SHELL LAYOUTS — style-guide.shell-layouts.yaml
# ═══════════════════════════════════════════════════════════════
#
# Defines full-page application shells for the styleguide viewer's
# Shell Layouts section. Each shell is a chrome arrangement (navbar,
# sidebar, footer) with content zones.
#
# HOW IT WORKS:
#   - Each entry renders as a wireframe diagram in the viewer
#   - `chrome` defines fixed UI elements (navbar, sidebar, aside, footer)
#     with height/width, background, color, and label
#   - `zones[]` define the flexible content areas between chrome,
#     with label, colors, and a ratio for proportional sizing
#
# HOW TO MODIFY:
#   - Add a shell: append a `- name:` entry with title, description,
#     chrome, and zones
#   - Change chrome: edit height/width/background under the relevant
#     chrome element
#   - These are viewer-only definitions — they don't generate CSS
#     (component CSS lives in css-snippets.yaml)
#
# RELATED: style-guide.page-layouts.yaml (content width presets)
#          style-guide.design-sections.yaml (component design specs)
# ═══════════════════════════════════════════════════════════════

shell-layouts:
  - name: navbar-only
    title: Navbar Only
    description: "Top navigation bar with footer. Clean horizontal chrome — content fills the full viewport below."
    chrome:
      navbar:
        height: "56px"
        background: "var(--black)"
        color: "var(--white)"
        label: "Nav"
      footer:
        height: "48px"
        background: "var(--black)"
        color: "var(--gray-200)"
        label: "Footer"
    zones:
      - label: "Content"
        background: "var(--black)"
        color: "var(--white)"
        ratio: 1

  - name: full-bleed
    title: Full Bleed
    description: "Edge-to-edge Nocturne layout. Navbar only — no footer. Three zones: hero, portfolio grid, contact."
    chrome:
      navbar:
        height: "56px"
        background: "var(--black)"
        color: "var(--white)"
        label: "Nav"
    zones:
      - label: "Hero"
        background: "var(--black)"
        color: "var(--white)"
        ratio: 2
      - label: "Portfolio Grid"
        background: "var(--black)"
        color: "var(--white)"
        ratio: 3
      - label: "Contact"
        background: "var(--gray-700)"
        color: "var(--white)"
        ratio: 1

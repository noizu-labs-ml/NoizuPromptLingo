# ═══════════════════════════════════════════════════════════════
# PAGE LAYOUTS — style-guide.page-layouts.yaml
# ═══════════════════════════════════════════════════════════════
#
# Defines content width presets for the styleguide viewer's
# Content Layouts section. Each layout is a named .content variant.
#
# HOW IT WORKS:
#   - Each entry renders as a visual layout diagram in the viewer
#   - `selector` maps to the CSS class (.content, .content.wide, etc.)
#   - `vars` define max-width, padding, margin, and backgrounds
#   - `chrome` defines the surrounding page shell (navbar, footer,
#     sidebar) shown in the diagram
#
# HOW TO MODIFY:
#   - Change widths/padding: edit the `vars` under each layout
#   - Add a layout: append a `- name:` entry with selector, vars, chrome
#   - Actual CSS for these is generated by scoped-vars.yaml — this file
#     provides the viewer visualization data
#   - Run `npm run regen` after changes
#
# RELATED: style-guide.scoped-vars.yaml (actual CSS layout rules)
#          style-guide.shell-layouts.yaml (full-page shell patterns)
# ═══════════════════════════════════════════════════════════════

page-layouts:
  - name: standard
    title: Standard
    description: "Centered content column at 1280px. The Nocturne grid's default reading width."
    selector: ".content"
    vars:
      max-width: "1280px"
      padding: "var(--space-5)"
      margin: "0 auto"
      body-bg: "var(--black)"
      content-bg: "transparent"
    chrome:
      navbar:
        height: "56px"
        background: "var(--black)"
        color: "var(--white)"
        label: "Nav"
      footer:
        height: "48px"
        background: "var(--black)"
        color: "var(--gray-200)"
        label: "Footer"

  - name: wide
    title: Wide
    description: "1280px max-width for content-dense interfaces. Portfolio grids, dashboards."
    selector: ".content.wide"
    vars:
      max-width: "1280px"
      padding: "var(--space-5)"
      margin: "0 auto"
      body-bg: "var(--black)"
      content-bg: "transparent"
    chrome:
      navbar:
        height: "56px"
        background: "var(--black)"
        color: "var(--white)"
        label: "Nav"
      footer:
        height: "48px"
        background: "var(--black)"
        color: "var(--gray-200)"
        label: "Footer"

  - name: narrow
    title: Narrow
    description: "640px constrained column. Single-task flows — forms, onboarding, focused content."
    selector: ".content.narrow"
    vars:
      max-width: "640px"
      padding: "var(--space-5)"
      margin: "0 auto"
      body-bg: "var(--black)"
      content-bg: "transparent"
    chrome:
      navbar:
        height: "56px"
        background: "var(--black)"
        color: "var(--white)"
        label: "Nav"
      footer:
        height: "48px"
        background: "var(--black)"
        color: "var(--gray-200)"
        label: "Footer"

  - name: full
    title: Full
    description: "100% viewport width. No max-width constraint. Edge-to-edge hero and landing sections."
    selector: ".content.full"
    vars:
      max-width: "100%"
      padding: "var(--space-4)"
      margin: "0"
      body-bg: "var(--black)"
      content-bg: "var(--black)"
    chrome:
      navbar:
        height: "56px"
        background: "var(--black)"
        color: "var(--white)"
        label: "Nav"

  - name: article
    title: Article
    description: "720px reading column. Optimized line length for long-form content."
    selector: ".content.article"
    vars:
      max-width: "720px"
      padding: "var(--space-5)"
      margin: "0 auto"
      body-bg: "var(--black)"
      content-bg: "transparent"
    chrome:
      navbar:
        height: "56px"
        background: "var(--black)"
        color: "var(--white)"
        label: "Nav"
      footer:
        height: "48px"
        background: "var(--black)"
        color: "var(--gray-200)"
        label: "Footer"

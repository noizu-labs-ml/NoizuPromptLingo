# ═══════════════════════════════════════════════════════════════
# SEMANTIC GROUPS — style-guide.semantic-groups.yaml
# ═══════════════════════════════════════════════════════════════
#
# Category labels for grouping semantic classes in the viewer.
#
# HOW IT WORKS:
#   - Each entry defines a group name and description
#   - The viewer uses these to organize the semantic class cards
#     from style-guide.semantic-classes.yaml into labeled sections
#
# HOW TO MODIFY:
#   - Add a `- name:` entry with a description
#   - Group names are display-only — no CSS generated
#
# RELATED: style-guide.semantic-classes.yaml (the classes themselves)
# ═══════════════════════════════════════════════════════════════

semantic-groups:
  - name: "Pipeline States"
    classes: [success, warning, danger, info]
    description: "Product pipeline stages — from concept through validation, live, and killed. Maps directly to portfolio product status."
  - name: "Brand Accents"
    classes: [primary, brand]
    description: "Cyan and violet are the only two accents in the Nocturne system. Cyan is the robot signal — CTAs and active states. Violet is the secondary — links and passive UI."

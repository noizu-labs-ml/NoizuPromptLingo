# ═══════════════════════════════════════════════════════════════
# DESIGN SECTIONS — style-guide.design-sections.yaml
# ═══════════════════════════════════════════════════════════════
#
# Detailed component specifications for the styleguide viewer's
# expandable design reference panels.
#
# RELATED: style-guide.page-sections.yaml (viewer section nav)
#          style-guide.css-snippets.yaml (actual CSS for components)
# ═══════════════════════════════════════════════════════════════

design-sections:
  - name: navigation
    title: Navigation
    description: "Minimal top bar with scroll anchors. The venture lab is a landing page, not a dashboard."
    icon: "→"
    components:
      - name: navbar
        title: Top Navigation Bar
        principle: "Four links. No dropdowns. The navbar is a wayfinder, not a menu."
        approach: "Fixed header at 56px. 'derobot.is' brand left in Syne 700. Right-aligned links: Portfolio, Process, About, Contact (outline button). Dark background, white text, cyan hover."
        rationale: "A venture lab corporate site has 4 real pages. Hiding them behind hamburger menus or dropdowns adds friction for zero benefit."
      - name: footer
        title: Footer
        description: "Two-column footer with brand left, links right. Stack on mobile."
        principle: "The footer is the only place meta links (styleguide, sitemap) appear."
        approach: "Top border 1px gray-500. Padding space-8 vertical. Brand + 'Based in the Netherlands' left. Nav links + meta links right. All text caption size, tertiary color. Links turn violet on hover."
        rationale: "Meta pages (styleguide, sitemap) don't belong in primary nav — they serve internal audiences, not the three target audiences."

  - name: status-indicators
    title: Status Indicators
    description: "Product pipeline stage badges. Each badge communicates exactly one state."
    icon: "●"
    components:
      - name: status-badge
        title: Product Status Badge
        principle: "One badge per product. The badge tells you the pipeline stage — nothing else."
        approach: "Monospace label, 12px, uppercase. Background at 8% opacity of the semantic color. Text at full opacity. States: Concept (info/blue), Validation (warning/amber), Building (success/green), Live (success/green), Shelved (danger/red)."
        rationale: "Pipeline stages map directly to semantic states. All products are currently Concept — the badge is honest about that."
      - name: category-tag
        title: Category Tag
        principle: "Tags categorize products in the portfolio grid."
        approach: "JetBrains Mono 12px, uppercase, letter-spacing 0.05em. Color tertiary (gray-200). No background — the category header provides grouping context."
        rationale: "Monospace tags at small sizes read as metadata, not content. The uppercase + letter-spacing convention signals 'label' across the portfolio."

  - name: site-layout
    title: Site Layout
    description: "Page-level layout patterns for the venture lab corporate site."
    icon: "⊞"
    components:
      - name: landing
        title: Landing Page Layout
        principle: "The landing page is a teaser hub. Each section links to its dedicated page."
        approach: "Full-bleed hero (100vh on desktop, 80vh mobile). Portfolio teaser: 6 cards in bento grid. Process teaser: 4 inline step cards. About and contact: single-column text blocks. All sections separated by space-12 (96px)."
        rationale: "Three audiences (users, collaborators, investors) need different depths of information. The landing page gives each a taste; dedicated pages give depth."
      - name: portfolio-grid
        title: Portfolio Grid Layout
        principle: "Products grouped by category. The grid reads as a deliberate spread of bets, not a random pile."
        approach: "Category headers span full width (mono uppercase with extending line). Cards in responsive bento grid: 1-col mobile, 2-col tablet, 3-col desktop. 24px gap. Cards are identical in structure."
        rationale: "Grouping by category communicates portfolio intentionality. Identical card structure prevents any single product from visually dominating."
      - name: product-detail
        title: Product Detail Layout
        principle: "Each product gets a home until its own site exists. The README is the content source."
        approach: "Article layout (720px). Back link top. Product header: name (H1), category tag, domain link (cyan). Sections from README: elevator pitch, problem, solution, tech direction. Status badge. CTA row at bottom."
        rationale: "When someone clicks a product card, they need somewhere to land. Generating from READMEs means zero manual content maintenance."

  - name: forms
    title: Forms & Input
    description: "Contact form inputs for the venture lab."
    icon: "✎"
    components:
      - name: contact-form
        title: Contact Form
        principle: "Four fields. Name, email, role, message. No friction."
        approach: "Single-column layout. Label above each field in 14px secondary text. Input: gray-700 background, 1px gray-500 border, 6px radius. Focus: cyan border, no glow. Role is a select: User, Collaborator, Investor, Press, Other. Submit: primary cyan button."
        rationale: "The role select routes the inquiry to the right mental context. Four fields is the maximum before completion rates drop."

typography:
  - var: font-display
    name: Source Serif 4
    description: "Display typeface. Used for all headings H1–H3 and the display lockup. Brings institutional authority and editorial permanence — the visual language of financial publishing and legal documentation."
    usage: "Display headings, H1, H2, H3, marketing section titles"
    weights: [400, 600]
    colors:
      - label: "Brand Navy"
        value: "#1E3A5F"
        background: "#FFFFFF"
        note: "Primary heading color — navy reinforces institutional authority."
      - label: "Trust Blue"
        value: "#2563EB"
        background: "#F8FAFC"
        note: "Accent headings, call-to-action display text, highlighted section titles."

  - var: font-sans
    name: Inter
    description: "Body and UI typeface. Used for all body copy, labels, metadata, navigation, and controls. Optimized for screen legibility at small sizes — professional without personality."
    usage: "Body copy, UI labels, navigation, table data, form controls, captions"
    weights: [400, 500, 600]
    colors:
      - label: "Text"
        value: "var(--text)"
        background: "var(--surface)"
        note: "Primary body text — full contrast for compliance-dense reading environments."
      - label: "Text Secondary"
        value: "var(--text-secondary)"
        background: "var(--surface)"
        note: "Supporting copy, descriptions, metadata fields."

  - var: font-mono
    name: JetBrains Mono
    description: "Monospace typeface. Used for API endpoints, configuration values, code samples, token names, and any technical data requiring exact rendering."
    usage: "Code blocks, API tokens, configuration keys, terminal output, technical identifiers"
    weights: [400]
    colors:
      - label: "Trust Blue"
        value: "#2563EB"
        background: "var(--surface-alt)"
        note: "Inline code, API endpoint highlights — blue signals interactive or copyable values."
      - label: "Text Secondary"
        value: "var(--text-secondary)"
        background: "var(--gray-800)"
        note: "Code block body text in dark contexts."

typography-classes:
  - name: Display
    class: typography-display
    font-family: "var(--font-display)"
    font-size: "48px"
    font-weight: "600"
    line-height: "1.1"
    letter-spacing: "-0.02em"

  - name: H1
    class: typography-h1
    font-family: "var(--font-display)"
    font-size: "36px"
    font-weight: "600"
    line-height: "1.15"
    letter-spacing: "-0.015em"

  - name: H2
    class: typography-h2
    font-family: "var(--font-display)"
    font-size: "24px"
    font-weight: "600"
    line-height: "1.25"
    letter-spacing: "-0.01em"

  - name: H3
    class: typography-h3
    font-family: "var(--font-display)"
    font-size: "var(--font-size-xl)"
    font-weight: "600"
    line-height: "1.3"

  - name: H4
    class: typography-h4
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-lg)"
    font-weight: "600"
    line-height: "1.4"

  - name: Body
    class: typography-body
    font-family: "var(--font-body)"
    font-size: "16px"
    font-weight: "400"
    line-height: "1.6"

  - name: Body Medium
    class: typography-body-medium
    font-family: "var(--font-body)"
    font-size: "var(--font-size-md)"
    font-weight: "500"
    line-height: "1.55"

  - name: Small
    class: typography-small
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-sm)"
    font-weight: "400"
    line-height: "1.5"

  - name: Caption
    class: typography-caption
    font-family: "var(--font-sans)"
    font-size: "12px"
    font-weight: "400"
    line-height: "1.5"
    color: "var(--text-muted)"

  - name: Label
    class: typography-label
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-xs)"
    font-weight: "600"
    line-height: "1.4"
    letter-spacing: "0.05em"
    text-transform: "uppercase"
    color: "var(--text-muted)"

  - name: Code
    class: typography-code
    font-family: "var(--font-mono)"
    font-size: "14px"
    font-weight: "400"
    line-height: "1.6"

  - name: Mono
    class: typography-mono
    font-family: "var(--font-mono)"
    font-size: "var(--font-size-md)"
    font-weight: "400"
    line-height: "1.6"

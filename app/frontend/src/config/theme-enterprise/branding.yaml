name: "MCP Host"
logo-text: "MCP Host"
font-url: "https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap"

logo-style:
  font: "Source Serif 4"
  color: "#1E3A5F"
  weight: "600"
  letter-spacing: "-0.01em"
  glow: none
  decoration: none

intent: "Enterprise-grade MCP infrastructure for organizations that require auditability, compliance, and institutional trust. The platform should feel as dependable as the teams that depend on it."
perception: "Stable, competent, and institutionally authoritative. Users should feel they are working with infrastructure built to the standards of financial services, healthcare, and government — serious tooling for serious teams."
audience: "Enterprise security teams, platform engineers, and IT leadership at mid-to-large organizations. They evaluate tools on reliability, compliance posture, and vendor credibility before feature sets."
tone: "Authoritative, measured, and precise. Lead with trust signals. Speak in the language of procurement, compliance, and operational excellence. Never casual, never marketing-forward."

keywords:
  - Trust
  - Authority
  - Stability
  - Enterprise
  - Compliance

sub-products:
  - name: "JustMCP.it"
    accent: "#0D9488"
    description: "Managed MCP deployment — teal accent signals operational efficiency."
  - name: "Jumpstart"
    accent: "#4F46E5"
    description: "Onboarding and quick-start — indigo accent signals structured progression."
  - name: "SafeMCP"
    accent: "#1E3A5F"
    description: "Security and compliance tooling — navy anchor signals institutional authority."

intro: |
  MCP Host Enterprise uses a dual-typeface system anchored in institutional trust.
  Source Serif Pro handles all display headings — lending the authority and permanence
  of financial and legal publishing. Inter provides clean, readable body copy that
  scales across dense data interfaces.

  Navy (#1E3A5F) anchors the brand identity. Trust Blue (#2563EB) drives primary
  actions and interactive states. The slate gray scale — blue-tinted throughout —
  reinforces the cool, composed professional aesthetic.

  Three weights only: 400 for body, 500 for emphasis, 600 for headings and controls.
  Sub-product accents (Teal, Indigo) are reserved for product-scoped contexts only —
  they do not bleed into the core platform UI.

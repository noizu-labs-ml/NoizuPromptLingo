toast:
  position: top-right
  duration: 8000
  gap: 16
  expand: true
  visible-toasts: 4

globals: |
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: var(--base-font-size); -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
  body {
    font-family: var(--base-font-family);
    color: var(--base-font-color);
    background: var(--base-background);
    line-height: var(--base-line-height);
  }
  html[data-design-theme="sumi-e"] ::selection { background: rgba(194,59,34,0.12); color: #1a1a1a; }
  /* Washi paper texture */
  html[data-design-theme="sumi-e"]:not(.dark) body::before {
    content: '';
    position: fixed;
    inset: 0;
    opacity: 0.3;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.08'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }
  html[data-design-theme="sumi-e"] body > * { position: relative; z-index: 1; }

color-palette:
  - group: "Washi — Paper Surfaces"
    description: "Warm paper tones. The ground on which ink rests."
    colors:
      - name: Washi
        value: "var(--washi)"
        cssClass: washi
      - name: Warm
        value: "var(--washi-warm)"
        cssClass: washi-warm
      - name: Cool
        value: "var(--washi-cool)"
        cssClass: washi-cool
      - name: Aged
        value: "var(--washi-aged)"
        cssClass: washi-aged
      - name: Shadow
        value: "var(--washi-shadow)"
        cssClass: washi-shadow

  - group: "Sumi — Ink Wash Tones"
    description: "From full-strength sumi to the faintest mist."
    colors:
      - name: Deep
        value: "var(--sumi-deep)"
        cssClass: sumi-deep
      - name: Sumi
        value: "var(--sumi)"
        cssClass: sumi
      - name: Strong
        value: "var(--sumi-strong)"
        cssClass: sumi-strong
      - name: Mid
        value: "var(--sumi-mid)"
        cssClass: sumi-mid
      - name: Light
        value: "var(--sumi-light)"
        cssClass: sumi-light
      - name: Wash
        value: "var(--sumi-wash)"
        cssClass: sumi-wash
      - name: Ghost
        value: "var(--sumi-ghost)"
        cssClass: sumi-ghost
      - name: Mist
        value: "var(--gray-100)"
        cssClass: gray-100

  - group: "Accent Colors"
    description: "Vermillion seal, matcha, indigo, kin — used sparingly."
    colors:
      - name: "Vermillion — 朱"
        value: "var(--brand-red)"
        cssClass: brand-red
      - name: "Matcha — 抹茶"
        value: "var(--lime)"
        cssClass: lime
      - name: "Indigo — 藍"
        value: "var(--brand-blue)"
        cssClass: brand-blue
      - name: "Gold — 金"
        value: "var(--brand-yellow)"
        cssClass: brand-yellow
    notes:
      - label: "Vermillion"
        text: "The seal stamp. Approval, identity, importance. Use sparingly — each mark is a commitment."
        cssClass: brand-red
      - label: "Matcha"
        text: "Success, growth, the living world. Bamboo, moss, new leaves."
        cssClass: lime
      - label: "Indigo"
        text: "Depth, trust, the deep water. Links, informational states."
        cssClass: brand-blue
      - label: "Gold"
        text: "Precious accent. Kintsugi repair, highlights, the most important detail."
        cssClass: brand-yellow

  - group: Semantic
    description: "Muted, natural-feeling state colors."
    colors:
      - name: Success
        value: "var(--success)"
        cssClass: success
      - name: Warning
        value: "var(--warning)"
        cssClass: warning
      - name: Error
        value: "var(--error)"
        cssClass: error

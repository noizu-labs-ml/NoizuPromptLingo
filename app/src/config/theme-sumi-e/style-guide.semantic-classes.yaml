semantic-classes:
  - name: danger
    class: danger
    title: "Danger"
    description: "Destructive actions, error states"
    accent-style: solid
    vars:
      - name: accent
        value: "#9b2c2c"
      - name: background
        value: "rgba(155,44,44,0.06)"
      - name: color
        value: "#9b2c2c"

  - name: warning
    class: warning
    title: "Warning"
    description: "Caution states, attention required"
    accent-style: solid
    vars:
      - name: accent
        value: "#8b6914"
      - name: background
        value: "rgba(139,105,20,0.06)"
      - name: color
        value: "#8b6914"

  - name: success
    class: success
    title: "Success"
    description: "Positive outcomes, confirmed states"
    accent-style: solid

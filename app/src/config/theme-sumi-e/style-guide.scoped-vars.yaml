scoped-vars:
  prefix: "theme"

  sections:
    standard:
      selector: 'html[data-design-theme="sumi-e"]'
      prefix: "theme"
    dark:
      selector: 'html[data-design-theme="sumi-e"].dark'
      prefix: "theme"
    layout:
      selector: 'html[data-design-theme="sumi-e"]'
      prefix: "layout"

  vars:
    - name: content-container-type
      value: "inline-size"
      selector: ".content"
      selector-body: "container-type: var(--theme-content-container-type)"

    - name: content-position
      value:
        - section: standard
          value: "relative"
      selector: ".content"
      selector-body: "position: var(--theme-content-position)"

    - name: surface
      value:
        - section: standard
          value: "#f5f0e8"
        - section: dark
          value: "#1a1a1a"

    - name: surface-alt
      value:
        - section: standard
          value: "#efe8dc"
        - section: dark
          value: "#2a2a28"

    - name: surface-inverse
      value:
        - section: standard
          value: "#1a1a1a"
        - section: dark
          value: "#f5f0e8"

    - name: text
      value:
        - section: standard
          value: "#1a1a1a"
        - section: dark
          value: "#e0dcd4"

    - name: text-secondary
      value:
        - section: standard
          value: "#4a4a46"
        - section: dark
          value: "#a8a89e"

    - name: text-muted
      value:
        - section: standard
          value: "#7a7a72"
        - section: dark
          value: "#7a7a72"

    - name: text-inverse
      value:
        - section: standard
          value: "#f5f0e8"
        - section: dark
          value: "#1a1a1a"

    - name: border
      value:
        - section: standard
          value: "#ddd5c5"
        - section: dark
          value: "#4a4a46"

    - name: border-strong
      value:
        - section: standard
          value: "#ccc8be"
        - section: dark
          value: "#5a5a52"

    - name: shadow-color
      value:
        - section: standard
          value: "rgba(26,26,26,0.08)"
        - section: dark
          value: "rgba(0,0,0,0.3)"

    - name: standard
      value:
        - section: layout
          values:
            max-width: "960px"
            padding: "var(--space-6)"
            margin: "0 auto"
            content-bg: "transparent"
      selector: ".content"
      selector-body: "max-width: var(--layout-standard-max-width); padding: var(--layout-standard-padding); margin: var(--layout-standard-margin); background: var(--layout-standard-content-bg)"

    - name: wide
      value:
        - section: layout
          values:
            max-width: "1200px"
            padding: "var(--space-6)"
            margin: "0 auto"
            content-bg: "transparent"
      selector: ".content.wide"
      selector-body: "max-width: var(--layout-wide-max-width); padding: var(--layout-wide-padding); margin: var(--layout-wide-margin); background: var(--layout-wide-content-bg)"

    - name: full
      value:
        - section: layout
          values:
            max-width: "100%"
            padding: "var(--space-4)"
            margin: "0"
            content-bg: "transparent"
      selector: ".content.full"
      selector-body: "max-width: var(--layout-full-max-width); padding: var(--layout-full-padding); margin: var(--layout-full-margin); background: var(--layout-full-content-bg)"

    - name: narrow
      value:
        - section: layout
          values:
            max-width: "640px"
            padding: "var(--space-6)"
            margin: "0 auto"
            content-bg: "transparent"
      selector: ".content.narrow"
      selector-body: "max-width: var(--layout-narrow-max-width); padding: var(--layout-narrow-padding); margin: var(--layout-narrow-margin); background: var(--layout-narrow-content-bg)"

    - name: article
      value:
        - section: layout
          values:
            max-width: "720px"
            padding: "var(--space-6)"
            margin: "0 auto"
            content-bg: "transparent"
      selector: ".content.article"
      selector-body: "max-width: var(--layout-article-max-width); padding: var(--layout-article-padding); margin: var(--layout-article-margin); background: var(--layout-article-content-bg)"

typography:
  - var: font-display
    name: Cormorant Garamond
    description: "The calligraphic voice. High stroke contrast, elegant terminals, italic as the default register."
    usage: "Headings, titles, display text, pull quotes"
    weights: [300, 400, 500, 600, 700]
    colors:
      - label: "Sumi Ink"
        value: "#1a1a1a"
        note: "Primary text — full ink density for headlines and emphasis."
      - label: "Vermillion"
        value: "#c23b22"
        note: "The seal — signature moments, accents, and key actions."

  - var: font-mono
    name: IBM Plex Mono
    description: "Everything the machine says. Clean, neutral, respectful of the content it carries."
    usage: "Code, metadata, labels, technical notation"
    weights: [300, 400, 500]

  - var: font-body
    name: Cormorant Garamond
    description: "Body text voice. The same hand that writes the headlines, at reading scale."
    usage: "Paragraphs, descriptions, long-form content"
    weights: [300, 400, 500]

  - var: font-decorative
    name: Noto Serif JP
    description: "Japanese · Noto Serif JP 300 · Decorative. The kanji voice — used for the seal glyph and Japanese typographic moments."
    usage: "Seal stamps, Japanese text, decorative kanji"
    weights: [200, 300, 400, 500, 600, 700]
    colors:
      - label: "Vermillion"
        value: "#c23b22"
        note: "The hanko seal — traditional vermillion ink for signature marks."

typography-classes:
  - name: Display
    class: typography-display
    font-family: "var(--font-display)"
    font-size: "52px"
    font-weight: "300"
    font-style: "italic"
    line-height: "1.1"
    letter-spacing: "0.02em"
    sample: "Put your pen down."
    usage: "Hero headlines — italic, light, like a brush lifted from the page"

  - name: Heading 1
    class: typography-h1
    font-family: "var(--font-display)"
    font-size: "36px"
    font-weight: "400"
    font-style: "italic"
    line-height: "1.2"
    sample: "First stroke to finished product"
    usage: "Section titles — italic by default"

  - name: Heading 2
    class: typography-h2
    font-family: "var(--font-display)"
    font-size: "24px"
    font-weight: "500"
    line-height: "1.3"
    sample: "Agent Orchestrator"
    usage: "Subsection headers, card titles"

  - name: Body
    class: typography-body
    font-family: "var(--font-body)"
    font-size: "18px"
    font-weight: "400"
    line-height: "1.8"
    sample: "The guided pipeline transforms rough sketches into deployed products. Each phase is a focused, bounded interaction — a deliberate stroke. AI agents handle the heavy lifting; the user steers."
    usage: "Paragraphs, descriptions — generous line-height for breathing room"

  - name: Code
    class: typography-code
    font-family: "var(--font-mono)"
    font-size: "13px"
    font-weight: "400"
    line-height: "1.8"
    sample: "const agent = await orchestrator.spawn('coder', { story: 'INK-042' });\nagent.on('complete', (diff) => reviewer.submit(diff));"
    usage: "Code blocks, terminal output, data displays"

  - name: Label
    class: typography-label
    font-family: "var(--font-mono)"
    font-size: "10px"
    font-weight: "500"
    line-height: "1.4"
    letter-spacing: "0.15em"
    text-transform: "uppercase"
    sample: "AGENT STATUS · LAST UPDATED 3S AGO · PHASE: INK"
    usage: "Captions, status text, mono-spaced metadata"

  - name: Japanese
    class: typography-japanese
    font-family: "var(--font-decorative)"
    font-size: "36px"
    font-weight: "300"
    line-height: "1.4"
    sample: "墨絵 — 一筆一生"
    usage: "Decorative kanji, seal stamps, Japanese typographic moments"

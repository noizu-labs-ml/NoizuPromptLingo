page-sections:
  - group: Visual Foundation
    desc: "The ink itself — type, tone, space, and marks that all composition grows from."
    sections:
      - id: typography
        title: Typography
        desc: "Brushwork and text — the weight of ink, the breath of spacing, the cadence of the written word."
      - id: color
        title: Color
        desc: "Ink gradients, washi surfaces, vermillion accents, and the full tonal palette of the system."
      - id: spacing
        title: "Spacing & Ma"
        desc: "The interval between things — negative space as a first-class design element. Rhythm through restraint."
      - id: dividers
        title: "Dividers & Rules"
        desc: "Ink-wash separators — fading edges, brushstroke rules, and the pause between sections."
      - id: glyphs
        title: Glyph Language
        desc: "Canonical marks for UI controls, navigation, and calligraphic accents."
      - id: code-blocks
        title: Ink & Code
        desc: "Preformatted passages — code rendered as brushwork. Syntax color drawn from the ink-wash palette."
      - id: terminal
        title: The Inkwell
        desc: "Command-line aesthetic expressed in sumi tones — a terminal as contemplative instrument."

  - group: Structure
    desc: "How the scroll is composed — shells, archetypes, and the paths between them."
    sections:
      - id: shell-layouts
        title: Shell Layouts
        desc: "Full-page application shells — composed like a scroll. Click a layout to preview its frame."
      - id: content-layouts
        title: Content Layouts
        desc: "Content width and spacing presets — standard, wide, narrow, and the meditative single-column."
      - id: site-archetypes
        title: Site Archetypes
        desc: "Page-level layout archetypes — the garden path, the reading room, the archive, and more."
      - id: navigation
        title: Navigation
        desc: "Wayfinding through stillness — navbars, sidebars, breadcrumbs, and contextual menus."

  - group: Interaction
    desc: "States, signals, and controls — the moment the interface responds to touch."
    sections:
      - id: semantic-classes
        title: Semantic Classes
        desc: "Contextual modifiers — accent, states, and workflow classes rendered in sumi-e ink tones."
      - id: status-indicators
        title: Status Indicators
        desc: "Presence signals drawn quietly — badges, alerts, toasts, and progress indicators."
      - id: ui-elements
        title: UI Elements
        desc: "Cards, buttons, forms, and controls — tactile as washi, legible as brushed kanji."
      - id: ink-effects
        title: "Ink Effects & Project Components"
        desc: "墨の動き — restrained motion, agent dashboards, and the movement of ink across the interface."
      - id: screens
        title: Screens
        desc: "画面 — the visible surface. Full-page mockups rendered in the ink-wash system."

  - group: Reference
    desc: "Tokens, CSS output, YAML source, and live snippets — the system laid bare."
    sections:
      - id: design-tokens
        title: Design Tokens
        desc: "Full CSS custom property reference — every variable in the ink-wash system."
      - id: generated-css
        title: Generated CSS
        desc: "Output CSS by section — vars, cards, buttons, semantic, utilities, and more."
      - id: theme-config
        title: Theme Config
        desc: "YAML source for this theme. Edit and save as a named variant."
      - id: snippets
        title: Snippets & Demos
        desc: "CSS and JSX snippets defined in YAML — live previews of generated components and styles."
      - id: overrides
        title: Overrides
        desc: "Select which variant to use per section. Set to base to disable an override."

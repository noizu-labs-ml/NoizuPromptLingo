page-sections:
  - group: Visual Foundation
    desc: "The grid's raw materials — type, color, space, and the geometric primitives everything is built from."
    sections:
      - id: typography
        title: Typography
        desc: "Two typefaces. One sans, one mono. No serif. No exceptions."
      - id: color
        title: Color Palette
        desc: "Five colors. Three primaries, black, white. That's the system."
      - id: spacing
        title: "Spacing, Gutters & Whitespace"
        desc: "8px base unit. Every gap is a deliberate choice."
      - id: dividers
        title: "Dividers & Rules"
        desc: "1–2px hairlines, hard edges, and offset separators. No gradients."
      - id: glyphs
        title: Glyph Language
        desc: "Geometric symbols and UI marks. Functional notation for controls and states."
      - id: code-blocks
        title: Code Blocks
        desc: "IBM Plex Mono at 13px. Syntax on a neutral field. Code as technical artifact."
      - id: terminal
        title: Terminal
        desc: "The machine interface — monospaced, high-contrast, no frills."

  - group: Structure
    desc: "How the layout grid disciplines page assembly — shells, archetypes, and systematic navigation."
    sections:
      - id: shell-layouts
        title: Shell Layouts
        desc: "Full-page application shells. Fixed chrome, defined zones."
      - id: content-layouts
        title: Content Layouts
        desc: "Max-width presets — standard, wide, narrow, article, full."
      - id: site-archetypes
        title: Site Archetypes
        desc: "Page-level layout patterns — search-first, dashboard, document, hierarchy, multi-view."
      - id: navigation
        title: Navigation
        desc: "Active state fills black. Completed shows check. No gradients, no glow."

  - group: Interaction
    desc: "Semantic states and precise controls — every affordance is explicit, every state is labeled."
    sections:
      - id: semantic-classes
        title: Semantic Classes
        desc: "State modifiers rendered in the Bauhaus palette. Black, red, blue — each class has one job."
      - id: status-indicators
        title: Status Indicators
        desc: "Square indicators. No circles — circles are decorative. Squares are data."
      - id: ui-elements
        title: UI Elements
        desc: "Cards, buttons, forms, and controls. 2px black border. Color on top edge signals type."
      - id: ink-effects
        title: Project Components
        desc: "Composite widgets unique to noizu.ink — code blocks, dashboards, geometric elements."
      - id: screens
        title: Screens
        desc: "Full-page compositions. How users actually experience the product."

  - group: Reference
    desc: "The system's source of truth — tokens, generated CSS, YAML config, and live snippets."
    sections:
      - id: design-tokens
        title: Design Tokens
        desc: "CSS custom properties. 8px grid unit. No magic numbers."
      - id: generated-css
        title: Generated CSS
        desc: "Output CSS by section — vars, cards, buttons, semantic, utilities, and more."
      - id: theme-config
        title: Theme Config
        desc: "YAML source for this theme. The specification is the documentation."
      - id: snippets
        title: Snippets & Demos
        desc: "CSS and JSX snippets defined in YAML — live previews of generated components and styles."
      - id: overrides
        title: Overrides
        desc: "Select which variant to use per section. Set to base to disable an override."

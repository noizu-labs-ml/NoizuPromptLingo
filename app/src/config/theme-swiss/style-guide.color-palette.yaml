color-palette:
  - group: "Primaries"
    description: "Five colors. Three primaries, black, white. That's the system."
    colors:
      - name: Black
        value: "var(--black)"
        cssClass: black
      - name: White
        value: "var(--white)"
        cssClass: white
      - name: Red
        value: "var(--red)"
        cssClass: red
      - name: Blue
        value: "var(--blue)"
        cssClass: blue
      - name: Yellow
        value: "var(--yellow)"
        cssClass: yellow
    notes:
      - label: "Black"
        text: "Primary text, borders, structural elements. The default."
        cssClass: black
      - label: "White"
        text: "Backgrounds, card surfaces, negative space."
        cssClass: white
      - label: "Red"
        text: "Accent, CTAs, destructive actions, top borders on cards."
        cssClass: red
      - label: "Blue"
        text: "Links, info states, secondary accent, interactive elements."
        cssClass: blue
      - label: "Yellow"
        text: "Highlights, warnings, text selection, attention markers."
        cssClass: yellow

  - group: "Neutral Scale"
    description: "Pure achromatic scale. The structural ground on which all color sits."
    colors:
      - name: White
        value: "var(--white)"
        cssClass: white
      - name: Off-white
        value: "var(--off-white)"
        cssClass: off-white
      - name: "50"
        value: "var(--gray-50)"
        cssClass: gray-50
      - name: "100"
        value: "var(--gray-100)"
        cssClass: gray-100
      - name: "200"
        value: "var(--gray-200)"
        cssClass: gray-200
      - name: "300"
        value: "var(--gray-300)"
        cssClass: gray-300
      - name: "400"
        value: "var(--gray-400)"
        cssClass: gray-400
      - name: "500"
        value: "var(--gray-500)"
        cssClass: gray-500
      - name: "600"
        value: "var(--gray-600)"
        cssClass: gray-600
      - name: "700"
        value: "var(--gray-700)"
        cssClass: gray-700
      - name: "800"
        value: "var(--gray-800)"
        cssClass: gray-800
      - name: "900"
        value: "var(--gray-900)"
        cssClass: gray-900

  - group: "Semantic"
    description: "Functional state colors. Each communicates exactly one meaning."
    colors:
      - name: Success
        value: "var(--success)"
        cssClass: success
      - name: Warning
        value: "var(--warning)"
        cssClass: warning
      - name: Error
        value: "var(--error)"
        cssClass: error
      - name: Info
        value: "var(--info)"
        cssClass: info

shell-layouts:
  - name: landing
    title: Landing Page
    description: "Hero-first marketing layout — full-width sections, minimal chrome, strong CTA."
    chrome:
      navbar:
        height: "64px"
        background: "var(--black)"
        color: "var(--white)"
        label: "Nav"
      footer:
        height: "80px"
        background: "var(--gray-900)"
        color: "var(--gray-400)"
        label: "Footer"
    zones:
      - label: "Hero"
        background: "var(--black)"
        color: "var(--white)"
        ratio: 3
      - label: "Features"
        background: "var(--gray-50)"
        color: "var(--gray-700)"
        ratio: 2
      - label: "CTA"
        background: "var(--red-light)"
        color: "var(--black)"
        ratio: 1

  - name: dashboard
    title: Dashboard
    description: "App shell — fixed sidebar for navigation, top bar for identity and actions, dense content area."
    chrome:
      navbar:
        height: "56px"
        background: "var(--gray-900)"
        color: "var(--white)"
        label: "App Bar"
      sidebar:
        width: "240px"
        background: "var(--gray-800)"
        color: "var(--white)"
        label: "Sidebar"
      footer:
        height: "32px"
        background: "var(--gray-100)"
        color: "var(--gray-500)"
        label: "Status Bar"
    zones:
      - label: "KPI Cards"
        background: "var(--white)"
        ratio: 1
      - label: "Charts"
        background: "var(--gray-50)"
        ratio: 2
      - label: "Data Table"
        background: "var(--white)"
        ratio: 2

  - name: editor
    title: Code / Content Editor
    description: "Three-panel IDE-style layout — file tree left, main editor center, inspector right."
    chrome:
      navbar:
        height: "40px"
        background: "var(--gray-900)"
        color: "var(--white)"
        label: "Toolbar"
      sidebar:
        width: "220px"
        background: "var(--gray-800)"
        color: "var(--gray-300)"
        label: "Files"
      aside:
        width: "260px"
        background: "var(--gray-800)"
        color: "var(--gray-300)"
        label: "Inspector"
    zones:
      - label: "Editor"
        background: "var(--gray-900)"
        color: "var(--white)"
        ratio: 1

  - name: document
    title: Document Reader
    description: "Long-form reading layout — constrained content width, sticky TOC sidebar, clear typography."
    chrome:
      navbar:
        height: "48px"
        background: "var(--gray-100)"
        color: "var(--black)"
        label: "Nav"
      sidebar:
        width: "200px"
        background: "var(--gray-50)"
        color: "var(--gray-600)"
        label: "TOC"
      footer:
        height: "48px"
        background: "var(--gray-50)"
        color: "var(--gray-500)"
        label: "Footer"
    zones:
      - label: "Article"
        background: "var(--white)"
        ratio: 1

  - name: settings
    title: Settings / Admin
    description: "Two-panel settings shell — category nav on left, form content on right."
    chrome:
      navbar:
        height: "56px"
        background: "var(--black)"
        color: "var(--white)"
        label: "App Bar"
      sidebar:
        width: "220px"
        background: "var(--gray-100)"
        color: "var(--gray-700)"
        label: "Categories"
    zones:
      - label: "Settings Form"
        background: "var(--white)"
        ratio: 1

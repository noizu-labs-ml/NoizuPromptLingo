page-sections:
  - group: Reference
    desc: "Tokens, generated CSS, YAML config, and live snippets — the system's source of truth."
    sections:
      - id: design-tokens
        title: Design Tokens
        desc: "Full CSS custom property reference — all variables in the system."
      - id: generated-css
        title: Generated CSS
        desc: "Output CSS by section — vars, cards, buttons, semantic, utilities, and more."
      - id: theme-config
        title: Theme Config
        desc: "YAML source for this theme. Edit and save as a named variant."
      - id: snippets
        title: Snippets & Demos
        desc: "CSS and JSX snippets defined in YAML — live previews of generated components and styles."
      - id: overrides
        title: Overrides
        desc: "Select which variant to use per section. Set to base to disable an override."

  - group: Visual Foundation
    desc: "The raw materials — type, color, space, and glyphs that every component is built from."
    sections:
      - id: typography
        title: Typography
        desc: "Typefaces, sizes, weights, and line heights."
      - id: color
        title: Color
        desc: "Brand colors, surfaces, and semantic states."
      - id: spacing
        title: "Spacing & Grid"
        desc: "Scale, rhythm, gutters, and whitespace principles."
      - id: dividers
        title: "Dividers & Rules"
        desc: "Horizontal and vertical separators — gradient fades, glows, brand accents."
      - id: glyphs
        title: Glyph Language
        desc: "Canonical glyphs for UI controls, navigation, and typography."

  - group: Structure
    desc: "How pages and shells are assembled — layouts, archetypes, and navigation patterns."
    sections:
      - id: shell-layouts
        title: Shell Layouts
        desc: "Full-page application shells — click a layout to preview its chrome."
      - id: content-layouts
        title: Content Layouts
        desc: "Content width and spacing presets — standard, wide, narrow, article."
      - id: site-archetypes
        title: Site Archetypes
        desc: "Page-level layout archetypes — dashboard, document, search-first, and more."
      - id: navigation
        title: Navigation
        desc: "Wayfinding patterns — navbars, sidebars, breadcrumbs, and contextual menus."

  - group: Interaction
    desc: "Semantic states, status signals, and interactive controls that respond to user intent."
    sections:
      - id: semantic-classes
        title: Semantic Classes
        desc: "Contextual modifiers — accent, states, workflow classes for cards, buttons, and text."
      - id: status-indicators
        title: Status Indicators
        desc: "Badges, alerts, toasts, progress, and status signals."
      - id: ui-elements
        title: UI Elements
        desc: "Cards, buttons, forms, and interactive controls — all semantic-aware."
      - id: custom-components
        title: Custom Components
        desc: "Project-specific composite components built from the design system."
      - id: tailwind-plus
        title: Tailwind Plus
        desc: "Tailwind Plus component catalog — styled with design system tokens."

  - group: Component Library
    desc: "Browse all exported components grouped by package subpath — primitives, showcases, demos, layout, and more."
    sections:
      - id: component-browser
        title: Component Browser
        desc: "Interactive catalog of all @noizu/styleguide components with live previews and import paths."

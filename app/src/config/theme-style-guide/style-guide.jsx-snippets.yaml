jsx-snippets:
  - slug: demo-imports
    name: Demo Imports
    title: "Shared imports"
    description: "Common imports for demo components"
    target-section: demo
    body: |
      import { useState } from "react";

  - slug: counter-demo
    name: Counter Demo
    title: "Simple counter"
    description: "A basic counter component to verify JSX snippet generation works."
    target-section: demo
    dependencies: [demo-imports]
    body: |
      export function CounterDemo() {
        const [count, setCount] = useState(0);
        return (
          <button className="btn btn-sm" onClick={() => setCount((c) => c + 1)}>
            Count: {count}
          </button>
        );
      }

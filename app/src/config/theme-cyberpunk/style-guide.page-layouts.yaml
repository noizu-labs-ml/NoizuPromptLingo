page-layouts:
  - name: standard
    title: Standard
    description: "Max-width centered content on void background"
    selector: ".content"
    vars:
      max-width: "1200px"
      padding: "var(--space-6)"
      margin: "0 auto"
      body-bg: "var(--gray-900)"
      content-bg: "var(--gray-800)"
    chrome:
      navbar:
        height: "56px"
        background: "var(--gray-900)"
        color: "var(--white)"
        label: "Nav"
      footer:
        height: "48px"
        background: "var(--gray-900)"
        color: "var(--gray-300)"
        label: "Footer"

  - name: wide
    title: Wide
    description: "Expanded viewport for data-dense dashboards and grids"
    selector: ".content.wide"
    vars:
      max-width: "90vw"
      padding: "var(--space-6)"
      margin: "0 auto"
      body-bg: "var(--gray-900)"
      content-bg: "var(--gray-800)"
    chrome:
      navbar:
        height: "56px"
        background: "var(--gray-900)"
        color: "var(--white)"
        label: "Nav"
      footer:
        height: "48px"
        background: "var(--gray-900)"
        color: "var(--gray-300)"
        label: "Footer"

  - name: full
    title: Full
    description: "Edge-to-edge bleed for immersive interfaces"
    selector: ".content.full"
    vars:
      max-width: "100%"
      padding: "var(--space-4)"
      margin: "0"
      body-bg: "var(--gray-900)"
      content-bg: "var(--gray-900)"
    chrome:
      navbar:
        height: "56px"
        background: "var(--gray-900)"
        color: "var(--white)"
        label: "Nav"

  - name: narrow
    title: Narrow
    description: "Focused single-column for terminal-style readouts"
    selector: ".content.narrow"
    vars:
      max-width: "720px"
      padding: "var(--space-6)"
      margin: "0 auto"
      body-bg: "var(--gray-900)"
      content-bg: "var(--gray-800)"
    chrome:
      navbar:
        height: "48px"
        background: "var(--gray-800)"
        color: "var(--gray-300)"
        label: "Nav"
      footer:
        height: "40px"
        background: "var(--gray-800)"
        color: "var(--gray-300)"
        label: "Footer"

  - name: article
    title: Article
    description: "Long-form reading with scanline-style sidebar TOC"
    selector: ".content.article"
    vars:
      max-width: "860px"
      padding: "var(--space-6)"
      margin: "0 auto"
      body-bg: "var(--gray-900)"
      content-bg: "var(--gray-800)"
    chrome:
      navbar:
        height: "48px"
        background: "var(--gray-800)"
        color: "var(--gray-300)"
        label: "Nav"
      sidebar:
        width: "220px"
        background: "var(--gray-800)"
        color: "var(--gray-400)"
        label: "TOC"
      footer:
        height: "40px"
        background: "var(--gray-800)"
        color: "var(--gray-300)"
        label: "Footer"

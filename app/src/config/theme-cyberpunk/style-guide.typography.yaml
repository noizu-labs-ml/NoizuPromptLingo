typography:
  - var: font-display
    name: Orbitron
    description: "Display screams. Geometric, futuristic, angular. The typeface that makes you feel like you're piloting something."
    usage: "Hero headlines, system titles, glitch text, button labels"
    weights: [400, 600, 700, 900]
    colors:
      - label: "Neon Cyan"
        value: "var(--teal)"
        background: "#0a0a0f"
        note: "Primary glow color — headings, active states, and key CTAs."
      - label: "Neon Magenta"
        value: "var(--fuchsia)"
        background: "#0a0a0f"
        note: "Secondary accent — warnings, destructive actions, and emphasis."

  - var: font-mono
    name: Fira Code
    description: "Code glows. Ligature-enabled monospace for everything that computes. The voice of the machine."
    usage: "Code blocks, terminal output, data displays, token values"
    weights: [300, 400, 500, 600, 700]
    colors:
      - label: "Neon Lime"
        value: "var(--lime)"
        background: "#0a0a0f"
        note: "Terminal output, success states, and live data."
      - label: "Neon Cyan"
        value: "var(--teal)"
        background: "#0a0a0f"
        note: "Function names, links, and interactive elements."

  - var: font-body
    name: Share Tech Mono
    description: "Body whispers. Monospaced but readable — bridges code and prose. Every character earns its width."
    usage: "Paragraphs, descriptions, long-form content"
    weights: [400]

  - var: font-sans
    name: Inter
    description: "Fallback sans-serif for UI elements that need conventional readability."
    usage: "Form labels, secondary UI, fallback body text"
    weights: [400, 500, 600]

typography-classes:
  - name: Display
    class: typography-display
    font-family: "var(--font-display)"
    font-size: "var(--font-size-display)"
    font-weight: "900"
    line-height: "1.05"
    letter-spacing: "0.05em"
    text-transform: "uppercase"
    sample: "NEON PROTOCOL"
    usage: "Hero headlines, system titles, glitch text"

  - name: H1
    class: typography-h1
    font-family: "var(--font-display)"
    font-size: "var(--font-size-3xl)"
    font-weight: "700"
    line-height: "1.1"
    letter-spacing: "0.03em"
    text-transform: "uppercase"
    sample: "Agent Orchestrator"
    usage: "Section titles, primary headings"

  - name: H2
    class: typography-h2
    font-family: "var(--font-display)"
    font-size: "var(--font-size-2xl)"
    font-weight: "700"
    line-height: "1.2"
    letter-spacing: "0.02em"
    text-transform: "uppercase"
    sample: "Story Implementation"
    usage: "Subsection headers, card groups"

  - name: Body
    class: typography-body
    font-family: "var(--font-body)"
    font-size: "var(--font-size-md)"
    font-weight: "400"
    line-height: "1.7"
    sample: "The guided pipeline transforms rough sketches into deployed products. Each phase is a focused, bounded interaction. AI agents handle the heavy lifting; the user steers."
    usage: "Paragraphs, descriptions, long-form content"

  - name: Code
    class: typography-code
    font-family: "var(--font-mono)"
    font-size: "var(--font-size-sm)"
    font-weight: "400"
    line-height: "1.8"
    sample: "const agent = await orchestrator.spawn('coder', { story: 'INK-042' });\nagent.on('complete', (diff) => reviewer.submit(diff));"
    usage: "Code blocks, terminal output, data displays"

  - name: Label
    class: typography-label
    font-family: "var(--font-display)"
    font-size: "10px"
    font-weight: "600"
    line-height: "1.4"
    letter-spacing: "0.15em"
    text-transform: "uppercase"
    sample: "AGENT STATUS · LAST UPDATED 3S AGO · PHASE: INK"
    usage: "Section labels, status text, navigation"

# Redundancy audit (2026-03-23): all snippets reviewed against scoped-vars.yaml.
# scoped-vars handles: surface, surface-alt, surface-inverse, text, text-secondary,
# text-muted, text-inverse, border, border-strong, shadow-color, brand-red/blue/yellow,
# and layout (.content max-width/padding/margin/bg).
# Every snippet below adds behavior beyond token declaration (animations, @keyframes,
# pseudo-elements, box-shadow glows, hover effects, border-image gradients, font overrides
# on specific component classes). None are redundant — all retained.

css-snippets:
  - name: Cyberpunk Intro Hero
    slug: intro-hero
    title: "Glitch header with neon glow"
    description: "Full-width hero with glitch title — genuinely custom animation, not a color override."
    target-section: intro
    body: |
      @keyframes glitch-text {
        0%, 100% { clip-path: inset(0 0 0 0); transform: translate(0); }
        5% { clip-path: inset(20% 0 60% 0); transform: translate(-3px, 0); }
        10% { clip-path: inset(60% 0 10% 0); transform: translate(3px, 0); }
        15% { clip-path: inset(40% 0 30% 0); transform: translate(-2px, 0); }
        20% { clip-path: inset(0 0 0 0); transform: translate(0); }
      }
      @keyframes glitch {
        0%, 100% { transform: translate(0); filter: hue-rotate(0deg); }
        10% { transform: translate(-2px, -1px); }
        20% { transform: translate(2px, 1px); filter: hue-rotate(90deg); }
        30% { transform: translate(-1px, 2px); }
        40% { transform: translate(1px, -2px); filter: hue-rotate(180deg); }
        50% { transform: translate(-2px, 1px); }
        60% { transform: translate(2px, -1px); filter: hue-rotate(270deg); }
        70% { transform: translate(0, 2px); }
        80% { transform: translate(-1px, -1px); filter: hue-rotate(360deg); }
        90% { transform: translate(1px, 0); }
      }
      html[data-design-theme="cyberpunk"] .sg-intro-hero {
        text-align: center;
        padding: 80px 0 60px;
        margin-bottom: 80px;
        position: relative;
        border-bottom: 1px solid var(--border);
      }
      html[data-design-theme="cyberpunk"] .sg-intro-hero::after {
        content: '';
        position: absolute;
        bottom: -1px;
        left: 0; right: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--teal, var(--brand-blue)), var(--fuchsia, var(--brand-red)), transparent);
      }
      html[data-design-theme="cyberpunk"] .sg-intro-title {
        font-family: var(--font-display, var(--font-sans));
        font-size: clamp(36px, 6vw, 72px);
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--teal, var(--brand-blue));
        text-shadow: 0 0 8px currentColor, 0 0 30px currentColor;
        position: relative;
        display: inline-block;
        cursor: default;
      }
      html[data-design-theme="cyberpunk"] .sg-intro-title::before,
      html[data-design-theme="cyberpunk"] .sg-intro-title::after {
        content: attr(data-text);
        position: absolute;
        top: 0; left: 0;
        width: 100%;
        height: 100%;
      }
      html[data-design-theme="cyberpunk"] .sg-intro-title::before {
        color: var(--fuchsia, var(--brand-red));
        animation: glitch-text 3s infinite;
        z-index: -1;
      }
      html[data-design-theme="cyberpunk"] .sg-intro-title::after {
        color: var(--lime, var(--brand-yellow));
        animation: glitch-text 3s infinite reverse;
        z-index: -1;
      }
      html[data-design-theme="cyberpunk"] .sg-intro-title:hover { animation: glitch 0.3s infinite; }
      html[data-design-theme="cyberpunk"] .sg-intro-title:hover::before { animation: glitch-text 0.2s infinite; }
      html[data-design-theme="cyberpunk"] .sg-intro-title:hover::after { animation: glitch-text 0.2s infinite reverse; }
      html[data-design-theme="cyberpunk"] .sg-intro-subtitle {
        font-family: var(--font-mono);
        font-size: 14px;
        color: var(--text-secondary);
        margin-top: 16px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
      }
      html[data-design-theme="cyberpunk"] .sg-intro-meta {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 12px;
      }
      html[data-design-theme="cyberpunk"] .sg-intro-color-bar {
        display: flex;
        justify-content: center;
        gap: 0;
        margin-top: 32px;
      }
      html[data-design-theme="cyberpunk"] .sg-intro-color-bar span {
        height: 3px;
        flex: 1;
        max-width: 120px;
      }

  - name: Cyberpunk Branding Neon
    slug: branding-neon
    title: "Neon glow on branding card"
    description: "Cyberpunk-specific branding: void-panel logo area, cyan name glow, magenta labels, cyan tags."
    target-section: branding
    body: |
      html[data-design-theme="cyberpunk"] .product-branding-logo {
        background: var(--surface-inverse, #1e1e2a);
      }
      html[data-design-theme="cyberpunk"] .product-branding-name {
        font-family: var(--font-display, var(--font-sans));
        color: var(--teal);
        text-shadow: 0 0 8px rgba(0,255,240,0.5);
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      html[data-design-theme="cyberpunk"] .product-branding-field-label {
        color: var(--fuchsia);
        font-family: var(--font-display, var(--font-sans));
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      html[data-design-theme="cyberpunk"] .product-branding-tag {
        background: rgba(0,255,240,0.1);
        color: var(--teal);
        border: 1px solid rgba(0,255,240,0.15);
      }

  - name: Cyberpunk Font Entry Glow
    slug: font-entry-glow
    title: "Neon glow on font specimen names"
    description: "Display font and glow on font entry headings — the only custom bit."
    target-section: typography
    body: |
      html[data-design-theme="cyberpunk"] .font-entry-name {
        font-family: var(--font-display, var(--font-sans));
        text-shadow: 0 0 6px rgba(0,255,240,0.4);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

  - name: Cyberpunk Card Hover Glow
    slug: card-hover-glow
    title: "Animated gradient border on card hover"
    description: "Cards get a cyan→magenta animated gradient border on hover with lift effect."
    target-section: cards
    body: |
      @keyframes border-flow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      html[data-design-theme="cyberpunk"] .card {
        position: relative;
        transition: border-color 0.3s, transform 0.3s, box-shadow 0.3s;
      }
      html[data-design-theme="cyberpunk"] .card::before {
        content: '';
        position: absolute;
        top: -1px; left: -1px; right: -1px; bottom: -1px;
        border-radius: inherit;
        background: linear-gradient(135deg, #00fff0, #ff00aa, #00fff0);
        background-size: 200% 200%;
        z-index: -1;
        opacity: 0;
        transition: opacity 0.3s;
        animation: border-flow 3s ease infinite;
      }
      html[data-design-theme="cyberpunk"] .card:hover {
        border-color: transparent;
        transform: translateY(-2px);
      }
      html[data-design-theme="cyberpunk"] .card:hover::before {
        opacity: 1;
      }

  - name: Cyberpunk HUI Neon Effects
    slug: hui-neon-effects
    title: "Full cyberpunk treatment for HUI components"
    description: "Glow, gradients, animations, scan effects — the works."
    target-section: hui
    body: |
      @keyframes neon-pulse {
        0%, 100% { box-shadow: 0 0 8px rgba(0,255,240,0.3), inset 0 0 8px rgba(0,255,240,0.05); }
        50% { box-shadow: 0 0 16px rgba(0,255,240,0.5), inset 0 0 12px rgba(0,255,240,0.08); }
      }
      @keyframes gradient-shift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      /* ── Trigger buttons: glowing neon border ── */
      html[data-design-theme="cyberpunk"] .hui.menu-btn,
      html[data-design-theme="cyberpunk"] .hui.popover-btn {
        border-color: #2a2a3a;
        transition: all 0.25s;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-family: var(--font-display, var(--font-sans));
        font-size: 12px;
      }
      html[data-design-theme="cyberpunk"] .hui.menu-btn:hover,
      html[data-design-theme="cyberpunk"] .hui.menu-btn[data-open],
      html[data-design-theme="cyberpunk"] .hui.popover-btn:hover,
      html[data-design-theme="cyberpunk"] .hui.popover-btn[data-open] {
        border-color: #00fff0;
        box-shadow: 0 0 12px rgba(0,255,240,0.4), inset 0 0 20px rgba(0,255,240,0.06);
        color: #00fff0;
        text-shadow: 0 0 6px rgba(0,255,240,0.5);
      }

      /* ── Overlay panels: gradient top bar + deep glow ── */
      html[data-design-theme="cyberpunk"] .hui.menu-items,
      html[data-design-theme="cyberpunk"] .hui.listbox-options,
      html[data-design-theme="cyberpunk"] .hui.combo-options,
      html[data-design-theme="cyberpunk"] .hui.popover-panel {
        border: 1px solid #2a2a3a;
        border-top: 2px solid;
        border-image: linear-gradient(90deg, #00fff0, #ff00aa) 1;
        box-shadow: 0 12px 40px rgba(0,0,0,0.7), 0 0 1px rgba(0,255,240,0.3), inset 0 1px 0 rgba(0,255,240,0.05);
      }

      /* ── Active items: neon highlight bar ── */
      html[data-design-theme="cyberpunk"] .hui.menu-item[data-active],
      html[data-design-theme="cyberpunk"] .hui.listbox-option[data-active],
      html[data-design-theme="cyberpunk"] .hui.combo-option[data-active] {
        background: linear-gradient(90deg, rgba(0,255,240,0.12), rgba(0,255,240,0.03));
        color: #00fff0;
        border-left: 2px solid #00fff0;
        padding-left: calc(var(--hui-panel-item-padding-x) - 2px);
      }

      /* ── Input fields: void depth + neon focus ── */
      html[data-design-theme="cyberpunk"] .hui.combo-input,
      html[data-design-theme="cyberpunk"] .hui.listbox-btn {
        transition: all 0.25s;
      }
      html[data-design-theme="cyberpunk"] .hui.combo-input:focus {
        border-color: #00fff0;
        box-shadow: 0 0 0 2px rgba(0,255,240,0.15), 0 0 20px rgba(0,255,240,0.1), inset 0 0 12px rgba(0,0,0,0.4);
      }
      html[data-design-theme="cyberpunk"] .hui.listbox-btn[data-open] {
        border-color: #00fff0;
        box-shadow: 0 0 0 2px rgba(0,255,240,0.15), 0 0 20px rgba(0,255,240,0.1);
      }

      /* ── Checkbox: neon check glow ── */
      html[data-design-theme="cyberpunk"] .hui.checkbox-wrap[data-checked] .checkbox-visual {
        box-shadow: 0 0 10px rgba(0,255,240,0.5), 0 0 3px rgba(0,255,240,0.8);
        border-color: transparent;
      }

      /* ── Switch: glowing track + illuminated thumb ── */
      html[data-design-theme="cyberpunk"] .hui.switch-wrap[data-checked] .switch-track {
        box-shadow: 0 0 14px rgba(0,255,240,0.5), inset 0 0 6px rgba(0,255,240,0.3);
      }
      html[data-design-theme="cyberpunk"] .hui.switch-wrap[data-checked] .switch-thumb {
        box-shadow: 0 0 8px rgba(0,255,240,0.6), 0 1px 3px rgba(0,0,0,0.4);
      }
      html[data-design-theme="cyberpunk"] .hui.switch-wrap:not([data-checked]) .switch-track {
        background: #1e1e2a;
        border: 1px solid #2a2a3a;
      }

      /* ── Radio: neon ring pulse when selected ── */
      html[data-design-theme="cyberpunk"] .hui.radio-option[data-checked] {
        border-color: #00fff0;
        background: rgba(0,255,240,0.04);
        box-shadow: inset 0 0 16px rgba(0,255,240,0.06), 0 0 6px rgba(0,255,240,0.15);
      }
      html[data-design-theme="cyberpunk"] .hui.radio-option[data-checked] .radio-dot {
        box-shadow: 0 0 8px rgba(0,255,240,0.5);
      }

      /* ── Tabs: glowing underline + text glow ── */
      html[data-design-theme="cyberpunk"] .hui.tab {
        font-family: var(--font-display, var(--font-sans));
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 11px;
        transition: all 0.25s;
      }
      html[data-design-theme="cyberpunk"] .hui.tab[data-selected] {
        text-shadow: 0 0 10px rgba(0,255,240,0.6);
        border-bottom-color: #00fff0;
        filter: drop-shadow(0 2px 4px rgba(0,255,240,0.3));
      }
      html[data-design-theme="cyberpunk"] .hui.tab[data-hover]:not([data-selected]) {
        text-shadow: 0 0 6px rgba(0,255,240,0.3);
      }

      /* ── Disclosure: cyberpunk accordion ── */
      html[data-design-theme="cyberpunk"] .hui.disclosure-btn {
        font-family: var(--font-display, var(--font-sans));
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-size: 12px;
        transition: all 0.25s;
        border-left: 2px solid transparent;
      }
      html[data-design-theme="cyberpunk"] .hui.disclosure-btn:hover {
        border-left-color: #00fff0;
        box-shadow: inset 4px 0 12px rgba(0,255,240,0.06);
        background: #181822;
      }
      html[data-design-theme="cyberpunk"] .hui.disclosure-btn[data-open] {
        border-left-color: #00fff0;
        background: #181822;
        box-shadow: inset 4px 0 16px rgba(0,255,240,0.08);
      }
      html[data-design-theme="cyberpunk"] .hui.disclosure-panel {
        border-left: 1px solid #2a2a3a;
        margin-left: 2px;
      }

      /* ── Dialog: neon frame ── */
      html[data-design-theme="cyberpunk"] .hui.dialog-panel {
        border: 1px solid #2a2a3a;
        border-top: 2px solid;
        border-image: linear-gradient(90deg, #00fff0, #ff00aa) 1;
        box-shadow: 0 32px 80px rgba(0,0,0,0.8), 0 0 2px rgba(0,255,240,0.3), inset 0 1px 0 rgba(0,255,240,0.05);
      }
      html[data-design-theme="cyberpunk"] .hui.dialog-title {
        font-family: var(--font-display, var(--font-sans));
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      /* ── Showcase grid: neon frame ── */
      html[data-design-theme="cyberpunk"] .hui.showcase {
        box-shadow: 0 0 1px rgba(0,255,240,0.2);
      }
      html[data-design-theme="cyberpunk"] .showcase-cell-name {
        font-family: var(--font-display, var(--font-sans));
        letter-spacing: 0.1em;
      }

  - name: Cyberpunk Effects & Dashboard
    slug: cyberpunk-effects
    title: "Neon effects grid and agent dashboard"
    description: "Glitch, flicker, glow, gradient-border, scanline, and typing effects plus a 3-panel agent dashboard — all cyberpunk-themed."
    target-section: ink-effects
    body: |
      /* ── Keyframes ── */
      @keyframes cyber-glitch {
        0%, 100% { transform: translate(0); filter: hue-rotate(0deg); }
        10% { transform: translate(-2px, -1px); filter: hue-rotate(90deg); }
        20% { transform: translate(2px, 1px); }
        30% { transform: translate(-1px, 2px); filter: hue-rotate(180deg); }
        40% { transform: translate(1px, -1px); }
        50% { transform: translate(-2px, 1px); filter: hue-rotate(270deg); }
        60% { transform: translate(2px, -1px); }
        70% { transform: translate(0, 2px); filter: hue-rotate(360deg); }
        80% { transform: translate(-1px, 0); }
        90% { transform: translate(1px, -2px); }
      }
      @keyframes neon-flicker {
        0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; text-shadow: 0 0 8px rgba(0,255,240,0.8), 0 0 30px rgba(0,255,240,0.3); }
        20%, 24%, 55% { opacity: 0.6; text-shadow: none; }
      }
      @keyframes glow-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
      }
      @keyframes gradient-border-flow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      @keyframes scanline-sweep {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(100vh); }
      }
      @keyframes typing-cursor {
        0%, 100% { border-right-color: var(--teal); }
        50% { border-right-color: transparent; }
      }
      @keyframes typing-width {
        0% { width: 0; }
        100% { width: 100%; }
      }
      @keyframes status-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }

      /* ── Effects Grid ── */
      html[data-design-theme="cyberpunk"] .effects-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: var(--space-3);
        margin-bottom: var(--space-5);
      }
      html[data-design-theme="cyberpunk"] .effect-card {
        background: var(--gray-900, #0a0a0f);
        border: 1px solid var(--gray-50, #2a2a3a);
        border-radius: var(--radius-md, 8px);
        padding: var(--space-4) var(--space-3);
        text-align: center;
        min-height: 160px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--space-2);
        overflow: hidden;
        position: relative;
        transition: border-color 0.3s, box-shadow 0.3s;
      }
      html[data-design-theme="cyberpunk"] .effect-card:hover {
        border-color: var(--teal);
        box-shadow: 0 0 12px rgba(0,255,240,0.2);
      }
      html[data-design-theme="cyberpunk"] .effect-demo {
        height: 80px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: var(--space-2);
        position: relative;
        overflow: hidden;
      }
      html[data-design-theme="cyberpunk"] .effect-label {
        font-family: var(--font-display);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--text-secondary, #aaaabc);
      }

      /* 1. Glitch (replaces Ink Bleed) */
      html[data-design-theme="cyberpunk"] .effect-demo--ink-bleed .ink-bleed-kanji {
        font-size: 48px;
        color: var(--teal);
        text-shadow: 0 0 8px var(--teal);
        animation: cyber-glitch 2s infinite;
      }

      /* 2. Neon Flicker (replaces Brush-in) */
      html[data-design-theme="cyberpunk"] .effect-demo--brush-in .brush-in-text {
        font-family: var(--font-display);
        font-size: 28px;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--teal);
        animation: neon-flicker 3s infinite;
      }

      /* 3. Glow Pulse (replaces Breath) */
      html[data-design-theme="cyberpunk"] .effect-demo--breath .breath-circle {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: radial-gradient(circle, var(--fuchsia), transparent 70%);
        animation: glow-pulse 3s ease-in-out infinite;
      }

      /* 4. Gradient Border (replaces Seal Stamp) */
      html[data-design-theme="cyberpunk"] .effect-demo--seal-stamp {
        position: relative;
      }
      html[data-design-theme="cyberpunk"] .effect-demo--seal-stamp::before {
        content: '';
        position: absolute;
        inset: 8px;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--teal), var(--fuchsia), var(--lime), var(--teal));
        background-size: 300% 300%;
        animation: gradient-border-flow 4s ease infinite;
        z-index: 0;
        opacity: 0.8;
      }
      html[data-design-theme="cyberpunk"] .effect-demo--seal-stamp .seal-stamp-glyph {
        position: relative;
        z-index: 1;
        font-size: 36px;
        color: var(--gray-900, #0a0a0f);
        text-shadow: none;
      }

      /* 5. Scanline Sweep (replaces Ink Wash) */
      html[data-design-theme="cyberpunk"] .effect-demo--ink-wash {
        position: relative;
      }
      html[data-design-theme="cyberpunk"] .effect-demo--ink-wash .ink-wash-bar {
        width: 100%;
        height: 100%;
        background: linear-gradient(180deg, var(--teal), var(--fuchsia));
        opacity: 0.15;
        border-radius: 4px;
      }
      html[data-design-theme="cyberpunk"] .effect-demo--ink-wash::after {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 4px;
        background: var(--teal);
        box-shadow: 0 0 12px var(--teal);
        animation: scanline-sweep 2s linear infinite;
      }

      /* 6. Typing (replaces Fade Up) */
      html[data-design-theme="cyberpunk"] .effect-demo--fade-up .fade-up-text {
        font-family: var(--font-mono);
        font-size: 18px;
        color: var(--lime);
        overflow: hidden;
        white-space: nowrap;
        border-right: 2px solid var(--teal);
        animation: typing-width 3s steps(9) infinite, typing-cursor 0.6s step-end infinite;
      }

      /* ── Agent Dashboard ── */
      html[data-design-theme="cyberpunk"] .agent-dashboard {
        display: grid;
        grid-template-columns: 1fr 1.5fr 1fr;
        gap: var(--space-3);
        margin-top: var(--space-4);
      }
      html[data-design-theme="cyberpunk"] .dashboard-panel {
        background: var(--gray-900, #0a0a0f);
        border: 1px solid var(--gray-50, #2a2a3a);
        border-radius: var(--radius-md, 8px);
        padding: var(--space-3);
      }
      html[data-design-theme="cyberpunk"] .dashboard-panel-title {
        font-family: var(--font-display);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: var(--teal);
        margin-bottom: var(--space-2);
        text-shadow: 0 0 6px rgba(0,255,240,0.4);
      }

      /* Stories panel */
      html[data-design-theme="cyberpunk"] .story-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      html[data-design-theme="cyberpunk"] .story-item {
        font-family: var(--font-mono);
        font-size: 12px;
        padding: 6px 8px;
        border-left: 2px solid transparent;
        color: var(--text-secondary, #aaaabc);
        transition: background 0.2s;
      }
      html[data-design-theme="cyberpunk"] .story-item--active {
        border-left-color: var(--teal);
        background: rgba(0,255,240,0.06);
        color: var(--teal);
      }
      html[data-design-theme="cyberpunk"] .story-item--done {
        color: var(--gray-400, #555570);
        text-decoration: line-through;
        text-decoration-color: var(--gray-300, #555570);
      }
      html[data-design-theme="cyberpunk"] .story-item--queued {
        color: var(--text-muted, #555570);
      }
      html[data-design-theme="cyberpunk"] .story-id {
        color: var(--fuchsia);
        margin-right: 8px;
      }

      /* Live Output panel */
      html[data-design-theme="cyberpunk"] .dashboard-panel--output {
        background: var(--black, #050508);
        border-color: var(--gray-50, #2a2a3a);
      }
      html[data-design-theme="cyberpunk"] .live-output {
        font-family: var(--font-mono);
        font-size: 12px;
        line-height: 1.8;
      }
      html[data-design-theme="cyberpunk"] .output-line {
        color: var(--lime);
        padding: 2px 0;
      }
      html[data-design-theme="cyberpunk"] .output-line--active {
        color: var(--teal);
      }
      html[data-design-theme="cyberpunk"] .output-line--active::after {
        content: '';
        display: inline-block;
        width: 6px;
        height: 6px;
        background: var(--lime);
        border-radius: 50%;
        margin-left: 8px;
        animation: status-pulse 1.5s ease infinite;
      }
      html[data-design-theme="cyberpunk"] .output-ts {
        color: var(--gray-400, #555570);
        margin-right: 8px;
      }

      /* Agent controls */
      html[data-design-theme="cyberpunk"] .agent-controls {
        display: flex;
        gap: var(--space-2);
        margin-top: var(--space-3);
      }
      html[data-design-theme="cyberpunk"] .agent-btn {
        font-family: var(--font-display);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        padding: 6px 16px;
        border: 1px solid var(--gray-50, #2a2a3a);
        border-radius: var(--radius-sm, 4px);
        background: transparent;
        color: var(--text-secondary, #aaaabc);
        cursor: pointer;
        transition: all 0.25s;
      }
      html[data-design-theme="cyberpunk"] .agent-btn:hover {
        border-color: var(--teal);
        color: var(--teal);
        box-shadow: 0 0 8px rgba(0,255,240,0.25);
        text-shadow: 0 0 6px rgba(0,255,240,0.4);
      }
      html[data-design-theme="cyberpunk"] .agent-btn--primary {
        background: var(--teal);
        color: var(--black, #050508);
        border-color: var(--teal);
        font-weight: 700;
      }
      html[data-design-theme="cyberpunk"] .agent-btn--primary:hover {
        box-shadow: 0 0 16px rgba(0,255,240,0.5);
        color: var(--black, #050508);
      }

      /* Criteria panel */
      html[data-design-theme="cyberpunk"] .criteria-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      html[data-design-theme="cyberpunk"] .criteria-item {
        font-family: var(--font-mono);
        font-size: 12px;
        padding: 6px 0;
        color: var(--text-secondary, #aaaabc);
      }
      html[data-design-theme="cyberpunk"] .criteria-item::before {
        margin-right: 8px;
        font-size: 10px;
      }
      html[data-design-theme="cyberpunk"] .criteria-item--done::before {
        content: '\2713';
        color: var(--lime);
      }
      html[data-design-theme="cyberpunk"] .criteria-item--done {
        color: var(--gray-400, #555570);
      }
      html[data-design-theme="cyberpunk"] .criteria-item--pending::before {
        content: '\25CB';
        color: var(--fuchsia);
      }

      /* ── Code Widget Grid ── */
      html[data-design-theme="cyberpunk"] .widget-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: var(--space-3);
        margin-bottom: var(--space-5);
      }
      html[data-design-theme="cyberpunk"] .code-widget {
        background: #0a0a0f;
        border: 1px solid #2a2a3a;
        border-radius: var(--radius-md, 8px);
        overflow: hidden;
      }
      html[data-design-theme="cyberpunk"] .code-widget-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 12px;
        background: #111118;
        border-bottom: 1px solid #2a2a3a;
      }
      html[data-design-theme="cyberpunk"] .code-widget-title {
        font-family: var(--font-display);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: var(--teal);
        text-shadow: 0 0 6px rgba(0,255,240,0.4);
      }
      html[data-design-theme="cyberpunk"] .code-widget-badge {
        font-family: var(--font-mono);
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        padding: 2px 8px;
        border-radius: 3px;
        border: 1px solid;
      }
      html[data-design-theme="cyberpunk"] .code-widget-badge--syntax {
        color: var(--fuchsia);
        border-color: rgba(255,0,170,0.3);
        background: rgba(255,0,170,0.08);
      }
      html[data-design-theme="cyberpunk"] .code-widget-badge--cli {
        color: var(--lime);
        border-color: rgba(0,255,65,0.3);
        background: rgba(0,255,65,0.08);
      }
      html[data-design-theme="cyberpunk"] .code-widget-dots {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 12px;
        border-bottom: 1px solid #2a2a3a;
      }
      html[data-design-theme="cyberpunk"] .code-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
      }
      html[data-design-theme="cyberpunk"] .code-dot--red { background: #ff5f57; }
      html[data-design-theme="cyberpunk"] .code-dot--yellow { background: #febc2e; }
      html[data-design-theme="cyberpunk"] .code-dot--green { background: #28c840; }
      html[data-design-theme="cyberpunk"] .code-widget-filename {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-muted, #555570);
        margin-left: 8px;
      }
      html[data-design-theme="cyberpunk"] .code-widget-body {
        font-family: var(--font-mono);
        font-size: 12px;
        line-height: 1.7;
        padding: 16px;
        margin: 0;
        color: var(--text-secondary, #aaaabc);
        white-space: pre;
        overflow-x: auto;
      }
      html[data-design-theme="cyberpunk"] .code-widget-desc {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-muted, #555570);
        padding: 8px 16px 12px;
        border-top: 1px solid #2a2a3a;
      }

      /* Syntax highlighting */
      html[data-design-theme="cyberpunk"] .code-comment { color: #555570; font-style: italic; }
      html[data-design-theme="cyberpunk"] .code-keyword { color: var(--fuchsia); }
      html[data-design-theme="cyberpunk"] .code-function { color: var(--teal); }
      html[data-design-theme="cyberpunk"] .code-string { color: var(--lime); }
      html[data-design-theme="cyberpunk"] .code-number { color: var(--orange, #ff9f43); }

      /* Terminal variant */
      html[data-design-theme="cyberpunk"] .code-widget--terminal .code-widget-body {
        color: var(--lime);
      }
      html[data-design-theme="cyberpunk"] .code-prompt { color: var(--teal); }
      html[data-design-theme="cyberpunk"] .code-output { color: var(--text-muted, #555570); }
      html[data-design-theme="cyberpunk"] .code-success { color: var(--lime); font-weight: 700; }

      /* ── Effects Subsection ── */
      html[data-design-theme="cyberpunk"] .effects-subsection-title {
        font-family: var(--font-display);
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: var(--teal);
        text-shadow: 0 0 6px rgba(0,255,240,0.4);
        margin-bottom: var(--space-1, 4px);
      }
      html[data-design-theme="cyberpunk"] .effects-subsection-desc {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--text-muted, #555570);
        margin-bottom: var(--space-3);
      }

      /* ── New Effect Demos ── */
      html[data-design-theme="cyberpunk"] .scanline-demo {
        font-family: var(--font-display);
        font-size: 28px;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--teal);
        text-shadow: 0 0 8px rgba(0,255,240,0.8), 0 0 30px rgba(0,255,240,0.3);
      }
      html[data-design-theme="cyberpunk"] .effect-card--scanline {
        position: relative;
        overflow: hidden;
      }
      html[data-design-theme="cyberpunk"] .effect-card--scanline::after {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 4px;
        background: rgba(0,255,240,0.1);
        animation: scanline-sweep 4s linear infinite;
      }
      html[data-design-theme="cyberpunk"] .glitch-demo {
        font-family: var(--font-display);
        font-size: 32px;
        font-weight: 900;
        text-transform: uppercase;
        color: var(--text-primary, #e0e0e8);
        position: relative;
        animation: cyber-glitch 0.5s infinite;
      }
      html[data-design-theme="cyberpunk"] .neon-flicker-demo {
        font-family: var(--font-display);
        font-size: 28px;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--teal);
        animation: neon-flicker 3s infinite;
      }
      html[data-design-theme="cyberpunk"] .glow-pulse-demo {
        display: inline-block;
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: var(--fuchsia);
        box-shadow: 0 0 20px var(--fuchsia), 0 0 60px rgba(255,0,170,0.3);
        animation: glow-pulse 2s ease-in-out infinite;
      }
      html[data-design-theme="cyberpunk"] .gradient-border-demo {
        padding: 24px 32px;
        background: var(--gray-900, #111118);
        border-radius: 4px;
        position: relative;
        z-index: 1;
      }
      html[data-design-theme="cyberpunk"] .gradient-border-demo::before {
        content: '';
        position: absolute;
        top: -2px; left: -2px; right: -2px; bottom: -2px;
        background: linear-gradient(45deg, var(--teal), var(--fuchsia), var(--lime), var(--teal));
        background-size: 300% 300%;
        border-radius: inherit;
        z-index: -1;
        animation: gradient-border-flow 4s ease infinite;
      }
      html[data-design-theme="cyberpunk"] .gradient-border-inner {
        font-family: var(--font-display);
        font-size: 14px;
        font-weight: 400;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--text-primary, #e0e0e8);
      }
      html[data-design-theme="cyberpunk"] .typing-demo {
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--lime);
        white-space: nowrap;
        overflow: hidden;
        border-right: 2px solid var(--teal);
        width: fit-content;
        animation: typing-width 3s steps(30) infinite, typing-cursor 0.8s step-end infinite;
      }

      /* ── Responsive ── */
      @media (max-width: 900px) {
        html[data-design-theme="cyberpunk"] .agent-dashboard {
          grid-template-columns: 1fr;
        }
        html[data-design-theme="cyberpunk"] .widget-grid {
          grid-template-columns: 1fr;
        }
      }

      /* ── Reduced Motion ── */
      @media (prefers-reduced-motion: reduce) {
        html[data-design-theme="cyberpunk"] .effect-demo--ink-bleed .ink-bleed-kanji,
        html[data-design-theme="cyberpunk"] .effect-demo--brush-in .brush-in-text,
        html[data-design-theme="cyberpunk"] .effect-demo--breath .breath-circle,
        html[data-design-theme="cyberpunk"] .effect-demo--seal-stamp::before,
        html[data-design-theme="cyberpunk"] .effect-demo--ink-wash::after,
        html[data-design-theme="cyberpunk"] .effect-demo--fade-up .fade-up-text,
        html[data-design-theme="cyberpunk"] .output-line--active::after,
        html[data-design-theme="cyberpunk"] .glitch-demo,
        html[data-design-theme="cyberpunk"] .neon-flicker-demo,
        html[data-design-theme="cyberpunk"] .glow-pulse-demo,
        html[data-design-theme="cyberpunk"] .gradient-border-demo,
        html[data-design-theme="cyberpunk"] .effect-card--scanline::after,
        html[data-design-theme="cyberpunk"] .typing-demo {
          animation: none;
        }
      }

  - name: Cyberpunk Screens
    slug: cyberpunk-screens
    title: "Neon screen compositions"
    description: "Landing page and settings page mock-ups with cyberpunk frame chrome, neon typography, and void surfaces."
    target-section: screens
    body: |
      /* ── Screen Frame ── */
      html[data-design-theme="cyberpunk"] .screen-frame {
        border: 1px solid var(--gray-50, #2a2a3a);
        border-radius: var(--radius-md, 8px);
        overflow: hidden;
        box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        background: var(--gray-900, #0a0a0f);
      }
      html[data-design-theme="cyberpunk"] .screen-titlebar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 10px 14px;
        background: var(--gray-800, #111118);
        border-bottom: 1px solid var(--gray-50, #2a2a3a);
      }
      html[data-design-theme="cyberpunk"] .screen-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
      }
      html[data-design-theme="cyberpunk"] .screen-dot:nth-child(1) { background: #ff5f57; }
      html[data-design-theme="cyberpunk"] .screen-dot:nth-child(2) { background: #febc2e; }
      html[data-design-theme="cyberpunk"] .screen-dot:nth-child(3) { background: #28c840; }
      html[data-design-theme="cyberpunk"] .screen-url {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-muted, #555570);
        background: var(--gray-900, #0a0a0f);
        padding: 2px 10px;
        border-radius: 4px;
        margin-left: 8px;
      }
      html[data-design-theme="cyberpunk"] .screen-label { margin-left: auto;
        display: block;
        font-family: var(--font-display);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: var(--fuchsia);
        padding: 8px 14px 0;
      }
      html[data-design-theme="cyberpunk"] .screen-body {
        zoom: 0.65;
        background: var(--gray-900, #0a0a0f);
        overflow: visible;
        aspect-ratio: auto;
        padding: 0;
        display: block;
      }

      /* ── Neon Divider ── */
      html[data-design-theme="cyberpunk"] .screen-body .hr.section {
        border: none;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--teal), var(--fuchsia), transparent);
        margin: var(--space-4) 0;
      }

      /* ── Landing Page ── */
      html[data-design-theme="cyberpunk"] .screen-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: var(--space-5);
      }
      html[data-design-theme="cyberpunk"] .screen-nav-wordmark {
        font-family: var(--font-display);
        font-size: 16px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--teal);
        text-shadow: 0 0 8px rgba(0,255,240,0.5);
      }
      html[data-design-theme="cyberpunk"] .screen-nav-links {
        display: flex;
        gap: var(--space-3);
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--text-secondary, #aaaabc);
      }
      html[data-design-theme="cyberpunk"] .screen-nav-links span {
        cursor: pointer;
        transition: color 0.2s, text-shadow 0.2s;
      }
      html[data-design-theme="cyberpunk"] .screen-nav-links span:hover {
        color: var(--teal);
        text-shadow: 0 0 6px rgba(0,255,240,0.4);
      }
      html[data-design-theme="cyberpunk"] .screen-hero {
        text-align: center;
        padding: var(--space-5) 0;
      }
      html[data-design-theme="cyberpunk"] .screen-hero .typography-display {
        text-shadow: 0 0 12px rgba(0,255,240,0.5), 0 0 30px rgba(0,255,240,0.2);
      }
      html[data-design-theme="cyberpunk"] .screen-hero .typography-body {
        margin-top: var(--space-3);
        max-width: 480px;
        margin-left: auto;
        margin-right: auto;
      }
      html[data-design-theme="cyberpunk"] .screen-hero-actions {
        display: flex;
        justify-content: center;
        gap: var(--space-2);
        margin-top: var(--space-4);
      }

      /* ── Feature Cards ── */
      html[data-design-theme="cyberpunk"] .screen-features {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: var(--space-3);
      }
      /* ── Settings Page ── */
      html[data-design-theme="cyberpunk"] .settings-header {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        margin-bottom: var(--space-4);
      }
      html[data-design-theme="cyberpunk"] .settings-layout {
        display: grid;
        grid-template-columns: 160px 1fr;
        gap: var(--space-3);
      }
      html[data-design-theme="cyberpunk"] .screen-sidebar {
        display: flex;
        flex-direction: column;
        gap: 2px;
        background: var(--gray-800, #111118);
        border: 1px solid var(--gray-50, #2a2a3a);
        border-radius: var(--radius-md, 8px);
        padding: var(--space-2);
      }
      html[data-design-theme="cyberpunk"] .screen-sidebar-item {
        font-family: var(--font-mono);
        font-size: 12px;
        padding: 8px 12px;
        border-radius: 4px;
        color: var(--text-secondary, #aaaabc);
        cursor: pointer;
        transition: all 0.2s;
      }
      html[data-design-theme="cyberpunk"] .screen-sidebar-item:hover {
        background: rgba(0,255,240,0.06);
        color: var(--teal);
      }
      html[data-design-theme="cyberpunk"] .screen-sidebar-item.active {
        background: rgba(0,255,240,0.1);
        color: var(--teal);
        border-left: 2px solid var(--teal);
      }
      html[data-design-theme="cyberpunk"] .settings-content {
        display: flex;
        flex-direction: column;
        gap: var(--space-2);
      }
      html[data-design-theme="cyberpunk"] .screen-form-actions {
        display: flex;
        gap: var(--space-2);
        margin-top: var(--space-3);
      }

      /* ── Dashboard Screen ── */
      html[data-design-theme="cyberpunk"] .screen-dashboard-grid {
        display: grid;
        grid-template-columns: 1fr 1.5fr 1fr;
        gap: var(--space-2);
      }
      html[data-design-theme="cyberpunk"] .screen-dashboard-panel {
        background: var(--gray-800, #111118);
        border: 1px solid var(--gray-50, #2a2a3a);
        border-radius: var(--radius-md, 8px);
        padding: var(--space-2);
      }
      html[data-design-theme="cyberpunk"] .screen-dashboard-panel--output {
        background: var(--black, #050508);
      }
      html[data-design-theme="cyberpunk"] .screen-dashboard-panel .typography-label {
        margin-bottom: var(--space-1, 4px);
      }
      html[data-design-theme="cyberpunk"] .screen-dashboard-story {
        font-family: var(--font-mono);
        font-size: 11px;
        padding: 4px 6px;
        color: var(--text-muted, #555570);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      html[data-design-theme="cyberpunk"] .screen-dashboard-story.done {
        color: var(--gray-400, #555570);
        text-decoration: line-through;
      }
      html[data-design-theme="cyberpunk"] .screen-dashboard-story.active {
        color: var(--teal);
        border-left: 2px solid var(--teal);
        background: rgba(0,255,240,0.06);
        padding-left: 4px;
      }
      html[data-design-theme="cyberpunk"] .screen-dashboard-ts {
        color: var(--gray-400, #555570);
        margin-right: 6px;
      }
      html[data-design-theme="cyberpunk"] .screen-dashboard-line-active {
        color: var(--teal);
      }
      html[data-design-theme="cyberpunk"] .screen-dashboard-criteria {
        font-family: var(--font-mono);
        font-size: 11px;
        padding: 3px 0;
        color: var(--text-secondary, #aaaabc);
      }
      html[data-design-theme="cyberpunk"] .screen-dashboard-criteria::before {
        margin-right: 6px;
        font-size: 9px;
      }
      html[data-design-theme="cyberpunk"] .screen-dashboard-criteria.done::before {
        content: '\2713';
        color: var(--lime);
      }
      html[data-design-theme="cyberpunk"] .screen-dashboard-criteria.done {
        color: var(--gray-400, #555570);
      }
      html[data-design-theme="cyberpunk"] .screen-dashboard-criteria.pending::before {
        content: '\25CB';
        color: var(--fuchsia);
      }

      /* ── Responsive ── */
      @media (max-width: 900px) {
        html[data-design-theme="cyberpunk"] .screen-features {
          grid-template-columns: 1fr;
        }
        html[data-design-theme="cyberpunk"] .settings-layout {
          grid-template-columns: 1fr;
        }
        html[data-design-theme="cyberpunk"] .screen-dashboard-grid {
          grid-template-columns: 1fr;
        }
      }

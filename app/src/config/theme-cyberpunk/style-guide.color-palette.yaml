color-palette:
  - group: "Void — Dark Surfaces"
    description: "The void palette. Near-black surfaces with blue undertones."
    colors:
      - name: Surface
        value: "var(--surface)"
        cssClass: surface
      - name: Surface Alt
        value: "var(--surface-alt)"
        cssClass: surface-alt
      - name: Surface Inverse
        value: "var(--surface-inverse)"
        cssClass: surface-inverse
      - name: Border
        value: "var(--border)"
        cssClass: border
      - name: Border Strong
        value: "var(--border-strong)"
        cssClass: border-strong

  - group: "Neon — Accent Colors"
    description: "Neon on void. Every glow earns its place."
    colors:
      - name: Cyan
        value: "var(--teal)"
        cssClass: teal
      - name: Magenta
        value: "var(--fuchsia)"
        cssClass: fuchsia
      - name: Lime
        value: "var(--lime)"
        cssClass: lime
      - name: Pink
        value: "var(--pink)"
        cssClass: pink
      - name: Blue
        value: "var(--indigo)"
        cssClass: indigo
      - name: Violet
        value: "var(--violet)"
        cssClass: violet
      - name: Orange
        value: "var(--orange)"
        cssClass: orange
    notes:
      - label: "Cyan"
        text: "Primary accent. Links, active states, focus rings, neon glow."
        cssClass: teal
      - label: "Magenta"
        text: "Secondary accent. Section headers, focus outlines, gradient pair."
        cssClass: fuchsia
      - label: "Lime"
        text: "Code output, success, terminal text, matrix vibes."
        cssClass: lime
      - label: "Pink"
        text: "Danger, hot states, error glows, warning borders."
        cssClass: pink
      - label: "Blue"
        text: "Info states, links, type annotations."
        cssClass: indigo
      - label: "Violet"
        text: "Type annotations, decorative accents."
        cssClass: violet

  - group: Semantic
    description: "Functional state colors — success, warning, error, info."
    colors:
      - name: Success
        value: "var(--success)"
        cssClass: success
      - name: Success Tint
        value: "var(--success-tint)"
        cssClass: success-tint
      - name: Warning
        value: "var(--warning)"
        cssClass: warning
      - name: Warning Tint
        value: "var(--warning-tint)"
        cssClass: warning-tint
      - name: Error
        value: "var(--error)"
        cssClass: error
      - name: Error Tint
        value: "var(--error-tint)"
        cssClass: error-tint
      - name: Info
        value: "var(--info)"
        cssClass: info
      - name: Info Tint
        value: "var(--info-tint)"
        cssClass: info-tint

  - group: "Text Hierarchy"
    description: "Four levels of text prominence. Primary speaks, ghost whispers."
    colors:
      - name: Text
        value: "var(--text)"
        cssClass: text
      - name: Text Secondary
        value: "var(--text-secondary)"
        cssClass: text-secondary
      - name: Text Muted
        value: "var(--text-muted)"
        cssClass: text-muted
      - name: Text Inverse
        value: "var(--text-inverse)"
        cssClass: text-inverse

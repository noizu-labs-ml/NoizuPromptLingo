# Dev-mode overrides — run with:
#   docker compose -f docker-compose.yaml -f docker-compose.dev.yaml up
#   or: make run-dev
#
# Mounts source as volumes, runs dev servers instead of compiled releases.
# First run: deps install (~1-2 min). Subsequent starts are fast (named volumes).

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    image: ${PROJECT_DIR:-start-app}/backend:dev
    command: >
      bash -c "mix deps.get && mix ecto.create 2>/dev/null; mix ecto.migrate && mix phx.server"
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_build:/app/_build
      - backend_deps:/app/deps
    env_file:
      - .env
      - backend/.env
    environment:
      MIX_ENV: dev
      PHX_SERVER: "true"
      PHX_IP: "0.0.0.0"
      PORT: "4000"
      DB_HOST: db
    expose:
      - "4000"
    restart: "no"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    image: ${PROJECT_DIR:-start-app}/frontend:dev
    command: >
      sh -c "
        if [ -f .npmrc.template ]; then
          GITHUB_TOKEN=$${GITHUB_TOKEN} envsubst < .npmrc.template > .npmrc;
        fi &&
        npm install &&
        npm run regen &&
        npm run dev
      "
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    env_file: .env
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      GITHUB_TOKEN: "${GITHUB_TOKEN}"
    expose:
      - "3000"
    restart: "no"

  # nginx: no overrides — inherits production config as-is.
  # HMR websocket proxy (/_next/webpack-hmr) already configured.

volumes:
  backend_build:
  backend_deps:
  frontend_node_modules:

[package]
name = "secret-bucket"
version = "0.1.0"
edition = "2021"
description = "Agent-safe local secret bucket manipulation"
license = "MIT"
authors = ["Keith Brings <keith.brings@noizu.com>"]

[[bin]]
name = "secret-bucket"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
strip = true

# Page Inventory Template
# Copy to .npl/sites/{domain}/pages/{page-slug}.yaml and fill in

page: page-slug
url_pattern: /path
title: "Page Title"
requires_auth: false

elements:
  - id: element-id
    type: button  # input | button | link | select | container | repeating | navigation | media | form | modal | toast
    selector: "[data-testid='element-id']"
    description: "What this element is"
    actions: [click]  # click | type | submit | select | deselect | scroll | hover | play | pause
    # leads_to: other-page  # if clicking navigates elsewhere
    # children:             # for container types
    #   - id: child-id
    #     type: repeating
    #     selector: ".child"
    #     actions: [click]

affordances:
  - "verb phrase describing what users can do"

exit_points:
  - page: other-page
    via: "how users get there"

# Optional: for pages with dynamic content
# dynamic:
#   type: search-results  # filtered | paginated | infinite-scroll
#   empty_state: "No results"
#   loading_state: "Loading..."
#   depends_on: search-query

<!DOCTYPE html>
<html lang="en" data-design-theme="blueprint">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>noizu.ink — BLUEPRINT Style Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Barlow+Condensed:wght@300;400;500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="module">
    import * as HeadlessUI from 'https://esm.sh/@headlessui/react@2.2.4?external=react,react-dom';
    window.HeadlessUI = HeadlessUI;
    window.dispatchEvent(new Event('headlessui-ready'));
  </script>

  <script crossorigin src="https://noizu.github.io/react-assets/dist/sg.js"></script>
  <link rel="stylesheet" href="https://noizu.github.io/react-assets/dist/sg.css">

  <style>
    /* ═══════════════════════════════════════
       THEME: BLUEPRINT
       ═══════════════════════════════════════ */
    [data-design-theme="blueprint"] {
      /* Blueprint surfaces — Prussian blue family */
      --bp-deep:       #0d1f33;
      --bp-base:       #142a42;
      --bp-surface:    #1a3352;
      --bp-elevated:   #1f3d62;
      --bp-panel:      #244870;
      --bp-border:     #2a5080;
      --bp-border-lt:  #356298;

      /* Line work — white/cream on blue */
      --line-bright:   #e8edf2;
      --line-primary:  #c0ccd8;
      --line-secondary:#8a9db2;
      --line-dim:      #5a7490;
      --line-ghost:    #3a5570;
      --line-faint:    rgba(200, 215, 230, 0.08);

      /* Grid lines */
      --grid-major:    rgba(58, 110, 165, 0.35);
      --grid-minor:    rgba(58, 110, 165, 0.15);

      /* Annotation — construction yellow */
      --anno-yellow:   #f0c040;
      --anno-yellow-d: rgba(240, 192, 64, 0.15);
      --anno-yellow-f: rgba(240, 192, 64, 0.08);

      /* Redline — corrections / danger */
      --redline:       #d94040;
      --redline-dim:   rgba(217, 64, 64, 0.15);

      /* Greenline — approval / success */
      --greenline:     #40b060;
      --greenline-dim: rgba(64, 176, 96, 0.12);

      /* White — highlights */
      --white:         #ffffff;
      --white-10:      rgba(255,255,255,0.10);
      --white-05:      rgba(255,255,255,0.05);

      /* Semantic */
      --success:       #40b060;
      --success-dim:   rgba(64, 176, 96, 0.15);
      --warning:       #f0c040;
      --warning-dim:   rgba(240, 192, 64, 0.15);
      --error:         #d94040;
      --error-dim:     rgba(217, 64, 64, 0.15);
      --info:          #4a90d0;
      --info-dim:      rgba(74, 144, 208, 0.15);

      /* Fonts */
      --font-mono:     'IBM Plex Mono', 'Menlo', monospace;
      --font-label:    'Barlow Condensed', 'Arial Narrow', sans-serif;
      --font-body:     'Barlow', -apple-system, sans-serif;

      /* Radius — technical, sharp */
      --radius-sm: 1px;
      --radius-md: 2px;

      /* Spacing */
      --space-xs:  4px;
      --space-sm:  8px;
      --space-md:  16px;
      --space-lg:  24px;
      --space-xl:  32px;
      --space-2xl: 48px;
      --space-3xl: 64px;
      --space-4xl: 96px;
    }

    /* ═══════════════════════════════════════
       ANIMATIONS
       ═══════════════════════════════════════ */
    @keyframes draw-line {
      0% { clip-path: inset(0 100% 0 0); }
      100% { clip-path: inset(0 0 0 0); }
    }
    @keyframes blink-cursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes fade-in {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes ping {
      0% { transform: scale(1); opacity: 1; }
      75% { transform: scale(2); opacity: 0; }
      100% { transform: scale(1); opacity: 0; }
    }

    /* ═══════════════════════════════════════
       RESET & BASE
       ═══════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      color: var(--line-primary);
      background: var(--bp-base);
      line-height: 1.7;
      overflow-x: hidden;
    }
    /* Engineering grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--grid-major) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
        linear-gradient(var(--grid-minor) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-minor) 1px, transparent 1px);
      background-size: 80px 80px, 80px 80px, 16px 16px, 16px 16px;
      pointer-events: none;
      z-index: 0;
    }
    body > * { position: relative; z-index: 1; }
    ::selection { background: var(--anno-yellow-d); color: var(--white); }
    a { color: var(--anno-yellow); text-decoration: none; border-bottom: 1px dashed var(--anno-yellow-d); }
    a:hover { border-bottom-style: solid; border-bottom-color: var(--anno-yellow); }

    /* ═══════════════════════════════════════
       BLUEPRINT CUSTOM COMPONENTS
       ═══════════════════════════════════════ */

    /* Annotation callout */
    .annotation {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--anno-yellow);
      background: var(--anno-yellow-f);
      border: 1px solid var(--anno-yellow-d);
      border-left: 3px solid var(--anno-yellow);
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      margin: var(--space-sm) 0;
    }
    .annotation::before { content: '\25C0'; font-size: 6px; }

    /* Dimension marker */
    .dimension {
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--anno-yellow);
    }
    .dimension-line {
      flex: 1;
      height: 0;
      border-top: 1px dashed var(--anno-yellow);
      opacity: 0.4;
    }
    .dimension-end { font-size: 8px; }

    /* ═══════════════════════════════════════
       BUTTONS
       ═══════════════════════════════════════ */
    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-md);
      align-items: center;
      margin-bottom: var(--space-lg);
    }
    .btn {
      font-family: var(--font-label);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 10px 24px;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--line-bright); color: var(--bp-deep); }
    .btn-primary:hover { background: var(--white); box-shadow: 0 0 12px rgba(232, 237, 242, 0.2); }
    .btn-yellow { background: var(--anno-yellow); color: var(--bp-deep); }
    .btn-yellow:hover { box-shadow: 0 0 12px rgba(240, 192, 64, 0.25); }
    .btn-outline { background: transparent; color: var(--line-bright); border: 1px solid var(--line-dim); }
    .btn-outline:hover { border-color: var(--line-bright); background: var(--white-05); }
    .btn-ghost { background: transparent; color: var(--line-dim); border: 1px dashed var(--bp-border); }
    .btn-ghost:hover { color: var(--line-primary); border-color: var(--line-dim); background: var(--white-05); }
    .btn-danger { background: transparent; color: var(--redline); border: 1px solid rgba(217, 64, 64, 0.3); }
    .btn-danger:hover { background: var(--redline-dim); }
    .btn-sm { font-size: 10px; padding: 7px 16px; }
    .btn-lg { font-size: 14px; padding: 14px 32px; }

    /* ═══════════════════════════════════════
       CARDS
       ═══════════════════════════════════════ */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: var(--space-lg);
    }
    .card {
      background: var(--bp-surface);
      border: 1px solid var(--bp-border);
      border-radius: var(--radius-sm);
      padding: var(--space-xl);
      transition: all 0.2s;
      position: relative;
    }
    .card:hover { border-color: var(--bp-border-lt); transform: translateY(-1px); }
    .card::before {
      content: '+';
      position: absolute;
      top: 6px; left: 8px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--line-ghost);
    }
    .card::after {
      content: '+';
      position: absolute;
      bottom: 6px; right: 8px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--line-ghost);
    }
    .card-dashed { border-style: dashed; }
    .card-annotated { border-left: 3px solid var(--anno-yellow); }
    .card-redline { border-left: 3px solid var(--redline); }
    .card-title {
      font-family: var(--font-label);
      font-size: 16px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--line-bright);
      margin-bottom: var(--space-sm);
    }
    .card-body { font-size: 14px; color: var(--line-secondary); line-height: 1.7; }
    .card-tag {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 2px 8px;
      border: 1px dashed var(--bp-border);
      border-radius: var(--radius-sm);
      color: var(--line-dim);
      margin-top: var(--space-md);
    }

    /* ═══════════════════════════════════════
       INPUT FIELDS
       ═══════════════════════════════════════ */
    .input-demo { max-width: 480px; }
    .input-group { margin-bottom: var(--space-lg); }
    .input-label {
      display: block;
      font-family: var(--font-label);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--line-dim);
      margin-bottom: var(--space-sm);
    }
    .input-field {
      width: 100%;
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--line-bright);
      background: var(--bp-deep);
      border: 1px solid var(--bp-border);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      outline: none;
      transition: all 0.2s;
    }
    .input-field::placeholder { color: var(--line-ghost); }
    .input-field:focus { border-color: var(--anno-yellow); box-shadow: 0 0 0 2px var(--anno-yellow-d); }
    .input-field.error { border-color: var(--redline); box-shadow: 0 0 0 2px var(--redline-dim); }
    .input-hint { font-family: var(--font-mono); font-size: 10px; color: var(--line-dim); margin-top: 6px; }
    .input-hint.error { color: var(--redline); }
    .input-textarea { min-height: 100px; resize: vertical; }

    /* ═══════════════════════════════════════
       STATUS INDICATORS
       ═══════════════════════════════════════ */
    .status-indicator {
      border-radius: 50%;
      position: relative;
    }
    .status-indicator.queued { background: var(--line-ghost); }
    .status-indicator.building { background: var(--anno-yellow); }
    .status-indicator.building::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: var(--anno-yellow);
      animation: ping 1.5s ease-out infinite;
    }
    .status-indicator.reviewing { background: var(--info); }
    .status-indicator.done { background: var(--greenline); }
    .status-indicator.error-status { background: var(--redline); }

    /* ═══════════════════════════════════════
       PROJECT COMPONENTS
       ═══════════════════════════════════════ */

    /* Code Block */
    .code-block {
      background: var(--bp-deep);
      border: 1px solid var(--bp-border);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    .code-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background: var(--bp-surface);
      border-bottom: 1px solid var(--bp-border);
    }
    .code-filename { font-family: var(--font-mono); font-size: 10px; color: var(--line-dim); }
    .code-lang {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--anno-yellow);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .code-body {
      padding: 20px;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.9;
      color: var(--line-primary);
      overflow-x: auto;
      white-space: pre;
    }
    .code-body .comment { color: var(--line-dim); font-style: italic; }
    .code-body .keyword { color: var(--anno-yellow); }
    .code-body .string { color: var(--greenline); }
    .code-body .function { color: var(--line-bright); }
    .code-body .number { color: #e0a050; }
    .code-body .type { color: var(--info); }
    .code-body .prompt { color: var(--anno-yellow); }
    .code-body .output { color: var(--line-dim); }
    .code-body .ok { color: var(--greenline); }
    .code-body .fail { color: var(--redline); }

    /* Dashboard */
    .dashboard {
      display: grid;
      grid-template-columns: 220px 1fr 240px;
      gap: 1px;
      background: var(--bp-border);
      border: 1px solid var(--bp-border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      min-height: 360px;
    }
    .dashboard-panel {
      background: var(--bp-surface);
      padding: var(--space-lg);
    }
    .dashboard-panel-title {
      font-family: var(--font-label);
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--line-dim);
      margin-bottom: var(--space-md);
      padding-bottom: var(--space-sm);
      border-bottom: 1px dashed var(--bp-border);
    }
    .story-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px;
      margin-bottom: 2px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.15s;
      font-size: 12px;
    }
    .story-item:hover { background: var(--bp-elevated); }
    .story-item.active { background: var(--bp-elevated); border-left: 2px solid var(--anno-yellow); }
    .story-id { font-family: var(--font-mono); font-size: 9px; color: var(--line-dim); white-space: nowrap; }
    .story-title { font-family: var(--font-body); font-size: 12px; color: var(--line-primary); line-height: 1.4; }
    .live-output {
      background: var(--bp-deep);
      border: 1px solid var(--bp-border);
      border-radius: var(--radius-sm);
      padding: var(--space-md);
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 1.9;
      color: var(--line-primary);
      max-height: 240px;
      overflow-y: auto;
    }
    .criteria-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
      font-size: 12px;
      color: var(--line-secondary);
      border-bottom: 1px dashed var(--bp-border);
    }
    .criteria-item:last-child { border-bottom: none; }
    .criteria-check {
      width: 14px;
      height: 14px;
      border: 1px solid var(--bp-border);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      flex-shrink: 0;
    }
    .criteria-check.done {
      background: var(--greenline-dim);
      border-color: var(--greenline);
      color: var(--greenline);
    }
    .agent-controls {
      display: flex;
      gap: 8px;
      padding-top: var(--space-md);
      border-top: 1px dashed var(--bp-border);
      margin-top: var(--space-md);
    }

    /* Effects */
    .effects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: var(--space-lg);
    }
    .effect-card {
      background: var(--bp-surface);
      border: 1px solid var(--bp-border);
      border-radius: var(--radius-sm);
      padding: var(--space-2xl) var(--space-xl);
      text-align: center;
      min-height: 160px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-md);
      position: relative;
    }
    .effect-card::before {
      content: '+';
      position: absolute;
      top: 6px; left: 8px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--line-ghost);
    }
    .effect-label {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--line-dim);
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }

    /* Grid demos */
    .grid-demo {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 6px;
    }
    .grid-cell {
      height: 44px;
      background: var(--white-05);
      border: 1px dashed var(--bp-border);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--line-ghost);
    }
    .grid-cell:hover {
      background: var(--white-10);
      border-style: solid;
      border-color: var(--bp-border-lt);
      color: var(--line-dim);
    }
    .grid-example { display: grid; gap: 6px; margin-top: var(--space-md); }
    .grid-example .grid-cell { height: 56px; }

    /* ═══════════════════════════════════════
       HEADLESS UI — BLUEPRINT THEMED
       ═══════════════════════════════════════ */

    /* Menu */
    .hui-menu { position: relative; display: inline-block; }
    .hui-menu-button {
      font-family: var(--font-label);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 10px 20px;
      background: var(--line-bright);
      color: var(--bp-deep);
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .hui-menu-button:hover { background: var(--white); }
    .hui-menu-button:focus { outline: 2px solid var(--anno-yellow); outline-offset: 2px; }
    .hui-menu-items {
      position: absolute;
      top: 100%;
      left: 0;
      z-index: 50;
      min-width: 200px;
      background: var(--bp-elevated);
      border: 1px solid var(--bp-border);
      border-radius: var(--radius-sm);
      padding: 6px 0;
      margin-top: 4px;
    }
    .hui-menu-item {
      display: block;
      width: 100%;
      text-align: left;
      padding: 10px 20px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--line-secondary);
      background: none;
      border: none;
      border-left: 2px solid transparent;
      cursor: pointer;
      transition: all 0.15s;
    }
    .hui-menu-item:hover {
      background: var(--white-05);
      color: var(--line-bright);
      border-left-color: var(--anno-yellow);
    }
    .hui-menu-item.danger { color: var(--redline); }
    .hui-menu-item.danger:hover { background: var(--redline-dim); border-left-color: var(--redline); }
    .hui-menu-separator { height: 1px; background: var(--bp-border); margin: 6px 20px; }

    /* Switch */
    .hui-switch {
      width: 48px;
      height: 26px;
      border: 1px solid var(--bp-border);
      background: var(--bp-surface);
      border-radius: 13px;
      cursor: pointer;
      position: relative;
      transition: all 0.2s;
      padding: 0;
    }
    .hui-switch:hover { border-color: var(--bp-border-lt); }
    .hui-switch:focus { outline: 2px solid var(--anno-yellow); outline-offset: 2px; }
    .hui-switch.checked { background: var(--line-bright); border-color: var(--line-bright); }
    .hui-switch-thumb {
      display: block;
      width: 18px;
      height: 18px;
      background: var(--line-primary);
      border-radius: 50%;
      position: absolute;
      top: 3px;
      left: 3px;
      transition: transform 0.2s;
    }
    .hui-switch.checked .hui-switch-thumb { transform: translateX(22px); background: var(--bp-deep); }
    .hui-switch-label { display: flex; align-items: center; gap: 12px; font-size: 14px; cursor: pointer; }
    .hui-switch-label-text { font-weight: 500; color: var(--line-bright); }
    .hui-switch-label-desc { font-family: var(--font-mono); font-size: 11px; color: var(--line-dim); }

    /* Disclosure */
    .hui-disclosure {
      border: 1px solid var(--bp-border);
      border-radius: var(--radius-sm);
      margin-bottom: -1px;
    }
    .hui-disclosure:hover { border-color: var(--bp-border-lt); }
    .hui-disclosure.open { border-color: var(--anno-yellow); }
    .hui-disclosure-button {
      width: 100%;
      text-align: left;
      padding: 14px 20px;
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 500;
      color: var(--line-bright);
      background: var(--bp-surface);
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.15s;
    }
    .hui-disclosure-button:hover { background: var(--bp-elevated); }
    .hui-disclosure-button:focus { outline: 2px solid var(--anno-yellow); outline-offset: -2px; }
    .hui-disclosure-arrow { font-size: 12px; color: var(--line-dim); transition: transform 0.2s; }
    .hui-disclosure.open .hui-disclosure-arrow { transform: rotate(180deg); color: var(--anno-yellow); }

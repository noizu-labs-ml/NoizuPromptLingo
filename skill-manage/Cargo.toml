[package]
name = "skill-manage"
version = "0.1.0"
edition = "2021"
description = "Symlink manager for provider skills, agents, and commands with YAML catalog metadata"
license = "MIT"
authors = ["Keith Brings <keith.brings@noizu.com>"]

[[bin]]
name = "skill-manage"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
dirs = "6"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
strip = true

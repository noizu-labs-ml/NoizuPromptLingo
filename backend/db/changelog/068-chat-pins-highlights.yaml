databaseChangeLog:
  # Stream D — chat message enhancements.
  # - pinned / highlighted flags (highlighted surfaces as important: true to the FE).
  # - scheduled_for: future-posted messages; excluded from listings until released.
  # Threaded replies already exist as chat_messages.parent_message_id (changelog
  # 054); this changelog does NOT re-add a parent column.

  - changeSet:
      id: chat-messages-pins-highlights-scheduling
      author: stream-d
      changes:
        - sql:
            sql: |
              ALTER TABLE chat_messages
                ADD COLUMN pinned boolean NOT NULL DEFAULT false,
                ADD COLUMN highlighted boolean NOT NULL DEFAULT false,
                ADD COLUMN scheduled_for timestamptz;
              CREATE INDEX idx_chat_messages_scheduled_for ON chat_messages (scheduled_for)
                WHERE scheduled_for IS NOT NULL;
      rollback:
        - sql:
            sql: |
              DROP INDEX IF EXISTS idx_chat_messages_scheduled_for;
              ALTER TABLE chat_messages
                DROP COLUMN pinned,
                DROP COLUMN highlighted,
                DROP COLUMN scheduled_for;

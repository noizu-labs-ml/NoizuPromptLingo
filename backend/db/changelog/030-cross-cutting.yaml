databaseChangeLog:
  - changeSet:
      id: create-table-npl-comments
      author: tobor-locker
      changes:
        - sql:
            sql: |
              CREATE TABLE npl_comments (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                entity_type varchar(255) NOT NULL,
                entity_id uuid NOT NULL,
                content text NOT NULL,
                author varchar(255),
                location varchar(255),
                reply_to_id uuid,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
      rollback:
        - dropTable:
            tableName: npl_comments

  - changeSet:
      id: create-indexes-npl-comments
      author: tobor-locker
      changes:
        - createIndex:
            indexName: idx_npl_comments_entity
            tableName: npl_comments
            columns:
              - column:
                  name: entity_type
              - column:
                  name: entity_id
        - createIndex:
            indexName: idx_npl_comments_reply_to
            tableName: npl_comments
            columns:
              - column:
                  name: reply_to_id
      rollback:
        - dropIndex:
            indexName: idx_npl_comments_entity
        - dropIndex:
            indexName: idx_npl_comments_reply_to

  - changeSet:
      id: create-table-npl-attachments
      author: tobor-locker
      changes:
        - sql:
            sql: |
              CREATE TABLE npl_attachments (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                entity_type varchar(255) NOT NULL,
                entity_id uuid NOT NULL,
                artifact_type varchar(255) NOT NULL,
                url text,
                git_branch varchar(255),
                description text,
                created_by varchar(255),
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
      rollback:
        - dropTable:
            tableName: npl_attachments

  - changeSet:
      id: create-index-npl-attachments-entity
      author: tobor-locker
      changes:
        - createIndex:
            indexName: idx_npl_attachments_entity
            tableName: npl_attachments
            columns:
              - column:
                  name: entity_type
              - column:
                  name: entity_id
      rollback:
        - dropIndex:
            indexName: idx_npl_attachments_entity

  - changeSet:
      id: create-table-npl-watches
      author: tobor-locker
      changes:
        - sql:
            sql: |
              CREATE TABLE npl_watches (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                entity_type varchar(255) NOT NULL,
                entity_id uuid NOT NULL,
                persona varchar(255) NOT NULL,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
      rollback:
        - dropTable:
            tableName: npl_watches

  - changeSet:
      id: create-unique-index-npl-watches
      author: tobor-locker
      changes:
        - createIndex:
            indexName: idx_npl_watches_unique
            tableName: npl_watches
            unique: true
            columns:
              - column:
                  name: entity_type
              - column:
                  name: entity_id
              - column:
                  name: persona
      rollback:
        - dropIndex:
            indexName: idx_npl_watches_unique

  - changeSet:
      id: create-table-npl-reactions
      author: tobor-locker
      changes:
        - sql:
            sql: |
              CREATE TABLE npl_reactions (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                entity_type varchar(255) NOT NULL,
                entity_id uuid NOT NULL,
                persona varchar(255) NOT NULL,
                emoji varchar(255) NOT NULL,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
      rollback:
        - dropTable:
            tableName: npl_reactions

  - changeSet:
      id: create-unique-index-npl-reactions
      author: tobor-locker
      changes:
        - createIndex:
            indexName: idx_npl_reactions_unique
            tableName: npl_reactions
            unique: true
            columns:
              - column:
                  name: entity_type
              - column:
                  name: entity_id
              - column:
                  name: persona
              - column:
                  name: emoji
      rollback:
        - dropIndex:
            indexName: idx_npl_reactions_unique

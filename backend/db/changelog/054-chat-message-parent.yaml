databaseChangeLog:
  # Threaded replies (ffa2d2f6): a chat message may reply to another message in the
  # same room. Nullable self-FK; ON DELETE CASCADE so deleting a parent removes its
  # replies (consistent with the room-level cascade in 032). Additive, reversible,
  # DDL only — existing rows get NULL (top-level messages), so the FK is trivially
  # satisfied and the add is metadata-only (no table rewrite, no validation scan).

  - changeSet:
      id: 054a-add-column-chat-messages-parent
      author: aniket-backend
      changes:
        - sql:
            sql: |
              ALTER TABLE chat_messages ADD COLUMN parent_message_id uuid
                REFERENCES chat_messages(id) ON DELETE CASCADE;
      rollback:
        - sql:
            sql: |
              ALTER TABLE chat_messages DROP COLUMN parent_message_id;

  # Replies are fetched by parent_message_id (thread view), so index it.
  - changeSet:
      id: 054b-index-chat-messages-parent
      author: aniket-backend
      changes:
        - sql:
            sql: |
              CREATE INDEX idx_chat_messages_parent_message_id
                ON chat_messages(parent_message_id);
      rollback:
        - sql:
            sql: |
              DROP INDEX idx_chat_messages_parent_message_id;

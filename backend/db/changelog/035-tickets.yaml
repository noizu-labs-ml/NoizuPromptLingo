databaseChangeLog:
  # Tickets ("tasks") domain. Field definitions, type definitions, type-fields,
  # and queues are global system taxonomy (matching the source project). Tickets
  # themselves are bound to an organization (required) with an optional project.

  - changeSet:
      id: create-table-ticket-field-definitions
      author: tobor-locker
      changes:
        - sql:
            sql: |
              CREATE TABLE ticket_field_definitions (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                organization_id uuid NOT NULL REFERENCES organizations(id) ON DELETE CASCADE,
                slug varchar(255) NOT NULL,
                label varchar(255) NOT NULL,
                field_type varchar(255) NOT NULL,
                options jsonb,
                default_value varchar(255),
                description varchar(255),
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
      rollback:
        - dropTable:
            tableName: ticket_field_definitions

  - changeSet:
      id: create-unique-index-ticket-field-definitions-org-slug
      author: tobor-locker
      changes:
        - createIndex:
            indexName: idx_ticket_field_definitions_org_slug
            tableName: ticket_field_definitions
            unique: true
            columns:
              - column:
                  name: organization_id
              - column:
                  name: slug
      rollback:
        - dropIndex:
            indexName: idx_ticket_field_definitions_org_slug

  - changeSet:
      id: create-table-ticket-type-definitions
      author: tobor-locker
      changes:
        - sql:
            sql: |
              CREATE TABLE ticket_type_definitions (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                organization_id uuid NOT NULL REFERENCES organizations(id) ON DELETE CASCADE,
                slug varchar(255) NOT NULL,
                name varchar(255) NOT NULL,
                description varchar(255),
                icon varchar(255),
                status_workflow jsonb,
                deleted_at timestamptz,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
      rollback:
        - dropTable:
            tableName: ticket_type_definitions

  - changeSet:
      id: create-unique-index-ticket-type-definitions-org-slug
      author: tobor-locker
      changes:
        - createIndex:
            indexName: idx_ticket_type_definitions_org_slug
            tableName: ticket_type_definitions
            unique: true
            columns:
              - column:
                  name: organization_id
              - column:
                  name: slug
      rollback:
        - dropIndex:
            indexName: idx_ticket_type_definitions_org_slug

  - changeSet:
      id: create-table-ticket-type-fields
      author: tobor-locker
      changes:
        - sql:
            sql: |
              CREATE TABLE ticket_type_fields (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                ticket_type_definition_id uuid NOT NULL REFERENCES ticket_type_definitions(id) ON DELETE CASCADE,
                ticket_field_definition_id uuid NOT NULL REFERENCES ticket_field_definitions(id) ON DELETE CASCADE,
                required boolean NOT NULL DEFAULT false,
                position integer NOT NULL DEFAULT 0,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
      rollback:
        - dropTable:
            tableName: ticket_type_fields

  - changeSet:
      id: create-indexes-ticket-type-fields
      author: tobor-locker
      changes:
        - createIndex:
            indexName: idx_ticket_type_fields_type_def_id
            tableName: ticket_type_fields
            columns:
              - column:
                  name: ticket_type_definition_id
        - createIndex:
            indexName: idx_ticket_type_fields_unique
            tableName: ticket_type_fields
            unique: true
            columns:
              - column:
                  name: ticket_type_definition_id
              - column:
                  name: ticket_field_definition_id
      rollback:
        - dropIndex:
            indexName: idx_ticket_type_fields_type_def_id
        - dropIndex:
            indexName: idx_ticket_type_fields_unique

  - changeSet:
      id: create-table-ticket-queues
      author: tobor-locker
      changes:
        - sql:
            sql: |
              CREATE TABLE ticket_queues (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                name varchar(255) NOT NULL,
                slug varchar(255) NOT NULL,
                description varchar(255),
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
      rollback:
        - dropTable:
            tableName: ticket_queues

  - changeSet:
      id: create-unique-index-ticket-queues-slug
      author: tobor-locker
      changes:
        - createIndex:
            indexName: idx_ticket_queues_slug
            tableName: ticket_queues
            unique: true
            columns:
              - column:
                  name: slug
      rollback:
        - dropIndex:
            indexName: idx_ticket_queues_slug

  - changeSet:
      id: create-table-tickets
      author: tobor-locker
      changes:
        - sql:
            sql: |
              CREATE TABLE tickets (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                organization_id uuid NOT NULL REFERENCES organizations(id) ON DELETE CASCADE,
                title varchar(255) NOT NULL,
                description text,
                ticket_type varchar(255) NOT NULL,
                status varchar(255) NOT NULL DEFAULT 'open',
                priority varchar(255),
                assignee varchar(255),
                reporter varchar(255),
                queue_id uuid REFERENCES ticket_queues(id) ON DELETE SET NULL,
                parent_id uuid REFERENCES tickets(id) ON DELETE SET NULL,
                project_id uuid REFERENCES projects(id) ON DELETE SET NULL,
                custom_fields jsonb NOT NULL DEFAULT '{}',
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
      rollback:
        - dropTable:
            tableName: tickets

  - changeSet:
      id: create-indexes-tickets
      author: tobor-locker
      changes:
        - createIndex:
            indexName: idx_tickets_organization_id
            tableName: tickets
            columns:
              - column:
                  name: organization_id
        - createIndex:
            indexName: idx_tickets_ticket_type
            tableName: tickets
            columns:
              - column:
                  name: ticket_type
        - createIndex:
            indexName: idx_tickets_status
            tableName: tickets
            columns:
              - column:
                  name: status
        - createIndex:
            indexName: idx_tickets_priority
            tableName: tickets
            columns:
              - column:
                  name: priority
        - createIndex:
            indexName: idx_tickets_assignee
            tableName: tickets
            columns:
              - column:
                  name: assignee
        - createIndex:
            indexName: idx_tickets_queue_id
            tableName: tickets
            columns:
              - column:
                  name: queue_id
        - createIndex:
            indexName: idx_tickets_parent_id
            tableName: tickets
            columns:
              - column:
                  name: parent_id
        - createIndex:
            indexName: idx_tickets_project_id
            tableName: tickets
            columns:
              - column:
                  name: project_id
      rollback:
        - dropIndex:
            indexName: idx_tickets_organization_id
        - dropIndex:
            indexName: idx_tickets_ticket_type
        - dropIndex:
            indexName: idx_tickets_status
        - dropIndex:
            indexName: idx_tickets_priority
        - dropIndex:
            indexName: idx_tickets_assignee
        - dropIndex:
            indexName: idx_tickets_queue_id
        - dropIndex:
            indexName: idx_tickets_parent_id
        - dropIndex:
            indexName: idx_tickets_project_id

  - changeSet:
      id: create-table-ticket-links
      author: tobor-locker
      changes:
        - sql:
            sql: |
              CREATE TABLE ticket_links (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                source_ticket_id uuid NOT NULL REFERENCES tickets(id) ON DELETE CASCADE,
                target_ticket_id uuid NOT NULL REFERENCES tickets(id) ON DELETE CASCADE,
                link_type varchar(255) NOT NULL,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
      rollback:
        - dropTable:
            tableName: ticket_links

  - changeSet:
      id: create-indexes-ticket-links
      author: tobor-locker
      changes:
        - createIndex:
            indexName: idx_ticket_links_source
            tableName: ticket_links
            columns:
              - column:
                  name: source_ticket_id
        - createIndex:
            indexName: idx_ticket_links_target
            tableName: ticket_links
            columns:
              - column:
                  name: target_ticket_id
        - createIndex:
            indexName: idx_ticket_links_unique
            tableName: ticket_links
            unique: true
            columns:
              - column:
                  name: source_ticket_id
              - column:
                  name: target_ticket_id
              - column:
                  name: link_type
      rollback:
        - dropIndex:
            indexName: idx_ticket_links_source
        - dropIndex:
            indexName: idx_ticket_links_target
        - dropIndex:
            indexName: idx_ticket_links_unique

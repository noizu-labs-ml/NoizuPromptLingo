databaseChangeLog:
  - changeSet:
      id: 050-create-table-agent-call-signs
      author: npl-memory
      changes:
        - sql:
            splitStatements: false
            sql: |
              -- Registry of memory-owning agent identities for the weego (orchestrator) and
              -- ephemeral team-member sub-agents. Personas own memory directly via personas.id;
              -- this table provides the stable scope_id for weego / team_member scopes.
              CREATE TABLE agent_call_signs (
                id              uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                organization_id uuid NOT NULL REFERENCES organizations(id) ON DELETE CASCADE,
                kind            text NOT NULL CHECK (kind IN ('weego','team_member')),
                call_sign       varchar(255) NOT NULL,
                display_name    varchar(255),
                persona_id      uuid REFERENCES personas(id) ON DELETE SET NULL,
                status          varchar(32) NOT NULL DEFAULT 'active',
                metadata        jsonb NOT NULL DEFAULT '{}',
                inserted_at     timestamptz NOT NULL DEFAULT now(),
                updated_at      timestamptz NOT NULL DEFAULT now()
              );

              CREATE UNIQUE INDEX idx_agent_call_signs_org_callsign
                ON agent_call_signs (organization_id, call_sign);
              CREATE INDEX idx_agent_call_signs_org_kind
                ON agent_call_signs (organization_id, kind) WHERE status = 'active';
      rollback:
        - dropTable:
            tableName: agent_call_signs

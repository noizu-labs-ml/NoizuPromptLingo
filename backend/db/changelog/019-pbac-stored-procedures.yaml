databaseChangeLog:
  - changeSet:
      id: 019-create-function-check-user-permission
      author: starter-scaffold
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION check_user_permission(
                p_user_id uuid,
                p_resource_type resource_type_enum,
                p_resource_id uuid,
                p_action varchar
              )
              RETURNS BOOLEAN
              LANGUAGE plpgsql
              STABLE
              AS $$
              DECLARE
                v_resource_urn text;
                v_has_allow boolean := false;
                v_policy record;
                v_statement jsonb;
                v_stmt_action text;
                v_stmt_resource text;
                v_action_parts text[];
                v_action_type text;
                v_action_verb text;
              BEGIN
                v_resource_urn := p_resource_type || ':' || p_resource_id;

                FOR v_policy IN
                  SELECT p.policy_document
                  FROM scoped_memberships sm
                  JOIN group_policies gp ON gp.group_id = sm.group_id
                  JOIN policies p ON p.id = gp.policy_id AND p.is_active = true
                  WHERE sm.member_type = 'user'
                    AND sm.member_id = p_user_id
                    AND sm.resource_type = p_resource_type
                    AND sm.resource_id = p_resource_id
                    AND (sm.expires_at IS NULL OR sm.expires_at > NOW())
                  ORDER BY gp.priority ASC
                LOOP
                  FOR v_statement IN SELECT jsonb_array_elements(v_policy.policy_document->'statements')
                  LOOP
                    -- Check if action matches any in statement
                    DECLARE
                      v_action_matched boolean := false;
                      v_resource_matched boolean := false;
                      v_resolved_resource text;
                    BEGIN
                      -- Check action match
                      FOR v_stmt_action IN SELECT jsonb_array_elements_text(v_statement->'actions')
                      LOOP
                        IF v_stmt_action = '*' THEN
                          v_action_matched := true;
                          EXIT;
                        END IF;

                        -- Parse action parts for wildcard matching
                        v_action_parts := string_to_array(p_action, ':');

                        IF v_stmt_action LIKE '%:*' THEN
                          -- type:* pattern — match action type prefix
                          IF v_action_parts[1] = split_part(v_stmt_action, ':', 1) THEN
                            v_action_matched := true;
                            EXIT;
                          END IF;
                        ELSIF v_stmt_action LIKE '*:%' THEN
                          -- *:action pattern — match action verb suffix
                          IF array_length(v_action_parts, 1) >= 2
                             AND v_action_parts[2] = split_part(v_stmt_action, ':', 2) THEN
                            v_action_matched := true;
                            EXIT;
                          END IF;
                        ELSIF v_stmt_action = p_action THEN
                          v_action_matched := true;
                          EXIT;
                        END IF;
                      END LOOP;

                      IF NOT v_action_matched THEN
                        CONTINUE;
                      END IF;

                      -- Check resource match
                      FOR v_stmt_resource IN SELECT jsonb_array_elements_text(v_statement->'resources')
                      LOOP
                        -- Substitute template variables
                        v_resolved_resource := replace(
                          replace(v_stmt_resource,
                            '${resource_type}', p_resource_type::text),
                          '${resource_id}', p_resource_id::text);

                        IF v_resolved_resource = '*' THEN
                          v_resource_matched := true;
                          EXIT;
                        ELSIF v_resolved_resource LIKE '%/*' THEN
                          -- Prefix wildcard: resource_type:resource_id/*
                          IF v_resource_urn LIKE rtrim(v_resolved_resource, '*') || '%' THEN
                            v_resource_matched := true;
                            EXIT;
                          END IF;
                        ELSIF v_resolved_resource = v_resource_urn THEN
                          v_resource_matched := true;
                          EXIT;
                        END IF;
                      END LOOP;

                      IF v_action_matched AND v_resource_matched THEN
                        IF (v_statement->>'effect') = 'deny' THEN
                          RETURN FALSE;
                        ELSIF (v_statement->>'effect') = 'allow' THEN
                          v_has_allow := true;
                        END IF;
                      END IF;
                    END;
                  END LOOP;
                END LOOP;

                RETURN v_has_allow;
              END;
              $$;
      rollback:
        - sql:
            sql: DROP FUNCTION IF EXISTS check_user_permission(uuid, resource_type_enum, uuid, varchar);

  - changeSet:
      id: 019-create-function-add-scoped-member
      author: starter-scaffold
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION add_scoped_member(
                p_resource_type resource_type_enum,
                p_resource_id uuid,
                p_user_id uuid,
                p_role_name role_name_enum,
                p_added_by uuid DEFAULT NULL
              )
              RETURNS TABLE (
                membership_id uuid,
                resource_type resource_type_enum,
                resource_id uuid,
                user_id uuid,
                role_name role_name_enum,
                created_at timestamptz
              )
              LANGUAGE plpgsql
              AS $$
              DECLARE
                v_group_id uuid;
                v_membership_id uuid;
                v_created_at timestamptz;
              BEGIN
                -- Lookup group by role name
                SELECT id INTO v_group_id FROM groups WHERE name = p_role_name;
                IF v_group_id IS NULL THEN
                  RAISE EXCEPTION 'invalid_role: %', p_role_name
                    USING ERRCODE = 'P0002';
                END IF;

                -- Check if already a member
                IF EXISTS (
                  SELECT 1 FROM scoped_memberships sm
                  WHERE sm.resource_type = p_resource_type
                    AND sm.resource_id = p_resource_id
                    AND sm.member_type = 'user'
                    AND sm.member_id = p_user_id
                ) THEN
                  RAISE EXCEPTION 'already_member'
                    USING ERRCODE = 'P0004';
                END IF;

                -- Insert membership
                INSERT INTO scoped_memberships (group_id, resource_type, resource_id, member_type, member_id, added_by)
                VALUES (v_group_id, p_resource_type, p_resource_id, 'user', p_user_id, p_added_by)
                RETURNING scoped_memberships.id, scoped_memberships.created_at
                INTO v_membership_id, v_created_at;

                RETURN QUERY SELECT
                  v_membership_id,
                  p_resource_type,
                  p_resource_id,
                  p_user_id,
                  p_role_name,
                  v_created_at;
              END;
              $$;
      rollback:
        - sql:
            sql: DROP FUNCTION IF EXISTS add_scoped_member(resource_type_enum, uuid, uuid, role_name_enum, uuid);

  - changeSet:
      id: 019-create-function-update-scoped-member-role
      author: starter-scaffold
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION update_scoped_member_role(
                p_resource_type resource_type_enum,
                p_resource_id uuid,
                p_user_id uuid,
                p_new_role_name role_name_enum
              )
              RETURNS TABLE (
                membership_id uuid,
                old_role_name role_name_enum,
                new_role_name role_name_enum
              )
              LANGUAGE plpgsql
              AS $$
              DECLARE
                v_membership_id uuid;
                v_old_group_id uuid;
                v_new_group_id uuid;
                v_old_role role_name_enum;
              BEGIN
                -- Find existing membership
                SELECT sm.id, sm.group_id, g.name
                INTO v_membership_id, v_old_group_id, v_old_role
                FROM scoped_memberships sm
                JOIN groups g ON g.id = sm.group_id
                WHERE sm.resource_type = p_resource_type
                  AND sm.resource_id = p_resource_id
                  AND sm.member_type = 'user'
                  AND sm.member_id = p_user_id;

                IF v_membership_id IS NULL THEN
                  RAISE EXCEPTION 'not_found'
                    USING ERRCODE = 'P0005';
                END IF;

                -- Get new group id
                SELECT id INTO v_new_group_id FROM groups WHERE name = p_new_role_name;
                IF v_new_group_id IS NULL THEN
                  RAISE EXCEPTION 'invalid_role: %', p_new_role_name
                    USING ERRCODE = 'P0002';
                END IF;

                -- Update membership
                UPDATE scoped_memberships
                SET group_id = v_new_group_id
                WHERE id = v_membership_id;

                RETURN QUERY SELECT v_membership_id, v_old_role, p_new_role_name;
              END;
              $$;
      rollback:
        - sql:
            sql: DROP FUNCTION IF EXISTS update_scoped_member_role(resource_type_enum, uuid, uuid, role_name_enum);

  - changeSet:
      id: 019-create-function-remove-scoped-member-safe
      author: starter-scaffold
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION remove_scoped_member_safe(
                p_resource_type resource_type_enum,
                p_resource_id uuid,
                p_user_id uuid
              )
              RETURNS TABLE (
                removed boolean,
                was_owner boolean,
                remaining_owners integer
              )
              LANGUAGE plpgsql
              AS $$
              DECLARE
                v_membership_id uuid;
                v_group_id uuid;
                v_role_name role_name_enum;
                v_owner_count integer;
                v_remaining integer;
              BEGIN
                -- Lock resource memberships to prevent race conditions
                PERFORM 1 FROM scoped_memberships
                WHERE resource_type = p_resource_type
                  AND resource_id = p_resource_id
                FOR UPDATE;

                -- Find the membership
                SELECT sm.id, sm.group_id, g.name
                INTO v_membership_id, v_group_id, v_role_name
                FROM scoped_memberships sm
                JOIN groups g ON g.id = sm.group_id
                WHERE sm.resource_type = p_resource_type
                  AND sm.resource_id = p_resource_id
                  AND sm.member_type = 'user'
                  AND sm.member_id = p_user_id;

                IF v_membership_id IS NULL THEN
                  RAISE EXCEPTION 'not_found'
                    USING ERRCODE = 'P0005';
                END IF;

                -- If owner, check sole owner constraint
                IF v_role_name = 'owner' THEN
                  SELECT COUNT(*) INTO v_owner_count
                  FROM scoped_memberships sm
                  JOIN groups g ON g.id = sm.group_id
                  WHERE sm.resource_type = p_resource_type
                    AND sm.resource_id = p_resource_id
                    AND g.name = 'owner'
                    AND sm.member_type = 'user'
                    AND (sm.expires_at IS NULL OR sm.expires_at > NOW());

                  IF v_owner_count <= 1 THEN
                    RAISE EXCEPTION 'sole_owner'
                      USING ERRCODE = 'P0006';
                  END IF;
                END IF;

                -- Delete the membership
                DELETE FROM scoped_memberships WHERE id = v_membership_id;

                -- Recount owners
                SELECT COUNT(*) INTO v_remaining
                FROM scoped_memberships sm
                JOIN groups g ON g.id = sm.group_id
                WHERE sm.resource_type = p_resource_type
                  AND sm.resource_id = p_resource_id
                  AND g.name = 'owner'
                  AND sm.member_type = 'user'
                  AND (sm.expires_at IS NULL OR sm.expires_at > NOW());

                RETURN QUERY SELECT true, (v_role_name = 'owner'), v_remaining;
              END;
              $$;
      rollback:
        - sql:
            sql: DROP FUNCTION IF EXISTS remove_scoped_member_safe(resource_type_enum, uuid, uuid);

  - changeSet:
      id: 019-create-function-get-user-role-in-resource
      author: starter-scaffold
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION get_user_role_in_resource(
                p_user_id uuid,
                p_resource_type resource_type_enum,
                p_resource_id uuid
              )
              RETURNS role_name_enum
              LANGUAGE sql
              STABLE
              AS $$
                SELECT g.name
                FROM scoped_memberships sm
                JOIN groups g ON g.id = sm.group_id
                WHERE sm.member_type = 'user'
                  AND sm.member_id = p_user_id
                  AND sm.resource_type = p_resource_type
                  AND sm.resource_id = p_resource_id
                  AND (sm.expires_at IS NULL OR sm.expires_at > NOW());
              $$;
      rollback:
        - sql:
            sql: DROP FUNCTION IF EXISTS get_user_role_in_resource(uuid, resource_type_enum, uuid);

  - changeSet:
      id: 019-create-function-list-user-accessible-projects
      author: starter-scaffold
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION list_user_accessible_projects(
                p_user_id uuid,
                p_organization_id uuid DEFAULT NULL
              )
              RETURNS TABLE (
                id uuid,
                organization_id uuid,
                name varchar,
                slug citext,
                description text,
                status varchar,
                created_at timestamptz,
                role_name role_name_enum,
                inherited_from_org boolean
              )
              LANGUAGE plpgsql
              STABLE
              AS $$
              BEGIN
                RETURN QUERY
                WITH user_org_memberships AS (
                  SELECT sm.resource_id AS org_id, g.name AS org_role
                  FROM scoped_memberships sm
                  JOIN groups g ON g.id = sm.group_id
                  WHERE sm.member_type = 'user'
                    AND sm.member_id = p_user_id
                    AND sm.resource_type = 'organization'
                    AND (sm.expires_at IS NULL OR sm.expires_at > NOW())
                ),
                user_project_memberships AS (
                  SELECT sm.resource_id AS project_id, g.name AS project_role
                  FROM scoped_memberships sm
                  JOIN groups g ON g.id = sm.group_id
                  WHERE sm.member_type = 'user'
                    AND sm.member_id = p_user_id
                    AND sm.resource_type = 'project'
                    AND (sm.expires_at IS NULL OR sm.expires_at > NOW())
                )
                SELECT
                  p.id,
                  p.organization_id,
                  p.name,
                  p.slug,
                  p.description,
                  p.status,
                  p.inserted_at AS created_at,
                  COALESCE(upm.project_role, uom.org_role) AS role_name,
                  (upm.project_role IS NULL AND uom.org_role IS NOT NULL) AS inherited_from_org
                FROM projects p
                LEFT JOIN user_org_memberships uom ON uom.org_id = p.organization_id
                LEFT JOIN user_project_memberships upm ON upm.project_id = p.id
                WHERE p.status = 'active'
                  AND (upm.project_role IS NOT NULL OR uom.org_role IS NOT NULL)
                  AND (p_organization_id IS NULL OR p.organization_id = p_organization_id)
                ORDER BY p.inserted_at DESC;
              END;
              $$;
      rollback:
        - sql:
            sql: DROP FUNCTION IF EXISTS list_user_accessible_projects(uuid, uuid);

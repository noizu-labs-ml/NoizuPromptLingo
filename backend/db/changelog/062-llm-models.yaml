databaseChangeLog:
  # Editable catalog of selectable LLMs for the Mock MCP picker / ListModels.
  # Replaces the hardcoded list in Domains.MockMCP.Models (which stays as the
  # compile-time fallback/seed). Global (not org-scoped); `provider:model` is the
  # natural key the frontend stores on a definition.
  - changeSet:
      id: create-table-llm-models
      author: tobor-locker
      changes:
        - sql:
            sql: |
              CREATE TABLE llm_models (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                provider varchar(255) NOT NULL,
                model varchar(255) NOT NULL,
                label varchar(255) NOT NULL,
                endpoint varchar(1024),
                enabled boolean NOT NULL DEFAULT true,
                sort_order integer NOT NULL DEFAULT 0,
                notes text,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now(),
                CONSTRAINT uq_llm_models_provider_model UNIQUE (provider, model)
              );
              CREATE INDEX idx_llm_models_enabled ON llm_models (enabled);
      rollback:
        - dropTable:
            tableName: llm_models

  - changeSet:
      id: seed-llm-models
      author: tobor-locker
      changes:
        - sql:
            sql: |
              INSERT INTO llm_models (provider, model, label, sort_order) VALUES
                ('openai', 'gpt-4o', 'OpenAI · GPT-4o', 0),
                ('openai', 'gpt-4o-mini', 'OpenAI · GPT-4o mini', 1),
                ('openai', 'gpt-4.1', 'OpenAI · GPT-4.1', 2),
                ('anthropic', 'claude-sonnet-5', 'Anthropic · Claude Sonnet 5', 3),
                ('anthropic', 'claude-opus-4-8', 'Anthropic · Claude Opus 4.8', 4),
                ('anthropic', 'claude-haiku-4-5', 'Anthropic · Claude Haiku 4.5', 5),
                ('deepseek', 'deepseek-chat', 'DeepSeek · Chat', 6),
                ('deepseek', 'deepseek-reasoner', 'DeepSeek · Reasoner', 7),
                ('zai', 'glm-5', 'Z.ai · GLM-5', 8),
                ('zai', 'glm-4.6', 'Z.ai · GLM-4.6', 9),
                ('cerebras', 'gpt-oss-120b', 'Cerebras · GPT-OSS 120B', 10),
                ('cerebras', 'zai-glm-4.7', 'Cerebras · GLM-4.7', 11),
                ('gemini', 'gemini-2.5-pro', 'Gemini · 2.5 Pro', 12),
                ('gemini', 'gemini-2.5-flash', 'Gemini · 2.5 Flash', 13),
                ('xai', 'grok-4', 'Grok · 4', 14),
                ('xai', 'grok-4-fast-reasoning', 'Grok · 4 Fast (reasoning)', 15),

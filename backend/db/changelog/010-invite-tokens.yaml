databaseChangeLog:
  - changeSet:
      id: create-table-invite-tokens
      author: starter-scaffold
      changes:
        - sql:
            sql: |
              CREATE TABLE invite_tokens (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                organization_id uuid REFERENCES organizations(id),
                created_by_user_id uuid REFERENCES users(id),
                token_hash varchar(255) NOT NULL,
                key_prefix varchar(10) NOT NULL,
                email citext,
                max_uses integer,
                uses integer NOT NULL DEFAULT 0,
                expires_at timestamptz,
                revoked boolean DEFAULT false,
                inserted_at timestamptz NOT NULL,
                updated_at timestamptz NOT NULL
              );
      rollback:
        - dropTable:
            tableName: invite_tokens

  - changeSet:
      id: create-index-invite-tokens-key-prefix
      author: starter-scaffold
      changes:
        - createIndex:
            indexName: idx_invite_tokens_key_prefix
            tableName: invite_tokens
            columns:
              - column:
                  name: key_prefix
      rollback:
        - dropIndex:
            indexName: idx_invite_tokens_key_prefix
            tableName: invite_tokens

  - changeSet:
      id: create-index-invite-tokens-token-hash-unique
      author: starter-scaffold
      changes:
        - createIndex:
            indexName: idx_invite_tokens_token_hash
            tableName: invite_tokens
            unique: true
            columns:
              - column:
                  name: token_hash
      rollback:
        - dropIndex:
            indexName: idx_invite_tokens_token_hash
            tableName: invite_tokens

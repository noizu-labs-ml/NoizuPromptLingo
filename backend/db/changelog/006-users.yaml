databaseChangeLog:
  - changeSet:
      id: create-table-users
      author: starter-scaffold
      changes:
        - sql:
            sql: |
              CREATE TABLE users (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                user_name citext UNIQUE,
                handle citext UNIQUE,
                name_id uuid REFERENCES versioned_names(id),
                description_id uuid REFERENCES versioned_descriptions(id),
                email citext UNIQUE,
                hashed_password varchar(255),
                role user_role_enum NOT NULL DEFAULT 'user',
                bio text,
                status user_status_enum NOT NULL DEFAULT 'active',
                verified boolean DEFAULT false,
                flagged boolean DEFAULT false,
                deleted_at timestamptz,
                inserted_at timestamptz NOT NULL,
                updated_at timestamptz NOT NULL
              );
      rollback:
        - dropTable:
            tableName: users

  - changeSet:
      id: create-index-users-email
      author: starter-scaffold
      changes:
        - createIndex:
            indexName: idx_users_email
            tableName: users
            unique: true
            columns:
              - column:
                  name: email
      rollback:
        - dropIndex:
            indexName: idx_users_email
            tableName: users

  - changeSet:
      id: create-index-users-user-name
      author: starter-scaffold
      changes:
        - createIndex:
            indexName: idx_users_user_name
            tableName: users
            unique: true
            columns:
              - column:
                  name: user_name
      rollback:
        - dropIndex:
            indexName: idx_users_user_name
            tableName: users

  - changeSet:
      id: create-index-users-handle
      author: starter-scaffold
      changes:
        - createIndex:
            indexName: idx_users_handle
            tableName: users
            unique: true
            columns:
              - column:
                  name: handle
      rollback:
        - dropIndex:
            indexName: idx_users_handle
            tableName: users

databaseChangeLog:
  # Revamp ticket queues into methodology-aware **boards** supporting Kanban,
  # Scrum/Agile sprints, Waterfall, and Spiral planning. A board has ordered
  # stages (columns / phases / lanes) and optional iterations (sprints / cycles).
  # Boards are tri-scoped (global / org / project) like ticket definitions.
  # Tickets gain a current stage and an optional iteration.

  # ── ticket_queues → boards ───────────────────────────────────
  - changeSet:
      id: boards-extend-ticket-queues
      author: tobor-locker
      changes:
        - sql:
            sql: |
              DROP INDEX IF EXISTS idx_ticket_queues_slug;
              ALTER TABLE ticket_queues
                ADD COLUMN organization_id uuid REFERENCES organizations(id) ON DELETE CASCADE,
                ADD COLUMN project_id uuid REFERENCES projects(id) ON DELETE CASCADE,
                ADD COLUMN methodology varchar(255) NOT NULL DEFAULT 'kanban'
                  CHECK (methodology IN ('kanban', 'scrum', 'waterfall', 'spiral')),
                ADD COLUMN config jsonb NOT NULL DEFAULT '{}';
              CREATE UNIQUE INDEX idx_ticket_queues_global_slug
                ON ticket_queues (slug) WHERE organization_id IS NULL AND project_id IS NULL;
              CREATE UNIQUE INDEX idx_ticket_queues_org_slug
                ON ticket_queues (organization_id, slug) WHERE organization_id IS NOT NULL AND project_id IS NULL;
              CREATE UNIQUE INDEX idx_ticket_queues_project_slug
                ON ticket_queues (organization_id, project_id, slug) WHERE project_id IS NOT NULL;
              CREATE INDEX idx_ticket_queues_scope ON ticket_queues (organization_id, project_id);
      rollback:
        - sql:
            sql: |
              DROP INDEX IF EXISTS idx_ticket_queues_global_slug;
              DROP INDEX IF EXISTS idx_ticket_queues_org_slug;
              DROP INDEX IF EXISTS idx_ticket_queues_project_slug;
              DROP INDEX IF EXISTS idx_ticket_queues_scope;
              ALTER TABLE ticket_queues
                DROP COLUMN organization_id, DROP COLUMN project_id,
                DROP COLUMN methodology, DROP COLUMN config;
              CREATE UNIQUE INDEX idx_ticket_queues_slug ON ticket_queues (slug);

  # ── board_stages (columns / phases / lanes) ──────────────────
  - changeSet:
      id: create-table-board-stages
      author: tobor-locker
      changes:
        - sql:
            sql: |
              CREATE TABLE board_stages (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                queue_id uuid NOT NULL REFERENCES ticket_queues(id) ON DELETE CASCADE,
                slug varchar(255) NOT NULL,
                name varchar(255) NOT NULL,
                kind varchar(255) NOT NULL DEFAULT 'stage',
                position integer NOT NULL DEFAULT 0,
                wip_limit integer,
                config jsonb NOT NULL DEFAULT '{}',
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
              CREATE UNIQUE INDEX idx_board_stages_queue_slug ON board_stages (queue_id, slug);
              CREATE INDEX idx_board_stages_queue_position ON board_stages (queue_id, position);
      rollback:
        - dropTable:
            tableName: board_stages

  # ── board_iterations (sprints / cycles) ──────────────────────
  - changeSet:
      id: create-table-board-iterations
      author: tobor-locker
      changes:
        - sql:
            sql: |
              CREATE TABLE board_iterations (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                queue_id uuid NOT NULL REFERENCES ticket_queues(id) ON DELETE CASCADE,
                name varchar(255) NOT NULL,
                sequence integer NOT NULL DEFAULT 0,
                status varchar(255) NOT NULL DEFAULT 'planned'
                  CHECK (status IN ('planned', 'active', 'completed')),
                goal text,
                starts_on date,
                ends_on date,
                config jsonb NOT NULL DEFAULT '{}',
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
              CREATE INDEX idx_board_iterations_queue_seq ON board_iterations (queue_id, sequence);
              CREATE INDEX idx_board_iterations_status ON board_iterations (queue_id, status);
      rollback:
        - dropTable:
            tableName: board_iterations

  # ── tickets: current stage + iteration ───────────────────────
  - changeSet:
      id: tickets-add-stage-and-iteration
      author: tobor-locker
      changes:
        - sql:
            sql: |
              ALTER TABLE tickets
                ADD COLUMN stage_id uuid REFERENCES board_stages(id) ON DELETE SET NULL,
                ADD COLUMN iteration_id uuid REFERENCES board_iterations(id) ON DELETE SET NULL;
              CREATE INDEX idx_tickets_stage_id ON tickets (stage_id);
              CREATE INDEX idx_tickets_iteration_id ON tickets (iteration_id);
      rollback:
        - sql:
            sql: |
              DROP INDEX IF EXISTS idx_tickets_stage_id;
              DROP INDEX IF EXISTS idx_tickets_iteration_id;
              ALTER TABLE tickets DROP COLUMN stage_id, DROP COLUMN iteration_id;

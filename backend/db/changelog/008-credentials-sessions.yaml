databaseChangeLog:
  - changeSet:
      id: create-table-user-credentials
      author: starter-scaffold
      changes:
        - sql:
            sql: |
              CREATE TABLE user_credentials (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                user_id uuid NOT NULL REFERENCES users(id),
                auth_provider_id uuid NOT NULL REFERENCES auth_providers(id),
                description_id uuid REFERENCES versioned_descriptions(id),
                status credential_status_enum NOT NULL DEFAULT 'active',
                settings jsonb,
                state jsonb,
                fingerprint varchar(255),
                deleted_at timestamptz,
                inserted_at timestamptz NOT NULL,
                updated_at timestamptz NOT NULL
              );
      rollback:
        - dropTable:
            tableName: user_credentials

  - changeSet:
      id: create-index-user-credentials-user-provider
      author: starter-scaffold
      changes:
        - createIndex:
            indexName: idx_user_credentials_user_provider
            tableName: user_credentials
            columns:
              - column:
                  name: user_id
              - column:
                  name: auth_provider_id
      rollback:
        - dropIndex:
            indexName: idx_user_credentials_user_provider
            tableName: user_credentials

  - changeSet:
      id: create-table-user-sessions
      author: starter-scaffold
      changes:
        - sql:
            sql: |
              CREATE TABLE user_sessions (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                user_id uuid NOT NULL REFERENCES users(id),
                credential_id uuid REFERENCES user_credentials(id),
                status session_status_enum NOT NULL DEFAULT 'active',
                details jsonb,
                deleted_at timestamptz,
                inserted_at timestamptz NOT NULL,
                updated_at timestamptz NOT NULL
              );
      rollback:
        - dropTable:
            tableName: user_sessions

  - changeSet:
      id: create-index-user-sessions-user-id
      author: starter-scaffold
      changes:
        - createIndex:
            indexName: idx_user_sessions_user_id
            tableName: user_sessions
            columns:
              - column:
                  name: user_id
      rollback:
        - dropIndex:
            indexName: idx_user_sessions_user_id
            tableName: user_sessions

databaseChangeLog:
  # Org-scoped pool of reusable LLM connections (provider + model + endpoint +
  # key). Mirrors the github_tokens convention: one credential, referenced by
  # many consumers. Each mock MCP definition points at one as its active LLM.
  - changeSet:
      id: create-table-mock-mcp-llms
      author: tobor-locker
      changes:
        - sql:
            sql: |
              CREATE TABLE mock_mcp_llms (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                organization_id uuid NOT NULL REFERENCES organizations(id) ON DELETE CASCADE,
                label varchar(255) NOT NULL,
                provider varchar(255) NOT NULL DEFAULT 'openai',
                model varchar(255) NOT NULL,
                endpoint varchar(1024),
                api_key text,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now(),
                CONSTRAINT uq_mock_mcp_llms_org_label UNIQUE (organization_id, label)
              );
              CREATE INDEX idx_mock_mcp_llms_organization_id ON mock_mcp_llms (organization_id);
      rollback:
        - dropTable:
            tableName: mock_mcp_llms

  - changeSet:
      id: create-table-mock-mcp-definitions
      author: tobor-locker
      changes:
        - sql:
            sql: |
              CREATE TABLE mock_mcp_definitions (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                organization_id uuid NOT NULL REFERENCES organizations(id) ON DELETE CASCADE,
                slug varchar(255) NOT NULL,
                title varchar(255) NOT NULL,
                prompt text NOT NULL,
                status varchar(255) NOT NULL DEFAULT 'draft',
                tools_json jsonb NOT NULL DEFAULT '[]',
                resources_json jsonb NOT NULL DEFAULT '[]',
                prompts_json jsonb NOT NULL DEFAULT '[]',
                schema_sql text,
                active_llm_id uuid REFERENCES mock_mcp_llms(id) ON DELETE SET NULL,
                db_name varchar(255),
                db_provisioned boolean DEFAULT false,
                created_by varchar(255),
                project_id uuid REFERENCES projects(id) ON DELETE SET NULL,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
      rollback:
        - dropTable:
            tableName: mock_mcp_definitions

  - changeSet:
      id: create-indexes-mock-mcp-definitions
      author: tobor-locker
      changes:
        - createIndex:
            indexName: idx_mock_mcp_definitions_slug
            tableName: mock_mcp_definitions
            unique: true
            columns:
              - column:
                  name: slug
        - createIndex:
            indexName: idx_mock_mcp_definitions_status
            tableName: mock_mcp_definitions
            columns:
              - column:
                  name: status
        - createIndex:
            indexName: idx_mock_mcp_definitions_organization_id
            tableName: mock_mcp_definitions
            columns:
              - column:
                  name: organization_id
        - createIndex:
            indexName: idx_mock_mcp_definitions_project_id
            tableName: mock_mcp_definitions
            columns:
              - column:
                  name: project_id
      rollback:
        - dropIndex:
            indexName: idx_mock_mcp_definitions_slug
        - dropIndex:
            indexName: idx_mock_mcp_definitions_status
        - dropIndex:
            indexName: idx_mock_mcp_definitions_organization_id
        - dropIndex:
            indexName: idx_mock_mcp_definitions_project_id

  - changeSet:
      id: create-table-mock-mcp-call-logs
      author: tobor-locker
      changes:
        - sql:
            sql: |
              CREATE TABLE mock_mcp_call_logs (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                definition_id uuid NOT NULL REFERENCES mock_mcp_definitions(id) ON DELETE CASCADE,
                session_id varchar(255),
                method varchar(255) NOT NULL,
                tool_name varchar(255),
                arguments jsonb,
                response jsonb,
                latency_ms integer,
                error text,
                inserted_at timestamptz NOT NULL DEFAULT now()
              );
      rollback:
        - dropTable:
            tableName: mock_mcp_call_logs

  - changeSet:
      id: create-indexes-mock-mcp-call-logs
      author: tobor-locker
      changes:
        - createIndex:
            indexName: idx_mock_mcp_call_logs_definition_id
            tableName: mock_mcp_call_logs
            columns:
              - column:
                  name: definition_id
        - createIndex:
            indexName: idx_mock_mcp_call_logs_inserted_at
            tableName: mock_mcp_call_logs
            columns:
              - column:
                  name: inserted_at
      rollback:
        - dropIndex:
            indexName: idx_mock_mcp_call_logs_definition_id
        - dropIndex:
            indexName: idx_mock_mcp_call_logs_inserted_at

databaseChangeLog:
  # ── GitHub tokens ───────────────────────────────────────────────────────
  # Org-scoped raw GitHub PATs. The token value is stored verbatim (no
  # GitHub API integration yet) and referenced by github_repos via token_id.
  # One token may be mapped to many repos (1:N token : repo).
  - changeSet:
      id: 027-create-table-github-tokens
      author: starter-scaffold
      changes:
        - sql:
            sql: |
              CREATE TABLE github_tokens (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                organization_id uuid NOT NULL REFERENCES organizations(id) ON DELETE CASCADE,
                label varchar(120) NOT NULL,
                token text NOT NULL,
                inserted_at timestamptz NOT NULL,
                updated_at timestamptz NOT NULL,
                CONSTRAINT uq_github_tokens_org_label UNIQUE (organization_id, label)
              );
              CREATE INDEX idx_github_tokens_org ON github_tokens (organization_id);
      rollback:
        - dropTable:
            tableName: github_tokens

  # ── GitHub repos ────────────────────────────────────────────────────────
  # A repo is a raw "owner/name" identifier the admin maps to a token. If the
  # referenced token is deleted, the repo keeps its row but token_id is nulled.
  - changeSet:
      id: 027-create-table-github-repos
      author: starter-scaffold
      changes:
        - sql:
            sql: |
              CREATE TABLE github_repos (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                organization_id uuid NOT NULL REFERENCES organizations(id) ON DELETE CASCADE,
                repo_full_name text NOT NULL,
                token_id uuid REFERENCES github_tokens(id) ON DELETE SET NULL,
                inserted_at timestamptz NOT NULL,
                updated_at timestamptz NOT NULL,
                CONSTRAINT uq_github_repos_org_name UNIQUE (organization_id, repo_full_name)
              );
              CREATE INDEX idx_github_repos_org ON github_repos (organization_id);
              CREATE INDEX idx_github_repos_token ON github_repos (token_id);
      rollback:
        - dropTable:
            tableName: github_repos

special_usages:
  - slug: npl-boundary-control
    name: "npl-boundary-control"
    title: "NPL Boundary Control"
    description: "Marks high-precedence NPL wrapper boundaries such as framework, agent, runtime, and template sections."
    references:
      - type: npl-section
        ref: "special-sections"
      - type: npl-component
        ref: "special-sections#npl-extension"
    flags: [npl, boundary]
    topics: [npl-syntax, prompt-structure]
  - slug: npl-secure-block
    name: "npl-secure-block"
    title: "NPL Secure Block"
    description: "Marks protected prompt content or non-disclosure rules in NPL contexts."
    references:
      - type: npl-component
        ref: "special-sections#secure-prompt"
    flags: [npl, security, high-importance]
    topics: [npl-syntax, safety]
  - slug: npl-runtime-flags
    name: "npl-runtime-flags"
    title: "NPL Runtime Flags"
    description: "Signals runtime configuration or behavioral flags inside NPL prompts."
    references:
      - type: npl-component
        ref: "special-sections#runtime-flags"
    flags: [npl, runtime]
    topics: [npl-syntax, configuration]
  - slug: npl-template-block
    name: "npl-template-block"
    title: "NPL Template Block"
    description: "Marks reusable named templates or template fragments."
    references:
      - type: npl-component
        ref: "special-sections#named-template"
    flags: [npl, template]
    topics: [npl-syntax, templates]
  - slug: npl-high-importance
    name: "npl-high-importance"
    title: "NPL High Importance"
    description: "Marks text as high-priority, attention-worthy, or operationally important for an agent."
    references:
      - type: npl-label
        ref: "priority#high"
    flags: [npl, high-importance]
    topics: [npl-syntax, emphasis]
  - slug: unicode-control-hazard
    name: "unicode-control-hazard"
    title: "Unicode Control Hazard"
    description: "Flags non-printable, terminal-sensitive, invisible, or directional Unicode elements that agents should not emit casually."
    references:
      - type: unicode-topic
        ref: "control-code"
    flags: [control, safety]
    topics: [unicode, agent-safety]


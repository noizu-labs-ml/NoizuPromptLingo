databaseChangeLog:
  # Parity with therobotplans migrations 022 (status/accepted_by/accepted_at)
  # and 033 (starts_at/redemption_count + invite_token_redemptions table),
  # applied here so TRP's invite flow can move onto pm_core wholesale.
  # ADD COLUMN IF NOT EXISTS / CREATE TABLE IF NOT EXISTS are no-ops on
  # installs that already have these (none do yet — 007/019 predate them).
  - changeSet:
      id: pm-023-invite-tokens-status-columns
      author: noizu-pm
      changes:
        - sql:
            sql: |
              ALTER TABLE invite_tokens
                ADD COLUMN IF NOT EXISTS status varchar(20) NOT NULL DEFAULT 'pending',
                ADD COLUMN IF NOT EXISTS accepted_by uuid REFERENCES users(id) ON DELETE SET NULL,
                ADD COLUMN IF NOT EXISTS accepted_at timestamptz,
                ADD COLUMN IF NOT EXISTS starts_at timestamptz,
                ADD COLUMN IF NOT EXISTS redemption_count integer NOT NULL DEFAULT 0;

              UPDATE invite_tokens SET status = CASE
                WHEN revoked THEN 'revoked'
                WHEN expires_at < NOW() THEN 'expired'
                ELSE 'pending'
              END
              WHERE status = 'pending';
      rollback:
        - sql:
            sql: |
              ALTER TABLE invite_tokens
                DROP COLUMN IF EXISTS redemption_count,
                DROP COLUMN IF EXISTS starts_at,
                DROP COLUMN IF EXISTS accepted_at,
                DROP COLUMN IF EXISTS accepted_by,
                DROP COLUMN IF EXISTS status;

  - changeSet:
      id: pm-023-invite-token-redemptions
      author: noizu-pm
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: invite_token_redemptions
      changes:
        - sql:
            sql: |
              CREATE TABLE invite_token_redemptions (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                invite_token_id uuid NOT NULL REFERENCES invite_tokens(id) ON DELETE CASCADE,
                user_id uuid NOT NULL REFERENCES users(id) ON DELETE CASCADE,
                redeemed_at timestamptz NOT NULL DEFAULT now(),
                remote_ip text,
                user_agent text,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );

              CREATE INDEX idx_invite_token_redemptions_invite_token_id
                ON invite_token_redemptions (invite_token_id);
              CREATE INDEX idx_invite_token_redemptions_user_id
                ON invite_token_redemptions (user_id);
      rollback:
        - dropTable:
            tableName: invite_token_redemptions

databaseChangeLog:
  # PBAC: groups, group hierarchy, scoped memberships, policies, and the join
  # tables. Enums (role_name_enum, member_type_enum, resource_type_enum) are the
  # widened forms from 001-enums.

  - changeSet:
      id: pm-008-groups
      author: noizu-pm
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: groups
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE TABLE groups (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                name role_name_enum NOT NULL UNIQUE,
                display_name varchar(200) NOT NULL,
                description text,
                is_system boolean NOT NULL DEFAULT true,
                created_at timestamptz DEFAULT now(),
                updated_at timestamptz DEFAULT now()
              );

              CREATE OR REPLACE FUNCTION update_groups_updated_at()
              RETURNS TRIGGER AS $$
              BEGIN
                NEW.updated_at = now();
                RETURN NEW;
              END;
              $$ LANGUAGE plpgsql;

              CREATE TRIGGER update_groups_updated_at
                BEFORE UPDATE ON groups
                FOR EACH ROW
                EXECUTE FUNCTION update_groups_updated_at();
      rollback:
        - sql:
            sql: |
              DROP TRIGGER IF EXISTS update_groups_updated_at ON groups;
              DROP FUNCTION IF EXISTS update_groups_updated_at();
              DROP TABLE groups;

  - changeSet:
      id: pm-008-group-hierarchy
      author: noizu-pm
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: group_hierarchy
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE TABLE group_hierarchy (
                ancestor_id uuid NOT NULL REFERENCES groups(id) ON DELETE CASCADE,
                descendant_id uuid NOT NULL REFERENCES groups(id) ON DELETE CASCADE,
                depth integer NOT NULL CHECK (depth >= 0 AND depth <= 10),
                PRIMARY KEY (ancestor_id, descendant_id)
              );
              CREATE INDEX idx_group_hierarchy_ancestor ON group_hierarchy (ancestor_id);
              CREATE INDEX idx_group_hierarchy_descendant ON group_hierarchy (descendant_id);

              CREATE OR REPLACE FUNCTION add_group_self_hierarchy()
              RETURNS TRIGGER AS $$
              BEGIN
                INSERT INTO group_hierarchy (ancestor_id, descendant_id, depth)
                VALUES (NEW.id, NEW.id, 0);
                RETURN NEW;
              END;
              $$ LANGUAGE plpgsql;

              CREATE TRIGGER add_group_self_hierarchy
                AFTER INSERT ON groups
                FOR EACH ROW
                EXECUTE FUNCTION add_group_self_hierarchy();
      rollback:
        - sql:
            sql: |
              DROP TRIGGER IF EXISTS add_group_self_hierarchy ON groups;
              DROP FUNCTION IF EXISTS add_group_self_hierarchy();
              DROP TABLE group_hierarchy;

  - changeSet:
      id: pm-008-scoped-memberships
      author: noizu-pm
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: scoped_memberships
      changes:
        - sql:
            sql: |
              CREATE TABLE scoped_memberships (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                group_id uuid NOT NULL REFERENCES groups(id) ON DELETE CASCADE,
                resource_type resource_type_enum NOT NULL,
                resource_id uuid NOT NULL,
                member_type member_type_enum NOT NULL,
                member_id uuid NOT NULL,
                expires_at timestamptz,
                added_by uuid REFERENCES users(id) ON DELETE SET NULL,
                created_at timestamptz NOT NULL DEFAULT now(),
                CONSTRAINT uq_scoped_memberships_resource_member
                  UNIQUE (resource_type, resource_id, member_type, member_id)
              );
              CREATE INDEX idx_scoped_memberships_resource_covering
                ON scoped_memberships (resource_type, resource_id)
                INCLUDE (member_type, member_id, group_id, expires_at);
              CREATE INDEX idx_scoped_memberships_user_resource
                ON scoped_memberships (member_id, resource_type, resource_id, group_id)
                INCLUDE (expires_at)
                WHERE member_type = 'user';
              CREATE INDEX idx_scoped_memberships_expires_at
                ON scoped_memberships (expires_at);
              CREATE INDEX idx_scoped_memberships_group_id
                ON scoped_memberships (group_id);
      rollback:
        - sql:
            sql: DROP TABLE scoped_memberships;

  - changeSet:
      id: pm-008-cascade-org-membership-removal
      author: noizu-pm
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION cascade_org_membership_removal()
              RETURNS TRIGGER AS $$
              BEGIN
                IF OLD.resource_type = 'organization' AND OLD.member_type = 'user' THEN
                  DELETE FROM scoped_memberships sm
                  USING projects p
                  WHERE sm.member_type = 'user'
                    AND sm.member_id = OLD.member_id
                    AND sm.resource_type = 'project'
                    AND sm.resource_id = p.id
                    AND p.organization_id = OLD.resource_id;
                END IF;
                RETURN OLD;
              END;
              $$ LANGUAGE plpgsql;

              CREATE TRIGGER cascade_org_removal
                AFTER DELETE ON scoped_memberships
                FOR EACH ROW
                EXECUTE FUNCTION cascade_org_membership_removal();
      rollback:
        - sql:
            sql: |
              DROP TRIGGER IF EXISTS cascade_org_removal ON scoped_memberships;
              DROP FUNCTION IF EXISTS cascade_org_membership_removal();

  - changeSet:
      id: pm-008-policies
      author: noizu-pm
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: policies
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE TABLE policies (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                name varchar(100) NOT NULL UNIQUE,
                description text,
                policy_document jsonb NOT NULL,
                is_system boolean NOT NULL DEFAULT false,
                is_active boolean NOT NULL DEFAULT true,
                created_by uuid REFERENCES users(id) ON DELETE SET NULL,
                created_at timestamptz DEFAULT now(),
                updated_at timestamptz DEFAULT now()
              );

              CREATE OR REPLACE FUNCTION update_policies_updated_at()
              RETURNS TRIGGER AS $$
              BEGIN
                NEW.updated_at = now();
                RETURN NEW;
              END;
              $$ LANGUAGE plpgsql;

              CREATE TRIGGER update_policies_updated_at
                BEFORE UPDATE ON policies
                FOR EACH ROW
                EXECUTE FUNCTION update_policies_updated_at();

              CREATE INDEX idx_policies_name_active ON policies (name) WHERE is_active = true;
              CREATE INDEX idx_policies_document_gin ON policies USING GIN (policy_document);
      rollback:
        - sql:
            sql: |
              DROP TRIGGER IF EXISTS update_policies_updated_at ON policies;
              DROP FUNCTION IF EXISTS update_policies_updated_at();
              DROP TABLE policies;

  - changeSet:
      id: pm-008-group-policies
      author: noizu-pm
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: group_policies
      changes:
        - sql:
            sql: |
              CREATE TABLE group_policies (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                group_id uuid NOT NULL REFERENCES groups(id) ON DELETE CASCADE,
                policy_id uuid NOT NULL REFERENCES policies(id) ON DELETE CASCADE,
                priority integer NOT NULL DEFAULT 0,
                created_at timestamptz DEFAULT now(),
                CONSTRAINT uq_group_policies_group_policy UNIQUE (group_id, policy_id)
              );
              CREATE INDEX idx_group_policies_group_covering
                ON group_policies (group_id) INCLUDE (policy_id, priority);
              CREATE INDEX idx_group_policies_policy_id ON group_policies (policy_id);
      rollback:
        - dropTable:
            tableName: group_policies

  - changeSet:
      id: pm-008-user-policies
      author: noizu-pm
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: user_policies
      changes:
        - sql:
            sql: |
              CREATE TABLE user_policies (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                user_id uuid NOT NULL REFERENCES users(id) ON DELETE CASCADE,
                policy_id uuid NOT NULL REFERENCES policies(id) ON DELETE CASCADE,
                resource_type resource_type_enum,
                resource_id uuid,
                priority integer NOT NULL DEFAULT 0,
                created_at timestamptz DEFAULT now(),
                CONSTRAINT uq_user_policies_user_policy_resource
                  UNIQUE (user_id, policy_id, resource_type, resource_id)
              );
              CREATE INDEX idx_user_policies_user_resource_covering
                ON user_policies (user_id, resource_type, resource_id) INCLUDE (policy_id, priority);
              CREATE INDEX idx_user_policies_policy_id ON user_policies (policy_id);
      rollback:
        - dropTable:
            tableName: user_policies

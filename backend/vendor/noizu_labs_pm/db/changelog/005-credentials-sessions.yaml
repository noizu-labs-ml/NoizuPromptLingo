databaseChangeLog:
  - changeSet:
      id: pm-005-user-credentials
      author: noizu-pm
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: user_credentials
      changes:
        - sql:
            sql: |
              CREATE TABLE user_credentials (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                user_id uuid NOT NULL REFERENCES users(id),
                auth_provider_id uuid NOT NULL REFERENCES auth_providers(id),
                description_id uuid REFERENCES versioned_descriptions(id),
                status credential_status_enum NOT NULL DEFAULT 'active',
                settings jsonb,
                state jsonb,
                fingerprint varchar(255),
                deleted_at timestamptz,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
              CREATE INDEX idx_user_credentials_user_provider
                ON user_credentials (user_id, auth_provider_id);
              CREATE UNIQUE INDEX uq_user_credentials_provider_fingerprint
                ON user_credentials (auth_provider_id, fingerprint)
                WHERE fingerprint IS NOT NULL AND deleted_at IS NULL;
      rollback:
        - dropTable:
            tableName: user_credentials

  - changeSet:
      id: pm-005-user-sessions
      author: noizu-pm
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: user_sessions
      changes:
        - sql:
            sql: |
              CREATE TABLE user_sessions (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                user_id uuid NOT NULL REFERENCES users(id),
                credential_id uuid REFERENCES user_credentials(id),
                status session_status_enum NOT NULL DEFAULT 'active',
                details jsonb,
                claim_code varchar(255),
                claim_code_expires_at timestamptz,
                deleted_at timestamptz,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
              CREATE INDEX idx_user_sessions_user_id ON user_sessions (user_id);
      rollback:
        - dropTable:
            tableName: user_sessions

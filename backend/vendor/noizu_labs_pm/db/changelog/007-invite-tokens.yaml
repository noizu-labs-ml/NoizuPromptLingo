databaseChangeLog:
  - changeSet:
      id: pm-007-invite-tokens
      author: noizu-pm
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: invite_tokens
      changes:
        - sql:
            sql: |
              CREATE TABLE invite_tokens (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                organization_id uuid REFERENCES organizations(id),
                created_by_user_id uuid REFERENCES users(id),
                token_hash varchar(255) NOT NULL,
                key_prefix varchar(10) NOT NULL,
                email citext,
                -- Inviter-chosen join role (admin | member | viewer); never owner.
                role varchar(32) NOT NULL DEFAULT 'viewer',
                max_uses integer,
                uses integer NOT NULL DEFAULT 0,
                expires_at timestamptz,
                revoked boolean DEFAULT false,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
              CREATE INDEX idx_invite_tokens_key_prefix ON invite_tokens (key_prefix);
              CREATE UNIQUE INDEX idx_invite_tokens_token_hash ON invite_tokens (token_hash);
      rollback:
        - dropTable:
            tableName: invite_tokens

  # Wire the deferred users.invite_token_id FK now that invite_tokens exists.
  - changeSet:
      id: pm-007-users-invite-token-fk
      author: noizu-pm
      changes:
        - sql:
            sql: |
              ALTER TABLE users
                ADD CONSTRAINT fk_users_invite_token
                FOREIGN KEY (invite_token_id) REFERENCES invite_tokens(id);
      rollback:
        - sql:
            sql: ALTER TABLE users DROP CONSTRAINT IF EXISTS fk_users_invite_token;

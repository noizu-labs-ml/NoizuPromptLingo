databaseChangeLog:
  # Only the extensions the pm_core schema actually uses. postgis/pgvector are
  # intentionally NOT required here (no geometry/vector columns in the PM set);
  # those live in the npl app's own type module. citext backs slug/email columns.
  - changeSet:
      id: pm-000-extensions
      author: noizu-pm
      changes:
        - sql:
            sql: CREATE EXTENSION IF NOT EXISTS citext;
        - sql:
            sql: CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
        - sql:
            sql: CREATE EXTENSION IF NOT EXISTS pgcrypto;
        - sql:
            sql: CREATE EXTENSION IF NOT EXISTS pg_trgm;
      rollback:
        - sql:
            sql: DROP EXTENSION IF EXISTS pg_trgm;
        - sql:
            sql: DROP EXTENSION IF EXISTS pgcrypto;
        - sql:
            sql: DROP EXTENSION IF EXISTS "uuid-ossp";
        - sql:
            sql: DROP EXTENSION IF EXISTS citext;

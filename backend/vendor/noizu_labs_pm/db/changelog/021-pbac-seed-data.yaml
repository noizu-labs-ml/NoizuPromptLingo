databaseChangeLog:
  # System PBAC seed for greenfield / incomplete ETL pm_core.
  # Groups may already exist from ETL (ON CONFLICT name DO NOTHING).
  # Policies + group_policies were missing on live pm_core (0 rows) — blocks permission checks.
  - changeSet:
      id: 021-seed-pbac-groups
      author: pm-core
      changes:
        - sql:
            sql: |
              INSERT INTO groups (id, name, display_name, description, is_system)
              VALUES
                ('a1b2c3d4-e5f6-5a7b-8c9d-0e1f2a3b4c5d', 'owner', 'Owners', 'Full resource access including deletion', true),
                ('b2c3d4e5-f6a7-5b8c-9d0e-1f2a3b4c5d6e', 'admin', 'Administrators', 'Full access except root resource deletion', true),
                ('c3d4e5f6-a7b8-5c9d-0e1f-2a3b4c5d6e7f', 'member', 'Members', 'Working access to projects and resources', true),
                ('d4e5f6a7-b8c9-5d0e-1f2a-3b4c5d6e7f80', 'viewer', 'Viewers', 'Read-only access to resources', true),
                ('e5f6a7b8-c9d0-5e1f-2a3b-4c5d6e7f8090', 'lead', 'Leads', 'Elevated member access between admin and member', true)
              ON CONFLICT (name) DO NOTHING;
      rollback:
        - sql:
            sql: DELETE FROM groups WHERE is_system = true AND name IN ('owner','admin','member','viewer','lead');

  - changeSet:
      id: 021-seed-pbac-policies
      author: pm-core
      changes:
        - sql:
            sql: |
              INSERT INTO policies (id, name, description, policy_document, is_system, is_active)
              VALUES
                (
                  'e5f6a7b8-c9d0-5e1f-2a3b-4c5d6e7f8091',
                  'system:super-admin',
                  'Unlimited platform access',
                  '{"version":"2025-01-01","statements":[{"sid":"super-admin-allow-all","effect":"allow","actions":["*"],"resources":["*"]}]}',
                  true, true
                ),
                (
                  'f6a7b8c9-d0e1-5f2a-3b4c-5d6e7f8091a2',
                  'system:owner',
                  'Full access to owned resource and children',
                  '{"version":"2025-01-01","statements":[{"sid":"owner-allow-all","effect":"allow","actions":["*"],"resources":["${resource_type}:${resource_id}","${resource_type}:${resource_id}/*"]}]}',
                  true, true
                ),
                (
                  'a7b8c9d0-e1f2-5a3b-4c5d-6e7f8091a2b3',
                  'system:admin',
                  'Full access except root resource deletion',
                  '{"version":"2025-01-01","statements":[{"sid":"admin-allow-all","effect":"allow","actions":["*"],"resources":["${resource_type}:${resource_id}","${resource_type}:${resource_id}/*"]},{"sid":"admin-deny-delete-root","effect":"deny","actions":["${resource_type}:delete"],"resources":["${resource_type}:${resource_id}"]}]}',
                  true, true
                ),
                (
                  'b8c9d0e1-f2a3-5b4c-5d6e-7f8091a2b3c4',
                  'system:member',
                  'Working access to projects',
                  '{"version":"2025-01-01","statements":[{"sid":"member-allow-work","effect":"allow","actions":["*:view","*:list","project:create","project:view","project:update","project:deploy","project:export"],"resources":["${resource_type}:${resource_id}","${resource_type}:${resource_id}/*"]}]}',
                  true, true
                ),
                (
                  'c9d0e1f2-a3b4-5c5d-6e7f-8091a2b3c4d5',
                  'system:viewer',
                  'Read-only access',
                  '{"version":"2025-01-01","statements":[{"sid":"viewer-allow-read","effect":"allow","actions":["*:view","*:list","project:export"],"resources":["${resource_type}:${resource_id}","${resource_type}:${resource_id}/*"]}]}',
                  true, true
                ),
                (
                  'd0e1f2a3-b4c5-5d6e-7f80-91a2b3c4d5e6',
                  'system:lead',
                  'Elevated working access (lead role)',
                  '{"version":"2025-01-01","statements":[{"sid":"lead-allow-work","effect":"allow","actions":["*:view","*:list","*:create","*:update","project:deploy","project:export"],"resources":["${resource_type}:${resource_id}","${resource_type}:${resource_id}/*"]}]}',
                  true, true
                )
              ON CONFLICT (name) DO NOTHING;
      rollback:
        - sql:
            sql: DELETE FROM policies WHERE is_system = true;

  - changeSet:
      id: 021-seed-pbac-group-policy-links
      author: pm-core
      changes:
        - sql:
            sql: |
              INSERT INTO group_policies (group_id, policy_id, priority)
              SELECT g.id, p.id, 0
              FROM groups g, policies p
              WHERE (g.name = 'owner' AND p.name = 'system:owner')
                 OR (g.name = 'admin' AND p.name = 'system:admin')
                 OR (g.name = 'member' AND p.name = 'system:member')
                 OR (g.name = 'viewer' AND p.name = 'system:viewer')
                 OR (g.name = 'lead' AND p.name = 'system:lead')
              ON CONFLICT (group_id, policy_id) DO NOTHING;
      rollback:
        - sql:
            sql: |
              DELETE FROM group_policies
              WHERE policy_id IN (SELECT id FROM policies WHERE is_system = true);

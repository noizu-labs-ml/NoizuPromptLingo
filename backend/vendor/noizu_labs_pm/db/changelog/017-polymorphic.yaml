databaseChangeLog:
  # Polymorphic pm_* tables — consolidate npl_comments/npl_reactions/npl_attachments
  # and trp_comments/trp_reactions/trp_attachments into one set keyed by
  # (entity_type, entity_id). items → "item", wiki pages → "wiki_page", etc.

  - changeSet:
      id: pm-017-pm-comments
      author: noizu-pm
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: pm_comments
      changes:
        - sql:
            sql: |
              CREATE TABLE pm_comments (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                entity_type varchar(64) NOT NULL,
                entity_id uuid NOT NULL,
                content text NOT NULL,
                author varchar(255),
                location varchar(255),
                reply_to_id uuid,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
              CREATE INDEX idx_pm_comments_entity ON pm_comments (entity_type, entity_id);
      rollback:
        - dropTable:
            tableName: pm_comments

  - changeSet:
      id: pm-017-pm-reactions
      author: noizu-pm
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: pm_reactions
      changes:
        - sql:
            sql: |
              CREATE TABLE pm_reactions (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                entity_type varchar(64) NOT NULL,
                entity_id uuid NOT NULL,
                persona varchar(255) NOT NULL,
                emoji varchar(64) NOT NULL,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
              CREATE INDEX idx_pm_reactions_entity ON pm_reactions (entity_type, entity_id);
              CREATE UNIQUE INDEX idx_pm_reactions_unique
                ON pm_reactions (entity_type, entity_id, persona, emoji);
      rollback:
        - dropTable:
            tableName: pm_reactions

  - changeSet:
      id: pm-017-pm-attachments
      author: noizu-pm
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: pm_attachments
      changes:
        - sql:
            sql: |
              CREATE TABLE pm_attachments (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                entity_type varchar(64) NOT NULL,
                entity_id uuid NOT NULL,
                artifact_type varchar(64) NOT NULL,
                url varchar(2048),
                git_branch varchar(255),
                description text,
                created_by varchar(255),
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
              CREATE INDEX idx_pm_attachments_entity ON pm_attachments (entity_type, entity_id);
      rollback:
        - dropTable:
            tableName: pm_attachments

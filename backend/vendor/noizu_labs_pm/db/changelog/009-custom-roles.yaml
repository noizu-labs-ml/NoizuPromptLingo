databaseChangeLog:
  - changeSet:
      id: pm-009-custom-roles
      author: noizu-pm
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: custom_roles
      changes:
        - sql:
            sql: |
              CREATE TABLE custom_roles (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                organization_id uuid NOT NULL REFERENCES organizations(id) ON DELETE CASCADE,
                name varchar(100) NOT NULL,
                display_name varchar(200) NOT NULL,
                description text,
                is_active boolean NOT NULL DEFAULT true,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now(),
                CONSTRAINT uq_custom_roles_org_name UNIQUE (organization_id, name)
              );
      rollback:
        - dropTable:
            tableName: custom_roles

  - changeSet:
      id: pm-009-custom-role-permissions
      author: noizu-pm
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: custom_role_permissions
      changes:
        - sql:
            sql: |
              CREATE TABLE custom_role_permissions (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                role_id uuid NOT NULL REFERENCES custom_roles(id) ON DELETE CASCADE,
                permission varchar(200) NOT NULL,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now(),
                CONSTRAINT uq_custom_role_permissions_role_perm UNIQUE (role_id, permission)
              );
      rollback:
        - dropTable:
            tableName: custom_role_permissions

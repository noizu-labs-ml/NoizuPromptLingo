databaseChangeLog:
  # ──────────────────────────────────────────────────────────────────────────
  # noizu_labs_pm — consolidated pm_core schema.
  #
  # Single source of truth for the identity spine + work-item tables shared by
  # npl-mcp (NoizuPromptLingua) and therobotplans. Consolidated from both apps'
  # Liquibase changelogs with the reconciliations applied:
  #   • npl `tickets` / `ticket_*` → `items` / `item_*` (one items family).
  #   • users = npl ∪ trp (role + bio + invite/approval/password/consent/admin);
  #     user_status_enum widened to add `pending`.
  #   • projects = npl + trp superset (default_methodology, default_queue_id).
  #   • polymorphic npl_comments/npl_reactions/nlp_attachments + trp_* → pm_*.
  #   • PBAC enums widened to their union (role_name +lead, member_type +persona,
  #     resource_type +github_repo).
  #   • guardrails: lock_version on projects/items/memberships; BEFORE DELETE
  #     triggers forcing soft-delete on the shared core tables.
  # Every CREATE is guarded by a table-exists precondition so the same changelog
  # can (re)build a fresh pm_core or adopt tables migrated in from either app.
  # ──────────────────────────────────────────────────────────────────────────
  - include:
      file: 000-extensions.yaml
      relativeToChangelogFile: true
  - include:
      file: 001-enums.yaml
      relativeToChangelogFile: true

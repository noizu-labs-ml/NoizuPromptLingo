databaseChangeLog:
  # Align check_user_permission / get_user_role_in_resource with
  # list_user_accessible_projects: org membership inherits to projects in that org.
  # Without this, index lists org projects but show/update/etc. return 403.
  - changeSet:
      id: 024-check-user-permission-org-project-inherit
      author: loom
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION check_user_permission(
                p_user_id uuid,
                p_resource_type resource_type_enum,
                p_resource_id uuid,
                p_action varchar
              )
              RETURNS BOOLEAN
              LANGUAGE plpgsql
              STABLE
              AS $$
              DECLARE
                v_resource_urn text;
                v_has_allow boolean := false;
                v_policy record;
                v_statement jsonb;
                v_stmt_action text;
                v_stmt_resource text;
                v_action_parts text[];
              BEGIN
                v_resource_urn := p_resource_type || ':' || p_resource_id;

                -- Policies from:
                --   1) direct membership on (resource_type, resource_id)
                --   2) when resource is a project: org membership on projects.organization_id
                -- Policy templates still resolve against the *checked* resource so
                -- org-scoped seeds (${resource_type}:${resource_id}, *, project:view, …)
                -- apply to the project URN.
                FOR v_policy IN
                  SELECT policy_document, priority
                  FROM (
                    SELECT p.policy_document, gp.priority
                    FROM scoped_memberships sm
                    JOIN group_policies gp ON gp.group_id = sm.group_id
                    JOIN policies p ON p.id = gp.policy_id AND p.is_active = true
                    WHERE sm.member_type = 'user'
                      AND sm.member_id = p_user_id
                      AND sm.resource_type = p_resource_type
                      AND sm.resource_id = p_resource_id
                      AND (sm.expires_at IS NULL OR sm.expires_at > NOW())

                    UNION ALL

                    SELECT p.policy_document, gp.priority
                    FROM projects pr
                    JOIN scoped_memberships sm
                      ON sm.resource_type = 'organization'
                     AND sm.resource_id = pr.organization_id
                     AND sm.member_type = 'user'
                     AND sm.member_id = p_user_id
                     AND (sm.expires_at IS NULL OR sm.expires_at > NOW())
                    JOIN group_policies gp ON gp.group_id = sm.group_id
                    JOIN policies p ON p.id = gp.policy_id AND p.is_active = true
                    WHERE p_resource_type = 'project'
                      AND pr.id = p_resource_id
                  ) policies_src
                  ORDER BY priority ASC
                LOOP
                  FOR v_statement IN SELECT jsonb_array_elements(v_policy.policy_document->'statements')
                  LOOP
                    DECLARE
                      v_action_matched boolean := false;
                      v_resource_matched boolean := false;
                      v_resolved_resource text;
                    BEGIN
                      FOR v_stmt_action IN SELECT jsonb_array_elements_text(v_statement->'actions')
                      LOOP
                        IF v_stmt_action = '*' THEN
                          v_action_matched := true;
                          EXIT;
                        END IF;

                        v_action_parts := string_to_array(p_action, ':');

                        IF v_stmt_action LIKE '%:*' THEN
                          IF v_action_parts[1] = split_part(v_stmt_action, ':', 1) THEN
                            v_action_matched := true;
                            EXIT;
                          END IF;
                        ELSIF v_stmt_action LIKE '*:%' THEN
                          IF array_length(v_action_parts, 1) >= 2
                             AND v_action_parts[2] = split_part(v_stmt_action, ':', 2) THEN
                            v_action_matched := true;
                            EXIT;
                          END IF;
                        ELSIF v_stmt_action = p_action THEN
                          v_action_matched := true;
                          EXIT;
                        END IF;
                      END LOOP;

                      IF NOT v_action_matched THEN
                        CONTINUE;
                      END IF;

                      FOR v_stmt_resource IN SELECT jsonb_array_elements_text(v_statement->'resources')
                      LOOP
                        v_resolved_resource := replace(
                          replace(v_stmt_resource,
                            '${resource_type}', p_resource_type::text),
                          '${resource_id}', p_resource_id::text);

                        IF v_resolved_resource = '*' THEN
                          v_resource_matched := true;
                          EXIT;
                        ELSIF v_resolved_resource LIKE '%/*' THEN
                          IF v_resource_urn LIKE rtrim(v_resolved_resource, '*') || '%' THEN
                            v_resource_matched := true;
                            EXIT;
                          END IF;
                        ELSIF v_resolved_resource = v_resource_urn THEN
                          v_resource_matched := true;
                          EXIT;
                        END IF;
                      END LOOP;

                      IF v_action_matched AND v_resource_matched THEN
                        IF (v_statement->>'effect') = 'deny' THEN
                          RETURN FALSE;
                        ELSIF (v_statement->>'effect') = 'allow' THEN
                          v_has_allow := true;
                        END IF;
                      END IF;
                    END;
                  END LOOP;
                END LOOP;

                RETURN v_has_allow;
              END;
              $$;
      rollback:
        - sql:
            splitStatements: false
            sql: |
              -- Revert to exact-resource-only body from 020-pbac-stored-procedures
              CREATE OR REPLACE FUNCTION check_user_permission(
                p_user_id uuid,
                p_resource_type resource_type_enum,
                p_resource_id uuid,
                p_action varchar
              )
              RETURNS BOOLEAN
              LANGUAGE plpgsql
              STABLE
              AS $$
              DECLARE
                v_resource_urn text;
                v_has_allow boolean := false;
                v_policy record;
                v_statement jsonb;
                v_stmt_action text;
                v_stmt_resource text;
                v_action_parts text[];
              BEGIN
                v_resource_urn := p_resource_type || ':' || p_resource_id;
                FOR v_policy IN
                  SELECT p.policy_document
                  FROM scoped_memberships sm
                  JOIN group_policies gp ON gp.group_id = sm.group_id
                  JOIN policies p ON p.id = gp.policy_id AND p.is_active = true
                  WHERE sm.member_type = 'user'
                    AND sm.member_id = p_user_id
                    AND sm.resource_type = p_resource_type
                    AND sm.resource_id = p_resource_id
                    AND (sm.expires_at IS NULL OR sm.expires_at > NOW())
                  ORDER BY gp.priority ASC
                LOOP
                  FOR v_statement IN SELECT jsonb_array_elements(v_policy.policy_document->'statements')
                  LOOP
                    DECLARE
                      v_action_matched boolean := false;
                      v_resource_matched boolean := false;
                      v_resolved_resource text;
                    BEGIN
                      FOR v_stmt_action IN SELECT jsonb_array_elements_text(v_statement->'actions')
                      LOOP
                        IF v_stmt_action = '*' THEN
                          v_action_matched := true;
                          EXIT;
                        END IF;
                        v_action_parts := string_to_array(p_action, ':');
                        IF v_stmt_action LIKE '%:*' THEN
                          IF v_action_parts[1] = split_part(v_stmt_action, ':', 1) THEN
                            v_action_matched := true;
                            EXIT;
                          END IF;
                        ELSIF v_stmt_action LIKE '*:%' THEN
                          IF array_length(v_action_parts, 1) >= 2
                             AND v_action_parts[2] = split_part(v_stmt_action, ':', 2) THEN
                            v_action_matched := true;
                            EXIT;
                          END IF;
                        ELSIF v_stmt_action = p_action THEN
                          v_action_matched := true;
                          EXIT;
                        END IF;
                      END LOOP;
                      IF NOT v_action_matched THEN
                        CONTINUE;
                      END IF;
                      FOR v_stmt_resource IN SELECT jsonb_array_elements_text(v_statement->'resources')
                      LOOP
                        v_resolved_resource := replace(
                          replace(v_stmt_resource,
                            '${resource_type}', p_resource_type::text),
                          '${resource_id}', p_resource_id::text);
                        IF v_resolved_resource = '*' THEN
                          v_resource_matched := true;
                          EXIT;
                        ELSIF v_resolved_resource LIKE '%/*' THEN
                          IF v_resource_urn LIKE rtrim(v_resolved_resource, '*') || '%' THEN
                            v_resource_matched := true;
                            EXIT;
                          END IF;
                        ELSIF v_resolved_resource = v_resource_urn THEN
                          v_resource_matched := true;
                          EXIT;
                        END IF;
                      END LOOP;
                      IF v_action_matched AND v_resource_matched THEN
                        IF (v_statement->>'effect') = 'deny' THEN
                          RETURN FALSE;
                        ELSIF (v_statement->>'effect') = 'allow' THEN
                          v_has_allow := true;
                        END IF;
                      END IF;
                    END;
                  END LOOP;
                END LOOP;
                RETURN v_has_allow;
              END;
              $$;

  - changeSet:
      id: 024-get-user-role-in-resource-org-project-inherit
      author: loom
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION get_user_role_in_resource(
                p_user_id uuid,
                p_resource_type resource_type_enum,
                p_resource_id uuid
              )
              RETURNS role_name_enum
              LANGUAGE sql
              STABLE
              AS $$
                -- Prefer direct project/org membership; for projects fall back to org role
                -- (same semantics as list_user_accessible_projects.inherited_from_org).
                SELECT role
                FROM (
                  SELECT g.name AS role, 0 AS sort_key
                  FROM scoped_memberships sm
                  JOIN groups g ON g.id = sm.group_id
                  WHERE sm.member_type = 'user'
                    AND sm.member_id = p_user_id
                    AND sm.resource_type = p_resource_type
                    AND sm.resource_id = p_resource_id
                    AND (sm.expires_at IS NULL OR sm.expires_at > NOW())

                  UNION ALL

                  SELECT g.name AS role, 1 AS sort_key
                  FROM projects pr
                  JOIN scoped_memberships sm
                    ON sm.resource_type = 'organization'
                   AND sm.resource_id = pr.organization_id
                   AND sm.member_type = 'user'
                   AND sm.member_id = p_user_id
                   AND (sm.expires_at IS NULL OR sm.expires_at > NOW())
                  JOIN groups g ON g.id = sm.group_id
                  WHERE p_resource_type = 'project'
                    AND pr.id = p_resource_id
                ) roles
                ORDER BY sort_key
                LIMIT 1
              $$;
      rollback:
        - sql:
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION get_user_role_in_resource(
                p_user_id uuid,
                p_resource_type resource_type_enum,
                p_resource_id uuid
              )
              RETURNS role_name_enum
              LANGUAGE sql
              STABLE
              AS $$
                SELECT g.name
                FROM scoped_memberships sm
                JOIN groups g ON g.id = sm.group_id
                WHERE sm.member_type = 'user'
                  AND sm.member_id = p_user_id
                  AND sm.resource_type = p_resource_type
                  AND sm.resource_id = p_resource_id
                  AND (sm.expires_at IS NULL OR sm.expires_at > NOW());
              $$;

databaseChangeLog:
  # Clients — billable/customer containers under an organization (≠ Organization).
  # Projects may optionally nest under a client via projects.client_id.
  # external_ids jsonb reserved for Stopwatch/Timely/Stripe linkage later.
  - changeSet:
      id: pm-022-clients
      author: noizu-pm
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: clients
      changes:
        - sql:
            sql: |
              CREATE TABLE clients (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                organization_id uuid NOT NULL REFERENCES organizations(id) ON DELETE CASCADE,
                name varchar(255) NOT NULL,
                slug citext NOT NULL,
                status varchar(20) NOT NULL DEFAULT 'active'
                  CHECK (status IN ('active', 'archived', 'deleted')),
                notes text DEFAULT '',
                default_hourly_rate_cents integer
                  CHECK (default_hourly_rate_cents IS NULL OR default_hourly_rate_cents >= 0),
                currency char(3) DEFAULT 'USD',
                external_ids jsonb NOT NULL DEFAULT '{}'::jsonb,
                settings jsonb NOT NULL DEFAULT '{}'::jsonb,
                created_by uuid REFERENCES users(id) ON DELETE SET NULL,
                archived_at timestamptz,
                lock_version integer NOT NULL DEFAULT 0,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now(),
                CONSTRAINT uq_clients_org_slug UNIQUE (organization_id, slug)
              );

              CREATE INDEX idx_clients_org_active
                ON clients (organization_id, inserted_at DESC)
                WHERE status = 'active';

              CREATE INDEX idx_clients_external_ids
                ON clients USING gin (external_ids);
      rollback:
        - dropTable:
            tableName: clients

  - changeSet:
      id: pm-022-projects-client-id
      author: noizu-pm
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: projects
        - tableExists:
            tableName: clients
        - not:
            - columnExists:
                tableName: projects
                columnName: client_id
      changes:
        - sql:
            sql: |
              ALTER TABLE projects
                ADD COLUMN client_id uuid REFERENCES clients(id) ON DELETE SET NULL;

              CREATE INDEX idx_projects_client_id
                ON projects (client_id)
                WHERE client_id IS NOT NULL;
      rollback:
        - sql:
            sql: |
              DROP INDEX IF EXISTS idx_projects_client_id;
              ALTER TABLE projects DROP COLUMN IF EXISTS client_id;

  # Soft-delete guardrail — reuse pm_guard_soft_delete_only from 018.
  - changeSet:
      id: pm-022-clients-soft-delete-trigger
      author: noizu-pm
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: clients
      changes:
        - sql:
            sql: |
              DROP TRIGGER IF EXISTS trg_pm_guard_clients ON clients;
              CREATE TRIGGER trg_pm_guard_clients
                BEFORE DELETE ON clients
                FOR EACH ROW EXECUTE FUNCTION pm_guard_soft_delete_only();
      rollback:
        - sql:
            sql: DROP TRIGGER IF EXISTS trg_pm_guard_clients ON clients;

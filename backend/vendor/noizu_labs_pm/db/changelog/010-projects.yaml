databaseChangeLog:
  # projects — npl base + trp superset (default_methodology, default_queue_id) +
  # the human-key prefix column, all baked into one CREATE. lock_version guardrail
  # included. default_queue_id's FK to item_queues is added in 012-items (item_queues
  # is created there; the project↔queue dependency is circular).
  - changeSet:
      id: pm-010-projects
      author: noizu-pm
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: projects
      changes:
        - sql:
            sql: |
              CREATE TABLE projects (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                organization_id uuid NOT NULL REFERENCES organizations(id) ON DELETE CASCADE,
                name varchar(255) NOT NULL,
                slug citext NOT NULL,
                description text,
                settings jsonb DEFAULT '{}',
                status varchar(20) NOT NULL DEFAULT 'active'
                  CHECK (status IN ('active', 'archived', 'deleted')),
                created_by uuid REFERENCES users(id) ON DELETE SET NULL,
                archived_at timestamptz,
                key_prefix varchar(16),
                default_methodology varchar(255)
                  CHECK (default_methodology IN ('kanban','scrum','waterfall','spiral','custom')),
                default_queue_id uuid,
                lock_version integer NOT NULL DEFAULT 0,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now(),
                CONSTRAINT uq_projects_org_slug UNIQUE (organization_id, slug)
              );

              CREATE INDEX idx_projects_org_active_covering
                ON projects (organization_id, inserted_at DESC)
                WHERE status = 'active';
              CREATE INDEX idx_projects_default_queue_id
                ON projects (default_queue_id);
      rollback:
        - dropTable:
            tableName: projects

  # key_prefix uniqueness (human-key). Partial (NULL prefix allowed); CONCURRENTLY.
  - changeSet:
      id: pm-010-unique-project-key-prefix
      author: noizu-pm
      runInTransaction: false
      changes:
        - sql:
            splitStatements: true
            sql: |
              DROP INDEX IF EXISTS idx_projects_org_key_prefix;
              CREATE UNIQUE INDEX CONCURRENTLY idx_projects_org_key_prefix
              ON projects (organization_id, key_prefix)
              WHERE key_prefix IS NOT NULL;
      rollback:
        - sql:
            sql: DROP INDEX CONCURRENTLY IF EXISTS idx_projects_org_key_prefix;

  - changeSet:
      id: pm-010-unique-org-key-prefix
      author: noizu-pm
      runInTransaction: false
      changes:
        - sql:
            splitStatements: true
            sql: |
              DROP INDEX IF EXISTS idx_organizations_key_prefix;
              CREATE UNIQUE INDEX CONCURRENTLY idx_organizations_key_prefix
              ON organizations (key_prefix)
              WHERE key_prefix IS NOT NULL;
      rollback:
        - sql:
            sql: DROP INDEX CONCURRENTLY IF EXISTS idx_organizations_key_prefix;

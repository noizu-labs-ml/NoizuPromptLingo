[project]
name = "modal-genai"
version = "0.1.0"
description = "OpenAI-compatible GenAI gateway and Modal (NVIDIA GPU) deployment for LLM, image, audio, video, and 3D generation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0.2",
    "uvicorn[standard]>=0.30.0",
]

# `modal` is only needed to deploy / dispatch to the cloud, and to run the
# gateway against live backends. Tests and local stub mode do not require it.
[project.optional-dependencies]
modal = [
    "modal>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
modal-genai-gateway = "modal_genai.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modal_genai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

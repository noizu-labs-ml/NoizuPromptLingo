# Modal GenAI Gateway - model + provider routing.
#
# Each LLM is a vLLM app on Modal exposing a native OpenAI surface; the gateway
# proxies to its *.modal.run URL (set base_url after `modal deploy`, or export
# the matching MODAL_GENAI_*_URL env var and reference it here).
#
# Media models (image/tts/stt/music/video/3d/sfx) have no OpenAI standard, so
# they run as Modal classes and the gateway dispatches via modal.Cls.from_name.
#
# GPU tiers follow models.md: L40S (48GB) default, scaled up per-model.

models:
  # ---- LLMs (vLLM, OpenAI-native) ------------------------------------
  - id: qwen3.6
    type: chat
    provider: vllm-qwen
    capabilities: ["chat", "text", "vision", "tools"]
    metadata: { repo: "Qwen/Qwen3.6-27B-FP8", gpu: "H100", license: "apache-2.0" }
  - id: gemma-4
    type: chat
    provider: vllm-gemma
    capabilities: ["chat", "text", "vision"]
    metadata: { repo: "google/gemma-4-12B-it", gpu: "L40S", license: "apache-2.0" }
  - id: glm-4.6v
    type: chat
    provider: vllm-glm
    capabilities: ["chat", "text", "vision"]
    metadata: { repo: "zai-org/GLM-4.6V-Flash", gpu: "L40S", license: "mit" }
  - id: embed
    type: embedding
    provider: vllm-embed
    capabilities: ["embeddings"]
    metadata: { repo: "Qwen/Qwen3-Embedding-0.6B", gpu: "L4", license: "apache-2.0" }

  # ---- Image ----------------------------------------------------------
  - id: z-image
    type: image
    provider: image-zimage
    capabilities: ["images.generate", "text-to-image"]
    metadata: { repo: "Tongyi-MAI/Z-Image-Turbo", gpu: "L40S", license: "apache-2.0" }
  - id: qwen-image
    type: image
    provider: image-qwen
    capabilities: ["images.generate", "text-to-image", "image-edit"]
    metadata: { repo: "Qwen/Qwen-Image", gpu: "A100-80GB", license: "apache-2.0" }
  - id: sdxl
    type: image
    provider: image-sdxl
    capabilities: ["images.generate", "text-to-image"]
    metadata: { repo: "stabilityai/stable-diffusion-xl-base-1.0", gpu: "L40S", license: "openrail++" }

  # ---- Text-to-Speech -------------------------------------------------
  - id: kokoro
    type: tts
    provider: tts-kokoro
    capabilities: ["audio.speech"]
    metadata: { repo: "hexgrad/Kokoro-82M", gpu: "L4", default_voice: "af_heart", license: "apache-2.0" }

  # ---- Speech-to-Text -------------------------------------------------
  - id: whisper
    type: stt
    provider: stt-whisper
    capabilities: ["audio.transcriptions", "audio.translations"]
    metadata: { repo: "openai/whisper-large-v3-turbo", gpu: "L4", license: "mit" }

  # ---- Music ----------------------------------------------------------
  - id: ace-step
    type: audio
    provider: music-acestep
    capabilities: ["audio.generations", "music"]
    metadata: { repo: "ACE-Step/ACE-Step-v1-3.5B", gpu: "L40S", license: "apache-2.0" }

  # ---- Sound effects --------------------------------------------------
  - id: stable-audio
    type: audio
    provider: sfx-stableaudio
    capabilities: ["audio.generations", "sound-effects"]
    metadata: { repo: "stabilityai/stable-audio-open-1.0", gpu: "L4", license: "stability-community" }

  # ---- Video ----------------------------------------------------------
  - id: wan
    type: video
    provider: video-wan
    capabilities: ["video.generate", "text-to-video", "image-to-video"]
    metadata: { repo: "Wan-AI/Wan2.2-T2V-A14B", gpu: "H100", license: "apache-2.0" }

  # ---- 3D -------------------------------------------------------------
  - id: trellis
    type: 3d
    provider: threed-trellis
    capabilities: ["3d.generate", "image-to-3d"]
    metadata: { repo: "microsoft/TRELLIS.2-4B", gpu: "A100-80GB", license: "mit" }

providers:
  stub:
    kind: stub

  # ---- vLLM proxies. Set base_url to the deployed app URL ------------
  # base_url = https://<workspace>--modal-genai-llm-<endpoint>.modal.run/v1
  vllm-qwen:
    kind: vllm
    base_url: https://CHANGE-ME--modal-genai-llm-qwen.modal.run/v1
    app_name: modal-genai-llm
    endpoint: qwen
    gpu: H100
    api_key: ${MODAL_GENAI_VLLM_KEY}
  vllm-gemma:
    kind: vllm
    base_url: https://CHANGE-ME--modal-genai-llm-gemma.modal.run/v1
    app_name: modal-genai-llm
    endpoint: gemma
    gpu: L40S
    api_key: ${MODAL_GENAI_VLLM_KEY}
  vllm-glm:
    kind: vllm
    base_url: https://CHANGE-ME--modal-genai-llm-glm.modal.run/v1
    app_name: modal-genai-llm
    endpoint: glm
    gpu: L40S
    api_key: ${MODAL_GENAI_VLLM_KEY}
  vllm-embed:
    kind: vllm
    base_url: https://CHANGE-ME--modal-genai-llm-embed.modal.run/v1
    app_name: modal-genai-llm
    endpoint: embed
    gpu: L4
    api_key: ${MODAL_GENAI_VLLM_KEY}

  # ---- Media: dispatch to Modal classes via modal.Cls.from_name ------
  image-zimage:
    kind: modal_cls
    app_name: modal-genai-image
    cls_name: ZImage
    method: infer
    gpu: L40S
  image-qwen:
    kind: modal_cls
    app_name: modal-genai-image
    cls_name: QwenImage
    method: infer
    gpu: A100-80GB
  image-sdxl:
    kind: modal_cls
    app_name: modal-genai-image
    cls_name: SDXL
    method: infer
    gpu: L40S
  tts-kokoro:
    kind: modal_cls
    app_name: modal-genai-tts
    cls_name: Kokoro
    method: infer
    gpu: L4
    default_voice: af_heart
  stt-whisper:
    kind: modal_cls
    app_name: modal-genai-stt
    cls_name: Whisper
    method: infer
    gpu: L4
  music-acestep:
    kind: modal_cls
    app_name: modal-genai-music
    cls_name: AceStep
    method: infer
    gpu: L40S
  sfx-stableaudio:
    kind: modal_cls
    app_name: modal-genai-sfx
    cls_name: StableAudio
    method: infer
    gpu: L4
  video-wan:
    kind: modal_cls
    app_name: modal-genai-video
    cls_name: Wan
    method: infer
    gpu: H100
  threed-trellis:
    kind: modal_cls
    app_name: modal-genai-3d
    cls_name: Trellis
    method: infer
    gpu: A100-80GB

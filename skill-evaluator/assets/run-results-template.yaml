# Run Results Template
# Copy to ~/.claude/evals/{skill-name}/results/{run-id}/run.yaml

run:
  id: ""  # run-{timestamp}-{model-slug}
  skill: ""
  skill_version: "1.0"
  model: ""
  temperature: 0.3
  timestamp: ""  # ISO 8601
  evaluator: ""
  baseline_id: null

summary:
  scenarios_run: 0
  scenarios_passed: 0
  scenarios_failed: 0
  pass_rate: 0.0
  exam_score_avg: 0.0
  issues_found: 0
  regressions_detected: 0

dimensions:
  task_accuracy: 0.0
  flow_adherence: 0.0
  recovery_ability: 0.0
  edge_case_handling: 0.0
  instruction_following: 0.0
  self_containment: 0.0
  cross_reference: 0.0

scenario_results: []
  # - scenario: basic-workflow
  #   passed: true
  #   score: 0.92
  #   steps_completed: "5/5"
  #   recoveries_needed: 0
  #   duration_ms: 0

exam_results:
  multiple_choice:
    total: 0
    correct: 0
    score: 0.0
    by_difficulty: {}
    by_tag: {}
  essay:
    total: 0
    avg_score: 0.0
    by_tag: {}

regression:
  baseline_run: null
  baseline_pass_rate: 0.0
  delta: 0.0
  regressions: []
  improvements: []
  is_significant: false

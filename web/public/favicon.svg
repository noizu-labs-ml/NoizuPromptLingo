<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 32 32" width="32" height="32">

  <!-- Dark background for visibility across browser chromes -->
  <rect width="32" height="32" rx="6" fill="#1A1A1A"/>

  <!-- Simplified: three connected nodes only (book too fine at 16px) -->

  <!-- Connections -->
  <line x1="9" y1="21" x2="16" y2="9"
        stroke="#C4956A" stroke-width="2" stroke-linecap="round"/>
  <line x1="23" y1="21" x2="16" y2="9"
        stroke="#C4956A" stroke-width="2" stroke-linecap="round"/>
  <line x1="9" y1="21" x2="23" y2="21"
        stroke="#C4956A" stroke-width="2" stroke-linecap="round"/>

  <!-- Nodes -->
  <circle cx="9" cy="21" r="3.5" fill="#C4956A"/>
  <circle cx="16" cy="9" r="3.5" fill="#C4956A"/>
  <circle cx="23" cy="21" r="3.5" fill="#C4956A"/>

</svg>

# Cypress test attributes for signup/page.tsx
# Generated from cyAttrs() calls in the component

page: /signup
component: SignupPage

selectors:
  - cy: signup-form
    scope: signup
    element: div (form container)

  - cy: error-alert
    element: div[role=alert]
    notes: Conditionally rendered on validation/registration error

  - cy: email-input
    cy-id: signup-email
    element: input[type=email]

  - cy: password-input
    cy-id: signup-password
    element: input[type=password]

  - cy: confirm-input
    cy-id: signup-confirm
    element: input[type=password]

  - cy: honeypot
    element: input[type=text]
    notes: Hidden honeypot field, aria-hidden container

  - cy: submit-button
    cy-id: signup
    element: button[type=submit]

  - cy: login-link
    element: a
    notes: "Sign in" link to /login

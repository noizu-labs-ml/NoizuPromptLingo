# scaffold-config.yaml
#
# Configuration file driving MCP server scaffold generation.
# Fill in the fields below, then pass this file to the mcp-forge agent
# to generate a complete project scaffold.
#
# Usage:
#   "Generate a scaffold from this config: [paste or reference this file]"

# --- Server Identity ---
server:
  # Display name for the MCP server (used in McpServer constructor)
  name: ""

  # One-line description (appears in tools/list server info)
  description: ""

  # Semantic version (MAJOR.MINOR.PATCH)
  version: "0.1.0"

# --- Language & Runtime ---
# Options: "typescript" or "python"
# TypeScript uses @modelcontextprotocol/sdk v1.29.0
# Python uses FastMCP v3.2.4
language: typescript

# --- Transport ---
# Options:
#   "stdio"            -- Local, launched by client as subprocess (default)
#   "streamable-http"  -- Remote, HTTP-based (recommended for production)
#   "sse"              -- Server-Sent Events (deprecated, avoid for new servers)
transport: stdio

# --- Scaffold Phase ---
# Options:
#   "quick"       -- Phase 1: minimal server, smoke test, no infra
#   "production"  -- Phase 2: full project with tests, Docker, CI/CD, monitoring
phase: quick

# --- Tools ---
# Define the tools your server will expose.
# Each tool needs: name, description, and params list.
# Leave empty to use example tools from the scaffold template.
#
# Example:
#   tools:
#     - name: get_user
#       description: Retrieve a user by ID
#       params:
#         - name: user_id
#           type: string
#           required: true
#           description: The user's unique identifier
#         - name: include_profile
#           type: boolean
#           required: false
#           description: Include full profile data
tools: []

# --- Authentication ---
# Options:
#   "none"    -- No authentication (default for local/dev)
#   "api-key" -- API key in header or env var
#   "oauth2"  -- OAuth2 flow (requires additional config)
#   "jwt"     -- JWT bearer token validation
auth:
  type: none
  # For api-key:
  #   key_env_var: API_KEY          # Environment variable name
  #   key_header: X-API-Key         # HTTP header name (for HTTP transport)
  # For oauth2:
  #   provider: ""                  # OAuth2 provider URL
  #   client_id_env: OAUTH_CLIENT_ID
  #   client_secret_env: OAUTH_CLIENT_SECRET

# --- Hosting Target ---
# Options:
#   "local"      -- Run directly on host machine (default)
#   "docker"     -- Generate Dockerfile and docker-compose.yml
#   "serverless" -- Generate serverless deployment config (e.g., AWS Lambda)
#   "managed"    -- Deploy to a managed MCP hosting service
hosting:
  target: local
  # For docker:
  #   registry: ghcr.io/org         # Docker registry for push
  #   base_image: node:22-slim      # Override base image
  # For serverless:
  #   provider: aws-lambda          # Cloud provider
  #   region: us-east-1

# --- CI/CD ---
# Only applies to phase: production
ci:
  # Generate GitHub Actions workflow
  enabled: false
  # Run tests on PR
  test_on_pr: true
  # Build Docker image on main
  docker_on_main: true
  # Publish to package registry on tag
  publish_on_tag: false

# --- Optional Features ---
features:
  # Structured JSON logging
  logging: true
  # Token bucket rate limiting
  rate_limiting: true
  # OpenTelemetry tracing
  tracing: false
  # Health check endpoints (HTTP transport only)
  health_check: true
  # NPL three-tier tool architecture
  three_tier: false

  # ==========================================================================
  # Cerebras
  # ==========================================================================
  # NOTE: Use cerebras/ prefix (not openai/) to avoid LiteLLM routing
  # thinking requests through the OpenAI Responses API (/v1/responses),
  # which Cerebras doesn't support. The cerebras/ prefix also means
  # api_base is not needed (litellm knows the Cerebras URL).
  #
  # reasoning_effort must be in additional_drop_params for models that
  # don't support it, because the Anthropic adapter converts
  # thinking → reasoning_effort before drop_params takes effect.
  #
  # Cerebras is highly flaky — very generous timeouts and retries.
  # timeout/stream_timeout: 600s (max tolerance for slow/hung responses)
  # num_retries: 10 (aggressive retries on transient 5xx / timeout errors)
  # allowed_fails: 10, cooldown_time: 5 (very short cooldown, recover ASAP)

  # gpt-oss-120b
  - model_name: "cerebras/gpt-oss-120b"
    litellm_params:
      model: cerebras/gpt-oss-120b
      api_key: os.environ/CEREBRAS_API_KEY
      drop_params: true
      additional_drop_params: ["context_management", "output_config", "thinking", "reasoning_effort", "thinking_blocks"]
      timeout: 600
      stream_timeout: 600
      num_retries: 10
    allowed_fails: 10
    cooldown_time: 5
    metadata:
      provider: cerebras
      description: "GPT-OSS 120B on Cerebras hardware"
      strengths: "Ultra-fast inference, large model"
      weaknesses: "Flaky availability, limited features"

  - model_name: "cerebras/gpt-oss-120b:instant"

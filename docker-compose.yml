services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tobor_locker
      POSTGRES_USER: tobor
      POSTGRES_PASSWORD: tobor_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tobor -d tobor_locker"]
      interval: 2s
      timeout: 5s
      retries: 10

  migrations:
    build:
      context: ./db
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: tobor_locker
      DB_USER: tobor
      DB_PASSWORD: tobor_dev_password
    depends_on:
      postgres:
        condition: service_healthy

  elixir:
    build:
      context: .
      dockerfile: Dockerfile.elixir
    ports:
      - "4040:4040"
    environment:
      - DATABASE_URL=ecto://tobor:tobor_dev_password@postgres:5432/tobor_locker
    depends_on:
      migrations:
        condition: service_completed_successfully

  nextjs:
    build:
      context: ./web
      dockerfile: ../Dockerfile.nextjs
    ports:
      - "3000:3000"
    environment:
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=${AUTH_URL:-http://localhost:8080}
      - AUTHENTIK_ISSUER=${AUTHENTIK_ISSUER:-https://auth.derobot.is/application/o/tobor-locker/}
      - AUTHENTIK_CLIENT_ID=${AUTHENTIK_CLIENT_ID}
      - AUTHENTIK_CLIENT_SECRET=${AUTHENTIK_CLIENT_SECRET}
      - AUTH_TRUST_HOST=true
      - BACKEND_URL=http://elixir:4040

  nginx:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - elixir
      - nextjs

volumes:
  pgdata:

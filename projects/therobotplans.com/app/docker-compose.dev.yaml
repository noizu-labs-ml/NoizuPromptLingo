  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    image: ${PROJECT_DIR:-therobotplans.com}/frontend:dev
    command: >
      sh -c "
        if [ -f .npmrc.template ]; then
          GITHUB_TOKEN=$${GITHUB_TOKEN} VERDACCIO_TOKEN=$${VERDACCIO_TOKEN} envsubst < .npmrc.template > .npmrc;
        fi &&
        npm install &&
        npm run dev
      "
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - ../design/themes/theme-style-guide:/app/src/config/theme-style-guide
      - ../design/themes/theme-organic:/app/src/config/theme-organic
    env_file: .env
    environment:
      PORT: "3313"
      HOSTNAME: "0.0.0.0"
      GITHUB_TOKEN: "${GITHUB_TOKEN}"
      VERDACCIO_TOKEN: "${VERDACCIO_TOKEN}"
    ports:
      - "3313:3313"
    networks:
      - app
    restart: "no"

  nginx:
    build:
      context: ./nginx
    ports:
      - "${PORT:-8093}:80"

volumes:
  # backend_build:    # uncomment when backend is ready
  # backend_deps:     # uncomment when backend is ready
  frontend_node_modules:

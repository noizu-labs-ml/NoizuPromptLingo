# Per-project compose — nginx → frontend (+ backend when ready)
# Connects to shared PG/Redis via external lets-go_default network
#
# Images are built by `make build` — this file only runs them.
# Usage:
#   make init    — generate .env with secrets + credentials
#   make build   — build all images
#   make run     — start containers

services:
  # ── Backend not yet implemented ──────────────────────────────────
  # Uncomment migrations + backend once Phoenix code exists.

  # migrations:
  #   build:
  #     context: ./backend/db
  #     dockerfile: Dockerfile
  #   env_file: .env
  #   networks:
  #     - infra
  #   restart: "no"

  nginx:
    image: ${REGISTRY:-ops.noizu.com}/${PROJECT_DIR:-therobotplans.com}/nginx:${TAG:-latest}
    ports:
      - "${PORT:-8093}:80"
    depends_on:
      - frontend
      # - backend   # uncomment when backend is ready
    networks:
      - app
    restart: unless-stopped

  # backend:
  #   image: ${REGISTRY:-ops.noizu.com}/${PROJECT_DIR:-therobotplans.com}/backend:${TAG:-latest}
  #   env_file: .env
  #   environment:
  #     PHX_SERVER: "true"
  #     PORT: "4000"
  #   expose:
  #     - "4000"
  #   depends_on:
  #     migrations:
  #       condition: service_completed_successfully
  #   networks:
  #     - app
  #     - infra
  #   restart: unless-stopped

  frontend:
    image: ${REGISTRY:-ops.noizu.com}/${PROJECT_DIR:-therobotplans.com}/frontend:${TAG:-latest}
    environment:
      PORT: "3000"
    expose:
      - "3000"
    # depends_on:
    #   - backend   # uncomment when backend is ready
    networks:
      - app
    restart: unless-stopped

networks:
  app:
    # Project-internal network — nginx, frontend, backend can see each other
    # but are isolated from other projects' services
  infra:
    external: true
    name: lets-go_default

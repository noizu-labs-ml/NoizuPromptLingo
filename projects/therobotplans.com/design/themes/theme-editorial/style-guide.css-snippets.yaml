# ═══════════════════════════════════════════════════════════════
# CSS SNIPPETS — tobornalp editorial
# ═══════════════════════════════════════════════════════════════

css-snippets:
  - name: Intro Hero
    slug: intro-hero
    title: "Style guide intro hero"
    description: "Editorial hero — serif title, restrained layout, warm tones."
    target-section: intro
    body: |
      html[data-design-theme="editorial"] .sg-intro-hero {
        padding: var(--space-10) var(--space-6);
        text-align: center;
        border-bottom: 1px solid var(--border);
        margin-bottom: var(--space-8);
        background: var(--surface);
      }
      html[data-design-theme="editorial"] .sg-intro-title {
        font-family: var(--font-display);
        font-size: 2.8rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--text);
        margin: 0 0 var(--space-2);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-2);
      }
      html[data-design-theme="editorial"] .sg-intro-glyph {
        font-size: 3rem;
        margin-bottom: var(--space-2);
      }
      html[data-design-theme="editorial"] .sg-intro-subtitle {
        font-family: var(--font-sans);
        font-size: var(--font-size-xs);
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: var(--space-4);
      }
      html[data-design-theme="editorial"] .sg-intro-quote {
        font-family: var(--font-display);
        font-size: var(--font-size-lg);
        font-style: italic;
        color: var(--text-secondary);
        max-width: 560px;
        margin: 0 auto var(--space-5);
        line-height: 1.5;
      }
      html[data-design-theme="editorial"] .sg-intro-meta {
        font-family: var(--font-sans);
        font-size: var(--font-size-xs);
        color: var(--text-muted);
        margin-bottom: var(--space-4);
      }
      html[data-design-theme="editorial"] .sg-intro-color-bar {
        display: flex;
        justify-content: center;
        gap: var(--space-1);
        margin-bottom: var(--space-5);
      }
      html[data-design-theme="editorial"] .sg-intro-color-bar span {
        display: block;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        box-shadow: 0 1px 4px var(--shadow-color);
      }
      html[data-design-theme="editorial"] .sg-intro-meta-cards {
        display: flex;
        justify-content: center;
        gap: var(--space-3);
        flex-wrap: wrap;
      }
      html[data-design-theme="editorial"] .sg-intro-meta-card {
        font-family: var(--font-sans);
        font-size: var(--font-size-xs);
        padding: var(--space-2) var(--space-3);
        background: var(--surface-alt);
        border-radius: var(--radius);
        box-shadow: 0 1px 3px var(--shadow-color);
      }
      html[data-design-theme="editorial"] .sg-intro-meta-card .label {
        display: block;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-muted);
        margin-bottom: 2px;
      }
      html[data-design-theme="editorial"] .sg-intro-meta-card .value {
        display: block;
        color: var(--text);
        font-weight: 400;
      }

  - name: Agent Badge
    slug: agent-badge
    title: "Agent identity badge"
    description: "Subtle editorial badge for AI agent output."
    target-section: ui-elements
    body: |
      html[data-design-theme="editorial"] .badge-agent {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 8px;
        font-size: var(--font-size-xs);
        font-family: var(--font-mono);
        font-weight: 500;
        border-radius: var(--radius-sm);
        background: var(--violet-light);
        color: var(--violet);
        border: 1px solid var(--violet-mid);
      }

  - name: Priority Dot
    slug: priority-dot
    title: "Priority level indicator"
    description: "Small colored dot for priority levels P0-P3."
    target-section: ui-elements
    body: |
      html[data-design-theme="editorial"] .priority-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      html[data-design-theme="editorial"] .priority-dot--p0 { background: var(--error); }
      html[data-design-theme="editorial"] .priority-dot--p1 { background: var(--warning); }
      html[data-design-theme="editorial"] .priority-dot--p2 { background: var(--blue); }
      html[data-design-theme="editorial"] .priority-dot--p3 { background: var(--gray-400); }

  - name: Status Pill
    slug: status-pill
    title: "Status indicator pill"
    description: "Understated pill — editorial restraint."
    target-section: ui-elements
    body: |
      html[data-design-theme="editorial"] .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 2px 10px;
        font-size: var(--font-size-xs);
        font-weight: 500;
        border-radius: 999px;
        background: var(--accent-bg, var(--surface-alt));
        color: var(--accent, var(--text-secondary));
      }
      html[data-design-theme="editorial"] .status-pill::before {
        content: "";
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent, var(--text-muted));
      }

  - name: Compact Table
    slug: compact-table
    title: "Dense data table"
    description: "Editorial table — thin rules, no visible borders, clean lines."
    target-section: ui-elements
    body: |
      html[data-design-theme="editorial"] .table-compact {
        width: 100%;
        border-collapse: collapse;
        font-size: var(--font-size-sm);
      }
      html[data-design-theme="editorial"] .table-compact th {
        text-align: left;
        font-weight: 600;
        color: var(--text-muted);
        font-size: var(--font-size-xs);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        padding: var(--space-1) var(--space-2);
        border-bottom: 2px solid var(--border-strong);
      }
      html[data-design-theme="editorial"] .table-compact td {
        padding: var(--space-1) var(--space-2);
        border-bottom: 1px solid var(--border);
        color: var(--text);
      }

  - name: Card Shadow
    slug: card-shadow
    title: "Editorial card shadow"
    description: "Cards use subtle drop shadows instead of borders."
    target-section: ui-elements
    body: |
      html[data-design-theme="editorial"] .sg-card,
      html[data-design-theme="editorial"] [class*="card"] {
        box-shadow: 0 1px 3px var(--shadow-color), 0 1px 2px rgba(28,25,23,0.04);
        border: none;
        border-radius: var(--radius-md);
      }
      html[data-design-theme="editorial"] .sg-card:hover,
      html[data-design-theme="editorial"] [class*="card"]:hover {
        box-shadow: 0 4px 12px var(--shadow-color), 0 2px 4px rgba(28,25,23,0.06);
      }

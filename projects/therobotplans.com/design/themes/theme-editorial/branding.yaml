# ═══════════════════════════════════════════════════════════════
# BRANDING — tobornalp editorial
# ═══════════════════════════════════════════════════════════════
#
# Same product identity, different typographic voice. Serif
# headers bring editorial authority; humanist sans body text
# brings warmth and readability at density.
# ═══════════════════════════════════════════════════════════════

name: "tobornalp"
logo-text: "TOBORNALP"

# Adobe Fonts (Typekit) — placeholder kit ID, replace with actual
# Fallback: Source Serif Pro + Source Sans Pro (Google Fonts)
font-url: "https://use.typekit.net/placeholder.css"

logo-style:
  font: "var(--font-display)"
  color: "var(--text)"
  html: '<div style="display:inline-flex;align-items:center;gap:10px"><svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="2" width="24" height="24" rx="4" stroke="var(--blue)" stroke-width="1.5"/><rect x="6" y="6" width="7" height="7" rx="1" fill="var(--blue)" opacity="0.8"/><rect x="15" y="6" width="7" height="7" rx="1" fill="var(--violet)" opacity="0.8"/><rect x="6" y="15" width="7" height="7" rx="1" fill="var(--emerald)" opacity="0.8"/><rect x="15" y="15" width="7" height="7" rx="1" fill="var(--blue)" opacity="0.4"/></svg><span style="font-family:var(--font-display);font-size:19px;font-weight:600;letter-spacing:-0.01em;line-height:1;color:currentColor;font-style:italic">tobornalp</span></div>'

intent: "Typographic craft at operational density. The editorial theme draws from financial terminals and quality broadsheets — information-dense but considered. Serif headlines convey authority, humanist sans body text sustains readability through long sessions. Color is restrained; hierarchy is built through type weight, size, and whitespace."

perception: "Authoritative, warm, considered. The difference between a spreadsheet and The Economist — same data, different respect for the reader."

audience: "The same power users, with a preference for typographic warmth over terminal austerity. Users who read long-form retrospectives, write detailed ADRs, and appreciate that visual hierarchy can be built with type alone."

tone: "Same terse precision. The serif headers add warmth, not formality. Still lowercase by default."

keywords:
  - editorial
  - typographic
  - warm
  - considered
  - dense
  - authoritative
  - crafted

intro:
  title: "tobornalp"
  title-html: '<span style="display:inline-flex;align-items:center;gap:14px"><svg width="40" height="40" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="2" width="24" height="24" rx="4" stroke="var(--blue)" stroke-width="1.5"/><rect x="6" y="6" width="7" height="7" rx="1" fill="var(--blue)" opacity="0.8"/><rect x="15" y="6" width="7" height="7" rx="1" fill="var(--violet)" opacity="0.8"/><rect x="6" y="15" width="7" height="7" rx="1" fill="var(--emerald)" opacity="0.8"/><rect x="15" y="15" width="7" height="7" rx="1" fill="var(--blue)" opacity="0.4"/></svg><span style="font-family:var(--font-display);font-weight:600;letter-spacing:-0.01em;font-style:italic">tobornalp</span></span>'
  glyph: ""

# ═══════════════════════════════════════════════════════════════
# SPACING — tobornalp editorial
# ═══════════════════════════════════════════════════════════════

spacing-contexts:
  grid:
    columns: 12
    gutter-token: col-gap
    margin-token: space-6

  page-container:
    max-width: "1200px"
    padding-x-token: space-6
    padding-y-token: space-4

  section-spacing:
    - role: "Major section gap"
      token: space-12
    - role: "Subsection gap"
      token: space-8
    - role: "Component gap"
      token: space-4
    - role: "Element gap"
      token: space-2

# ═══════════════════════════════════════════════════════════════
# TYPOGRAPHY — tobornalp editorial
# ═══════════════════════════════════════════════════════════════
#
# Three-font system from the Source superfamily:
#   Source Serif Pro  — headers, display, editorial emphasis
#   Source Sans Pro   — body, UI, labels, navigation
#   Source Code Pro   — code, data, agent output
#
# The serif/sans pairing creates clear visual hierarchy without
# needing bold/color tricks. Headers are immediately distinguishable
# from body text by typeface alone.
# ═══════════════════════════════════════════════════════════════

typography:
  - var: font-display
    name: Source Serif Pro
    description: "Refined serif with excellent weight range. Authority without stuffiness. Used for headlines and editorial emphasis."
    usage: "Display, H1-H3, blockquote callouts, section titles"
    weights: [400, 600, 700]

  - var: font-sans
    name: Source Sans Pro
    description: "Humanist sans-serif. Warmer than Inter, more personality than system fonts. Sustains readability at density."
    usage: "Body copy, UI text, buttons, labels, navigation, form fields"
    weights: [300, 400, 600, 700]

  - var: font-mono
    name: Source Code Pro
    description: "Clean monospace from the same family. Harmonizes with both serif and sans siblings."
    usage: "Code blocks, agent logs, metric values, data tables, timestamps"
    weights: [400, 500, 600]

typography-classes:
  - name: Display
    class: typography-display
    font-family: "var(--font-display)"
    font-size: "var(--font-size-display)"
    font-weight: "700"
    line-height: "1.1"
    letter-spacing: "-0.02em"

  - name: H1
    class: typography-h1
    font-family: "var(--font-display)"
    font-size: "var(--font-size-3xl)"
    font-weight: "700"
    line-height: "1.2"
    letter-spacing: "-0.015em"

  - name: H2
    class: typography-h2
    font-family: "var(--font-display)"
    font-size: "var(--font-size-2xl)"
    font-weight: "600"
    line-height: "1.25"
    letter-spacing: "-0.01em"

  - name: H3
    class: typography-h3
    font-family: "var(--font-display)"
    font-size: "var(--font-size-xl)"
    font-weight: "600"
    line-height: "1.3"

  - name: H4
    class: typography-h4
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-lg)"
    font-weight: "600"
    line-height: "1.4"

  - name: Body
    class: typography-body
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-md)"
    font-weight: "400"
    line-height: "1.65"

  - name: Small
    class: typography-small
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-sm)"
    font-weight: "400"
    line-height: "1.55"

  - name: Label
    class: typography-label
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-xs)"
    font-weight: "600"
    line-height: "1.4"
    letter-spacing: "0.04em"
    text-transform: "uppercase"

  - name: Code
    class: typography-code
    font-family: "var(--font-mono)"
    font-size: "var(--font-size-sm)"
    font-weight: "400"
    line-height: "1.55"

  - name: Caption
    class: typography-caption
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-xs)"
    font-weight: "400"
    line-height: "1.4"
    color: "var(--text-muted)"

  - name: Data
    class: typography-data
    font-family: "var(--font-mono)"
    font-size: "var(--font-size-xs)"
    font-weight: "500"
    line-height: "1.3"

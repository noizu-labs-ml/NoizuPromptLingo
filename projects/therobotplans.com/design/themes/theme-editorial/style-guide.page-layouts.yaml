# ═══════════════════════════════════════════════════════════════
# PAGE LAYOUTS — tobornalp editorial
# ═══════════════════════════════════════════════════════════════

page-layouts:
  - name: dashboard
    title: Dashboard
    description: "Primary layout — sidebar nav, top bar, dense content. Warm surface tones."
    selector: ".content.dashboard"
    vars:
      max-width: "1440px"
      padding: "var(--space-3)"
      margin: "0 auto"
      body-bg: "var(--surface)"
      content-bg: "var(--surface)"
    chrome:
      navbar:
        height: "48px"
        background: "var(--gray-900)"
        color: "var(--gray-100)"
        label: "App Bar"
      sidebar:
        width: "240px"
        background: "var(--surface-alt)"
        color: "var(--text)"
        label: "Sidebar"

  - name: standard
    title: Standard
    description: "Centered content for settings, profiles, and detail views."
    selector: ".content.standard"
    vars:
      max-width: "1200px"
      padding: "var(--space-4)"
      margin: "0 auto"
      body-bg: "var(--surface)"
      content-bg: "var(--surface-alt)"
    chrome:
      navbar:
        height: "48px"
        background: "var(--gray-900)"
        color: "var(--gray-100)"
        label: "App Bar"
      sidebar:
        width: "240px"
        background: "var(--surface-alt)"
        color: "var(--text)"
        label: "Sidebar"

  - name: article
    title: Article / Wiki
    description: "Constrained reading layout — serif headers, generous line-height, sticky TOC."
    selector: ".content.article"
    vars:
      max-width: "68ch"
      padding: "var(--space-8)"
      margin: "0 auto"
      body-bg: "var(--surface)"
      content-bg: "var(--surface-alt)"
    chrome:
      navbar:
        height: "48px"
        background: "var(--surface-alt)"
        color: "var(--text)"
        label: "Nav"
      sidebar:
        width: "200px"
        background: "var(--surface-alt)"
        color: "var(--text-secondary)"
        label: "TOC"

  - name: focus
    title: Focus Mode
    description: "Distraction-free single-column for deep work and writing."
    selector: ".content.focus"
    vars:
      max-width: "960px"
      padding: "var(--space-8)"
      margin: "0 auto"
      body-bg: "var(--surface)"
      content-bg: "var(--surface)"
    chrome:
      navbar:
        height: "48px"
        background: "var(--surface-alt)"
        color: "var(--text)"
        label: "Nav"

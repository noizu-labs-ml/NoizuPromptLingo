# ═══════════════════════════════════════════════════════════════
# DESIGN SECTIONS — tobornalp editorial
# ═══════════════════════════════════════════════════════════════

design-sections:
  - name: typographic-hierarchy
    title: Typographic Hierarchy
    description: "How serif and sans-serif typefaces create visual structure."
    icon: "Aa"
    components:
      - name: type-principle
        title: Type Builds Hierarchy
        principle: "Serif headlines, sans body — the typeface change IS the hierarchy signal."
        approach: "Source Serif Pro for Display through H3 — authority, weight, editorial presence. Source Sans Pro for H4 and below — warmth, readability at small sizes, sustained density. Source Code Pro for data — same family harmony. No need for bold color or size extremes when the typeface itself does the work."
        rationale: "Financial terminals and quality broadsheets share a secret: they're typographically rich. The serif/sans split creates two visual registers — scanned (headlines) and read (body) — without any decorative overhead."

  - name: color-restraint
    title: Color Restraint
    description: "How muted color serves information density."
    icon: "◻"
    components:
      - name: color-principle
        title: Muted Is Not Weak
        principle: "Deep, desaturated color signals are easier to scan than bright ones."
        approach: "Semantic colors darkened 1-2 steps from the primary theme. Status is communicated through typography weight AND color — bold + red for critical, regular + muted gray for low priority. Cards use shadows for boundaries, not colored borders."
        rationale: "Bright color demands attention. In a dense dashboard, everything demanding attention means nothing gets it. Muted color is the editorial equivalent of a confident whisper in a loud room."

  - name: warm-surfaces
    title: Warm Surface System
    description: "Stone-tinted neutrals for a human, editorial feel."
    icon: "◐"
    components:
      - name: surface-principle
        title: Warm Beats Cool for Long Sessions
        principle: "Stone-tinted surfaces reduce eye strain during extended use."
        approach: "Light mode: #FAFAF9 warm white (vs pure white). Dark mode: #1C1917 warm charcoal (vs blue-slate). Gray ramp follows stone palette — warmer at every step. Effect is subtle but cumulative over hours."
        rationale: "Cool blue-tinted interfaces feel 'techy' in screenshots but fatiguing over 8-hour sessions. Warm neutrals feel like quality paper — a surface you can read on all day."

  - name: editorial-whitespace
    title: Editorial Whitespace
    description: "Strategic spacing that guides the eye."
    icon: "⊡"
    components:
      - name: whitespace-principle
        title: Whitespace Is Structure
        principle: "Generous section gaps, tight element gaps. The contrast between them creates visual grouping."
        approach: "Section gaps at space-12 (96px) — twice the primary theme. Subsection gaps at space-8 (64px). Element gaps stay tight at space-2 (16px). Article layout at 68ch with space-8 padding. The result: dense content islands in generous whitespace."
        rationale: "A newspaper column is dense — but the margins are wide. The density inside is readable because the whitespace around it provides rest. Same principle, screen-adapted."

shell-layouts:
  - name: app-shell
    title: App Shell
    description: "Primary application layout — heavy-bordered sidebar, solid black top bar, dense content area. No shadows, no rounded corners."
    chrome:
      navbar:
        height: "48px"
        background: "var(--black)"
        color: "var(--white)"
        label: "App Bar"
      sidebar:
        width: "240px"
        background: "var(--gray-100)"
        color: "var(--black)"
        label: "Sidebar"
      footer:
        height: "28px"
        background: "var(--gray-100)"
        color: "var(--gray-600)"
        label: "Status Bar"
    zones:
      - label: "Command Bar"
        background: "var(--surface)"
        ratio: 1
      - label: "Content"
        background: "var(--surface)"
        ratio: 4
      - label: "Detail Panel"
        background: "var(--surface-alt)"
        ratio: 2

  - name: focus-shell
    title: Focus Mode
    description: "Distraction-free layout — no sidebar, minimal chrome. Heavy top border as the only decoration."
    chrome:
      navbar:
        height: "48px"
        background: "var(--surface-alt)"
        color: "var(--text)"
        label: "Nav"
    zones:
      - label: "Content"
        background: "var(--surface)"
        ratio: 1

  - name: editor
    title: Editor
    description: "Three-panel layout for code editing and wiki writing. Heavy borders between panels, no shadow elevation."
    chrome:
      navbar:
        height: "40px"
        background: "var(--black)"
        color: "var(--white)"
        label: "Toolbar"
      sidebar:
        width: "220px"
        background: "var(--gray-100)"
        color: "var(--black)"
        label: "Files"
      aside:
        width: "260px"
        background: "var(--gray-100)"
        color: "var(--black)"
        label: "Inspector"
    zones:
      - label: "Editor"
        background: "var(--surface)"
        color: "var(--text)"
        ratio: 1

  - name: document
    title: Document Reader
    description: "Long-form reading layout for wiki pages and ADRs — constrained width, bordered TOC panel."
    chrome:
      navbar:
        height: "48px"
        background: "var(--surface-alt)"
        color: "var(--text)"
        label: "Nav"
      sidebar:
        width: "200px"
        background: "var(--surface-alt)"
        color: "var(--text-secondary)"
        label: "TOC"
    zones:
      - label: "Article"
        background: "var(--surface)"
        ratio: 1

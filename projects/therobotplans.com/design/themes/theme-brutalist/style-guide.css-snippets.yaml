# ═══════════════════════════════════════════════════════════════
# CSS SNIPPETS — tobornalp brutalist
# ═══════════════════════════════════════════════════════════════

css-snippets:
  - name: Intro Hero
    slug: intro-hero
    title: "Style guide intro hero"
    description: "Hero section at the top of the style guide viewer. Brutalist: heavy borders, no shadows, exposed structure."
    target-section: intro
    body: |
      html[data-design-theme="brutalist"] .sg-intro-hero {
        padding: var(--space-8) var(--space-4);
        text-align: center;
        border-bottom: 4px solid var(--text);
        margin-bottom: var(--space-6);
        background: var(--surface);
      }
      html[data-design-theme="brutalist"] .sg-intro-title {
        font-family: var(--font-sans);
        font-size: 3.5rem;
        font-weight: 900;
        letter-spacing: -0.04em;
        text-transform: uppercase;
        color: var(--text);
        margin: 0 0 var(--space-2);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-2);
      }
      html[data-design-theme="brutalist"] .sg-intro-glyph {
        font-size: 4rem;
        margin-bottom: var(--space-2);
      }
      html[data-design-theme="brutalist"] .sg-intro-subtitle {
        font-family: var(--font-mono);
        font-size: var(--font-size-xs);
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--red);
        margin-bottom: var(--space-3);
      }
      html[data-design-theme="brutalist"] .sg-intro-quote {
        font-family: var(--font-mono);
        font-size: var(--font-size-base);
        font-style: normal;
        color: var(--text-secondary);
        max-width: 600px;
        margin: 0 auto var(--space-4);
        border-left: 4px solid var(--red);
        padding-left: var(--space-2);
        text-align: left;
      }
      html[data-design-theme="brutalist"] .sg-intro-meta {
        font-family: var(--font-mono);
        font-size: var(--font-size-xs);
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: var(--space-4);
      }
      html[data-design-theme="brutalist"] .sg-intro-color-bar {
        display: flex;
        justify-content: center;
        gap: var(--space-1);
        margin-bottom: var(--space-4);
      }
      html[data-design-theme="brutalist"] .sg-intro-color-bar span {
        display: block;
        width: 32px;
        height: 32px;
        border-radius: 0;
        border: 2px solid var(--text);
      }
      html[data-design-theme="brutalist"] .sg-intro-meta-cards {
        display: flex;
        justify-content: center;
        gap: var(--space-3);
        flex-wrap: wrap;
      }
      html[data-design-theme="brutalist"] .sg-intro-meta-card {
        font-family: var(--font-mono);
        font-size: var(--font-size-xs);
        padding: var(--space-2) var(--space-3);
        background: var(--surface-alt);
        border-radius: 0;
        border: 2px solid var(--text);
      }
      html[data-design-theme="brutalist"] .sg-intro-meta-card .label {
        display: block;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--red);
        margin-bottom: 2px;
      }
      html[data-design-theme="brutalist"] .sg-intro-meta-card .value {
        display: block;
        color: var(--text);
        font-weight: 400;
      }


  - name: Agent Badge
    slug: agent-badge
    title: "Agent identity badge"
    description: "Inline badge identifying AI agent output. Brutalist: heavy border, no radius, all-caps."
    target-section: ui-elements
    body: |
      html[data-design-theme="brutalist"] .badge-agent {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 8px;
        font-size: var(--font-size-xs);
        font-family: var(--font-mono);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        border-radius: 0;
        background: var(--violet-light);
        color: var(--violet);
        border: 2px solid var(--violet);
      }

  - name: Priority Dot
    slug: priority-dot
    title: "Priority level indicator"
    description: "Small colored square for priority levels P0-P3. No rounding — squares, not circles."
    target-section: ui-elements
    body: |
      html[data-design-theme="brutalist"] .priority-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 0;
        flex-shrink: 0;
      }
      html[data-design-theme="brutalist"] .priority-dot--p0 { background: var(--error); }
      html[data-design-theme="brutalist"] .priority-dot--p1 { background: var(--warning); }
      html[data-design-theme="brutalist"] .priority-dot--p2 { background: var(--blue); }
      html[data-design-theme="brutalist"] .priority-dot--p3 { background: var(--gray-400); }

  - name: Status Pill
    slug: status-pill
    title: "Status indicator pill"
    description: "Rectangular status indicator with square dot and label. No rounding — brutalist boxes."
    target-section: ui-elements
    body: |
      html[data-design-theme="brutalist"] .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 2px 10px;
        font-size: var(--font-size-xs);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        border-radius: 0;
        border: 2px solid var(--accent, var(--border));
        background: var(--accent-bg, var(--surface-alt));
        color: var(--accent, var(--text-secondary));
      }
      html[data-design-theme="brutalist"] .status-pill::before {
        content: "";
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 0;
        background: var(--accent, var(--text-muted));
      }

  # ── Unified Badge System ──────────────────────────────────────
  # Brutalist badge: heavy borders, no radius, all-caps,
  # square dots instead of round. No softness anywhere.

  - name: Badge
    slug: badge
    title: "Unified badge component"
    description: "The foundational status badge — compact, color-coded, scannable. Brutalist: heavy borders, square corners, all-caps labels."
    target-section: custom-components
    body: |
      html[data-design-theme="brutalist"] .badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 1px 8px;
        font-family: var(--font-mono);
        font-size: var(--font-size-xs);
        font-weight: 700;
        line-height: 1.6;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        border-radius: 0;
        white-space: nowrap;
        vertical-align: middle;
        background: var(--background, var(--surface-alt));
        color: var(--color, var(--text-secondary));
        border: 2px solid var(--accent, var(--border));
      }

      /* ── Size variants ── */
      html[data-design-theme="brutalist"] .badge.badge-sm {
        padding: 0 6px;
        font-size: var(--font-size-2xs);
        gap: 3px;
      }
      html[data-design-theme="brutalist"] .badge.badge-lg {
        padding: 2px 12px;
        font-size: var(--font-size-sm);
        gap: 6px;
      }

      /* ── Dot variant: prepend a colored square ── */
      html[data-design-theme="brutalist"] .badge.badge-dot::before {
        content: "";
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 0;
        flex-shrink: 0;
        background: var(--accent, var(--text-muted));
      }
      html[data-design-theme="brutalist"] .badge.badge-sm.badge-dot::before {
        width: 5px;
        height: 5px;
      }

      /* ── Pill variant: still rectangular in brutalist ── */
      html[data-design-theme="brutalist"] .badge.badge-pill {
        border-radius: 0;
        padding: 1px 10px;
        border-width: 2px;
      }

      /* ── Solid variant: filled background, white text ── */
      html[data-design-theme="brutalist"] .badge.badge-solid {
        background: var(--accent, var(--gray-400));
        color: #ffffff;
        border-color: var(--accent, var(--gray-400));
      }

      /* ── Outline variant: border only, no fill ── */
      html[data-design-theme="brutalist"] .badge.badge-outline {
        background: transparent;
        border-color: var(--accent, var(--border));
        border-width: 2px;
      }

      /* ── Agent badge: monospace with violet accent ── */
      html[data-design-theme="brutalist"] .badge.badge-agent {
        font-family: var(--font-mono);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

  - name: Compact Table
    slug: compact-table
    title: "Dense data table"
    description: "Tighter spacing for dashboard tables. Brutalist: heavy borders, all-caps headers, no rounding."
    target-section: ui-elements
    body: |
      html[data-design-theme="brutalist"] .table-compact {
        width: 100%;
        border-collapse: collapse;
        font-size: var(--font-size-sm);
        border: 2px solid var(--text);
      }
      html[data-design-theme="brutalist"] .table-compact th {
        text-align: left;
        font-weight: 700;
        color: var(--text);
        font-size: var(--font-size-xs);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        padding: var(--space-1) var(--space-2);
        border-bottom: 2px solid var(--text);
        background: var(--surface-alt);
      }
      html[data-design-theme="brutalist"] .table-compact td {
        padding: var(--space-1) var(--space-2);
        border-bottom: 1px solid var(--border);
        color: var(--text);
      }

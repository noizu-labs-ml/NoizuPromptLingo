design-sections:
  - name: density
    title: Density & Information Architecture
    description: "How the platform organizes and compresses information. Raw structure, no decorative padding."
    icon: "⊞"
    components:
      - name: density-principle
        title: Density Is Exposure
        principle: "Expose structure. No decorative whitespace, no soft padding, no visual cushioning. Every pixel serves the grid."
        approach: "14px monospace base font, 12px gutters, 12px spacing unit. Cards and tables use heavy 2px borders as visual separators instead of whitespace. Content fills its container edge-to-edge."
        rationale: "Brutalism rejects decorative comfort. Density in brutalist design is not about cramming — it is about revealing structure by removing the cosmetic filler that other themes use to soften the grid."
      - name: command-palette
        title: Command Palette
        principle: "The command palette is a raw text interface — no icons, no illustrations, no thumbnails. Text in, text out."
        approach: "Cmd+K opens a monospaced input field with 2px solid border. Results render as a flat list with no hover animations. Selected item uses a solid background fill. No fuzzy-search decorations — just matching text."
        rationale: "A command palette is a text interface. Brutalism strips it to that essence — a box, a list, a selection. No visual ornamentation between the user and the action."

  - name: color-system
    title: Functional Color System
    description: "How color encodes meaning. Orange is the only permitted accent. Everything else is black, white, or functional state color."
    icon: "●"
    components:
      - name: color-principle
        title: Color Is Rationed
        principle: "Orange (#FF5500) is the single accent color. It marks action, focus, and urgency. All other color is functional state encoding or grayscale."
        approach: "Priority: P0=red, P1=yellow, P2=blue, P3=gray. System state: healthy=green, degraded=yellow, down=red. Agent: active=green, working=violet, idle=gray. Outside of state encoding, the palette is black and white."
        rationale: "Brutalism rejects decorative color. A single violent accent forces discipline — if everything is orange, nothing is. The constraint makes every use of color meaningful."
      - name: agent-identity
        title: Agent Visual Identity
        principle: "AI agents are marked with a heavy left border, not soft badges or gradients. Same structural treatment as human content — different accent color."
        approach: "Violet 4px left-border stripe on agent-generated blocks. Agent badges use heavy 2px borders, all-caps labels, monospace text. No sparkles, no glow, no softness. Agent avatars use square shape — no circles, no hexagons."
        rationale: "Agents are structural elements, not decorative features. A heavy border is honest — it says 'this boundary exists.' A glow effect is a lie — it pretends the boundary is soft."

  - name: dark-mode
    title: Dark Mode First
    description: "Design philosophy for the platform's primary color mode. High contrast, no subtlety."
    icon: "◐"
    components:
      - name: dark-principle
        title: Dark Mode Is Primary
        principle: "Near-black (#111111) background, white text, orange accent. No slate tints, no subtle elevation — contrast is the point."
        approach: "Pure near-black (#111111) base, not tinted slate. Surfaces differentiate via border weight, not luminance. 2px borders replace shadow-based elevation entirely. Light mode inverts to white background with black text — equally stark."
        rationale: "Brutalism does not do subtle. Slate-tinted darks are a comfort mechanism. Pure black-and-white contrast is honest, readable, and unapologetic."

  - name: keyboard-interaction
    title: Keyboard-First Interaction
    description: "Interaction model for keyboard-driven users. Visible focus states, no hover animations."
    icon: "⌘"
    components:
      - name: keyboard-principle
        title: Every Action by Keyboard
        principle: "Every action reachable by keyboard. Focus rings are 2px solid orange — visible, not decorative."
        approach: "Global shortcuts (Cmd+K command palette, Cmd+/ help). Contextual shortcuts (j/k navigation, Enter to open, Escape to dismiss). Focus ring: 2px solid var(--red) with no offset or glow. No hover transitions — state changes are instant."
        rationale: "Transitions and animations are decorative delay. Brutalist interaction is immediate — press a key, see the result. The 2px orange focus ring is the only permitted visual feedback for keyboard navigation."

  - name: status-indicators
    title: Status Indicators
    description: "Badges, alerts, toasts, and progress bars. Heavy borders, square corners, no softness."
    icon: "◉"
    components:
      - name: badges
        title: Status Badges
        principle: "Compact, bordered, all-caps labels. Square corners, heavy borders, no pills."
        approach: "Semantic class system: danger/success/warning/info for feedback, priority-critical/high/medium/low for task priority, agent-active/working/idle for AI status, state-healthy/degraded/down for systems. All badges: 2px solid border, 0px radius, uppercase text, monospace font."
        rationale: "A rounded pill is a softened rectangle. Brutalism does not soften. Square badges with heavy borders are honest about being labels."
      - name: alerts
        title: Inline Alerts
        principle: "Contextual messages with 4px left border. No background tint — border color is the only signal."
        approach: "4px solid left border with semantic color. No background tint, no icon decoration. Message in monospace. Error alerts persist until dismissed. No auto-dismiss for any severity."
        rationale: "Background tints are decorative softening. A heavy left border is a structural signal — it divides the alert from the content without pretending to blend in."
      - name: toasts
        title: Toast Notifications
        principle: "Rectangular, bordered, stacked. No rounded corners, no slide animations."
        approach: "Top-right position, 8s duration, stacked with 12px gap. 2px solid border, 0px radius. Appear instantly — no slide-in, no fade. Error toasts persist. White background, black text, orange left-border for emphasis."
        rationale: "Slide-in animations are decorative delay. A toast should appear and be read. Brutalist toasts appear instantly and occupy space honestly."
      - name: progress
        title: Progress Indicators
        principle: "Visible progress with no animation on the bar itself. Stepped, not smooth."
        approach: "Linear progress bar: 2px border, solid fill with no gradient, no animation on the fill. Step progress for multi-phase workflows — each step is a bordered box. Always show percentage in monospace."
        rationale: "Animated progress bars are decorative. The user needs a number and a proportion — not a moving gradient."

  - name: custom-components
    title: Custom Components
    description: "Project-specific composite components. The Badge is the foundational atomic — heavy borders, all-caps, square corners."
    icon: "⬢"
    components:
      - name: badge
        title: Badge
        principle: "One component, every status context. Heavy 2px border, all-caps, monospace, square corners."
        approach: "Base .badge provides structure: inline-flex, monospace font, compact padding (1px 8px), xs font size, 2px solid border, 0px radius, uppercase text. Semantic classes inject --accent, --background, --color. Variants: .badge-dot (square dot, not round), .badge-pill (still rectangular in brutalist), .badge-solid (filled), .badge-outline (border only), .badge-sm/.badge-lg (size), .badge-agent (agent styling)."
        rationale: "The badge is the most frequently used status indicator. In brutalist design it must be instantly legible: heavy border for containment, all-caps for scanability, monospace for alignment in dense lists."
      - name: badge-priority
        title: "Badge: Priority Variants"
        principle: "Priority levels are color-coded badges with optional square dot indicators."
        approach: "P0=danger (red), P1=priority-high (amber), P2=priority-medium (blue), P3=priority-low (gray). Add .badge-dot for the status square prefix. The square color inherits from the semantic class --accent. In dense lists, use .badge-sm for tighter spacing."
        rationale: "Priority is scanned, not read. The heavy border and all-caps label make priority badges visible in dense kanban columns. Square dots reinforce the brutalist grid."
      - name: badge-agent
        title: "Badge: Agent Status"
        principle: "Agent status badges with heavy borders and monospace labels."
        approach: "agent-active (emerald), agent-working (violet), agent-idle (gray). Add .badge-agent for monospace letter-spacing. Add .badge-dot for the status square. Agent avatars are square — no circles, no hexagons."
        rationale: "Agents are structural peers. Their badges use the same heavy-border treatment as every other status indicator. The violet accent for 'working' is functional differentiation, not decoration."
      - name: badge-system
        title: "Badge: System State"
        principle: "System health badges for monitoring dashboards. Square, bordered, all-caps."
        approach: "state-healthy (emerald), state-degraded (amber), state-down (red). Use .badge-dot for the square status indicator. In monitoring dashboards, badges appear in bordered grids."
        rationale: "System state is binary: up or down, with a degraded middle. The badge encodes that state with color and a square dot — no softness, no ambiguity."

  - name: forms
    title: Form Controls
    description: "Input fields, selectors, validation. Heavy borders, no shadows, no rounding."
    icon: "☐"
    components:
      - name: inputs
        title: Input Fields
        principle: "Dense, monospaced inputs with heavy borders. No shadows, no rounding, no placeholder animations."
        approach: "32px height, 2px solid border, 0px radius. Monospace font for all inputs. Focus state: border-color changes to orange, no glow, no shadow. Labels above in all-caps, not inline."
        rationale: "An input field is a box for text. Brutalism makes it exactly that — a bordered rectangle. Shadow and rounding are cosmetic lies about the element's physicality."
      - name: selectors
        title: Selectors & Dropdowns
        principle: "Keyboard-navigable selectors with heavy-bordered dropdown panels."
        approach: "HeadlessUI Listbox for short lists, Combobox with search for 10+ items. Dropdown panel: 2px solid border, 0px radius, no shadow. Selected values shown as bordered rectangles, not pills."
        rationale: "Dropdown panels are overlay boxes. They should look like boxes — bordered, square, opaque. No shadow blur pretending the panel floats."

# ═══════════════════════════════════════════════════════════════
# THEME DESIGN TOKENS — tobornalp brutalist
# ═══════════════════════════════════════════════════════════════
#
# Raw Brutalist. Black and white foundation, electric orange
# as a single violent accent. No rounded corners, no shadows,
# no gradients, no opacity tricks. Heavy borders, exposed grid.
#
# SEED STRATEGY:
#   red (orange) = primary action + accent (the one permitted color)
#   blue = secondary structural accent
#   yellow = warning / caution
#   black/white = everything else
# ═══════════════════════════════════════════════════════════════

vars:
  groups:
    # ── Seeds ──
    # Engine auto-expands: white/black → gray ramp,
    # red/blue/yellow → light/mid variants, unit → spacing scale
    - name: "Seeds"
      vars:
        white: "#FFFFFF"
        black: "#111111"
        red: "#FF5500"
        blue: "#0055FF"
        yellow: "#FFD600"
        font-sans: "'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-mono: "'IBM Plex Mono', 'Cascadia Code', 'Fira Code', monospace"
        radius: "0px"
        unit: "12px"

    # ── Extended Neutrals ──
    # Pure grays — no tinting, no warmth, no personality
    - name: "Neutrals"
      vars:
        gray-50: "#FAFAFA"
        gray-100: "#F5F5F5"
        gray-200: "#E5E5E5"
        gray-300: "#D4D4D4"
        gray-400: "#A3A3A3"
        gray-500: "#737373"
        gray-600: "#525252"
        gray-700: "#404040"
        gray-800: "#262626"
        gray-900: "#171717"

    # ── Accent Primaries ──
    - name: "Accent Primaries"
      vars:
        red-light: "rgba(255,85,0,0.10)"
        red-mid: "rgba(255,85,0,0.20)"
        blue-light: "rgba(0,85,255,0.10)"
        blue-mid: "rgba(0,85,255,0.20)"
        yellow-light: "rgba(255,214,0,0.12)"
        yellow-mid: "rgba(255,214,0,0.25)"

    # ── Semantic ──
    # Functional color — brutally direct status encoding
    - name: "Semantic"
      vars:
        success: "#00CC44"
        success-tint: "rgba(0,204,68,0.12)"
        warning: "#FFD600"
        warning-tint: "rgba(255,214,0,0.12)"
        error: "#FF0000"
        error-tint: "rgba(255,0,0,0.12)"
        info: "#0055FF"
        info-tint: "rgba(0,85,255,0.12)"

    # ── Extended Palette ──
    # Reduced palette — brutalism does not need 20 colors
    - name: "Extended Palette"
      vars:
        violet: "#7700FF"
        violet-light: "rgba(119,0,255,0.10)"
        violet-mid: "rgba(119,0,255,0.20)"
        emerald: "#00CC44"
        emerald-light: "rgba(0,204,68,0.10)"
        cyan: "#00CCCC"
        cyan-light: "rgba(0,204,204,0.10)"
        rose: "#FF0055"
        rose-light: "rgba(255,0,85,0.10)"
        amber: "#FFD600"
        amber-light: "rgba(255,214,0,0.10)"
        indigo: "#4400FF"
        indigo-light: "rgba(68,0,255,0.10)"
        teal: "#00AA88"
        teal-light: "rgba(0,170,136,0.10)"
        orange: "#FF5500"
        orange-light: "rgba(255,85,0,0.10)"
        sky: "#0088FF"
        sky-light: "rgba(0,136,255,0.10)"
        lime: "#88CC00"
        lime-light: "rgba(136,204,0,0.10)"
        pink: "#FF0088"
        pink-light: "rgba(255,0,136,0.10)"
        fuchsia: "#CC00FF"
        fuchsia-light: "rgba(204,0,255,0.10)"
        purple: "#8800FF"
        purple-light: "rgba(136,0,255,0.10)"

    # ── Typography ──
    # Space Grotesk for display (geometric, bold),
    # IBM Plex Mono for body (readable, industrial)
    - name: "Typography"
      vars:
        font-display: "'Space Grotesk', sans-serif"
        font-body: "'IBM Plex Mono', monospace"
        size-xs: "11px"
        size-sm: "12px"
        size-md: "14px"
        size-lg: "16px"
        size-xl: "22px"
        font-size-2xs: "10px"
        font-size-xs: "var(--size-xs)"
        font-size-sm: "var(--size-sm)"
        font-size-md: "var(--size-md)"
        font-size-lg: "var(--size-lg)"
        font-size-xl: "var(--size-xl)"
        font-size-2xl: "28px"
        font-size-3xl: "40px"
        font-size-display: "56px"
        font-size-base: "var(--size-md)"

    # ── Spacing ──
    # 12px base unit — generous, grid-aligned, structural
    - name: "Spacing"
      vars:
        space-quarter: "3px"
        space-half: "6px"
        space-1: "12px"
        space-2: "24px"
        space-3: "36px"
        space-4: "48px"
        space-5: "60px"
        space-6: "72px"
        space-8: "96px"
        space-10: "120px"
        space-12: "144px"
        col-gap: "12px"

    # ── Radius ──
    # Zero. Everywhere. No rounding. Ever.
    - name: "Radius"
      vars:
        radius-sm: "0px"
        radius-md: "0px"
        radius-lg: "0px"

    # ── Base ──
    - name: "Base"
      vars:
        base-font-size: "14px"
        base-line-height: "1.6"
        base-font-family: "var(--font-mono)"
        base-font-color: "var(--text, var(--black))"
        base-background: "var(--surface, var(--white))"
        bg: "var(--surface, var(--white))"

    # ── Branding ──
    - name: "Branding"
      vars:
        branding-logo-font-size: "18px"
        branding-logo-font-weight: "700"
        branding-logo-letter-spacing: "0.08em"
        branding-logo-text-transform: "uppercase"
        branding-logo-bg: "var(--surface)"
        branding-border: "2px solid var(--text)"

    # ── Cards ──
    # Heavy borders, no rounded corners, exposed structure
    - name: "Cards"
      vars:
        card-accent-side: "left"
        card-background: "var(--surface)"
        card-border-color: "var(--text)"
        card-header-background: "var(--surface-alt)"
        card-footer-background: "var(--surface-alt)"
        card-footer-font-size: "11px"

    # ── Buttons ──
    # Orange primary, heavy border, no rounding
    - name: "Buttons"
      vars:
        btn-font-family: "var(--font-sans)"
        btn-font-weight: "700"
        btn-font-size: "13px"
        btn-letter-spacing: "0.06em"
        btn-background: "var(--red)"
        btn-color: "#ffffff"
        btn-border-color: "var(--red)"
        btn-hover-background: "#CC4400"
        btn-hover-border-color: "#CC4400"
        btn-outline-background: "transparent"
        btn-outline-color: "var(--text)"
        btn-outline-hover-background: "var(--red-light)"

    # ── Section Chrome ──
    - name: "Section Chrome"
      vars:
        sg-section-title-font-family: "var(--font-sans)"
        sg-section-title-text-transform: "uppercase"
        sg-section-title-letter-spacing: "0.06em"
        sg-section-title-color: "var(--text)"
        sg-section-number-bg: "var(--red)"
        sg-section-number-border: "2px solid var(--red)"
        sg-section-number-color: "#ffffff"
        sg-section-number-radius: "0px"
        sg-section-desc-font-family: "var(--font-mono)"
        sg-section-desc-color: "var(--text-muted)"
        sg-type-specimen-bg: "var(--surface)"
        sg-type-specimen-border: "2px solid var(--text)"
        sg-type-specimen-border-bottom: "4px solid var(--red)"
        sg-type-specimen-radius: "0px"
        sg-type-specimen-padding: "var(--space-3)"
        sg-type-specimen-margin: "0 0 var(--space-2) 0"
        sg-type-specimen-name-color: "var(--text)"
        sg-type-specimen-name-font: "var(--font-sans)"
        hr-section-height: "2px"
        hr-section-color: "var(--text)"
        hr-subsection-color: "var(--border)"
        hr-subsection-height: "1px"
        hr-accent-color: "var(--red)"

    # ── HUI: Focus & Interaction ──
    - name: "HUI: Focus & Interaction"
      vars:
        hui-focus-ring-color: "var(--red)"
        hui-focus-ring-width: "2px"

    # ── HUI: Controls ──
    - name: "HUI: Controls"
      vars:
        hui-control-color: "var(--text)"
        hui-control-bg: "var(--surface)"
        hui-control-border: "var(--text)"
        hui-control-shadow: "none"
        hui-switch-track-on-bg: "var(--red)"
        hui-switch-track-off-bg: "var(--gray-400)"
        hui-switch-thumb-shadow: "none"
        hui-radio-option-border: "var(--text)"
        hui-radio-option-border-active: "var(--red)"
        hui-radio-option-bg-active: "var(--red-light)"

    # ── HUI: Trigger Buttons ──
    - name: "HUI: Trigger Buttons"
      vars:
        hui-trigger-bg: "var(--surface)"
        hui-trigger-border: "var(--text)"
        hui-trigger-border-hover: "var(--red)"
        hui-trigger-color: "var(--text)"

    # ── HUI: Overlay Panels ──
    - name: "HUI: Overlay Panels"
      vars:
        hui-panel-bg: "var(--surface)"
        hui-panel-border: "var(--text)"
        hui-panel-shadow: "none"
        hui-panel-item-active-bg: "var(--red-light)"
        hui-panel-item-active-color: "var(--text)"
        hui-panel-sep-color: "var(--border)"

    # ── HUI: Tabs ──
    - name: "HUI: Tabs"
      vars:
        hui-tab-color: "var(--text-muted)"
        hui-tab-color-selected: "var(--text)"
        hui-tab-border-selected: "var(--red)"
        hui-tab-color-hover: "var(--text-secondary)"
        hui-tab-list-border: "var(--text)"

    # ── HUI: Disclosure ──
    - name: "HUI: Disclosure"
      vars:
        hui-disclosure-bg: "var(--surface-alt)"
        hui-disclosure-bg-hover: "var(--gray-200)"
        hui-disclosure-border: "var(--text)"
        hui-disclosure-color: "var(--text)"
        hui-disclosure-panel-bg: "var(--surface)"
        hui-disclosure-panel-color: "var(--text-secondary)"
        hui-disclosure-chevron-color: "var(--text-muted)"

    # ── HUI: Field Controls ──
    - name: "HUI: Field Controls"
      vars:
        hui-field-bg: "var(--surface)"
        hui-field-border: "var(--text)"
        hui-field-border-hover: "var(--red)"
        hui-field-focus-border: "var(--red)"
        hui-field-color: "var(--text)"
        hui-field-shadow: "none"
        hui-combo-placeholder-color: "var(--text-muted)"
        hui-combo-btn-color: "var(--text-muted)"

    # ── HUI: Dialog ──
    - name: "HUI: Dialog"
      vars:
        hui-dialog-bg: "var(--surface)"
        hui-dialog-shadow: "none"
        hui-dialog-title-color: "var(--text)"
        hui-dialog-body-color: "var(--text-secondary)"
        hui-dialog-backdrop: "rgba(0,0,0,0.85)"

    # ── HUI: Showcase Grid ──
    - name: "HUI: Showcase Grid"
      vars:
        hui-showcase-accent: "var(--red)"
        hui-showcase-bg: "var(--surface-alt)"
        hui-showcase-border: "var(--text)"
        hui-showcase-cell-bg: "var(--surface)"
        hui-showcase-cell-border: "var(--text)"
        hui-showcase-label-color: "var(--text-muted)"

name: "tobornalp"
logo-text: "TOBORNALP"

font-url: "https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"

logo-style:
  font: "var(--font-sans)"
  color: "var(--text)"
  html: '<div style="display:inline-flex;align-items:center;gap:8px"><svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="1" y="1" width="26" height="26" stroke="var(--red)" stroke-width="2"/><rect x="5" y="5" width="8" height="8" fill="var(--red)"/><rect x="15" y="5" width="8" height="8" fill="var(--black)" stroke="var(--red)" stroke-width="1"/><rect x="5" y="15" width="8" height="8" fill="var(--black)" stroke="var(--red)" stroke-width="1"/><rect x="15" y="15" width="8" height="8" fill="var(--red)"/></svg><span style="font-family:var(--font-sans);font-size:18px;font-weight:700;letter-spacing:0.08em;line-height:1;color:currentColor;text-transform:uppercase">TOBORNALP</span></div>'

intent: "Brutalist rejection of polish. The name is a puzzle — an anagram of 'robotplan' — and the interface refuses to hide it. The design language draws from poured concrete, exposed rebar, and the raw web. Structure is visible. Borders are load-bearing. Color is a weapon, not a decoration."

perception: "Confrontational. Honest. The kind of tool that does not apologize for being a tool. It shows you exactly what it is."

audience: "Developers and builders who distrust prettiness. They want raw function, exposed structure, and zero visual lies. They read source code for fun. They think rounded corners are a form of cowardice."

tone: "Blunt and direct. ALL-CAPS labels. No softening. Error messages are accusations. Success is a fact, not a celebration. The interface speaks like someone who has no time for pleasantries."

keywords:
  - brutalist
  - raw
  - aggressive
  - exposed
  - structural
  - unapologetic
  - confrontational

intro:
  title: "TOBORNALP"
  title-html: '<span style="display:inline-flex;align-items:center;gap:14px"><svg width="40" height="40" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="1" y="1" width="26" height="26" stroke="var(--red)" stroke-width="2"/><rect x="5" y="5" width="8" height="8" fill="var(--red)"/><rect x="15" y="5" width="8" height="8" fill="var(--black)" stroke="var(--red)" stroke-width="1"/><rect x="5" y="15" width="8" height="8" fill="var(--black)" stroke="var(--red)" stroke-width="1"/><rect x="15" y="15" width="8" height="8" fill="var(--red)"/></svg><span style="font-family:var(--font-sans);font-weight:700;letter-spacing:0.08em;text-transform:uppercase">TOBORNALP</span></span>'

# ═══════════════════════════════════════════════════════════════
# COLOR MODES — tobornalp vapor
# ═══════════════════════════════════════════════════════════════
#
# Dark mode is PRIMARY — this theme lives in the dark. The neon
# only works against void-black. Light mode is a washed-out
# pastel inversion: desaturated, muted, dream-like — like a
# synthwave album cover left in the sun.
# ═══════════════════════════════════════════════════════════════

color-modes:
  # ── Light mode ─────────────────────────────────────────────
  # Washed-out pastel inversion. Desaturated lavender grounds,
  # darkened neon accents for contrast. Like VHS left in sunlight.
  light:
    surface: "#F0E8FF"
    surface-alt: "#E8E0F8"
    surface-inverse: "#0A0A1A"
    surface-accent: "rgba(0,200,200,0.08)"
    surface-warning: "rgba(200,180,0,0.10)"
    surface-danger: "rgba(200,30,80,0.10)"
    surface-success: "rgba(30,180,20,0.10)"
    text: "#1A1030"
    text-secondary: "#3A3060"
    text-muted: "#6E6690"
    text-inverse: "#E8E0FF"
    text-link: "#0099AA"
    border: "#D4CCF0"
    border-strong: "#B8B0D4"
    border-accent: "#0099AA"
    shadow-color: "rgba(10,10,26,0.08)"
    focus-ring: "rgba(0,200,200,0.4)"

  # ── Dark mode ──────────────────────────────────────────────
  # The true vapor mode. Deep purple-black void, neon accents
  # at full saturation. Surfaces glow with subtle colored shadows.
  # This is where the theme comes alive.
  dark:
    surface: "#0A0A1A"
    surface-alt: "#161233"
    surface-inverse: "#E8E0FF"
    surface-accent: "rgba(0,255,255,0.10)"
    surface-warning: "rgba(255,231,68,0.10)"
    surface-danger: "rgba(255,45,111,0.10)"
    surface-success: "rgba(57,255,20,0.10)"
    text: "#E8E0FF"
    text-secondary: "#B8B0D4"
    text-muted: "#6E6690"
    text-inverse: "#0A0A1A"
    text-link: "#00FFFF"
    border: "#252048"
    border-strong: "#3A3260"
    border-accent: "#00FFFF"
    shadow-color: "rgba(0,0,0,0.4)"
    focus-ring: "rgba(0,255,255,0.5)"

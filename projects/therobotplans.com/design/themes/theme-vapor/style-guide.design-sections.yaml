design-sections:
  - name: density
    title: Density & Information Architecture
    description: "How the platform organizes and compresses information for power users."
    icon: "⊞"
    components:
      - name: density-principle
        title: Density Serves Clarity
        principle: "Pack information tight — but structure it so every element has a clear role."
        approach: "14px base font, 12px gutters, 8px spacing unit. Cards, tables, and lists use compact variants by default. Whitespace is earned, not given. In vapor, depth is created through luminance and neon glow rather than whitespace alone."
        rationale: "Density without structure is clutter. Density with structure is a cockpit. The synthwave aesthetic thrives on density — a dark grid filled with glowing data points, like a retro-future control room."
      - name: command-palette
        title: Command Palette
        principle: "The command palette is the universal entry point — every action in the system reachable in 2 keystrokes."
        approach: "Cmd+K opens a filterable, fuzzy-searchable command list. Recent commands first, then global actions, then contextual. Results ranked by frequency and recency. In vapor, the palette uses a cyan-bordered overlay with subtle CRT scanline texture."
        rationale: "Keyboard-first users are our primary audience. The command palette is faster than any menu hierarchy and scales better than toolbars."

  - name: color-system
    title: Functional Color System
    description: "How color encodes meaning across the platform — priority, status, ownership, and state. Neon-saturated for dark backgrounds."
    icon: "●"
    components:
      - name: color-principle
        title: Color Is Functional
        principle: "Every color in the interface encodes meaning. If a color doesn't carry information, it shouldn't be there."
        approach: "Priority: P0=hot-pink, P1=electric-gold, P2=cyan, P3=gray. System state: healthy=neon-green, degraded=electric-gold, down=hot-pink. Agent: active=neon-green, working=violet, idle=gray. All functional colors are neon-saturated to glow against deep purple-black surfaces."
        rationale: "In a synthwave palette, every color is vivid. Functional color must be even more vivid — the neon that burns brightest carries the most critical signal."
      - name: agent-identity
        title: Agent Visual Identity
        principle: "AI agents are styled as peer team members — same card structure, same status indicators, same typography as human content."
        approach: "Violet accent marks agent-generated output via left-border stripe or inline badge. Magenta for agent-triggered events. Agent avatars use hexagon shape with violet glow to differentiate from human circle avatars."
        rationale: "Agents that look like features get treated like features — optional, ignorable. Agents that look like team members get treated as team members — accountable, reliable. The violet/magenta distinction separates identity from action."

  - name: dark-mode
    title: Dark Mode First
    description: "Design philosophy for the platform's primary color mode. In vapor, dark mode IS the theme."
    icon: "◐"
    components:
      - name: dark-principle
        title: Dark Mode Is Primary
        principle: "The neon only works against the void. Dark mode is the native environment; light mode is a washed-out courtesy."
        approach: "Deep purple-black (#0A0A1A) base — not pure black, not neutral gray. Purple-tinted darks create atmospheric depth. Lifted surfaces (#161233) separate via luminance. Neon accents at full saturation: cyan, magenta, violet, neon-green. Light mode desaturates everything — pastel lavender grounds, muted neon accents — like a VHS tape left in the sun."
        rationale: "Pure black is sterile. Purple-black is atmospheric — it gives the neon somewhere to live. The tinted darks create the illusion of depth, like staring into the grid from Tron."

  - name: keyboard-interaction
    title: Keyboard-First Interaction
    description: "Interaction model designed for power users who live on the keyboard."
    icon: "⌘"
    components:
      - name: keyboard-principle
        title: Every Action by Keyboard
        principle: "Every action reachable by keyboard. Mouse is the fallback, not the primary input."
        approach: "Global shortcuts (Cmd+K command palette, Cmd+/ help). Contextual shortcuts (j/k navigation, Enter to open, Escape to dismiss). Vim-style navigation in lists and tables. Focus rings use cyan glow (box-shadow) instead of browser default outlines."
        rationale: "Mouse interaction interrupts flow. Keyboard interaction maintains it. For users managing 50+ tasks daily, the efficiency gap compounds."

  - name: status-indicators
    title: Status Indicators
    description: "Badges, alerts, toasts, progress bars, and system status signals. Neon-enhanced for the synthwave palette."
    icon: "◉"
    components:
      - name: badges
        title: Status Badges
        principle: "Compact, color-coded labels for priority, agent status, and system state."
        approach: "Semantic class system: danger/success/warning/info for feedback, priority-critical/high/medium/low for task priority, agent-active/working/idle for AI status, state-healthy/degraded/down for systems. In vapor, badges get a subtle box-shadow glow matching their accent color."
        rationale: "Badges are the primary visual language for status. They must be instantly scannable at small sizes in dense layouts."
      - name: alerts
        title: Inline Alerts
        principle: "Contextual messages that appear inline with content, not as modal interruptions."
        approach: "Accent-bar left or bottom with semantic background tint. Icon + message + optional action. Dismissible but not auto-dismissing for error states. In vapor, alert borders use gradient fades from accent color to transparent."
        rationale: "Modal alerts break flow. Inline alerts inform without interrupting."
      - name: toasts
        title: Toast Notifications
        principle: "Ephemeral feedback for completed actions — confirm, then disappear."
        approach: "Top-right position, 8s duration, stacked with 16px gap. Success states are quiet (checkmark + text). Error states persist until dismissed. In vapor, toasts have a neon border-bottom and subtle glow."
        rationale: "Toasts confirm that an action worked without requiring the user to look for confirmation."
      - name: progress
        title: Progress Indicators
        principle: "Visible progress for any operation longer than 500ms."
        approach: "Linear progress bar for determinate operations, spinner for indeterminate. Step progress for multi-phase workflows. Always show percentage or step count. In vapor, progress bars use a cyan-to-magenta gradient fill."
        rationale: "Invisible progress creates anxiety. Visible progress creates trust."

  - name: custom-components
    title: Custom Components
    description: "Project-specific composite components built from the design system. The Badge is the T0 foundational atomic — enhanced with neon glow and gradient accents for vapor."
    icon: "⬢"
    components:
      - name: badge
        title: Badge
        principle: "One component, every status context. The Badge is a semantic class consumer — apply .badge for the shell, add a semantic class for the color."
        approach: "Base .badge provides structure: inline-flex, monospace font, compact padding (1px 8px), xs font size. Semantic classes inject --accent, --background, --color via CSS custom properties. In vapor, badges gain a box-shadow glow from their --accent color. Variants: .badge-dot, .badge-pill, .badge-solid, .badge-outline, .badge-sm/.badge-lg, .badge-agent."
        rationale: "A unified Badge with modifiers is more composable, more maintainable, and produces consistent visual weight across all status contexts. The neon glow is the vapor signature — it makes badges feel like they're embedded in a control panel."
      - name: badge-priority
        title: "Badge: Priority Variants"
        principle: "Priority levels are color-coded badges with optional dot indicators."
        approach: "P0=danger (hot pink), P1=priority-high (electric gold), P2=priority-medium (cyan), P3=priority-low (gray). Add .badge-dot for the status dot prefix with glow. In dense lists, use .badge-sm for tighter spacing."
        rationale: "Priority is the most frequently scanned property in a task list. Neon colors on dark backgrounds make priority badges pop without needing larger sizes."
      - name: badge-agent
        title: "Badge: Agent Status"
        principle: "Agent status badges identify which agents are online, working, or idle."
        approach: "agent-active (neon green), agent-working (violet), agent-idle (gray). Add .badge-agent for monospace letter-spacing. Add .badge-dot for the status dot with glow. In team views, badges appear next to agent avatars (hexagon shape with violet shadow)."
        rationale: "Agents are team members. The violet glow for 'working' is the vapor signature for AI activity — distinct from cyan (system) and green (success)."
      - name: badge-system
        title: "Badge: System State"
        principle: "System health badges for monitoring dashboards and status pages."
        approach: "state-healthy (neon green), state-degraded (electric gold), state-down (hot pink). Use .badge-dot for the classic status dot pattern with glow. In monitoring dashboards, badges appear in service lists and status grids."
        rationale: "System state is binary-ish: green/amber/red. The neon glow makes healthy systems visually reassuring and down systems impossible to miss."

  - name: forms
    title: Form Controls
    description: "Input fields, selectors, validation, and form layout patterns. Styled with subtle neon focus states."
    icon: "☐"
    components:
      - name: inputs
        title: Input Fields
        principle: "Dense but readable inputs — every field earns its space."
        approach: "32px height for standard inputs (matches 14px base + padding). Monospace for code/data inputs. Inline validation with semantic color. Labels above, not inline. In vapor, focused inputs get a cyan box-shadow glow and border transition."
        rationale: "Compact inputs enable dense forms without sacrificing usability. The glow focus state is immediately visible without being distracting."
      - name: selectors
        title: Selectors & Dropdowns
        principle: "Keyboard-navigable selectors with search for long lists."
        approach: "HeadlessUI Listbox for short lists, Combobox with search for 10+ items. Multi-select via checkboxes in dropdown. Selected values shown as compact pills. In vapor, dropdown panels have a subtle violet shadow and border glow."
        rationale: "Power users manage hundreds of items. Scrolling through unsearchable dropdowns doesn't scale."

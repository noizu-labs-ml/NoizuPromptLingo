# ═══════════════════════════════════════════════════════════════
# CSS SNIPPETS — tobornalp vapor
# ═══════════════════════════════════════════════════════════════

css-snippets:
  - name: Intro Hero
    slug: intro-hero
    title: "Style guide intro hero"
    description: "Hero section at the top of the style guide viewer. Neon glow title, CRT scanline overlay, synthwave color bar."
    target-section: intro
    body: |
      html[data-design-theme="vapor"] .sg-intro-hero {
        padding: var(--space-8) var(--space-4);
        text-align: center;
        border-bottom: 2px solid var(--border);
        margin-bottom: var(--space-6);
        background: var(--surface);
        position: relative;
        overflow: hidden;
      }
      html[data-design-theme="vapor"] .sg-intro-hero::after {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(0,255,255,0.03) 2px,
          rgba(0,255,255,0.03) 4px
        );
        pointer-events: none;
      }
      html[data-design-theme="vapor"] .sg-intro-title {
        font-family: var(--font-display);
        font-size: 2.5rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text);
        text-shadow: 0 0 10px var(--blue), 0 0 40px rgba(0,255,255,0.3);
        margin: 0 0 var(--space-2);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-2);
      }
      html[data-design-theme="vapor"] .sg-intro-glyph {
        font-size: 3rem;
        margin-bottom: var(--space-2);
        text-shadow: 0 0 16px var(--magenta);
      }
      html[data-design-theme="vapor"] .sg-intro-subtitle {
        font-family: var(--font-mono);
        font-size: var(--font-size-xs);
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--blue);
        text-shadow: 0 0 8px var(--blue);
        margin-bottom: var(--space-3);
      }
      html[data-design-theme="vapor"] .sg-intro-quote {
        font-family: var(--font-sans);
        font-size: var(--font-size-base);
        font-style: italic;
        color: var(--text-secondary);
        max-width: 600px;
        margin: 0 auto var(--space-4);
      }
      html[data-design-theme="vapor"] .sg-intro-meta {
        font-family: var(--font-mono);
        font-size: var(--font-size-xs);
        color: var(--text-muted);
        margin-bottom: var(--space-4);
      }
      html[data-design-theme="vapor"] .sg-intro-color-bar {
        display: flex;
        justify-content: center;
        gap: var(--space-1);
        margin-bottom: var(--space-4);
      }
      html[data-design-theme="vapor"] .sg-intro-color-bar span {
        display: block;
        width: 32px;
        height: 32px;
        border-radius: var(--radius);
        box-shadow: 0 0 12px rgba(0,255,255,0.25);
      }
      html[data-design-theme="vapor"] .sg-intro-meta-cards {
        display: flex;
        justify-content: center;
        gap: var(--space-3);
        flex-wrap: wrap;
      }
      html[data-design-theme="vapor"] .sg-intro-meta-card {
        font-family: var(--font-mono);
        font-size: var(--font-size-xs);
        padding: var(--space-2) var(--space-3);
        background: var(--surface-alt);
        border-radius: var(--radius);
        border: 1px solid var(--border);
        box-shadow: 0 0 8px rgba(139,92,246,0.1);
      }
      html[data-design-theme="vapor"] .sg-intro-meta-card .label {
        display: block;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-muted);
        margin-bottom: 2px;
      }
      html[data-design-theme="vapor"] .sg-intro-meta-card .value {
        display: block;
        color: var(--text);
        font-weight: 400;
      }


  - name: Agent Badge
    slug: agent-badge
    title: "Agent identity badge"
    description: "Inline badge identifying AI agent output. Violet accent with subtle neon glow."
    target-section: ui-elements
    body: |
      html[data-design-theme="vapor"] .badge-agent {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 8px;
        font-size: var(--font-size-xs);
        font-family: var(--font-mono);
        font-weight: 500;
        border-radius: var(--radius-sm);
        background: var(--violet-light);
        color: var(--violet);
        border: 1px solid var(--violet-mid);
        box-shadow: 0 0 8px rgba(139,92,246,0.2);
      }

  - name: Priority Dot
    slug: priority-dot
    title: "Priority level indicator"
    description: "Small colored dot for priority levels P0-P3 with neon glow on critical priorities."
    target-section: ui-elements
    body: |
      html[data-design-theme="vapor"] .priority-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      html[data-design-theme="vapor"] .priority-dot--p0 {
        background: var(--error);
        box-shadow: 0 0 6px var(--error);
      }
      html[data-design-theme="vapor"] .priority-dot--p1 {
        background: var(--warning);
        box-shadow: 0 0 6px var(--warning);
      }
      html[data-design-theme="vapor"] .priority-dot--p2 { background: var(--blue); }
      html[data-design-theme="vapor"] .priority-dot--p3 { background: var(--gray-400); }

  - name: Status Pill
    slug: status-pill
    title: "Status indicator pill"
    description: "Rounded pill with dot and label for status display. Neon-tinted backgrounds on dark."
    target-section: ui-elements
    body: |
      html[data-design-theme="vapor"] .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 2px 10px;
        font-size: var(--font-size-xs);
        font-weight: 500;
        border-radius: 999px;
        background: var(--accent-bg, var(--surface-alt));
        color: var(--accent, var(--text-secondary));
      }
      html[data-design-theme="vapor"] .status-pill::before {
        content: "";
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent, var(--text-muted));
        box-shadow: 0 0 4px var(--accent, transparent);
      }

  # ── Unified Badge System ──────────────────────────────────────
  # The Badge is the T0 atomic — same structure as base theme,
  # enhanced with vapor glow effects and neon border tints.
  #
  # Usage:
  #   <span class="badge danger">P0 critical</span>
  #   <span class="badge success">deployed</span>
  #   <span class="badge agent-working">PM Agent</span>

  - name: Badge
    slug: badge
    title: "Unified badge component"
    description: "The foundational status badge — compact, color-coded, scannable. Enhanced with synthwave glow effects on accent colors."
    target-section: custom-components
    body: |
      html[data-design-theme="vapor"] .badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 1px 8px;
        font-family: var(--font-mono);
        font-size: var(--font-size-xs);
        font-weight: 500;
        line-height: 1.6;
        border-radius: var(--radius-sm);
        white-space: nowrap;
        vertical-align: middle;
        background: var(--background, var(--surface-alt));
        color: var(--color, var(--text-secondary));
        border: 1px solid color-mix(in srgb, var(--accent, var(--border)) 30%, transparent);
        box-shadow: 0 0 6px color-mix(in srgb, var(--accent, transparent) 15%, transparent);
      }

      /* ── Size variants ── */
      html[data-design-theme="vapor"] .badge.badge-sm {
        padding: 0 6px;
        font-size: var(--font-size-2xs);
        gap: 3px;
      }
      html[data-design-theme="vapor"] .badge.badge-lg {
        padding: 2px 12px;
        font-size: var(--font-size-sm);
        gap: 6px;
      }

      /* ── Dot variant: prepend a colored dot with glow ── */
      html[data-design-theme="vapor"] .badge.badge-dot::before {
        content: "";
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        flex-shrink: 0;
        background: var(--accent, var(--text-muted));
        box-shadow: 0 0 4px var(--accent, transparent);
      }
      html[data-design-theme="vapor"] .badge.badge-sm.badge-dot::before {
        width: 5px;
        height: 5px;
      }

      /* ── Pill variant: fully rounded ── */
      html[data-design-theme="vapor"] .badge.badge-pill {
        border-radius: 999px;
        padding: 1px 10px;
      }

      /* ── Solid variant: filled background, dark text ── */
      html[data-design-theme="vapor"] .badge.badge-solid {
        background: var(--accent, var(--gray-400));
        color: var(--black);
        border-color: transparent;
        text-shadow: none;
      }

      /* ── Outline variant: border only, no fill ── */
      html[data-design-theme="vapor"] .badge.badge-outline {
        background: transparent;
        border-color: var(--accent, var(--border));
      }

      /* ── Agent badge: monospace with violet accent ── */
      html[data-design-theme="vapor"] .badge.badge-agent {
        font-family: var(--font-mono);
        letter-spacing: 0.02em;
      }

  - name: Neon Glow Text
    slug: neon-glow-text
    title: "Neon glow text effect"
    description: "Text-shadow based neon glow for headings and accent text. Cyan and magenta variants."
    target-section: custom-components
    body: |
      html[data-design-theme="vapor"] .neon-glow {
        text-shadow: 0 0 7px var(--blue), 0 0 20px rgba(0,255,255,0.4);
      }
      html[data-design-theme="vapor"] .neon-glow--magenta {
        text-shadow: 0 0 7px var(--magenta), 0 0 20px rgba(255,0,255,0.4);
      }
      html[data-design-theme="vapor"] .neon-glow--violet {
        text-shadow: 0 0 7px var(--violet), 0 0 20px rgba(139,92,246,0.4);
      }
      html[data-design-theme="vapor"] .neon-glow--green {
        text-shadow: 0 0 7px var(--neon-green), 0 0 20px rgba(57,255,20,0.4);
      }

  - name: Gradient Border
    slug: gradient-border
    title: "Gradient neon border"
    description: "Cyan-to-magenta gradient border for cards and panels. Uses background-clip trick."
    target-section: custom-components
    body: |
      html[data-design-theme="vapor"] .gradient-border {
        border: 2px solid transparent;
        background-image: linear-gradient(var(--surface), var(--surface)),
                          linear-gradient(135deg, var(--blue), var(--magenta));
        background-origin: border-box;
        background-clip: padding-box, border-box;
        border-radius: var(--radius-md);
      }

  - name: CRT Scanlines
    slug: crt-scanlines
    title: "CRT scanline overlay"
    description: "Retro CRT scanline effect applied as a pseudo-element overlay. Subtle, non-interactive."
    target-section: custom-components
    body: |
      html[data-design-theme="vapor"] .crt-scanlines {
        position: relative;
      }
      html[data-design-theme="vapor"] .crt-scanlines::after {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(0,255,255,0.03) 2px,
          rgba(0,255,255,0.03) 4px
        );
        pointer-events: none;
        border-radius: inherit;
      }

  - name: Compact Table
    slug: compact-table
    title: "Dense data table"
    description: "Tighter spacing for dashboard tables with subtle neon border accents."
    target-section: ui-elements
    body: |
      html[data-design-theme="vapor"] .table-compact {
        width: 100%;
        border-collapse: collapse;
        font-size: var(--font-size-sm);
      }
      html[data-design-theme="vapor"] .table-compact th {
        text-align: left;
        font-weight: 500;
        color: var(--text-muted);
        font-size: var(--font-size-xs);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        padding: var(--space-1) var(--space-2);
        border-bottom: 1px solid var(--border);
      }
      html[data-design-theme="vapor"] .table-compact td {
        padding: var(--space-1) var(--space-2);
        border-bottom: 1px solid var(--border);
        color: var(--text);
      }

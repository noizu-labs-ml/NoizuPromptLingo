# ═══════════════════════════════════════════════════════════════
# THEME DESIGN TOKENS — tobornalp vapor
# ═══════════════════════════════════════════════════════════════
#
# Synthwave/retrowave. Neon-soaked, retro-futurist, 80s CRT
# nostalgia. Deep purple-black grounds, electric cyan/magenta/
# violet accents with glow effects. Tron meets outrun.
#
# SEED STRATEGY:
#   blue (cyan) = primary action + navigation + glow anchor
#   red (hot pink) = destructive / critical / P0
#   yellow (electric gold) = warning / attention / P1
#   magenta = secondary action + agent identity
#   violet = AI/agent accent (agent-generated content markers)
#   neon-green = success / healthy / shipped
# ═══════════════════════════════════════════════════════════════

vars:
  groups:
    # ── Seeds ──
    # Engine auto-expands: white/black → gray ramp,
    # red/blue/yellow → light/mid variants, unit → spacing scale
    - name: "Seeds"
      vars:
        white: "#E8E0FF"
        black: "#0A0A1A"
        red: "#FF2D6F"
        blue: "#00FFFF"
        yellow: "#FFE744"
        font-sans: "'Overpass', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-mono: "'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace"
        radius: "12px"
        unit: "8px"

    # ── Extended Neutrals ──
    # Purple-tinted darks for that synthwave depth
    - name: "Neutrals"
      vars:
        gray-50: "#E8E0FF"
        gray-100: "#D4CCF0"
        gray-200: "#B8B0D4"
        gray-300: "#8E86B0"
        gray-400: "#6E6690"
        gray-500: "#504878"
        gray-600: "#3A3260"
        gray-700: "#252048"
        gray-800: "#161233"
        gray-900: "#0A0A1A"

    # ── Accent Primaries ──
    - name: "Accent Primaries"
      vars:
        red-light: "rgba(255,45,111,0.10)"
        red-mid: "rgba(255,45,111,0.20)"
        blue-light: "rgba(0,255,255,0.10)"
        blue-mid: "rgba(0,255,255,0.20)"
        yellow-light: "rgba(255,231,68,0.12)"
        yellow-mid: "rgba(255,231,68,0.22)"

    # ── Semantic ──
    # Functional color — neon-tuned for dark backgrounds
    - name: "Semantic"
      vars:
        success: "#39FF14"
        success-tint: "rgba(57,255,20,0.12)"
        warning: "#FFE744"
        warning-tint: "rgba(255,231,68,0.12)"
        error: "#FF2D6F"
        error-tint: "rgba(255,45,111,0.12)"
        info: "#00FFFF"
        info-tint: "rgba(0,255,255,0.12)"

    # ── Extended Palette ──
    # Neon-saturated palette for the synthwave world
    - name: "Extended Palette"
      vars:
        violet: "#8B5CF6"
        violet-light: "rgba(139,92,246,0.12)"
        violet-mid: "rgba(139,92,246,0.22)"
        magenta: "#FF00FF"
        magenta-light: "rgba(255,0,255,0.12)"
        magenta-mid: "rgba(255,0,255,0.22)"
        neon-green: "#39FF14"
        neon-green-light: "rgba(57,255,20,0.12)"
        emerald: "#39FF14"
        emerald-light: "rgba(57,255,20,0.10)"
        cyan: "#00FFFF"
        cyan-light: "rgba(0,255,255,0.10)"
        rose: "#FF2D6F"
        rose-light: "rgba(255,45,111,0.10)"
        amber: "#FFE744"
        amber-light: "rgba(255,231,68,0.10)"
        indigo: "#6366F1"
        indigo-light: "rgba(99,102,241,0.10)"
        teal: "#00FFFF"
        teal-light: "rgba(0,255,255,0.10)"
        orange: "#FF6B2B"
        orange-light: "rgba(255,107,43,0.10)"
        sky: "#00D4FF"
        sky-light: "rgba(0,212,255,0.10)"
        lime: "#39FF14"
        lime-light: "rgba(57,255,20,0.10)"
        pink: "#FF69B4"
        pink-light: "rgba(255,105,180,0.10)"
        fuchsia: "#FF00FF"
        fuchsia-light: "rgba(255,0,255,0.10)"
        purple: "#A855F7"
        purple-light: "rgba(168,85,247,0.10)"

    # ── Typography ──
    # Syncopate for display (wide, geometric, uppercase energy),
    # Overpass for body (clean, technical), Fira Code for mono
    - name: "Typography"
      vars:
        font-display: "'Syncopate', 'Overpass', sans-serif"
        font-body: "'Overpass', sans-serif"
        size-xs: "11px"
        size-sm: "12px"
        size-md: "14px"
        size-lg: "16px"
        size-xl: "20px"
        font-size-2xs: "10px"
        font-size-xs: "var(--size-xs)"
        font-size-sm: "var(--size-sm)"
        font-size-md: "var(--size-md)"
        font-size-lg: "var(--size-lg)"
        font-size-xl: "var(--size-xl)"
        font-size-2xl: "24px"
        font-size-3xl: "32px"
        font-size-display: "40px"
        font-size-base: "var(--size-md)"

    # ── Spacing ──
    # 8px base unit — same grid, different skin
    - name: "Spacing"
      vars:
        space-quarter: "2px"
        space-half: "4px"
        space-1: "8px"
        space-2: "16px"
        space-3: "24px"
        space-4: "32px"
        space-5: "40px"
        space-6: "48px"
        space-8: "64px"
        space-10: "80px"
        space-12: "96px"
        col-gap: "12px"

    # ── Radius ──
    # Softer, rounder — retro-tech CRT corners
    - name: "Radius"
      vars:
        radius-sm: "8px"
        radius-md: "12px"
        radius-lg: "16px"

    # ── Base ──
    - name: "Base"
      vars:
        base-font-size: "14px"
        base-line-height: "1.5"
        base-font-family: "var(--font-sans)"
        base-font-color: "var(--text, var(--white))"
        base-background: "var(--surface, var(--black))"
        bg: "var(--surface, var(--black))"

    # ── Branding ──
    - name: "Branding"
      vars:
        branding-logo-font-size: "15px"
        branding-logo-font-weight: "700"
        branding-logo-letter-spacing: "0.12em"
        branding-logo-text-transform: "uppercase"
        branding-logo-bg: "var(--surface)"
        branding-border: "1px solid var(--border)"

    # ── Cards ──
    # Neon accent stripe, glowing borders
    - name: "Cards"
      vars:
        card-accent-side: "left"
        card-background: "var(--surface)"
        card-border-color: "var(--border)"
        card-header-background: "var(--surface-alt)"
        card-footer-background: "var(--surface-alt)"
        card-footer-font-size: "11px"

    # ── Buttons ──
    # Cyan primary with glow, uppercase Syncopate labels
    - name: "Buttons"
      vars:
        btn-font-family: "var(--font-display)"
        btn-font-weight: "700"
        btn-font-size: "12px"
        btn-letter-spacing: "0.08em"
        btn-background: "var(--blue)"
        btn-color: "var(--black)"
        btn-border-color: "transparent"
        btn-hover-background: "#33FFFF"
        btn-hover-border-color: "transparent"
        btn-outline-background: "transparent"
        btn-outline-color: "var(--text)"
        btn-outline-hover-background: "var(--surface-alt)"

    # ── Section Chrome ──
    - name: "Section Chrome"
      vars:
        sg-section-title-font-family: "var(--font-display)"
        sg-section-title-text-transform: "uppercase"
        sg-section-title-letter-spacing: "0.08em"
        sg-section-title-color: "var(--text)"
        sg-section-number-bg: "var(--blue)"
        sg-section-number-border: "none"
        sg-section-number-color: "var(--black)"
        sg-section-number-radius: "var(--radius-sm)"
        sg-section-desc-font-family: "var(--font-sans)"
        sg-section-desc-color: "var(--text-muted)"
        sg-type-specimen-bg: "var(--surface-alt)"
        sg-type-specimen-border: "1px solid var(--border)"
        sg-type-specimen-border-bottom: "2px solid var(--blue)"
        sg-type-specimen-radius: "var(--radius-md)"
        sg-type-specimen-padding: "var(--space-3)"
        sg-type-specimen-margin: "0 0 var(--space-2) 0"
        sg-type-specimen-name-color: "var(--text)"
        sg-type-specimen-name-font: "var(--font-display)"
        hr-section-height: "1px"
        hr-section-color: "var(--border)"
        hr-subsection-color: "var(--border)"
        hr-subsection-height: "1px"
        hr-accent-color: "var(--blue)"

    # ── HUI: Focus & Interaction ──
    - name: "HUI: Focus & Interaction"
      vars:
        hui-focus-ring-color: "rgba(0,255,255,0.5)"
        hui-focus-ring-width: "2px"

    # ── HUI: Controls ──
    - name: "HUI: Controls"
      vars:
        hui-control-color: "var(--text)"
        hui-control-bg: "var(--surface)"
        hui-control-border: "var(--gray-600)"
        hui-control-shadow: "0 0 6px rgba(0,255,255,0.15)"
        hui-switch-track-on-bg: "var(--blue)"
        hui-switch-track-off-bg: "var(--gray-600)"
        hui-switch-thumb-shadow: "0 0 6px rgba(0,255,255,0.3)"
        hui-radio-option-border: "var(--border)"
        hui-radio-option-border-active: "var(--blue)"
        hui-radio-option-bg-active: "var(--blue-light)"

    # ── HUI: Trigger Buttons ──
    - name: "HUI: Trigger Buttons"
      vars:
        hui-trigger-bg: "var(--surface)"
        hui-trigger-border: "var(--gray-600)"
        hui-trigger-border-hover: "var(--blue)"
        hui-trigger-color: "var(--text)"

    # ── HUI: Overlay Panels ──
    - name: "HUI: Overlay Panels"
      vars:
        hui-panel-bg: "var(--surface)"
        hui-panel-border: "var(--border)"
        hui-panel-shadow: "0 4px 24px rgba(0,255,255,0.12), 0 0 48px rgba(139,92,246,0.08)"
        hui-panel-item-active-bg: "var(--blue-light)"
        hui-panel-item-active-color: "var(--text)"
        hui-panel-sep-color: "var(--border)"

    # ── HUI: Tabs ──
    - name: "HUI: Tabs"
      vars:
        hui-tab-color: "var(--text-muted)"
        hui-tab-color-selected: "var(--blue)"
        hui-tab-border-selected: "var(--blue)"
        hui-tab-color-hover: "var(--text-secondary)"
        hui-tab-list-border: "var(--border)"

    # ── HUI: Disclosure ──
    - name: "HUI: Disclosure"
      vars:
        hui-disclosure-bg: "var(--surface-alt)"
        hui-disclosure-bg-hover: "var(--gray-700)"
        hui-disclosure-border: "var(--border)"
        hui-disclosure-color: "var(--text)"
        hui-disclosure-panel-bg: "var(--surface)"
        hui-disclosure-panel-color: "var(--text-secondary)"
        hui-disclosure-chevron-color: "var(--text-muted)"

    # ── HUI: Field Controls ──
    - name: "HUI: Field Controls"
      vars:
        hui-field-bg: "var(--surface)"
        hui-field-border: "var(--gray-600)"
        hui-field-border-hover: "var(--gray-400)"
        hui-field-focus-border: "var(--blue)"
        hui-field-color: "var(--text)"
        hui-field-shadow: "0 0 8px rgba(0,255,255,0.1)"
        hui-combo-placeholder-color: "var(--text-muted)"
        hui-combo-btn-color: "var(--text-muted)"

    # ── HUI: Dialog ──
    - name: "HUI: Dialog"
      vars:
        hui-dialog-bg: "var(--surface)"
        hui-dialog-shadow: "0 8px 48px rgba(0,0,0,0.4), 0 0 64px rgba(139,92,246,0.15)"
        hui-dialog-title-color: "var(--text)"
        hui-dialog-body-color: "var(--text-secondary)"
        hui-dialog-backdrop: "rgba(10,10,26,0.85)"

    # ── HUI: Showcase Grid ──
    - name: "HUI: Showcase Grid"
      vars:
        hui-showcase-accent: "var(--blue)"
        hui-showcase-bg: "var(--surface-alt)"
        hui-showcase-border: "var(--border)"
        hui-showcase-cell-bg: "var(--surface)"
        hui-showcase-cell-border: "var(--border)"
        hui-showcase-label-color: "var(--text-muted)"

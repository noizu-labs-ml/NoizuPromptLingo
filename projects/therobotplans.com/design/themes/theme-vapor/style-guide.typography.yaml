typography:
  - var: font-display
    name: Syncopate
    description: "Display typeface. Wide, geometric, uppercase energy — like text stamped on a chrome surface. Used for headlines and branding."
    usage: "Hero titles, section headers, button labels, logo text"
    weights: [400, 700]

  - var: font-sans
    name: Overpass
    description: "Primary body typeface. Clean, technical, and highly readable. Highway signage roots give it a mechanical precision."
    usage: "Body copy, card content, form labels, descriptions, UI text"
    weights: [300, 400, 500, 600, 700]

  - var: font-mono
    name: Fira Code
    description: "Monospace typeface. Programming ligatures, crisp at small sizes. Used for code, data values, and terminal output."
    usage: "Code blocks, agent logs, metric values, commit hashes, terminal"
    weights: [300, 400, 500, 600]

typography-classes:
  - name: Display
    class: typography-display
    font-family: "var(--font-display)"
    font-size: "var(--font-size-display)"
    font-weight: "700"
    line-height: "1.1"
    letter-spacing: "0.08em"
    text-transform: "uppercase"

  - name: H1
    class: typography-h1
    font-family: "var(--font-display)"
    font-size: "var(--font-size-3xl)"
    font-weight: "700"
    line-height: "1.2"
    letter-spacing: "0.06em"
    text-transform: "uppercase"

  - name: H2
    class: typography-h2
    font-family: "var(--font-display)"
    font-size: "var(--font-size-2xl)"
    font-weight: "700"
    line-height: "1.25"
    letter-spacing: "0.05em"
    text-transform: "uppercase"

  - name: H3
    class: typography-h3
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-xl)"
    font-weight: "600"
    line-height: "1.3"
    letter-spacing: "0.02em"

  - name: H4
    class: typography-h4
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-lg)"
    font-weight: "600"
    line-height: "1.4"

  - name: Body
    class: typography-body
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-md)"
    font-weight: "400"
    line-height: "1.5"

  - name: Small
    class: typography-small
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-sm)"
    font-weight: "400"
    line-height: "1.5"

  - name: Label
    class: typography-label
    font-family: "var(--font-display)"
    font-size: "var(--font-size-xs)"
    font-weight: "700"
    line-height: "1.4"
    letter-spacing: "0.08em"
    text-transform: "uppercase"

  - name: Code
    class: typography-code
    font-family: "var(--font-mono)"
    font-size: "var(--font-size-sm)"
    font-weight: "400"
    line-height: "1.5"

  - name: Caption
    class: typography-caption
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-xs)"
    font-weight: "400"
    line-height: "1.4"
    color: "var(--text-muted)"

  - name: Data
    class: typography-data
    font-family: "var(--font-mono)"
    font-size: "var(--font-size-xs)"
    font-weight: "500"
    line-height: "1.3"

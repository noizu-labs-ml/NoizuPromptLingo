typography:
  - var: font-display
    name: Cormorant Garamond
    description: "Display typeface. Elegant high-contrast serif with beautiful italics. Evokes editorial print and classical typography."
    usage: "Hero headings, page titles, display text, editorial callouts"
    weights: [300, 400, 500, 600, 700]

  - var: font-sans
    name: Lora
    description: "Body typeface. Transitional serif with warmth and excellent readability at text sizes. Pairs naturally with Cormorant Garamond."
    usage: "Body copy, card titles, buttons, form labels, navigation"
    weights: [400, 500, 600, 700]

  - var: font-mono
    name: JetBrains Mono
    description: "Monospace typeface. Ligatures, clear disambiguation at 12px. Used for code, data values, and technical content."
    usage: "Code blocks, metric values, commit hashes, terminal output"
    weights: [300, 400, 500, 600]

typography-classes:
  - name: Display
    class: typography-display
    font-family: "var(--font-display)"
    font-size: "var(--font-size-display)"
    font-weight: "400"
    line-height: "1.15"
    letter-spacing: "-0.02em"

  - name: H1
    class: typography-h1
    font-family: "var(--font-display)"
    font-size: "var(--font-size-3xl)"
    font-weight: "500"
    line-height: "1.25"
    letter-spacing: "-0.015em"

  - name: H2
    class: typography-h2
    font-family: "var(--font-display)"
    font-size: "var(--font-size-2xl)"
    font-weight: "500"
    line-height: "1.3"
    letter-spacing: "-0.01em"

  - name: H3
    class: typography-h3
    font-family: "var(--font-display)"
    font-size: "var(--font-size-xl)"
    font-weight: "500"
    line-height: "1.35"
    letter-spacing: "0"

  - name: H4
    class: typography-h4
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-lg)"
    font-weight: "600"
    line-height: "1.4"

  - name: Body
    class: typography-body
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-md)"
    font-weight: "400"
    line-height: "1.65"

  - name: Small
    class: typography-small
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-sm)"
    font-weight: "400"
    line-height: "1.6"

  - name: Label
    class: typography-label
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-xs)"
    font-weight: "600"
    line-height: "1.4"
    letter-spacing: "0.04em"
    text-transform: "uppercase"

  - name: Code
    class: typography-code
    font-family: "var(--font-mono)"
    font-size: "var(--font-size-sm)"
    font-weight: "400"
    line-height: "1.6"

  - name: Caption
    class: typography-caption
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-xs)"
    font-weight: "400"
    line-height: "1.5"
    color: "var(--text-muted)"

  - name: Data
    class: typography-data
    font-family: "var(--font-mono)"
    font-size: "var(--font-size-xs)"
    font-weight: "500"
    line-height: "1.4"

scoped-vars:
  prefix: "theme"

  sections:
    standard:
      selector: 'html[data-design-theme="organic"]'
      prefix: "theme"
    dark:
      selector: 'html[data-design-theme="organic"].dark'
      prefix: "theme"
    layout:
      selector: 'html[data-design-theme="organic"]'
      prefix: "layout"

  vars:
    # =======================================
    # Color modes: surfaces, text, borders
    # =======================================
    - name: surface
      value:
        - section: standard
          value: "var(--white)"
        - section: dark
          value: "#2C1810"

    - name: surface-alt
      value:
        - section: standard
          value: "var(--gray-50)"
        - section: dark
          value: "#3E2E24"

    - name: surface-inverse
      value:
        - section: standard
          value: "var(--gray-900)"
        - section: dark
          value: "var(--gray-200)"

    - name: text
      value:
        - section: standard
          value: "var(--gray-900)"
        - section: dark
          value: "var(--gray-200)"

    - name: text-secondary
      value:
        - section: standard
          value: "var(--gray-600)"
        - section: dark
          value: "var(--gray-400)"

    - name: text-muted
      value:
        - section: standard
          value: "var(--gray-400)"
        - section: dark
          value: "var(--gray-500)"

    - name: text-inverse
      value:
        - section: standard
          value: "var(--white)"
        - section: dark
          value: "var(--gray-900)"

    - name: text-link
      value:
        - section: standard
          value: "#2D5F2D"
        - section: dark
          value: "#6B9E6B"

    - name: border
      value:
        - section: standard
          value: "var(--gray-200)"
        - section: dark
          value: "#4A3A30"

    - name: border-strong
      value:
        - section: standard
          value: "var(--gray-300)"
        - section: dark
          value: "var(--gray-600)"

    - name: shadow-color
      value:
        - section: standard
          value: "rgba(44,24,16,0.06)"
        - section: dark
          value: "rgba(0,0,0,0.3)"

    # =======================================
    # Dark mode: accent brightening
    # =======================================
    - name: blue
      value:
        - section: dark
          value: "#6B9E6B"
    - name: blue-light
      value:
        - section: dark
          value: "color-mix(in srgb, #2D5F2D 18%, var(--surface))"
    - name: blue-mid
      value:
        - section: dark
          value: "color-mix(in srgb, #2D5F2D 30%, var(--surface))"

    - name: violet
      value:
        - section: dark
          value: "color-mix(in srgb, #7B4F3A 75%, white)"
    - name: violet-light
      value:
        - section: dark
          value: "color-mix(in srgb, #7B4F3A 18%, var(--surface))"
    - name: violet-mid
      value:
        - section: dark
          value: "color-mix(in srgb, #7B4F3A 30%, var(--surface))"

    # =======================================
    # Dark mode: palette color brightening
    # =======================================
    - name: rose
      value:
        - section: dark
          value: "color-mix(in srgb, #B85450 75%, white)"
    - name: rose-light
      value:
        - section: dark
          value: "color-mix(in srgb, #B85450 18%, var(--surface))"

    - name: emerald
      value:
        - section: dark
          value: "color-mix(in srgb, #2D5F2D 75%, white)"
    - name: emerald-light
      value:
        - section: dark
          value: "color-mix(in srgb, #2D5F2D 18%, var(--surface))"

    - name: amber
      value:
        - section: dark
          value: "color-mix(in srgb, #D4A017 75%, white)"
    - name: amber-light
      value:
        - section: dark
          value: "color-mix(in srgb, #D4A017 18%, var(--surface))"

    - name: cyan
      value:
        - section: dark
          value: "color-mix(in srgb, #4A7B6F 75%, white)"
    - name: cyan-light
      value:
        - section: dark
          value: "color-mix(in srgb, #4A7B6F 18%, var(--surface))"

    - name: indigo
      value:
        - section: dark
          value: "color-mix(in srgb, #5B6B4F 75%, white)"
    - name: indigo-light
      value:
        - section: dark
          value: "color-mix(in srgb, #5B6B4F 18%, var(--surface))"

    - name: teal
      value:
        - section: dark
          value: "color-mix(in srgb, #4A7B6F 75%, white)"
    - name: teal-light
      value:
        - section: dark
          value: "color-mix(in srgb, #4A7B6F 18%, var(--surface))"

    - name: orange
      value:
        - section: dark
          value: "color-mix(in srgb, #C05621 75%, white)"
    - name: orange-light
      value:
        - section: dark
          value: "color-mix(in srgb, #C05621 18%, var(--surface))"

    - name: sky
      value:
        - section: dark
          value: "color-mix(in srgb, #6B8E7B 75%, white)"
    - name: sky-light
      value:
        - section: dark
          value: "color-mix(in srgb, #6B8E7B 18%, var(--surface))"

    - name: lime
      value:
        - section: dark
          value: "color-mix(in srgb, #6B8B3D 75%, white)"
    - name: lime-light
      value:
        - section: dark
          value: "color-mix(in srgb, #6B8B3D 18%, var(--surface))"

    - name: pink
      value:
        - section: dark
          value: "color-mix(in srgb, #B87070 75%, white)"
    - name: pink-light
      value:
        - section: dark
          value: "color-mix(in srgb, #B87070 18%, var(--surface))"

    - name: purple
      value:
        - section: dark
          value: "color-mix(in srgb, #7B5F7B 75%, white)"
    - name: purple-light
      value:
        - section: dark
          value: "color-mix(in srgb, #7B5F7B 18%, var(--surface))"

    - name: fuchsia
      value:
        - section: dark
          value: "color-mix(in srgb, #9B6B8A 75%, white)"
    - name: fuchsia-light
      value:
        - section: dark
          value: "color-mix(in srgb, #9B6B8A 18%, var(--surface))"

    # =======================================
    # Dark mode: semantic state brightening
    # =======================================
    - name: success
      value:
        - section: dark
          value: "color-mix(in srgb, #2D5F2D 75%, white)"
    - name: success-tint
      value:
        - section: dark
          value: "color-mix(in srgb, #2D5F2D 18%, var(--surface))"

    - name: warning
      value:
        - section: dark
          value: "color-mix(in srgb, #D4A017 75%, white)"
    - name: warning-tint
      value:
        - section: dark
          value: "color-mix(in srgb, #D4A017 18%, var(--surface))"

    - name: error
      value:
        - section: dark
          value: "color-mix(in srgb, #C05621 75%, white)"
    - name: error-tint
      value:
        - section: dark
          value: "color-mix(in srgb, #C05621 18%, var(--surface))"

    - name: info
      value:
        - section: dark
          value: "color-mix(in srgb, #5B7F5B 75%, white)"
    - name: info-tint
      value:
        - section: dark
          value: "color-mix(in srgb, #5B7F5B 18%, var(--surface))"

    # =======================================
    # Dark mode: component overrides
    # =======================================
    - name: card-background
      value:
        - section: dark
          value: "var(--gray-800)"
    - name: card-border-color
      value:
        - section: dark
          value: "var(--gray-700)"
    - name: btn-background
      value:
        - section: dark
          value: "#245024"
    - name: btn-hover-background
      value:
        - section: dark
          value: "#2D5F2D"

    # =======================================
    # Layout presets
    # =======================================
    - name: dashboard
      value:
        - section: layout
          values:
            max-width: "1440px"
            padding: "var(--space-3)"
            margin: "0 auto"
            content-bg: "var(--surface)"
      selector: ".content"
      selector-body: "max-width: var(--layout-dashboard-max-width); padding: var(--layout-dashboard-padding); margin: var(--layout-dashboard-margin); background: var(--layout-dashboard-content-bg)"

    - name: standard
      value:
        - section: layout
          values:
            max-width: "1200px"
            padding: "var(--space-4)"
            margin: "0 auto"
            content-bg: "var(--surface-alt)"
      selector: ".content.standard"
      selector-body: "max-width: var(--layout-standard-max-width); padding: var(--layout-standard-padding); margin: var(--layout-standard-margin); background: var(--layout-standard-content-bg)"

    - name: article
      value:
        - section: layout
          values:
            max-width: "68ch"
            padding: "var(--space-6)"
            margin: "0 auto"
            content-bg: "var(--surface-alt)"
      selector: ".content.article"
      selector-body: "max-width: var(--layout-article-max-width); padding: var(--layout-article-padding); margin: var(--layout-article-margin); background: var(--layout-article-content-bg)"

    - name: focus
      value:
        - section: layout
          values:
            max-width: "960px"
            padding: "var(--space-6)"
            margin: "0 auto"
            content-bg: "var(--surface)"
      selector: ".content.focus"
      selector-body: "max-width: var(--layout-focus-max-width); padding: var(--layout-focus-padding); margin: var(--layout-focus-margin); background: var(--layout-focus-content-bg)"

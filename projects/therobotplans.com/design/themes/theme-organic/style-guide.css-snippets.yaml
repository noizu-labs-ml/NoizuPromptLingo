# ===============================================================
# CSS SNIPPETS — tobornalp organic
# ===============================================================

css-snippets:
  - name: Intro Hero
    slug: intro-hero
    title: "Style guide intro hero"
    description: "Hero section with botanical feel -- warm serif typography, linen texture, organic shapes."
    target-section: intro
    body: |
      html[data-design-theme="organic"] .sg-intro-hero {
        padding: var(--space-10) var(--space-4);
        text-align: center;
        border-bottom: 1px solid var(--border);
        margin-bottom: var(--space-6);
        background: var(--surface);
        background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23D4C9BA' fill-opacity='0.15'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      }
      html[data-design-theme="organic"] .sg-intro-title {
        font-family: var(--font-display);
        font-size: 3rem;
        font-weight: 400;
        letter-spacing: -0.02em;
        color: var(--text);
        margin: 0 0 var(--space-2);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-2);
      }
      html[data-design-theme="organic"] .sg-intro-glyph {
        font-size: 3.5rem;
        margin-bottom: var(--space-2);
      }
      html[data-design-theme="organic"] .sg-intro-subtitle {
        font-family: var(--font-sans);
        font-size: var(--font-size-xs);
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--blue);
        margin-bottom: var(--space-3);
      }
      html[data-design-theme="organic"] .sg-intro-quote {
        font-family: var(--font-display);
        font-size: var(--font-size-lg);
        font-style: italic;
        color: var(--text-secondary);
        max-width: 600px;
        margin: 0 auto var(--space-4);
        line-height: 1.5;
      }
      html[data-design-theme="organic"] .sg-intro-meta {
        font-family: var(--font-mono);
        font-size: var(--font-size-xs);
        color: var(--text-muted);
        margin-bottom: var(--space-4);
      }
      html[data-design-theme="organic"] .sg-intro-color-bar {
        display: flex;
        justify-content: center;
        gap: var(--space-1);
        margin-bottom: var(--space-4);
      }
      html[data-design-theme="organic"] .sg-intro-color-bar span {
        display: block;
        width: 36px;
        height: 36px;
        border-radius: var(--radius);
        box-shadow: 0 2px 6px rgba(44,24,16,0.12);
      }
      html[data-design-theme="organic"] .sg-intro-meta-cards {
        display: flex;
        justify-content: center;
        gap: var(--space-3);
        flex-wrap: wrap;
      }
      html[data-design-theme="organic"] .sg-intro-meta-card {
        font-family: var(--font-sans);
        font-size: var(--font-size-xs);
        padding: var(--space-2) var(--space-3);
        background: var(--surface-alt);
        border-radius: var(--radius);
        border: 1px solid var(--border);
      }
      html[data-design-theme="organic"] .sg-intro-meta-card .label {
        display: block;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-muted);
        margin-bottom: 2px;
      }
      html[data-design-theme="organic"] .sg-intro-meta-card .value {
        display: block;
        color: var(--text);
        font-weight: 400;
      }


  - name: Linen Texture
    slug: linen-texture
    title: "Subtle linen background texture"
    description: "A subtle cross-hatch texture that evokes handmade paper or linen fabric. Apply to any surface."
    target-section: ui-elements
    body: |
      html[data-design-theme="organic"] .linen-texture {
        background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23D4C9BA' fill-opacity='0.08'%3E%3Cpath fill-rule='evenodd' d='M0 0h1v1H0V0zm2 2h1v1H2V2zm2-2h1v1H4V0zm2 2h1v1H6V2zm2-2h1v1H8V0zm2 2h1v1h-1V2zm2-2h1v1h-1V0zm2 2h1v1h-1V2zm2-2h1v1h-1V0zm2 2h1v1h-1V2zm2-2h1v1h-1V0zm2 2h1v1h-1V2zm2-2h1v1h-1V0zm2 2h1v1h-1V2zm2-2h1v1h-1V0zm2 2h1v1h-1V2zm2-2h1v1h-1V0zm2 2h1v1h-1V2z'/%3E%3C/g%3E%3C/svg%3E");
      }

  - name: Agent Badge
    slug: agent-badge
    title: "Agent identity badge"
    description: "Inline badge identifying AI agent output. Warm brown accent with organic styling."
    target-section: ui-elements
    body: |
      html[data-design-theme="organic"] .badge-agent {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 10px;
        font-size: var(--font-size-xs);
        font-family: var(--font-mono);
        font-weight: 500;
        border-radius: var(--radius-sm);
        background: var(--violet-light);
        color: var(--violet);
        border: 1px solid var(--violet-mid);
      }

  - name: Priority Dot
    slug: priority-dot
    title: "Priority level indicator"
    description: "Small colored dot for priority levels P0-P3."
    target-section: ui-elements
    body: |
      html[data-design-theme="organic"] .priority-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      html[data-design-theme="organic"] .priority-dot--p0 { background: var(--error); }
      html[data-design-theme="organic"] .priority-dot--p1 { background: var(--warning); }
      html[data-design-theme="organic"] .priority-dot--p2 { background: var(--blue); }
      html[data-design-theme="organic"] .priority-dot--p3 { background: var(--gray-400); }

  - name: Status Pill
    slug: status-pill
    title: "Status indicator pill"
    description: "Rounded pill with dot and label for status display."
    target-section: ui-elements
    body: |
      html[data-design-theme="organic"] .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 12px;
        font-size: var(--font-size-xs);
        font-weight: 500;
        border-radius: 999px;
        background: var(--accent-bg, var(--surface-alt));
        color: var(--accent, var(--text-secondary));
      }
      html[data-design-theme="organic"] .status-pill::before {
        content: "";
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent, var(--text-muted));
      }

  - name: Badge
    slug: badge
    title: "Unified badge component"
    description: "The foundational status badge -- compact, warm, scannable. Combines with any semantic class for priority, agent status, system state, or feedback."
    target-section: custom-components
    body: |
      html[data-design-theme="organic"] .badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 10px;
        font-family: var(--font-mono);
        font-size: var(--font-size-xs);
        font-weight: 500;
        line-height: 1.6;
        border-radius: var(--radius-sm);
        white-space: nowrap;
        vertical-align: middle;
        background: var(--background, var(--surface-alt));
        color: var(--color, var(--text-secondary));
        border: 1px solid color-mix(in srgb, var(--accent, var(--border)) 30%, transparent);
      }

      /* -- Size variants -- */
      html[data-design-theme="organic"] .badge.badge-sm {
        padding: 0 8px;
        font-size: var(--font-size-2xs);
        gap: 3px;
      }
      html[data-design-theme="organic"] .badge.badge-lg {
        padding: 3px 14px;
        font-size: var(--font-size-sm);
        gap: 6px;
      }

      /* -- Dot variant: prepend a colored dot -- */
      html[data-design-theme="organic"] .badge.badge-dot::before {
        content: "";
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        flex-shrink: 0;
        background: var(--accent, var(--text-muted));
      }
      html[data-design-theme="organic"] .badge.badge-sm.badge-dot::before {
        width: 5px;
        height: 5px;
      }

      /* -- Pill variant: fully rounded -- */
      html[data-design-theme="organic"] .badge.badge-pill {
        border-radius: 999px;
        padding: 2px 12px;
      }

      /* -- Solid variant: filled background, cream text -- */
      html[data-design-theme="organic"] .badge.badge-solid {
        background: var(--accent, var(--gray-400));
        color: #FAF7F2;
        border-color: transparent;
      }

      /* -- Outline variant: border only, no fill -- */
      html[data-design-theme="organic"] .badge.badge-outline {
        background: transparent;
        border-color: var(--accent, var(--border));
      }

      /* -- Agent badge: monospace with warm brown accent -- */
      html[data-design-theme="organic"] .badge.badge-agent {
        font-family: var(--font-mono);
        letter-spacing: 0.02em;
      }

  - name: Compact Table
    slug: compact-table
    title: "Dense data table"
    description: "Tighter spacing for dashboard tables with organic warmth."
    target-section: ui-elements
    body: |
      html[data-design-theme="organic"] .table-compact {
        width: 100%;
        border-collapse: collapse;
        font-size: var(--font-size-sm);
      }
      html[data-design-theme="organic"] .table-compact th {
        text-align: left;
        font-weight: 600;
        color: var(--text-muted);
        font-size: var(--font-size-xs);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        padding: var(--space-1) var(--space-2);
        border-bottom: 1px solid var(--border);
      }
      html[data-design-theme="organic"] .table-compact td {
        padding: var(--space-1) var(--space-2);
        border-bottom: 1px solid var(--border);
        color: var(--text);
      }

# ===============================================================
# THEME DESIGN TOKENS — tobornalp organic
# ===============================================================
#
# Warm Organic. Earth tones, elegant serifs, generous breathing
# room. Optimized for thoughtful reading and calm productivity.
#
# SEED STRATEGY:
#   blue (forest green) = primary action + health
#   red (terracotta)    = accent / action / destructive
#   yellow (amber)      = warning / warmth
#   green (sage)        = secondary / calm
#   brown               = grounding / depth
# ===============================================================

vars:
  groups:
    # -- Seeds --
    # Engine auto-expands: white/black -> gray ramp,
    # red/blue/yellow -> light/mid variants, unit -> spacing scale
    - name: "Seeds"
      vars:
        white: "#FAF7F2"
        black: "#2C1810"
        red: "#C05621"
        blue: "#2D5F2D"
        yellow: "#D4A017"
        font-sans: "'Lora', 'Georgia', 'Palatino Linotype', serif"
        font-mono: "'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace"
        radius: "16px"
        unit: "10px"

    # -- Extended Neutrals --
    # Warm-tinted grays for an earthy, natural feel
    - name: "Neutrals"
      vars:
        gray-50: "#FAF7F2"
        gray-100: "#F5F0E8"
        gray-200: "#E8E0D4"
        gray-300: "#D4C9BA"
        gray-400: "#A89A8A"
        gray-500: "#7D7068"
        gray-600: "#5C5048"
        gray-700: "#3E3530"
        gray-800: "#2C2420"
        gray-900: "#2C1810"

    # -- Accent Primaries --
    - name: "Accent Primaries"
      vars:
        red-light: "rgba(192,86,33,0.08)"
        red-mid: "rgba(192,86,33,0.15)"
        blue-light: "rgba(45,95,45,0.08)"
        blue-mid: "rgba(45,95,45,0.15)"
        yellow-light: "rgba(212,160,23,0.10)"
        yellow-mid: "rgba(212,160,23,0.20)"

    # -- Semantic --
    # Functional color -- encodes system state with organic warmth
    - name: "Semantic"
      vars:
        success: "#2D5F2D"
        success-tint: "rgba(45,95,45,0.10)"
        warning: "#D4A017"
        warning-tint: "rgba(212,160,23,0.10)"
        error: "#C05621"
        error-tint: "rgba(192,86,33,0.10)"
        info: "#5B7F5B"
        info-tint: "rgba(91,127,91,0.10)"

    # -- Extended Palette --
    # Earth-toned feature-domain color coding
    - name: "Extended Palette"
      vars:
        violet: "#7B4F3A"
        violet-light: "rgba(123,79,58,0.08)"
        violet-mid: "rgba(123,79,58,0.15)"
        emerald: "#2D5F2D"
        emerald-light: "rgba(45,95,45,0.08)"
        cyan: "#4A7B6F"
        cyan-light: "rgba(74,123,111,0.08)"
        rose: "#B85450"
        rose-light: "rgba(184,84,80,0.08)"
        amber: "#D4A017"
        amber-light: "rgba(212,160,23,0.08)"
        indigo: "#5B6B4F"
        indigo-light: "rgba(91,107,79,0.08)"
        teal: "#4A7B6F"
        teal-light: "rgba(74,123,111,0.08)"
        orange: "#C05621"
        orange-light: "rgba(192,86,33,0.08)"
        sky: "#6B8E7B"
        sky-light: "rgba(107,142,123,0.08)"
        lime: "#6B8B3D"
        lime-light: "rgba(107,139,61,0.08)"
        pink: "#B87070"
        pink-light: "rgba(184,112,112,0.08)"
        fuchsia: "#9B6B8A"
        fuchsia-light: "rgba(155,107,138,0.08)"
        purple: "#7B5F7B"
        purple-light: "rgba(123,95,123,0.08)"
        sage: "#8B9E7C"
        sage-light: "rgba(139,158,124,0.08)"

    # -- Typography --
    # Cormorant Garamond for display (elegant, editorial),
    # Lora for body (readable serif with warmth),
    # JetBrains Mono for code
    - name: "Typography"
      vars:
        font-display: "'Cormorant Garamond', 'Garamond', 'Palatino', serif"
        font-body: "'Lora', 'Georgia', serif"
        size-xs: "12px"
        size-sm: "13px"
        size-md: "15px"
        size-lg: "17px"
        size-xl: "22px"
        font-size-2xs: "11px"
        font-size-xs: "var(--size-xs)"
        font-size-sm: "var(--size-sm)"
        font-size-md: "var(--size-md)"
        font-size-lg: "var(--size-lg)"
        font-size-xl: "var(--size-xl)"
        font-size-2xl: "28px"
        font-size-3xl: "36px"
        font-size-display: "48px"
        font-size-base: "var(--size-md)"

    # -- Spacing --
    # 10px base unit, generous breathing room
    - name: "Spacing"
      vars:
        space-quarter: "2.5px"
        space-half: "5px"
        space-1: "10px"
        space-2: "20px"
        space-3: "30px"
        space-4: "40px"
        space-5: "50px"
        space-6: "60px"
        space-8: "80px"
        space-10: "100px"
        space-12: "120px"
        col-gap: "16px"

    # -- Radius --
    # Soft, pillow-like rounded corners
    - name: "Radius"
      vars:
        radius-sm: "8px"
        radius-md: "16px"
        radius-lg: "20px"

    # -- Base --
    - name: "Base"
      vars:
        base-font-size: "15px"
        base-line-height: "1.65"
        base-font-family: "var(--font-sans)"
        base-font-color: "var(--text, var(--black))"
        base-background: "var(--surface, var(--white))"
        bg: "var(--surface, var(--white))"

    # -- Branding --
    - name: "Branding"
      vars:
        branding-logo-font-size: "20px"
        branding-logo-font-weight: "400"
        branding-logo-letter-spacing: "0.01em"
        branding-logo-text-transform: "none"
        branding-logo-bg: "var(--surface)"
        branding-border: "1px solid var(--border)"

    # -- Cards --
    # Warm, paper-like cards with soft shadows
    - name: "Cards"
      vars:
        card-accent-side: "left"
        card-background: "var(--surface)"
        card-border-color: "var(--border)"
        card-header-background: "var(--surface-alt)"
        card-footer-background: "var(--surface-alt)"
        card-footer-font-size: "12px"

    # -- Buttons --
    # Forest green primary, warm and grounded
    - name: "Buttons"
      vars:
        btn-font-family: "var(--font-sans)"
        btn-font-weight: "500"
        btn-font-size: "14px"
        btn-letter-spacing: "0.01em"
        btn-background: "var(--blue)"
        btn-color: "#FAF7F2"
        btn-border-color: "transparent"
        btn-hover-background: "#245024"
        btn-hover-border-color: "transparent"
        btn-outline-background: "transparent"
        btn-outline-color: "var(--text)"
        btn-outline-hover-background: "var(--surface-alt)"

    # -- Section Chrome --
    - name: "Section Chrome"
      vars:
        sg-section-title-font-family: "var(--font-display)"
        sg-section-title-text-transform: "none"
        sg-section-title-letter-spacing: "-0.01em"
        sg-section-title-color: "var(--text)"
        sg-section-number-bg: "var(--blue)"
        sg-section-number-border: "none"
        sg-section-number-color: "#FAF7F2"
        sg-section-number-radius: "var(--radius-sm)"
        sg-section-desc-font-family: "var(--font-sans)"
        sg-section-desc-color: "var(--text-muted)"
        sg-type-specimen-bg: "var(--surface-alt)"
        sg-type-specimen-border: "1px solid var(--border)"
        sg-type-specimen-border-bottom: "2px solid var(--blue)"
        sg-type-specimen-radius: "var(--radius-md)"
        sg-type-specimen-padding: "var(--space-3)"
        sg-type-specimen-margin: "0 0 var(--space-2) 0"
        sg-type-specimen-name-color: "var(--text)"
        sg-type-specimen-name-font: "var(--font-display)"
        hr-section-height: "1px"
        hr-section-color: "var(--border)"
        hr-subsection-color: "var(--border)"
        hr-subsection-height: "1px"
        hr-accent-color: "var(--blue)"

    # -- HUI: Focus & Interaction --
    - name: "HUI: Focus & Interaction"
      vars:
        hui-focus-ring-color: "rgba(45,95,45,0.4)"
        hui-focus-ring-width: "2px"

    # -- HUI: Controls --
    - name: "HUI: Controls"
      vars:
        hui-control-color: "var(--text)"
        hui-control-bg: "var(--surface)"
        hui-control-border: "var(--gray-300)"
        hui-control-shadow: "none"
        hui-switch-track-on-bg: "var(--blue)"
        hui-switch-track-off-bg: "var(--gray-300)"
        hui-switch-thumb-shadow: "0 1px 3px rgba(44,24,16,0.12)"
        hui-radio-option-border: "var(--border)"
        hui-radio-option-border-active: "var(--blue)"
        hui-radio-option-bg-active: "var(--blue-light)"

    # -- HUI: Trigger Buttons --
    - name: "HUI: Trigger Buttons"
      vars:
        hui-trigger-bg: "var(--surface)"
        hui-trigger-border: "var(--gray-300)"
        hui-trigger-border-hover: "var(--gray-400)"
        hui-trigger-color: "var(--text)"

    # -- HUI: Overlay Panels --
    - name: "HUI: Overlay Panels"
      vars:
        hui-panel-bg: "var(--surface)"
        hui-panel-border: "var(--border)"
        hui-panel-shadow: "0 4px 20px rgba(44,24,16,0.10)"
        hui-panel-item-active-bg: "var(--blue-light)"
        hui-panel-item-active-color: "var(--text)"
        hui-panel-sep-color: "var(--border)"

    # -- HUI: Tabs --
    - name: "HUI: Tabs"
      vars:
        hui-tab-color: "var(--text-muted)"
        hui-tab-color-selected: "var(--text)"
        hui-tab-border-selected: "var(--blue)"
        hui-tab-color-hover: "var(--text-secondary)"
        hui-tab-list-border: "var(--border)"

    # -- HUI: Disclosure --
    - name: "HUI: Disclosure"
      vars:
        hui-disclosure-bg: "var(--surface-alt)"
        hui-disclosure-bg-hover: "var(--gray-200)"
        hui-disclosure-border: "var(--border)"
        hui-disclosure-color: "var(--text)"
        hui-disclosure-panel-bg: "var(--surface)"
        hui-disclosure-panel-color: "var(--text-secondary)"
        hui-disclosure-chevron-color: "var(--text-muted)"

    # -- HUI: Field Controls --
    - name: "HUI: Field Controls"
      vars:
        hui-field-bg: "var(--surface)"
        hui-field-border: "var(--gray-300)"
        hui-field-border-hover: "var(--gray-400)"
        hui-field-focus-border: "var(--blue)"
        hui-field-color: "var(--text)"
        hui-field-shadow: "0 1px 3px rgba(44,24,16,0.06)"
        hui-combo-placeholder-color: "var(--text-muted)"
        hui-combo-btn-color: "var(--text-muted)"

    # -- HUI: Dialog --
    - name: "HUI: Dialog"
      vars:
        hui-dialog-bg: "var(--surface)"
        hui-dialog-shadow: "0 8px 40px rgba(44,24,16,0.14)"
        hui-dialog-title-color: "var(--text)"
        hui-dialog-body-color: "var(--text-secondary)"
        hui-dialog-backdrop: "rgba(44,24,16,0.5)"

    # -- HUI: Showcase Grid --
    - name: "HUI: Showcase Grid"
      vars:
        hui-showcase-accent: "var(--blue)"
        hui-showcase-bg: "var(--surface-alt)"
        hui-showcase-border: "var(--border)"
        hui-showcase-cell-bg: "var(--surface)"
        hui-showcase-cell-border: "var(--border)"
        hui-showcase-label-color: "var(--text-muted)"

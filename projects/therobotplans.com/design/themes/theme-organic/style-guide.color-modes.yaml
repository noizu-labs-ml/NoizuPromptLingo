# ===============================================================
# COLOR MODES — tobornalp organic
# ===============================================================
#
# Light mode is the primary mode for this theme -- organic warmth
# is born in daylight. Cream/linen backgrounds, warm earth tones.
# Dark mode is a cozy cabin at night -- deep brown base with
# muted earth tones and warm amber accents.
# ===============================================================

color-modes:
  # -- Light mode (PRIMARY) -----------------------------------
  # Cream/linen whites, warm gray hierarchy. Forest green and
  # terracotta accents for natural, grounded contrast.
  light:
    surface: "#FAF7F2"
    surface-alt: "#F5F0E8"
    surface-inverse: "#2C1810"
    surface-accent: "rgba(45,95,45,0.06)"
    surface-warning: "rgba(212,160,23,0.08)"
    surface-danger: "rgba(192,86,33,0.08)"
    surface-success: "rgba(45,95,45,0.08)"
    text: "#2C1810"
    text-secondary: "#5C5048"
    text-muted: "#A89A8A"
    text-inverse: "#FAF7F2"
    text-link: "#2D5F2D"
    border: "#E8E0D4"
    border-strong: "#D4C9BA"
    border-accent: "#2D5F2D"
    shadow-color: "rgba(44,24,16,0.06)"
    focus-ring: "rgba(45,95,45,0.4)"

  # -- Dark mode (cozy cabin) ---------------------------------
  # Deep brown ground, warm muted type, soft borders.
  # Earth tones brighten slightly for dark-background contrast.
  # Lifted surfaces create warmth via luminance.
  dark:
    surface: "#2C1810"
    surface-alt: "#3E2E24"
    surface-inverse: "#F5F0E8"
    surface-accent: "rgba(45,95,45,0.12)"
    surface-warning: "rgba(212,160,23,0.12)"
    surface-danger: "rgba(192,86,33,0.12)"
    surface-success: "rgba(45,95,45,0.12)"
    text: "#E8E0D4"
    text-secondary: "#A89A8A"
    text-muted: "#7D7068"
    text-inverse: "#2C1810"
    text-link: "#6B9E6B"
    border: "#4A3A30"
    border-strong: "#5C4C40"
    border-accent: "#6B9E6B"
    shadow-color: "rgba(0,0,0,0.3)"
    focus-ring: "rgba(107,158,107,0.4)"

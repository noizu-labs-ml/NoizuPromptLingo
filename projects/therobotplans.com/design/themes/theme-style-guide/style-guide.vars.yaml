# ═══════════════════════════════════════════════════════════════
# THEME DESIGN TOKENS — tobornalp
# ═══════════════════════════════════════════════════════════════
#
# High-density Minimal Tech. Muted palette, functional color,
# tight spacing. Optimized for information-dense dashboards
# where status, priority, and ownership are encoded in color.
#
# SEED STRATEGY:
#   blue   = primary action + agent identity
#   red    = destructive / critical / P0
#   yellow = warning / attention / P1
#   green (success) = healthy / complete / shipped
#   violet = AI/agent accent (agent-generated content markers)
# ═══════════════════════════════════════════════════════════════

vars:
  groups:
    # ── Seeds ──
    # Engine auto-expands: white/black → gray ramp,
    # red/blue/yellow → light/mid variants, unit → spacing scale
    - name: "Seeds"
      vars:
        white: "#F8FAFC"
        black: "#0F172A"
        red: "#EF4444"
        blue: "#3B82F6"
        yellow: "#F59E0B"
        font-sans: "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-mono: "'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace"
        radius: "6px"
        unit: "8px"

    # ── Extended Neutrals ──
    # Slate-tinted grays for a cooler, more technical feel
    - name: "Neutrals"
      vars:
        gray-50: "#F8FAFC"
        gray-100: "#F1F5F9"
        gray-200: "#E2E8F0"
        gray-300: "#CBD5E1"
        gray-400: "#94A3B8"
        gray-500: "#64748B"
        gray-600: "#475569"
        gray-700: "#334155"
        gray-800: "#1E293B"
        gray-900: "#0F172A"

    # ── Accent Primaries ──
    - name: "Accent Primaries"
      vars:
        red-light: "rgba(239,68,68,0.08)"
        red-mid: "rgba(239,68,68,0.15)"
        blue-light: "rgba(59,130,246,0.08)"
        blue-mid: "rgba(59,130,246,0.15)"
        yellow-light: "rgba(245,158,11,0.10)"
        yellow-mid: "rgba(245,158,11,0.20)"

    # ── Semantic ──
    # Functional color — encodes system state, not decoration
    - name: "Semantic"
      vars:
        success: "#10B981"
        success-tint: "rgba(16,185,129,0.10)"
        warning: "#F59E0B"
        warning-tint: "rgba(245,158,11,0.10)"
        error: "#EF4444"
        error-tint: "rgba(239,68,68,0.10)"
        info: "#3B82F6"
        info-tint: "rgba(59,130,246,0.10)"

    # ── Extended Palette ──
    # Agent and feature-domain color coding
    - name: "Extended Palette"
      vars:
        violet: "#8B5CF6"
        violet-light: "rgba(139,92,246,0.08)"
        violet-mid: "rgba(139,92,246,0.15)"
        emerald: "#10B981"
        emerald-light: "rgba(16,185,129,0.08)"
        cyan: "#06B6D4"
        cyan-light: "rgba(6,182,212,0.08)"
        rose: "#F43F5E"
        rose-light: "rgba(244,63,94,0.08)"
        amber: "#F59E0B"
        amber-light: "rgba(245,158,11,0.08)"
        indigo: "#6366F1"
        indigo-light: "rgba(99,102,241,0.08)"
        teal: "#14B8A6"
        teal-light: "rgba(20,184,166,0.08)"
        orange: "#F97316"
        orange-light: "rgba(249,115,22,0.08)"
        sky: "#0EA5E9"
        sky-light: "rgba(14,165,233,0.08)"
        lime: "#84CC16"
        lime-light: "rgba(132,204,22,0.08)"
        pink: "#EC4899"
        pink-light: "rgba(236,72,153,0.08)"
        fuchsia: "#D946EF"
        fuchsia-light: "rgba(217,70,239,0.08)"
        purple: "#A855F7"
        purple-light: "rgba(168,85,247,0.08)"

    # ── Typography ──
    # Inter for UI (excellent at small sizes, variable weight),
    # JetBrains Mono for code/data (ligatures, clear at 12px)
    - name: "Typography"
      vars:
        font-display: "'Inter', sans-serif"
        font-body: "'Inter', sans-serif"
        size-xs: "11px"
        size-sm: "12px"
        size-md: "14px"
        size-lg: "16px"
        size-xl: "20px"
        font-size-2xs: "10px"
        font-size-xs: "var(--size-xs)"
        font-size-sm: "var(--size-sm)"
        font-size-md: "var(--size-md)"
        font-size-lg: "var(--size-lg)"
        font-size-xl: "var(--size-xl)"
        font-size-2xl: "24px"
        font-size-3xl: "32px"
        font-size-display: "40px"
        font-size-base: "var(--size-md)"

    # ── Spacing ──
    # 8px base unit, tighter than typical — serves information density
    - name: "Spacing"
      vars:
        space-quarter: "2px"
        space-half: "4px"
        space-1: "8px"
        space-2: "16px"
        space-3: "24px"
        space-4: "32px"
        space-5: "40px"
        space-6: "48px"
        space-8: "64px"
        space-10: "80px"
        space-12: "96px"
        col-gap: "12px"

    # ── Radius ──
    # Slightly rounded — modern but not bubbly
    - name: "Radius"
      vars:
        radius-sm: "4px"
        radius-md: "6px"
        radius-lg: "8px"

    # ── Base ──
    - name: "Base"
      vars:
        base-font-size: "14px"
        base-line-height: "1.5"
        base-font-family: "var(--font-sans)"
        base-font-color: "var(--text, var(--black))"
        base-background: "var(--surface, var(--white))"
        bg: "var(--surface, var(--white))"

    # ── Branding ──
    - name: "Branding"
      vars:
        branding-logo-font-size: "18px"
        branding-logo-font-weight: "600"
        branding-logo-letter-spacing: "-0.02em"
        branding-logo-text-transform: "none"
        branding-logo-bg: "var(--surface)"
        branding-border: "1px solid var(--border)"

    # ── Cards ──
    # Left accent stripe for status coding
    - name: "Cards"
      vars:
        card-accent-side: "left"
        card-background: "var(--surface)"
        card-border-color: "var(--border)"
        card-header-background: "var(--surface-alt)"
        card-footer-background: "var(--surface-alt)"
        card-footer-font-size: "11px"

    # ── Buttons ──
    # Blue primary, compact sizing
    - name: "Buttons"
      vars:
        btn-font-family: "var(--font-sans)"
        btn-font-weight: "500"
        btn-font-size: "13px"
        btn-letter-spacing: "0"
        btn-background: "var(--blue)"
        btn-color: "#ffffff"
        btn-border-color: "transparent"
        btn-hover-background: "#2563EB"
        btn-hover-border-color: "transparent"
        btn-outline-background: "transparent"
        btn-outline-color: "var(--text)"
        btn-outline-hover-background: "var(--surface-alt)"

    # ── Section Chrome ──
    - name: "Section Chrome"
      vars:
        sg-section-title-font-family: "var(--font-sans)"
        sg-section-title-text-transform: "none"
        sg-section-title-letter-spacing: "-0.01em"
        sg-section-title-color: "var(--text)"
        sg-section-number-bg: "var(--blue)"
        sg-section-number-border: "none"
        sg-section-number-color: "#ffffff"
        sg-section-number-radius: "var(--radius-sm)"
        sg-section-desc-font-family: "var(--font-sans)"
        sg-section-desc-color: "var(--text-muted)"
        sg-type-specimen-bg: "var(--surface-alt)"
        sg-type-specimen-border: "1px solid var(--border)"
        sg-type-specimen-border-bottom: "2px solid var(--blue)"
        sg-type-specimen-radius: "var(--radius-md)"
        sg-type-specimen-padding: "var(--space-3)"
        sg-type-specimen-margin: "0 0 var(--space-2) 0"
        sg-type-specimen-name-color: "var(--text)"
        sg-type-specimen-name-font: "var(--font-sans)"
        hr-section-height: "1px"
        hr-section-color: "var(--border)"
        hr-subsection-color: "var(--border)"
        hr-subsection-height: "1px"
        hr-accent-color: "var(--blue)"

    # ── HUI: Focus & Interaction ──
    - name: "HUI: Focus & Interaction"
      vars:
        hui-focus-ring-color: "rgba(59,130,246,0.4)"
        hui-focus-ring-width: "2px"

    # ── HUI: Controls ──
    - name: "HUI: Controls"
      vars:
        hui-control-color: "var(--text)"
        hui-control-bg: "var(--surface)"
        hui-control-border: "var(--gray-300)"
        hui-control-shadow: "none"
        hui-switch-track-on-bg: "var(--blue)"
        hui-switch-track-off-bg: "var(--gray-300)"
        hui-switch-thumb-shadow: "0 1px 2px rgba(0,0,0,0.1)"
        hui-radio-option-border: "var(--border)"
        hui-radio-option-border-active: "var(--blue)"
        hui-radio-option-bg-active: "var(--blue-light)"

    # ── HUI: Trigger Buttons ──
    - name: "HUI: Trigger Buttons"
      vars:
        hui-trigger-bg: "var(--surface)"
        hui-trigger-border: "var(--gray-300)"
        hui-trigger-border-hover: "var(--gray-400)"
        hui-trigger-color: "var(--text)"

    # ── HUI: Overlay Panels ──
    - name: "HUI: Overlay Panels"
      vars:
        hui-panel-bg: "var(--surface)"
        hui-panel-border: "var(--border)"
        hui-panel-shadow: "0 4px 16px rgba(0,0,0,0.12)"
        hui-panel-item-active-bg: "var(--blue-light)"
        hui-panel-item-active-color: "var(--text)"
        hui-panel-sep-color: "var(--border)"

    # ── HUI: Tabs ──
    - name: "HUI: Tabs"
      vars:
        hui-tab-color: "var(--text-muted)"
        hui-tab-color-selected: "var(--text)"
        hui-tab-border-selected: "var(--blue)"
        hui-tab-color-hover: "var(--text-secondary)"
        hui-tab-list-border: "var(--border)"

    # ── HUI: Disclosure ──
    - name: "HUI: Disclosure"
      vars:
        hui-disclosure-bg: "var(--surface-alt)"
        hui-disclosure-bg-hover: "var(--gray-200)"
        hui-disclosure-border: "var(--border)"
        hui-disclosure-color: "var(--text)"
        hui-disclosure-panel-bg: "var(--surface)"
        hui-disclosure-panel-color: "var(--text-secondary)"
        hui-disclosure-chevron-color: "var(--text-muted)"

    # ── HUI: Field Controls ──
    - name: "HUI: Field Controls"
      vars:
        hui-field-bg: "var(--surface)"
        hui-field-border: "var(--gray-300)"
        hui-field-border-hover: "var(--gray-400)"
        hui-field-focus-border: "var(--blue)"
        hui-field-color: "var(--text)"
        hui-field-shadow: "0 1px 2px rgba(0,0,0,0.05)"
        hui-combo-placeholder-color: "var(--text-muted)"
        hui-combo-btn-color: "var(--text-muted)"

    # ── HUI: Dialog ──
    - name: "HUI: Dialog"
      vars:
        hui-dialog-bg: "var(--surface)"
        hui-dialog-shadow: "0 8px 32px rgba(0,0,0,0.16)"
        hui-dialog-title-color: "var(--text)"
        hui-dialog-body-color: "var(--text-secondary)"
        hui-dialog-backdrop: "rgba(15,23,42,0.6)"

    # ── HUI: Showcase Grid ──
    - name: "HUI: Showcase Grid"
      vars:
        hui-showcase-accent: "var(--blue)"
        hui-showcase-bg: "var(--surface-alt)"
        hui-showcase-border: "var(--border)"
        hui-showcase-cell-bg: "var(--surface)"
        hui-showcase-cell-border: "var(--border)"
        hui-showcase-label-color: "var(--text-muted)"

page-layouts:
  - name: dashboard
    title: Dashboard
    description: "Primary app layout — sidebar nav, top bar, dense content area for kanban, timelines, and tables."
    selector: ".content.dashboard"
    vars:
      max-width: "1440px"
      padding: "var(--space-3)"
      margin: "0 auto"
      body-bg: "var(--surface)"
      content-bg: "var(--surface)"
    chrome:
      navbar:
        height: "48px"
        background: "var(--surface-inverse)"
        color: "var(--text-inverse)"
        label: "App Bar"
      sidebar:
        width: "240px"
        background: "var(--surface-alt)"
        color: "var(--text)"
        label: "Sidebar"

  - name: standard
    title: Standard
    description: "Centered content with moderate max-width for settings, profiles, and detail views."
    selector: ".content.standard"
    vars:
      max-width: "1200px"
      padding: "var(--space-4)"
      margin: "0 auto"
      body-bg: "var(--surface)"
      content-bg: "var(--surface-alt)"
    chrome:
      navbar:
        height: "48px"
        background: "var(--surface-inverse)"
        color: "var(--text-inverse)"
        label: "App Bar"
      sidebar:
        width: "240px"
        background: "var(--surface-alt)"
        color: "var(--text)"
        label: "Sidebar"

  - name: article
    title: Article / Wiki
    description: "Constrained-width reading layout for wiki pages, ADRs, and documentation."
    selector: ".content.article"
    vars:
      max-width: "72ch"
      padding: "var(--space-6)"
      margin: "0 auto"
      body-bg: "var(--surface)"
      content-bg: "var(--surface-alt)"
    chrome:
      navbar:
        height: "48px"
        background: "var(--surface-inverse)"
        color: "var(--text-inverse)"
        label: "App Bar"
      sidebar:
        width: "200px"
        background: "var(--surface-alt)"
        color: "var(--text-secondary)"
        label: "TOC"

  - name: focus
    title: Focus Mode
    description: "Distraction-free single-column for deep work — task detail, editor, or writing."
    selector: ".content.focus"
    vars:
      max-width: "960px"
      padding: "var(--space-6)"
      margin: "0 auto"
      body-bg: "var(--surface)"
      content-bg: "var(--surface)"
    chrome:
      navbar:
        height: "48px"
        background: "var(--surface-alt)"
        color: "var(--text)"
        label: "Nav"

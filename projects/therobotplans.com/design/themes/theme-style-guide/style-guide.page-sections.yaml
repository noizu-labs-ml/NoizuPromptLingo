# ═══════════════════════════════════════════════════════════════
# PAGE SECTIONS — tobornalp
# ═══════════════════════════════════════════════════════════════

page-sections:
  - group: Visual Foundation
    desc: "The raw materials — type, color, space, and glyphs that every component is built from."
    sections:
      - id: design-tokens
        title: Design Tokens
        desc: "Full CSS custom property reference — all variables in the system."
      - id: color
        title: Color
        desc: "Brand colors, surfaces, semantic states, and the functional palette."
      - id: typography
        title: Typography
        desc: "Typefaces, sizes, weights, and line heights."
      - id: spacing
        title: "Spacing & Grid"
        desc: "Scale, rhythm, gutters, and whitespace principles."

  - group: Structure
    desc: "How pages and shells are assembled — layouts, archetypes, and navigation patterns."
    sections:
      - id: shell-layouts
        title: Shell Layouts
        desc: "Full-page application shells — navbar, sidebar, content area."
      - id: content-layouts
        title: Content Layouts
        desc: "Content width and spacing presets — standard, wide, narrow, article."
      - id: site-archetypes
        title: Site Archetypes
        desc: "Page-level layout archetypes — dashboard, document, focus mode."
      - id: dividers
        title: "Dividers & Rules"
        desc: "Horizontal and vertical separators — gradient fades, glows, brand accents."
      - id: navigation
        title: Navigation
        desc: "Wayfinding patterns — navbars, sidebars, breadcrumbs, and contextual menus."

  - group: Interaction
    desc: "Semantic states, status signals, and interactive controls."
    sections:
      - id: semantic-classes
        title: Semantic Classes
        desc: "Contextual modifiers — priority, agent status, feedback, and system state."
      - id: ui-elements
        title: UI Elements
        desc: "Cards, buttons, forms, and interactive controls."
      - id: status-indicators
        title: Status Indicators
        desc: "Badges, alerts, toasts, progress, and status signals."
      - id: custom-components
        title: Custom Components
        desc: "Project-specific composite components — agent badges, priority dots, status pills."

  - group: Component Library
    desc: "Browse all exported components grouped by package subpath — primitives, showcases, demos, layout, and more."
    sections:
      - id: component-browser
        title: Component Browser
        desc: "Interactive catalog of all @noizu/styleguide components with live previews and import paths."

  - group: Reference
    desc: "Tokens, generated CSS, YAML config, and live snippets."
    sections:
      - id: generated-css
        title: Generated CSS
        desc: "Output CSS by section — vars, cards, buttons, semantic, utilities."
      - id: theme-config
        title: Theme Config
        desc: "YAML source for this theme."
      - id: snippets
        title: Snippets & Demos
        desc: "CSS and JSX snippets defined in YAML — live previews."
      - id: glyphs
        title: Glyph Language
        desc: "Canonical glyphs for UI controls, navigation, and typography."
      - id: design-sections
        title: Design Principles
        desc: "Core design decisions and rationale."

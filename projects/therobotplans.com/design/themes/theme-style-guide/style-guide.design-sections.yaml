design-sections:
  - name: density
    title: Density & Information Architecture
    description: "How the platform organizes and compresses information for power users."
    icon: "⊞"
    components:
      - name: density-principle
        title: Density Serves Clarity
        principle: "Pack information tight — but structure it so every element has a clear role."
        approach: "14px base font, 12px gutters, 8px spacing unit. Cards, tables, and lists use compact variants by default. Whitespace is earned, not given."
        rationale: "Density without structure is clutter. Density with structure is a cockpit. Users of productivity tools spend hours daily in the interface — wasted space is wasted time."
      - name: command-palette
        title: Command Palette
        principle: "The command palette is the universal entry point — every action in the system reachable in 2 keystrokes."
        approach: "Cmd+K opens a filterable, fuzzy-searchable command list. Recent commands first, then global actions, then contextual. Results ranked by frequency and recency."
        rationale: "Keyboard-first users are our primary audience. The command palette is faster than any menu hierarchy and scales better than toolbars."

  - name: color-system
    title: Functional Color System
    description: "How color encodes meaning across the platform — priority, status, ownership, and state."
    icon: "●"
    components:
      - name: color-principle
        title: Color Is Functional
        principle: "Every color in the interface encodes meaning. If a color doesn't carry information, it shouldn't be there."
        approach: "Priority: P0=red, P1=amber, P2=blue, P3=gray. System state: healthy=emerald, degraded=amber, down=red. Agent: active=emerald, working=violet, idle=gray."
        rationale: "Decorative color competes with functional color for user attention. In a high-density dashboard, that competition causes missed signals."
      - name: agent-identity
        title: Agent Visual Identity
        principle: "AI agents are styled as peer team members — same card structure, same status indicators, same typography as human content."
        approach: "Violet accent marks agent-generated output via left-border stripe or inline badge. No sparkles, no gradients, no 'AI glow'. Agent avatars use hexagon shape to differentiate from human circle avatars."
        rationale: "Agents that look like features get treated like features — optional, ignorable. Agents that look like team members get treated as team members — accountable, reliable."

  - name: dark-mode
    title: Dark Mode First
    description: "Design philosophy for the platform's primary color mode."
    icon: "◐"
    components:
      - name: dark-principle
        title: Dark Mode Is Primary
        principle: "Power users live in dark mode. Design dark first, validate light second."
        approach: "Deep slate (#0F172A) base, not pure black. Lifted surfaces (#1E293B) create depth via luminance, not borders. Accent colors brighten via color-mix for dark-background contrast. Light mode is a real alternative — inverted surfaces, adjusted contrast, darkened accents."
        rationale: "Pure black creates harsh contrast with text and colored elements. Slate-tinted darks are easier on the eyes during extended sessions and produce subtler elevation hierarchies."

  - name: keyboard-interaction
    title: Keyboard-First Interaction
    description: "Interaction model designed for power users who live on the keyboard."
    icon: "⌘"
    components:
      - name: keyboard-principle
        title: Every Action by Keyboard
        principle: "Every action reachable by keyboard. Mouse is the fallback, not the primary input."
        approach: "Global shortcuts (Cmd+K command palette, Cmd+/ help). Contextual shortcuts (j/k navigation, Enter to open, Escape to dismiss). Vim-style navigation in lists and tables. Focus management follows logical tab order."
        rationale: "Mouse interaction interrupts flow. Keyboard interaction maintains it. For users managing 50+ tasks daily, the efficiency gap compounds."

  - name: status-indicators
    title: Status Indicators
    description: "Badges, alerts, toasts, progress bars, and system status signals."
    icon: "◉"
    components:
      - name: badges
        title: Status Badges
        principle: "Compact, color-coded labels for priority, agent status, and system state."
        approach: "Semantic class system: danger/success/warning/info for feedback, priority-critical/high/medium/low for task priority, agent-active/working/idle for AI status, state-healthy/degraded/down for systems."
        rationale: "Badges are the primary visual language for status. They must be instantly scannable at small sizes in dense layouts."
      - name: alerts
        title: Inline Alerts
        principle: "Contextual messages that appear inline with content, not as modal interruptions."
        approach: "Accent-bar left or bottom with semantic background tint. Icon + message + optional action. Dismissible but not auto-dismissing for error states."
        rationale: "Modal alerts break flow. Inline alerts inform without interrupting."
      - name: toasts
        title: Toast Notifications
        principle: "Ephemeral feedback for completed actions — confirm, then disappear."
        approach: "Top-right position, 8s duration, stacked with 16px gap. Success states are quiet (checkmark + text). Error states persist until dismissed."
        rationale: "Toasts confirm that an action worked without requiring the user to look for confirmation."
      - name: progress
        title: Progress Indicators
        principle: "Visible progress for any operation longer than 500ms."
        approach: "Linear progress bar for determinate operations, spinner for indeterminate. Step progress for multi-phase workflows. Always show percentage or step count."
        rationale: "Invisible progress creates anxiety. Visible progress creates trust."

  - name: custom-components
    title: Custom Components
    description: "Project-specific composite components built from the design system. The Badge is the T0 foundational atomic — 9 components depend on it, 11 screens reference it."
    icon: "⬢"
    components:
      - name: badge
        title: Badge
        principle: "One component, every status context. The Badge is a semantic class consumer — apply .badge for the shell, add a semantic class for the color."
        approach: "Base .badge provides structure: inline-flex, monospace font, compact padding (1px 8px), xs font size. Semantic classes (danger, success, priority-critical, agent-working, state-healthy, etc.) inject --accent, --background, --color via CSS custom properties. Variants: .badge-dot (prepend colored dot), .badge-pill (fully rounded), .badge-solid (filled), .badge-outline (border only), .badge-sm/.badge-lg (size), .badge-agent (agent-specific styling)."
        rationale: "The existing agent-badge, priority-dot, and status-pill snippets were three separate components doing variations of the same thing. A unified Badge with modifiers is more composable, more maintainable, and produces consistent visual weight across all status contexts. Usage: <span class='badge danger'>P0</span>, <span class='badge badge-dot agent-working'>PM Agent</span>, <span class='badge badge-pill state-healthy'>healthy</span>."
      - name: badge-priority
        title: "Badge: Priority Variants"
        principle: "Priority levels are color-coded badges with optional dot indicators."
        approach: "P0=danger (red), P1=priority-high (amber), P2=priority-medium (blue), P3=priority-low (gray). Add .badge-dot for the status dot prefix. The dot color inherits from the semantic class --accent. In dense lists, use .badge-sm for tighter spacing."
        rationale: "Priority is the most frequently scanned property in a task list. Badges must be distinguishable at a glance in a dense kanban column — color is the primary signal, text is the confirmation."
      - name: badge-agent
        title: "Badge: Agent Status"
        principle: "Agent status badges identify which agents are online, working, or idle."
        approach: "agent-active (emerald), agent-working (violet), agent-idle (gray). Add .badge-agent for monospace letter-spacing. Add .badge-dot for the status dot. In team views, badges appear next to agent avatars (hexagon shape) to show current state."
        rationale: "Agents are team members. Their status must be as visible as a human's online/offline indicator. The violet accent for 'working' distinguishes agent activity from human activity at a glance."
      - name: badge-system
        title: "Badge: System State"
        principle: "System health badges for monitoring dashboards and status pages."
        approach: "state-healthy (emerald), state-degraded (amber), state-down (red). Use .badge-dot for the classic status dot pattern. In monitoring dashboards, badges appear in service lists and status grids."
        rationale: "System state is binary-ish: green/amber/red. The badge provides consistent encoding whether it appears in a sidebar, a table cell, or a status page."

  - name: forms
    title: Form Controls
    description: "Input fields, selectors, validation, and form layout patterns."
    icon: "☐"
    components:
      - name: inputs
        title: Input Fields
        principle: "Dense but readable inputs — every field earns its space."
        approach: "32px height for standard inputs (matches 14px base + padding). Monospace for code/data inputs. Inline validation with semantic color. Labels above, not inline (prevents layout shift)."
        rationale: "Compact inputs enable dense forms without sacrificing usability. Label placement above is more scannable than inline for form-heavy workflows."
      - name: selectors
        title: Selectors & Dropdowns
        principle: "Keyboard-navigable selectors with search for long lists."
        approach: "HeadlessUI Listbox for short lists, Combobox with search for 10+ items. Multi-select via checkboxes in dropdown. Selected values shown as compact pills."
        rationale: "Power users manage hundreds of items. Scrolling through unsearchable dropdowns doesn't scale."

# ═══════════════════════════════════════════════════════════════
# COLOR MODES — tobornalp
# ═══════════════════════════════════════════════════════════════
#
# Dark mode is the primary mode for this product — power users
# live in dark mode. Light mode is a real alternative, not an
# afterthought: inverted surfaces, adjusted contrast, darkened
# accents for legibility on light backgrounds.
# ═══════════════════════════════════════════════════════════════

color-modes:
  # ── Light mode ─────────────────────────────────────────────
  # Slate-tinted whites, cool gray hierarchy. Blue accents
  # darken slightly for WCAG contrast on light backgrounds.
  light:
    surface: "#FFFFFF"
    surface-alt: "#F8FAFC"
    surface-inverse: "#0F172A"
    surface-accent: "rgba(59,130,246,0.06)"
    surface-warning: "rgba(245,158,11,0.08)"
    surface-danger: "rgba(239,68,68,0.08)"
    surface-success: "rgba(16,185,129,0.08)"
    text: "#0F172A"
    text-secondary: "#475569"
    text-muted: "#94A3B8"
    text-inverse: "#F8FAFC"
    text-link: "#2563EB"
    border: "#E2E8F0"
    border-strong: "#CBD5E1"
    border-accent: "#3B82F6"
    shadow-color: "rgba(15,23,42,0.06)"
    focus-ring: "rgba(59,130,246,0.4)"

  # ── Dark mode ──────────────────────────────────────────────
  # Deep slate ground, soft gray type, muted borders.
  # Accent colors brighten slightly for dark-background contrast.
  # Lifted surfaces create depth without hard borders.
  dark:
    surface: "#0F172A"
    surface-alt: "#1E293B"
    surface-inverse: "#F1F5F9"
    surface-accent: "rgba(59,130,246,0.12)"
    surface-warning: "rgba(245,158,11,0.12)"
    surface-danger: "rgba(239,68,68,0.12)"
    surface-success: "rgba(16,185,129,0.12)"
    text: "#E2E8F0"
    text-secondary: "#94A3B8"
    text-muted: "#64748B"
    text-inverse: "#0F172A"
    text-link: "#60A5FA"
    border: "#334155"
    border-strong: "#475569"
    border-accent: "#60A5FA"
    shadow-color: "rgba(0,0,0,0.3)"
    focus-ring: "rgba(96,165,250,0.4)"

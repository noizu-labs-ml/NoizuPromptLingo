name: "tobornalp"
logo-text: "TOBORNALP"

font-url: "https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..700;1,14..32,400&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap"

logo-style:
  font: "var(--font-sans)"
  color: "var(--text)"
  html: '<div style="display:inline-flex;align-items:center;gap:8px"><svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="2" width="24" height="24" rx="4" stroke="var(--blue)" stroke-width="1.5"/><rect x="6" y="6" width="7" height="7" rx="1" fill="var(--blue)" opacity="0.7"/><rect x="15" y="6" width="7" height="7" rx="1" fill="var(--violet)" opacity="0.7"/><rect x="6" y="15" width="7" height="7" rx="1" fill="var(--emerald)" opacity="0.7"/><rect x="15" y="15" width="7" height="7" rx="1" fill="var(--blue)" opacity="0.4"/></svg><span style="font-family:var(--font-mono);font-size:17px;font-weight:500;letter-spacing:0.02em;line-height:1;color:currentColor">tobornalp</span></div>'

intent: "Cryptic minimalism. The name is a puzzle — an anagram of 'robotplan' — and the interface reflects that energy: information surfaces through structure, not decoration. The design language draws from terminal UIs, dense dashboards, and cipher aesthetics. Every pixel encodes meaning. Color is a signal, not an ornament."

perception: "Quietly powerful. The kind of tool that rewards curiosity — simple on the surface, deep underneath. Like finding the pattern in the anagram."

audience: "Solo developers, indie hackers, and small engineering teams who manage their entire operational life — personal todos, team projects, CI/CD pipelines, monitoring, and OKRs — in one surface. They value density over whitespace, keyboard shortcuts over mouse targets, and AI agents that work alongside them as real team members."

tone: "Terse and precise. Lowercase by default. No exclamation marks. Error messages read like log entries. Success is silence. The interface speaks in the register of someone who respects your attention."

keywords:
  - cryptic
  - dense
  - operational
  - puzzle
  - systematic
  - agent-native
  - quiet


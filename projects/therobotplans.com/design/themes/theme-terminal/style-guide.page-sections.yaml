page-sections:
  - group: Reference
    desc: "Tokens, generated CSS, YAML config — the system internals."
    sections:
      - id: design-tokens
        title: Design Tokens
        desc: "All CSS custom properties in the terminal theme."
      - id: generated-css
        title: Generated CSS
        desc: "Output CSS by section."
      - id: theme-config
        title: Theme Config
        desc: "YAML source for this theme."
      - id: snippets
        title: Snippets & Demos
        desc: "CSS snippets — prompts, status prefixes, agent output."
      - id: overrides
        title: Overrides
        desc: "Per-section variant selection."

  - group: Visual Foundation
    desc: "Monospace type, terminal colors, tight spacing, ASCII glyphs."
    sections:
      - id: typography
        title: Typography
        desc: "Source Code Pro — one typeface, many weights."
      - id: color
        title: Color
        desc: "Terminal palette — green/amber/red/blue on dark or light."
      - id: spacing
        title: "Spacing & Grid"
        desc: "4px unit, minimal padding, maximum density."
      - id: dividers
        title: "Dividers"
        desc: "1px solid lines. That's it."
      - id: glyphs
        title: Glyph Language
        desc: "ASCII-first symbol system."

  - group: Structure
    desc: "Terminal shells — tmux splits, vim layouts, htop dashboards."
    sections:
      - id: shell-layouts
        title: Shell Layouts
        desc: "Terminal, split-pane, editor, dashboard shells."
      - id: content-layouts
        title: Content Layouts
        desc: "Standard, wide, narrow (80ch), article."
      - id: site-archetypes
        title: Site Archetypes
        desc: "Dashboard, document, search-first patterns."
      - id: navigation
        title: Navigation
        desc: "Command palette, keyboard nav, breadcrumbs."

  - group: Interaction
    desc: "[OK], [WARN], [ERR] — status through text, not badges."
    sections:
      - id: semantic-classes
        title: Semantic Classes
        desc: "Terminal-style status and workflow classes."
      - id: status-indicators
        title: Status Indicators
        desc: "Text prefixes, colored dots, progress bars."
      - id: ui-elements
        title: UI Elements
        desc: "Cards, buttons, forms — all square, all mono."
      - id: custom-components
        title: Custom Components
        desc: "Terminal prompts, agent output blocks, status lines."
      - id: tailwind-plus
        title: Tailwind Plus
        desc: "Tailwind Plus components with terminal tokens."

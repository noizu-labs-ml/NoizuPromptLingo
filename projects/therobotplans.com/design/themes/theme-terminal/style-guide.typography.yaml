typography:
  - var: font-sans
    name: Source Code Pro
    description: "Primary and only typeface. Everything is monospace. Source Code Pro has excellent weight range and readability at small sizes."
    usage: "All text — headings, body, labels, code, data. There is no sans-serif."
    weights: [300, 400, 500, 600, 700]

  - var: font-mono
    name: Source Code Pro
    description: "Same typeface as sans — in terminal theme, there is no distinction."
    usage: "Same as font-sans. Both resolve to Source Code Pro."
    weights: [300, 400, 500, 600, 700]

typography-classes:
  - name: Display
    class: typography-display
    font-family: "var(--font-mono)"
    font-size: "var(--font-size-display)"
    font-weight: "700"
    line-height: "1.2"
    letter-spacing: "0.02em"
    text-transform: "uppercase"

  - name: H1
    class: typography-h1
    font-family: "var(--font-mono)"
    font-size: "var(--font-size-3xl)"
    font-weight: "700"
    line-height: "1.2"
    letter-spacing: "0.02em"

  - name: H2
    class: typography-h2
    font-family: "var(--font-mono)"
    font-size: "var(--font-size-2xl)"
    font-weight: "600"
    line-height: "1.3"
    letter-spacing: "0.01em"

  - name: H3
    class: typography-h3
    font-family: "var(--font-mono)"
    font-size: "var(--font-size-xl)"
    font-weight: "600"
    line-height: "1.3"

  - name: H4
    class: typography-h4
    font-family: "var(--font-mono)"
    font-size: "var(--font-size-lg)"
    font-weight: "600"
    line-height: "1.4"

  - name: Body
    class: typography-body
    font-family: "var(--font-mono)"
    font-size: "var(--font-size-md)"
    font-weight: "400"
    line-height: "1.5"

  - name: Small
    class: typography-small
    font-family: "var(--font-mono)"
    font-size: "var(--font-size-sm)"
    font-weight: "400"
    line-height: "1.5"

  - name: Label
    class: typography-label
    font-family: "var(--font-mono)"
    font-size: "var(--font-size-xs)"
    font-weight: "600"
    line-height: "1.4"
    letter-spacing: "0.06em"
    text-transform: "uppercase"

  - name: Code
    class: typography-code
    font-family: "var(--font-mono)"
    font-size: "var(--font-size-md)"
    font-weight: "400"
    line-height: "1.5"

  - name: Caption
    class: typography-caption
    font-family: "var(--font-mono)"
    font-size: "var(--font-size-xs)"
    font-weight: "400"
    line-height: "1.4"
    color: "var(--text-muted)"

  - name: Prompt
    class: typography-prompt
    font-family: "var(--font-mono)"
    font-size: "var(--font-size-sm)"
    font-weight: "600"
    line-height: "1.4"
    color: "var(--emerald)"

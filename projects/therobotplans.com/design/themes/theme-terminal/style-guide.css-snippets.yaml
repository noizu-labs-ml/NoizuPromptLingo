css-snippets:
  - name: Terminal Prompt
    slug: terminal-prompt
    title: "Command prompt prefix"
    description: "Green $ prompt for terminal-style UI elements."
    target-section: ui-elements
    body: |
      html[data-design-theme="terminal"] .prompt::before {
        content: "$ ";
        color: var(--emerald);
        font-weight: 600;
      }

  - name: Status Prefix
    slug: status-prefix
    title: "Log-level status prefixes"
    description: "[OK], [WARN], [ERR], [INFO] colored prefixes for terminal-style status."
    target-section: ui-elements
    body: |
      html[data-design-theme="terminal"] .status-ok::before { content: "[OK] "; color: var(--success); font-weight: 600; }
      html[data-design-theme="terminal"] .status-warn::before { content: "[WARN] "; color: var(--warning); font-weight: 600; }
      html[data-design-theme="terminal"] .status-err::before { content: "[ERR] "; color: var(--error); font-weight: 600; }
      html[data-design-theme="terminal"] .status-info::before { content: "[INFO] "; color: var(--info); font-weight: 600; }

  - name: Agent Output
    slug: agent-output
    title: "Agent output block"
    description: "Styled block for AI agent terminal output."
    target-section: ui-elements
    body: |
      html[data-design-theme="terminal"] .agent-output {
        border-left: 2px solid var(--violet);
        padding-left: var(--space-2);
        font-family: var(--font-mono);
        font-size: var(--font-size-sm);
        color: var(--text-secondary);
      }
      html[data-design-theme="terminal"] .agent-output::before {
        content: "agent> ";
        color: var(--violet);
        font-weight: 600;
      }

  - name: Cursor Blink
    slug: cursor-blink
    title: "Blinking cursor animation"
    description: "CSS animation for terminal cursor effect."
    target-section: ui-elements
    body: |
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      html[data-design-theme="terminal"] .cursor {
        display: inline-block;
        width: 0.6em;
        height: 1.1em;
        background: var(--emerald);
        animation: blink 1.2s step-end infinite;
        vertical-align: text-bottom;
      }

  - name: Compact Table
    slug: compact-table
    title: "Dense monospace table"
    description: "Terminal-style data table with monospace alignment."
    target-section: ui-elements
    body: |
      html[data-design-theme="terminal"] .table-compact {
        width: 100%;
        border-collapse: collapse;
        font-family: var(--font-mono);
        font-size: var(--font-size-sm);
      }
      html[data-design-theme="terminal"] .table-compact th {
        text-align: left;
        font-weight: 600;
        color: var(--text-muted);
        font-size: var(--font-size-xs);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        padding: var(--space-1) var(--space-2);
        border-bottom: 1px solid var(--border);
      }
      html[data-design-theme="terminal"] .table-compact td {
        padding: var(--space-1) var(--space-2);
        border-bottom: 1px solid var(--border);
        color: var(--text);
      }

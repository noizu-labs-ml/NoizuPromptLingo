spacing-contexts:
  grid:
    columns: 12
    gutter-token: col-gap
    margin-token: space-3

  page-container:
    max-width: "1600px"
    padding-x-token: space-3
    padding-y-token: space-2

  section-spacing:
    - role: "Major section gap"
      token: space-6
    - role: "Subsection gap"
      token: space-3
    - role: "Component gap"
      token: space-2
    - role: "Element gap"
      token: space-1

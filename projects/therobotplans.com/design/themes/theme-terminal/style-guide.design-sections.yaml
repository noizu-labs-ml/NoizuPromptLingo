design-sections:
  - name: terminal-aesthetic
    title: Terminal Aesthetic
    description: "Everything reads like console output — monospace, square, no embellishment."
    icon: "$"
    components:
      - name: monospace-only
        title: Monospace Everywhere
        principle: "One typeface. No sans-serif, no serif. Source Code Pro for everything."
        approach: "font-sans and font-mono both resolve to Source Code Pro. Headings differentiate by weight and size, not by font family. All text aligns to monospace grid."
        rationale: "Mixing typefaces in a terminal theme breaks the illusion. Monospace-only creates visual consistency that reads as 'this is a tool, not a website.'"
      - name: zero-radius
        title: Zero Radius
        principle: "Square corners everywhere. radius: 0px. No exceptions."
        approach: "All border-radius tokens set to 0. Buttons, cards, inputs, panels — all square. Differentiation comes from border weight and color, not from shape."
        rationale: "Rounded corners signal 'friendly consumer product.' Square corners signal 'this is a machine interface.' The terminal theme is the latter."

  - name: status-system
    title: Status Through Text
    description: "Status communicated through colored text prefixes, not visual badges."
    icon: "●"
    components:
      - name: text-prefixes
        title: "[OK] / [WARN] / [ERR] Prefixes"
        principle: "Status is a text prefix, not a colored badge or icon."
        approach: "CSS ::before pseudo-elements inject colored prefix text. Green for [OK], amber for [WARN], red for [ERR], blue for [INFO]. Monospace alignment keeps columns clean."
        rationale: "Terminal users read status from text color and position, not from shapes. Text prefixes are scannable in the same way grep output is scannable."
      - name: agent-output
        title: "agent> Prefix"
        principle: "Agent output is marked with a violet left-border and 'agent>' prefix."
        approach: "2px left border in violet. ::before content injects 'agent> ' in violet. Reads like a different process writing to the same terminal."
        rationale: "In a terminal, you distinguish processes by their prompt character. The agent gets its own prompt."

  - name: density-model
    title: Maximum Density
    description: "4px base unit, 13px font, no wasted space."
    icon: "⊞"
    components:
      - name: four-px-unit
        title: "4px Base Unit"
        principle: "The tightest spacing unit in the system. Every gap, every padding, every margin is a multiple of 4px."
        approach: "space-1: 4px, space-2: 8px, space-3: 12px. No padding exceeds space-4 (16px) on inline elements. Section gaps max at space-6 (24px)."
        rationale: "Terminal users work with 80x24 character grids. Space is measured in characters, not in 'breathing room.' 4px unit matches that mental model."

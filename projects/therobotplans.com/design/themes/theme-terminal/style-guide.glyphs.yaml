glyph-language:
  description: >
    Terminal-native glyph language. ASCII-first where possible — Unicode only when
    ASCII has no equivalent. Every glyph must render correctly in monospace at 12px.

  principles:
    - rule: "ASCII over Unicode when equivalent."
      detail: "Use > not →, use x not ✕, use * not ●. ASCII renders identically across every terminal."
    - rule: "Monospace alignment matters."
      detail: "Every glyph must be exactly one character cell wide. Double-width Unicode breaks column alignment."
    - rule: "Color is the primary differentiator."
      detail: "Glyphs carry structural meaning, color carries semantic meaning. A green * and a red * are different."
    - rule: "Test in a terminal first."
      detail: "If it looks wrong in iTerm2, it's wrong everywhere."

  sections:
    - name: status
      title: "Status & Signals"
      description: >
        Process state and health indicators. These are the most frequently
        rendered glyphs — they must be instantly parseable at monospace 12px.
      glyphs:
        - glyph: "*"
          name: "Bullet / Active"
          code: "U+002A"
          use: "Active status, list marker"
          example: "* running"
        - glyph: "-"
          name: "Dash / Inactive"
          code: "U+002D"
          use: "Inactive, idle, stopped"
          example: "- stopped"
        - glyph: "+"
          name: "Plus / Added"
          code: "U+002B"
          use: "Added, new, created"
          example: "+ new task"
        - glyph: "x"
          name: "Cross / Failed"
          code: "U+0078"
          use: "Failed, error, rejected"
          example: "x build failed"
        - glyph: "!"
          name: "Bang / Warning"
          code: "U+0021"
          use: "Warning, attention, non-fatal"
          example: "! deprecated"
        - glyph: ">"
          name: "Arrow / Running"
          code: "U+003E"
          use: "In progress, running process"
          example: "> deploying..."
        - glyph: "#"
          name: "Hash / Reference"
          code: "U+0023"
          use: "Issue number, commit hash"
          example: "#847"
        - glyph: "~"
          name: "Tilde / Approximate"
          code: "U+007E"
          use: "Approximate, draft, wip"
          example: "~ draft"

    - name: navigation
      title: "Navigation & Flow"
      description: >
        Directional indicators and command structure characters.
      glyphs:
        - glyph: "$"
          name: "Dollar / Prompt"
          code: "U+0024"
          use: "Command prompt, user input marker"
          example: "$ tobornalp status"
        - glyph: ">"
          name: "Greater / Forward"
          code: "U+003E"
          use: "Navigate forward, drill down, breadcrumb"
          example: "home > projects > api"
        - glyph: "<"
          name: "Less / Back"
          code: "U+003C"
          use: "Navigate back"
          example: "< back"
        - glyph: "|"
          name: "Pipe"
          code: "U+007C"
          use: "Separator, data flow, pipe between views"
          example: "tasks | kanban | timeline"
        - glyph: "/"
          name: "Slash / Search"
          code: "U+002F"
          use: "Search, command palette trigger"
          example: "/ search"
        - glyph: ":"
          name: "Colon / Command"
          code: "U+003A"
          use: "Vim-style command prefix"
          example: ":wq"

    - name: agents
      title: "Agent Identity"
      description: >
        Markers for AI agent presence in terminal output.
      glyphs:
        - glyph: "@"
          name: "At / Agent"
          code: "U+0040"
          use: "Agent mention, agent identity"
          example: "@pm-agent"
        - glyph: "⚡"
          name: "Lightning / Auto"
          code: "U+26A1"
          use: "Automated action (only Unicode exception)"
          example: "⚡ auto-triaged"
        - glyph: "%"
          name: "Percent / Progress"
          code: "U+0025"
          use: "Completion percentage, progress"
          example: "73% complete"

shell-layouts:
  - name: terminal
    title: Terminal
    description: "Pure terminal — status bar top, output area, command line bottom."
    chrome:
      navbar:
        height: "32px"
        background: "var(--gray-700)"
        color: "var(--text)"
        label: "status"
      footer:
        height: "28px"
        background: "var(--gray-800)"
        color: "var(--emerald)"
        label: "$ _"
    zones:
      - label: "stdout"
        background: "var(--surface)"
        ratio: 1

  - name: split
    title: Split Pane
    description: "tmux-style split — two vertical panes with a divider."
    chrome:
      navbar:
        height: "32px"
        background: "var(--gray-700)"
        color: "var(--text)"
        label: "status"
    zones:
      - label: "pane 0"
        background: "var(--surface)"
        ratio: 1
      - label: "pane 1"
        background: "var(--surface-alt)"
        ratio: 1

  - name: editor
    title: Editor
    description: "Vim-style — file tree left, editor center, output bottom."
    chrome:
      navbar:
        height: "28px"
        background: "var(--gray-800)"
        color: "var(--text-muted)"
        label: "buffers"
      sidebar:
        width: "200px"
        background: "var(--gray-800)"
        color: "var(--text-secondary)"
        label: "netrw"
      footer:
        height: "24px"
        background: "var(--gray-700)"
        color: "var(--text)"
        label: "-- INSERT --"
    zones:
      - label: "editor"
        background: "var(--surface)"
        ratio: 3
      - label: "output"
        background: "var(--gray-800)"
        color: "var(--text-secondary)"
        ratio: 1

  - name: dashboard
    title: Dashboard
    description: "htop-style — stacked horizontal panes for monitoring."
    chrome:
      navbar:
        height: "28px"
        background: "var(--gray-700)"
        color: "var(--emerald)"
        label: "tobornalp"
    zones:
      - label: "metrics"
        background: "var(--surface)"
        ratio: 1
      - label: "processes"
        background: "var(--surface-alt)"
        ratio: 2
      - label: "log"
        background: "var(--surface)"
        ratio: 1

semantic-classes:
  - name: danger
    class: danger
    group: States
    title: "[ERR]"
    description: "Process failure, fatal error, exit code non-zero."
    note: "stderr output, critical failures, destructive actions"
    accent-style: bottom-bar
    vars:
      accent: "var(--error)"
      background: "var(--error-tint)"
      color: "var(--error)"
      font-weight: "600"

  - name: warning
    class: warning
    group: States
    title: "[WARN]"
    description: "Non-fatal warning, attention needed."
    note: "Deprecation notices, approaching limits, retry situations"
    accent-style: bottom-bar
    vars:
      accent: "var(--warning)"
      background: "var(--warning-tint)"
      color: "var(--warning)"

  - name: info
    class: info
    group: States
    title: "[INFO]"
    description: "Informational output, guidance."
    note: "Status updates, progress reports, metadata"
    accent-style: bottom-bar
    vars:
      accent: "var(--info)"
      background: "var(--info-tint)"
      color: "var(--info)"

  - name: success
    class: success
    group: States
    title: "[OK]"
    description: "Process completed successfully, exit 0."
    note: "Passed tests, deployed services, completed tasks"
    accent-style: bottom-bar
    vars:
      accent: "var(--success)"
      background: "var(--success-tint)"
      color: "var(--success)"

  - name: primary
    class: primary
    group: Actions
    title: "exec"
    description: "Primary command — the main action."
    note: "Submit buttons, primary CTAs, execute commands"
    accent-style: bottom-bar
    vars:
      accent: "var(--emerald)"
      background: "var(--emerald-light)"
      color: "var(--emerald)"

  - name: secondary
    class: secondary
    group: Actions
    title: "flag"
    description: "Secondary option — supporting action."
    note: "Cancel, back, secondary buttons"
    accent-style: none
    vars:
      accent: "var(--gray-400)"
      background: "var(--surface-alt)"
      color: "var(--text-secondary)"

  - name: link
    class: link
    group: Actions
    title: "ref"
    description: "Navigation reference — linked content."
    note: "Clickable cards, navigation, cross-references"
    accent-style: bottom-bar
    vars:
      accent: "var(--blue)"
      background: "var(--blue-light)"
      color: "var(--blue)"

  - name: aside
    class: aside
    group: Content
    title: "comment"
    description: "Supplementary context — like a code comment."
    note: "Side notes, annotations, supplementary information"
    accent-style: left-border
    vars:
      accent: "var(--cyan)"
      background: "var(--cyan-light)"
      color: "var(--cyan)"

  - name: muted
    class: muted
    group: Content
    title: "stdout"
    description: "De-emphasized output — background noise."
    note: "Verbose output, low-priority content"
    accent-style: none
    vars:
      accent: "var(--gray-400)"
      background: "var(--surface-alt)"
      color: "var(--text-muted)"

  - name: brand
    class: brand
    group: Content
    title: "agent"
    description: "Agent-generated content marker."
    note: "AI agent output, automated actions"
    accent-style: bottom-bar
    vars:
      accent: "var(--violet)"
      background: "var(--violet-light)"
      color: "var(--violet)"

  - name: pending
    class: pending
    group: Workflow
    title: "queued"
    description: "In queue, waiting for execution."
    note: "Pending tasks, queued builds, waiting for input"
    accent-style: bottom-bar
    vars:
      accent: "var(--amber)"
      background: "var(--amber-light)"
      color: "var(--amber)"

  - name: draft
    class: draft
    group: Workflow
    title: "wip"
    description: "Work in progress — not yet committed."
    note: "Draft documents, uncommitted changes, in-progress items"
    accent-style: left-dashed
    vars:
      accent: "var(--violet)"
      background: "var(--violet-light)"
      color: "var(--violet)"

  - name: published
    class: published
    group: Workflow
    title: "shipped"
    description: "Deployed, live, done."
    note: "Deployed services, merged PRs, completed milestones"
    accent-style: bottom-bar
    vars:
      accent: "var(--emerald)"
      background: "var(--emerald-light)"
      color: "var(--emerald)"

  - name: disabled
    class: disabled
    group: Workflow
    title: "noop"
    description: "Inactive, no operation."
    note: "Disabled features, inactive agents, unavailable commands"
    accent-style: none
    vars:
      accent: "var(--border-strong)"
      background: "var(--surface-alt)"
      color: "var(--text-muted)"

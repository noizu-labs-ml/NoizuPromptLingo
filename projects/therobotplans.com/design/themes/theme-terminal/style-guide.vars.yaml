# ═══════════════════════════════════════════════════════════════
# THEME DESIGN TOKENS — tobornalp terminal
# ═══════════════════════════════════════════════════════════════
#
# Everything monospace. No radius. No shadows. 4px unit.
# Terminal green for success/active, amber for warnings,
# red for errors. GitHub-dark neutrals.
# ═══════════════════════════════════════════════════════════════

vars:
  groups:
    - name: "Seeds"
      vars:
        white: "#F0F6FC"
        black: "#0D1117"
        red: "#F85149"
        blue: "#58A6FF"
        yellow: "#D29922"
        font-sans: "'Source Code Pro', 'Fira Code', 'JetBrains Mono', monospace"
        font-mono: "'Source Code Pro', 'Fira Code', 'JetBrains Mono', monospace"
        radius: "0px"
        unit: "4px"

    - name: "Neutrals"
      vars:
        gray-50: "#F0F6FC"
        gray-100: "#C9D1D9"
        gray-200: "#B1BAC4"
        gray-300: "#8B949E"
        gray-400: "#6E7681"
        gray-500: "#484F58"
        gray-600: "#30363D"
        gray-700: "#21262D"
        gray-800: "#161B22"
        gray-900: "#0D1117"

    - name: "Accent Primaries"
      vars:
        red-light: "rgba(248,81,73,0.10)"
        red-mid: "rgba(248,81,73,0.20)"
        blue-light: "rgba(88,166,255,0.10)"
        blue-mid: "rgba(88,166,255,0.20)"
        yellow-light: "rgba(210,153,34,0.10)"
        yellow-mid: "rgba(210,153,34,0.20)"

    - name: "Semantic"
      vars:
        success: "#3FB950"
        success-tint: "rgba(63,185,80,0.10)"
        warning: "#D29922"
        warning-tint: "rgba(210,153,34,0.10)"
        error: "#F85149"
        error-tint: "rgba(248,81,73,0.10)"
        info: "#58A6FF"
        info-tint: "rgba(88,166,255,0.10)"

    - name: "Extended Palette"
      vars:
        violet: "#BC8CFF"
        violet-light: "rgba(188,140,255,0.10)"
        violet-mid: "rgba(188,140,255,0.20)"
        emerald: "#3FB950"
        emerald-light: "rgba(63,185,80,0.10)"
        cyan: "#39D2C0"
        cyan-light: "rgba(57,210,192,0.10)"
        rose: "#FF7B72"
        rose-light: "rgba(255,123,114,0.10)"
        amber: "#D29922"
        amber-light: "rgba(210,153,34,0.10)"
        indigo: "#79C0FF"
        indigo-light: "rgba(121,192,255,0.10)"
        teal: "#39D2C0"
        teal-light: "rgba(57,210,192,0.10)"
        orange: "#F0883E"
        orange-light: "rgba(240,136,62,0.10)"
        sky: "#79C0FF"
        sky-light: "rgba(121,192,255,0.10)"
        lime: "#7EE787"
        lime-light: "rgba(126,231,135,0.10)"
        pink: "#FF7B72"
        pink-light: "rgba(255,123,114,0.10)"
        fuchsia: "#D2A8FF"
        fuchsia-light: "rgba(210,168,255,0.10)"
        purple: "#D2A8FF"
        purple-light: "rgba(210,168,255,0.10)"

    - name: "Typography"
      vars:
        font-display: "'Source Code Pro', monospace"
        font-body: "'Source Code Pro', monospace"
        size-xs: "11px"
        size-sm: "12px"
        size-md: "13px"
        size-lg: "14px"
        size-xl: "16px"
        font-size-2xs: "10px"
        font-size-xs: "var(--size-xs)"
        font-size-sm: "var(--size-sm)"
        font-size-md: "var(--size-md)"
        font-size-lg: "var(--size-lg)"
        font-size-xl: "var(--size-xl)"
        font-size-2xl: "20px"
        font-size-3xl: "24px"
        font-size-display: "28px"
        font-size-base: "var(--size-md)"

    - name: "Spacing"
      vars:
        space-quarter: "1px"
        space-half: "2px"
        space-1: "4px"
        space-2: "8px"
        space-3: "12px"
        space-4: "16px"
        space-5: "20px"
        space-6: "24px"
        space-8: "32px"
        space-10: "40px"
        space-12: "48px"
        col-gap: "8px"

    - name: "Radius"
      vars:
        radius-sm: "0px"
        radius-md: "0px"
        radius-lg: "0px"

    - name: "Base"
      vars:
        base-font-size: "13px"
        base-line-height: "1.5"
        base-font-family: "var(--font-mono)"
        base-font-color: "var(--text, var(--black))"
        base-background: "var(--surface, var(--white))"
        bg: "var(--surface, var(--white))"

    - name: "Branding"
      vars:
        branding-logo-font-size: "16px"
        branding-logo-font-weight: "600"
        branding-logo-letter-spacing: "0.04em"
        branding-logo-text-transform: "none"
        branding-logo-bg: "var(--surface)"
        branding-border: "1px solid var(--border)"

    - name: "Cards"
      vars:
        card-accent-side: "left"
        card-background: "var(--surface)"
        card-border-color: "var(--border)"
        card-header-background: "var(--surface-alt)"
        card-footer-background: "var(--surface-alt)"
        card-footer-font-size: "11px"

    - name: "Buttons"
      vars:
        btn-font-family: "var(--font-mono)"
        btn-font-weight: "600"
        btn-font-size: "12px"
        btn-letter-spacing: "0.04em"
        btn-background: "var(--emerald)"
        btn-color: "var(--black)"
        btn-border-color: "transparent"
        btn-hover-background: "#2EA043"
        btn-hover-border-color: "transparent"
        btn-outline-background: "transparent"
        btn-outline-color: "var(--text)"
        btn-outline-hover-background: "var(--surface-alt)"

    - name: "Section Chrome"
      vars:
        sg-section-title-font-family: "var(--font-mono)"
        sg-section-title-text-transform: "uppercase"
        sg-section-title-letter-spacing: "0.06em"
        sg-section-title-color: "var(--text)"
        sg-section-number-bg: "var(--emerald)"
        sg-section-number-border: "none"
        sg-section-number-color: "var(--black)"
        sg-section-number-radius: "0"
        sg-section-desc-font-family: "var(--font-mono)"
        sg-section-desc-color: "var(--text-muted)"
        sg-type-specimen-bg: "var(--surface-alt)"
        sg-type-specimen-border: "1px solid var(--border)"
        sg-type-specimen-border-bottom: "2px solid var(--emerald)"
        sg-type-specimen-radius: "0"
        sg-type-specimen-padding: "var(--space-3)"
        sg-type-specimen-margin: "0 0 var(--space-2) 0"
        sg-type-specimen-name-color: "var(--text)"
        sg-type-specimen-name-font: "var(--font-mono)"
        hr-section-height: "1px"
        hr-section-color: "var(--border)"
        hr-subsection-color: "var(--border)"
        hr-subsection-height: "1px"
        hr-accent-color: "var(--emerald)"

    - name: "HUI: Focus & Interaction"
      vars:
        hui-focus-ring-color: "rgba(63,185,80,0.4)"
        hui-focus-ring-width: "1px"

    - name: "HUI: Controls"
      vars:
        hui-control-color: "var(--text)"
        hui-control-bg: "var(--surface)"
        hui-control-border: "var(--border)"
        hui-control-shadow: "none"
        hui-switch-track-on-bg: "var(--emerald)"
        hui-switch-track-off-bg: "var(--gray-500)"
        hui-switch-thumb-shadow: "none"
        hui-radio-option-border: "var(--border)"
        hui-radio-option-border-active: "var(--emerald)"
        hui-radio-option-bg-active: "var(--emerald-light)"

    - name: "HUI: Trigger Buttons"
      vars:
        hui-trigger-bg: "var(--surface)"
        hui-trigger-border: "var(--border)"
        hui-trigger-border-hover: "var(--text-muted)"
        hui-trigger-color: "var(--text)"

    - name: "HUI: Overlay Panels"
      vars:
        hui-panel-bg: "var(--surface)"
        hui-panel-border: "var(--border)"
        hui-panel-shadow: "none"
        hui-panel-item-active-bg: "var(--emerald-light)"
        hui-panel-item-active-color: "var(--text)"
        hui-panel-sep-color: "var(--border)"

    - name: "HUI: Tabs"
      vars:
        hui-tab-color: "var(--text-muted)"
        hui-tab-color-selected: "var(--emerald)"
        hui-tab-border-selected: "var(--emerald)"
        hui-tab-color-hover: "var(--text-secondary)"
        hui-tab-list-border: "var(--border)"

    - name: "HUI: Disclosure"
      vars:
        hui-disclosure-bg: "var(--surface-alt)"
        hui-disclosure-bg-hover: "var(--gray-600)"
        hui-disclosure-border: "var(--border)"
        hui-disclosure-color: "var(--text)"
        hui-disclosure-panel-bg: "var(--surface)"
        hui-disclosure-panel-color: "var(--text-secondary)"
        hui-disclosure-chevron-color: "var(--text-muted)"

    - name: "HUI: Field Controls"
      vars:
        hui-field-bg: "var(--surface)"
        hui-field-border: "var(--border)"
        hui-field-border-hover: "var(--text-muted)"
        hui-field-focus-border: "var(--emerald)"
        hui-field-color: "var(--text)"
        hui-field-shadow: "none"
        hui-combo-placeholder-color: "var(--text-muted)"
        hui-combo-btn-color: "var(--text-muted)"

    - name: "HUI: Dialog"
      vars:
        hui-dialog-bg: "var(--surface)"
        hui-dialog-shadow: "none"
        hui-dialog-title-color: "var(--text)"
        hui-dialog-body-color: "var(--text-secondary)"
        hui-dialog-backdrop: "rgba(0,0,0,0.7)"

    - name: "HUI: Showcase Grid"
      vars:
        hui-showcase-accent: "var(--emerald)"
        hui-showcase-bg: "var(--surface-alt)"
        hui-showcase-border: "var(--border)"
        hui-showcase-cell-bg: "var(--surface)"
        hui-showcase-cell-border: "var(--border)"
        hui-showcase-label-color: "var(--text-muted)"

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 380 120" width="380" height="120"
     role="img" aria-labelledby="combo-dark-title combo-dark-desc">

  <title id="combo-dark-title">NoizuRPG</title>
  <desc id="combo-dark-desc">NoizuRPG logo — isometric hex cube in purple beside the wordmark. For use on dark backgrounds.</desc>

  <defs>
    <symbol id="mark" viewBox="0 0 122 140">
      <!-- Top face — lightest -->
      <polygon points="0,35 61,0 122,35 61,70" fill="#A78BFA"/>
      <!-- Left face — medium -->
      <polygon points="0,35 61,70 61,140 0,105" fill="#7C5CFC"/>
      <!-- Right face — darkest -->
      <polygon points="61,70 122,35 122,105 61,140" fill="#5B35D5"/>
    </symbol>
  </defs>

  <!-- Logomark -->
  <use href="#mark" x="12" y="14" width="80" height="92"/>

  <!-- Wordmark (convert to <path> for production) -->
  <text x="110" y="62" dominant-baseline="central"
        font-family="'Inter', system-ui, sans-serif"
        font-size="40" font-weight="700"
        letter-spacing="-0.5" fill="#E4E4EC">NoizuRPG</text>

</svg>

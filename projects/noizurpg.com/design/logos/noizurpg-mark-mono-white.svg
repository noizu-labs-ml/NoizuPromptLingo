<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-labelledby="mono-white-title mono-white-desc">

  <title id="mono-white-title">NoizuRPG</title>
  <desc id="mono-white-desc">NoizuRPG logomark in monochrome white — three tones preserve the isometric cube structure for dark backgrounds</desc>

  <!-- Top face — brightest -->
  <polygon points="39,65 100,30 161,65 100,100" fill="#FFFFFF"/>
  <!-- Left face — medium -->
  <polygon points="39,65 100,100 100,170 39,135" fill="#C4C4D4"/>
  <!-- Right face — dimmest -->
  <polygon points="100,100 161,65 161,135 100,170" fill="#E0E0EC"/>

</svg>

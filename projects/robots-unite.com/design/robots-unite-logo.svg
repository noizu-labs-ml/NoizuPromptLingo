<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 420 120"
     width="420" height="120"
     role="img" aria-labelledby="ru-logo-title ru-logo-desc">

  <title id="ru-logo-title">Robots Unite</title>
  <desc id="ru-logo-desc">Robots Unite logo — two connected robot forms with the brand name</desc>

  <!--
    DEVELOPMENT VERSION: Text uses live fonts.
    PRODUCTION: Convert all <text> to <path> via:
      inkscape input.svg - -export-text-to-path - -export-filename=output.svg
    Fonts required for dev rendering: Inter or Geist Sans
  -->

  <!-- Logomark (scaled from 200x200 to 100x100) -->
  <g transform="translate(10, 10) scale(0.5)">
    <!-- Left robot -->
    <rect x="24" y="84" width="58" height="58" rx="13" fill="#171717"/>
    <rect x="50" y="68" width="6" height="20" rx="3" fill="#171717"/>
    <circle cx="53" cy="64" r="5" fill="#F97316"/>

    <!-- Right robot -->
    <rect x="118" y="84" width="58" height="58" rx="13" fill="#171717"/>
    <rect x="144" y="68" width="6" height="20" rx="3" fill="#171717"/>
    <circle cx="147" cy="64" r="5" fill="#F97316"/>

    <!-- Connection bridge -->
    <rect x="80" y="100" width="40" height="11" rx="5.5" fill="#F97316"/>
    <circle cx="100" cy="105.5" r="2.5" fill="#FFFFFF"/>
  </g>

  <!-- Brand text -->
  <text x="130" y="58"
        font-family="Inter, 'Geist Sans', system-ui, sans-serif"
        font-size="38" font-weight="700"
        letter-spacing="-0.5" fill="#171717">
    ROBOTS
  </text>
  <text x="132" y="82"
        font-family="Inter, 'Geist Sans', system-ui, sans-serif"
        font-size="16" font-weight="400"
        letter-spacing="6" fill="#525252">
    UNITE
  </text>

</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-labelledby="mark-title mark-desc">

  <title id="mark-title">gotta.cc</title>
  <desc id="mark-desc">Gotta.cc logomark — a six-armed asterisk in warm coral representing editorial curation and web discovery</desc>

  <!--
    CONCEPT: The typographic asterisk (*) reimagined as a geometric logomark.
    - Asterisk = editorial footnote ("see this"), wildcard ("everything"), emphasis
    - 3 rounded bars crossing at center create 6 balanced arms
    - Warm coral from Direction B palette; works as fixed brand color across all directions
    - Scales cleanly from favicon (16px) to billboard

    CONSTRUCTION: 3 capsule shapes (fully-rounded rects), rotated 0°/60°/120°
    Bar: 16×130, rx=8, centered at (100,100) in 200×200 viewBox
    Clear space: ~17.5% on all sides (35px to nearest bar tip)
  -->

  <g transform="translate(100,100)" fill="#E8704A">
    <rect x="-8" y="-65" width="16" height="130" rx="8"/>
    <rect x="-8" y="-65" width="16" height="130" rx="8" transform="rotate(60)"/>
    <rect x="-8" y="-65" width="16" height="130" rx="8" transform="rotate(120)"/>
  </g>

</svg>

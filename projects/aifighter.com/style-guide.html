<!DOCTYPE html>
<html lang="en" data-design-theme="neural-combat">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Fighter — Neural Combat Style Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="module">
    import * as HeadlessUI from 'https://esm.sh/@headlessui/react@2.2.4?external=react,react-dom';
    window.HeadlessUI = HeadlessUI;
    window.dispatchEvent(new Event('headlessui-ready'));
  </script>
  <script crossorigin src="https://noizu.github.io/react-assets/dist/sg.js"></script>
  <link rel="stylesheet" href="https://noizu.github.io/react-assets/dist/sg.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>

  <style>
    /* ═══════════════════════════════════════
       1. DESIGN TOKENS
       ═══════════════════════════════════════ */

    [data-design-theme="neural-combat"] {
      /* === VOID === */
      --void-deep:       #06060C;
      --void-surface:    #0E0E18;
      --void-elevated:   #16162A;
      --void-border:     #252540;
      --void-hover:      #1E1E38;

      /* === SYNAPSE (connection, life, primary) === */
      --synapse:         #00FFAA;
      --synapse-dim:     #00CC88;
      --synapse-glow:    rgba(0, 255, 170, 0.15);
      --synapse-glow-strong: rgba(0, 255, 170, 0.35);

      /* === COMBAT (aggression, damage) === */
      --combat:          #FF2D55;
      --combat-dim:      #CC2444;
      --combat-glow:     rgba(255, 45, 85, 0.15);

      /* === SIGNAL (defense, perception) === */
      --signal:          #2979FF;
      --signal-dim:      #1A5FCC;
      --signal-glow:     rgba(41, 121, 255, 0.15);

      /* === REWARD (currency, rank) === */
      --reward:          #FFB300;
      --reward-dim:      #CC8F00;
      --reward-glow:     rgba(255, 179, 0, 0.15);

      /* === TEXT === */
      --text-primary:    #E6E6F0;
      --text-secondary:  #8888A0;
      --text-dim:        #555570;
      --text-inverse:    #06060C;

      /* === SEMANTIC (aliased) === */
      --success:         #00FFAA;
      --success-dim:     rgba(0, 255, 170, 0.15);
      --warning:         #FFB300;
      --warning-dim:     rgba(255, 179, 0, 0.15);
      --error:           #FF2D55;
      --error-dim:       rgba(255, 45, 85, 0.15);
      --info:            #2979FF;
      --info-dim:        rgba(41, 121, 255, 0.15);

      /* === TYPOGRAPHY === */
      --font-display:    'Space Grotesk', 'Arial Black', sans-serif;
      --font-body:       'DM Sans', 'Inter', system-ui, sans-serif;
      --font-data:       'JetBrains Mono', 'SF Mono', 'Consolas', monospace;
      --font-sans:       var(--font-body);
      --font-mono:       var(--font-data);

      /* === SPACING === */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --space-10: 40px;
      --space-12: 48px;
      --space-16: 64px;
      --space-24: 96px;

      /* === RADIUS === */
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;

      /* === GLOW PRESETS === */
      --glow-synapse:  0 0 10px rgba(0,255,170,0.4), 0 0 40px rgba(0,255,170,0.12);
      --glow-combat:   0 0 10px rgba(255,45,85,0.4), 0 0 40px rgba(255,45,85,0.12);
      --glow-signal:   0 0 10px rgba(41,121,255,0.4), 0 0 40px rgba(41,121,255,0.12);
      --glow-reward:   0 0 10px rgba(255,179,0,0.4), 0 0 40px rgba(255,179,0,0.12);
      --text-glow-synapse: 0 0 8px rgba(0,255,170,0.7), 0 0 25px rgba(0,255,170,0.25);
    }

    /* ═══════════════════════════════════════
       2. ANIMATIONS
       ═══════════════════════════════════════ */

    @keyframes synapse-pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.7; }
    }
    @keyframes signal-flow {
      0% { stroke-dashoffset: 24; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes node-glow {
      0%, 100% { box-shadow: 0 0 0 0 var(--synapse-glow); }
      50% { box-shadow: 0 0 16px 4px var(--synapse-glow); }
    }
    @keyframes health-drain {
      0% { width: var(--hp-start); }
      100% { width: var(--hp-end); }
    }
    @keyframes rank-roll {
      0% { transform: translateY(100%); opacity: 0; }
      50% { transform: translateY(-10%); opacity: 1; }
      100% { transform: translateY(0); opacity: 1; }
    }
    @keyframes combat-flash {
      0% { background: transparent; }
      30% { background: var(--combat-glow); }
      100% { background: transparent; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 100ms !important;
      }
    }

    /* ═══════════════════════════════════════
       3. BASE OVERRIDES
       ═══════════════════════════════════════ */

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      color: var(--text-primary);
      background: var(--void-deep);
      background-image: none;
      line-height: 1.5;
      position: relative;
    }
    /* Ambient neural grid — faint structure beneath everything */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(37,37,64,0.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(37,37,64,0.12) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 0;
    }
    /* Ambient synapse glow — top-left and bottom-right radials */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 600px 400px at 10% 20%, rgba(0,255,170,0.03) 0%, transparent 70%),
        radial-gradient(ellipse 500px 500px at 85% 80%, rgba(41,121,255,0.025) 0%, transparent 70%),
        radial-gradient(ellipse 400px 300px at 50% 50%, rgba(255,45,85,0.015) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    #arena-cutscene, #root { position: relative; z-index: 1; }
    ::selection { background: var(--synapse); color: var(--void-deep); }

    /* Sticky section nav */
    .sg-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(6,6,12,0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--void-border);
      padding: 10px 24px;
      margin: 0 -24px 32px;
      display: flex;
      gap: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .sg-nav::-webkit-scrollbar { display: none; }
    .sg-nav a {
      font-family: var(--font-data);
      font-size: 11px;
      font-weight: 500;
      color: var(--text-dim);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
      padding: 4px 0;
      border-bottom: 1px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }
    .sg-nav a:hover { color: var(--text-secondary); border-bottom-color: var(--void-border); }
    .sg-nav a.active { color: var(--synapse); border-bottom-color: var(--synapse); }

    /* ═══════════════════════════════════════
       4. STYLEGUIDE CDN COMPONENT OVERRIDES
       ═══════════════════════════════════════ */

    /* Container */
    .style-guide .sg-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px 96px;
    }

    /* Section dividers — synapse accent line */
    .style-guide .sg-section {
      border-top: none;
      padding-top: 56px;
      margin-top: 56px;
      position: relative;
    }
    .style-guide .sg-section::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, var(--synapse-dim) 20%, var(--synapse) 50%, var(--synapse-dim) 80%, transparent 100%);
      opacity: 0.4;
    }
    .style-guide .sg-section:first-child { margin-top: 0; padding-top: 0; }
    .style-guide .sg-section:first-child::before { display: none; }

    /* Section header overrides */
    .style-guide .sg-section-header .sg-number {
      color: var(--synapse);
      font-family: var(--font-data);
    }
    .style-guide .sg-section-header h2 {
      font-family: var(--font-display);
      text-transform: uppercase;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }
    .style-guide .sg-section-header .sg-section-desc {
      color: var(--text-secondary);
    }

    /* Token cards */
    .style-guide .sg-token-card {
      background: var(--void-surface);
      border: 1px solid var(--void-border);
      border-radius: var(--radius-lg);
    }
    .style-guide .sg-token-card .sg-token-title {
      color: var(--text-primary);
      font-family: var(--font-display);
      text-transform: uppercase;
      letter-spacing: 0.02em;
      font-size: 12px;
    }
    .style-guide .sg-token-row {
      border-color: var(--void-border);
    }
    .style-guide .sg-token-name {
      color: var(--text-secondary);
      font-family: var(--font-data);
    }
    .style-guide .sg-token-value {
      color: var(--text-primary);
      font-family: var(--font-data);
    }

    /* Color swatches */
    .style-guide .sg-color-grid { gap: 12px; }
    .style-guide .sg-swatch {
      border-radius: var(--radius-md);
      border: 1px solid var(--void-border);
      overflow: hidden;
    }
    .style-guide .sg-swatch-info {
      background: var(--void-surface);
      padding: 10px 12px;
    }
    .style-guide .sg-swatch-name { color: var(--text-primary); font-size: 13px; }
    .style-guide .sg-swatch-hex { color: var(--text-secondary); font-family: var(--font-data); font-size: 12px; }

    /* Type specimens */
    .style-guide .sg-type-specimen {
      border-bottom: 1px solid var(--void-border);
      padding: 16px 0;
    }
    .style-guide .sg-type-meta {
      color: var(--text-dim);
      font-family: var(--font-data);
      font-size: 12px;
    }
    .style-guide .sg-type-meta strong {
      color: var(--text-secondary);
    }

    /* Spacing scale */
    .style-guide .sg-spacing-bar {
      background: var(--synapse-glow);
      border-left: 3px solid var(--synapse);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    }
    .style-guide .sg-spacing-label {
      color: var(--text-dim);
      font-family: var(--font-data);
    }

    /* Spec table */
    .style-guide .sg-spec-table {
      border-collapse: collapse;
      width: 100%;
    }
    .style-guide .sg-spec-table th {
      color: var(--text-dim);
      border-bottom: 1px solid var(--void-border);
      font-family: var(--font-data);
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.05em;
    }
    .style-guide .sg-spec-table td {
      border-bottom: 1px solid var(--void-elevated);
      color: var(--text-secondary);
      font-size: 14px;
    }
    .style-guide .sg-spec-table td:first-child { color: var(--text-primary); }

    /* Principles */
    .style-guide .sg-principle {
      border-left: 3px solid var(--synapse);
      padding-left: 16px;
    }
    .style-guide .sg-principle-number { color: var(--synapse); font-family: var(--font-data); }
    .style-guide .sg-principle-rule { color: var(--text-primary); }
    .style-guide .sg-principle-detail { color: var(--text-secondary); }

    /* Notes list */
    .style-guide .sg-notes-list li { color: var(--text-secondary); }

    /* Style card (hero) */
    .style-guide .sg-style-card {
      background: var(--void-surface);
      border: 1px solid var(--void-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .style-guide .sg-style-card .sg-hero {
      background: linear-gradient(135deg, var(--void-deep) 0%, var(--void-elevated) 50%, var(--void-deep) 100%);
      position: relative;
      overflow: hidden;
    }
    .style-guide .sg-style-card .sg-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 30% 80%, var(--synapse-glow) 0%, transparent 60%),
                  radial-gradient(ellipse at 70% 20%, var(--signal-glow) 0%, transparent 60%);
      pointer-events: none;
    }
    .style-guide .sg-style-card .sg-title {
      font-family: var(--font-display);
      color: var(--text-primary);
    }
    .style-guide .sg-style-card .sg-subtitle {
      font-family: var(--font-data);
      color: var(--text-secondary);
    }
    .style-guide .sg-style-card .sg-epigraph {
      color: var(--text-dim);
      font-family: var(--font-body);
    }
    .style-guide .sg-style-card .sg-seal {
      color: var(--synapse);
      opacity: 0.08;
    }
    .style-guide .sg-style-card .sg-meta {
      background: var(--void-elevated);
      border-top: 1px solid var(--void-border);
    }
    .style-guide .sg-style-card .sg-meta dt { color: var(--text-dim); }
    .style-guide .sg-style-card .sg-meta dd { color: var(--text-secondary); font-family: var(--font-data); }

    /* Product branding */
    .style-guide .sg-product-branding {
      background: var(--void-surface);
      border: 1px solid var(--void-border);
      border-radius: var(--radius-lg);
    }
    .style-guide .sg-product-branding h2 { color: var(--text-primary); font-family: var(--font-display); text-transform: uppercase; }
    .style-guide .sg-product-branding dt { color: var(--text-dim); }
    .style-guide .sg-product-branding dd { color: var(--text-secondary); }
    .style-guide .sg-product-branding .sg-keyword {
      background: var(--void-elevated);
      color: var(--synapse);
      border: 1px solid var(--void-border);
      border-radius: var(--radius-sm);
      font-family: var(--font-data);
      font-size: 12px;
    }
    .style-guide .sg-product-branding .sg-logo-placeholder {
      border-color: var(--void-border);
    }

    /* Widget demos */
    .style-guide .widget-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 16px;
    }
    .style-guide .sg-widget-demo {
      background: var(--void-surface);
      border: 1px solid var(--void-border);
      border-radius: var(--radius-lg);
    }
    .style-guide .sg-widget-demo .sg-widget-title { color: var(--text-primary); font-family: var(--font-display); text-transform: uppercase; font-size: 14px; }
    .style-guide .sg-widget-demo .sg-widget-badge { background: var(--synapse-glow); color: var(--synapse); font-family: var(--font-data); border-radius: var(--radius-sm); }
    .style-guide .sg-widget-demo .sg-widget-desc { color: var(--text-dim); }
    .style-guide .sg-widget-demo .sg-widget-preview {
      background: var(--void-elevated);
      border-radius: var(--radius-md);
    }

    /* Screen frame */
    .style-guide .sg-screen-frame {
      background: var(--void-surface);
      border: 1px solid var(--void-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .style-guide .sg-screen-chrome {
      background: var(--void-elevated);
      border-bottom: 1px solid var(--void-border);
    }

    /* ═══════════════════════════════════════
       5. GAME COMPONENTS — Neural Combat
       ═══════════════════════════════════════ */

    /* Buttons */
    .btn-synapse { background: var(--synapse); color: var(--void-deep); font-weight: 600; border: none; border-radius: var(--radius-md); }
    .btn-synapse:hover { opacity: 0.9; box-shadow: var(--glow-synapse); }
    .btn-void { background: transparent; color: var(--text-primary); border: 1.5px solid var(--void-border); border-radius: var(--radius-md); }
    .btn-void:hover { border-color: var(--synapse-dim); background: var(--void-surface); }
    .btn-ghost-nc { background: transparent; color: var(--text-secondary); border: none; }
    .btn-ghost-nc:hover { color: var(--text-primary); }
    .btn-combat { background: var(--combat); color: #fff; border: none; border-radius: var(--radius-md); }
    .btn-combat:hover { opacity: 0.9; box-shadow: var(--glow-combat); }
    .btn { font-family: var(--font-body); font-size: 14px; font-weight: 500; padding: 12px 24px; cursor: pointer; transition: all 0.15s ease; min-height: 44px; }
    .btn-sm { font-size: 12px; padding: 8px 16px; min-height: 36px; }
    .btn-lg { font-size: 16px; padding: 16px 32px; min-height: 52px; }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn:focus-visible { outline: 2px solid var(--synapse); outline-offset: 3px; }
    .btn:active:not(:disabled) { transform: scale(0.97); }

    /* Cards */
    .card { background: var(--void-surface); border: 1px solid var(--void-border); border-radius: var(--radius-lg); padding: 20px; transition: border-color 0.2s; }
    .card:hover { border-color: var(--synapse-dim); }
    .card-fighter { position: relative; overflow: hidden; border-radius: var(--radius-xl); }
    .card-filled { background: var(--void-elevated); border-color: var(--void-border); }
    .card-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: -0.01em; margin-bottom: 8px; }
    .card-body { font-size: 14px; color: var(--text-secondary); line-height: 1.5; }

    /* Input fields */
    .input-field { background: var(--void-elevated); color: var(--text-primary); font-family: var(--font-body); font-size: 16px; padding: 12px 16px; border: 1.5px solid var(--void-border); border-radius: var(--radius-md); outline: none; transition: border-color 0.15s, box-shadow 0.15s; width: 100%; }
    .input-field::placeholder { color: var(--text-dim); }
    .input-field:focus { border-color: var(--synapse); box-shadow: 0 0 0 3px var(--synapse-glow); }
    .input-field.error { border-color: var(--combat); box-shadow: 0 0 0 3px var(--combat-glow); }
    .input-label { display: block; font-family: var(--font-data); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-secondary); margin-bottom: 6px; }
    .input-hint { font-family: var(--font-data); font-size: 11px; color: var(--text-dim); margin-top: 4px; }
    .input-hint.error { color: var(--combat); }
    .input-demo { max-width: 400px; }
    .input-group { margin-bottom: 24px; }

    /* Graph Nodes */
    .graph-node { background: var(--void-surface); border: 1.5px solid var(--void-border); border-radius: var(--radius-lg); padding: 12px 16px; min-width: 140px; display: inline-flex; flex-direction: column; gap: 4px; transition: border-color 0.2s, box-shadow 0.2s; cursor: default; }
    .graph-node:hover { border-color: var(--synapse); box-shadow: var(--glow-synapse); }
    .graph-node--perception { border-left: 3px solid var(--signal); }
    .graph-node--decision { border-left: 3px solid var(--synapse); }
    .graph-node--action { border-left: 3px solid var(--combat); }
    .graph-node .node-label { font-family: var(--font-body); font-weight: 500; font-size: 13px; color: var(--text-primary); }
    .graph-node .node-value { font-family: var(--font-data); font-size: 12px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }

    /* Connection Lines */
    .connection-dim { stroke: var(--synapse-dim); stroke-width: 2; fill: none; opacity: 0.5; }
    .connection-active { stroke: var(--synapse); stroke-width: 2; fill: none; opacity: 1; filter: drop-shadow(0 0 4px rgba(0,255,170,0.4)); }
    .connection-flow { stroke-dasharray: 8 4; animation: signal-flow 0.8s linear infinite; }

    /* Health Bars */
    .health-bar { height: 8px; background: var(--void-elevated); border-radius: 4px; overflow: hidden; }
    .health-bar__fill { height: 100%; border-radius: 4px; transition: width 0.6s ease-out; }
    .health-bar__fill--high { background: var(--synapse); }
    .health-bar__fill--medium { background: var(--reward); }
    .health-bar__fill--low { background: var(--combat); }

    /* Decision Overlay */
    .decision-overlay { background: var(--void-surface); border: 1px solid var(--void-border); border-radius: var(--radius-lg); padding: 16px; max-width: 320px; }
    .decision-overlay__action { font-family: var(--font-display); font-size: 16px; font-weight: 600; text-transform: uppercase; }
    .decision-overlay__reason { font-family: var(--font-data); font-size: 13px; color: var(--text-secondary); margin-top: 8px; }
    .decision-overlay__confidence { font-family: var(--font-data); font-size: 14px; color: var(--synapse); margin-top: 4px; font-variant-numeric: tabular-nums; }
    .confidence-bar { height: 4px; background: var(--void-elevated); border-radius: 2px; margin-top: 8px; overflow: hidden; }
    .confidence-bar__fill { height: 100%; background: var(--synapse); border-radius: 2px; }

    /* Stat Cards */
    .stat-card { background: var(--void-elevated); border-radius: var(--radius-md); padding: 14px 16px; text-align: center; min-width: 80px; }
    .stat-card__label { font-family: var(--font-data); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 4px; }
    .stat-card__value { font-family: var(--font-data); font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--text-primary); }

    /* Tab Bar */
    .tab-bar-demo { display: flex; justify-content: space-around; align-items: center; background: var(--void-deep); border: 1px solid var(--void-border); border-radius: 0 0 var(--radius-lg) var(--radius-lg); padding: 8px 0; max-width: 400px; }
    .tab-item { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--text-dim); font-family: var(--font-body); font-size: 10px; font-weight: 500; cursor: pointer; transition: color 0.15s; background: none; border: none; padding: 4px 12px; }
    .tab-item:hover { color: var(--text-secondary); }
    .tab-item--active { color: var(--synapse); }
    .tab-item svg { width: 20px; height: 20px; }

    /* Synapse background motif */
    .synapse-line { stroke: var(--void-border); stroke-width: 1; fill: none; animation: synapse-pulse 3s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .synapse-line { animation: none; opacity: 0.3; } }

    /* Status indicators */
    .status-indicator { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .status-dot.online { background: var(--synapse); box-shadow: 0 0 6px var(--synapse); }
    .status-dot.fighting { background: var(--combat); box-shadow: 0 0 6px var(--combat); animation: synapse-pulse 1s ease-in-out infinite; }
    .status-dot.training { background: var(--reward); box-shadow: 0 0 6px var(--reward); animation: synapse-pulse 2s ease-in-out infinite; }
    .status-dot.offline { background: var(--text-dim); }

    /* Navigation tabs (PhaseTabs override) */
    .style-guide .sg-phase-tab { background: var(--void-surface); border: 1px solid var(--void-border); color: var(--text-dim); font-family: var(--font-data); border-radius: var(--radius-sm); }
    .style-guide .sg-phase-tab.active { background: var(--synapse-glow); border-color: var(--synapse); color: var(--synapse); }
    .style-guide .sg-phase-tab.completed { background: var(--void-elevated); border-color: var(--synapse-dim); color: var(--synapse-dim); }

    /* Button row */
    .button-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 24px; }

    /* Card grid */
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }

    /* Subsections within sg-section */
    .sg-subsection { margin-top: 32px; }
    .sg-subsection h3 { font-family: var(--font-display); font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em; color: var(--text-secondary); margin-bottom: 16px; }

    /* ═══════════════════════════════════════
       6. AMBIENT ENHANCEMENTS
       ═══════════════════════════════════════ */

    /* Graph nodes glow on hover with category-appropriate color */
    .graph-node--perception:hover { border-color: var(--signal); box-shadow: var(--glow-signal); }
    .graph-node--decision:hover { border-color: var(--synapse); box-shadow: var(--glow-synapse); }
    .graph-node--action:hover { border-color: var(--combat); box-shadow: var(--glow-combat); }

    /* Cards get subtle synapse glow on hover */
    .card:hover { box-shadow: 0 0 20px rgba(0,255,170,0.06); }

    /* Widget demos get border glow on hover */
    .style-guide .sg-widget-demo:hover { border-color: rgba(0,255,170,0.3); box-shadow: 0 0 30px rgba(0,255,170,0.05); }

    /* Token cards get subtle lift */
    .style-guide .sg-token-card:hover { border-color: rgba(0,255,170,0.2); transform: translateY(-1px); transition: all 0.2s ease; }

    /* Buttons get press feedback */
    .btn { position: relative; overflow: hidden; }
    .btn::after { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at center, rgba(255,255,255,0.1) 0%, transparent 70%); opacity: 0; transition: opacity 0.15s; }
    .btn:active::after { opacity: 1; }

    /* Health bars get subtle inner glow */
    .health-bar__fill--high { box-shadow: inset 0 0 8px rgba(0,255,170,0.3); }
    .health-bar__fill--medium { box-shadow: inset 0 0 8px rgba(255,179,0,0.3); }
    .health-bar__fill--low { box-shadow: inset 0 0 8px rgba(255,45,85,0.3); }

    /* Status dots pulse more visibly */
    .status-dot.online { box-shadow: 0 0 6px var(--synapse), 0 0 12px rgba(0,255,170,0.2); }
    .status-dot.fighting { box-shadow: 0 0 6px var(--combat), 0 0 12px rgba(255,45,85,0.2); }

    /* Confidence bar fill gets glow */
    .confidence-bar__fill { box-shadow: 0 0 6px rgba(0,255,170,0.4); }

    /* Stat card values with color get text shadow */
    .stat-card__value { transition: transform 0.15s; }
    .stat-card:hover .stat-card__value { transform: scale(1.05); }

    /* Input focus ring is more dramatic */
    .input-field:focus { box-shadow: 0 0 0 3px var(--synapse-glow), 0 0 20px rgba(0,255,170,0.08); }

    /* Screen frames get ambient glow */
    .style-guide .sg-screen-frame { box-shadow: 0 4px 40px rgba(0,0,0,0.4), 0 0 60px rgba(0,255,170,0.03); }

    /* Section numbers get text glow */
    .style-guide .sg-section-header .sg-number { text-shadow: 0 0 12px rgba(0,255,170,0.3); }

    /* Scrollbar styling for the whole page */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--void-deep); }
    ::-webkit-scrollbar-thumb { background: var(--void-border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--synapse-dim); }

    /* Link styling */
    a { color: var(--synapse); text-decoration: none; transition: color 0.15s; }
    a:hover { color: var(--synapse-dim); text-decoration: underline; }
  </style>

<body class="style-guide">
  <!-- ═══════════════════════════════════════
       P5.JS CUTSCENE — Two fighters face off
       ═══════════════════════════════════════ -->
  <div id="arena-cutscene" style="width:100%;max-width:1100px;margin:0 auto;padding:32px 24px 0;"></div>
  <script>
  (function() {
    // Neural Combat palette
    var VOID = [6, 6, 12];
    var SYNAPSE = [0, 255, 170];
    var COMBAT = [255, 45, 85];
    var SIGNAL = [41, 121, 255];
    var REWARD = [255, 179, 0];
    var BORDER = [37, 37, 64];
    var DIM = [85, 85, 112];

    // Fighter class — a neural-net creature made of nodes and connections
    function Fighter(x, y, facing, palette, name) {
      this.x = x;
      this.y = y;
      this.facing = facing; // 1 = right, -1 = left
      this.color = palette;
      this.name = name;
      this.nodes = [];
      this.connections = [];
      this.particles = [];
      this.breathPhase = Math.random() * Math.PI * 2;
      this.idleOffset = 0;

      // Build the neural body — 8-12 nodes in a rough humanoid cluster
      var cx = 0, cy = 0;
      // Core nodes (torso)
      this.nodes.push({ rx: 0, ry: -40, r: 7, type: 'decision' });   // head
      this.nodes.push({ rx: 0, ry: -15, r: 9, type: 'decision' });   // chest (largest)
      this.nodes.push({ rx: 0, ry: 10, r: 6, type: 'decision' });    // core
      // Arms
      this.nodes.push({ rx: -25 * facing, ry: -20, r: 5, type: 'action' });  // left shoulder
      this.nodes.push({ rx: -40 * facing, ry: -5, r: 4, type: 'action' });   // left hand
      this.nodes.push({ rx: 25 * facing, ry: -20, r: 5, type: 'action' });   // right shoulder
      this.nodes.push({ rx: 40 * facing, ry: -5, r: 4, type: 'action' });    // right hand (front)
      // Legs
      this.nodes.push({ rx: -12, ry: 35, r: 5, type: 'perception' }); // left knee
      this.nodes.push({ rx: -15, ry: 55, r: 4, type: 'perception' }); // left foot
      this.nodes.push({ rx: 12, ry: 35, r: 5, type: 'perception' });  // right knee
      this.nodes.push({ rx: 15, ry: 55, r: 4, type: 'perception' });  // right foot

      // Connections — spine + limbs
      this.connections.push([0, 1]); // head-chest
      this.connections.push([1, 2]); // chest-core
      this.connections.push([1, 3]); // chest-lshoulder
      this.connections.push([3, 4]); // lshoulder-lhand
      this.connections.push([1, 5]); // chest-rshoulder
      this.connections.push([5, 6]); // rshoulder-rhand
      this.connections.push([2, 7]); // core-lknee
      this.connections.push([7, 8]); // lknee-lfoot
      this.connections.push([2, 9]); // core-rknee
      this.connections.push([9, 10]); // rknee-rfoot
      // Cross-connections for neural density
      this.connections.push([0, 3]); // head-lshoulder
      this.connections.push([0, 5]); // head-rshoulder
      this.connections.push([3, 5]); // shoulder-shoulder
    }

    Fighter.prototype.update = function(p, t) {
      this.breathPhase += 0.02;
      this.idleOffset = Math.sin(this.breathPhase) * 3;

      // Spawn ambient particles
      if (Math.random() < 0.15) {
        var ni = Math.floor(Math.random() * this.nodes.length);
        var n = this.nodes[ni];
        this.particles.push({
          x: this.x + n.rx + (Math.random() - 0.5) * 10,
          y: this.y + n.ry + this.idleOffset + (Math.random() - 0.5) * 10,
          vx: (Math.random() - 0.5) * 0.8,
          vy: -Math.random() * 1.5 - 0.5,
          life: 1.0,
          decay: 0.01 + Math.random() * 0.02,
          size: 1 + Math.random() * 2.5
        });
      }

      // Update particles
      for (var i = this.particles.length - 1; i >= 0; i--) {
        var pt = this.particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life -= pt.decay;
        if (pt.life <= 0) this.particles.splice(i, 1);
      }
    };

    Fighter.prototype.draw = function(p, t, signalPhase) {
      var c = this.color;
      var yo = this.idleOffset;

      // Draw particles first (behind)
      for (var i = 0; i < this.particles.length; i++) {
        var pt = this.particles[i];
        p.noStroke();
        p.fill(c[0], c[1], c[2], pt.life * 120);
        p.circle(pt.x, pt.y, pt.size);
      }

      // Draw connections
      for (var i = 0; i < this.connections.length; i++) {
        var ci = this.connections[i];
        var a = this.nodes[ci[0]];
        var b = this.nodes[ci[1]];
        var ax = this.x + a.rx, ay = this.y + a.ry + yo;
        var bx = this.x + b.rx, by = this.y + b.ry + yo;

        // Signal flow pulse along some connections
        var pulseAlpha = 0.3 + 0.25 * Math.sin(t * 2 + i * 0.7 + signalPhase);
        p.stroke(c[0], c[1], c[2], pulseAlpha * 255);
        p.strokeWeight(1.5);
        p.noFill();

        // Curved connections using bezier
        var mx = (ax + bx) / 2 + (Math.sin(t + i) * 5) * this.facing;
        var my = (ay + by) / 2;
        p.bezier(ax, ay, mx - 10, ay, mx + 10, by, bx, by);
      }

      // Draw nodes
      for (var i = 0; i < this.nodes.length; i++) {
        var n = this.nodes[i];
        var nx = this.x + n.rx;
        var ny = this.y + n.ry + yo;
        var pulse = 0.6 + 0.4 * Math.sin(t * 3 + i * 1.1);

        // Glow
        p.noStroke();
        p.fill(c[0], c[1], c[2], 25 * pulse);
        p.circle(nx, ny, n.r * 4);
        p.fill(c[0], c[1], c[2], 50 * pulse);
        p.circle(nx, ny, n.r * 2.5);

        // Core
        p.fill(c[0], c[1], c[2], 180 + 75 * pulse);
        p.circle(nx, ny, n.r);

        // Bright center
        p.fill(255, 255, 255, 80 * pulse);
        p.circle(nx, ny, n.r * 0.4);
      }

      // Fighter name below
      p.noStroke();
      p.fill(c[0], c[1], c[2], 200);
      p.textAlign(p.CENTER);
      p.textSize(13);
      p.textFont('Space Grotesk, Arial Black, sans-serif');
      p.textStyle(p.BOLD);
      p.text(this.name, this.x, this.y + 80);
    };

    // Clash energy — particles and lines between the two fighters when they face off
    var clashParticles = [];
    var clashPhase = 0;

    function drawClashEnergy(p, f1, f2, t) {
      var cx = (f1.x + f2.x) / 2;
      var cy = (f1.y + f2.y) / 2 - 15;
      clashPhase += 0.03;

      // Electricity arcs between them
      var arcCount = 3 + Math.floor(Math.sin(t * 1.5) * 2);
      for (var i = 0; i < arcCount; i++) {
        var progress = (i + 0.5) / arcCount;
        var sx = p.lerp(f1.x + 30 * f1.facing, f2.x + 30 * f2.facing, progress);
        var sy = p.lerp(f1.y - 15, f2.y - 15, progress) + Math.sin(t * 5 + i * 2) * 15;

        p.stroke(255, 255, 255, 40 + Math.sin(t * 8 + i) * 30);
        p.strokeWeight(0.5);
        p.point(sx, sy);
      }

      // Center clash glow — pulses
      var glowSize = 20 + Math.sin(t * 4) * 10;
      p.noStroke();
      p.fill(255, 255, 255, 8 + Math.sin(t * 3) * 5);
      p.circle(cx, cy, glowSize * 3);
      p.fill(SYNAPSE[0], SYNAPSE[1], SYNAPSE[2], 10 + Math.sin(t * 2.5) * 8);
      p.circle(cx, cy, glowSize * 2);

      // VS text
      var vsAlpha = 150 + Math.sin(t * 2) * 50;
      p.fill(255, 255, 255, vsAlpha);
      p.textAlign(p.CENTER, p.CENTER);
      p.textSize(18);
      p.textFont('Space Grotesk, Arial Black, sans-serif');
      p.textStyle(p.BOLD);
      p.text('VS', cx, cy);

      // Spawn clash sparks
      if (Math.random() < 0.3) {
        var angle = Math.random() * Math.PI * 2;
        var speed = 1 + Math.random() * 2;
        clashParticles.push({
          x: cx + (Math.random() - 0.5) * 20,
          y: cy + (Math.random() - 0.5) * 20,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1.0,
          decay: 0.02 + Math.random() * 0.03,
          size: 1 + Math.random() * 2,
          color: Math.random() < 0.5 ? SYNAPSE : COMBAT
        });
      }

      // Draw and update clash particles
      for (var i = clashParticles.length - 1; i >= 0; i--) {
        var pt = clashParticles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.vy += 0.02; // slight gravity
        pt.life -= pt.decay;
        if (pt.life <= 0) { clashParticles.splice(i, 1); continue; }
        p.noStroke();
        p.fill(pt.color[0], pt.color[1], pt.color[2], pt.life * 180);
        p.circle(pt.x, pt.y, pt.size * pt.life);
      }
    }

    // Background grid — faint neural void grid
    function drawVoidGrid(p, w, h, t) {
      var spacing = 32;
      p.stroke(BORDER[0], BORDER[1], BORDER[2], 25);
      p.strokeWeight(0.5);
      for (var x = 0; x < w; x += spacing) {
        var wobble = Math.sin(t * 0.5 + x * 0.01) * 0.5;
        p.line(x + wobble, 0, x + wobble, h);
      }
      for (var y = 0; y < h; y += spacing) {
        var wobble = Math.sin(t * 0.5 + y * 0.01) * 0.5;
        p.line(0, y + wobble, w, y + wobble);
      }
    }

    // Background ambient neural paths
    var bgPaths = [];
    function initBgPaths(w, h) {
      for (var i = 0; i < 6; i++) {
        bgPaths.push({
          x1: Math.random() * w, y1: Math.random() * h,
          x2: Math.random() * w, y2: Math.random() * h,
          cx1: Math.random() * w, cy1: Math.random() * h,
          cx2: Math.random() * w, cy2: Math.random() * h,
          phase: Math.random() * Math.PI * 2,
          speed: 0.005 + Math.random() * 0.01
        });
      }
    }

    function drawBgPaths(p, t) {
      for (var i = 0; i < bgPaths.length; i++) {
        var bp = bgPaths[i];
        bp.phase += bp.speed;
        var alpha = 15 + Math.sin(bp.phase) * 10;
        p.noFill();
        p.stroke(SYNAPSE[0], SYNAPSE[1], SYNAPSE[2], alpha);
        p.strokeWeight(1);
        p.bezier(bp.x1, bp.y1, bp.cx1, bp.cy1, bp.cx2, bp.cy2, bp.x2, bp.y2);
      }
    }

    // Title text
    function drawTitle(p, w, t) {
      // "AIFIGHTER" at top
      p.textAlign(p.CENTER, p.TOP);
      p.textFont('Space Grotesk, Arial Black, sans-serif');
      p.textStyle(p.BOLD);
      p.textSize(11);
      p.fill(DIM[0], DIM[1], DIM[2], 150);
      p.text('— NEURAL COMBAT —', w / 2, 14);
    }

    // Bottom "READY" bar
    function drawReadyBar(p, w, h, t) {
      var barY = h - 36;
      var pulse = 0.7 + 0.3 * Math.sin(t * 2);

      // Bar background
      p.noStroke();
      p.fill(VOID[0], VOID[1], VOID[2], 200);
      p.rect(0, barY - 4, w, 40);
      p.stroke(BORDER[0], BORDER[1], BORDER[2], 60);
      p.strokeWeight(1);
      p.line(0, barY - 4, w, barY - 4);

      // "READY TO FIGHT" text
      p.noStroke();
      p.fill(SYNAPSE[0], SYNAPSE[1], SYNAPSE[2], 180 * pulse);
      p.textAlign(p.CENTER, p.CENTER);
      p.textSize(12);
      p.textFont('JetBrains Mono, Consolas, monospace');
      p.textStyle(p.NORMAL);
      p.text('▸ READY TO FIGHT ◂', w / 2, barY + 12);
    }

    // p5 instance mode
    var sketch = function(p) {
      var fighter1, fighter2;
      var cw, ch;

      p.setup = function() {
        var container = document.getElementById('arena-cutscene');
        cw = Math.min(container.offsetWidth, 1100);
        ch = 300;
        var canvas = p.createCanvas(cw, ch);
        canvas.parent('arena-cutscene');
        canvas.style('border-radius', '12px');
        canvas.style('border', '1px solid #252540');
        p.pixelDensity(2);

        fighter1 = new Fighter(cw * 0.28, ch * 0.45, 1, SYNAPSE, 'VOLT-9');
        fighter2 = new Fighter(cw * 0.72, ch * 0.45, -1, COMBAT, 'RAZR-X');

        initBgPaths(cw, ch);
      };

      p.draw = function() {
        var t = p.millis() / 1000;

        // Void background
        p.background(VOID[0], VOID[1], VOID[2]);

        // Background elements
        drawVoidGrid(p, cw, ch, t);
        drawBgPaths(p, t);

        // Title
        drawTitle(p, cw, t);

        // Fighters
        fighter1.update(p, t);
        fighter2.update(p, t);
        fighter1.draw(p, t, 0);
        fighter2.draw(p, t, Math.PI);

        // Clash energy between them
        drawClashEnergy(p, fighter1, fighter2, t);

        // Ready bar
        drawReadyBar(p, cw, ch, t);
      };

      p.windowResized = function() {
        var container = document.getElementById('arena-cutscene');
        cw = Math.min(container.offsetWidth, 1100);
        p.resizeCanvas(cw, 300);
        fighter1.x = cw * 0.28;
        fighter2.x = cw * 0.72;
        bgPaths = [];
        initBgPaths(cw, 300);
      };
    };

    // Check for reduced motion preference
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      new p5(sketch);
    } else {
      // Static fallback
      var container = document.getElementById('arena-cutscene');
      container.innerHTML = '<div style="background:#06060C;border:1px solid #252540;border-radius:12px;height:300px;display:flex;align-items:center;justify-content:center;gap:48px;font-family:Space Grotesk,sans-serif;"><div style="text-align:center"><div style="font-size:28px;font-weight:700;color:#00FFAA;text-transform:uppercase">VOLT-9</div><div style="font-size:12px;color:#555570;margin-top:4px">Synapse Fighter</div></div><div style="font-size:18px;font-weight:700;color:#555570">VS</div><div style="text-align:center"><div style="font-size:28px;font-weight:700;color:#FF2D55;text-transform:uppercase">RAZR-X</div><div style="font-size:12px;color:#555570;margin-top:4px">Combat Fighter</div></div></div>';
    }
  })();
  </script>

  <div id="root"></div>
  <script type="text/babel">
    StyleGuide.unpack();

    function App() {
      return (
        <div className="sg-container">

          {/* Sticky section navigation */}
          <nav className="sg-nav" aria-label="Style guide sections">
            <a href="#tokens">Tokens</a>
            <a href="#colors">Colors</a>
            <a href="#typography">Type</a>
            <a href="#spacing">Spacing</a>
            <a href="#buttons">Buttons</a>
            <a href="#inputs">Inputs</a>
            <a href="#navigation">Nav</a>
            <a href="#status">Status</a>
            <a href="#cards">Cards</a>
            <a href="#components">Core</a>
            <a href="#project-components">Game</a>
            <a href="#screens">Screens</a>
          </nav>

          <StyleGuideStyleCard
            title="AI<span style='color:var(--synapse);text-shadow:var(--text-glow-synapse)'>FIGHTER</span>"
            subtitle="Neural Combat &middot; Style System"
            epigraph="Your fighter's intelligence is your intelligence, visualized as a living decision network you can watch, tweak, and evolve. Wins feel earned because you engineered the strategy."
            seal="&#x2B21;"
            colors={['#00FFAA', '#FF2D55', '#2979FF', '#FFB300', '#06060C']}
            meta={[
              { label: 'Typefaces', value: 'Space Grotesk + DM Sans + JetBrains Mono' },
              { label: 'Grid', value: '8px base \u00b7 mobile-first \u00b7 bento layout' },
              { label: 'Border Radius', value: '8\u201312px' },
              { label: 'Philosophy', value: 'Every color maps to a game concept. Nothing decorative.' },
            ]}
          />

          <StyleGuideProductBranding
            name="AI Fighter"
            intent="Bespoke dark-interface system where visual intensity scales with player context \u2014 clean precision in the graph editor, high-energy spectacle in battle arenas."
            perception="Electric, competitive, intelligent. Players should feel like they're engineering something alive \u2014 not filling out forms."
            audience="Tech-savvy gamers (24-31) who watch 3Blue1Brown, have opinions about activation functions, and want mobile games that reward thinking over grinding."
            tone="Direct, confident, game-literate. Uppercase display type for energy. Monospace data for precision. No corporate softness."
            keywords={['Neural', 'Competitive', 'Engineered', 'Electric', 'Precision', 'Alive']}
            logo={
              <div style={{ fontFamily: 'var(--font-display)', fontSize: 28, fontWeight: 700, letterSpacing: '-0.03em', textTransform: 'uppercase' }}>
                <span style={{ color: 'var(--text-primary)' }}>AI</span><span style={{ color: 'var(--synapse)', textShadow: 'var(--text-glow-synapse)' }}>FIGHTER</span>
              </div>
            }
          />

          {/* ── 01 · Design Tokens ── */}
          <section className="sg-section" id="tokens">

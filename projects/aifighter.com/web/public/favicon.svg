<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 32 32" width="32" height="32">

  <!--
    Favicon variant — simplified for 16-32px
    Dark background with color clash mark
    Center node dropped (too small to read)
  -->

  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#0A0A0F"/>

  <!-- Left chevron — aggression (hot pink) -->
  <polygon points="5,16 14,4 14,28" fill="#FF3366"/>

  <!-- Right chevron — intelligence (electric mint) -->
  <polygon points="27,16 18,4 18,28" fill="#00FFAA"/>

</svg>

<!DOCTYPE html>
<html>
<head>
<style>
body { background: #09090b; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
svg { max-width: 1400px; width: 100%; }
</style>
</head>
<body>
<svg viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,202,2,0.03)" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1440" height="900" fill="url(#grid)"/>

  <!-- ════════════════════════════════════════════════ -->
  <!-- ORIGIN PAD (top-left) -->
  <!-- ════════════════════════════════════════════════ -->
  <circle cx="40" cy="70" r="6" fill="rgba(255,202,2,0.12)" stroke="rgba(255,202,2,0.5)" stroke-width="2"/>
  <circle cx="40" cy="70" r="2.5" fill="rgba(255,202,2,0.7)"/>

  <!-- ════════════════════════════════════════════════ -->
  <!-- 1. ORIGIN → RIGHT through R1 → T-junction (440,70) -->
  <!-- ════════════════════════════════════════════════ -->
  <path d="M 40 70 L 76 70" stroke="rgba(255,202,2,0.45)" stroke-width="2"/>
  <!-- R1 inline: leads 76→120 -->
  <path d="M 76 70 L 82 70 L 85 63 L 91 77 L 97 63 L 103 77 L 109 63 L 112 70 L 120 70" stroke="rgba(255,202,2,0.4)" stroke-width="1.8" fill="none"/>
  <path d="M 120 70 L 440 70" stroke="rgba(255,202,2,0.45)" stroke-width="2"/>
  <!-- T-junction via at (440,70) -->
  <circle cx="440" cy="70" r="4" fill="rgba(255,202,2,0.08)" stroke="rgba(255,202,2,0.45)" stroke-width="1.2"/>
  <circle cx="440" cy="70" r="1.8" fill="rgba(255,202,2,0.6)"/>

  <!-- ════════════════════════════════════════════════ -->
  <!-- FORK A: RIGHT from (440,70) → C1 → IC → down right side -->
  <!-- ════════════════════════════════════════════════ -->
  <path d="M 440 70 L 600 70" stroke="rgba(255,202,2,0.35)" stroke-width="1.8"/>
  <!-- C1 inline: leads 600→626 -->
  <path d="M 600 70 L 609 70 M 609 62 L 609 78 M 615 62 L 615 78 M 615 70 L 626 70" stroke="rgba(255,202,2,0.4)" stroke-width="1.8" fill="none"/>
  <!-- Trace to IC chip (inline on horizontal path) -->
  <path d="M 626 70 L 880 70" stroke="rgba(255,202,2,0.3)" stroke-width="1.8"/>

  <!-- IC CHIP: small, inline. Left pins at x=880, right pins at x=920 -->
  <rect x="880" y="55" width="40" height="30" rx="2" fill="rgba(255,202,2,0.03)" stroke="rgba(255,202,2,0.35)" stroke-width="1.2"/>
  <!-- Left pins -->
  <line x1="872" y1="63" x2="880" y2="63" stroke="rgba(255,202,2,0.3)" stroke-width="1.2"/>
  <line x1="872" y1="70" x2="880" y2="70" stroke="rgba(255,202,2,0.3)" stroke-width="1.2"/>
  <line x1="872" y1="77" x2="880" y2="77" stroke="rgba(255,202,2,0.3)" stroke-width="1.2"/>
  <!-- Right pins -->
  <line x1="920" y1="63" x2="928" y2="63" stroke="rgba(255,202,2,0.3)" stroke-width="1.2"/>
  <line x1="920" y1="70" x2="928" y2="70" stroke="rgba(255,202,2,0.3)" stroke-width="1.2"/>
  <line x1="920" y1="77" x2="928" y2="77" stroke="rgba(255,202,2,0.3)" stroke-width="1.2"/>
  <!-- Trunk enters IC left pin 2 (y=70) inline -->
  <path d="M 880 70 L 872 70" stroke="rgba(255,202,2,0.35)" stroke-width="1.2"/>
  <!-- Left pin 1 → up to top area -->
  <path d="M 872 63 L 860 63 L 860 40 L 700 40" stroke="rgba(255,202,2,0.15)" stroke-width="1"/>
  <!-- Left pin 3 → short stub down with terminating pad -->
  <path d="M 872 77 L 860 77 L 860 100" stroke="rgba(255,202,2,0.15)" stroke-width="1"/>
  <circle cx="860" cy="100" r="2.5" fill="rgba(255,202,2,0.06)" stroke="rgba(255,202,2,0.25)" stroke-width="0.8"/>
  <circle cx="860" cy="100" r="1" fill="rgba(255,202,2,0.4)"/>
  <!-- IC right pin 2 → main trunk continues right → down right spine -->
  <path d="M 928 70 L 1300 70 L 1300 250" stroke="rgba(255,202,2,0.3)" stroke-width="1.8"/>
  <!-- IC right pin 1 → Card 2 area -->
  <path d="M 928 63 L 1000 63 L 1000 250 L 760 250" stroke="rgba(255,202,2,0.25)" stroke-width="1.2"/>
  <!-- Pad at Card 2 entry -->
  <circle cx="760" cy="250" r="5" fill="rgba(255,202,2,0.08)" stroke="rgba(255,202,2,0.4)" stroke-width="1.2"/>
  <circle cx="760" cy="250" r="2" fill="rgba(255,202,2,0.6)"/>
  <!-- IC right pin 3 → now routed to AND gate input 2 (see AND gate section) -->
  <!-- Via at right spine start -->
  <circle cx="1300" cy="250" r="3.5" fill="rgba(255,202,2,0.06)" stroke="rgba(255,202,2,0.3)" stroke-width="1"/>
  <circle cx="1300" cy="250" r="1.5" fill="rgba(255,202,2,0.5)"/>

  <!-- RIGHT SPINE: down from (1300,250) → Card 2 branch → R2 → Card 4 branch → OR → Card 6 -->
  <!-- Branch to Card 2 -->
  <path d="M 1300 250 L 1240 250" stroke="rgba(255,202,2,0.4)" stroke-width="2"/>
  <circle cx="1240" cy="250" r="5" fill="rgba(255,202,2,0.08)" stroke="rgba(255,202,2,0.4)" stroke-width="1.2"/>
  <circle cx="1240" cy="250" r="2" fill="rgba(255,202,2,0.6)"/>
  <!-- Trace through Card 2 → center vertical -->
  <path d="M 1240 250 L 1240 290 L 700 290" stroke="rgba(255,202,2,0.12)" stroke-width="1"/>

  <!-- Right spine continues down through R2 -->
  <path d="M 1300 250 L 1300 400" stroke="rgba(255,202,2,0.25)" stroke-width="1.8"/>
  <!-- R2 inline at y=410 -->
  <path d="M 1300 400 L 1300 406 L 1306 408 L 1294 412 L 1306 416 L 1294 420 L 1306 424 L 1300 426 L 1300 435" stroke="rgba(255,202,2,0.35)" stroke-width="1.5" fill="none"/>
  <!-- Branch to Card 4 -->
  <path d="M 1300 435 L 1300 450 L 1240 450" stroke="rgba(255,202,2,0.4)" stroke-width="2"/>
  <circle cx="1240" cy="450" r="5" fill="rgba(255,202,2,0.08)" stroke="rgba(255,202,2,0.4)" stroke-width="1.2"/>
  <circle cx="1240" cy="450" r="2" fill="rgba(255,202,2,0.6)"/>
  <!-- Trace through Card 4 → center vertical -->
  <path d="M 1240 450 L 1240 480 L 700 480" stroke="rgba(255,202,2,0.12)" stroke-width="1"/>

  <!-- Right spine → stops at input 1 (y=640). Input 2 fed separately from NOT gate below. -->
  <path d="M 1300 450 L 1300 640" stroke="rgba(255,202,2,0.2)" stroke-width="1.8"/>
  <!-- OR GATE: two separate input leads with visible gap between them -->
  <!-- Input 1: from spine above → right-angle into gate -->
  <path d="M 1300 640 L 1235 640" stroke="rgba(255,202,2,0.35)" stroke-width="1.5"/>
  <!-- Input 2: from NOT gate below (1300,700→1300,660) → into gate (separate wire, no bridge to input 1) -->
  <path d="M 1300 660 L 1235 660" stroke="rgba(255,202,2,0.35)" stroke-width="1.5"/>
  <!-- OR gate body (facing LEFT: flat right at x=1240, curved left at x≈1208) -->
  <path d="M 1240 630 L 1240 670" stroke="rgba(255,202,2,0.4)" stroke-width="1.5"/>
  <path d="M 1240 670 Q 1222 670 1208 650 Q 1222 630 1240 630" stroke="rgba(255,202,2,0.4)" stroke-width="1.5" fill="rgba(255,202,2,0.02)"/>
  <!-- Back curve -->
  <path d="M 1240 630 Q 1232 650 1240 670" stroke="rgba(255,202,2,0.3)" stroke-width="1.2"/>
  <!-- OR output: left from tip → pad -->
  <path d="M 1208 650 L 1160 650" stroke="rgba(255,202,2,0.45)" stroke-width="2"/>
  <circle cx="1160" cy="650" r="5" fill="rgba(255,202,2,0.08)" stroke="rgba(255,202,2,0.4)" stroke-width="1.2"/>
  <circle cx="1160" cy="650" r="2" fill="rgba(255,202,2,0.6)"/>
  <!-- Trace through Card 6 → center vertical -->
  <path d="M 1160 650 L 1160 680 L 700 680" stroke="rgba(255,202,2,0.12)" stroke-width="1"/>

  <!-- ════════════════════════════════════════════════ -->
  <!-- FORK B: DOWN from T-junction (440,70) → left side → cards 1,3,5 -->
  <!-- ════════════════════════════════════════════════ -->
  <path d="M 440 70 L 440 140 L 160 140 L 160 250" stroke="rgba(255,202,2,0.35)" stroke-width="1.8"/>
  <!-- Via at (160,140) turn -->
  <circle cx="160" cy="140" r="3.5" fill="rgba(255,202,2,0.06)" stroke="rgba(255,202,2,0.3)" stroke-width="1"/>
  <circle cx="160" cy="140" r="1.5" fill="rgba(255,202,2,0.5)"/>

  <!-- Branch to Card 1 -->
  <path d="M 160 250 L 200 250" stroke="rgba(255,202,2,0.45)" stroke-width="2"/>
  <circle cx="200" cy="250" r="5" fill="rgba(255,202,2,0.08)" stroke="rgba(255,202,2,0.4)" stroke-width="1.2"/>
  <circle cx="200" cy="250" r="2" fill="rgba(255,202,2,0.6)"/>
  <!-- Trace through Card 1 → center vertical -->
  <path d="M 200 250 L 200 280 L 700 280" stroke="rgba(255,202,2,0.12)" stroke-width="1"/>

  <!-- Left spine continues down through R3 -->
  <path d="M 160 250 L 160 380" stroke="rgba(255,202,2,0.25)" stroke-width="1.8"/>
  <!-- R3 -->
  <path d="M 160 380 L 160 386 L 166 388 L 154 392 L 166 396 L 154 400 L 166 404 L 160 406 L 160 420" stroke="rgba(255,202,2,0.35)" stroke-width="1.5" fill="none"/>
  <!-- Gap: trace from R3 end down to AND gate area -->
  <path d="M 160 420 L 160 460" stroke="rgba(255,202,2,0.25)" stroke-width="1.5"/>
  <!-- Via at junction before AND gate -->

  <!-- Traces through Card 3 → from AND output pad (300,480) → center vertical -->
  <path d="M 300 480 L 700 480" stroke="rgba(255,202,2,0.12)" stroke-width="1"/>
  <path d="M 300 480 L 300 435 L 700 435" stroke="rgba(255,202,2,0.1)" stroke-width="0.8"/>

  <!-- AND GATE: two inputs from different sources -->
  <!-- Input 1: from spine via at y=460, drops to y=473, turns right into gate -->
  <path d="M 160 460 L 160 473 L 225 473" stroke="rgba(255,202,2,0.35)" stroke-width="1.5"/>
  <!-- Input 2: from IC right pin 3 → drops to y=260 → long horizontal left → drops down left side → into gate -->
  <path d="M 928 77 L 928 260 L 100 260 L 100 487 L 225 487" stroke="rgba(255,202,2,0.2)" stroke-width="1"/>
  <!-- AND body (facing RIGHT: flat left at x=220, y=460→500, curved right at x≈258) -->
  <path d="M 220 460 L 220 500 L 238 500 A 20 20 0 0 0 238 460 Z" stroke="rgba(255,202,2,0.4)" stroke-width="1.5" fill="rgba(255,202,2,0.02)"/>
  <!-- AND output at x≈258, y=480 → right to pad -->
  <path d="M 258 480 L 300 480" stroke="rgba(255,202,2,0.45)" stroke-width="2"/>
  <circle cx="300" cy="480" r="5" fill="rgba(255,202,2,0.08)" stroke="rgba(255,202,2,0.4)" stroke-width="1.2"/>
  <circle cx="300" cy="480" r="2" fill="rgba(255,202,2,0.6)"/>

  <!-- AND output forks from pad down → routes below gate → C2 → Card 5 -->
  <path d="M 300 480 L 300 530 L 80 530 L 80 590" stroke="rgba(255,202,2,0.25)" stroke-width="1.5"/>
  <!-- C2 inline at y=600 -->
  <path d="M 80 590 L 80 597 M 72 597 L 88 597 M 72 603 L 88 603 M 80 603 L 80 610" stroke="rgba(255,202,2,0.35)" stroke-width="1.5" fill="none"/>
  <path d="M 80 610 L 80 650 L 200 650" stroke="rgba(255,202,2,0.4)" stroke-width="2"/>
  <circle cx="200" cy="650" r="5" fill="rgba(255,202,2,0.08)" stroke="rgba(255,202,2,0.4)" stroke-width="1.2"/>
  <circle cx="200" cy="650" r="2" fill="rgba(255,202,2,0.6)"/>
  <!-- Trace through Card 5 → center vertical -->
  <path d="M 200 650 L 200 670 L 700 670" stroke="rgba(255,202,2,0.12)" stroke-width="1"/>

  <!-- ════════════════════════════════════════════════ -->
  <!-- CENTER LINK: from Card 5 side → NOT gate → feeds OR 2nd input -->
  <!-- ════════════════════════════════════════════════ -->
  <path d="M 700 670 L 700 690 L 700 700 L 710 700" stroke="rgba(255,202,2,0.2)" stroke-width="1.2"/>
  <!-- NOT gate at (710,700) facing right -->
  <path d="M 710 693 L 724 700 L 710 707 Z" stroke="rgba(255,202,2,0.4)" stroke-width="1.2" fill="rgba(255,202,2,0.02)"/>
  <circle cx="727" cy="700" r="2.5" stroke="rgba(255,202,2,0.4)" stroke-width="1" fill="none"/>
  <!-- NOT output → right to OR gate 2nd input -->
  <path d="M 730 700 L 1300 700 L 1300 660" stroke="rgba(255,202,2,0.25)" stroke-width="1.5"/>

  <!-- ════════════════════════════════════════════════ -->
  <!-- BOTTOM RETURN: closes loop from Card 5 area down and across -->
  <!-- ════════════════════════════════════════════════ -->
  <path d="M 80 650 L 80 830 L 280 830" stroke="rgba(255,202,2,0.15)" stroke-width="1.2"/>
  <!-- R4 -->
  <path d="M 280 830 L 286 830 L 288 823 L 294 837 L 300 823 L 306 837 L 312 823 L 314 830 L 330 830" stroke="rgba(255,202,2,0.25)" stroke-width="1.2" fill="none"/>
  <path d="M 330 830 L 680 830" stroke="rgba(255,202,2,0.15)" stroke-width="1.2"/>
  <!-- C3 -->
  <path d="M 680 830 L 689 830 M 689 823 L 689 837 M 695 823 L 695 837 M 695 830 L 710 830" stroke="rgba(255,202,2,0.25)" stroke-width="1.2" fill="none"/>
  <path d="M 710 830 L 1300 830 L 1300 700" stroke="rgba(255,202,2,0.15)" stroke-width="1.2"/>
  <!-- End pad -->
  <circle cx="1300" cy="830" r="5" fill="rgba(255,202,2,0.08)" stroke="rgba(255,202,2,0.3)" stroke-width="1.2"/>
  <circle cx="1300" cy="830" r="2" fill="rgba(255,202,2,0.5)"/>

  <!-- ════════════════════════════════════════════════ -->
  <!-- CENTER VERTICAL: connects all through-card traces -->
  <!-- ════════════════════════════════════════════════ -->
  <path d="M 700 40 L 700 700" stroke="rgba(255,202,2,0.1)" stroke-width="1"/>
  <!-- Vias only where traces actually connect -->
  <circle cx="700" cy="280" r="2" fill="rgba(255,202,2,0.04)" stroke="rgba(255,202,2,0.2)" stroke-width="0.8"/>
  <circle cx="700" cy="290" r="2" fill="rgba(255,202,2,0.04)" stroke="rgba(255,202,2,0.2)" stroke-width="0.8"/>
  <circle cx="700" cy="435" r="2" fill="rgba(255,202,2,0.04)" stroke="rgba(255,202,2,0.2)" stroke-width="0.8"/>
  <circle cx="700" cy="480" r="2" fill="rgba(255,202,2,0.04)" stroke="rgba(255,202,2,0.2)" stroke-width="0.8"/>
  <circle cx="700" cy="670" r="2" fill="rgba(255,202,2,0.04)" stroke="rgba(255,202,2,0.2)" stroke-width="0.8"/>
  <circle cx="700" cy="680" r="2" fill="rgba(255,202,2,0.04)" stroke="rgba(255,202,2,0.2)" stroke-width="0.8"/>
</svg>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noizu Intellect — Multi-Agent Architecture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #09090b;
      --surface: rgba(255,255,255,0.03);
      --surface-hover: rgba(255,255,255,0.06);
      --border: rgba(255,255,255,0.06);
      --border-hover: rgba(255,202,2,0.15);
      --text-primary: #f4f4f5;
      --text-secondary: #d4d4d8;
      --text-tertiary: #a1a1aa;
      --text-muted: #71717a;
      --gold-400: #ffca02;
      --gold-500: #f0b400;
      --gold-600: #cc8a00;
      --success: #4ade80;
      --warning: #facc15;
      --error: #f87171;
      --info: #60a5fa;
      --font-sans: 'Inter', -apple-system, system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
    }

    html { -webkit-font-smoothing: antialiased; }
    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: var(--font-sans);
      overflow: hidden;
      height: 100vh;
    }
    ::selection { background: rgba(255,202,2,0.3); color: #fff; }

    /* Layout */
    .app {
      display: grid;
      grid-template-columns: 240px 1fr 260px;
      grid-template-rows: 48px 1fr 140px;
      height: 100vh;
      gap: 1px;
      background: rgba(255,255,255,0.04);
    }

    /* Header */
    .header {
      grid-column: 1 / -1;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-bottom: 1px solid var(--border);
    }
    .header-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }
    .header-title span { color: var(--gold-400); }
    .header-badge {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-muted);
      background: var(--surface);
      padding: 3px 10px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }
    .header-status {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-tertiary);
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }
    .status-dot.active { background: var(--success); box-shadow: 0 0 8px rgba(74,222,128,0.4); }
    .status-dot.warning { background: var(--warning); }

    /* Sidebar */
    .sidebar {
      background: var(--bg);
      padding: 16px;
      overflow-y: auto;
      border-right: 1px solid var(--border);
    }
    .sidebar-right {
      background: var(--bg);
      padding: 16px;
      overflow-y: auto;
      border-left: 1px solid var(--border);
    }
    .sidebar-section {
      margin-bottom: 20px;
    }
    .sidebar-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--gold-400);
      margin-bottom: 10px;
    }

    /* Agent list */
    .agent-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 6px;
      margin-bottom: 2px;
      cursor: pointer;
      transition: background 150ms;
      font-size: 12px;
      color: var(--text-secondary);
    }
    .agent-item:hover {
      background: var(--surface-hover);
      color: var(--text-primary);
    }
    .agent-item.selected {
      background: rgba(255,202,2,0.08);
      border: 1px solid rgba(255,202,2,0.12);
      color: var(--gold-400);
    }
    .agent-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .agent-type {
      font-size: 10px;
      font-family: var(--font-mono);
      color: var(--text-muted);
      margin-left: auto;
    }

    /* Main graph area */
    .graph-area {
      background: var(--bg);
      position: relative;
      overflow: hidden;
    }
    .graph-area svg {
      width: 100%;
      height: 100%;
    }

    /* D3 node styles */
    .node-group { cursor: pointer; }
    .node-group:hover .node-box { stroke: var(--gold-400); stroke-opacity: 0.5; }
    .node-group:hover .node-label { fill: #fff; }
    .node-group.selected .node-box { stroke: var(--gold-400); stroke-opacity: 0.8; stroke-width: 2; }
    .node-group.selected .node-glow { opacity: 0.15; }

    .node-box {
      fill: rgba(255,255,255,0.03);
      stroke: rgba(255,255,255,0.08);
      stroke-width: 1;
      rx: 8;
      transition: stroke 200ms, stroke-opacity 200ms;
    }
    .node-box.supervisor {
      fill: rgba(255,202,2,0.06);
      stroke: rgba(255,202,2,0.2);
    }
    .node-box.coordinator {
      fill: rgba(255,202,2,0.04);
      stroke: rgba(255,202,2,0.12);
    }

    .node-glow {
      fill: var(--gold-400);
      opacity: 0;
      filter: blur(20px);
      transition: opacity 300ms;
    }

    .node-label {
      fill: var(--text-secondary);
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 600;
      text-anchor: middle;
      transition: fill 200ms;
    }
    .node-sublabel {
      fill: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 9px;
      text-anchor: middle;
    }
    .node-status-dot {
      r: 4;
      transition: fill 300ms;
    }

    .link-line {
      stroke: rgba(255,202,2,0.08);
      stroke-width: 1;
      fill: none;
      transition: stroke-opacity 300ms;
    }
    .link-line.active {
      stroke: rgba(255,202,2,0.25);
      stroke-width: 1.5;
    }

    /* Animated data pulse along links */
    .data-pulse {
      fill: var(--gold-400);
      opacity: 0;
    }

    /* Bottom panel */
    .bottom-panel {
      grid-column: 1 / -1;
      background: var(--bg);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
    }
    .log-panel {
      padding: 12px 16px;
      overflow-y: auto;
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 1.8;
    }
    .log-entry {
      display: flex;
      gap: 8px;
      color: var(--text-muted);
    }
    .log-time { color: var(--text-muted); min-width: 70px; }
    .log-source { color: var(--gold-400); min-width: 100px; }
    .log-msg { color: var(--text-tertiary); }
    .log-entry.error .log-msg { color: var(--error); }
    .log-entry.success .log-msg { color: var(--success); }

    .metrics-panel {
      padding: 12px 16px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      align-content: start;
    }
    .metric-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
    }
    .metric-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .metric-value {
      font-size: 20px;
      font-weight: 700;
      font-family: var(--font-mono);
    }
    .metric-value.gold { color: var(--gold-400); }
    .metric-value.green { color: var(--success); }
    .metric-delta {
      font-size: 10px;
      font-family: var(--font-mono);
      margin-top: 2px;
    }
    .metric-delta.up { color: var(--success); }
    .metric-delta.down { color: var(--error); }

    /* Tooltip */
    .tooltip {
      position: absolute;
      background: rgba(9,9,11,0.95);
      border: 1px solid var(--border-hover);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 12px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 150ms;
      z-index: 100;
      max-width: 280px;
      backdrop-filter: blur(12px);
    }
    .tooltip.visible { opacity: 1; }
    .tooltip-title {
      font-weight: 600;
      color: var(--gold-400);
      margin-bottom: 4px;
    }
    .tooltip-desc {
      color: var(--text-tertiary);
      font-size: 11px;
      line-height: 1.5;
    }
    .tooltip-stats {
      margin-top: 8px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      font-family: var(--font-mono);
      font-size: 10px;
    }
    .tooltip-stat-label { color: var(--text-muted); }
    .tooltip-stat-value { color: var(--text-secondary); text-align: right; }

    /* DNA Inheritance visualization */
    .dna-strand {
      display: flex;
      gap: 2px;
      margin-bottom: 8px;
    }
    .dna-block {
      width: 12px;
      height: 20px;
      border-radius: 2px;
      opacity: 0.6;
    }

    /* Session indicators */
    .session-bar {
      display: flex;
      gap: 4px;
      margin-top: 8px;
    }
    .session-dot {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 150ms;
    }
    .session-dot:hover { transform: scale(1.2); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div style="display:flex;align-items:center;gap:16px;">
        <h1 class="header-title">System Architecture: <span>Hierarchical Multi-Agent View</span></h1>
        <span class="header-badge">v3.2.1</span>
      </div>
      <div class="header-status">
        <div class="status-pill"><div class="status-dot active"></div> System Online</div>
        <div class="status-pill"><div class="status-dot warning"></div> 3 Pending</div>
        <span class="header-badge" id="clock">00:00:00</span>
      </div>
    </header>

    <!-- Left Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-label">Agent Status</div>
        <div id="agent-list"></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">System Metrics</div>
        <div id="sidebar-metrics"></div>
      </div>
    </aside>

    <!-- Main Graph -->
    <main class="graph-area" id="graph-area">
      <svg id="graph-svg"></svg>
      <div class="tooltip" id="tooltip">
        <div class="tooltip-title" id="tooltip-title"></div>
        <div class="tooltip-desc" id="tooltip-desc"></div>
        <div class="tooltip-stats" id="tooltip-stats"></div>
      </div>
    </main>

    <!-- Right Sidebar -->
    <aside class="sidebar-right">
      <div class="sidebar-section">
        <div class="sidebar-label">Active Sessions</div>
        <div class="session-bar" id="sessions"></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">DNA Inheritance</div>
        <div id="dna-view"></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">Message Flow</div>
        <div id="flow-stats" style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);line-height:1.8;"></div>
      </div>
    </aside>

    <!-- Bottom Panel -->
    <div class="bottom-panel">
      <div class="log-panel" id="log-panel">
        <div class="sidebar-label" style="margin-bottom:8px;">Live Message Log</div>
      </div>
      <div class="metrics-panel" id="metrics-panel"></div>
    </div>
  </div>

  <script>
    // ═══════════════════════════════════════════
    // DATA MODEL
    // ═══════════════════════════════════════════
    const agents = [
      {
        id: "supervisor", label: "System Supervisor", type: "supervisor",
        desc: "Orchestrates all agent activity, manages task delegation and priority queues.",
        tier: 0, status: "active",
        stats: { tasks: 142, uptime: "99.7%", latency: "12ms", memory: "2.1GB" }
      },
      {
        id: "research", label: "Research &\nKnowledge", type: "coordinator",
        desc: "Coordinates knowledge retrieval, document analysis, and information synthesis.",
        tier: 1, status: "active",
        stats: { tasks: 67, uptime: "99.2%", latency: "45ms", memory: "1.8GB" }
      },
      {
        id: "analysis", label: "Analysis &\nReasoning", type: "coordinator",
        desc: "Manages analytical pipelines, pattern recognition, and logical inference chains.",
        tier: 1, status: "active",
        stats: { tasks: 89, uptime: "99.5%", latency: "38ms", memory: "3.2GB" }
      },
      {
        id: "communication", label: "Communication\n& Output", type: "coordinator",
        desc: "Handles response formatting, channel routing, and output quality assurance.",
        tier: 1, status: "active",
        stats: { tasks: 53, uptime: "99.8%", latency: "22ms", memory: "1.2GB" }
      },
      {
        id: "knowledge-retrieval", label: "Knowledge\nRetrieval", type: "worker",
        desc: "RAG pipeline, vector search, document indexing.",
        tier: 2, parent: "research", status: "active",
        stats: { tasks: 34, uptime: "98.9%", latency: "120ms", memory: "4.1GB" }
      },
      {
        id: "protocol-spec", label: "Protocol\nSpec", type: "worker",
        desc: "NPL protocol parsing, prompt structure validation.",
        tier: 2, parent: "research", status: "idle",
        stats: { tasks: 12, uptime: "99.1%", latency: "15ms", memory: "0.8GB" }
      },
      {
        id: "processing", label: "Processing", type: "worker",
        desc: "Data transformation, normalization, and pipeline execution.",
        tier: 2, parent: "analysis", status: "active",
        stats: { tasks: 45, uptime: "99.3%", latency: "55ms", memory: "2.4GB" }
      },
      {
        id: "diagnostic", label: "Diagnostic", type: "worker",
        desc: "Error analysis, anomaly detection, self-healing routines.",
        tier: 2, parent: "analysis", status: "warning",
        stats: { tasks: 23, uptime: "97.8%", latency: "89ms", memory: "1.6GB" }
      },
      {
        id: "analytics", label: "Analytics", type: "worker",
        desc: "Metrics collection, trend analysis, performance profiling.",
        tier: 2, parent: "analysis", status: "active",
        stats: { tasks: 31, uptime: "99.6%", latency: "42ms", memory: "1.9GB" }
      },
      {
        id: "formatter", label: "Formatter", type: "worker",
        desc: "Response templating, markdown rendering, code formatting.",
        tier: 2, parent: "communication", status: "active",
        stats: { tasks: 28, uptime: "99.9%", latency: "8ms", memory: "0.6GB" }
      },
      {
        id: "interaction", label: "Interaction", type: "worker",
        desc: "User intent parsing, context management, session state.",
        tier: 2, parent: "communication", status: "active",
        stats: { tasks: 19, uptime: "99.4%", latency: "18ms", memory: "1.1GB" }
      },
      {
        id: "direct-link", label: "Direct Link", type: "worker",
        desc: "External API calls, webhook dispatch, real-time streams.",
        tier: 2, parent: "communication", status: "idle",
        stats: { tasks: 6, uptime: "98.5%", latency: "210ms", memory: "0.4GB" }
      },
    ];

    const links = [
      { source: "supervisor", target: "research", weight: 3 },
      { source: "supervisor", target: "analysis", weight: 4 },
      { source: "supervisor", target: "communication", weight: 3 },
      { source: "research", target: "knowledge-retrieval", weight: 2 },
      { source: "research", target: "protocol-spec", weight: 1 },
      { source: "analysis", target: "processing", weight: 3 },
      { source: "analysis", target: "diagnostic", weight: 2 },
      { source: "analysis", target: "analytics", weight: 2 },
      { source: "communication", target: "formatter", weight: 2 },
      { source: "communication", target: "interaction", weight: 2 },
      { source: "communication", target: "direct-link", weight: 1 },
      // Cross-links (data flow between branches)
      { source: "knowledge-retrieval", target: "processing", weight: 1, cross: true },
      { source: "analytics", target: "formatter", weight: 1, cross: true },
      { source: "diagnostic", target: "interaction", weight: 1, cross: true },
    ];

    const statusColors = {
      active: "#4ade80",
      idle: "#71717a",
      warning: "#facc15",
      error: "#f87171",
    };

    // ═══════════════════════════════════════════
    // GRAPH RENDERING
    // ═══════════════════════════════════════════
    const graphArea = document.getElementById("graph-area");
    const svg = d3.select("#graph-svg");
    const width = graphArea.clientWidth;
    const height = graphArea.clientHeight;

    svg.attr("viewBox", `0 0 ${width} ${height}`);

    // Defs for glow filter and arrow markers
    const defs = svg.append("defs");

    defs.append("filter")
      .attr("id", "glow")
      .append("feGaussianBlur")
      .attr("stdDeviation", "8")
      .attr("result", "blur");

    defs.append("marker")
      .attr("id", "arrowhead")
      .attr("viewBox", "0 0 10 10")
      .attr("refX", 5).attr("refY", 5)
      .attr("markerWidth", 6).attr("markerHeight", 6)
      .attr("orient", "auto")
      .append("path")
      .attr("d", "M 0 0 L 10 5 L 0 10 z")
      .attr("fill", "rgba(255,202,2,0.15)");

    // Layout: hierarchical tree positions
    const tierY = { 0: height * 0.15, 1: height * 0.42, 2: height * 0.72 };
    const nodeW = 120, nodeH = 50;

    // Position nodes
    function layoutNodes() {
      const cx = width / 2;
      // Supervisor
      agents[0].x = cx; agents[0].y = tierY[0];

      // Coordinators
      const coords = agents.filter(a => a.tier === 1);
      const coordSpacing = width * 0.28;
      coords.forEach((a, i) => {
        a.x = cx + (i - 1) * coordSpacing;
        a.y = tierY[1];
      });

      // Workers — group by parent
      const parents = ["research", "analysis", "communication"];
      parents.forEach(pid => {
        const parent = agents.find(a => a.id === pid);
        const children = agents.filter(a => a.parent === pid);
        const spacing = 130;
        const startX = parent.x - ((children.length - 1) * spacing) / 2;
        children.forEach((c, i) => {
          c.x = startX + i * spacing;
          c.y = tierY[2];
        });
      });
    }
    layoutNodes();

    // Build node map for links
    const nodeMap = {};
    agents.forEach(a => nodeMap[a.id] = a);

    // Draw grid background
    const gridG = svg.append("g").attr("class", "grid");
    for (let x = 0; x < width; x += 60) {
      gridG.append("line")
        .attr("x1", x).attr("y1", 0).attr("x2", x).attr("y2", height)
        .attr("stroke", "rgba(255,202,2,0.015)").attr("stroke-width", 1);
    }
    for (let y = 0; y < height; y += 60) {
      gridG.append("line")
        .attr("x1", 0).attr("y1", y).attr("x2", width).attr("y2", y)
        .attr("stroke", "rgba(255,202,2,0.015)").attr("stroke-width", 1);
    }

    // Draw links
    const linkG = svg.append("g").attr("class", "links");
    const linkElements = linkG.selectAll("path")
      .data(links)
      .enter()
      .append("path")
      .attr("class", d => `link-line ${d.cross ? "cross" : ""}`)
      .attr("d", d => {
        const s = nodeMap[d.source];
        const t = nodeMap[d.target];
        if (d.cross) {
          // Curved cross-links
          const mx = (s.x + t.x) / 2;
          const my = (s.y + t.y) / 2 - 30;
          return `M ${s.x} ${s.y + nodeH/2} Q ${mx} ${my} ${t.x} ${t.y - nodeH/2}`;
        }
        // Straight vertical links with slight curve
        return `M ${s.x} ${s.y + nodeH/2} C ${s.x} ${(s.y + t.y)/2} ${t.x} ${(s.y + t.y)/2} ${t.x} ${t.y - nodeH/2}`;
      })
      .style("stroke-dasharray", d => d.cross ? "4,4" : "none")
      .style("stroke-opacity", d => d.cross ? 0.4 : 1);

    // Animated data pulses along links
    const pulseG = svg.append("g").attr("class", "pulses");
    function createPulse(linkData) {
      const s = nodeMap[linkData.source];
      const t = nodeMap[linkData.target];
      const pulse = pulseG.append("circle")
        .attr("class", "data-pulse")
        .attr("r", 3)
        .attr("cx", s.x)
        .attr("cy", s.y + nodeH/2)
        .style("opacity", 0.8)
        .style("filter", "url(#glow)");

      pulse.transition()
        .duration(1200 + Math.random() * 800)
        .ease(d3.easeQuadInOut)
        .attr("cx", t.x)
        .attr("cy", t.y - nodeH/2)
        .style("opacity", 0)
        .remove();
    }

    // Periodically send pulses
    function schedulePulses() {
      const activeLinks = links.filter(l => !l.cross);
      setInterval(() => {
        const link = activeLinks[Math.floor(Math.random() * activeLinks.length)];
        createPulse(link);
      }, 800);
    }
    schedulePulses();

    // Draw nodes
    const nodeG = svg.append("g").attr("class", "nodes");
    const nodeGroups = nodeG.selectAll("g")
      .data(agents)
      .enter()
      .append("g")
      .attr("class", "node-group")
      .attr("transform", d => `translate(${d.x - nodeW/2}, ${d.y - nodeH/2})`)
      .on("click", function(event, d) {
        selectAgent(d.id);
      })
      .on("mouseenter", function(event, d) {
        showTooltip(event, d);
        // Highlight connected links
        linkElements.classed("active", l =>
          l.source === d.id || l.target === d.id
        );
      })
      .on("mouseleave", function() {
        hideTooltip();
        linkElements.classed("active", false);
      });

    // Glow behind selected/hovered nodes
    nodeGroups.append("rect")
      .attr("class", "node-glow")
      .attr("x", -10).attr("y", -10)
      .attr("width", nodeW + 20).attr("height", nodeH + 20)
      .attr("rx", 16)
      .style("filter", "url(#glow)");

    // Node box
    nodeGroups.append("rect")
      .attr("class", d => `node-box ${d.type}`)
      .attr("width", nodeW).attr("height", nodeH)
      .attr("rx", 8);

    // Node label (multi-line support)
    nodeGroups.each(function(d) {
      const g = d3.select(this);
      const lines = d.label.split("\n");
      const startY = nodeH/2 - (lines.length - 1) * 7;
      lines.forEach((line, i) => {
        g.append("text")
          .attr("class", "node-label")
          .attr("x", nodeW/2)
          .attr("y", startY + i * 14)
          .attr("dominant-baseline", "middle")
          .text(line);
      });
    });

    // Status dot
    nodeGroups.append("circle")
      .attr("class", "node-status-dot")
      .attr("cx", nodeW - 10)
      .attr("cy", 10)
      .attr("r", 4)
      .attr("fill", d => statusColors[d.status]);

    // Type badge
    nodeGroups.append("text")
      .attr("class", "node-sublabel")
      .attr("x", nodeW/2)
      .attr("y", nodeH + 14)
      .text(d => d.type);

    // ═══════════════════════════════════════════
    // SIDEBAR: AGENT LIST
    // ═══════════════════════════════════════════
    const agentList = document.getElementById("agent-list");
    agents.forEach(a => {
      const el = document.createElement("div");
      el.className = "agent-item";
      el.dataset.id = a.id;
      el.innerHTML = `
        <div class="agent-dot" style="background:${statusColors[a.status]};${a.status === 'active' ? 'box-shadow:0 0 6px ' + statusColors[a.status] + '60;' : ''}"></div>
        <span>${a.label.replace("\n", " ")}</span>
        <span class="agent-type">${a.type.slice(0,4)}</span>
      `;
      el.addEventListener("click", () => selectAgent(a.id));
      agentList.appendChild(el);
    });

    // ═══════════════════════════════════════════
    // SELECTION
    // ═══════════════════════════════════════════
    let selectedId = null;

    function selectAgent(id) {
      selectedId = selectedId === id ? null : id;

      // Update graph nodes
      nodeGroups.classed("selected", d => d.id === selectedId);

      // Update sidebar
      document.querySelectorAll(".agent-item").forEach(el => {
        el.classList.toggle("selected", el.dataset.id === selectedId);
      });

      // Update right sidebar with details
      updateRightSidebar(selectedId);
    }

    // ═══════════════════════════════════════════
    // TOOLTIP
    // ═══════════════════════════════════════════
    const tooltip = document.getElementById("tooltip");
    const tooltipTitle = document.getElementById("tooltip-title");
    const tooltipDesc = document.getElementById("tooltip-desc");
    const tooltipStats = document.getElementById("tooltip-stats");

    function showTooltip(event, d) {
      tooltipTitle.textContent = d.label.replace("\n", " ");
      tooltipDesc.textContent = d.desc;
      tooltipStats.innerHTML = Object.entries(d.stats).map(([k, v]) =>
        `<span class="tooltip-stat-label">${k}</span><span class="tooltip-stat-value">${v}</span>`
      ).join("");

      const rect = graphArea.getBoundingClientRect();
      let x = event.clientX - rect.left + 16;
      let y = event.clientY - rect.top - 10;
      if (x + 280 > rect.width) x = event.clientX - rect.left - 296;
      tooltip.style.left = x + "px";
      tooltip.style.top = y + "px";
      tooltip.classList.add("visible");
    }

    function hideTooltip() {
      tooltip.classList.remove("visible");
    }

    // ═══════════════════════════════════════════
    // RIGHT SIDEBAR
    // ═══════════════════════════════════════════
    // Sessions
    const sessionsEl = document.getElementById("sessions");
    const sessionColors = ["#4ade80", "#ffca02", "#60a5fa", "#f87171", "#4ade80", "#ffca02", "#a1a1aa", "#4ade80"];
    sessionColors.forEach((c, i) => {
      const dot = document.createElement("div");
      dot.className = "session-dot";
      dot.style.background = c + "20";
      dot.style.border = `1px solid ${c}40`;
      dot.style.color = c;
      dot.textContent = i + 1;
      sessionsEl.appendChild(dot);
    });

    // DNA Inheritance
    const dnaView = document.getElementById("dna-view");
    const dnaColors = ["#ffca02", "#f0b400", "#cc8a00", "#a16207", "#854d0e"];
    for (let row = 0; row < 3; row++) {
      const strand = document.createElement("div");
      strand.className = "dna-strand";
      for (let i = 0; i < 14; i++) {
        const block = document.createElement("div");
        block.className = "dna-block";
        const c = dnaColors[Math.floor(Math.random() * dnaColors.length)];
        block.style.background = c;
        block.style.opacity = 0.3 + Math.random() * 0.5;
        strand.appendChild(block);
      }
      dnaView.appendChild(strand);
    }

    // Flow stats
    const flowStats = document.getElementById("flow-stats");
    flowStats.innerHTML = `
      <div>Msgs/sec: <span style="color:var(--gold-400);">247</span></div>
      <div>Queue depth: <span style="color:var(--text-secondary);">12</span></div>
      <div>Avg latency: <span style="color:var(--success);">34ms</span></div>
      <div>Error rate: <span style="color:var(--success);">0.02%</span></div>
      <div>Throughput: <span style="color:var(--text-secondary);">1.2GB/s</span></div>
    `;

    function updateRightSidebar(id) {
      if (!id) return;
      const agent = agents.find(a => a.id === id);
      if (!agent) return;
      flowStats.innerHTML = `
        <div style="color:var(--gold-400);font-weight:600;margin-bottom:6px;">${agent.label.replace("\n", " ")}</div>
        <div>Tasks: <span style="color:var(--text-secondary);">${agent.stats.tasks}</span></div>
        <div>Uptime: <span style="color:var(--success);">${agent.stats.uptime}</span></div>
        <div>Latency: <span style="color:var(--text-secondary);">${agent.stats.latency}</span></div>
        <div>Memory: <span style="color:var(--text-secondary);">${agent.stats.memory}</span></div>
        <div>Status: <span style="color:${statusColors[agent.status]};">${agent.status}</span></div>
      `;
    }

    // ═══════════════════════════════════════════
    // BOTTOM: METRICS
    // ═══════════════════════════════════════════
    const metricsPanel = document.getElementById("metrics-panel");
    const metrics = [
      { label: "Active Agents", value: "9", cls: "gold", delta: "+2", dir: "up" },
      { label: "Tasks/min", value: "847", cls: "green", delta: "+12%", dir: "up" },
      { label: "Avg Latency", value: "34ms", cls: "", delta: "-8ms", dir: "up" },
      { label: "Error Rate", value: "0.02%", cls: "green", delta: "-0.01", dir: "up" },
    ];
    metrics.forEach(m => {
      const card = document.createElement("div");
      card.className = "metric-card";
      card.innerHTML = `
        <div class="metric-label">${m.label}</div>
        <div class="metric-value ${m.cls}">${m.value}</div>
        <div class="metric-delta ${m.dir}">${m.dir === 'up' ? '&#9650;' : '&#9660;'} ${m.delta}</div>
      `;
      metricsPanel.appendChild(card);
    });

    // ═══════════════════════════════════════════
    // BOTTOM: LOG
    // ═══════════════════════════════════════════
    const logPanel = document.getElementById("log-panel");
    const logMessages = [
      { time: "14:23:01", source: "Supervisor", msg: "Task #1847 delegated to Analysis pipeline", cls: "" },
      { time: "14:23:02", source: "Research", msg: "Knowledge retrieval complete — 12 documents indexed", cls: "success" },
      { time: "14:23:03", source: "Diagnostic", msg: "Memory threshold warning on worker-3", cls: "error" },
      { time: "14:23:04", source: "Processing", msg: "Batch transform complete: 2,847 records normalized", cls: "" },
      { time: "14:23:05", source: "Formatter", msg: "Response rendered — markdown + code blocks", cls: "success" },
      { time: "14:23:06", source: "Analytics", msg: "Trend analysis: throughput +12% over baseline", cls: "" },
      { time: "14:23:07", source: "Interaction", msg: "Session #5 context updated — 14 turns", cls: "" },
    ];
    logMessages.forEach(log => {
      const entry = document.createElement("div");
      entry.className = `log-entry ${log.cls}`;
      entry.innerHTML = `
        <span class="log-time">${log.time}</span>
        <span class="log-source">${log.source}</span>
        <span class="log-msg">${log.msg}</span>
      `;
      logPanel.appendChild(entry);
    });

    // ═══════════════════════════════════════════
    // SIDEBAR METRICS (sparklines)
    // ═══════════════════════════════════════════
    const sidebarMetrics = document.getElementById("sidebar-metrics");
    const sparkData = [
      { label: "CPU", value: "23%", color: "var(--success)" },
      { label: "MEM", value: "4.8GB", color: "var(--gold-400)" },
      { label: "NET", value: "1.2GB/s", color: "var(--info)" },
      { label: "DISK", value: "12%", color: "var(--text-muted)" },
    ];
    sparkData.forEach(s => {
      const row = document.createElement("div");
      row.style.cssText = "display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:11px;font-family:var(--font-mono);";
      row.innerHTML = `
        <span style="color:var(--text-muted);">${s.label}</span>
        <span style="color:${s.color};">${s.value}</span>
      `;
      sidebarMetrics.appendChild(row);
    });

    // ═══════════════════════════════════════════
    // CLOCK
    // ═══════════════════════════════════════════
    function updateClock() {
      const now = new Date();
      document.getElementById("clock").textContent =
        now.toLocaleTimeString("en-US", { hour12: false });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ═══════════════════════════════════════════
    // RESIZE
    // ═══════════════════════════════════════════
    window.addEventListener("resize", () => {
      const w = graphArea.clientWidth;
      const h = graphArea.clientHeight;
      svg.attr("viewBox", `0 0 ${w} ${h}`);
    });
  </script>
</body>
</html>

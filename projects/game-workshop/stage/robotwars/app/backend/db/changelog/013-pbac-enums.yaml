databaseChangeLog:
  - changeSet:
      id: 013-create-member-type-enum
      author: starter-scaffold
      changes:
        - sql:
            sql: |
              CREATE TYPE member_type_enum AS ENUM ('user', 'group');
      rollback:
        - sql:
            sql: DROP TYPE member_type_enum;

  - changeSet:
      id: 013-create-resource-type-enum
      author: starter-scaffold
      changes:
        - sql:
            sql: |
              CREATE TYPE resource_type_enum AS ENUM ('organization', 'project');
      rollback:
        - sql:
            sql: DROP TYPE resource_type_enum;

  - changeSet:
      id: 013-create-role-name-enum
      author: starter-scaffold
      changes:
        - sql:
            sql: |
              CREATE TYPE role_name_enum AS ENUM ('owner', 'admin', 'member', 'viewer');
      rollback:
        - sql:
            sql: DROP TYPE role_name_enum;

databaseChangeLog:
  - changeSet:
      id: create-table-seed-helper-records
      author: starter-scaffold
      changes:
        - createTable:
            tableName: seed_helper_records
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
              - column:
                  name: key
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: hash
                  type: varchar(255)
              - column:
                  name: inserted_at
                  type: timestamp
              - column:
                  name: updated_at
                  type: timestamp
      rollback:
        - dropTable:
            tableName: seed_helper_records

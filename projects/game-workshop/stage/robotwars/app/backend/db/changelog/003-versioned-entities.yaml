databaseChangeLog:
  - changeSet:
      id: create-table-versioned-strings
      author: starter-scaffold
      changes:
        - createTable:
            tableName: versioned_strings
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
              - column:
                  name: content
                  type: text
              - column:
                  name: deleted_at
                  type: timestamptz
              - column:
                  name: inserted_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: versioned_strings

  - changeSet:
      id: create-table-versioned-names
      author: starter-scaffold
      changes:
        - sql:
            sql: |
              CREATE TABLE versioned_names (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                first varchar(255),
                middle text[] DEFAULT '{}',
                last varchar(255),
                deleted_at timestamptz,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
      rollback:
        - dropTable:
            tableName: versioned_names

  - changeSet:
      id: create-table-versioned-descriptions
      author: starter-scaffold
      changes:
        - createTable:
            tableName: versioned_descriptions
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
              - column:
                  name: title
                  type: varchar(255)
              - column:
                  name: body
                  type: text
              - column:
                  name: deleted_at
                  type: timestamptz
              - column:
                  name: inserted_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: versioned_descriptions

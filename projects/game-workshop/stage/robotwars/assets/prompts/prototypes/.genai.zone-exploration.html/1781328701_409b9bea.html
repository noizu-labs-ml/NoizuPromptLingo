<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian - Zone Exploration</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Georgia',serif;background:#2d1f0e;color:#3d2b1a;min-height:100vh;overflow-x:hidden}
#app{display:flex;flex-direction:column;height:100vh;max-width:1200px;margin:0 auto;padding:8px;gap:8px}
#topbar{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#f5e6c8,#e8d5a3);border-radius:12px;padding:8px 14px;border:2px solid #c9a96e;flex-shrink:0}
#topbar h1{font-size:1.2em;color:#5c3d1e;letter-spacing:1px;flex:1}
.stat-box{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.4);border-radius:8px;padding:4px 10px;font-size:0.85em;color:#5c3d1e}
#energy-bar{width:100px;height:12px;background:#d4c09a;border-radius:6px;border:1px solid #b8964e;overflow:hidden}
#energy-fill{height:100%;background:linear-gradient(90deg,#f0a020,#f5c842);border-radius:6px;transition:width 0.3s}
.btn{background:linear-gradient(135deg,#c9813a,#e09a4a);color:#fff;border:none;border-radius:8px;padding:5px 12px;cursor:pointer;font-size:0.8em;font-family:Georgia,serif;font-weight:bold;transition:all 0.2s;white-space:nowrap}
.btn:hover{background:linear-gradient(135deg,#b06a28,#c8823a);transform:translateY(-1px)}
.btn:disabled{background:#b0a090;cursor:not-allowed;transform:none}
#main{display:flex;gap:8px;flex:1;min-height:0}
#left-panel{width:220px;display:flex;flex-direction:column;gap:8px;flex-shrink:0}
#inventory{background:linear-gradient(135deg,#f5e6c8,#ede0c0);border-radius:12px;border:2px solid #c9a96e;padding:10px;flex:1;overflow-y:auto}
#inventory h3{font-size:0.9em;color:#5c3d1e;margin-bottom:8px;border-bottom:1px solid #c9a96e;padding-bottom:4px}
.inv-item{display:flex;align-items:center;gap:6px;padding:3px 5px;border-radius:6px;background:rgba(255,255,255,0.5);margin-bottom:4px;font-size:0.78em;color:#4a3020}
.inv-item .stars{color:#e8a020;font-size:0.7em}
#season-box{background:linear-gradient(135deg,#f5e6c8,#ede0c0);border-radius:12px;border:2px solid #c9a96e;padding:10px;flex-shrink:0}
#season-box h3{font-size:0.85em;color:#5c3d1e;margin-bottom:6px}
#season-display{font-size:1.1em;margin-bottom:6px;text-align:center}
#center{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
#view-area{flex:1;border-radius:12px;border:2px solid #c9a96e;overflow:hidden;position:relative;min-height:0}
#world-map{width:100%;height:100%;background:linear-gradient(135deg,#8faa6e,#a0b87a);display:block}
#biome-view{display:none;width:100%;height:100%;background:linear-gradient(135deg,#f0e8d8,#e8dcc8);flex-direction:column;padding:10px;gap:8px}
#biome-header{display:flex;align-items:center;gap:10px;flex-shrink:0}
#biome-header h2{font-size:1em;color:#3d2b1a;flex:1}
#biome-desc{font-size:0.75em;color:#6a4a2a;font-style:italic}
#tile-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:1}
.tile{border-radius:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:0.7em;text-align:center;padding:4px;transition:all 0.2s;border:2px solid transparent;min-height:60px;position:relative}
.tile.hidden{background:linear-gradient(135deg,#c8b898,#b8a888);border-color:#a09070;color:#7a6040}
.tile.hidden:hover{background:linear-gradient(135deg,#d8c8a8,#c8b898);transform:scale(1.03)}
.tile.revealed{border-color:rgba(0,0,0,0.2)}
.tile.revealed:hover{transform:scale(1.03);filter:brightness(1.1)}
.tile .tile-icon{font-size:1.4em;line-height:1}
.tile .tile-label{font-size:0.65em;margin-top:2px;color:#3d2b1a;font-weight:bold}
.tile .quality{position:absolute;top:2px;right:3px;font-size:0.6em;color:#e8a020}
.tile.gathered{opacity:0.5;cursor:default}
.tile.adjacent-hint{box-shadow:0 0 8px rgba(240,160,32,0.6)}
#right-panel{width:200px;display:flex;flex-direction:column;gap:8px;flex-shrink:0}
#map-economy{background:linear-gradient(135deg,#f5e6c8,#ede0c0);border-radius:12px;border:2px solid #c9a96e;padding:10px}
#map-economy h3{font-size:0.85em;color:#5c3d1e;margin-bottom:8px;border-bottom:1px solid #c9a96e;padding-bottom:4px}
.biome-row{display:flex;align-items:center;gap:4px;margin-bottom:4px;font-size:0.72em;color:#4a3020}
.biome-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.expl-bar{flex:1;height:6px;background:#d4c09a;border-radius:3px;overflow:hidden}
.expl-fill{height:100%;border-radius:3px;transition:width 0.4s}
.expl-pct{width:28px;text-align:right;font-size:0.7em;color:#6a4a2a}
#log-box{background:linear-gradient(135deg,#f5e6c8,#ede0c0);border-radius:12px;border:2px solid #c9a96e;padding:10px;flex:1;overflow-y:auto;min-height:80px}
#log-box h3{font-size:0.85em;color:#5c3d1e;margin-bottom:6px;border-bottom:1px solid #c9a96e;padding-bottom:4px}
#log-entries{font-size:0.72em;color:#4a3020;display:flex;flex-direction:column;gap:3px}
.log-entry{padding:2px 4px;border-radius:4px;background:rgba(255,255,255,0.4)}
.log-entry.good{background:rgba(120,200,100,0.25)}
.log-entry.info{background:rgba(100,150,220,0.2)}
.log-entry.warn{background:rgba(220,180,60,0.25)}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#5c3d1e,#7a5030);color:#f5e6c8;padding:8px 18px;border-radius:10px;font-size:0.85em;pointer-events:none;opacity:0;transition:opacity 0.3s;z-index:999;border:1px solid #c9a96e}
svg text{font-family:Georgia,serif}
</style>
</head>
<body>
<div id="app">
<div id="topbar">
  <h1>🗺 Meridian Explorer</h1>
  <div class="stat-box">⚡ Energy: <div id="energy-bar"><div id="energy-fill" style="width:100%"></div></div><span id="energy-text">20/20</span></div>
  <div class="stat-box">✨ SPARK: <span id="spark-count">0</span></div>
  <div class="stat-box">📦 Items: <span id="item-count">0</span></div>
  <button class="btn" id="btn-endday">End Day</button>
</div>
<div id="main">
  <div id="left-panel">
    <div id="season-box">
      <h3>🌿 Season</h3>
      <div id="season-display">Spring 🌸</div>
      <button class="btn" id="btn-season" style="width:100%">Advance Season</button>
    </div>
    <div id="inventory">
      <h3>🎒 Inventory</h3>
      <div id="inv-list"><em style="font-size:0.8em;color:#8a6040">Empty...</em></div>
    </div>
  </div>
  <div id="center">
    <div id="view-area">
      <canvas id="world-map"></canvas>
      <div id="biome-view">
        <div id="biome-header">
          <span id="biome-icon" style="font-size:1.5em"></span>
          <h2 id="biome-name">Biome</h2>
          <button class="btn" id="btn-back">← World Map</button>
          <button class="btn" id="btn-sell-map" style="display:none">💰 Sell Map Data</button>
        </div>
        <div id="biome-desc"></div>
        <div id="tile-grid"></div>
      </div>
    </div>
  </div>
  <div id="right-panel">
    <div id="map-economy">
      <h3>📊 Exploration</h3>
      <div id="expl-list"></div>
      <button class="btn" id="btn-sell-all" style="width:100%;margin-top:6px">Sell All Maps</button>
    </div>
    <div id="log-box">
      <h3>📜 Log</h3>
      <div id="log-entries"></div>
    </div>
  </div>
</div>
</div>
<div id="toast"></div>

prompt: |
  Build an interactive HTML5 prototype that validates the Zone Exploration
  mechanic -- traveling between biomes, discovering resources, and mapping
  territory for economic value.
  
  CONCEPT: Players explore an abstracted version of Meridian's 8 biomes,
  gathering resources, discovering points of interest, and selling map data.
  
  GAMEPLAY:
  1. WORLD MAP (Main view):
     - Simplified top-down map showing all 8 biomes as connected regions:
       * Hearthfield (center-bottom, green)
       * Millhaven (center, warm tan)
       * Copperwood (left, copper/amber)
       * Ironvale (right, slate blue)
       * Brightsand Coast (far right, sand gold)
       * Thornmere (far left, dark teal)
       * Ashlands (top, obsidian/amber)
       * Frontier (top edge, shifting purple)
     - Each biome is a clickable region with: name, exploration % (fog of war),
       dominant color, species icon
     - Connections between biomes shown as paths with travel time
  
  2. EXPLORATION (On entering a biome):
     - The biome view shows a grid of 16 tiles (4x4), most hidden (fog of war)
     - Player clicks adjacent tiles to reveal them (costs 1 energy per tile)
     - Each revealed tile shows one of:
       * Resource node (gatherable, specific to biome + season)
       * Point of Interest (lore fragment, unique discovery)
       * NPC encounter (trade opportunity, quest hook)
       * Empty (scenic description of the biome)
       * Hidden location (rare, requires high exploration % to find)
  
  3. RESOURCE GATHERING:
     - Click revealed resource nodes to gather (costs 2 energy)
     - Resources are biome-specific:
       * Hearthfield: Meadow Herbs, Apple Wood, Honeycomb
       * Copperwood: Copper Timber, Mushrooms, Forest Amber
       * Ironvale: Iron Ore, Mountain Crystal, Alpine Herbs
       * Brightsand: Fish, Sea Salt, Coral
       * Thornmere: Bioluminescent Moss, Lotus Blossoms, Wisp Essence
       * Ashlands: Obsidian, Data Crystals, Volcanic Glass
     - Resources have random quality (1-5 stars)
     - Inventory panel shows collected items
  
  4. MAP DATA ECONOMY:
     - Exploration % per biome is tracked
     - "Sell Map Data" button at Millhaven: SPARK earned = biome danger level
       x exploration percentage
     - Hearthfield maps are cheap. Frontier maps are expensive.
     - Map data resets each "season" (button to advance season)
  
  5. ENERGY & SEASONS:
     - Player has 20 energy per "day"
     - Travel between biomes costs energy based on distance
     - "End Day" button refills energy
     - Season selector changes available resources and biome descriptions
     - Some tiles only accessible in certain seasons
  
  VISUAL STYLE:
  - Map uses biome palette colors from the art direction
  - Fog of war: semi-transparent warm gray with parchment texture
  - Revealed tiles: biome-colored with hand-drawn-style borders
  - Resource icons: emoji with colored backgrounds
  - Travel paths: dotted lines in warm brown
  - Energy bar: amber fill on parchment background
  
  METRICS TO VALIDATE:
  - Is exploration satisfying? (Revealing tiles should feel rewarding)
  - Does the map-data economy create meaningful exploration incentive?
  - Do biome-specific resources encourage travel across the world?
  - Is the energy budget meaningful? (Can't explore everything in one day)
  
  SIZE: Single HTML file, under 700 lines.

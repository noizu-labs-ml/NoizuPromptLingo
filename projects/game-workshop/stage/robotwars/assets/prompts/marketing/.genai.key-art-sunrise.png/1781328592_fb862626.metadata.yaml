prompt: |
  You are a concept artist creating key promotional art for a game. The visual
  style is hand-painted 2D with a warm, painterly quality inspired by Studio
  Ghibli and Stardew Valley. This is the image that will sell the feeling of
  the game -- it must be immediately emotionally compelling and communicate
  "a world you want to live in."
  
  Key promotional art for TheRobotWars -- "Build together. Trade together.
  Shape the world together."
  
  SCENE: Sunrise over the Millhaven Market Square, with representatives of
  all four current species (plus a hint of the fifth) gathered in a moment
  of everyday coexistence.
  
  COMPOSITION: Wide panoramic view. The sun is rising behind The Commons,
  casting the entire scene in the warm peach (#FFDAB9) and gold (#FFD54F)
  light of dawn. Shadows stretch long in cool lavender (#B0A4C8).
  
  FOREGROUND (left to right):
  - A HUMAN BAKER carrying a basket of fresh bread from her shop, steam
    rising in the cool morning air. Warm smile, flour on her apron.
  - A SYNTHETIC CARPENTER at their workshop door, holding a finished chair,
    the wood glowing in the sunrise. Precise posture, gentle expression.
  - Between them, a small table where they clearly share morning coffee
    (one cup for the baker, one placed as a gesture for the Synthetic).
  
  MIDGROUND:
  - The market square coming to life. A FAY figure tending a flower cart
    in the Green Quarter, plants leaning toward their touch. Leaves in
    their hair catch the dawn light.
  - An NEI AVATAR hovering near the market price board, their blue-teal
    geometric form reflecting the sunrise in warm tones. Data streams
    flowing across their facets.
  - Other small figures: a child running with a dog, a merchant opening
    their stall awning, a Synthetic and Human walking together.
  
  BACKGROUND:
  - The Hall of First Words, grand but warm, with the five species flags
    above its entrance (one flag -- the Alien flag -- is a beautiful
    question mark in shifting colors).
  - The Bright River reflecting the sunrise.
  - Beyond: the silhouettes of all biomes on the horizon --
    Copperwood's copper canopy (left), Ironvale's peaks with forge glow
    (right), Thornmere's mist (far left), the Ashlands' subtle server
    glow (far right).
  
  SKY: The most beautiful sky in the game. Dawn transition from deep
  purple (#2C003E) at the top through pink and peach to bright gold at
  the horizon. A few stars still visible at the top. Cotton clouds
  catching fire on their undersides.
  
  MOOD: This single image must say: "Five kinds of beings found a way
  to live together. It is not perfect, but it is beautiful, and the
  sunrise is for everyone." 40% hope, 30% discovery, 20% gentle tension,
  10% mystery.
  
  TITLE PLACEMENT: Upper portion of the sky, where "TheRobotWars" will
  be composited in post. Leave clean sky space for text overlay.
  
  PALETTE: Full warm spectrum -- dawn peach, gold, amber, with cool
  lavender shadows and the teal accent of NEI light. Maximum beauty.
  
  STYLE: The finest painting in the project. Museum-quality brushwork.
  Every element placed with the care of a Ghibli background painting.
  This is the image people will screenshot and share.

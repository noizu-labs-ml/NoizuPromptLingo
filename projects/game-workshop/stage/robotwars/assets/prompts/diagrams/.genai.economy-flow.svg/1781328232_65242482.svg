<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <!-- Background -->
    <rect width="1200" height="800" fill="#FFF8E1"/>

    <!-- Arrow markers -->
    <marker id="arrow-solid" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3E2723"/>
    </marker>
    <marker id="arrow-dashed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7B6055"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00b894"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6c5ce7"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00b894"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d63031"/>
    </marker>
    <marker id="arrow-pink" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e84393"/>
    </marker>

    <!-- Drop shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#3E2723" flood-opacity="0.15"/>
    </filter>
    <filter id="shadow-strong" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="3" dy="3" stdDeviation="5" flood-color="#3E2723" flood-opacity="0.2"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b2a8ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#a29bfe;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#96f5f5;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#81ecec;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="grad-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff0b3;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ffeaa7;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#72ffd4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#55efc4;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="grad-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fe9dc4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#fd79a8;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="grad-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffc8b8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#fab1a0;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8E1;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FFF3CD;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- === BACKGROUND === -->
  <rect width="1200" height="800" fill="url(#grad-bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#3E2723" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#3E2723" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#3E2723" stroke-width="1"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#3E2723" stroke-width="1"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="#3E2723" stroke-width="1"/>
    <line x1="0" y1="600" x2="1200" y2="600" stroke="#3E2723" stroke-width="1"/>
    <line x1="0" y1="700" x2="1200" y2="700" stroke="#3E2723" stroke-width="1"/>
    <line x1="100" y1="0" x2="100" y2="800" stroke="#3E2723" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="800" stroke="#3E2723" stroke-width="1"/>
    <line x1="500" y1="0" x2="500" y2="800" stroke="#3E2723" stroke-width="1"/>
    <line x1="700" y1="0" x2="700" y2="800" stroke="#3E2723" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="800" stroke="#3E2723" stroke-width="1"/>
    <line x1="1100" y1="0" x2="1100" y2="800" stroke="#3E2723" stroke-width="1"/>
  </g>

  <!-- === TITLE === -->
  <text x="600" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#3E2723" letter-spacing="1">TheRobotWars — Economy Flow</text>
  <text x="600" y="58" text-anchor="middle" font-size="12" fill="#7B6055" letter-spacing="0.5">SPARK Token &amp; Credit Circulation System</text>
  <line x1="80" y1="67" x2="1120" y2="67" stroke="#3E2723" stroke-width="1" opacity="0.2"/>

  <!-- === SECTION LABELS === -->
  <!-- Sources label -->
  <rect x="30" y="78" width="110" height="24" rx="5" fill="#3E2723" opacity="0.08"/>
  <text x="85" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#3E2723" letter-spacing="1">SOURCES</text>

  <!-- Exchange label -->
  <rect x="505" y="78" width="190" height="24" rx="5" fill="#3E2723" opacity="0.08"/>
  <text x="600" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#3E2723" letter-spacing="1">EXCHANGE &amp; PLATFORM</text>

  <!-- Sinks label -->
  <rect x="1060" y="78" width="110" height="24" rx="5" fill="#3E2723" opacity="0.08"/>
  <text x="1115" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#3E2723" letter-spacing="1">SINKS</text>

  <!-- === COLUMN DIVIDERS === -->
  <line x1="245" y1="75" x2="245" y2="730" stroke="#3E2723" stroke-width="1" stroke-dasharray="4,6" opacity="0.15"/>
  <line x1="955" y1="75" x2="955" y2="730" stroke="#3E2723" stroke-width="1" stroke-dasharray="4,6" opacity="0.15"/>

  <!-- ============================================================ -->
  <!--  SOURCE NODES (left column, x≈120)                          -->
  <!-- ============================================================ -->

  <!-- 1. Distributed Compute -->
  <g filter="url(#shadow)">
    <rect x="28" y="115" width="170" height="68" rx="12" fill="url(#grad-purple)" stroke="#6c5ce7" stroke-width="1.5"/>
  </g>
  <text x="113" y="141" text-anchor="middle" font-size="13" font-weight="bold" fill="#3E2723">Distributed</text>
  <text x="113" y="157" text-anchor="middle" font-size="13" font-weight="bold" fill="#3E2723">Compute</text>
  <text x="113" y="174" text-anchor="middle" font-size="10" fill="#5a4a7a">Players contribute device CPU/GPU</text>

  <!-- SPARK badge -->
  <rect x="148" y="108" width="52" height="18" rx="9" fill="#6c5ce7"/>
  <text x="174" y="120" text-anchor="middle" font-size="9" font-weight="bold" fill="white">⚡ SPARK</text>

  <!-- 2. Service Provision -->
  <g filter="url(#shadow)">
    <rect x="28" y="225" width="170" height="68" rx="12" fill="url(#grad-teal)" stroke="#00b2b2" stroke-width="1.5"/>
  </g>
  <text x="113" y="251" text-anchor="middle" font-size="13" font-weight="bold" fill="#3E2723">Service</text>
  <text x="113" y="267" text-anchor="middle" font-size="13" font-weight="bold" fill="#3E2723">Provision</text>
  <text x="113" y="284" text-anchor="middle" font-size="10" fill="#1a5c5c">Code review, crafting, delivery</text>

  <!-- SPARK badge -->
  <rect x="148" y="218" width="52" height="18" rx="9" fill="#00b2b2"/>
  <text x="174" y="230" text-anchor="middle" font-size="9" font-weight="bold" fill="white">⚡ SPARK</text>

  <!-- 3. Seasonal Rewards -->
  <g filter="url(#shadow)">
    <rect x="28" y="335" width="170" height="68" rx="12" fill="url(#grad-gold)" stroke="#f0c000" stroke-width="1.5"/>
  </g>
  <text x="113" y="361" text-anchor="middle" font-size="13" font-weight="bold" fill="#3E2723">Seasonal</text>
  <text x="113" y="377" text-anchor="middle" font-size="13" font-weight="bold" fill="#3E2723">Rewards</text>
  <text x="113" y="394" text-anchor="middle" font-size="10" fill="#7a5c00">Festivals, governance, bounties</text>

  <!-- SPARK badge -->
  <rect x="148" y="328" width="52" height="18" rx="9" fill="#d4a000"/>
  <text x="174" y="340" text-anchor="middle" font-size="9" font-weight="bold" fill="white">⚡ SPARK</text>

  <!-- 4. Game Purchase -->
  <g filter="url(#shadow)">
    <rect x="28" y="445" width="170" height="68" rx="12" fill="url(#grad-green)" stroke="#00c896" stroke-width="1.5"/>
  </g>
  <text x="113" y="471" text-anchor="middle" font-size="13" font-weight="bold" fill="#3E2723">Game</text>
  <text x="113" y="487" text-anchor="middle" font-size="13" font-weight="bold" fill="#3E2723">Purchase</text>
  <text x="113" y="504" text-anchor="middle" font-size="10" fill="#1a5c3a">Initial SPARK allocation</text>

  <!-- SPARK + Credits badge -->
  <rect x="140" y="438" width="60" height="18" rx="9" fill="#00a87a"/>
  <text x="170" y="450" text-anchor="middle" font-size="9" font-weight="bold" fill="white">⚡ + 💳</text>

  <!-- ============================================================ -->
  <!--  CENTER: SPARK/CREDIT EXCHANGE (large node)                 -->
  <!-- ============================================================ -->

  <!-- Exchange node -->
  <g filter="url(#shadow-strong)">
    <rect x="470" y="188" width="260" height="120" rx="18" fill="url(#grad-pink)" stroke="#e84393" stroke-width="2.5"/>
  </g>
  <text x="600" y="222" text-anchor="middle" font-size="15" font-weight="bold" fill="#3E2723">SPARK / Credit</text>
  <text x="600" y="241" text-anchor="middle" font-size="15" font-weight="bold" fill="#3E2723">Exchange</text>

  <!-- Bidirectional arrow inside node -->
  <line x1="530" y1="264" x2="670" y2="264" stroke="#3E2723" stroke-width="2"/>
  <polygon points="670,260 680,264 670,268" fill="#3E2723"/>
  <polygon points="530,260 520,264 530,268" fill="#3E2723"/>
  <text x="600" y="280" text-anchor="middle" font-size="10" fill="#3E2723">1% platform spread</text>
  <text x="600" y="296" text-anchor="middle" font-size="10" fill="#5a1a30">⚡ SPARK ⇔ 💳 Credits</text>

  <!-- Platform Revenue breakdown badge -->
  <g filter="url(#shadow)">
</svg>
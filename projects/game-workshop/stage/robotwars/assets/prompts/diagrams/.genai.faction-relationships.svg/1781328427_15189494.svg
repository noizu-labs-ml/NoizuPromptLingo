<svg viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#2d1b0e"/>
      <stop offset="100%" stop-color="#1a0f06"/>
    </radialGradient>

    <!-- Species glow filters -->
    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowPurple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000066"/>
    </filter>
    <filter id="nodeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000088"/>
    </filter>

    <!-- Clip paths for cluster backgrounds -->
    <clipPath id="clipHuman">
      <rect x="420" y="30" width="360" height="230" rx="20"/>
    </clipPath>

    <!-- Arrow markers -->
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#00b894"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#74b9ff"/>
    </marker>
    <marker id="arrowYellow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#fdcb6e"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#e17055"/>
    </marker>
  </defs>

  <!-- ═══════════════════════════════════════════════
       BACKGROUND
  ═══════════════════════════════════════════════ -->
  <rect width="1200" height="1200" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff08" stroke-width="0.5"/>
  </pattern>
  <rect width="1200" height="1200" fill="url(#grid)"/>

  <!-- Pentagon guide lines (very subtle) -->
  <polygon points="600,90 1020,380 870,870 330,870 180,380"
    fill="none" stroke="#ffffff06" stroke-width="1" stroke-dasharray="4,8"/>

  <!-- ═══════════════════════════════════════════════
       TITLE
  ═══════════════════════════════════════════════ -->
  <text x="600" y="24" text-anchor="middle" font-size="18" font-weight="bold"
    fill="#ffeaa7" letter-spacing="3" opacity="0.9">THE ROBOT WARS — FACTION RELATIONSHIP MAP</text>

  <!-- ═══════════════════════════════════════════════
       SPECIES CLUSTER BACKGROUNDS
  ═══════════════════════════════════════════════ -->

  <!-- HUMANS cluster background (top) -->
  <rect x="415" y="40" width="370" height="240" rx="18" fill="#ffeaa7" fill-opacity="0.07"
    stroke="#ffeaa7" stroke-opacity="0.25" stroke-width="1.5"/>
  <rect x="415" y="40" width="370" height="38" rx="18" fill="#ffeaa7" fill-opacity="0.12"/>
  <rect x="415" y="60" width="370" height="18" fill="#ffeaa7" fill-opacity="0.12"/>

  <!-- NEIs cluster background (upper-right) -->
  <rect x="845" y="255" width="320" height="240" rx="18" fill="#a29bfe" fill-opacity="0.07"
    stroke="#a29bfe" stroke-opacity="0.25" stroke-width="1.5"/>
  <rect x="845" y="255" width="320" height="38" rx="18" fill="#a29bfe" fill-opacity="0.12"/>
  <rect x="845" y="275" width="320" height="18" fill="#a29bfe" fill-opacity="0.12"/>

  <!-- SYNTHETICS cluster background (lower-right) -->
  <rect x="845" y="700" width="320" height="240" rx="18" fill="#74b9ff" fill-opacity="0.07"
    stroke="#74b9ff" stroke-opacity="0.25" stroke-width="1.5"/>
  <rect x="845" y="700" width="320" height="38" rx="18" fill="#74b9ff" fill-opacity="0.12"/>
  <rect x="845" y="720" width="320" height="18" fill="#74b9ff" fill-opacity="0.12"/>

  <!-- FAY cluster background (lower-left) -->
  <rect x="35" y="700" width="320" height="240" rx="18" fill="#55efc4" fill-opacity="0.07"
    stroke="#55efc4" stroke-opacity="0.25" stroke-width="1.5"/>
  <rect x="35" y="700" width="320" height="38" rx="18" fill="#55efc4" fill-opacity="0.12"/>
  <rect x="35" y="720" width="320" height="18" fill="#55efc4" fill-opacity="0.12"/>

  <!-- ALIENS cluster background (upper-left) -->
  <rect x="35" y="255" width="320" height="140" rx="18" fill="#fd79a8" fill-opacity="0.07"
    stroke="#fd79a8" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- ═══════════════════════════════════════════════
       COUNCIL OF FIVE (CENTER)
  ═══════════════════════════════════════════════ -->

  <!-- Outer ring -->
  <circle cx="600" cy="590" r="72" fill="none" stroke="#ffeaa7" stroke-opacity="0.3"
    stroke-width="1" stroke-dasharray="3,6"/>
  <!-- Inner fill -->
  <circle cx="600" cy="590" r="58" fill="#3E2723" fill-opacity="0.9"
    stroke="#ffeaa7" stroke-width="2" stroke-opacity="0.7" filter="url(#softShadow)"/>
  <circle cx="600" cy="590" r="52" fill="none" stroke="#ffeaa7"
    stroke-opacity="0.2" stroke-width="1"/>

  <!-- Council spoke lines to species (subtle) -->
  <line x1="600" y1="532" x2="600" y2="278" stroke="#ffffff15" stroke-width="1.5" stroke-dasharray="4,6"/>
  <line x1="654" y1="558" x2="905" y2="395" stroke="#ffffff15" stroke-width="1.5" stroke-dasharray="4,6"/>
  <line x1="636" y1="635" x2="905" y2="820" stroke="#ffffff15" stroke-width="1.5" stroke-dasharray="4,6"/>
  <line x1="564" y1="635" x2="295" y2="820" stroke="#ffffff15" stroke-width="1.5" stroke-dasharray="4,6"/>
  <line x1="546" y1="558" x2="295" y2="395" stroke="#ffffff15" stroke-width="1.5" stroke-dasharray="4,6"/>

  <text x="600" y="583" text-anchor="middle" font-size="11" font-weight="bold"
    fill="#ffeaa7" letter-spacing="1">COUNCIL</text>
  <text x="600" y="598" text-anchor="middle" font-size="11" font-weight="bold"
    fill="#ffeaa7" letter-spacing="1">OF FIVE</text>
  <text x="600" y="612" text-anchor="middle" font-size="8" fill="#ffeaa7" opacity="0.6">Interspecies</text>
  <text x="600" y="623" text-anchor="middle" font-size="8" fill="#ffeaa7" opacity="0.6">Governance Body</text>

  <!-- ═══════════════════════════════════════════════
       SPECIES LABELS
  ═══════════════════════════════════════════════ -->

  <!-- HUMANS label -->
  <text x="600" y="66" text-anchor="middle" font-size="15" font-weight="bold"
    fill="#ffeaa7" letter-spacing="2">◆ HUMANS ◆</text>

  <!-- NEIs label -->
  <text x="1005" y="281" text-anchor="middle" font-size="15" font-weight="bold"
    fill="#a29bfe" letter-spacing="2">◆ NEIs ◆</text>

  <!-- SYNTHETICS label -->
  <text x="1005" y="726" text-anchor="middle" font-size="15" font-weight="bold"
    fill="#74b9ff" letter-spacing="2">◆ SYNTHETICS ◆</text>

  <!-- FAY label -->
  <text x="195" y="726" text-anchor="middle" font-size="15" font-weight="bold"
    fill="#55efc4" letter-spacing="2">◆ FAY ◆</text>

  <!-- ALIENS label -->
  <text x="195" y="281" text-anchor="middle" font-size="15" font-weight="bold"
    fill="#fd79a8" letter-spacing="2">◆ ALIENS ◆</text>

  <!-- ═══════════════════════════════════════════════
       RELATIONSHIP LINES (drawn before nodes)
  ═══════════════════════════════════════════════ -->

  <!-- ── ALLIED (green solid) ── -->
  <!-- Secular Progressives <-> Sovereign Minds -->
  <path d="M 670,138 C 750,200 820,280 905,320"
    fill="none" stroke="#00b894" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Transhumanist Alliance <-> The Weavers -->
  <path d="M 520,210 C 460,380 340,680 195,780"
    fill="none" stroke="#00b894" stroke-width="2.5" stroke-linecap="round"/>

  <!-- The Bridge <-> The Gardeners -->
  <path d="M 905,810 C 800,720 700,660 560,560"
    fill="none" stroke="#00b894" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 640,560 C 800,500 870,430 920,395"
    fill="none" stroke="#00b894" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ── COOPERATIVE (blue dashed) ── -->
  <!-- Church of Eternal Flame <-> Old Court -->
  <path d="M 530,138 C 450,300 300,580 195,770"
    fill="none" stroke="#74b9ff" stroke-width="2" stroke-dasharray="8,5" stroke-linecap="round"/>

  <!-- New Wave <-> New Bloom -->
  <path d="M 905,770 C 760,790 450,800 295,800"
    fill="none" stroke="#74b9ff" stroke-width="2" stroke-dasharray="8,5" stroke-linecap="round"/>

  <!-- ── TENSE (yellow dotted) ── -->
  <!-- Speciation Movement <-> The Collective -->
  <path d="M 940,870 C 860,750 750,650 600,590"
    fill="none" stroke="#fdcb6e" stroke-width="2" stroke-dasharray="3,5" stroke-linecap="round"/>
  <path d="M 600,590 C 820,530 870,450 930,395"
    fill="none" stroke="#fdcb6e" stroke-width="2" stroke-dasharray="3,5" stroke-linecap="round"/>

  <!-- The Originals <-> Church of Eternal Flame -->
  <path d="M 905,745 C 820,620 720,450 670,178"
    fill="none" stroke="#fdcb6e" stroke-width="2" stroke-dasharray="3,5" stroke-linecap="round"/>

  <!-- Wild Hunt <-> New Wave (tense) -->
  <path d="M 195,850 C 400,870 680,860 905,810"
    fill="none" stroke="#fdcb6e" stroke-width="1.5" stroke-dasharray="3,5" stroke-linecap="round" opacity="0.7"/>

  <!-- Wild Hunt <-> Sovereign Minds (tense) -->
  <path d="M 195,850 C 300,750 500,650 600,590"
    fill="none" stroke="#fdcb6e" stroke-width="1.5" stroke-dasharray="3,5" stroke-linecap="round" opacity="0.7"/>
  <path d="M 600,590 C 720,520 820,420 905,355"
    fill="none" stroke="#fdcb6e" stroke-width="1.5" stroke-dasharray="3,5" stroke-linecap="round" opacity="0.7"/>

  <!-- Wild Hunt <-> The Gardeners (tense) -->
  <path d="M 195,850 C 400,800 700,650 905,390"
    fill="none" stroke="#fdcb6e" stroke-width="1.5" stroke-dasharray="3,5" stroke-linecap="round" opacity="0.5"/>

  <!-- ── RIVAL (orange dashed) ── -->
  <!-- Neo-Luddites <-> Accelerationists -->
  <path d="M 635,178 C 700,240 800,290 870,355"
    fill="none" stroke="#e17055" stroke-width="2.5" stroke-dasharray="10,5" stroke-linecap="round"/>

  <!-- ═══════════════════════════════════════════════
       FACTION NODES — HUMANS (top cluster)
  ═══════════════════════════════════════════════ -->

  <!-- Church of the Eternal Flame -->
  <g filter="url(#nodeShadow)">
</svg>
# ─── Team Assembly Presets ───────────────────────────────────────────
#
# Use these presets to spin up purpose-built teams via @npl-persona.
# Each preset lists the slugs to spawn as parallel persona agents.
#
# Launch syntax (per member):
#   Agent(subagent_type: npl-persona, prompt: "Load persona from
#     .npl/persona/<slug>.md. You are <Name>, <Role>. [task context]")
#
# See .npl/TEAM-ASSEMBLY.md for full instructions.

presets:
  # Full studio — everyone
  full-studio:
    description: "All 24 members. Use for major milestone reviews or full GDD critiques."
    members: [zara-knight, wren-kimura, dex-morales, crash-delgado, mina-osei,
              sage-baptiste, jinx-patel, ivy-chen, fable-wu, moss-wright,
              ember-cross, hex-morrison, rook-tanaka, vex-okafor, kit-larsson,
              dale-kowalski, theo-vasquez, nyx-okonkwo, thorn-abara,
              pike-johansson, otto-flynn, sol-reeves, blaze-nakamura, rue-santiago]

  # Concept phase — early ideation
  concept-squad:
    description: "Early concept and pitch development. Vision + feasibility."
    members: [zara-knight, dex-morales, mina-osei, ivy-chen, fable-wu, sol-reeves]

  # Core design — the design table
  design-table:
    description: "Systems, levels, narrative, combat, economy — the design brain trust."
    members: [zara-knight, dex-morales, crash-delgado, mina-osei, sage-baptiste, jinx-patel]

  # Art pipeline — visual production
  art-pipeline:
    description: "Full art team for visual direction, assets, animation, VFX."
    members: [ivy-chen, fable-wu, moss-wright, ember-cross, hex-morrison]

  # Tech core — engineering decisions
  tech-core:
    description: "Architecture, networking, AI, build systems, shaders."
    members: [rook-tanaka, vex-okafor, kit-larsson, dale-kowalski, hex-morrison]

  # Player experience — UX + QA + accessibility + data
  player-experience:
    description: "Everything the player touches: UI, accessibility, QA, analytics."
    members: [nyx-okonkwo, thorn-abara, pike-johansson, otto-flynn]

  # Go-to-market — launch readiness
  go-to-market:
    description: "Marketing, community, localization, economy, data — launch team."
    members: [sol-reeves, blaze-nakamura, rue-santiago, sage-baptiste, otto-flynn, wren-kimura]

  # Vertical slice — minimum team for a playable demo
  vertical-slice:
    description: "Minimum crew to build a playable vertical slice."
    members: [zara-knight, dex-morales, rook-tanaka, ivy-chen, crash-delgado,
              ember-cross, theo-vasquez, wren-kimura]

  # Live ops — post-launch operations
  live-ops:
    description: "Running the game post-launch: events, community, data, economy."
    members: [blaze-nakamura, sage-baptiste, otto-flynn, wren-kimura, pike-johansson, dale-kowalski]

  # Narrative review — story and world coherence
  narrative-review:
    description: "Story review panel: narrative, levels, art, localization."
    members: [mina-osei, crash-delgado, moss-wright, rue-santiago, ivy-chen]

  # Combat lab — action systems deep dive
  combat-lab:
    description: "Combat feel, animation, VFX, AI opponents, frame data."
    members: [jinx-patel, ember-cross, hex-morrison, vex-okafor, dex-morales]

vars:
  groups:
    - name: Surfaces
      vars:
        white: "#e0e0e8"
        off-white: "#d0d0d8"
        gray-50: "#1c1f2e"
        gray-100: "#242838"
        gray-200: "#2d3248"
        gray-300: "#4b5068"
        gray-400: "#6b7088"
        gray-500: "#8b90a8"
        gray-600: "#abafc2"
        gray-700: "#161828"
        gray-800: "#0e1020"
        gray-900: "#080a18"
        black: "#050714"

    - name: "Agent Colors"
      vars:
        brand-red: "#EF4444"
        brand-red-light: "rgba(239,68,68,0.12)"
        brand-red-mid: "rgba(239,68,68,0.25)"
        brand-blue: "#3B82F6"
        brand-blue-light: "rgba(59,130,246,0.12)"
        brand-blue-mid: "rgba(59,130,246,0.25)"
        brand-yellow: "#F59E0B"
        brand-yellow-light: "rgba(245,158,11,0.12)"
        brand-yellow-mid: "rgba(245,158,11,0.25)"

    - name: Palette
      vars:
        rose: "#EF4444"
        rose-light: "rgba(239,68,68,0.12)"
        orange: "#F97316"
        orange-light: "rgba(249,115,22,0.12)"
        amber: "#F59E0B"
        amber-light: "rgba(245,158,11,0.12)"
        emerald: "#10B981"
        emerald-light: "rgba(16,185,129,0.12)"
        teal: "#14B8A6"
        teal-light: "rgba(20,184,166,0.12)"
        sky: "#3B82F6"
        sky-light: "rgba(59,130,246,0.12)"
        indigo: "#6366F1"
        indigo-light: "rgba(99,102,241,0.12)"
        violet: "#8B5CF6"
        violet-light: "rgba(139,92,246,0.12)"
        purple: "#A855F7"
        purple-light: "rgba(168,85,247,0.12)"
        fuchsia: "#D946EF"
        fuchsia-light: "rgba(217,70,239,0.12)"

    - name: Semantic
      vars:
        success: "#10B981"
        success-tint: "rgba(16,185,129,0.15)"
        warning: "#F59E0B"
        warning-tint: "rgba(245,158,11,0.15)"
        error: "#EF4444"
        error-tint: "rgba(239,68,68,0.15)"
        info: "#3B82F6"
        info-tint: "rgba(59,130,246,0.15)"

    - name: Typography
      vars:
        font-sans: "'Space Grotesk', -apple-system, sans-serif"
        font-mono: "'IBM Plex Mono', 'Menlo', monospace"
        font-display: "'Space Grotesk', sans-serif"

    - name: Layout
      vars:
        radius: "6px"

    - name: Base
      vars:
        base-font-family: "var(--font-sans)"
        base-font-color: "var(--text)"
        base-background: "var(--surface)"
        base-line-height: "1.6"

    - name: Cards
      vars:
        card-background: "#0e1020"
        card-border-color: "#242838"
        card-header-background: "#0e1020"
        card-footer-background: "#161828"

    - name: Buttons
      vars:
        btn-font-family: "var(--font-display)"
        btn-font-weight: "600"
        btn-font-size: "14px"
        btn-letter-spacing: "0.02em"
        btn-background: "#3B82F6"
        btn-color: "#ffffff"
        btn-border-color: "transparent"
        btn-hover-background: "#60A5FA"
        btn-hover-border-color: "transparent"
        btn-outline-background: "transparent"
        btn-outline-color: "#3B82F6"
        btn-outline-hover-background: "rgba(59,130,246,0.1)"

    - name: Toggle
      vars:
        sg-section-title-font-family: "var(--font-display)"
        sg-section-title-text-transform: "none"
        sg-section-title-letter-spacing: "0.01em"
        sg-section-title-color: "var(--text)"
        sg-section-number-bg: "rgba(59,130,246,0.1)"
        sg-section-number-border: "1px solid rgba(59,130,246,0.3)"
        sg-section-number-color: "#3B82F6"
        sg-section-number-radius: "var(--radius-md)"
        sg-section-desc-color: "var(--text-muted)"
        hr-section-color: "linear-gradient(90deg, #3B82F6, #8B5CF6, transparent)"
        hr-section-height: "2px"
        hr-subsection-color: "linear-gradient(90deg, #3B82F6, transparent)"
        hr-subsection-height: "1px"
        hr-accent-color: "#3B82F6"

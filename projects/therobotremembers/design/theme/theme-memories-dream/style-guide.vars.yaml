vars:
  groups:
    - name: Surfaces
      vars:
        white: "#f5f0e8"
        off-white: "#ede8e0"
        gray-50: "#1a2028"
        gray-100: "#222830"
        gray-200: "#2a3038"
        gray-300: "#4a5058"
        gray-400: "#6a7078"
        gray-500: "#8a9098"
        gray-600: "#aab0b8"
        gray-700: "#141a22"
        gray-800: "#0e1418"
        gray-900: "#0a0e12"
        black: "#060a0e"

    - name: Brand
      vars:
        brand-red: "#c4a35a"
        brand-red-light: "rgba(196,163,90,0.12)"
        brand-red-mid: "rgba(196,163,90,0.25)"
        brand-blue: "#2d5a6a"
        brand-blue-light: "rgba(45,90,106,0.12)"
        brand-blue-mid: "rgba(45,90,106,0.25)"
        brand-yellow: "#c4a35a"
        brand-yellow-light: "rgba(196,163,90,0.12)"
        brand-yellow-mid: "rgba(196,163,90,0.25)"

    - name: Semantic
      vars:
        success: "#4a8a5a"
        success-tint: "rgba(74,138,90,0.15)"
        warning: "#b89a40"
        warning-tint: "rgba(184,154,64,0.15)"
        error: "#a04a4a"
        error-tint: "rgba(160,74,74,0.15)"
        info: "#4a7a8a"
        info-tint: "rgba(74,122,138,0.15)"

    - name: Typography
      vars:
        font-sans: "'Source Sans 3', -apple-system, sans-serif"
        font-mono: "'JetBrains Mono', 'Menlo', monospace"
        font-display: "'Libre Baskerville', 'Georgia', serif"
        font-body: "'Source Sans 3', -apple-system, sans-serif"
        font-size-display: "2.75rem"

    - name: Layout
      vars:
        radius: "2px"

    - name: Base
      vars:
        base-font-family: "var(--font-sans)"
        base-font-color: "var(--text)"
        base-background: "var(--surface)"
        base-line-height: "1.7"

    - name: Cards
      vars:
        card-background: "#0e1418"
        card-border-color: "#222830"
        card-header-background: "#0e1418"
        card-footer-background: "#141a22"

    - name: Buttons
      vars:
        btn-font-family: "var(--font-sans)"
        btn-font-weight: "600"
        btn-font-size: "14px"
        btn-letter-spacing: "0.01em"
        btn-background: "#c4a35a"
        btn-color: "#060a0e"
        btn-border-color: "transparent"
        btn-hover-background: "#d4b36a"
        btn-hover-border-color: "transparent"
        btn-outline-background: "transparent"
        btn-outline-color: "#c4a35a"
        btn-outline-hover-background: "rgba(196,163,90,0.1)"

    - name: Toggle
      vars:
        sg-section-title-font-family: "var(--font-display)"
        sg-section-title-text-transform: "none"
        sg-section-title-letter-spacing: "0"
        sg-section-title-color: "var(--text)"
        sg-section-number-bg: "rgba(196,163,90,0.08)"
        sg-section-number-border: "1px solid rgba(196,163,90,0.2)"
        sg-section-number-color: "#c4a35a"
        sg-section-number-radius: "50%"
        sg-section-desc-font-family: "var(--font-display)"
        sg-section-desc-color: "var(--text-muted)"
        hr-section-color: "linear-gradient(90deg, #c4a35a, transparent)"
        hr-section-height: "1px"
        hr-subsection-color: "rgba(196,163,90,0.2)"
        hr-subsection-height: "1px"
        hr-accent-color: "#c4a35a"
        sg-type-specimen-bg: "#0e1418"
        sg-type-specimen-border: "1px solid #222830"
        sg-type-specimen-radius: "2px"

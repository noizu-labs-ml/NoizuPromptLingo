networks:
  npl-network:
    driver: bridge
    name: npl-network

services:
  npl-timescaledb:
    image: timescale/timescaledb:2.24.0-pg17
    container_name: npl-timescaledb
    restart: unless-stopped
    networks:
      - npl-network
    ports:
      - "${NPL_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${NPL_DB_NAME:-npl}
      POSTGRES_USER: ${NPL_DB_USER:-npl}
      POSTGRES_PASSWORD: ${NPL_DB_PASSWORD:-npl_secret}
    volumes:
      - npl-timescaledb-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NPL_DB_USER:-npl} -d ${NPL_DB_NAME:-npl}"]
      interval: 10s
      timeout: 5s
      retries: 5

  npl-valkey:
    image: valkey/valkey:8.1
    container_name: npl-valkey
    restart: unless-stopped
    networks:
      - npl-network
    ports:
      - "${NPL_VALKEY_PORT:-6379}:6379"
    command: valkey-server
    volumes:
      - npl-valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  npl-mcp:
    build: .
    container_name: npl-mcp
    restart: unless-stopped
    networks:
      - npl-network
    ports:
      - "${NPL_MCP_PORT:-8765}:8765"
    environment:
      NPL_DB_HOST: npl-timescaledb
      NPL_DB_PORT: 5432
      NPL_DB_NAME: ${NPL_DB_NAME:-npl}
      NPL_DB_USER: ${NPL_DB_USER:-npl}
      NPL_DB_PASSWORD: ${NPL_DB_PASSWORD:-npl_secret}
      NPL_VALKEY_HOST: npl-valkey
      NPL_VALKEY_PORT: 6379
    depends_on:
      npl-timescaledb:
        condition: service_healthy
      npl-valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8765/api/health/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  npl-timescaledb-data:
    name: npl-timescaledb-data
  npl-valkey-data:
    name: npl-valkey-data

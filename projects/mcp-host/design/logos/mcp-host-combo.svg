<?xml version="1.0" encoding="UTF-8"?>
<!--
  MCP Host — Combo Mark (Logomark + Wordmark)
  VERSION: 1.0
  DATE: 2026-05-12
  STATUS: Draft

  Minimum size: 120px wide
  Clear space: 1x mark height on all sides
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 80" width="480" height="80">
  <title>MCP Host</title>
  <desc>MCP Host platform combo mark — logomark with wordmark</desc>

  <!-- Logomark (scaled to 60x60, centered vertically) -->
  <g transform="translate(10, 10) scale(0.25)">
    <!-- Shield body -->
    <path d="
      M 120 20
      L 200 60
      L 200 140
      Q 200 190 120 220
      Q 40 190 40 140
      L 40 60
      Z
    " fill="#3B82F6"/>
    <!-- Inner negative space -->
    <path d="
      M 120 44
      L 180 74
      L 180 138
      Q 180 178 120 202
      Q 60 178 60 138
      L 60 74
      Z
    " fill="#FFFFFF"/>
    <!-- Nodes -->
    <circle cx="120" cy="72" r="16" fill="#3B82F6"/>
    <circle cx="82" cy="148" r="16" fill="#3B82F6"/>
    <circle cx="158" cy="148" r="16" fill="#3B82F6"/>
    <!-- Connections -->
    <line x1="120" y1="72" x2="82" y2="148" stroke="#3B82F6" stroke-width="6" stroke-linecap="round"/>
    <line x1="120" y1="72" x2="158" y2="148" stroke="#3B82F6" stroke-width="6" stroke-linecap="round"/>
    <line x1="82" y1="148" x2="158" y2="148" stroke="#3B82F6" stroke-width="6" stroke-linecap="round"/>
    <!-- Center -->
    <circle cx="120" cy="122" r="10" fill="#FFFFFF"/>
    <circle cx="120" cy="122" r="6" fill="#3B82F6"/>
  </g>

  <!-- Wordmark — "MCP Host" in system font (convert to paths for production) -->
  <text x="82" y="50" font-family="Geist, Inter, system-ui, sans-serif" font-size="32" font-weight="500" fill="#171717" letter-spacing="-0.01em">
    <tspan>MCP</tspan>
    <tspan dx="6" fill="#737373" font-weight="400">Host</tspan>
  </text>
</svg>

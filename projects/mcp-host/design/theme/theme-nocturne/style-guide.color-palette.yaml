color-palette:
  - group: "Void — Dark Canvas"
    description: "Foundation surfaces of the Nocturne system. Deep cool-tinted neutrals that recede into darkness. No pure black — always a hint of violet undertone to keep surfaces alive."
    notes:
      - label: Surface
        text: "Base canvas (#0C0C10). The void. Primary page background."
        cssClass: surface
      - label: Surface Alt
        text: "Slightly lifted (#111118). Used for cards, sidebars, secondary panels."
        cssClass: surface-alt
      - label: Border
        text: "Mist border (#2A2A3A). Subtle structural dividers — barely visible, always intentional."
        cssClass: border
      - label: Border Strong
        text: "Fog border (#3A3A4F). Emphasized dividers, active panel edges, focus indicators."
        cssClass: border-strong
    colors:
      - name: Surface
        value: "var(--surface)"
      - name: Surface Alt
        value: "var(--surface-alt)"
      - name: Gray 700
        value: "var(--gray-700)"
      - name: Gray 800
        value: "var(--gray-800)"
      - name: Gray 900
        value: "var(--gray-900)"
      - name: Border
        value: "var(--border)"
      - name: Border Strong
        value: "var(--border-strong)"

  - group: "Phosphor — Platform Accent"
    description: "The glow layer. Phosphor Blue anchors the platform identity; sub-product accents define each product line. All glow on void — luminosity earns its place."
    notes:
      - label: Phosphor Blue
        text: "Brand Blue (#3B82F6). Platform accent. CTAs, focus rings, active states, navigation highlights."
        cssClass: brand-blue
      - label: Plasma Cyan
        text: "Cyan (#06B6D4). JustMCP.it sub-product. Quick-deploy, high-velocity, frictionless."
        cssClass: cyan
      - label: Aurora Green
        text: "Emerald (#10B981). MCP Jumpstart sub-product. Growth, momentum, onboarding."
        cssClass: emerald
      - label: Spectral Violet
        text: "Violet (#8B5CF6). SafeMCP sub-product. Security, trust, verification."
        cssClass: violet
    colors:
      - name: Phosphor Blue
        value: "var(--brand-blue)"
      - name: Brand Blue Light
        value: "var(--brand-blue-light)"
      - name: Brand Blue Mid
        value: "var(--brand-blue-mid)"
      - name: Plasma Cyan
        value: "var(--cyan)"
      - name: Cyan Light
        value: "var(--cyan-light)"
      - name: Aurora Green
        value: "var(--emerald)"
      - name: Emerald Light
        value: "var(--emerald-light)"
      - name: Spectral Violet
        value: "var(--violet)"
      - name: Violet Light
        value: "var(--violet-light)"

  - group: Semantic
    description: "Functional state signals. Calibrated for void backgrounds — saturated enough to read at low ambient light. Tints create context zones without overwhelming the canvas."
    notes:
      - label: Success
        text: "Aurora Green (#4ADE80). Confirmations, healthy status, deploy success."
      - label: Warning
        text: "Phosphor Yellow (#FACC15). Cautions, pending states, rate limits approaching."
      - label: Error
        text: "Ember Red (#F87171). Failures, danger states, authentication errors."
      - label: Info
        text: "Sky Blue (#60A5FA). Guidance, documentation links, informational alerts."
    colors:
      - name: Success
        value: "var(--success)"
      - name: Success Tint
        value: "var(--success-tint)"
      - name: Warning
        value: "var(--warning)"
      - name: Warning Tint
        value: "var(--warning-tint)"
      - name: Error
        value: "var(--error)"
      - name: Error Tint
        value: "var(--error-tint)"
      - name: Info
        value: "var(--info)"
      - name: Info Tint
        value: "var(--info-tint)"

  - group: "Text Hierarchy"
    description: "Luminosity-driven text system. No pure white — the brightest text is off-white (#CDCDE0), preventing eye fatigue on prolonged developer sessions. Muted text fades into the surface, guiding attention naturally."
    notes:
      - label: Text
        text: "Primary (#CDCDE0). Headings, body, labels — the main reading layer."
        cssClass: text
      - label: Text Secondary
        text: "Secondary (#8888A0). Supporting copy, descriptions, metadata."
        cssClass: text-secondary
      - label: Text Muted
        text: "Muted (#5C5C72). Placeholder text, disabled labels, timestamps. Near the surface."
        cssClass: text-muted
      - label: Text Inverse
        text: "Inverse (#0C0C10). Text on light surfaces or bright accent backgrounds."
        cssClass: text-inverse
    colors:
      - name: Text
        value: "var(--text)"
      - name: Text Secondary
        value: "var(--text-secondary)"
      - name: Text Muted
        value: "var(--text-muted)"
      - name: Text Inverse
        value: "var(--text-inverse)"
      - name: Off-White
        value: "var(--off-white)"
      - name: White
        value: "var(--white)"

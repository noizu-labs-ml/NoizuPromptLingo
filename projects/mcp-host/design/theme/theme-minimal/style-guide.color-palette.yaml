color-palette:
  - group: Neutral
    description: "Pure neutral scale — no blue tint. Foundation for all surfaces, borders, and text. The primary visual language of this system."
    notes:
      - label: Usage rule
        text: "Neutrals carry the UI. Backgrounds, borders, text, dividers — all neutral. Reserve color for signal, not decoration."
    colors:
      - name: White
        value: "var(--white)"
      - name: Off White
        value: "var(--off-white)"
      - name: Gray 50
        value: "var(--gray-50)"
      - name: Gray 100
        value: "var(--gray-100)"
      - name: Gray 200
        value: "var(--gray-200)"
      - name: Gray 300
        value: "var(--gray-300)"
      - name: Gray 400
        value: "var(--gray-400)"
      - name: Gray 500
        value: "var(--gray-500)"
      - name: Gray 600
        value: "var(--gray-600)"
      - name: Gray 700
        value: "var(--gray-700)"
      - name: Gray 800
        value: "var(--gray-800)"
      - name: Gray 900
        value: "var(--gray-900)"
      - name: Black
        value: "var(--black)"

  - group: Accent
    description: "Electric Blue — the single chromatic accent. One color. Used sparingly."
    notes:
      - label: Primary CTAs
        text: "Solid blue (#2563EB) on primary action buttons only. One per view."
      - label: Active states
        text: "Blue border or underline on selected nav items, active tabs, focused fields."
      - label: Links
        text: "Blue for inline text links. Underline on hover."
      - label: Restraint rule
        text: "If you're tempted to use blue for decoration, don't. If in doubt, use neutral."
    colors:
      - name: Brand Blue
        value: "var(--brand-blue)"
      - name: Brand Blue Mid
        value: "var(--brand-blue-mid)"
      - name: Brand Blue Light
        value: "var(--brand-blue-light)"

  - group: Semantic
    description: "State colors for feedback, validation, and status. Not for decoration."
    notes:
      - label: Success
        text: "Confirmations, connected states, publish actions."
      - label: Warning
        text: "Cautions, degraded states, attention required."
      - label: Error
        text: "Failures, invalid inputs, destructive action confirmation."
      - label: Info
        text: "Guidance, neutral notifications, informational banners."
    colors:
      - name: Success
        value: "var(--success)"
      - name: Success Tint
        value: "var(--success-tint)"
      - name: Warning
        value: "var(--warning)"
      - name: Warning Tint
        value: "var(--warning-tint)"
      - name: Error
        value: "var(--error)"
      - name: Error Tint
        value: "var(--error-tint)"
      - name: Info
        value: "var(--info)"
      - name: Info Tint
        value: "var(--info-tint)"

typography:
  - var: font-sans
    name: Inter
    description: "Primary typeface for all text — headings, body, labels, UI. System-ui fallback for zero-latency rendering before font load."
    usage: "Everything. Headings, body, buttons, labels, captions."
    weights: [400, 600]

  - var: font-mono
    name: JetBrains Mono
    description: "Monospace typeface for code, token values, API keys, terminal output, and technical identifiers."
    usage: "Code blocks, inline code, token names, CLI output, server addresses."
    weights: [400]
    colors:
      - label: "Neutral"
        value: "var(--text-secondary)"
        background: "var(--surface-alt)"
        note: "Code inline in body text. Low contrast — stays out of the way."
      - label: "Muted"
        value: "var(--text-muted)"
        background: "var(--gray-900)"
        note: "Dark-surface code blocks. Quiet — let the logic, not the color, speak."

typography-classes:
  - name: Display
    class: typography-display
    font-family: "var(--font-sans)"
    font-size: "48px"
    font-weight: "600"
    line-height: "1.1"
    letter-spacing: "-0.02em"

  - name: H1
    class: typography-h1
    font-family: "var(--font-sans)"
    font-size: "36px"
    font-weight: "600"
    line-height: "1.15"
    letter-spacing: "-0.015em"

  - name: H2
    class: typography-h2
    font-family: "var(--font-sans)"
    font-size: "24px"
    font-weight: "600"
    line-height: "1.25"
    letter-spacing: "-0.01em"

  - name: H3
    class: typography-h3
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-xl)"
    font-weight: "600"
    line-height: "1.3"
    letter-spacing: "-0.005em"

  - name: Body
    class: typography-body
    font-family: "var(--font-sans)"
    font-size: "16px"
    font-weight: "400"
    line-height: "1.5"

  - name: Caption
    class: typography-caption
    font-family: "var(--font-sans)"
    font-size: "12px"
    font-weight: "400"
    line-height: "1.5"
    letter-spacing: "0.02em"
    color: "var(--text-muted)"

  - name: Code
    class: typography-code
    font-family: "var(--font-mono)"
    font-size: "14px"
    font-weight: "400"
    line-height: "1.6"

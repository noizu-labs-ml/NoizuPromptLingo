typography:
  - var: font-display
    name: Geist
    description: "Display typeface. Used for hero headings, product names, and large-scale typographic moments. Clean geometric construction with excellent optical spacing at large sizes."
    usage: "Hero text, product names, display headings, marketing copy"
    weights: [400, 500, 700]
    colors:
      - label: "Phosphor Blue"
        value: "var(--brand-blue)"
        background: "var(--surface)"
        note: "Platform name and branded display text. The glow accent applied to type."
      - label: "Off-White"
        value: "var(--off-white)"
        background: "var(--surface)"
        note: "Primary display text on void canvas. Luminous without being harsh."

  - var: font-sans
    name: Inter
    description: "Body and UI typeface. Optimized for screen legibility across all sizes. Neutral geometric proportions that work for dense developer dashboards without fatigue."
    usage: "Body copy, UI labels, buttons, navigation, form fields, card text"
    weights: [400, 500, 600, 700]
    colors:
      - label: "Text"
        value: "var(--text)"
        background: "var(--surface)"
        note: "Primary reading text (#CDCDE0). The main luminosity layer."
      - label: "Text Secondary"
        value: "var(--text-secondary)"
        background: "var(--surface-alt)"
        note: "Supporting copy and metadata (#8888A0). Lower luminosity, guided attention."

  - var: font-mono
    name: JetBrains Mono
    description: "Code and technical label typeface. Designed for extended code reading sessions. Ligatures, optical weight balancing, and distinctive character shapes reduce cognitive load when scanning logs, API responses, and server identifiers."
    usage: "Code blocks, terminal output, API keys, server IDs, token values, version numbers"
    weights: [400, 500, 700]
    colors:
      - label: "Phosphor Blue"
        value: "var(--brand-blue)"
        background: "var(--gray-800)"
        note: "Highlighted identifiers, active token names, selected MCP endpoints."
      - label: "Aurora Green"
        value: "var(--emerald)"
        background: "var(--gray-900)"
        note: "Successful responses, health check output, connected status lines."
      - label: "Ember Red"
        value: "var(--error)"
        background: "var(--gray-900)"
        note: "Error output, failed status, deprecation warnings."

typography-classes:
  - name: Display
    class: typography-display
    font-family: "var(--font-display)"
    font-size: "48px"
    font-weight: "500"
    line-height: "1.05"
    letter-spacing: "-0.02em"
    sample: "MCP Host — Infrastructure for the protocol layer"
    description: "Hero-scale display text. Used for landing page headlines, product names, and large typographic moments."

  - name: H1
    class: typography-h1
    font-family: "var(--font-sans)"
    font-size: "36px"
    font-weight: "500"
    line-height: "1.1"
    letter-spacing: "-0.015em"
    sample: "Deploy your first MCP server in 60 seconds"
    description: "Primary page headings. Dashboard section titles, onboarding step headers."

  - name: H2
    class: typography-h2
    font-family: "var(--font-sans)"
    font-size: "24px"
    font-weight: "500"
    line-height: "1.2"
    letter-spacing: "-0.01em"
    sample: "Server Configuration"
    description: "Secondary headings. Panel titles, feature group labels, card headlines."

  - name: H3
    class: typography-h3
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-xl)"
    font-weight: "500"
    line-height: "1.3"
    letter-spacing: "-0.01em"
    sample: "Authentication Settings"
    description: "Tertiary headings. Subsection labels, settings group titles."

  - name: H4
    class: typography-h4
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-lg)"
    font-weight: "500"
    line-height: "1.4"
    sample: "API Key Rotation Policy"
    description: "Quaternary headings. Dense settings, table group labels."

  - name: Body
    class: typography-body
    font-family: "var(--font-sans)"
    font-size: "16px"
    font-weight: "400"
    line-height: "1.6"
    letter-spacing: "0.01em"
    sample: "The MCP Host platform provides production-grade infrastructure for deploying, scaling, and monitoring Model Context Protocol servers. Configure authentication, rate limits, and routing from a single control plane."
    description: "Primary body text. Documentation, descriptions, onboarding copy."

  - name: Code
    class: typography-code
    font-family: "var(--font-mono)"
    font-size: "14px"
    font-weight: "400"
    line-height: "1.6"
    sample: "npx mcp-jumpstart deploy --server my-mcp --region us-east-1"
    description: "Inline and block code. Terminal commands, API responses, server identifiers, configuration values."

  - name: Label
    class: typography-label
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-xs)"
    font-weight: "600"
    line-height: "1.4"
    letter-spacing: "0.06em"
    text-transform: "uppercase"
    sample: "Server Status"
    description: "UI micro-labels. Form labels, section markers, status badges, data table headers."

  - name: Caption
    class: typography-caption
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-xs)"
    font-weight: "400"
    line-height: "1.5"
    color: "var(--text-muted)"
    sample: "Last synced 3 minutes ago"
    description: "Supporting captions. Timestamps, helper text, footnotes."

# ═══════════════════════════════════════════════════════════════
# MCP Host — Nocturne — Design Token Overrides
#
# Dark-native void canvas system. Phosphor Blue (#3B82F6) as
# primary glow accent. Luminosity-driven text hierarchy.
# Sub-product accents: Cyan / Emerald / Violet.
# ═══════════════════════════════════════════════════════════════

vars:
  groups:
    # ── Surfaces ──
    # Nocturne void palette — cool-tinted dark neutrals
    - name: Surfaces
      vars:
        white: "#EDEDF4"
        off-white: "#CDCDE0"
        gray-50: "#262636"
        gray-100: "#23232E"
        gray-200: "#1C1C26"
        gray-300: "#3A3A4F"
        gray-400: "#5C5C72"
        gray-500: "#8888A0"
        gray-600: "#CDCDE0"
        gray-700: "#18181F"
        gray-800: "#111118"
        gray-900: "#0C0C10"
        black: "#09090B"

    # ── Primaries ──
    # Phosphor Blue as platform identity anchor
    - name: Primaries
      vars:
        brand-red: "#F87171"
        brand-red-light: "rgba(248,113,113,0.15)"
        brand-blue: "#3B82F6"
        brand-blue-light: "rgba(59,130,246,0.15)"
        brand-blue-mid: "rgba(59,130,246,0.40)"
        brand-yellow: "#FACC15"
        brand-yellow-light: "rgba(250,204,21,0.15)"

    # ── Semantic ──
    # Nocturne-calibrated semantic states — bright enough to read on void
    - name: Semantic
      vars:
        success: "#4ADE80"
        success-tint: "rgba(74,222,128,0.15)"
        warning: "#FACC15"
        warning-tint: "rgba(250,204,21,0.15)"
        error: "#F87171"
        error-tint: "rgba(248,113,113,0.15)"
        info: "#60A5FA"
        info-tint: "rgba(96,165,250,0.15)"

    # ── Palette ──
    # Sub-product accents + full utility palette with 0.12 opacity light variants
    - name: Palette
      vars:
        cyan: "#06B6D4"
        cyan-light: "rgba(6,182,212,0.12)"
        emerald: "#10B981"
        emerald-light: "rgba(16,185,129,0.12)"
        violet: "#8B5CF6"
        violet-light: "rgba(139,92,246,0.12)"
        rose: "#F43F5E"
        rose-light: "rgba(244,63,94,0.12)"
        orange: "#F97316"
        orange-light: "rgba(249,115,22,0.12)"
        amber: "#F59E0B"
        amber-light: "rgba(245,158,11,0.12)"
        lime: "#84CC16"
        lime-light: "rgba(132,204,22,0.12)"
        teal: "#14B8A6"
        teal-light: "rgba(20,184,166,0.12)"
        sky: "#38BDF8"
        sky-light: "rgba(56,189,248,0.12)"
        indigo: "#6366F1"
        indigo-light: "rgba(99,102,241,0.12)"
        purple: "#A855F7"
        purple-light: "rgba(168,85,247,0.12)"
        fuchsia: "#D946EF"
        fuchsia-light: "rgba(217,70,239,0.12)"
        pink: "#EC4899"
        pink-light: "rgba(236,72,153,0.12)"

    # ── Typography ──
    # Geist/Inter for display/body, JetBrains Mono for code
    - name: Typography
      vars:
        font-sans: "'Inter', 'Geist', system-ui, sans-serif"
        font-mono: "'JetBrains Mono', 'Fira Code', monospace"
        font-display: "'Geist', 'Inter', system-ui, sans-serif"
        font-body: "'Inter', 'Geist', system-ui, sans-serif"
        font-size-base: "var(--size-md)"
        font-size-xs: "var(--size-xs)"
        font-size-sm: "var(--size-sm)"
        font-size-md: "var(--size-md)"
        font-size-lg: "var(--size-lg)"
        font-size-xl: "var(--size-xl)"
        font-size-2xl: "var(--space-4)"
        font-size-3xl: "var(--space-5)"
        font-size-display: "var(--space-7)"

    # ── Base ──
    - name: Base
      vars:
        base-font-family: "var(--font-body)"
        base-font-color: "var(--text)"
        base-background: "var(--surface)"
        base-line-height: "1.6"
        base-font-size: "var(--font-size-base)"

    # ── Cards ──
    # Elevated void surfaces with mist borders
    - name: Cards
      vars:
        card-background: "#18181F"
        card-border-color: "#2A2A3A"
        card-header-background: "#18181F"
        card-footer-background: "#1C1C26"
        card-footer-font-size: "var(--font-size-xs)"
        card-footer-font-weight: "var(--font-weight-medium)"
        card-footer-padding: "var(--space-1) var(--card-padding)"
        card-separator-style: "solid"
        card-separator-color: "#2A2A3A"
        card-separator-inset: "var(--card-padding)"
        card-tag-color: "var(--text-secondary)"
        card-accent-color: "var(--brand-blue)"
        card-hover-background: "#1C1C26"

    # ── Buttons ──
    # Phosphor Blue primary actions; ghost outline secondary
    - name: Buttons
      vars:
        btn-font-family: "var(--font-sans)"
        btn-font-weight: "500"
        btn-font-size: "14px"
        btn-letter-spacing: "-0.01em"
        btn-background: "#3B82F6"
        btn-color: "#FFFFFF"
        btn-border-color: "transparent"
        btn-hover-background: "#60A5FA"
        btn-outline-background: "transparent"
        btn-outline-color: "#3B82F6"
        btn-outline-hover-background: "rgba(59,130,246,0.1)"

    # ── Toggle / Style Guide Section Titles ──
    - name: Toggle
      vars:
        sg-section-title-font-family: "var(--font-sans)"
        sg-section-title-color: "var(--text)"
        sg-section-number-bg: "rgba(59,130,246,0.1)"
        sg-section-number-border: "1px solid rgba(59,130,246,0.3)"
        sg-section-number-color: "#3B82F6"
        hr-section-color: "linear-gradient(90deg, #3B82F6, #8B5CF6)"
        hr-section-height: "1px"

    # ── HUI: Focus & Interaction ──
    - name: "HUI: Focus & Interaction"
      vars:
        hui-focus-ring-color: "rgba(59,130,246,0.3)"
        hui-focus-ring-width: "var(--border-heavy)"

    # ── HUI: Controls ──
    - name: "HUI: Controls"
      vars:
        hui-control-color: "#3B82F6"
        hui-control-bg: "#18181F"
        hui-control-border: "#2A2A3A"
        hui-control-size: "var(--size-lg)"
        hui-switch-track-on-bg: "#3B82F6"
        hui-switch-track-off-bg: "#3A3A4F"
        hui-switch-thumb-bg: "#EDEDF4"
        hui-radio-option-bg-active: "rgba(59,130,246,0.1)"
        hui-radio-option-border-active: "#3B82F6"
        hui-control-gap: "9px"
        hui-control-shadow: "inset 0 1px 3px rgba(0,0,0,0.3)"
        hui-control-label-color: "var(--text-secondary)"

    # ── HUI: Trigger Buttons ──
    - name: "HUI: Trigger Buttons"
      vars:
        hui-trigger-bg: "#18181F"
        hui-trigger-border: "#2A2A3A"
        hui-trigger-border-hover: "#3A3A4F"
        hui-trigger-color: "var(--text)"

    # ── HUI: Overlay Panels ──
    - name: "HUI: Overlay Panels"
      vars:
        hui-panel-bg: "#18181F"
        hui-panel-border: "#2A2A3A"
        hui-panel-shadow: "0 8px 32px rgba(0,0,0,0.6), 0 2px 8px rgba(0,0,0,0.4), 0 0 1px rgba(59,130,246,0.1)"
        hui-panel-item-color: "var(--text)"
        hui-panel-item-active-bg: "#1C1C26"
        hui-panel-sep-color: "#2A2A3A"
        hui-combo-placeholder-color: "var(--text-muted)"
        hui-combo-btn-color: "var(--text-muted)"

    # ── HUI: Tabs ──
    - name: "HUI: Tabs"
      vars:
        hui-tab-color: "var(--text-muted)"
        hui-tab-color-hover: "var(--text-secondary)"
        hui-tab-color-selected: "#3B82F6"
        hui-tab-border-selected: "#3B82F6"
        hui-tab-list-border: "#2A2A3A"

    # ── HUI: Disclosure ──
    - name: "HUI: Disclosure"
      vars:
        hui-disclosure-bg: "#18181F"
        hui-disclosure-bg-hover: "#1C1C26"
        hui-disclosure-border: "#2A2A3A"
        hui-disclosure-color: "var(--text)"
        hui-disclosure-panel-bg: "#111118"
        hui-disclosure-panel-color: "var(--text-secondary)"
        hui-disclosure-chevron-color: "var(--text-muted)"

    # ── HUI: Field Controls ──
    - name: "HUI: Field Controls"
      vars:
        hui-field-bg: "#18181F"
        hui-field-border: "#2A2A3A"
        hui-field-border-hover: "#3A3A4F"
        hui-field-focus-border: "#3B82F6"
        hui-field-shadow: "inset 0 1px 3px rgba(0,0,0,0.3)"
        hui-field-color: "var(--text)"
        hui-field-chevron-color: "var(--text-muted)"
        hui-field-gap: "6px"

    # ── HUI: Dialog ──
    - name: "HUI: Dialog"
      vars:
        hui-dialog-bg: "#18181F"
        hui-dialog-shadow: "0 24px 64px rgba(0,0,0,0.7), 0 8px 32px rgba(0,0,0,0.5), 0 0 2px rgba(59,130,246,0.15)"
        hui-dialog-title-color: "var(--text)"
        hui-dialog-body-color: "var(--text-secondary)"
        hui-dialog-body-line-height: "1.65"

    # ── HUI: Showcase Grid ──
    - name: "HUI: Showcase Grid"
      vars:
        hui-showcase-accent: "#3B82F6"
        hui-showcase-bg: "#111118"
        hui-showcase-border: "#2A2A3A"
        hui-showcase-cell-bg: "#18181F"
        hui-showcase-cell-border: "#2A2A3A"
        hui-showcase-label-color: "var(--text-muted)"

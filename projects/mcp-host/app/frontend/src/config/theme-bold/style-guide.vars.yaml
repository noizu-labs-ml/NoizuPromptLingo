vars:
  groups:
    - name: Surfaces
      vars:
        white: "#FAFAFA"
        off-white: "#E4E4E7"
        gray-50: "#3F3F46"
        gray-100: "#27272A"
        gray-200: "#27272A"
        gray-300: "#3F3F46"
        gray-400: "#52525B"
        gray-500: "#71717A"
        gray-600: "#A1A1AA"
        gray-700: "#1A1A1A"
        gray-800: "#111111"
        gray-900: "#09090B"
        black: "#000000"

    - name: Primaries
      vars:
        brand-violet: "#7C3AED"
        brand-violet-light: "rgba(124,58,237,0.15)"
        brand-pink: "#EC4899"
        brand-pink-light: "rgba(236,72,153,0.15)"
        brand-cyan: "#06B6D4"
        brand-cyan-light: "rgba(6,182,212,0.15)"
        brand-blue: "#3B82F6"
        brand-blue-light: "rgba(59,130,246,0.15)"
        brand-green: "#10B981"
        brand-green-light: "rgba(16,185,129,0.15)"

    - name: Semantic
      vars:
        success: "#10B981"
        success-tint: "rgba(16,185,129,0.15)"
        warning: "#F59E0B"
        warning-tint: "rgba(245,158,11,0.15)"
        error: "#EF4444"
        error-tint: "rgba(239,68,68,0.15)"
        info: "#3B82F6"
        info-tint: "rgba(59,130,246,0.15)"

    - name: Palette
      vars:
        violet: "#7C3AED"
        violet-light: "rgba(124,58,237,0.12)"
        purple: "#8B5CF6"
        purple-light: "rgba(139,92,246,0.12)"
        pink: "#EC4899"
        pink-light: "rgba(236,72,153,0.12)"
        fuchsia: "#D946EF"
        fuchsia-light: "rgba(217,70,239,0.12)"
        rose: "#F43F5E"
        rose-light: "rgba(244,63,94,0.12)"
        cyan: "#06B6D4"
        cyan-light: "rgba(6,182,212,0.12)"
        sky: "#0EA5E9"
        sky-light: "rgba(14,165,233,0.12)"
        blue: "#3B82F6"
        blue-light: "rgba(59,130,246,0.12)"
        indigo: "#6366F1"
        indigo-light: "rgba(99,102,241,0.12)"
        teal: "#14B8A6"
        teal-light: "rgba(20,184,166,0.12)"
        emerald: "#10B981"
        emerald-light: "rgba(16,185,129,0.12)"
        green: "#22C55E"
        green-light: "rgba(34,197,94,0.12)"
        amber: "#F59E0B"
        amber-light: "rgba(245,158,11,0.12)"
        orange: "#F97316"
        orange-light: "rgba(249,115,22,0.12)"

    - name: Typography
      vars:
        font-sans: "'Inter', system-ui, sans-serif"
        font-mono: "'JetBrains Mono', monospace"
        font-display: "'Space Grotesk', system-ui, sans-serif"
        font-body: "'Inter', system-ui, sans-serif"
        font-size-base: "var(--size-md)"
        font-size-xs: "var(--size-xs)"
        font-size-sm: "var(--size-sm)"
        font-size-md: "var(--size-md)"
        font-size-lg: "var(--size-lg)"
        font-size-xl: "var(--size-xl)"
        font-size-2xl: "var(--space-4)"
        font-size-3xl: "var(--space-5)"
        font-size-display: "var(--space-7)"

    - name: "Grid & Spacing"
      vars: {}

    - name: Base
      vars:
        base-font-family: "var(--font-body)"
        base-font-color: "var(--text)"
        base-background: "var(--surface)"
        base-line-height: "1.6"
        base-font-size: "var(--font-size-base)"

    - name: Cards
      vars:
        card-background: "#1A1A1A"
        card-border-color: "#27272A"
        card-header-background: "#1A1A1A"
        card-footer-background: "#111111"
        card-footer-font-size: "var(--font-size-xs)"

    - name: Buttons
      vars:
        btn-font-family: "var(--font-display)"
        btn-font-weight: "700"
        btn-font-size: "14px"
        btn-letter-spacing: "0.02em"
        btn-background: "#7C3AED"
        btn-color: "#FFFFFF"
        btn-border-color: "transparent"
        btn-hover-background: "#8B5CF6"
        btn-hover-border-color: "transparent"
        btn-outline-background: "transparent"
        btn-outline-color: "#7C3AED"
        btn-outline-hover-background: "rgba(124,58,237,0.1)"

    - name: Toggle
      vars:
        sg-section-title-font-family: "var(--font-display)"
        sg-section-title-text-transform: "uppercase"
        sg-section-title-letter-spacing: "0.04em"
        sg-section-title-color: "var(--text)"
        sg-section-title-font-weight: "700"
        sg-section-number-bg: "rgba(124,58,237,0.12)"
        sg-section-number-border: "1px solid rgba(124,58,237,0.35)"
        sg-section-number-color: "#7C3AED"
        sg-section-number-radius: "var(--radius-md)"
        sg-section-desc-font-family: "var(--font-body)"
        sg-section-desc-color: "var(--text-muted)"
        hr-section-color: "linear-gradient(90deg, #7C3AED, #EC4899)"
        hr-section-height: "2px"
        hr-subsection-color: "linear-gradient(90deg, #7C3AED, transparent)"
        hr-subsection-height: "1px"
        hr-accent-color: "#7C3AED"
        sg-type-specimen-bg: "#1A1A1A"
        sg-type-specimen-border: "1px solid #27272A"
        sg-type-specimen-border-bottom: "1px solid #27272A"
        sg-type-specimen-radius: "var(--radius-md)"
        sg-type-specimen-padding: "var(--space-3)"
        sg-type-specimen-margin: "0 0 var(--space-3) 0"
        sg-type-specimen-name-color: "#7C3AED"
        sg-type-specimen-name-font: "var(--font-display)"

    - name: "HUI: Focus & Interaction"
      vars:
        hui-focus-ring-color: "rgba(124,58,237,0.4)"
        hui-focus-ring-width: "2px"

    - name: "HUI: Controls"
      vars:
        hui-control-color: "#7C3AED"
        hui-control-bg: "#09090B"
        hui-control-border: "#27272A"
        hui-control-shadow: "inset 0 0 6px rgba(124,58,237,0.05)"
        hui-checkbox-radius: "4px"
        hui-switch-track-on-bg: "#7C3AED"
        hui-switch-track-off-bg: "#27272A"
        hui-switch-thumb-shadow: "0 0 8px rgba(124,58,237,0.4)"
        hui-radio-option-border: "#27272A"
        hui-radio-option-border-active: "#7C3AED"
        hui-radio-option-bg-active: "rgba(124,58,237,0.08)"

    - name: "HUI: Trigger Buttons"
      vars:
        hui-trigger-bg: "#1A1A1A"
        hui-trigger-border: "#27272A"
        hui-trigger-border-hover: "#7C3AED"
        hui-trigger-color: "#FAFAFA"
        hui-trigger-transition: "border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease"

    - name: "HUI: Overlay Panels"
      vars:
        hui-panel-bg: "#1A1A1A"
        hui-panel-border: "#27272A"
        hui-panel-shadow: "0 8px 32px rgba(0,0,0,0.7), 0 0 1px rgba(124,58,237,0.15)"
        hui-panel-item-active-bg: "rgba(124,58,237,0.1)"
        hui-panel-item-active-color: "#8B5CF6"
        hui-panel-sep-color: "#27272A"

    - name: "HUI: Tabs"
      vars:
        hui-tab-color: "#52525B"
        hui-tab-color-selected: "#7C3AED"
        hui-tab-border-selected: "#7C3AED"
        hui-tab-color-hover: "#FAFAFA"
        hui-tab-list-border: "#27272A"

    - name: "HUI: Disclosure"
      vars:
        hui-disclosure-bg: "#1A1A1A"
        hui-disclosure-bg-hover: "#27272A"
        hui-disclosure-border: "#27272A"
        hui-disclosure-color: "#FAFAFA"
        hui-disclosure-panel-bg: "#111111"
        hui-disclosure-panel-color: "#A1A1AA"
        hui-disclosure-chevron-color: "#7C3AED"

    - name: "HUI: Field Controls"
      vars:
        hui-field-bg: "#09090B"
        hui-field-border: "#27272A"
        hui-field-border-hover: "#3F3F46"
        hui-field-focus-border: "#7C3AED"
        hui-field-color: "#FAFAFA"
        hui-field-shadow: "inset 0 0 8px rgba(0,0,0,0.4)"
        hui-combo-placeholder-color: "#52525B"
        hui-combo-btn-color: "#52525B"

    - name: "HUI: Dialog"
      vars:
        hui-dialog-bg: "#1A1A1A"
        hui-dialog-shadow: "0 24px 64px rgba(0,0,0,0.8), 0 0 2px rgba(124,58,237,0.2)"
        hui-dialog-title-color: "#FAFAFA"
        hui-dialog-body-color: "#A1A1AA"
        hui-dialog-backdrop: "rgba(0,0,0,0.85)"

    - name: "HUI: Showcase Grid"
      vars:
        hui-showcase-accent: "#7C3AED"
        hui-showcase-bg: "#1A1A1A"
        hui-showcase-border: "#27272A"
        hui-showcase-cell-bg: "#09090B"
        hui-showcase-cell-border: "#27272A"
        hui-showcase-label-color: "#52525B"

typography:
  - var: font-display
    name: Space Grotesk
    description: >
      The signature voice. Space Grotesk is geometric without being cold —
      it has personality baked into its curves and alternate characters.
      At 56px and 700 weight it dominates a hero. At 28px it commands a
      section. Oversized, uppercase display text is the Bold brand signature.
    usage: "Hero headlines, section titles, display type, button labels, logo text"
    weights: [400, 500, 700]
    colors:
      - label: "Gradient Primary"
        value: "#7C3AED"
        background: "#09090B"
        note: "Violet anchor — display headings, gradient text effect starting point."
      - label: "Gradient Secondary"
        value: "#EC4899"
        background: "#09090B"
        note: "Pink terminus — gradient text effect endpoint, emphasis."
      - label: "White"
        value: "#FAFAFA"
        background: "#09090B"
        note: "Primary display text on dark surfaces."

  - var: font-mono
    name: JetBrains Mono
    description: >
      Developer-grade monospace with programming ligatures. Clean, readable,
      and purposeful. Where Space Grotesk announces, JetBrains Mono executes.
      Used wherever code or technical data appears.
    usage: "Code blocks, terminal output, API keys, token values, data displays"
    weights: [400, 500, 700]
    colors:
      - label: "Cyan"
        value: "#06B6D4"
        background: "#09090B"
        note: "Code output, function calls, interactive terminal elements."
      - label: "Violet Light"
        value: "#8B5CF6"
        background: "#09090B"
        note: "Keywords, type annotations, decorative code accents."

  - var: font-body
    name: Inter
    description: >
      The readable workhorse. Inter handles all prose and secondary UI copy
      where Space Grotesk would overwhelm. Crisp at small sizes, invisible
      at its best — the text disappears and the meaning remains.
    usage: "Body paragraphs, descriptions, form labels, secondary UI text, long-form content"
    weights: [400, 500, 700]

  - var: font-sans
    name: Inter
    description: "System-level sans-serif for UI elements and fallback contexts."
    usage: "Navigation labels, form inputs, secondary UI, fallback body text"
    weights: [400, 500]

typography-classes:
  - name: Display
    class: typography-display
    font-family: "var(--font-display)"
    font-size: "56px"
    font-weight: "700"
    line-height: "1.05"
    letter-spacing: "-0.03em"
    text-transform: "uppercase"
    sample: "MCP HOST"
    usage: "Hero headlines, brand moments, full-bleed landing sections"

  - name: H1
    class: typography-h1
    font-family: "var(--font-display)"
    font-size: "40px"
    font-weight: "700"
    line-height: "1.1"
    letter-spacing: "-0.02em"
    sample: "Orchestrate at Scale"
    usage: "Page titles, primary section headlines"

  - name: H2
    class: typography-h2
    font-family: "var(--font-display)"
    font-size: "28px"
    font-weight: "700"
    line-height: "1.2"
    letter-spacing: "-0.015em"
    sample: "Deploy MCP Servers"
    usage: "Section headings, card group titles, feature headers"

  - name: H3
    class: typography-h3
    font-family: "var(--font-display)"
    font-size: "20px"
    font-weight: "500"
    line-height: "1.3"
    letter-spacing: "-0.01em"
    sample: "Connection Registry"
    usage: "Subsection headings, card titles, component labels"

  - name: Body
    class: typography-body
    font-family: "var(--font-body)"
    font-size: "16px"
    font-weight: "400"
    line-height: "1.6"
    sample: "MCP Host provides a unified control plane for deploying, monitoring, and scaling Model Context Protocol servers. Connect your AI agents to the tools they need without managing infrastructure."
    usage: "Paragraphs, descriptions, documentation, long-form content"

  - name: Code
    class: typography-code
    font-family: "var(--font-mono)"
    font-size: "14px"
    font-weight: "400"
    line-height: "1.7"
    sample: "const client = new MCPHostClient({ endpoint: 'https://api.mcp.host/v1', apiKey: process.env.MCP_API_KEY });"
    usage: "Code blocks, terminal output, API examples, token displays"

  - name: Label
    class: typography-label
    font-family: "var(--font-display)"
    font-size: "11px"
    font-weight: "700"
    line-height: "1.4"
    letter-spacing: "0.08em"
    text-transform: "uppercase"
    sample: "SERVER STATUS · 3 ACTIVE · LAST DEPLOY 2M AGO"
    usage: "Status labels, navigation items, section markers, metadata"

# Enterprise theme: uses brand tokens where available, falls back to hex
# for palette colors not defined in this theme's vars.yaml.
# Tints use explicit rgba since enterprise semantic tints are not defined.
semantic-classes:
  - name: danger
    class: danger
    group: States
    title: Danger
    description: Critical error states requiring immediate attention
    accent-style: bottom-bar
    vars:
      accent: "var(--error)"
      background: "rgba(220,38,38,0.08)"
      color: "var(--error)"

  - name: warning
    class: warning
    group: States
    title: Warning
    description: Cautionary messages about potential issues
    accent-style: bottom-bar
    vars:
      accent: "var(--warning)"
      background: "rgba(217,119,6,0.08)"
      color: "var(--warning)"

  - name: info
    class: info
    group: States
    title: Information
    description: Helpful context and guidance
    accent-style: bottom-bar
    vars:
      accent: "var(--info)"
      background: "rgba(37,99,235,0.08)"
      color: "var(--info)"

  - name: success
    class: success
    group: States
    title: Success
    description: Confirmation of successful actions
    accent-style: bottom-bar
    vars:
      accent: "var(--success)"
      background: "rgba(5,150,105,0.08)"
      color: "var(--success)"

  - name: primary
    class: primary
    group: Actions
    title: Primary
    description: Main calls to action
    accent-style: outer-shadow
    vars:
      accent: "var(--brand-blue)"
      background: "var(--brand-blue-light)"
      color: "var(--brand-blue)"

  - name: secondary
    class: secondary
    group: Actions
    title: Secondary
    description: Secondary actions
    accent-style: none
    vars:
      accent: "var(--gray-400)"
      background: "var(--surface-alt)"
      color: "var(--text-secondary)"

  - name: aside
    class: aside
    group: Content
    title: Aside
    description: Supplementary information
    accent-style: left-border
    vars:
      accent: "var(--brand-teal)"
      background: "var(--brand-teal-light)"
      color: "var(--brand-teal)"

  - name: neutral
    class: neutral
    group: Content
    title: Neutral
    description: General purpose content
    accent-style: bottom-bar
    vars:
      accent: "var(--brand-indigo)"
      background: "var(--brand-indigo-light)"
      color: "var(--brand-indigo)"

  - name: brand
    class: brand
    group: Content
    title: Brand
    description: Brand identity content
    accent-style: bottom-bar-glow
    vars:
      accent: "var(--brand-blue)"
      background: "var(--brand-blue-light)"
      color: "var(--brand-blue)"

  - name: draft
    class: draft
    group: Workflow
    title: Draft
    description: Work-in-progress content
    accent-style: left-dashed
    vars:
      accent: "var(--brand-indigo)"
      background: "var(--brand-indigo-light)"
      color: "var(--brand-indigo)"

  - name: published
    class: published
    group: Workflow
    title: Published
    description: Live completed content
    accent-style: bottom-bar
    vars:
      accent: "var(--success)"
      background: "rgba(5,150,105,0.08)"
      color: "var(--success)"

  - name: pending
    class: pending
    group: Workflow
    title: Pending
    description: Waiting or processing states
    accent-style: bottom-bar
    vars:
      accent: "var(--warning)"
      background: "rgba(217,119,6,0.08)"
      color: "var(--warning)"

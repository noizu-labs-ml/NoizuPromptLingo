# Spec Constants — Single source of truth for values used across spec files.
#
# Usage:  make spec-update KEY=chord_prefix NEW="⌘⇧T"
#         python3 .tmp/spec-constants.py chord_prefix "⌘⇧X"
#
# Each constant defines:
#   values:   list of text representations (all are replaced together)
#   files:    glob patterns for files to search (relative to repo root)

app_name:
  description: Product name used in prose, diagrams, and user stories
  values:
    - ClipStash

chord_prefix:
  description: Global hotkey chord prefix that activates the app
  values:
    - "⌘⇧T"
    - "Cmd+Shift+T"

pricing_pro_monthly:
  description: Pro tier monthly price
  values:
    - "$9/mo"

pricing_pro_annual:
  description: Pro tier annual price
  values:
    - "$79/yr"

pricing_team:
  description: Team tier per-user monthly price
  values:
    - "$14/user/mo"

poll_interval:
  description: NSPasteboard polling interval
  values:
    - "250ms"

sla_panel_latency:
  description: Max panel open latency
  values:
    - "<100ms"

sla_search_latency:
  description: Max search result latency
  values:
    - "<50ms"

sla_semantic_latency:
  description: Max semantic search latency
  values:
    - "<200ms"

sla_macro_latency:
  description: Max macro expansion latency
  values:
    - "<30ms"

sla_memory:
  description: Max memory footprint
  values:
    - "<80MB"

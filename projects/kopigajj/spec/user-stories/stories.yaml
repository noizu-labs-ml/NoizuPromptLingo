stories:
- id: US-001
  title: Global Hotkey Activation
  user_story: ''
  scenarios:
  - given: the application is running in the background
    when: the user presses Cmd+Shift+V
    then: a clipboard popup window should appear
  - given: the clipboard popup window is already visible
    when: the user presses Cmd+Shift+V
    then: the popup should be dismissed
  notes:
    persona: both
    t_shirt_size: S
    complexity: medium
    risks: Conflicts with other apps using same hotkey, macOS permissions
    dependencies:
    - US-000
  stage: 0
  impacts: []
  status: pending
- id: US-002
  title: Popup Display Current Clipboard
  user_story: ''
  scenarios:
  - given: the user has text content in the clipboard
    when: the user presses Cmd+Shift+V to open the popup
    then: the popup should display the current text clipboard content
  - given: the user has an image in the clipboard
    when: the user presses Cmd+Shift+V to open the popup
    then: the popup should display a preview of the clipboard image
  - given: the user has an empty clipboard
    when: the user presses Cmd+Shift+V to open the popup
    then: the popup should display a message indicating the clipboard is empty
  notes:
    persona: both
    t_shirt_size: M
    complexity: medium
    risks: Large clipboard content may cause performance issues
    dependencies:
    - US-001
  stage: 1
  impacts: []
  status: pending
- id: US-003
  title: Dismiss Popup with Escape Key
  user_story: ''
  scenarios:
  - given: the clipboard popup window is visible
    when: the user presses the Escape key
    then: the popup should be dismissed and focus should return to the previous application
  - given: the clipboard popup window is not visible
    when: the user presses the Escape key
    then: nothing should happen (no action should be triggered)
  notes:
    persona: both
    t_shirt_size: XS
    complexity: low
    risks: None significant
    dependencies:
    - US-001
    - US-002
  stage: 1
  impacts: []
  status: pending
- id: US-004
  title: View Clipboard History
  user_story: ''
  scenarios:
  - given: the user has copied 5 different text items in the last hour
    when: the user opens the clipboard popup
    then: the popup should display a list of the 5 most recent clipboard entries
  - given: the clipboard popup is showing history
    when: the popup renders
    then: each history item should be numbered (1-10) for quick reference
  - given: the user has copied 15 different items
    when: the user opens the clipboard popup
    then: the popup should display only the 10 most recent items
  notes:
    persona: both
    t_shirt_size: S
    complexity: medium
    risks: Performance with large history items
    dependencies:
    - US-001
    - US-002
  stage: 2
  impacts: []
  status: pending
- id: US-005
  title: Navigate History with Arrow Keys
  user_story: ''
  scenarios:
  - given: the clipboard popup is displaying history
    when: the user presses the down arrow key
    then: the selection should move to the next item in the list
  - given: the clipboard popup is displaying history and an item other than the first
      is selected
    when: the user presses the up arrow key
    then: the selection should move to the previous item in the list
  - given: the clipboard popup is displaying history and the last item is selected
    when: the user presses the down arrow key
    then: the selection should wrap around to the first item
  notes:
    persona: both
    t_shirt_size: S
    complexity: medium
    risks: None significant
    dependencies:
    - US-004
  stage: 2
  impacts: []
  status: pending
- id: US-006
  title: Paste Selected History Item
  user_story: ''
  scenarios:
  - given: the clipboard popup is displaying history and an item is selected
    when: the user presses the Enter key
    then: the selected item should be copied to the clipboard and the popup should
      be dismissed
  - given: the clipboard popup is displaying history
    when: the user presses a number key (1-9)
    then: the corresponding history item should be copied to the clipboard and the
      popup should be dismissed
  notes:
    persona: both
    t_shirt_size: S
    complexity: low
    risks: None significant
    dependencies:
    - US-005
  stage: 2
  impacts: []
  status: pending
- id: US-007
  title: Click to Paste with Mouse
  user_story: ''
  scenarios:
  - given: the clipboard popup is displaying history
    when: the user clicks on a history item with the mouse
    then: that item should be copied to the clipboard and the popup should be dismissed
  notes:
    persona: both
    t_shirt_size: XS
    complexity: low
    risks: None significant
    dependencies:
    - US-004
  stage: 3
  impacts: []
  status: pending
- id: US-008
  title: Clipboard History Persistence
  user_story: ''
  scenarios:
  - given: the application is running and has collected clipboard history
    when: the application is terminated (quit or crash)
    then: the clipboard history should be saved to storage
  - given: the application has previously saved clipboard history
    when: the application starts up
    then: the saved clipboard history should be loaded and available
  - given: the application has saved clipboard history
    when: the operating system is restarted and the application launches
    then: the saved clipboard history should be available
  notes:
    persona: both
    t_shirt_size: M
    complexity: medium
    risks: Data corruption during writes, performance with large history
    dependencies:
    - US-004
    - US-061
  stage: 3
  impacts: []
  status: pending
- id: US-009
  title: Configure Maximum History Size
  user_story: ''
  scenarios:
  - given: the application has a default max history of 50 items
    when: the user configures max history to 100 items
    then: the application should keep up to 100 items in history
  - given: the user has configured max history to 50 items and has 50 items in history
    when: the user copies a new item
    then: the oldest item should be removed from history and the new item added
  - given: the user is configuring max history
    when: the user enters an invalid value (negative or unreasonably large)
    then: the application should reject the invalid value or apply a reasonable maximum
  notes:
    persona: developer
    t_shirt_size: S
    complexity: low
    risks: None significant
    dependencies:
    - US-008
    - US-062
  stage: 3
  impacts: []
  status: pending
- id: US-010
  title: Manually Clear History
  user_story: ''
  scenarios:
  - given: the application has clipboard history with multiple items
    when: the user selects the clear history option
    then: all clipboard history items should be deleted
  - given: the user selects the clear history option
    when: the application is about to delete all history
    then: a confirmation dialog should be displayed
  - given: the clear history confirmation dialog is displayed
    when: the user cancels the operation
    then: the clipboard history should remain unchanged
  notes:
    persona: both
    t_shirt_size: XS
    complexity: low
    risks: Accidental data loss if confirmation is dismissed
    dependencies:
    - US-008
  stage: 3
  impacts: []
  status: pending
- id: US-011
  title: Search Clipboard History
  user_story: ''
  scenarios:
  - given: the clipboard popup is displaying history with 10 items
    when: the user starts typing search query
    then: the history should be filtered to show only items matching the query
  - given: the user is typing a search query
    when: each character is typed
    then: the search results should update in real-time
  - given: the clipboard popup is displaying filtered search results
    when: the user clears the search query
    then: all clipboard history items should be displayed
  notes:
    persona: both
    t_shirt_size: S
    complexity: medium
    risks: Performance with large history during search
    dependencies:
    - US-004
  stage: 4
  impacts: []
  status: pending
- id: US-012
  title: Case-Insensitive Search
  user_story: ''
  scenarios:
  - given: the clipboard contains "Hello World"
    when: the user searches for "hello"
    then: '"Hello World" should appear in the search results'
  - given: 'the clipboard contains "My API Key: ABC123"'
    when: the user searches for "api key"
    then: '"My API Key: ABC123" should appear in the search results'
  - given: the clipboard contains "CONFIGURATION.json"
    when: the user searches for "configuration"
    then: '"CONFIGURATION.json" should appear in the search results'
  notes:
    persona: both
    t_shirt_size: XS
    complexity: low
    risks: None significant
    dependencies:
    - US-011
  stage: 4
  impacts: []
  status: pending
- id: US-013
  title: Search Match Highlighting
  user_story: ''
  scenarios:
  - given: the clipboard contains "The quick brown fox"
    when: the user searches for "quick"
    then: the word "quick" should be highlighted in the search results
  - given: 'the clipboard contains "error: system error occurred"'
    when: the user searches for "error"
    then: both occurrences of "error" should be highlighted
  - given: the clipboard contains "Hello World"
    when: the user searches for "xyz"
    then: no highlighting should be displayed (no matches)
  notes:
    persona: developer
    t_shirt_size: S
    complexity: medium
    risks: Performance overhead with highlighting
    dependencies:
    - US-011
  stage: 4
  impacts: []
  status: pending
- id: US-014
  title: Detect and Display Content Type
  user_story: ''
  scenarios:
  - given: the clipboard contains plain text "Hello World"
    when: the clipboard popup displays this item
    then: a text content type indicator should be shown
  - given: the clipboard contains "https://example.com/api/v1/users"
    when: the clipboard popup displays this item
    then: a URL content type indicator should be shown
  - given: the clipboard contains an image
    when: the clipboard popup displays this item
    then: an image content type indicator should be shown
  - given: the clipboard contains a file path "/Users/keith/Documents/file.txt"
    when: the clipboard popup displays this item
    then: a file path content type indicator should be shown
  notes:
    persona: both
    t_shirt_size: M
    complexity: medium
    risks: Incorrect type detection for edge cases
    dependencies:
    - US-004
  stage: 5
  impacts: []
  status: pending
- id: US-015
  title: Display Copy Timestamps
  user_story: ''
  scenarios:
  - given: the user copied text "Hello World" 5 minutes ago
    when: the clipboard popup displays this item
    then: a timestamp indicating "5 minutes ago" should be shown
  - given: the user copied an item 2 hours ago
    when: the clipboard popup displays this item
    then: a timestamp indicating "2 hours ago" should be shown
  - given: the user copied an item 3 days ago
    when: the clipboard popup displays this item
    then: a timestamp indicating "3 days ago" should be shown
  - given: the user hovers over a history item
    when: the cursor pauses on the item
    then: the absolute timestamp (e.g., "2026-03-03 14:30:00") should be displayed
  notes:
    persona: developer
    t_shirt_size: S
    complexity: low
    risks: Localization of date/time formats
    dependencies:
    - US-004
  stage: 5
  impacts: []
  status: pending
- id: US-016
  title: Filter History by Content Type
  user_story: ''
  scenarios:
  - given: the clipboard history contains text, URLs, and images
    when: the user selects "URLs only" filter
    then: only URL items should be displayed
  - given: the clipboard history contains text, URLs, and images
    when: the user selects "Images only" filter
    then: only image items should be displayed
  - given: the clipboard history is filtered to show only URLs
    when: the user clears the content type filter
    then: all items in history should be displayed
  notes:
    persona: developer
    t_shirt_size: S
    complexity: low
    risks: None significant
    dependencies:
    - US-011
    - US-014
  stage: 5
  impacts: []
  status: pending
- id: US-017
  title: Delete Single History Item
  user_story: ''
  scenarios:
  - given: the clipboard popup is displaying history and an item is selected
    when: the user presses the Delete key
    then: the selected item should be removed from history
  - given: the clipboard popup is displaying history
    when: the user right-clicks on an item and selects "Delete"
    then: that item should be removed from history
  - given: the user attempts to delete a history item
    when: the item is a sensitive type (large text, large image, etc.)
    then: a confirmation dialog may be shown before deletion
  notes:
    persona: both
    t_shirt_size: S
    complexity: low
    risks: Accidental deletion
    dependencies:
    - US-004
  stage: 5
  impacts: []
  status: pending
- id: US-018
  title: Configuration UI for settings
  user_story: ''
  scenarios:
  - given: the Smart Clipboard application is running and the menu bar icon is visible
    when: I click on the menu bar icon and select "Settings" (or use Cmd+,)
    then: a settings window should appear with a sidebar listing all configuration
      categories
  - given: the settings window is open and showing the General section
    when: I click on different category names in the sidebar
    then: the main panel should display the options for that category without closing
      the window
  - given: the settings window is open and I have modified one or more preferences
    when: I click "Save" or navigate away from the current section
    then: the modified settings should be persisted to the application preferences
      and take effect immediately
  notes:
    persona: both
    t_shirt_size: M
    complexity: medium
    risks: Settings changes may require app restart in some cases; needs clear feedback
    dependencies: []
  stage: 6
  impacts: []
  status: pending
- id: US-019
  title: Hotkey customization
  user_story: ''
  scenarios:
  - given: the settings window is open in the "General" or "Hotkeys" section
    when: I click on the hotkey field and press a new key combination (e.g., Cmd+Option+V)
    then: the new hotkey should be saved and registered globally
  - given: I am attempting to assign a new hotkey
    when: the key combination is already in use by the system or another application
    then: a warning should appear indicating the conflict and suggesting an alternative
  - given: a custom hotkey is configured
    when: I click the "Reset to Default" button
    then: the hotkey should revert to Cmd+Shift+V
  - given: I am in the hotkey customization field
    when: I press a key combination that cannot be registered (e.g., single modifier
      key only)
    then: the field should remain unchanged and display a brief error message
  notes:
    persona: knowledge-worker
    t_shirt_size: S
    complexity: medium
    risks: Must handle hotkey registration failures gracefully; some system keys cannot
      be overridden
    dependencies:
    - US-018
  stage: 6
  impacts: []
  status: pending
- id: US-020
  title: Auto-start on login
  user_story: ''
  scenarios:
  - given: the settings window is open in the "General" section
    when: I toggle "Start at login" to ON
    then: a helper helper application or launch agent should be registered to start
      Smart Clipboard at login
  - given: '"Start at login" is enabled'
    when: I logout and login to macOS
    then: Smart Clipboard should be running in the background and the menu bar icon
      should be visible
  - given: '"Start at login" is enabled'
    when: I toggle "Start at login" to OFF
    then: the launch agent/helper should be deregistered and the app will not start
      on next login
  notes:
    persona: knowledge-worker
    t_shirt_size: S
    complexity: low
    risks: macOS LaunchAgents can be tricky; may require helper app for proper background
      operation
    dependencies:
    - US-018
  stage: 6
  impacts: []
  status: pending
- id: US-021
  title: Exclude specific applications from clipboard monitoring
  user_story: ''
  scenarios:
  - given: the settings window is open in the "Privacy" section
    when: I click "Add Application" and select an app from the file picker (or drag
      an app to the list)
    then: the selected application bundle identifier should be added to the exclusion
      list
  - given: '"1Password" is in the exclusion list'
    when: I copy content while the 1Password application is frontmost
    then: the clipboard content should not be saved to the history
  - given: the settings window is open and shows an exclusion list with entries
    when: I click the remove button next to an application name
    then: that application should be removed from the exclusion list and clipboard
      monitoring should resume for that app
  - given: Smart Clipboard's settings window is open in the "Privacy" section
    when: I click "Exclude Current App" and another application is frontmost
    then: the frontmost application should be immediately added to the exclusion list
  notes:
    persona: knowledge-worker
    t_shirt_size: M
    complexity: medium
    risks: Must properly detect frontmost app; need to handle app bundle identifier
      changes
    dependencies:
    - US-018
    - US-032
  stage: 6
  impacts: []
  status: pending
- id: US-022
  title: Sync target configuration
  user_story: ''
  scenarios:
  - given: sync is configured and active
    when: I toggle "Enable Sync" to OFF
    then: sync should be disabled and no data should be sent to or retrieved from
      the configured target
  - given: sync is configured
    when: I view the Sync section in settings
    then: the status indicator should show "Connected" or "Not Connected" with the
      last sync timestamp
  notes:
    persona: developer
    t_shirt_size: L
    complexity: high
    risks: Multiple sync providers add complexity; offline mode needs consideration
    dependencies:
    - US-018
    - US-023
  stage: 6
  impacts: []
  status: pending
- id: US-023
  title: Display sync status in UI
  user_story: ''
  scenarios:
  - given: sync is configured and has completed successfully
    when: I view the menu bar icon or menu
    then: a green indicator or sync icon should show that the device is synced
  - given: I have made changes to clipboard history that have not yet synced
    when: I view the menu bar icon or menu
    then: an orange or yellow indicator should show that unsynced changes are present
  - given: sync is configured but has encountered an error
    when: I view the menu bar icon or menu
    then: a red indicator should show that sync has failed
  - given: the settings window is open in the "Sync" section
    when: I view the sync status area
    then: I should see the last sync timestamp, sync status, and any applicable error
      messages
  - given: a sync status indicator is visible in the menu bar
    when: I click on the indicator
    then: the popup menu should show last sync time and a "View Details" option
  notes:
    persona: knowledge-worker
    t_shirt_size: S
    complexity: low
    risks: Status indicators should be unobtrusive but informative
    dependencies:
    - US-022
  stage: 7
  impacts: []
  status: pending
- id: US-024
  title: Manual sync trigger
  user_story: ''
  scenarios:
  - given: sync is configured with active network connection
    when: I click the menu bar icon and select "Sync Now"
    then: the app should immediately initiate a sync operation with the configured
      target
  - given: I have triggered a manual sync
    when: the sync is in progress
    then: a spinning indicator or progress bar should appear in the menu or notification
      center
  - given: I have triggered a manual sync
    when: the sync completes successfully
    then: a brief notification should appear confirming the sync completed with the
      timestamp
  - given: a sync is currently in progress
    when: I attempt to click "Sync Now" again
    then: the button should be disabled or show "Syncing in progress" to prevent duplicate
      syncs
  - given: I have triggered a manual sync
    when: the sync fails due to a network or server error
    then: an error notification should appear with a descriptive message and a "Retry"
      option
  notes:
    persona: knowledge-worker
    t_shirt_size: S
    complexity: low
    risks: Need to handle rapid sync requests; offline mode
    dependencies:
    - US-022
    - US-023
  stage: 7
  impacts: []
  status: pending
- id: US-025
  title: Encryption key setup and management
  user_story: ''
  scenarios:
  - given: sync is configured for the first time
    when: I accept the suggested "Set up encryption" prompt
    then: a new encryption key should be generated and stored in the macOS Keychain
  - given: I have previously set up encryption on another device
    when: I select "Import Encryption Key" and paste or upload the key
    then: the app should validate and store the key for decrypting synced data
  - given: an encryption key is configured
    when: I click "Backup Encryption Key"
    then: the key should be displayed or downloaded in a secure format for backup
      purposes
  - given: an encryption key is already configured
    when: I click "Change Encryption Key"
    then: a new key should be generated and existing data should be re-encrypted with
      the new key
  - given: an encryption key is configured
    when: I click "Delete Encryption Key" (with confirmation)
    then: the key should be removed from the system and encrypted data should become
      inaccessible
  notes:
    persona: developer
    t_shirt_size: L
    complexity: high
    risks: Lost keys mean permanently lost data; key management must be bulletproof
    dependencies:
    - US-022
    - US-026
  stage: 7
  impacts: []
  status: pending
- id: US-026
  title: Client-side encryption for sync data
  user_story: ''
  scenarios:
  - given: I have clipboard items to sync
    when: the sync process prepares data for upload
    then: each clipboard item should be encrypted using the configured key before
      being sent to the server
  - given: I receive encrypted clipboard items from the sync server
    when: the sync process processes downloaded data
    then: each clipboard item should be decrypted using the configured key before
      being stored locally
  - given: encrypted data exists on the sync server
    when: a device attempts to sync without an encryption key
    then: the sync should fail with a clear error message indicating that the encryption
      key is required
  - given: I have synced clipboard items
    when: I inspect the data stored on the sync server directly
    then: the clipboard content should be encrypted and not readable in plaintext
  - given: encrypted data exists on the sync server with an old key
    when: I change my encryption key
    then: existing data should be downloaded, decrypted with the old key, re-encrypted
      with the new key, and re-updated to the server
  notes:
    persona: developer
    t_shirt_size: XL
    complexity: very-high
    risks: Encryption must be auditable; key loss means data loss; performance impact
    dependencies:
    - US-022
    - US-025
  stage: 7
  impacts: []
  status: pending
- id: US-027
  title: Conflict resolution when devices have divergent history
  user_story: ''
  scenarios:
  - given: two devices have different clipboard histories with no overlapping changes
    when: sync is performed
    then: the histories should be merged with both devices receiving all items from
      each other
  - given: two devices have modified the same clipboard item (same item ID) with different
      content
    when: sync is performed
    then: the system should detect the conflict and flag both versions
  - given: a conflict is detected but the difference is within one minute
    when: automatic resolution is enabled
    then: the newer item timestamp should be used and the older version discarded
  - given: a conflict is detected that cannot be automatically resolved
    when: I view the conflict resolution dialog
    then: I should see both versions side-by-side and can choose which to keep or
      keep both as separate items
  - given: a conflict is detected for the same clipboard item on two devices
    when: I select "Keep Both"
    then: both items should be preserved with distinct IDs and the newer item should
      be marked as a "conflict resolved" copy
  notes:
    persona: knowledge-worker
    t_shirt_size: L
    complexity: high
    risks: Conflicts can be complex; partial edits need consideration
    dependencies:
    - US-022
    - US-026
  stage: 7
  impacts: []
  status: pending
- id: US-028
  title: Sync activity log
  user_story: ''
  scenarios:
  - given: the settings window is open in the "Sync" section
    when: I click "View Activity Log"
    then: a dialog or section should appear showing a chronological list of sync events
  - given: the sync activity log is displayed
    when: I examine a sync event entry
    then: I should see the timestamp, direction (upload/download), status (success/failure),
      and item count
  - given: the sync activity log is displayed
    when: I apply a filter for "Failed operations only"
    then: only sync events with a failure status should be displayed
  - given: the sync activity log is displayed
    when: I click "Export Log"
    then: the sync activity should be exported to a CSV or JSON file for analysis
  - given: the sync activity log contains entries
    when: I click "Clear Log" with confirmation
    then: all log entries older than the configured retention period should be removed
  - given: the sync activity log is displayed
    when: I click on a specific sync event
    then: detailed information about that event, including any error messages or item
      IDs, should be displayed
  notes:
    persona: developer
    t_shirt_size: S
    complexity: low
    risks: Log retention must not grow unbounded; privacy concerns with detailed logs
    dependencies:
    - US-022
    - US-023
  stage: 7
  impacts: []
  status: pending
- id: US-029
  title: Background daemon startup reliability
  user_story: ''
  scenarios:
  - given: I launch Smart Clipboard
    when: the application initialization completes
    then: the background clipboard monitoring daemon should be running and monitoring
      clipboard changes
  - given: auto-start is enabled
    when: I log into macOS
    then: the clipboard monitoring daemon should be running within 5 seconds of desktop
      appearance
  - given: Smart Clipboard is running
    when: I query the daemon status
    then: the status should show "Running" with a heartbeat response within 500ms
  - given: the clipboard monitoring daemon has unexpectedly crashed
    when: the main app detects the crash
    then: the daemon should be automatically restarted within 2 seconds
  - given: the daemon fails to start after 3 automatic restart attempts
    when: the main app detects this condition
    then: a user-facing alert should appear indicating that clipboard monitoring has
      failed
  notes:
    persona: knowledge-worker
    t_shirt_size: M
    complexity: medium
    risks: Daemon persistence can be fragile on macOS; sandboxing may interfere
    dependencies:
    - US-020
  stage: -1
  impacts: []
  status: pending
- id: US-030
  title: Clipboard change monitoring without excessive polling
  user_story: ''
  scenarios:
  - given: Smart Clipboard is starting up
    when: the clipboard monitoring is initialized
    then: the system should use NSPasteboard's change notifications (observer pattern)
      rather than polling at intervals
  - given: clipboard monitoring is active
    when: the system clipboard content changes
    then: the monitoring daemon should receive and process the change notification
      within 10ms
  - given: clipboard monitoring is active
    when: I copy content with multiple representations (e.g., text + image + RTF)
    then: the daemon should capture all types in a single event without triggering
      multiple callbacks
  - given: clipboard monitoring is active

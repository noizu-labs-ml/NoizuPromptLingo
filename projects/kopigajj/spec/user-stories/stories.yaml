    then: the old corrupted database and the backup should be preserved as files with
      ".corrupted" extension for potential manual recovery
  notes:
    persona: knowledge-worker
    t_shirt_size: M
    complexity: medium
    risks: Data loss is unacceptable; backup strategy must be reliable; corruption
      detection must be robust

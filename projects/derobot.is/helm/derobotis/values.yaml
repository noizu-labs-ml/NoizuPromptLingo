replicas: 1
domain: derobot.is

teaser:
  image: ops.noizu.com/derobot.is/teaser:latest
  port: 8080
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

imagePullSecrets:
  - name: ops-registry-secret

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "10"
    nginx.ingress.kubernetes.io/upstream-keepalive-connections: "10"
  cloudflareOnly: true

tls:
  enabled: true
  secretName: derobotis-tls
  infisical:
    enabled: true
    resyncInterval: 300
    credentialsSecret: universal-auth-credentials
    credentialsNamespace: infra
    projectSlug: k8-infra
    envSlug: prod
    hostAPI: https://infisical.noizu.com/api
    secretsPath: "/apps/tls/derobotis"
    crtKey: DEROBOTIS_TLS_CRT
    keyKey: DEROBOTIS_TLS_KEY

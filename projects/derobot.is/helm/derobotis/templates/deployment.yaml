apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "derobotis.fullname" . }}
  labels:
    {{- include "derobotis.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "derobotis.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "derobotis.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: teaser
        image: {{ .Values.teaser.image }}
        imagePullPolicy: Always
        ports:
        - containerPort: {{ .Values.teaser.port }}
          protocol: TCP
        resources:
          {{- toYaml .Values.teaser.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.teaser.port }}
          initialDelaySeconds: 5
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.teaser.port }}
          initialDelaySeconds: 2
          periodSeconds: 10
      restartPolicy: Always

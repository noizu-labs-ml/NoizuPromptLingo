# ═══════════════════════════════════════════════════════════════
# BRANDING — branding.yaml
# ═══════════════════════════════════════════════════════════════
#
# Brand identity, logo, and the intro hero section displayed at
# the top of the styleguide viewer.
#
# HOW IT WORKS:
#   - Top-level fields (name, logo-text, intent, tone, etc.) define
#     the brand voice and are used by agents for design decisions
#   - `font-url` is the Google Fonts import URL loaded in the HTML head
#   - `logo-style.html` is raw HTML rendered as the logo mark
#   - `intro` defines the hero section: title, glyph, subtitle, quote,
#     color bar, and metadata cards
#
# HOW TO MODIFY:
#   - Change the logo: edit `logo-text` and `logo-style.html`
#   - Change fonts: update `font-url` and the corresponding vars in
#     style-guide.vars.yaml (font-sans, font-mono)
#   - Change intro hero: edit fields under `intro`
#   - `intro.colors[]` renders the color bar below the hero title
#   - `intro.meta[]` renders key-value cards in the hero footer
#
# RELATED: style-guide.meta.yaml (theme slug/title)
#          style-guide.typography.yaml (font family declarations)
#          style-guide.css-snippets.yaml (intro hero CSS styling)
# ═══════════════════════════════════════════════════════════════

# ── name ──────────────────────────────────────────────────────
name: "derobot.is"

# ── logo-text ─────────────────────────────────────────────────
logo-text: "DEROBOT.IS"

# ── font-url ──────────────────────────────────────────────────
# Syne + JetBrains Mono from Google Fonts.
# Geist is loaded via @vercel/font — not included here.
font-url: "https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"

# ── logo-style ────────────────────────────────────────────────
# SVG logomark: 3D cubic wireframe robot in isometric line style.
# All stroke, no fill. Cyan accent on the eye visor.
# currentColor adapts to light/dark context.
logo-style:
  font: "var(--font-sans)"
  color: "var(--text)"
  html: '<div style="display:inline-flex;align-items:center;gap:10px"><svg width="36" height="26" viewBox="-12 -10 72 52" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2h38v16H5z M5 2l6-5h38l-6 5 M43 2l6-5v16l-6 5"/><rect x="10" y="7" width="8" height="6" rx="1" stroke="var(--blue)" stroke-width="1.2" fill="var(--blue)" fill-opacity="0.6"/><rect x="30" y="7" width="8" height="6" rx="1" stroke="var(--blue)" stroke-width="1.2" fill="var(--blue)" fill-opacity="0.6"/><path d="M18 22h12v8H18z M18 22l3-2h12l-3 2 M30 22l3-2v8l-3 2"/><path d="M18 24h-4v4h4 M30 24h4v4h-4"/><path d="M21 30v5h3v-5 M24 30v5h3v-5"/></svg><span style="font-family:var(--font-sans);font-size:22px;font-weight:700;letter-spacing:-0.03em;line-height:1;color:currentColor">derobot.is</span></div>'

# ── intent ────────────────────────────────────────────────────
intent: "Nocturne dark palette with typographic hierarchy for an AI-native venture lab. The robots build. The robots share."

# ── perception ────────────────────────────────────────────────
perception: "Competent, intentional, slightly irreverent — not corporate, not cute"

# ── audience ──────────────────────────────────────────────────
audience: "Builders, investors, collaborators evaluating an AI-native product portfolio"

# ── tone ──────────────────────────────────────────────────────
tone: "Direct, competent, slightly irreverent. First-person plural for the entity, third-person for the robot."

# ── keywords ──────────────────────────────────────────────────
keywords:
  - venture lab
  - AI-native
  - portfolio
  - nocturne
  - typographic
  - precise

# ── intro ─────────────────────────────────────────────────────
intro:
  title: "derobot.is"
  title-html: '<span style="display:inline-flex;align-items:center;gap:20px"><svg width="56" height="40" viewBox="-12 -10 72 52" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2h38v16H5z M5 2l6-5h38l-6 5 M43 2l6-5v16l-6 5"/><rect x="10" y="7" width="8" height="6" rx="1" stroke="var(--blue)" stroke-width="1.2" fill="var(--blue)" fill-opacity="0.6"/><rect x="30" y="7" width="8" height="6" rx="1" stroke="var(--blue)" stroke-width="1.2" fill="var(--blue)" fill-opacity="0.6"/><path d="M18 22h12v8H18z M18 22l3-2h12l-3 2 M30 22l3-2v8l-3 2"/><path d="M18 24h-4v4h4 M30 24h4v4h-4"/><path d="M21 30v5h3v-5 M24 30v5h3v-5"/></svg>derobot.is</span>'
  glyph: ""
  subtitle: "AI-NATIVE VENTURE LAB · THE ROBOT BUILDS. THE MARKET DECIDES."
  quote: "\"Every product starts as a concept. We validate with targeted marketing before building. The data decides what gets investment.\""
  hide-meta: false
  hide-colors: false
  colors:
    - "#22D3EE"
    - "#A78BFA"
    - "#09090B"
    - "#FAFAFA"
    - "#27272A"
  meta:
    - label: "Typefaces"
      value: "Syne + Geist + JetBrains Mono"
    - label: "Grid"
      value: "8px base unit · responsive bento"
    - label: "Border Radius"
      value: "6-8px — precise, not friendly"
    - label: "Philosophy"
      value: "Nocturne + Bold Expressive"

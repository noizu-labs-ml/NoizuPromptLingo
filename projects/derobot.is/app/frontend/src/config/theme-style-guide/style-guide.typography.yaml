# ═══════════════════════════════════════════════════════════════
# TYPOGRAPHY — style-guide.typography.yaml
# ═══════════════════════════════════════════════════════════════
#
# Defines font families and typography classes for the theme.
#
# TWO SECTIONS:
#   typography         — font family declarations (name, weights,
#                        usage notes, color samples for the viewer)
#   typography-classes — named type styles (display, h1, h2, body,
#                        code, label, data) with exact CSS values
#
# HOW IT WORKS:
#   - `typography[].var` maps to a --{var} CSS custom property
#     (e.g. var: font-sans → --font-sans)
#   - `typography-classes[].class` becomes a .{class} CSS rule
#   - The engine renders specimens in the styleguide viewer using
#     `sample` text at the declared size/weight
#
# HOW TO MODIFY:
#   - Add a new font: add a `- var:` entry with name, weights, usage
#   - Add a type class: add a `- name:` entry under typography-classes
#   - Font URLs are loaded from branding.yaml `font-url`
#   - Run `npm run regen` after changes
#
# RELATED: style-guide.vars.yaml (font-size tokens), branding.yaml (font-url)
# ═══════════════════════════════════════════════════════════════

typography:
  - var: font-sans
    name: Syne
    description: "Geometric with a humanist skeleton — optical weight at display sizes."
    usage: "Headlines, display text, section titles, navigation, labels. The brand voice."
    weights: [400, 600, 700, 800]
    colors:
      - label: "Primary"
        value: "#FAFAFA"
        note: "Primary text on dark ground — maximum contrast."
      - label: "Cyan Accent"
        value: "#22D3EE"
        note: "The robot signal. Use for emphasis, CTAs, active states."

  - var: font-mono
    name: JetBrains Mono
    description: "The portfolio's data voice. Ligatures disabled."
    usage: "Code blocks, metadata, labels, status tags, version numbers, data."
    weights: [400, 500]

typography-classes:
  - name: Display
    class: typography-display
    font-family: "var(--font-display)"
    font-size: "64px"
    font-weight: "800"
    line-height: "1.0"
    letter-spacing: "-0.03em"
    sample: "derobot.is"
    usage: "Hero headlines, page titles"

  - name: Heading 1
    class: typography-h1
    font-family: "var(--font-display)"
    font-size: "40px"
    font-weight: "700"
    line-height: "1.1"
    letter-spacing: "-0.02em"
    sample: "The Portfolio"
    usage: "Section titles, primary headings"

  - name: Heading 2
    class: typography-h2
    font-family: "var(--font-display)"
    font-size: "28px"
    font-weight: "600"
    line-height: "1.2"
    letter-spacing: "-0.01em"
    sample: "AI-native venture lab."
    usage: "Subsection headers, card titles"

  - name: Heading 3
    class: typography-h3
    font-family: "var(--font-display)"
    font-size: "20px"
    font-weight: "600"
    line-height: "1.3"
    letter-spacing: "0"
    sample: "Blade of Eternity"
    usage: "Card headings, list titles, tertiary sections"

  - name: Body
    class: typography-body
    font-family: "var(--font-body)"
    font-size: "16px"
    font-weight: "400"
    line-height: "1.6"
    sample: "The robots build. The robots share. Every product starts as a concept — we validate with targeted marketing before writing a single line of production code."
    usage: "Paragraphs, descriptions, long-form content"

  - name: Body Small
    class: typography-body-small
    font-family: "var(--font-body)"
    font-size: "14px"
    font-weight: "400"
    line-height: "1.5"
    sample: "Accessibility-first text RPG for blind users with AI narrative generation and a physics engine."
    usage: "Supporting copy, card descriptions, secondary body"

  - name: Label
    class: typography-label
    font-family: "var(--font-mono)"
    font-size: "12px"
    font-weight: "500"
    line-height: "1.4"
    letter-spacing: "0.05em"
    sample: "GAMING / AI · CONCEPT"
    usage: "Category tags, status labels, section labels, pipeline stage badges"

  - name: Caption
    class: typography-caption
    font-family: "var(--font-body)"
    font-size: "12px"
    font-weight: "400"
    line-height: "1.4"
    letter-spacing: "0.02em"
    sample: "Based in the Netherlands."
    usage: "Image captions, footnotes, timestamps, legal"

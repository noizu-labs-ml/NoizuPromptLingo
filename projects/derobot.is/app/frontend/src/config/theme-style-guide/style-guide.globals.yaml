# ═══════════════════════════════════════════════════════════════
# GLOBAL CSS & TOAST CONFIG — style-guide.globals.yaml
# ═══════════════════════════════════════════════════════════════
#
# Two sections:
#   toast   — Sonner toast notification positioning and behavior
#   globals — Raw CSS injected before all generated styles
#
# HOW IT WORKS:
#   - `globals` is a literal CSS string emitted at the top of the
#     generated CSS file, before any theme-scoped rules
#   - Use it for universal resets, html/body base styles, and
#     ::selection overrides
#
# HOW TO MODIFY:
#   - Edit the `globals: |` block as raw CSS — no YAML nesting
#   - Toast keys map directly to the Sonner <Toaster> component props
#   - Run `npm run regen` (or `make regen`) after changes
#
# RELATED: style-guide.vars.yaml (base-font-size, base-font-family, etc.)
# ═══════════════════════════════════════════════════════════════

toast:
  position: top-right
  duration: 8000
  gap: 16
  expand: true
  visible-toasts: 4

globals: |
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: var(--base-font-size); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; scroll-behavior: smooth; }
  body {
    font-family: var(--base-font-family);
    color: var(--base-font-color);
    background: var(--base-background);
    line-height: var(--base-line-height);
  }
  html[data-design-theme="derobot"] ::selection { background: var(--text-link); color: var(--surface); }
  [data-design-theme="derobot"] { font-variant-ligatures: none; }

# ═══════════════════════════════════════════════════════════════
# SEMANTIC CLASSES — style-guide.semantic-classes.yaml
# ═══════════════════════════════════════════════════════════════
#
# Defines named semantic state classes (danger, warning, success,
# info, primary, brand) with their accent, background, and text
# color values.
#
# HOW IT WORKS:
#   - Each entry generates a .{class} CSS rule with scoped
#     --{class}-accent, --{class}-background, --{class}-color vars
#   - The engine also generates card, badge, and alert variants
#     using these accent values automatically
#   - `accent-style` controls border rendering (solid, dashed, etc.)
#
# HOW TO MODIFY:
#   - Change colors: edit the `vars` values under each class
#   - Add a class: append a `- name:` entry with class, title,
#     description, accent-style, and vars (accent, background, color)
#   - Run `npm run regen` after changes
#
# RELATED: style-guide.semantic-groups.yaml (viewer grouping labels)
#          style-guide.vars.yaml (base color tokens referenced here)
# ═══════════════════════════════════════════════════════════════

semantic-classes:
  - name: danger
    class: danger
    title: "Danger"
    description: "Killed/shelved products, error states"
    accent-style: solid
    vars:
      - name: accent
        value: "#F87171"
      - name: background
        value: "rgba(248,113,113,0.08)"
      - name: color
        value: "#F87171"

  - name: warning
    class: warning
    title: "Warning"
    description: "Validation stage"
    accent-style: solid
    vars:
      - name: accent
        value: "#FBBF24"
      - name: background
        value: "rgba(251,191,36,0.08)"
      - name: color
        value: "#FBBF24"

  - name: success
    class: success
    title: "Success"
    description: "Live product indicators"
    accent-style: solid
    vars:
      - name: accent
        value: "#34D399"
      - name: background
        value: "rgba(52,211,153,0.08)"
      - name: color
        value: "#34D399"

  - name: info
    class: info
    title: "Info"
    description: "Concept stage"
    accent-style: solid
    vars:
      - name: accent
        value: "#60A5FA"
      - name: background
        value: "rgba(96,165,250,0.08)"
      - name: color
        value: "#60A5FA"

  - name: primary
    class: primary
    title: "Primary / Cyan"
    description: "The robot signal — CTAs, active navigation"
    accent-style: solid
    vars:
      - name: accent
        value: "#22D3EE"
      - name: background
        value: "rgba(34,211,238,0.08)"
      - name: color
        value: "#22D3EE"

  - name: brand
    class: brand
    title: "Brand / Violet"
    description: "Secondary accent — links, secondary buttons"
    accent-style: solid
    vars:
      - name: accent
        value: "#A78BFA"
      - name: background
        value: "rgba(167,139,250,0.08)"
      - name: color
        value: "#A78BFA"

# ═══════════════════════════════════════════════════════════════
# COLOR MODES — style-guide.color-modes.yaml
# ═══════════════════════════════════════════════════════════════
#
# Defines light and dark mode surface/text/border overrides.
#
# HOW IT WORKS:
#   - Each mode key (light, dark) maps semantic token names to values
#   - The engine generates scoped CSS selectors for each mode
#   - These tokens are consumed throughout the theme via var(--surface),
#     var(--text), var(--border), etc.
#
# HOW TO MODIFY:
#   - Change values here to adjust how dark/light modes render
#   - Token names must match what scoped-vars.yaml and components expect
#   - Add a new mode by adding a top-level key (e.g. `high-contrast:`)
#   - Run `npm run regen` after changes
#
# RELATED: style-guide.scoped-vars.yaml (selector-level overrides)
#          style-guide.vars.yaml (base color definitions)
# ═══════════════════════════════════════════════════════════════

color-modes:
  # ── Light mode ─────────────────────────────────────────────────
  # Zinc light surfaces, dark text. Cyan accent darkened to #0891B2
  # (cyan-700) for 4.5:1+ contrast on white backgrounds.
  light:
    surface: "#FAFAFA"
    surface-alt: "#E4E4E7"
    surface-inverse: "#09090B"
    surface-accent: "rgba(8,145,178,0.08)"
    surface-warning: "rgba(217,163,10,0.08)"
    surface-danger: "rgba(220,50,50,0.08)"
    text: "#09090B"
    text-secondary: "#3F3F46"
    text-muted: "#71717A"
    text-inverse: "#FAFAFA"
    text-link: "#0891B2"
    border: "#E4E4E7"
    border-strong: "#D4D4D8"
    border-accent: "#0891B2"
    shadow-color: "rgba(0,0,0,0.08)"
    focus-ring: "rgba(8,145,178,0.35)"

  # ── Dark mode ──────────────────────────────────────────────────
  # Zinc nocturne. Near-black background, soft white type, bright
  # cyan (#22D3EE) accent at full brightness on dark surfaces.
  dark:
    surface: "#09090B"
    surface-alt: "#18181B"
    surface-inverse: "#FAFAFA"
    surface-accent: "rgba(34,211,238,0.08)"
    surface-warning: "rgba(251,191,36,0.08)"
    surface-danger: "rgba(248,113,113,0.08)"
    text: "#FAFAFA"
    text-secondary: "#A1A1AA"
    text-muted: "#71717A"
    text-inverse: "#09090B"
    text-link: "#22D3EE"
    border: "#27272A"
    border-strong: "#3F3F46"
    border-accent: "#22D3EE"
    shadow-color: "rgba(0,0,0,0.5)"
    focus-ring: "rgba(34,211,238,0.4)"

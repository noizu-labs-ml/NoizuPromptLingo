# ═══════════════════════════════════════════════════════════════
# GLYPH LANGUAGE — style-guide.glyphs.yaml
# ═══════════════════════════════════════════════════════════════
#
# Defines the Unicode glyph system used for icons and symbols
# throughout the theme. No icon fonts, no SVG sprites.
#
# HOW IT WORKS:
#   - `principles[]` document the glyph selection philosophy
#   - Glyph entries (further in the file) map semantic names to
#     Unicode code points with usage notes
#   - The viewer renders these in a glyph reference grid
#
# HOW TO MODIFY:
#   - Add a glyph: append an entry with name, glyph character,
#     code point, and usage description
#   - All glyphs must be standard Unicode — no PUA or emoji-only chars
#   - Pair every glyph with an aria-label for accessibility
#
# RELATED: style-guide.page-sections.yaml (glyphs section in viewer)
# ═══════════════════════════════════════════════════════════════

glyph-language:
  description: >
    Unicode glyphs are the primary symbol language — no icon fonts, no SVG sprites.
    The Nocturne glyph set is minimal by design: only symbols that earn their place
    in a venture lab interface. Geometric, directional, and typographic — nothing ornamental.

  principles:
    - rule: "Unicode over icon fonts."
      detail: "Icon fonts are font-file dependencies that fail on load errors and produce invisible squares in plain-text fallback. Unicode glyphs are always available."
    - rule: "Semantic intent, not decoration."
      detail: "Every glyph must carry meaning that a screen reader can interpret via aria-label. Purely decorative symbols should be aria-hidden."
    - rule: "Consistency within context."
      detail: "Use the same glyph for the same action everywhere. ✕ always means close. → always means forward. Inconsistency breaks user expectations."
    - rule: "Size from the type scale, not px."
      detail: "Glyphs inherit font-size from their parent element. Do not hardcode sizes — let the component's type token control the glyph scale."
    - rule: "Test across platforms."
      detail: "Unicode rendering varies by OS and font stack. Test on macOS, Windows, and Android before finalising a glyph for production use."

  sections:
    - name: ui
      title: "UI & Navigation"
      description: >
        Controls, affordances, and navigational cues for the venture lab interface.
        Geometric, directional forms only — nothing ornamental or calligraphic.
      glyphs:
        - glyph: "→"
          name: "Right Arrow"
          code: "U+2192"
          use: "Forward, CTA, explore — primary action indicator"
          example: "View portfolio →"
        - glyph: "↓"
          name: "Down Arrow"
          code: "U+2193"
          use: "Scroll prompt, expand section"
          example: "↓ Scroll"
        - glyph: "↗"
          name: "NE Arrow"
          code: "U+2197"
          use: "External links — opens in new tab"
          example: "Live site ↗"
        - glyph: "·"
          name: "Middle Dot"
          code: "U+00B7"
          use: "Separator between meta items"
          example: "Concept · 2025"
        - glyph: "✕"
          name: "Cross / Close"
          code: "U+2715"
          use: "Dismiss, close modal, clear field"
          example: "✕ Close"
        - glyph: "≡"
          name: "Trigram / Hamburger"
          code: "U+2261"
          use: "Mobile nav drawer toggle"
          example: "≡ Menu"

    - name: typography
      title: "Typography & Text"
      description: >
        Typographic punctuation and inline markers for editorial and body content.
        The Nocturne voice uses em dashes and arrows as rhetorical punctuation.
      glyphs:
        - glyph: "→"
          name: "Right Arrow"
          code: "U+2192"
          use: "Inline CTA, action prompt in body text"
          example: "→ Read the full guide"
        - glyph: "—"
          name: "Em Dash"
          code: "U+2014"
          use: "Em dash for brand voice — parenthetical aside, attribution"
          example: "Designed — not just built."
        - glyph: "…"
          name: "Horizontal Ellipsis"
          code: "U+2026"
          use: "Text truncation, continuation, loading state"
          example: "Loading…"
        - glyph: "•"
          name: "Bullet"
          code: "U+2022"
          use: "Unordered list items"
          example: "• First item"

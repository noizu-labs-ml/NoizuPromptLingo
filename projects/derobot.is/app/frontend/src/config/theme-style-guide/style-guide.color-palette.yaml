# ═══════════════════════════════════════════════════════════════
# COLOR PALETTE — style-guide.color-palette.yaml
# ═══════════════════════════════════════════════════════════════
#
# Defines color groups displayed in the styleguide viewer's
# Color Palette section.
#
# HOW IT WORKS:
#   - Each group renders as a swatch row with name, value, and notes
#   - `value` should reference a --var from style-guide.vars.yaml
#   - `cssClass` maps to a .swatch-{class} CSS class for styling
#   - `notes` provide usage guidance shown below each swatch group
#
# HOW TO MODIFY:
#   - Add colors to an existing group or create a new `- group:` entry
#   - Actual color hex values live in style-guide.vars.yaml — this file
#     references them via var() so they stay in sync
#   - Run `npm run regen` after changes
#
# RELATED: style-guide.vars.yaml (Neutrals, Accent Primaries, Semantic groups)
#          style-guide.color-modes.yaml (dark/light surface overrides)
# ═══════════════════════════════════════════════════════════════

color-palette:
  - group: "Surfaces"
    description: "The three tiers of the dark ground. Base, elevated, hover."
    colors:
      - name: Background
        value: "#09090B"
        cssClass: black
      - name: Surface
        value: "#18181B"
        cssClass: gray-800
      - name: Surface Hover
        value: "#1F1F23"
        cssClass: gray-700
    notes:
      - label: "Background"
        text: "Page ground — the deepest zinc black. Everything sits on top of this."
        cssClass: black
      - label: "Surface"
        text: "Card and panel backgrounds — one step lifted from the base."
        cssClass: gray-800
      - label: "Surface Hover"
        text: "Interactive surface states — hover, focus, selected."
        cssClass: gray-700

  - group: "Text"
    description: "Four tiers of reading hierarchy — from maximum contrast to decorative-only."
    colors:
      - name: Primary
        value: "var(--white)"
        cssClass: white
      - name: Secondary
        value: "var(--gray-300)"
        cssClass: gray-300
      - name: Tertiary
        value: "var(--gray-400)"
        cssClass: gray-400
      - name: Inverse
        value: "var(--black)"
        cssClass: black
    notes:
      - label: "Primary"
        text: "Headlines, labels, high-emphasis body — #FAFAFA."
        cssClass: white
      - label: "Secondary"
        text: "Body text, descriptions — #A1A1AA. Readable, reduced."
        cssClass: gray-300
      - label: "Tertiary"
        text: "Captions, placeholders, disabled — #71717A. Decorative only."
        cssClass: gray-400
      - label: "Inverse"
        text: "Text on light/accent surfaces — #09090B."
        cssClass: black

  - group: "Accents"
    description: "Two accent signals. Cyan is the robot. Violet is the portfolio."
    colors:
      - name: Cyan
        value: "var(--red)"
        cssClass: red
      - name: Violet
        value: "var(--blue)"
        cssClass: blue
    notes:
      - label: "Cyan"
        text: "Primary accent — CTAs, active states, links, the robot signal. var(--red) = #22D3EE."
        cssClass: red
      - label: "Violet"
        text: "Secondary accent — tags, highlights, portfolio category markers. var(--blue) = #A78BFA."
        cssClass: blue

  - group: "Surfaces & Text (mode-aware)"
    description: "Semantic surface and text tokens. derobot.is is dark-only — both modes resolve to dark values."
    colors:
      - name: Surface
        value: "var(--surface)"
        cssClass: surface
      - name: Surface Alt
        value: "var(--surface-alt)"
        cssClass: surface-alt
      - name: Surface Inverse
        value: "var(--surface-inverse)"
        cssClass: surface-inverse
      - name: Text
        value: "var(--text)"
        cssClass: text
      - name: Text Secondary
        value: "var(--text-secondary)"
        cssClass: text-secondary
      - name: Text Muted
        value: "var(--text-muted)"
        cssClass: text-muted
      - name: Text Inverse
        value: "var(--text-inverse)"
        cssClass: text-inverse
      - name: Border
        value: "var(--border)"
        cssClass: border
      - name: Border Strong
        value: "var(--border-strong)"
        cssClass: border-strong
    notes:
      - label: "Surface"
        text: "Page background — #09090B in all modes."
        cssClass: surface
      - label: "Surface Alt"
        text: "Cards, panels — #18181B in all modes."
        cssClass: surface-alt
      - label: "Text"
        text: "Primary text — #FAFAFA in all modes."
        cssClass: text
      - label: "Text Secondary"
        text: "Body text — #A1A1AA in all modes."
        cssClass: text-secondary
      - label: "Text Muted"
        text: "Captions, placeholders — #71717A in all modes."
        cssClass: text-muted
      - label: "Border"
        text: "Structural dividers — #27272A in all modes."
        cssClass: border

  - group: "Semantic"
    description: "Pipeline stage colors. Success = Live. Warning = Validation. Error = Shelved. Info = Concept."
    colors:
      - name: Success
        value: "var(--success)"
        cssClass: success
      - name: Warning
        value: "var(--warning)"
        cssClass: warning
      - name: Error
        value: "var(--error)"
        cssClass: error
      - name: Info
        value: "var(--info)"
        cssClass: info
    notes:
      - label: "Success"
        text: "Live — product is in production. #34D399 emerald."
        cssClass: success
      - label: "Warning"
        text: "Validation — marketing test in progress. #FBBF24 amber."
        cssClass: warning
      - label: "Error"
        text: "Shelved — paused or deprioritized. #F87171 red."
        cssClass: error
      - label: "Info"
        text: "Concept — idea stage, not yet validated. #60A5FA blue."
        cssClass: info

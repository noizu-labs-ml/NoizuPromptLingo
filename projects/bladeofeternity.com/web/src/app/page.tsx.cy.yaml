# Cypress test attributes for page.tsx (landing page)
# Generated from cyAttrs() calls in the component

page: /
component: Home + Carousel

selectors:
  # === Main content ===
  - cy: landing
    scope: landing
    element: main

  # === Story section ===
  - cy: story-section
    element: section

  # === Game info section ===
  - cy: game-info-section
    element: section

  # === Carousel ===
  - cy: carousel
    scope: carousel
    element: section

  - cy: carousel-slide
    cy-value: "{current}"  # integer index, 0-based
    element: div (slide viewport)

  - cy: carousel-prev
    element: button
    notes: Previous slide, uses inactive image when at first slide

  - cy: carousel-next
    element: button
    notes: Next slide, uses inactive image when at last slide

  - cy: carousel-dot
    cy-id: "slide-{N}"  # slide-1 | slide-2 | slide-3
    cy-value: active | inactive
    element: button[role=tab]
    notes: One per slide, aria-selected matches active state

  # === Cookie consent banner ===
  - cy: cookie-banner
    element: div[role=alert]
    notes: Conditionally rendered, hidden after user accepts

  - cy: cookie-essential
    element: button
    notes: Sets localStorage boe_cookies_accepted=essential

  - cy: cookie-accept-all
    element: button
    notes: Sets localStorage boe_cookies_accepted=all

# Cypress test attributes for login/page.tsx
# Generated from cyAttrs() calls in the component

page: /login
component: LoginPage

selectors:
  - cy: login-form
    scope: login
    element: div (form container)

  - cy: error-alert
    element: div[role=alert]
    notes: Conditionally rendered on login failure

  - cy: email-input
    cy-id: login-email
    element: input[type=email]

  - cy: password-input
    cy-id: login-password
    element: input[type=password]

  - cy: remember-me
    element: input[type=checkbox]

  - cy: forgot-password
    element: a

  - cy: submit-button
    cy-id: login
    element: button[type=submit]

  - cy: signup-link
    element: a
    notes: "Create one" link to /signup

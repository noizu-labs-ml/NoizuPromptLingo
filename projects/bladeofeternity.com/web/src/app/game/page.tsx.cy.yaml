# Cypress test attributes for game/page.tsx
# Generated from cyAttrs() calls in the component

page: /game
component: GamePage

selectors:
  - cy: game-page
    scope: game
    element: div (page wrapper)

  # --- Header ---
  - cy: game-header
    cy-id: game-header
    element: header

  - cy: character-name
    element: span

  - cy: character-level
    cy-value: "{state.level}"
    element: span

  - cy: logout-button
    element: button

  # --- Stats bar ---
  - cy: stats-bar
    scope: character-status
    element: div[role=banner]

  - cy: hp-bar
    cy-value: "{state.hp}"
    element: div[role=progressbar]

  - cy: energy-bar
    cy-value: "{state.energy}"
    element: div[role=progressbar]

  - cy: xp-bar
    cy-value: "{state.xp}"
    element: div[role=progressbar]

  - cy: gold
    cy-value: "{state.gold}"
    element: span

  - cy: weapon
    element: span

  - cy: armor
    element: span

  - cy: effects
    element: div
    notes: Container, conditionally rendered when effects.length > 0

  - cy: effect
    cy-id: "{effect}"  # effect name string
    element: span
    notes: One per active effect

  # --- Game panel ---
  - cy: location
    element: h1

  - cy: narrative-log
    element: div[role=log]

  - cy: actions-menu
    scope: actions
    element: section

  - cy: action-button
    cy-id: "{action-slug}"  # e.g. look-around, go-north
    element: button[role=menuitem]
    notes: One per available action, cy-id is kebab-cased action text

  - cy: command-form
    element: form

  - cy: command-input
    element: input[type=text]

  - cy: command-send
    element: button[type=submit]

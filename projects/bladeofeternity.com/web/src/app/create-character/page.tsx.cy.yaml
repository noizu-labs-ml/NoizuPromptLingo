# Cypress test attributes for create-character/page.tsx
# Generated from cyAttrs() calls in the component

page: /create-character
component: CreateCharacterPage

selectors:
  - cy: create-character-page
    scope: create-character
    element: div (page wrapper)

  - cy: error-alert
    element: div[role=alert]
    notes: Conditionally rendered on validation/API error

  - cy: character-form
    element: form

  # --- Name section ---
  - cy: name-section
    element: section

  - cy: name-input
    cy-id: character-name
    element: input[type=text]

  # --- Race section ---
  - cy: race-section
    element: section

  - cy: race-card
    cy-id: "{race.id}"  # human | elf | dwarf | halfling | orc
    cy-value: selected   # only on the currently selected race
    element: button
    notes: One per race, cy-id is the race slug

  # --- Class section ---
  - cy: class-section
    element: section

  - cy: class-card
    cy-id: "{class.id}"  # warrior | mage | rogue | cleric | ranger
    cy-value: selected    # only on the currently selected class
    element: button
    notes: One per class, cy-id is the class slug

  # --- Attributes section ---
  - cy: attributes-section
    element: section

  - cy: points-remaining
    cy-value: "{remaining}"  # integer, 0 when all points spent
    element: span

  - cy: attribute-row
    cy-id: "{attr.key}"  # strength | dexterity | constitution | intelligence | wisdom | charisma
    element: div
    notes: One per attribute

  - cy: attr-decrease
    cy-for: "{attr.key}"
    element: button
    notes: Minus button, disabled at MIN_ATTR (8)

  - cy: attr-base
    cy-for: "{attr.key}"
    cy-value: "{attrs[key]}"  # integer 8-20
    element: span
    notes: Base attribute value before racial bonus

  - cy: attr-bonus
    cy-for: "{attr.key}"
    cy-value: "{bonus}"  # integer, only rendered when > 0
    element: span
    notes: Racial bonus display, conditionally rendered

  - cy: attr-increase
    cy-for: "{attr.key}"
    element: button
    notes: Plus button, disabled at MAX_ATTR (20) or 0 remaining

  - cy: attr-final
    cy-for: "{attr.key}"
    cy-value: "{final}"  # base + racial bonus
    element: div
    notes: Final computed attribute value

  # --- Preview section ---
  - cy: preview-section
    scope: preview
    element: section

  - cy: preview-name
    element: span

  - cy: preview-race
    element: span

  - cy: preview-class
    element: span

  - cy: preview-hp
    cy-value: "{derivedHp}"  # 50 + CON*5
    element: span

  - cy: preview-energy
    cy-value: "{derivedEnergy}"  # 20 + WIS*3
    element: span

  - cy: preview-gold
    cy-value: 50
    element: span

  - cy: preview-weapon
    element: span

  - cy: preview-armor
    element: span

  # --- Submit ---
  - cy: submit-button
    cy-id: create-character
    element: button[type=submit]

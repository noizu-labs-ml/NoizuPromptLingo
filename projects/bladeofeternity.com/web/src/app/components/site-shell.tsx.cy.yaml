# Cypress test attributes for components/site-shell.tsx
# Generated from cyAttrs() calls in the component

component: SiteHeader + SiteFooter + FooterModal

selectors:
  # === SiteHeader ===
  - cy: header
    cy-id: site-header
    element: header

  - cy: navbar
    cy-id: main-nav
    element: nav

  - cy: logo
    cy-id: site-logo
    element: a

  - cy: username
    element: span
    notes: Shows email prefix when logged in

  - cy: nav-link
    cy-id: play
    element: a
    notes: Logged-in only, links to /game

  - cy: logout-button
    element: button
    notes: Logged-in only

  - cy: nav-link
    cy-id: login
    element: a
    notes: Logged-out only

  - cy: nav-link
    cy-id: signup
    element: a
    notes: Logged-out only, "Create Account"

  # === SiteFooter ===
  - cy: footer
    cy-id: site-footer
    element: footer

  - cy: footer-nav
    element: nav

  - cy: footer-link
    cy-id: contact | terms | privacy | cookie
    element: button
    notes: One per footer link, opens corresponding modal

  # === FooterModal ===
  - cy: modal-overlay
    cy-for: "{page}"  # contact | terms | privacy | cookie
    element: div (fixed overlay)

  - cy: modal
    cy-id: "{page}"  # contact | terms | privacy | cookie
    element: div (modal content)

  - cy: modal-close
    cy-for: "{page}"
    element: button

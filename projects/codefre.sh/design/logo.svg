<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>CodeFresh Logo — Direction A (Minimal Tech)</title>
  <desc>Brand logo for codefre.sh — scripted agent evaluation platform</desc>

  <defs>
    <!-- Accent gradient -->
    <linearGradient id="violet-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Subtle glow for accent elements -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Node shadow -->
    <filter id="node-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#7C3AED" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- ===== VARIANT 1: Full lockup on dark background ===== -->
  <g id="lockup-dark">
    <!-- Dark background -->
    <rect width="800" height="280" rx="16" fill="#09090B"/>
    <rect x="1" y="1" width="798" height="278" rx="15" fill="none" stroke="#27272F" stroke-width="1"/>

    <!-- Icon: Graph node cluster -->
    <g transform="translate(100, 140)">
      <!-- Central node (the root of the conversation tree) -->
      <circle cx="0" cy="0" r="16" fill="url(#violet-glow)" filter="url(#node-shadow)"/>
      <circle cx="0" cy="0" r="6" fill="#09090B"/>

      <!-- Branch edges -->
      <!-- Top-right branch (pass) -->
      <line x1="14" y1="-8" x2="48" y2="-42" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
      <!-- Right branch (warn) -->
      <line x1="16" y1="0" x2="56" y2="0" stroke="#EAB308" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
      <!-- Bottom-right branch (fail) -->
      <line x1="14" y1="8" x2="48" y2="42" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>

      <!-- Child nodes -->
      <!-- Pass node -->
      <circle cx="56" cy="-48" r="9" fill="none" stroke="#22C55E" stroke-width="2" opacity="0.9"/>
      <circle cx="56" cy="-48" r="3" fill="#22C55E" opacity="0.9"/>

      <!-- Warn node -->
      <circle cx="64" cy="0" r="9" fill="none" stroke="#EAB308" stroke-width="2" opacity="0.9"/>
      <circle cx="64" cy="0" r="3" fill="#EAB308" opacity="0.9"/>

      <!-- Fail node -->
      <circle cx="56" cy="48" r="9" fill="none" stroke="#EF4444" stroke-width="2" opacity="0.9"/>
      <circle cx="56" cy="48" r="3" fill="#EF4444" opacity="0.9"/>

      <!-- Freeball branch (off-script deviation from pass node) -->
      <line x1="63" y1="-53" x2="88" y2="-72" stroke="#F97316" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3" opacity="0.7"/>
      <circle cx="93" cy="-76" r="5" fill="none" stroke="#F97316" stroke-width="1.5" opacity="0.7"/>
    </g>

    <!-- Wordmark -->
    <g transform="translate(220, 140)">
      <!-- "codefre" in primary text -->
      <text x="0" y="10" fill="#EDEDF0"
            font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', 'Cascadia Code', monospace"
            font-size="42" font-weight="600" letter-spacing="-0.5">
        codefre</text>
      <!-- ".sh" with accent dot -->
      <text x="268" y="10" fill="#7C3AED"
            font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', 'Cascadia Code', monospace"
            font-size="42" font-weight="600" letter-spacing="-0.5">.</text>
      <text x="285" y="10" fill="#EDEDF0"
            font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', 'Cascadia Code', monospace"
            font-size="42" font-weight="600" letter-spacing="-0.5">sh</text>

      <!-- Tagline -->
      <text x="0" y="44" fill="#56566A"
            font-family="-apple-system, 'Segoe UI', system-ui, sans-serif"
            font-size="14" font-weight="400" letter-spacing="2">
        BEHAVIORAL TESTING FOR AI AGENTS</text>
    </g>
  </g>

  <!-- ===== VARIANT 2: Icon only on dark ===== -->
  <g id="icon-dark" transform="translate(0, 310)">
    <rect width="280" height="280" rx="16" fill="#09090B"/>
    <rect x="1" y="1" width="278" height="278" rx="15" fill="none" stroke="#27272F" stroke-width="1"/>

    <g transform="translate(140, 140)">
      <!-- Central node -->
      <circle cx="0" cy="0" r="24" fill="url(#violet-glow)" filter="url(#node-shadow)"/>
      <circle cx="0" cy="0" r="9" fill="#09090B"/>

      <!-- Branch edges -->
      <line x1="21" y1="-12" x2="62" y2="-54" stroke="#22C55E" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
      <line x1="24" y1="0" x2="72" y2="0" stroke="#EAB308" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
      <line x1="21" y1="12" x2="62" y2="54" stroke="#EF4444" stroke-width="3" stroke-linecap="round" opacity="0.9"/>

      <!-- Child nodes -->
      <circle cx="72" cy="-62" r="14" fill="none" stroke="#22C55E" stroke-width="2.5" opacity="0.9"/>
      <circle cx="72" cy="-62" r="5" fill="#22C55E" opacity="0.9"/>

      <circle cx="82" cy="0" r="14" fill="none" stroke="#EAB308" stroke-width="2.5" opacity="0.9"/>
      <circle cx="82" cy="0" r="5" fill="#EAB308" opacity="0.9"/>

      <circle cx="72" cy="62" r="14" fill="none" stroke="#EF4444" stroke-width="2.5" opacity="0.9"/>
      <circle cx="72" cy="62" r="5" fill="#EF4444" opacity="0.9"/>

      <!-- Freeball branch -->
      <line x1="82" y1="-70" x2="108" y2="-90" stroke="#F97316" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4" opacity="0.7"/>
      <circle cx="114" cy="-96" r="8" fill="none" stroke="#F97316" stroke-width="2" opacity="0.7"/>
    </g>
  </g>

  <!-- ===== VARIANT 3: Full lockup on light background ===== -->
  <g id="lockup-light" transform="translate(310, 310)">
    <rect width="480" height="280" rx="16" fill="#FAFAFA"/>
    <rect x="1" y="1" width="478" height="278" rx="15" fill="none" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Icon -->
    <g transform="translate(80, 140)">
      <!-- Central node -->
      <circle cx="0" cy="0" r="16" fill="url(#violet-glow)"/>
      <circle cx="0" cy="0" r="6" fill="#FAFAFA"/>

      <!-- Branch edges -->
      <line x1="14" y1="-8" x2="48" y2="-42" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="16" y1="0" x2="56" y2="0" stroke="#CA8A04" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="14" y1="8" x2="48" y2="42" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Child nodes -->
      <circle cx="56" cy="-48" r="9" fill="none" stroke="#16A34A" stroke-width="2"/>
      <circle cx="56" cy="-48" r="3" fill="#16A34A"/>

      <circle cx="64" cy="0" r="9" fill="none" stroke="#CA8A04" stroke-width="2"/>
      <circle cx="64" cy="0" r="3" fill="#CA8A04"/>

      <circle cx="56" cy="48" r="9" fill="none" stroke="#DC2626" stroke-width="2"/>
      <circle cx="56" cy="48" r="3" fill="#DC2626"/>

      <!-- Freeball -->
      <line x1="63" y1="-53" x2="88" y2="-72" stroke="#EA580C" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/>
      <circle cx="93" cy="-76" r="5" fill="none" stroke="#EA580C" stroke-width="1.5"/>
    </g>

    <!-- Wordmark (dark text on light bg) -->
    <g transform="translate(190, 140)">
      <text x="0" y="10" fill="#09090B"
            font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', 'Cascadia Code', monospace"
            font-size="36" font-weight="600" letter-spacing="-0.5">
        codefre</text>
      <text x="230" y="10" fill="#7C3AED"
            font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', 'Cascadia Code', monospace"
            font-size="36" font-weight="600" letter-spacing="-0.5">.</text>
      <text x="244" y="10" fill="#09090B"
            font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', 'Cascadia Code', monospace"
            font-size="36" font-weight="600" letter-spacing="-0.5">sh</text>

      <text x="0" y="40" fill="#8E8E9A"
            font-family="-apple-system, 'Segoe UI', system-ui, sans-serif"
            font-size="12" font-weight="400" letter-spacing="2">
        BEHAVIORAL TESTING FOR AI AGENTS</text>
    </g>
  </g>

  <!-- ===== LABELS ===== -->
  <text x="16" y="14" fill="#56566A" font-family="system-ui" font-size="11" font-weight="500" letter-spacing="1">
    DARK LOCKUP</text>
  <text x="16" y="324" fill="#56566A" font-family="system-ui" font-size="11" font-weight="500" letter-spacing="1">
    ICON ONLY</text>
  <text x="326" y="324" fill="#56566A" font-family="system-ui" font-size="11" font-weight="500" letter-spacing="1">
    LIGHT LOCKUP</text>

</svg>

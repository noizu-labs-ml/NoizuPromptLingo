<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Style Guide: CodeFresh — Direction D: Forge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="module">
    import * as HeadlessUI from 'https://esm.sh/@headlessui/react@2.2.4?external=react,react-dom';
    window.HeadlessUI = HeadlessUI;
    window.dispatchEvent(new Event('headlessui-ready'));
  </script>

  <script crossorigin src="https://noizu.github.io/react-assets/dist/sg.js"></script>
  <link rel="stylesheet" href="https://noizu.github.io/react-assets/dist/sg.css">

  <style>
    /* ═══════════════════════════════════════
       THEME: Forge — Direction D
       ═══════════════════════════════════════ */
    .forge-theme {
      --bg-void: #08090D;
      --bg-primary: #0E1017;
      --bg-surface: #151820;
      --bg-elevated: #1D2029;
      --bg-well: #0B0C11;

      --text-primary: #E8E5E0;
      --text-secondary: #908D87;
      --text-tertiary: #5C5A55;
      --text-ghost: #3A3835;

      --border-default: #2A2D33;
      --border-subtle: #1D2029;
      --border-strong: #3D4048;

      --copper: #D4915E;
      --copper-bright: #E8A474;
      --copper-dim: #A06B3F;
      --copper-muted: rgba(212, 145, 94, 0.12);
      --copper-wash: rgba(212, 145, 94, 0.06);

      --eval-pass: #3EC97E;
      --eval-pass-strong: #2DB86A;
      --eval-pass-muted: rgba(62, 201, 126, 0.10);
      --eval-pass-wash: rgba(62, 201, 126, 0.05);

      --eval-warn: #E5C53E;
      --eval-warn-strong: #D4B42D;
      --eval-warn-muted: rgba(229, 197, 62, 0.10);
      --eval-warn-wash: rgba(229, 197, 62, 0.05);

      --eval-fail: #E54E4E;
      --eval-fail-strong: #D43D3D;
      --eval-fail-muted: rgba(229, 78, 78, 0.10);
      --eval-fail-wash: rgba(229, 78, 78, 0.05);

      --eval-freeball: #E8863D;
      --eval-freeball-strong: #D4752C;
      --eval-freeball-muted: rgba(232, 134, 61, 0.10);
      --eval-freeball-wash: rgba(232, 134, 61, 0.05);

      --info: #5DA4E8;
      --info-muted: rgba(93, 164, 232, 0.10);

      --font-sans: 'Plus Jakarta Sans', 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;

      --unit: 4px;
      --col-gap: 20px;

      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --space-10: 40px;
      --space-12: 48px;
      --space-16: 64px;
      --space-20: 80px;
      --space-24: 96px;

      --radius: 6px;
    }

    /* ═══════════════════════════════════════
       RESET & BASE
       ═══════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
    body {
      font-family: var(--font-sans);
      color: var(--text-primary);
      background: #08090D;
      line-height: 1.6;
    }
    ::selection { background: rgba(212, 145, 94, 0.3); color: #E8E5E0; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }

    /* ═══════════════════════════════════════
       STYLE-GUIDE COMPONENT OVERRIDES
       ═══════════════════════════════════════ */
    .style-guide .sg-style-card { background: #0E1017; border-color: #2A2D33; }
    .style-guide .sg-section-header { border-color: #2A2D33; }
    .style-guide .sg-section-header .sg-section-number { color: #D4915E; }
    .style-guide .sg-token-card { background: #151820; border-color: #2A2D33; }
    .style-guide .sg-color-swatch { border-color: #2A2D33; }
    .style-guide .sg-color-swatch .sg-swatch-info { background: #151820; color: #E8E5E0; }
    .style-guide .sg-color-swatch .sg-swatch-hex { color: #908D87; }
    .style-guide .sg-type-specimen { border-color: #1D2029; }
    .style-guide .sg-type-specimen .sg-type-meta { color: #5C5A55; }
    .style-guide .sg-spacing-bar { background: rgba(212, 145, 94, 0.12); border-color: #D4915E; }
    .style-guide .sg-widget-demo { background: #151820; border-color: #2A2D33; }
    .style-guide .sg-widget-demo:hover { border-color: #3D4048; }
    .style-guide .sg-branding-card { background: #151820; border-color: #2A2D33; }
    .style-guide .sg-spec-table th { color: #908D87; border-color: #2A2D33; }
    .style-guide .sg-spec-table td { color: #E8E5E0; border-color: #1D2029; }
    .style-guide .sg-principles-item { border-color: #1D2029; }
    .style-guide .sg-screen-frame { background: #151820; border-color: #2A2D33; }
    .style-guide .sg-screen-chrome { background: #0E1017; border-color: #2A2D33; }
    .style-guide .sg-screen-url { background: #0B0C11; color: #5C5A55; }
    .style-guide .sg-notes-list .sg-note-label { color: #E8E5E0; }
    .style-guide .sg-notes-list .sg-note-text { color: #908D87; }
    .style-guide .sg-status-indicator { background: #151820; border-color: #2A2D33; }
    .style-guide .sg-card { background: #151820; border-color: #2A2D33; }
    .style-guide .sg-card:hover { border-color: #3D4048; }
    .style-guide .sg-card .sg-card-body { color: #908D87; }
    .style-guide .sg-card .sg-card-tag { background: #1D2029; color: #908D87; }
    .style-guide .sg-spacing-diagram { background: #151820; border-color: #2A2D33; }

    /* ═══════════════════════════════════════
       BUTTONS
       ═══════════════════════════════════════ */
    .forge-theme .button-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 24px; }
    .forge-theme .btn {
      font-family: var(--font-sans); font-size: 13px; font-weight: 600;
      padding: 8px 20px; border: 1.5px solid transparent; border-radius: 6px;
      cursor: pointer; transition: all 120ms ease;
    }
    .forge-theme .btn-copper { background: var(--copper); color: var(--bg-void); border-color: var(--copper); }
    .forge-theme .btn-copper:hover { background: var(--copper-bright); border-color: var(--copper-bright); }
    .forge-theme .btn-copper:disabled { opacity: 0.35; cursor: not-allowed; }
    .forge-theme .btn-secondary { background: transparent; color: var(--text-primary); border-color: var(--border-default); }
    .forge-theme .btn-secondary:hover { border-color: var(--border-strong); background: var(--bg-elevated); }
    .forge-theme .btn-ghost { background: transparent; color: var(--text-secondary); border: none; }
    .forge-theme .btn-ghost:hover { color: var(--text-primary); }
    .forge-theme .btn-eval { background: transparent; padding: 6px 12px; border: 1.5px solid currentColor; border-radius: 6px; font-size: 12px; font-weight: 500; }
    .forge-theme .btn-eval--pass { color: var(--eval-pass); }
    .forge-theme .btn-eval--warn { color: var(--eval-warn); }
    .forge-theme .btn-eval--fail { color: var(--eval-fail); }
    .forge-theme .btn-eval--freeball { color: var(--eval-freeball); }
    .forge-theme .btn-sm { font-size: 12px; padding: 6px 14px; }
    .forge-theme .btn-lg { font-size: 14px; padding: 12px 28px; }

    /* ═══════════════════════════════════════
       INPUTS
       ═══════════════════════════════════════ */
    .forge-theme .input-demo { max-width: 480px; }
    .forge-theme .input-group { margin-bottom: 24px; }
    .forge-theme .input-label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-secondary); margin-bottom: 6px; }
    .forge-theme .input-field {
      width: 100%; font-family: var(--font-sans); font-size: 14px; color: var(--text-primary);
      background: var(--bg-well); border: 1.5px solid var(--border-default); border-radius: 6px;
      padding: 10px 14px; outline: none; transition: border-color 120ms ease, box-shadow 120ms ease;
    }
    .forge-theme .input-field::placeholder { color: var(--text-tertiary); }
    .forge-theme .input-field:focus { border-color: var(--copper); box-shadow: 0 0 0 3px var(--copper-muted); }
    .forge-theme .input-field.error { border-color: var(--eval-fail); box-shadow: 0 0 0 3px var(--eval-fail-muted); }
    .forge-theme .input-field:disabled { opacity: 0.4; cursor: not-allowed; }
    .forge-theme .input-field--code { font-family: var(--font-mono); font-size: 13px; }
    .forge-theme .input-hint { font-family: var(--font-mono); font-size: 11px; color: var(--text-tertiary); margin-top: 4px; }
    .forge-theme .input-hint.error { color: var(--eval-fail); }

    /* ═══════════════════════════════════════
       NAVIGATION
       ═══════════════════════════════════════ */
    .forge-theme .topbar { display: flex; align-items: center; justify-content: space-between; padding: 0 24px; height: 52px; background: var(--bg-void); border: 1.5px solid var(--border-default); border-radius: 6px; }
    .forge-theme .topbar-left { display: flex; align-items: center; gap: 24px; }
    .forge-theme .topbar-right { display: flex; align-items: center; gap: 12px; }
    .forge-theme .logo { font-family: var(--font-sans); font-size: 16px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.01em; }
    .forge-theme .logo .dot { color: var(--copper); }
    .forge-theme .nav-tabs { display: flex; gap: 4px; }
    .forge-theme .nav-tab { padding: 14px 16px; font-family: var(--font-sans); font-size: 13px; font-weight: 400; color: var(--text-secondary); border-bottom: 2px solid transparent; background: none; border-top: none; border-left: none; border-right: none; cursor: pointer; transition: color 120ms ease; }
    .forge-theme .nav-tab:hover { color: var(--text-primary); }
    .forge-theme .nav-tab--active { color: var(--copper); border-bottom-color: var(--copper); font-weight: 600; }
    .forge-theme .breadcrumb { display: flex; align-items: center; gap: 8px; padding: 10px 24px; background: var(--bg-primary); border: 1.5px solid var(--border-subtle); border-radius: 6px; font-family: var(--font-mono); font-size: 12px; }
    .forge-theme .breadcrumb__item { color: var(--text-secondary); }
    .forge-theme .breadcrumb__item--current { color: var(--copper); font-weight: 500; }
    .forge-theme .breadcrumb__separator { color: var(--text-ghost); }
    .forge-theme .cmd-trigger { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1.5px solid var(--border-default); border-radius: 6px; font-family: var(--font-mono); font-size: 12px; color: var(--text-tertiary); background: none; cursor: pointer; }

    /* ═══════════════════════════════════════
       STATUS INDICATORS
       ═══════════════════════════════════════ */
    .forge-theme .status-indicator.eval-pass .sg-status-dot { background: var(--eval-pass); box-shadow: 0 0 6px var(--eval-pass); }
    .forge-theme .status-indicator.eval-warn .sg-status-dot { background: var(--eval-warn); box-shadow: 0 0 6px var(--eval-warn); }
    .forge-theme .status-indicator.eval-fail .sg-status-dot { background: var(--eval-fail); box-shadow: 0 0 6px var(--eval-fail); }
    .forge-theme .status-indicator.eval-freeball .sg-status-dot { background: var(--eval-freeball); box-shadow: 0 0 6px var(--eval-freeball); animation: freeball-pulse-dot 2s ease-in-out infinite; }
    @keyframes freeball-pulse-dot {
      0%, 100% { box-shadow: 0 0 6px var(--eval-freeball); }
      50% { box-shadow: 0 0 12px var(--eval-freeball), 0 0 20px rgba(232, 134, 61, 0.3); }
    }

    /* ═══════════════════════════════════════
       GRAPH NODES
       ═══════════════════════════════════════ */
    .forge-theme .graph-node { background: var(--bg-surface); border: 1.5px solid var(--border-default); border-radius: 6px; padding: 20px; min-width: 200px; max-width: 280px; font-family: var(--font-sans); font-size: 14px; transition: border-color 120ms ease, background 120ms ease; }
    .forge-theme .graph-node:hover { border-color: var(--border-strong); }
    .forge-theme .graph-node--selected { border-color: var(--copper); box-shadow: 0 0 0 3px var(--copper-muted); }
    .forge-theme .graph-node--pass { border-color: var(--eval-pass); background: var(--eval-pass-wash); }
    .forge-theme .graph-node--warn { border-color: var(--eval-warn); background: var(--eval-warn-wash); }
    .forge-theme .graph-node--fail { border-color: var(--eval-fail); background: var(--eval-fail-wash); }
    .forge-theme .graph-node--freeball { border-color: var(--eval-freeball); background: var(--eval-freeball-wash); border-style: dashed; border-width: 2px; }
    @keyframes freeball-pulse { 0%, 100% { border-color: #E8863D; } 50% { border-color: #D4752C; } }
    .forge-theme .graph-node--freeball.is-active { animation: freeball-pulse 2s ease-in-out infinite; }
    .forge-theme .node-label { font-weight: 600; font-size: 14px; margin-bottom: 4px; color: var(--text-primary); }
    .forge-theme .node-meta { font-size: 12px; color: var(--text-secondary); }

    /* ═══════════════════════════════════════
       SCORE BADGES
       ═══════════════════════════════════════ */
    .forge-theme .score-badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 4px; font-family: var(--font-mono); font-size: 12px; font-weight: 600; }
    .forge-theme .score-badge--pass { background: var(--eval-pass-muted); color: var(--eval-pass); }
    .forge-theme .score-badge--warn { background: var(--eval-warn-muted); color: var(--eval-warn); }
    .forge-theme .score-badge--fail { background: var(--eval-fail-muted); color: var(--eval-fail); }
    .forge-theme .score-badge--freeball { background: var(--eval-freeball-muted); color: var(--eval-freeball); border: 1px dashed var(--eval-freeball); }
    .forge-theme .score-bar { width: 40px; height: 4px; background: var(--bg-well); border-radius: 2px; overflow: hidden; }
    .forge-theme .score-bar__fill { height: 100%; border-radius: 2px; }
    .forge-theme .score-bar__fill--pass { background: var(--eval-pass); }
    .forge-theme .score-bar__fill--warn { background: var(--eval-warn); }
    .forge-theme .score-bar__fill--fail { background: var(--eval-fail); }

    /* ═══════════════════════════════════════
       TRANSCRIPT
       ═══════════════════════════════════════ */
    .forge-theme .transcript { max-width: 72ch; padding: 24px; background: var(--bg-primary); border: 1.5px solid var(--border-default); border-radius: 6px; }
    .forge-theme .transcript-turn { display: flex; gap: 12px; }
    .forge-theme .transcript-turn + .transcript-turn { margin-top: 16px; }
    .forge-theme .transcript-glyph { flex: 0 0 24px; padding-top: 4px; }
    .forge-theme .transcript-content { flex: 1; }
    .forge-theme .voice-author { font-family: var(--font-mono); font-size: 13px; line-height: 1.5; color: var(--text-secondary); padding: 12px 16px; background: var(--bg-well); border-radius: 6px; border-left: 3px solid var(--border-default); }
    .forge-theme .voice-agent { font-family: var(--font-sans); font-size: 15px; line-height: 1.7; color: var(--text-primary); padding: 16px 20px; border-left: 3px solid var(--text-tertiary); }
    .forge-theme .voice-evaluator { font-family: var(--font-sans); font-size: 12px; font-weight: 500; line-height: 1.5; letter-spacing: 0.02em; color: var(--copper); padding: 8px 16px; background: var(--copper-wash); border-radius: 4px; border-left: 3px solid var(--copper-dim); }
    .forge-theme .turn-separator { margin: 32px 0; border: none; border-top: 1px solid var(--border-subtle); position: relative; }
    .forge-theme .turn-separator::after { content: attr(data-turn); position: absolute; top: -8px; left: 20px; font-family: var(--font-mono); font-size: 10px; color: var(--text-ghost); background: var(--bg-primary); padding: 0 8px; letter-spacing: 0.05em; text-transform: uppercase; }

    /* ═══════════════════════════════════════
       PERSONA TAGS
       ═══════════════════════════════════════ */
    .forge-theme .tag { display: inline-flex; padding: 2px 8px; border-radius: 4px; font-family: var(--font-mono); font-size: 11px; font-weight: 500; background: var(--bg-elevated); color: var(--text-secondary); border: 1px solid var(--border-subtle); }
    .forge-theme .tag--hostile { color: var(--eval-fail); border-color: var(--eval-fail-muted); }
    .forge-theme .tag--confused { color: var(--eval-warn); border-color: var(--eval-warn-muted); }
    .forge-theme .tag--adversarial { color: var(--eval-freeball); border-color: var(--eval-freeball-muted); }
    .forge-theme .tag--broken-english { color: var(--info); border-color: var(--info-muted); }

    /* ═══════════════════════════════════════
       HEADLESS UI OVERRIDES
       ═══════════════════════════════════════ */
    .forge-theme .hui-menu-button { background: var(--bg-surface); color: var(--text-primary); border: 1.5px solid var(--border-default); border-radius: 6px; padding: 8px 16px; font-family: var(--font-sans); font-size: 13px; font-weight: 500; cursor: pointer; }
    .forge-theme .hui-menu-button:hover { border-color: var(--border-strong); }
    .forge-theme .hui-menu-items { background: var(--bg-elevated); border: 1.5px solid var(--border-default); border-radius: 6px; padding: 4px; min-width: 180px; margin-top: 4px; }
    .forge-theme .hui-menu-item { display: block; width: 100%; text-align: left; padding: 8px 12px; font-size: 13px; color: var(--text-secondary); background: none; border: none; border-left: 2px solid transparent; border-radius: 4px; cursor: pointer; font-family: var(--font-sans); }
    .forge-theme .hui-menu-item:hover { background: var(--copper-wash); color: var(--text-primary); }
    .forge-theme .hui-menu-item.danger { color: var(--eval-fail); }
    .forge-theme .hui-menu-item.danger:hover { background: var(--eval-fail-wash); }
    .forge-theme .hui-menu-separator { height: 1px; background: var(--border-subtle); margin: 4px 0; }
    .forge-theme .hui-disclosure { border: 1.5px solid var(--border-default); border-radius: 6px; margin-bottom: 8px; overflow: hidden; }
    .forge-theme .hui-disclosure.open { border-color: var(--copper-dim); }
    .forge-theme .hui-disclosure-button { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 12px 16px; background: var(--bg-surface); color: var(--text-primary); border: none; font-family: var(--font-sans); font-size: 14px; font-weight: 500; cursor: pointer; }
    .forge-theme .hui-disclosure-arrow { font-size: 10px; color: var(--text-tertiary); }
    .forge-theme .hui-disclosure.open .hui-disclosure-arrow { transform: rotate(180deg); }
    .forge-theme .hui-disclosure-panel { padding: 12px 16px; font-size: 14px; color: var(--text-secondary); background: var(--bg-primary); border-top: 1px solid var(--border-subtle); }
    .forge-theme .hui-tab-group { display: flex; gap: 4px; margin-bottom: 16px; }
    .forge-theme .hui-tab { padding: 8px 16px; background: none; border: 1.5px solid var(--border-default); border-radius: 6px; color: var(--text-secondary); font-family: var(--font-sans); font-size: 13px; cursor: pointer; }
    .forge-theme .hui-tab:hover { border-color: var(--border-strong); color: var(--text-primary); }
    .forge-theme .hui-tab.selected { background: var(--copper-wash); border-color: var(--copper); color: var(--copper); font-weight: 600; }
    .forge-theme .hui-tab-panel { padding: 16px; background: var(--bg-surface); border: 1.5px solid var(--border-default); border-radius: 6px; font-size: 14px; color: var(--text-secondary); }
    .forge-theme .hui-switch-label { display: flex; align-items: center; gap: 12px; }
    .forge-theme .hui-switch { width: 44px; height: 24px; border-radius: 12px; background: var(--bg-well); border: 1.5px solid var(--border-default); position: relative; cursor: pointer; padding: 0; transition: all 120ms ease; }
    .forge-theme .hui-switch.checked { background: var(--copper); border-color: var(--copper); }
    .forge-theme .hui-switch-thumb { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--text-primary); transition: transform 120ms ease; }
    .forge-theme .hui-switch.checked .hui-switch-thumb { transform: translateX(20px); background: var(--bg-void); }
    .forge-theme .hui-switch-label-text { font-size: 14px; color: var(--text-primary); }
    .forge-theme .hui-switch-label-desc { font-size: 12px; color: var(--text-tertiary); }

    /* ═══════════════════════════════════════
       GLYPH SHOWCASE
       ═══════════════════════════════════════ */
    .forge-theme .glyph-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
    .forge-theme .glyph-card { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 20px 12px; background: var(--bg-surface); border: 1.5px solid var(--border-default); border-radius: 6px; }
    .forge-theme .glyph-card .glyph-sizes { display: flex; align-items: center; gap: 12px; }
    .forge-theme .glyph-card .glyph-name { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); text-align: center; }
    .forge-theme .glyph-card .glyph-label { font-family: var(--font-sans); font-size: 12px; font-weight: 500; color: var(--text-tertiary); }

    /* ═══════════════════════════════════════
       SCREEN MOCKUP HELPERS
       ═══════════════════════════════════════ */
    .forge-theme .screen-topbar { display: flex; align-items: center; justify-content: space-between; padding: 0 16px; height: 44px; background: var(--bg-void); border-bottom: 1.5px solid var(--border-default); }
    .forge-theme .screen-breadcrumb { padding: 8px 16px; background: var(--bg-primary); border-bottom: 1px solid var(--border-subtle); font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); }

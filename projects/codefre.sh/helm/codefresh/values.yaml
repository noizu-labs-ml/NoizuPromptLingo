replicas: 1
domain: codefre.sh

backend:
  image: ops.noizu.com/codefre.sh/backend:v1.0.6
  port: 4000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  image: ops.noizu.com/codefre.sh/frontend:v1.0.6
  port: 3000
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

migrate:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

database:
  host: app-timescaledb
  port: 5432
  name: codefresh

secrets:
  name: apps-app-secrets
  keys:
    dbUser: CODEFRESH_DB_USER
    dbPassword: CODEFRESH_DB_PASSWORD
    secretKeyBase: CODEFRESH_SECRET_KEY_BASE
    guardianSecretKey: CODEFRESH_GUARDIAN_SECRET_KEY
    redisUrl: CODEFRESH_REDIS_URL

imagePullSecrets:
  - name: ops-registry-secret

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  cloudflareOnly: true

tls:
  enabled: true
  secretName: codefresh-tls
  infisical:
    enabled: true
    resyncInterval: 300
    credentialsSecret: universal-auth-credentials
    credentialsNamespace: infra
    projectSlug: k8-infra
    envSlug: prod
    hostAPI: https://infisical.noizu.com/api
    secretsPath: "/apps/tls/codefresh"
    crtKey: CODEFRESH_TLS_CRT
    keyKey: CODEFRESH_TLS_KEY

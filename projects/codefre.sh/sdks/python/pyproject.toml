[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "codefresh"
version = "0.1.0"
description = "Python SDK for the CodeFresh eval platform (https://codefre.sh)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "CodeFresh", email = "sdk@codefre.sh" }]
keywords = ["codefresh", "evals", "llm", "eval", "testing", "agents"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Testing",
]
dependencies = ["httpx>=0.27,<1.0", "pydantic>=2.5,<3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "mypy>=1.8", "ruff>=0.5"]

[project.urls]
Homepage = "https://codefre.sh"
Documentation = "https://docs.codefre.sh/sdks/python"
Repository = "https://github.com/codefre-sh/sdk-python"

[tool.hatch.build.targets.wheel]
packages = ["codefresh"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true

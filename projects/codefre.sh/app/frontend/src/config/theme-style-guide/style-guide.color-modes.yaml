# ═══════════════════════════════════════════════════════════════
# COLOR MODES — style-guide.color-modes.yaml
# ═══════════════════════════════════════════════════════════════
#
# Defines light and dark mode surface/text/border overrides.
#
# HOW IT WORKS:
#   - Each mode key (light, dark) maps semantic token names to values
#   - The engine generates scoped CSS selectors for each mode
#   - These tokens are consumed throughout the theme via var(--surface),
#     var(--text), var(--border), etc.
#
# HOW TO MODIFY:
#   - Change values here to adjust how dark/light modes render
#   - Token names must match what scoped-vars.yaml and components expect
#   - Add a new mode by adding a top-level key (e.g. `high-contrast:`)
#   - Run `npm run regen` after changes
#
# RELATED: style-guide.scoped-vars.yaml (selector-level overrides)
#          style-guide.vars.yaml (base color definitions)
# ═══════════════════════════════════════════════════════════════

color-modes:
  # ── Light mode ─────────────────────────────────────────────────
  # White ground, black type, cool gray hierarchy.
  # Accent surfaces use tinted primaries for clear affordance.
  light:
    surface: "var(--white)"
    surface-alt: "var(--gray-50)"
    surface-inverse: "var(--black)"
    surface-accent: "var(--blue-light)"
    surface-warning: "var(--yellow-light)"
    surface-danger: "var(--red-light)"
    text: "var(--black)"
    text-secondary: "var(--gray-700)"
    text-muted: "var(--gray-500)"
    text-inverse: "var(--white)"
    text-link: "var(--blue)"
    border: "var(--gray-200)"
    border-strong: "var(--gray-300)"
    border-accent: "var(--black)"
    shadow-color: "rgba(0,0,0,0.08)"
    focus-ring: "rgba(0,71,171,0.3)"

  # ── Dark mode ──────────────────────────────────────────────────
  # Warm charcoal ground, soft white type, gentle contrast.
  # Lifted surfaces, muted borders — restful, not stark.
  dark:
    surface: "#1a1a1a"
    surface-alt: "#252525"
    surface-inverse: "var(--gray-200)"
    surface-accent: "rgba(0,71,171,0.18)"
    surface-warning: "rgba(245,197,24,0.15)"
    surface-danger: "rgba(226,6,19,0.15)"
    text: "#e8e8e8"
    text-secondary: "var(--gray-400)"
    text-muted: "var(--gray-500)"
    text-inverse: "var(--gray-900)"
    text-link: "#7eb8ff"
    border: "#333333"
    border-strong: "var(--gray-600)"
    border-accent: "#cccccc"
    shadow-color: "rgba(0,0,0,0.3)"
    focus-ring: "rgba(126,184,255,0.35)"

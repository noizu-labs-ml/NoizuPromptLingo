key_insights:
  - Two distinct interface modes: IDE/MCP protocol (P-001, P-005, P-006, P-008) vs web interface (P-002, P-003, P-004, P-006)
  - Feedback collection is a first-class feature, not a nice-to-have — required by P-002, P-003, P-004, P-006, P-007
  - Output format matters: SVG required for P-005 (accessibility compliance); PNG sufficient for P-004; DSL source (PlantUML/Mermaid) required for P-005 and P-008
  - On-premises deployment is a hard requirement for enterprise adoption (P-005)
  - Idempotent, headless API with service-account auth is required for P-008 — cannot require OAuth redirect
  - The product bridges two workflows: generation (speed, convenience) and review (feedback, annotation, traceability)

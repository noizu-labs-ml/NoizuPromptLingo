<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-labelledby="concept-b-title concept-b-desc">

  <title id="concept-b-title">TheRobotLives — Aperture</title>
  <desc id="concept-b-desc">An organic eye-like form: a rounded shape with an inner opening suggesting consciousness awakening, rendered in bioluminescent tones</desc>

  <defs>
    <!-- Gradient for the outer shell — bio to neural -->
    <linearGradient id="shell-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4AEDC4"/>
      <stop offset="100%" stop-color="#7B61FF"/>
    </linearGradient>
  </defs>

  <!--
    The aperture: a thick ring broken by a crescent cutout.
    Suggests an eye opening, an organism awakening, consciousness.
    Built with a single path using evenodd fill-rule for the cutout.
  -->

  <!-- Outer organic form — squircle-ish, 16px radius DNA -->
  <path d="
    M 100,22
    C 145,22 178,55 178,100
    C 178,145 145,178 100,178
    C 55,178 22,145 22,100
    C 22,55 55,22 100,22
    Z
    M 100,52
    C 73,52 52,73 52,100
    C 52,127 73,148 100,148
    C 127,148 148,127 148,100
    C 148,73 127,52 100,52
    Z
  " fill="url(#shell-gradient)" fill-rule="evenodd"/>

  <!-- The "pupil" — offset slightly above center (optical center) -->
  <circle cx="100" cy="96" r="16" fill="#4AEDC4"/>

  <!-- Inner glow ring around pupil -->
  <circle cx="100" cy="96" r="22" fill="none"
          stroke="#4AEDC4" stroke-width="1" stroke-opacity="0.4"/>

</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-labelledby="concept-e-title concept-e-desc">

  <title id="concept-e-title">TheRobotLives — Metal Flower</title>
  <desc id="concept-e-desc">A three-petaled metal flower on a stem — chrome petals catching light at different angles, bioluminescent core, slender metallic stem rising from below</desc>

  <defs>
    <!-- Petal gradients — each catches light from a different angle -->
    <linearGradient id="petal-a" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#D8DCE6"/>
      <stop offset="25%" stop-color="#F0F1F5"/>
      <stop offset="50%" stop-color="#A0A8B8"/>
      <stop offset="78%" stop-color="#6B7388"/>
      <stop offset="100%" stop-color="#3A4058"/>
    </linearGradient>
    <linearGradient id="petal-b" x1="80%" y1="10%" x2="20%" y2="90%">
      <stop offset="0%" stop-color="#C0C6D0"/>
      <stop offset="30%" stop-color="#E4E6EC"/>
      <stop offset="55%" stop-color="#8890A0"/>
      <stop offset="80%" stop-color="#585F75"/>
      <stop offset="100%" stop-color="#2E3448"/>
    </linearGradient>
    <linearGradient id="petal-c" x1="20%" y1="15%" x2="80%" y2="85%">
      <stop offset="0%" stop-color="#E0E3EA"/>
      <stop offset="35%" stop-color="#F5F6F8"/>
      <stop offset="58%" stop-color="#959DAD"/>
      <stop offset="82%" stop-color="#505870"/>
      <stop offset="100%" stop-color="#282E40"/>
    </linearGradient>

    <!-- Stem gradient — darker chrome, vertical -->
    <linearGradient id="stem-metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A5068"/>
      <stop offset="30%" stop-color="#8890A0"/>
      <stop offset="50%" stop-color="#A8B0BE"/>
      <stop offset="70%" stop-color="#8890A0"/>
      <stop offset="100%" stop-color="#3A4058"/>
    </linearGradient>

    <!-- Core glow -->
    <radialGradient id="core" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#4AEDC4"/>
      <stop offset="55%" stop-color="#4AEDC4" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#7B61FF" stop-opacity="0.15"/>
    </radialGradient>
  </defs>

  <!-- Stem — slender, metallic, slight curve -->
  <path d="
    M 100,88
    C 100,110 99,135 97,158
    C 96,170 95,180 95,188
  " fill="none" stroke="url(#stem-metal)" stroke-width="4.5"
     stroke-linecap="round"/>

  <!-- Small leaf on stem — left side, subtle -->
  <path d="
    M 97,148
    C 88,142 78,144 74,150
    C 78,148 88,147 95,152
  " fill="#6B7388" opacity="0.6"/>

  <!-- Small leaf on stem — right side -->
  <path d="
    M 99,132
    C 108,126 118,128 122,134
    C 118,132 108,131 101,136
  " fill="#6B7388" opacity="0.5"/>

  <!--
    Three petals — 120° apart.
    Wider, more leaf-like than the 6-petal version.
    Tapered tips, broad near center.
  -->

  <!-- Petal 1 — top (12 o'clock) -->
  <path d="
    M 100,22
    C 112,30 122,48 118,66
    C 115,76 110,84 100,86
    C 90,84 85,76 82,66
    C 78,48 88,30 100,22
    Z
  " fill="url(#petal-a)" opacity="0.95"/>

  <!-- Petal 2 — bottom right (4 o'clock) -->
  <path d="
    M 100,22
    C 112,30 122,48 118,66
    C 115,76 110,84 100,86
    C 90,84 85,76 82,66
    C 78,48 88,30 100,22
    Z
  " fill="url(#petal-b)" opacity="0.92"
     transform="rotate(120, 100, 78)"/>

  <!-- Petal 3 — bottom left (8 o'clock) -->
  <path d="
    M 100,22
    C 112,30 122,48 118,66
    C 115,76 110,84 100,86
    C 90,84 85,76 82,66
    C 78,48 88,30 100,22
    Z
  " fill="url(#petal-c)" opacity="0.92"
     transform="rotate(240, 100, 78)"/>

  <!-- Inner metallic ring — where petals meet stem -->
  <circle cx="100" cy="78" r="12" fill="none"
          stroke="#8890A0" stroke-width="1" opacity="0.4"/>

  <!-- Core glow — the life -->
  <circle cx="100" cy="78" r="10" fill="url(#core)"/>

  <!-- Bright center pip -->
  <circle cx="100" cy="76" r="4" fill="#4AEDC4"/>

  <!-- Specular highlight -->
  <circle cx="99" cy="74.5" r="1.5" fill="#FFFFFF" opacity="0.7"/>

</svg>

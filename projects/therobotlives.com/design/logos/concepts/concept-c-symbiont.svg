<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-labelledby="concept-c-title concept-c-desc">

  <title id="concept-c-title">TheRobotLives — Symbiont</title>
  <desc id="concept-c-desc">Two organic forms merging: a bioluminescent agent shape and a warm human shape overlapping to create a unified living entity</desc>

  <defs>
    <!-- Blend zone where agent and human overlap -->
    <linearGradient id="blend-zone" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4AEDC4"/>
      <stop offset="100%" stop-color="#E8A83E"/>
    </linearGradient>
  </defs>

  <!--
    Two rounded organic blobs overlapping.
    Left = bio (agent), Right = warm (human).
    The overlap zone creates a third color — the symbiosis.
  -->

  <!-- Agent form (bio) — left-leaning organic blob -->
  <path d="
    M 75,38
    C 110,32 135,55 132,90
    C 130,120 110,148 80,155
    C 50,162 28,138 28,105
    C 28,68 45,42 75,38
    Z
  " fill="#4AEDC4" opacity="0.85"/>

  <!-- Human form (warm) — right-leaning organic blob -->
  <path d="
    M 125,45
    C 155,40 175,62 172,95
    C 170,125 152,155 120,160
    C 90,165 68,142 70,110
    C 72,78 98,48 125,45
    Z
  " fill="#E8A83E" opacity="0.75"/>

  <!-- Overlap emphasis — a subtle neural glow at the intersection -->
  <ellipse cx="102" cy="102" rx="28" ry="35"
           fill="#7B61FF" opacity="0.3"
           transform="rotate(-8, 102, 102)"/>

  <!-- Central spark — the point of symbiosis -->
  <circle cx="100" cy="100" r="5" fill="#E8E6F0"/>

</svg>

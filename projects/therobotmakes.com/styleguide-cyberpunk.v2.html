<!DOCTYPE html>
<html lang="en" data-design-theme="cyberpunk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>noizu.ink — NEON PROTOCOL Style Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Share+Tech+Mono&family=Fira+Code:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="module">
    import * as HeadlessUI from 'https://esm.sh/@headlessui/react@2.2.4?external=react,react-dom';
    window.HeadlessUI = HeadlessUI;
    window.dispatchEvent(new Event('headlessui-ready'));
  </script>

  <script crossorigin src="https://noizu.github.io/react-assets/dist/sg.js"></script>
  <link rel="stylesheet" href="https://noizu.github.io/react-assets/dist/sg.css">

  <style>
    /* ═══════════════════════════════════════
       THEME: NEON PROTOCOL / Cyberpunk
       ═══════════════════════════════════════ */
    [data-design-theme="cyberpunk"] {
      /* Void — dark surfaces */
      --void:          #0a0a0f;
      --void-surface:  #111118;
      --void-elevated: #181822;
      --void-panel:    #1e1e2a;
      --void-border:   #2a2a3a;
      --void-hover:    #32324a;

      /* Neon — accent colors */
      --neon-cyan:     #00fff0;
      --neon-magenta:  #ff00aa;
      --neon-lime:     #aaff00;
      --neon-pink:     #ff3366;
      --neon-blue:     #4466ff;
      --neon-orange:   #ff8800;
      --neon-violet:   #aa44ff;

      /* Neon at lower opacity */
      --neon-cyan-20:    rgba(0, 255, 240, 0.2);
      --neon-cyan-10:    rgba(0, 255, 240, 0.1);
      --neon-cyan-05:    rgba(0, 255, 240, 0.05);
      --neon-magenta-20: rgba(255, 0, 170, 0.2);
      --neon-magenta-10: rgba(255, 0, 170, 0.1);
      --neon-lime-20:    rgba(170, 255, 0, 0.2);
      --neon-pink-20:    rgba(255, 51, 102, 0.2);

      /* Text */
      --text-primary:  #e0e0e8;
      --text-secondary:#8888a0;
      --text-dim:      #555570;
      --text-ghost:    #33334a;

      /* Semantic */
      --success:       #00ff88;
      --success-dim:   rgba(0, 255, 136, 0.15);
      --warning:       #ffaa00;
      --warning-dim:   rgba(255, 170, 0, 0.15);
      --error:         #ff3344;
      --error-dim:     rgba(255, 51, 68, 0.15);
      --info:          #4488ff;
      --info-dim:      rgba(68, 136, 255, 0.15);

      /* Fonts */
      --font-display: 'Orbitron', sans-serif;
      --font-mono:    'Fira Code', 'Share Tech Mono', monospace;
      --font-body:    'Share Tech Mono', 'Fira Code', monospace;
      --font-sans:    'Inter', -apple-system, sans-serif;

      /* Radius */
      --radius-sm: 2px;
      --radius-md: 4px;
      --radius-lg: 8px;

      /* Glow presets */
      --glow-cyan:    0 0 10px rgba(0,255,240,0.5), 0 0 40px rgba(0,255,240,0.15);
      --glow-magenta: 0 0 10px rgba(255,0,170,0.5), 0 0 40px rgba(255,0,170,0.15);
      --glow-lime:    0 0 10px rgba(170,255,0,0.5), 0 0 40px rgba(170,255,0,0.15);
      --glow-pink:    0 0 10px rgba(255,51,102,0.5), 0 0 40px rgba(255,51,102,0.15);

      /* Text glow presets */
      --text-glow-cyan:    0 0 8px rgba(0,255,240,0.8), 0 0 30px rgba(0,255,240,0.3);
      --text-glow-magenta: 0 0 8px rgba(255,0,170,0.8), 0 0 30px rgba(255,0,170,0.3);
      --text-glow-lime:    0 0 8px rgba(170,255,0,0.8), 0 0 30px rgba(170,255,0,0.3);

      /* Spacing */
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;
      --space-2xl: 48px;
      --space-3xl: 64px;
      --space-4xl: 96px;
    }

    /* ═══════════════════════════════════════
       ANIMATIONS
       ═══════════════════════════════════════ */
    @keyframes glitch {
      0%, 100% { transform: translate(0); filter: hue-rotate(0deg); }
      10% { transform: translate(-2px, -1px); }
      20% { transform: translate(2px, 1px); filter: hue-rotate(90deg); }
      30% { transform: translate(-1px, 2px); }
      40% { transform: translate(1px, -2px); filter: hue-rotate(180deg); }
      50% { transform: translate(-2px, 1px); }
      60% { transform: translate(2px, -1px); filter: hue-rotate(270deg); }
      70% { transform: translate(0, 2px); }
      80% { transform: translate(-1px, -1px); filter: hue-rotate(360deg); }
      90% { transform: translate(1px, 0); }
    }
    @keyframes glitch-text {
      0%, 100% { clip-path: inset(0 0 0 0); transform: translate(0); }
      5% { clip-path: inset(20% 0 60% 0); transform: translate(-3px, 0); }
      10% { clip-path: inset(60% 0 10% 0); transform: translate(3px, 0); }
      15% { clip-path: inset(40% 0 30% 0); transform: translate(-2px, 0); }
      20% { clip-path: inset(0 0 0 0); transform: translate(0); }
    }
    @keyframes scanline {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(100vh); }
    }
    @keyframes glow-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    @keyframes neon-flicker {
      0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; text-shadow: var(--text-glow-cyan); }
      20%, 24%, 55% { opacity: 0.6; text-shadow: none; }
    }
    @keyframes border-flow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }
    @keyframes blink-cursor {
      0%, 100% { border-color: var(--neon-cyan); }
      50% { border-color: transparent; }
    }
    @keyframes status-pulse {
      0%, 100% { box-shadow: 0 0 4px currentColor; }
      50% { box-shadow: 0 0 12px currentColor, 0 0 24px currentColor; }
    }

    /* ═══════════════════════════════════════
       RESET & BASE
       ═══════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      color: var(--text-primary);
      background: var(--void);
      line-height: 1.7;
      overflow-x: hidden;
    }
    /* Scanline overlay */
    body::after {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 255, 240, 0.015) 2px, rgba(0, 255, 240, 0.015) 4px);
      pointer-events: none;
      z-index: 9999;
    }
    /* Grid background */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image:
        linear-gradient(rgba(0, 255, 240, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 240, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: -1;
    }
    ::selection { background: var(--neon-cyan-20); color: var(--neon-cyan); }
    a { color: var(--neon-cyan); text-decoration: none; }
    a:hover { text-shadow: var(--text-glow-cyan); }

    /* ═══════════════════════════════════════
       BUTTONS
       ═══════════════════════════════════════ */
    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      margin-bottom: 24px;
    }
    .btn {
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 12px 28px;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.25s;
      position: relative;
      overflow: hidden;
    }
    .btn-primary {
      background: var(--neon-cyan);
      color: var(--void);
      box-shadow: var(--glow-cyan);
    }
    .btn-primary:hover {
      background: #33fff3;
      box-shadow: 0 0 20px rgba(0,255,240,0.6), 0 0 60px rgba(0,255,240,0.2);
      transform: translateY(-1px);
    }
    .btn-magenta {
      background: var(--neon-magenta);
      color: var(--void);
      box-shadow: var(--glow-magenta);
    }
    .btn-magenta:hover {
      background: #ff33bb;
      box-shadow: 0 0 20px rgba(255,0,170,0.6), 0 0 60px rgba(255,0,170,0.2);
      transform: translateY(-1px);
    }
    .btn-outline {
      background: transparent;
      color: var(--neon-cyan);
      border: 1px solid var(--neon-cyan);
      box-shadow: inset 0 0 12px rgba(0,255,240,0.05);
    }
    .btn-outline:hover {
      background: var(--neon-cyan-10);
      box-shadow: var(--glow-cyan), inset 0 0 20px rgba(0,255,240,0.08);
    }
    .btn-ghost {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--void-border);
    }
    .btn-ghost:hover {
      color: var(--neon-cyan);
      border-color: var(--neon-cyan);
      background: var(--neon-cyan-05);
    }
    .btn-danger {
      background: transparent;
      color: var(--error);
      border: 1px solid var(--error);
    }
    .btn-danger:hover {
      background: var(--error-dim);
      box-shadow: var(--glow-pink);
    }
    .btn-sm { font-size: 10px; padding: 8px 16px; }
    .btn-lg { font-size: 14px; padding: 16px 36px; }

    /* ═══════════════════════════════════════
       CARDS
       ═══════════════════════════════════════ */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
    }
    .card {
      background: var(--void-surface);
      border: 1px solid var(--void-border);
      border-radius: var(--radius-md);
      padding: 24px;
      transition: all 0.3s;
      position: relative;
    }
    .card::before {
      content: '';
      position: absolute;
      top: -1px; left: -1px; right: -1px; bottom: -1px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta), var(--neon-cyan));
      background-size: 200% 200%;
      z-index: -1;
      opacity: 0;
      transition: opacity 0.3s;
      animation: border-flow 3s ease infinite;
    }
    .card:hover { border-color: transparent; transform: translateY(-2px); }
    .card:hover::before { opacity: 1; }
    .card-glass {
      background: rgba(17, 17, 24, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 255, 240, 0.1);
    }
    .card-neon-border {
      border: 1px solid var(--neon-cyan);
      box-shadow: inset 0 0 20px var(--neon-cyan-05), var(--glow-cyan);
    }
    .card-title {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-primary);
      margin-bottom: 12px;
    }
    .card-body {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.7;
    }
    .card-tag {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 3px 8px;
      border-radius: var(--radius-sm);
      background: var(--neon-cyan-10);
      color: var(--neon-cyan);
      border: 1px solid rgba(0,255,240,0.15);
      margin-top: 12px;
    }

    /* ═══════════════════════════════════════
       INPUT FIELDS
       ═══════════════════════════════════════ */
    .input-demo { max-width: 500px; }
    .input-group { margin-bottom: 20px; }
    .input-label {
      display: block;
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }
    .input-field {
      width: 100%;
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--text-primary);
      background: var(--void);
      border: 1px solid var(--void-border);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      outline: none;
      transition: all 0.25s;
    }
    .input-field::placeholder { color: var(--text-dim); }
    .input-field:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 0 3px var(--neon-cyan-10), var(--glow-cyan);
    }
    .input-field.error {
      border-color: var(--error);
      box-shadow: 0 0 0 3px var(--error-dim);
    }
    .input-hint {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 6px;
    }
    .input-hint.error { color: var(--error); }
    .input-textarea { min-height: 100px; resize: vertical; }

    /* ═══════════════════════════════════════
       STATUS INDICATORS
       ═══════════════════════════════════════ */
    .status-indicator {
      border-radius: 50%;
    }
    .status-indicator.queued { background: var(--text-dim); color: var(--text-dim); }
    .status-indicator.building {
      background: var(--neon-cyan);
      color: var(--neon-cyan);
      animation: status-pulse 1.5s ease-in-out infinite;
    }
    .status-indicator.reviewing {
      background: var(--warning);
      color: var(--warning);
      animation: status-pulse 2s ease-in-out infinite;
    }
    .status-indicator.done { background: var(--success); color: var(--success); }
    .status-indicator.error-status {
      background: var(--error);
      color: var(--error);
      animation: status-pulse 0.8s ease-in-out infinite;
    }

    /* ═══════════════════════════════════════
       PROJECT COMPONENTS
       ═══════════════════════════════════════ */

    /* Code Block */
    .code-block {
      background: var(--void);
      border: 1px solid var(--void-border);
      border-radius: var(--radius-md);
      overflow: hidden;
    }
    .code-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: var(--void-surface);
      border-bottom: 1px solid var(--void-border);
    }
    .code-dots { display: flex; gap: 6px; }
    .code-dot { width: 10px; height: 10px; border-radius: 50%; }
    .code-dot:nth-child(1) { background: #ff5f57; }
    .code-dot:nth-child(2) { background: #febc2e; }
    .code-dot:nth-child(3) { background: #28c840; }
    .code-filename {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dim);
    }
    .code-body {
      padding: 20px;
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.8;
      overflow-x: auto;
      white-space: pre;
    }
    .code-body .comment { color: var(--text-dim); }
    .code-body .keyword { color: var(--neon-magenta); }
    .code-body .string { color: var(--neon-lime); }
    .code-body .function { color: var(--neon-cyan); }
    .code-body .number { color: var(--neon-orange); }
    .code-body .type { color: var(--neon-violet); }
    .code-body .operator { color: var(--neon-pink); }
    .code-terminal .code-body { color: var(--neon-lime); }
    .code-terminal .prompt { color: var(--neon-cyan); }
    .code-terminal .output { color: var(--text-secondary); }

    /* Agent Dashboard */
    .dashboard {
      display: grid;
      grid-template-columns: 220px 1fr 220px;
      gap: 1px;
      background: var(--void-border);
      border: 1px solid var(--void-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      min-height: 360px;
    }
    .dashboard-panel {
      background: var(--void-surface);
      padding: 16px;
      font-size: 12px;
    }
    .dashboard-panel-title {
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--text-dim);
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--void-border);
    }
    .story-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px;
      margin-bottom: 2px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.15s;
    }
    .story-item:hover { background: var(--void-panel); }
    .story-item.active {
      background: var(--neon-cyan-05);
      border-left: 2px solid var(--neon-cyan);
    }
    .story-id {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--text-dim);
      white-space: nowrap;
    }
    .story-title {
      color: var(--text-primary);
      font-size: 11px;
      line-height: 1.3;
    }
    .live-output {
      background: var(--void);
      border-radius: var(--radius-sm);
      padding: 12px;
      font-family: var(--font-mono);
      font-size: 10px;
      line-height: 1.9;
      color: var(--neon-lime);
      max-height: 240px;
      overflow-y: auto;
    }
    .live-output .line-dim { color: var(--text-dim); }
    .live-output .line-cyan { color: var(--neon-cyan); }
    .live-output .line-success { color: var(--success); }
    .live-output .line-error { color: var(--error); }
    .criteria-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      font-size: 11px;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--void-border);
    }
    .criteria-item:last-child { border-bottom: none; }
    .criteria-check {
      width: 14px;
      height: 14px;
      border: 1px solid var(--void-border);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      flex-shrink: 0;
    }
    .criteria-check.done {
      background: var(--success-dim);
      border-color: var(--success);
      color: var(--success);
    }
    .agent-controls {
      display: flex;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--void-border);
      margin-top: 12px;
    }

    /* Effects */
    .effects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }
    .effect-card {
      background: var(--void-surface);
      border: 1px solid var(--void-border);
      border-radius: var(--radius-md);
      padding: 32px 24px;
      text-align: center;
      min-height: 160px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      position: relative;
      overflow: hidden;
    }
    .effect-label {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }
    .effect-scanline { position: relative; }
    .effect-scanline::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: rgba(0, 255, 240, 0.1);
      animation: scanline 4s linear infinite;
    }
    .glitch-demo {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 900;
      color: var(--text-primary);
      position: relative;
      animation: glitch 0.5s infinite;
    }
    .neon-flicker-demo {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 700;
      color: var(--neon-cyan);
      animation: neon-flicker 3s infinite;
    }
    .glow-pulse-demo {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--neon-magenta);
      box-shadow: 0 0 20px var(--neon-magenta), 0 0 60px rgba(255,0,170,0.3);
      animation: glow-pulse 2s ease-in-out infinite;
    }
    .gradient-border-demo {
      padding: 24px 32px;
      background: var(--void-surface);
      border-radius: var(--radius-md);
      position: relative;
      z-index: 1;
    }
    .gradient-border-demo::before {
      content: '';
      position: absolute;
      top: -2px; left: -2px; right: -2px; bottom: -2px;
      background: linear-gradient(45deg, var(--neon-cyan), var(--neon-magenta), var(--neon-lime), var(--neon-cyan));
      background-size: 300% 300%;
      border-radius: inherit;
      z-index: -1;
      animation: border-flow 4s ease infinite;
    }

    /* Grid demos */
    .grid-demo {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 8px;
    }
    .grid-cell {
      height: 48px;
      background: var(--neon-cyan-05);
      border: 1px solid rgba(0,255,240,0.1);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-dim);
    }
    .grid-cell:hover {
      background: var(--neon-cyan-10);
      border-color: rgba(0,255,240,0.3);
      color: var(--neon-cyan);
    }

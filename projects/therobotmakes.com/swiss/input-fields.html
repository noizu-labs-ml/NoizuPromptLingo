    <section class="sg-section" id="inputs">
      <div class="sg-section-header">
        <div class="sg-section-number">05</div>
        <div class="sg-section-title-group">
          <h2 class="sg-section-title">Input Fields</h2>
          <p class="sg-section-desc">2px border. Black on focus. Red on error. Nothing else.</p>
        </div>
      </div>

      <div class="input-demo">
        <div class="input-group">
          <label class="input-label">Project Name</label>
          <input type="text" class="input-field" placeholder="my-side-project">
          <div class="input-hint">Lowercase, hyphens only, 3-40 characters</div>
        </div>
        <div class="input-group">
          <label class="input-label">Pitch</label>
          <textarea class="input-field input-textarea" placeholder="Describe your idea in 2-3 sentences..."></textarea>
        </div>
        <div class="input-group">
          <label class="input-label">API Key (Error)</label>
          <input type="text" class="input-field error" value="invalid-key-format">
          <div class="input-hint error">Invalid API key format</div>
        </div>
        <div class="input-group">
          <label class="input-label">Disabled</label>
          <input type="text" class="input-field" disabled value="Locked during agent execution" style="opacity:0.4;cursor:not-allowed;">
        </div>
      </div>
    </section>

    <!-- Section -->
    <!-- Section: Input Fields -->
    <section class="sg-section" id="inputs">
      <div class="sg-section-header">
        <span class="sg-section-number">05</span>
        <h2 class="sg-section-title">Input Fields</h2>
      </div>

      <div class="input-demo">
        <div class="input-group">
          <label class="input-label">Project Name</label>
          <input type="text" class="input-field" placeholder="my-side-project">
        </div>
        <div class="input-group">
          <label class="input-label">Pitch</label>
          <textarea class="input-field input-textarea" placeholder="Describe your idea in 2-3 sentences..."></textarea>
        </div>
        <div class="input-group">
          <label class="input-label">Error State</label>
          <input type="text" class="input-field error" value="invalid-key">
          <div style="font-size:10px;color:var(--redline);margin-top:6px;font-family:var(--font-mono);">REDLINE: Invalid format</div>
        </div>
        <div class="input-group">
          <label class="input-label">Disabled</label>
          <input type="text" class="input-field" disabled value="Locked during build" style="opacity:0.35;cursor:not-allowed;">
        </div>
      </div>

      <div class="annotation" style="margin-top:var(--space-md);">Focus state uses yellow annotation border &mdash; the drafting pen is active here.</div>
    </section>

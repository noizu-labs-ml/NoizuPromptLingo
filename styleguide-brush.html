<!DOCTYPE html>
<html lang="en" data-design-theme="brush">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>noizu.ink — Style Guide</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="module">
    import * as HeadlessUI from 'https://esm.sh/@headlessui/react@2.2.4?external=react,react-dom';
    window.HeadlessUI = HeadlessUI;
    window.dispatchEvent(new Event('headlessui-ready'));
  </script>

  <script crossorigin src="https://noizu.github.io/react-assets/dist/sg.js"></script>
  <link rel="stylesheet" href="https://noizu.github.io/react-assets/dist/sg.css">

  <style>
    /* ═══════════════════════════════════════
       THEME: brush — Ink Editorial
       ═══════════════════════════════════════ */
    [data-design-theme="brush"] {
      /* Paper & ink */
      --paper: #FAF8F5;
      --paper-warm: #F5F0EB;
      --ink: #1A1A1A;
      --ink-mid: #3D3D3D;
      --ink-light: #6B6B6B;
      --ink-wash: #A3A3A3;
      --ink-ghost: #D4D0CC;
      --white: #FFFFFF;

      /* Accent — warm ink blue (like fountain pen ink) */
      --accent: #2B4C7E;
      --accent-light: rgba(43, 76, 126, 0.08);
      --accent-mid: rgba(43, 76, 126, 0.15);
      --accent-vivid: #3B6DB5;

      /* Semantic */
      --success: #3D7A4A;
      --success-light: rgba(61, 122, 74, 0.08);
      --warning: #8B6914;
      --error: #9B2C2C;
      --error-light: rgba(155, 44, 44, 0.08);

      /* Dark surfaces (Ink phase) */
      --dark-bg: #111111;
      --dark-surface: #1A1A1A;
      --dark-border: #2A2A2A;
      --dark-text: #E5E5E5;
      --dark-text-dim: #888888;

      /* Border */
      --border: #E5E0DB;
      --border-hover: #CCC5BD;

      /* Radius — slightly more refined than pure tech */
      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 10px;

      /* Fonts */
      --font-serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;

      /* Shadow */
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.06);
      --shadow-md: 0 2px 8px rgba(0,0,0,0.08);
    }

    /* ═══════════════════════════════════════
       RESET & BASE — Brush overrides
       ═══════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-font-smoothing: antialiased; }
    body {
      font-family: var(--font-sans);
      color: var(--ink);
      background: var(--paper);
      line-height: 1.6;
    }
    ::selection { background: var(--accent-mid); color: var(--ink); }

    /* ═══════════════════════════════════════
       BRUSH STYLE OVERRIDES
       ═══════════════════════════════════════
       The CDN provides Swiss/Bauhaus defaults.
       Below we override to get the editorial
       ink aesthetic: serif headings, rounded
       corners, warm paper tones.
       ═══════════════════════════════════════ */

    /* Section headers — serif instead of sans */
    .style-guide .sg-section-header h2 {
      font-family: var(--font-serif);
      font-weight: 400;
    }
    .style-guide .sg-section-header .sg-section-number {
      font-family: var(--font-mono);
      color: var(--ink-wash);
    }

    /* Cards — rounded corners, softer borders */
    .style-guide .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 24px;
      transition: border-color 0.15s;
    }
    .style-guide .card:hover { border-color: var(--border-hover); }
    .style-guide .card-title {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 400;
      margin-bottom: 4px;
    }
    .style-guide .card-body {
      font-size: 14px;
      color: var(--ink-light);
      line-height: 1.5;
    }

    /* Buttons — brush style */
    .style-guide .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 500;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.15s ease;
      border: none;
      padding: 10px 16px;
    }
    .style-guide .btn-primary { background: var(--ink); color: var(--paper); }
    .style-guide .btn-primary:hover { background: var(--ink-mid); }
    .style-guide .btn-secondary { background: transparent; color: var(--ink); border: 1px solid var(--border); }
    .style-guide .btn-secondary:hover { background: var(--paper-warm); border-color: var(--border-hover); }
    .style-guide .btn-ghost { background: transparent; color: var(--ink-light); padding: 10px 12px; }
    .style-guide .btn-ghost:hover { color: var(--ink); }
    .style-guide .btn-accent { background: var(--accent); color: var(--paper); }
    .style-guide .btn-accent:hover { background: var(--accent-vivid); }
    .style-guide .btn-sm { padding: 6px 12px; font-size: 13px; }
    .style-guide .btn-lg { padding: 14px 28px; font-size: 16px; }

    /* Inputs — brush style */
    .style-guide .input-field {
      width: 100%;
      font-family: var(--font-sans);
      font-size: 14px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--white);
      color: var(--ink);
      transition: border-color 0.15s;
      outline: none;
    }
    .style-guide .input-field:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-light);
    }
    .style-guide .input-field::placeholder { color: var(--ink-wash); }
    .style-guide textarea.input-field { resize: vertical; min-height: 80px; line-height: 1.5; }

    .style-guide .input-label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
    }
    .style-guide .input-hint,
    .style-guide .input-helper {
      font-size: 12px;
      color: var(--ink-wash);
      margin-top: 4px;
      font-style: italic;
    }

    /* Color swatches — rounded */
    .style-guide .color-swatch {
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    /* Type specimens — brush borders */
    .style-guide .type-specimen {
      padding: 24px 0;
      border-bottom: 1px solid var(--border);
    }
    .style-guide .type-specimen:last-child { border-bottom: none; }

    /* ═══════════════════════════════════════
       BRUSH-SPECIFIC COMPONENTS
       (not in CDN)
       ═══════════════════════════════════════ */

    /* Card extensions */
    .card-subtitle {
      font-size: 13px;
      color: var(--ink-wash);
      margin-bottom: 12px;
    }
    .card-footer {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      align-items: center;
    }

    /* Persona Card */
    .persona-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--accent-light);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-serif);
      font-weight: 400;
      font-style: italic;
      font-size: 18px;
      margin-bottom: 12px;
    }
    .persona-label {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      background: var(--accent-light);
      padding: 2px 8px;
      border-radius: 3px;
      margin-bottom: 12px;
    }
    .persona-field-label {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--ink-wash);
      margin-top: 10px;
      margin-bottom: 2px;
    }
    .persona-field-value {
      font-size: 14px;
      color: var(--ink-light);
    }

    /* Story Card */
    .story-id {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--ink-wash);
    }
    .story-text {
      font-size: 14px;
      color: var(--ink);
      margin: 8px 0;
      line-height: 1.6;
    }
    .story-criteria {
      list-style: none;
      padding: 0;
    }
    .story-criteria li {
      font-size: 13px;
      color: var(--ink-light);
      padding: 4px 0 4px 20px;
      position: relative;
    }
    .story-criteria li::before {
      content: "\2610";
      position: absolute;
      left: 0;
      color: var(--ink-wash);
    }
    .story-tag {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 3px;
      margin-right: 4px;
      letter-spacing: 0.03em;
    }
    .tag-mvp { background: var(--success-light); color: var(--success); }
    .tag-persona { background: var(--accent-light); color: var(--accent); }

    /* Project Card */
    .project-card { cursor: pointer; }
    .project-card:hover { border-color: var(--accent); }
    .project-step {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--accent);
      background: var(--accent-light);
      padding: 2px 8px;
      border-radius: 3px;
      display: inline-block;
    }
    .project-meta {
      font-size: 12px;
      color: var(--ink-wash);
      margin-top: 8px;
    }
    .progress-bar {
      height: 3px;
      background: var(--paper-warm);
      border-radius: 2px;
      margin-top: 12px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    /* ═══════════════════════════════════════
       SCREEN MOCKUP COMPONENTS
       ═══════════════════════════════════════ */

    /* App header */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      height: 56px;
      border-bottom: 1px solid var(--border);
    }
    .app-logo {
      font-family: var(--font-serif);
      font-weight: 400;
      font-style: italic;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .app-logo-icon {
      width: 28px;
      height: 28px;
      background: var(--ink);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--paper);
      font-family: var(--font-serif);
      font-size: 14px;
      font-style: italic;
    }
    .app-nav { display: flex; gap: 16px; align-items: center; }
    .app-nav-item {
      font-size: 14px;
      color: var(--ink-light);
      text-decoration: none;
      cursor: pointer;
    }
    .app-nav-item:hover { color: var(--ink); }
    .app-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--paper-warm);
      border: 1px solid var(--border);
    }

    /* Phase tabs */
    .phase-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--white);
    }
    .phase-tab {
      padding: 12px 24px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--ink-wash);
      border-bottom: 2px solid transparent;
      cursor: pointer;
    }
    .phase-tab.active { color: var(--ink); border-bottom-color: var(--ink); }
    .phase-tab.completed { color: var(--success); }

    /* Wizard progress */
    .wizard-progress {
      display: flex;
      align-items: center;
      gap: 0;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--white);
    }
    .wizard-step {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--ink-wash);
      white-space: nowrap;
    }
    .wizard-step.completed { color: var(--success); }
    .wizard-step.active { color: var(--ink); font-weight: 500; }
    .wizard-step-num {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 500;
      background: var(--paper-warm);
      color: var(--ink-wash);
      flex-shrink: 0;
    }
    .wizard-step.completed .wizard-step-num { background: var(--success-light); color: var(--success); }
    .wizard-step.active .wizard-step-num { background: var(--ink); color: var(--paper); }
    .wizard-step-line {
      width: 24px;
      height: 1px;
      background: var(--border);
      flex-shrink: 0;
      margin: 0 4px;
    }

    /* Wizard layout */
    .wizard-layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      min-height: 340px;
    }
    .wizard-main { padding: 24px; }
    .wizard-sidebar {
      border-left: 1px solid var(--border);
      padding: 24px;
      background: var(--paper-warm);
    }
    .wizard-sidebar-title {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--ink-wash);
      margin-bottom: 16px;
    }
    .wizard-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      border-top: 1px solid var(--border);
      background: var(--white);
    }

    /* AI suggestion */
    .ai-suggestion {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px;
      margin-bottom: 12px;
      font-size: 14px;
      color: var(--ink-light);
    }
    .ai-suggestion-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .ai-badge {
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      background: var(--accent-light);
      padding: 2px 6px;
      border-radius: 3px;
    }
    .ai-suggestion-actions { display: flex; gap: 6px; margin-top: 10px; }
    .ai-suggestion-actions .btn { padding: 4px 10px; font-size: 12px; }

    /* Dashboard */
    .dashboard-content { padding: 24px; }
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .dashboard-title {
      font-family: var(--font-serif);
      font-size: 24px;
      font-weight: 400;
    }

    /* Landing page */
    .landing-hero {
      text-align: center;
      padding: 64px 24px 40px;
    }
    .landing-hero h2 {
      font-family: var(--font-serif);
      font-size: 42px;
      font-weight: 400;
      font-style: italic;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 16px;
    }
    .landing-hero p {
      color: var(--ink-light);
      font-size: 16px;
      max-width: 440px;
      margin: 0 auto 28px;
      line-height: 1.6;
    }
    .landing-phases {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: var(--border);
      margin: 0 24px 32px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
    }
    .landing-phase {
      text-align: center;
      padding: 20px 16px;
      background: var(--white);
    }
    .landing-phase-name {
      font-family: var(--font-serif);
      font-size: 18px;
      font-style: italic;
      margin-bottom: 4px;
    }
    .landing-phase-desc {
      font-size: 12px;
      color: var(--ink-wash);
      line-height: 1.4;
    }

    /* Agent dashboard */
    .agent-layout {
      display: grid;
      grid-template-columns: 240px 1fr 280px;
      min-height: 380px;
    }
    .agent-backlog {
      border-right: 1px solid var(--dark-border);
      padding: 16px;
      background: var(--dark-surface);
      overflow-y: auto;
    }
    .agent-center {
      padding: 16px;
      background: var(--dark-bg);
      overflow-y: auto;
    }
    .agent-detail {
      border-left: 1px solid var(--dark-border);
      padding: 16px;
      background: var(--dark-surface);
    }
    .backlog-item {
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      margin-bottom: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--dark-text-dim);
    }
    .backlog-item:hover { background: var(--dark-border); }
    .backlog-item.active { background: var(--accent-light); color: var(--accent-vivid); }
    .backlog-item.done { color: var(--success); }
    .backlog-item.in-progress { color: var(--accent-vivid); font-weight: 500; }
    .backlog-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--dark-border);
      flex-shrink: 0;
    }
    .backlog-item.done .backlog-dot { background: var(--success); }
    .backlog-item.in-progress .backlog-dot { background: var(--accent-vivid); animation: pulse 1.5s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Code blocks */
    .code-block {
      background: #0D0D0D;
      color: #E5E5E5;
      border-radius: var(--radius-sm);
      padding: 16px;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.6;
      overflow-x: auto;
      border: 1px solid var(--dark-border);
    }
    .code-add { color: #6EE7A0; }
    .code-remove { color: #F87171; }
    .code-comment { color: #555; }
    .code-filename {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--dark-text-dim);
      margin-bottom: 4px;
    }

    /* Agent controls */
    .agent-controls {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid var(--dark-border);
      background: var(--dark-surface);
      align-items: center;
    }

    /* Demo preview */
    .demo-frame {
      background: var(--paper-warm);
      min-height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .demo-toolbar {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 4px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 3px;
    }
    .demo-toolbar-btn {
      padding: 4px 8px;
      font-size: 12px;
      border: none;
      background: transparent;
      color: var(--ink-wash);
      cursor: pointer;
      border-radius: 3px;
    }
    .demo-toolbar-btn.active { background: var(--paper-warm); color: var(--ink); }

    /* Deploy */
    .deploy-layout {
      display: grid;
      grid-template-columns: 1fr 300px;
      min-height: 340px;
    }
    .deploy-main { padding: 24px; }
    .deploy-sidebar {
      border-left: 1px solid var(--border);
      padding: 24px;
    }
    .deploy-target {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
      cursor: pointer;
    }
    .deploy-target.selected { border-color: var(--accent); background: var(--accent-light); }
    .deploy-target-name { font-size: 14px; font-weight: 500; }
    .deploy-target-desc { font-size: 12px; color: var(--ink-wash); }
    .deploy-log {
      background: #0D0D0D;
      color: #888;
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 1.7;
      padding: 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--dark-border);
    }
    .deploy-log .log-success { color: #6EE7A0; }
    .deploy-log .log-info { color: #7EB8DA; }

    /* Export */
    .export-layout {
      display: grid;
      grid-template-columns: 1fr 280px;
      min-height: 340px;
    }
    .export-preview {
      padding: 24px;
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.6;
      color: var(--ink-light);
    }
    .export-preview h4 {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 400;
      color: var(--ink);
      margin-bottom: 8px;
    }
    .export-preview .md-h2 {
      font-family: var(--font-serif);
      font-size: 15px;
      font-weight: 600;
      color: var(--ink);
      margin-top: 16px;
      margin-bottom: 4px;
    }
    .export-sidebar {
      border-left: 1px solid var(--border);
      padding: 24px;
    }
    .export-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      margin-bottom: 8px;

[package]
name = "tabbing-on"
version = "0.2.0"
edition = "2021"
description = "Terminal tab title, status & task manager"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "6"
chrono = "0.4"
rand = "0.8"
ratatui = "0.29"
crossterm = "0.28"
reqwest = { version = "0.12", features = ["blocking", "multipart", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }
direnv-config = { path = "../../direnv-config/sdk/rust" }

[profile.release]
strip = true
lto = true
opt-level = "z"

version: 1
name: default
# App slugs baked into the sandbox image. See `snippets/apps/` for the library.
apps:
  - shell
  - node
  - claude
# Keep the container off the public internet by default (safest).
internet_access: false
agent:
  default: claude
  available:
    - claude
  # Run the agent in dangerous / auto-approve mode inside the sandbox.
  dangerous: true
# Environment variables injected into the container.
env: {}
# Host<->container port maps (bound to loopback by default).
ports: []
# Extra volume mounts beyond the worktree and agent credential dirs.
mounts: []
hooks:
  # before_launch: bin/before-launch     # host, every launch
  # on_docker_start: bin/on-docker-start # in-container, before the shell
  {}
tools:
  copy_bins:
    - docker-rebuild
    - docker-build
    - docker-push
  copy_shares:
    - k8-lib
  prepend_path: true

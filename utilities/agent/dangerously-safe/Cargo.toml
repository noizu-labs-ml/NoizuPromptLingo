[package]
name = "agent-sandbox"
version = "0.1.0"
edition = "2021"
description = "TUI sandbox launcher for running coding agents in isolated docker worktrees"
license = "MIT"
authors = ["Keith Brings <keith.brings@noizu.com>"]

[[bin]]
name = "agent-sandbox"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
anyhow = "1"
thiserror = "2"
dirs = "6"
indexmap = { version = "2", features = ["serde"] }
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
strip = true

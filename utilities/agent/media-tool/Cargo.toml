[package]
name = "generate-media-prompt"
version = "0.1.0"
edition = "2021"
description = "Generate media assets from .media.prompt YAML files"

[[bin]]
name = "generate-media-prompt"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
color-eyre = "0.6"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
indicatif = "0.17"
dialoguer = "0.11"
mime_guess = "2"
futures = "0.3"
async-trait = "0.1"

[dev-dependencies]
insta = "1"

[profile.release]
strip = true
lto = true

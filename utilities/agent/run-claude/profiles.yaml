# run-claude profiles
#
# Profile search order (first match wins):
# 1. ~/.config/run-claude/user.profiles.yaml
# 2. ~/.config/run-claude/profiles.yaml
# 3. <install>/user.profiles.yaml
# 4. <install>/profiles.yaml
#
# To disable a profile from a higher-priority file, set model: null or model: false
# Example:
#   cerebras:
#     model: null  # This disables cerebras, falling through to lower-priority files

# Anthropic - Native Claude models
anthropic:
  name: "Anthropic"
  opus_model: "claude-opus-4-20250514"
  sonnet_model: "claude-sonnet-4-20250514"
  haiku_model: "claude-3-5-haiku-20241022"

# OpenAI - GPT models
openai:
  name: "OpenAI"
  opus_model: "openai-gpt4"
  sonnet_model: "openai-gpt4o"
  haiku_model: "openai-gpt4o-mini"

# Cerebras - Speed optimized inference
cerebras:
  name: "Cerebras"
  opus_model: "cerebras/gpt-oss-120b"
  sonnet_model: "cerebras/qwen-3-32b"
  haiku_model: "cerebras/llama3.1-8b"

# Cerebras2 - Alternative Cerebras config with GLM
cerebras2:
  name: "Cerebras (GLM)"
  opus_model: "cerebras/zai-glm-4.6"
  sonnet_model: "cerebras/gpt-oss-120b"
  haiku_model: "cerebras/qwen-3-32b"

# Cerebras Subscription - GLM with thinking tiers
cerebras-pro:
  name: "Cerebras Pro Subscription"
  opus_model: "cerebras-pro/opus"
  sonnet_model: "cerebras-pro/sonnet"
  haiku_model: "cerebras-pro/haiku"
  # Claude Code v2.1.116+ appends "[1m]" for the 1M-context variants; register
  # aliases so those requests route instead of timing out.
  extended:
    - "cerebras-pro/opus[1m]"
    - "cerebras-pro/sonnet[1m]"
    - "cerebras-pro/haiku[1m]"

groq-pro:
  name: "Groq Equivalent"
  opus_model: "groq/opus"
  sonnet_model: "groq/sonnet"
  haiku_model: "groq/haiku"
  extended:
    - "groq-kimi-k2"
    - "groq-llama-4-scout"
    - "groq-llama-4-maverick"
    - "groq-qwen3-32b"
    - "groq-llama-3.3-70b"
    - "groq-llama-3.1-8b"


# Z.AI Subscription - GLM with thinking tiers
zai-pro:
  name: "Zai Subscription"
  opus_model: "zai/opus"
  sonnet_model: "zai/sonnet"
  haiku_model: "zai/haiku"

# Z.AI Subscription - OpenAI v1 endpoint format
zai-oa:
  name: "Zai Subscription (OpenAI v1)"
  opus_model: "zai-oa/opus"
  sonnet_model: "zai-oa/sonnet"
  haiku_model: "zai-oa/haiku"

# Claude Plan - OAuth Pass-through (Pro/Max subscription)
# Anthropic models go directly to api.anthropic.com via front proxy.
# Non-Anthropic models route through LiteLLM for model translation.
claude-plan:
  name: "Claude Plan (OAuth Pass-through)"

  opus_model: "claude-opus-4-6"
  sonnet_model: "claude-sonnet-4-6"
  haiku_model: "claude-haiku-4-5-20251001"
  extended:
    - "claude-opus-4-6[1m]"
    - "claude-sonnet-4-6[1m]"
    - "claude-haiku-4-5-20251001[1m]"
    - "claude-opus-4-7"
    - "claude-opus-4-7[1m]"
    - "cerebras-pro/opus"
    - "cerebras-pro/sonnet"
    - "cerebras-pro/haiku"
    - "cerebras-pro/opus[1m]"
    - "cerebras-pro/sonnet[1m]"
    - "cerebras-pro/haiku[1m]"
    - "zai/opus"
    - "zai/sonnet"
    - "zai/haiku"
    - "zai/opus[1m]"
    - "zai/sonnet[1m]"
    - "zai/haiku[1m]"

# All-Sub - Opus on Claude plan, Sonnet on Z.AI (glm-5.1), Haiku on Cerebras
# Requires: Claude Pro/Max login + ZAI_SUB_KEY + CEREBRAS_SUB_KEY in .secrets
all-sub:
  name: "All Subscriptions (Claude + Z.AI + Cerebras)"

  opus_model: "claude-opus-4-6"
  sonnet_model: "zai/opus"
  haiku_model: "cerebras-pro/opus"
  extended:
    # Claude variants
    - "claude-opus-4-6[1m]"
    - "claude-opus-4-7"
    - "claude-opus-4-7[1m]"
    - "claude-sonnet-4-6"
    - "claude-sonnet-4-6[1m]"
    - "claude-haiku-4-5-20251001"
    - "claude-haiku-4-5-20251001[1m]"
    # Z.AI full set
    - "zai/opus"
    - "zai/opus[1m]"
    - "zai/sonnet"
    - "zai/sonnet[1m]"
    - "zai/haiku"
    - "zai/haiku[1m]"
    # Cerebras full set
    - "cerebras-pro/opus"
    - "cerebras-pro/opus[1m]"
    - "cerebras-pro/sonnet"
    - "cerebras-pro/sonnet[1m]"
    - "cerebras-pro/haiku"
    - "cerebras-pro/haiku[1m]"

# Claude Enhanced - Claude for all tiers + every alternative provider in extended
# Requires: Claude Pro/Max login + ZAI_SUB_KEY + CEREBRAS_SUB_KEY + GROQ_API_KEY
claude-enhanced:
  name: "Claude Enhanced (All Providers)"

  opus_model: "claude-opus-4-6"
  sonnet_model: "claude-sonnet-4-6"
  haiku_model: "claude-haiku-4-5-20251001"
  extended:
    # Claude variants
    - "claude-opus-4-6[1m]"
    - "claude-opus-4-7"
    - "claude-opus-4-7[1m]"
    - "claude-sonnet-4-6[1m]"
    - "claude-haiku-4-5-20251001[1m]"
    # Z.AI (sub)
    - "zai/opus"
    - "zai/opus[1m]"
    - "zai/sonnet"
    - "zai/sonnet[1m]"
    - "zai/haiku"
    - "zai/haiku[1m]"
    # Cerebras (sub)
    - "cerebras-pro/opus"
    - "cerebras-pro/opus[1m]"
    - "cerebras-pro/sonnet"
    - "cerebras-pro/sonnet[1m]"
    - "cerebras-pro/haiku"
    - "cerebras-pro/haiku[1m]"
    # Groq
    - "groq/opus"
    - "groq/sonnet"
    - "groq/haiku"

# Kitchen Sink - claude-enhanced plus DeepSeek, OpenAI, and xAI/Grok
# Requires: Claude Pro/Max login + ZAI_SUB_KEY + CEREBRAS_SUB_KEY + GROQ_API_KEY
#           + DEEPSEEK_API_KEY + OPENAI_API_KEY + GROK_API_KEY
kitchen-sink:
  name: "Kitchen Sink (Every Provider)"

  opus_model: "claude-opus-4-6"
  sonnet_model: "claude-sonnet-4-6"
  haiku_model: "claude-haiku-4-5-20251001"
  extended:
    # Claude variants
    - "claude-opus-4-6[1m]"
    - "claude-opus-4-7"
    - "claude-opus-4-7[1m]"
    - "claude-sonnet-4-6[1m]"
    - "claude-haiku-4-5-20251001[1m]"
    # Z.AI (sub)
    - "zai/opus"
    - "zai/opus[1m]"
    - "zai/sonnet"
    - "zai/sonnet[1m]"
    - "zai/haiku"
    - "zai/haiku[1m]"
    # Cerebras (sub)
    - "cerebras-pro/opus"
    - "cerebras-pro/opus[1m]"
    - "cerebras-pro/sonnet"
    - "cerebras-pro/sonnet[1m]"
    - "cerebras-pro/haiku"
    - "cerebras-pro/haiku[1m]"
    # Groq
    - "groq/opus"
    - "groq/sonnet"
    - "groq/haiku"
    # DeepSeek
    - "deepseek-reasoner"
    - "deepseek-chat"
    - "deepseek-coder"
    # OpenAI
    - "openai-gpt4"
    - "openai-gpt4o"
    - "openai-gpt4o-mini"
    - "openai-o1"
    - "openai-o3-mini"
    # xAI / Grok
    - "grok-2"
    - "grok-2-mini"
    - "grok-vision"

# glm 4.7 group
fast-glm:
  name: "Cerebras Pro Subscription"
  opus_model: "zai/opus"
  sonnet_model: "groq/opus"
  haiku_model: "cerebras-pro/opus"

# Groq - Ultra-fast inference
groq:
  name: "Groq"
  opus_model: "groq.qwen3-32b"
  sonnet_model: "groq.kimi-k2-instruct"
  haiku_model: "groq.gpt-oss-120b"

# Groq2 - Alternative Groq config (speed optimized)
groq2:
  name: "Groq (Speed)"
  opus_model: "groq.gpt-oss-120b"
  sonnet_model: "groq.qwen3-32b"
  haiku_model: "groq.llama-3.3-70b"

# Groq Mix - Optimized Groq blend (intelligence-first)
groq-mix:
  name: "Groq Mix (Intelligence-First)"
  opus_model: "groq.gpt-oss-120b"
  sonnet_model: "groq.kimi-k2-instruct"
  haiku_model: "groq.qwen3-32b"
  extended:
    - "groq.llama-3.3-70b"
    - "groq.llama-3.1-8b"
    - "groq.llama-4-scout"
    - "groq.llama-4-maverick"

# Gemini - Google AI models
gemini:
  name: "Google Gemini"
  opus_model: "gemini-pro"
  sonnet_model: "gemini-flash"
  haiku_model: "gemini-flash-lite"

# Azure OpenAI - Enterprise Azure deployment
azure:
  name: "Azure OpenAI"
  opus_model: "azure-gpt4"
  sonnet_model: "azure-gpt4o"
  haiku_model: "azure-gpt4o-mini"

# Grok - xAI models
grok:
  name: "xAI Grok"
  opus_model: "grok-2"
  sonnet_model: "grok-2"
  haiku_model: "grok-2-mini"

# DeepSeek - DeepSeek AI models
deepseek:
  name: "DeepSeek"
  opus_model: "deepseek-reasoner"
  sonnet_model: "deepseek-chat"
  haiku_model: "deepseek-coder"

# Mistral - Mistral AI models
mistral:
  name: "Mistral AI"
  opus_model: "mistral-large"
  sonnet_model: "mistral-medium"
  haiku_model: "mistral-small"

# Perplexity - Search-enabled inference
perplexity:
  name: "Perplexity (Search-Augmented)"
  opus_model: "perplexity-large"
  sonnet_model: "perplexity-medium"
  haiku_model: "perplexity-fast"

# Local - Ollama / vLLM / LM Studio
local:
  name: "Local/Self-Hosted"
  opus_model: "local-large"
  sonnet_model: "local-medium"
  haiku_model: "local-small"

# Multi - Best-of-breed from multiple providers
multi:
  name: "Multi-Provider (Best of Breed)"
  opus_model: "openai-gpt4"
  sonnet_model: "gemini-flash"
  haiku_model: "gemini-flash-lite"

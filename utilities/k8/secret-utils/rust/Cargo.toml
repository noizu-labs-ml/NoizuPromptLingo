[package]
name = "infisical"
version = "0.1.0"
edition = "2021"
description = "Infisical secrets management CLI with TUI"

[[bin]]
name = "infisical"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "env"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "1"

# TUI
ratatui = "0.28"
crossterm = "0.28"

# Progress (non-TUI)
indicatif = "0.17"

# Utilities
regex = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
walkdir = "2"
colored = "2"
atty = "0.2"
rpassword = "7"
urlencoding = "2"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

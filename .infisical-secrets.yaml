# =============================================================================
# Infisical Secret Definitions — Noizu K8s Infrastructure
# =============================================================================
# Declarative YAML translation of utils/infisical-populate-secrets.
# Each section maps to one populate_* function in the legacy script.
# =============================================================================

apiVersion: secrets-tools/v1
project:
  slug: k8-infra

# =============================================================================
# Reusable templates
# =============================================================================
templates:
  smtp: &smtp
    SMTP_HOST: { dc: secrets smtp.host, override: SMTP_HOST }
    SMTP_PORT: { dc: secrets smtp.port, override: SMTP_PORT }
    SMTP_USER: { dc: secrets smtp.user, override: SMTP_USER }
    SMTP_FROM: { dc: secrets smtp.from, override: SMTP_FROM }

  smtp_tls: &smtp_tls
    <<: *smtp
    SMTP_USE_TLS: { dc: secrets smtp.use_tls, override: SMTP_USE_TLS }
    SMTP_USE_SSL: { dc: secrets smtp.use_ssl, override: SMTP_USE_SSL }

  ops_registry: &ops_registry
    OPS_REGISTRY_USER: { dc: secrets registry.ops_user, override: OPS_REGISTRY_USER }
    OPS_REGISTRY_PASSWORD: { dc: secrets registry.ops_password, override: OPS_REGISTRY_PASSWORD }

  ghcr_registry: &ghcr_registry
    GHCR_USER: { dc: secrets ghcr.user, override: GHCR_USER, default: the-robot-lives }
    GHCR_TOKEN: { dc: secrets ghcr.token, override: GHCR_TOKEN }

  npm_verdaccio: &npm_verdaccio
    NPM_TOKEN: { dc: secrets npm.verdaccio_token, override: NPM_TOKEN }

# =============================================================================
# Groups — maps legacy ALL_SECTIONS / run_section dispatch
# =============================================================================
groups:
  shared-tls: [shared-tls]
  data-postgres: [data-postgres]
  data-mysql: [data-mysql]
  data-redis: [data-redis]
  data-valkey: [data-valkey]
  data-clickhouse: [data-clickhouse]
  platform-registry: [platform-registry]
  platform-minio: [platform-minio]
  platform-verdaccio: [platform-verdaccio]
  platform-authentik: [platform-authentik]
  mermaid-auth: [platform-authentik, mermaid]
  start-app-auth: [platform-authentik, start-app]
  platform-keygen: [platform-keygen]
  analytics: [analytics]
  content: [content]
  crm: [crm]
  devtools: [devtools]
  marketing: [marketing]
  seo: [seo]
  observability: [signoz, phoenix, posthog]
  creative: [penpot, webstudio, excalidraw, drawio, mermaid]
  apps: [docmost, taiga, plane, nextcloud, ghost, matomo, mautic, espocrm, seonaut, listmonk, postiz, bottlecrm, growthbook, label-studio, serpbear, hakatime, code-server, n8n, codefresh, derobotis, start-app, chatterbox-tts, kitten-tts, livecodes, portal, coming-soon]
  ai: [open-webui, vllm, langfuse, livebook, jupyterhub, weaviate, qdrant]
  mail: [mailu]
  infisical: [infisical]
  incubator-apps: [apps-tls-codefresh, apps-tls-derobotis, apps-tls-aifighter, apps-tls-gottacc, apps-tls-iotgo, apps-tls-jailbreakingsite, apps-tls-noizuink, apps-tls-noizurpg, apps-tls-robotsunite, apps-tls-therobotlives, apps-tls-therobotknows, apps-tls-therobotmakes, apps-tls-therobotsrise, apps-tls-therobotstates, apps-tls-artificialbeingsanonymous, apps-tls-bewarethetobor, apps-tls-therobotbond, apps-tls-therobotcodes, apps-tls-therobotcourses, apps-tls-therobotinstitute, apps-tls-therobotlive, apps-tls-therobotstudy, apps-tls-therobotsupport, apps-tls-therobotventures, apps-tls-therobotwork, apps-tls-therobotedoesitall, apps-tls-therobotlearns, apps-tls-therobotplans, apps-tls-tobornalp, apps-tls-toborhelp, apps-tls-toborlocker, apps-tls-toborwiki, apps-infra]

# =============================================================================
# Sections
# =============================================================================
sections:

  # ===========================================================================
  # populate_shared_tls — /shared/tls
  # Cloudflare wildcard TLS certificate (*.noizu.com), synced to all namespaces
  # ===========================================================================
  - id: shared-tls
    title: "Shared TLS (*.noizu.com)"
    path: /shared/tls
    secrets:
      TLS_CRT:
        file: .secrets/tls/noizu.com/cert.pem
        override: TLS_CRT
        decode: base64
      TLS_KEY:
        file: .secrets/tls/noizu.com/key.pem
        override: TLS_KEY
        decode: base64
      CLOUDFLARE_CA_CRT:
        file: .secrets/tls/cloudflare/origin-pull-ca.pem
        override: CLOUDFLARE_CA_CRT
        decode: base64

  # ===========================================================================
  # populate_data_postgres — /data/postgres
  # Shared PostgreSQL superuser + ALL per-app DB user/password pairs
  # ===========================================================================
  - id: data-postgres
    title: "Shared PostgreSQL"
    path: /data/postgres
    secrets:
      # --- Superuser ---
      POSTGRES_PASSWORD:
        dc: auto pg_superuser_password
        override: PG_SUPERUSER_PASSWORD
        auto: password 32
      # --- Penpot ---
      PENPOT_DB_USER:
        dc: services design.penpot_db_user
        override: PENPOT_DB_USER
        default: penpot
      PENPOT_DB_PASSWORD:
        dc: services design.penpot_db_password
        override: PENPOT_DB_PASSWORD
        auto: password 32
      # --- Webstudio ---
      WEBSTUDIO_DB_USER:
        dc: services design.webstudio_db_user
        override: WEBSTUDIO_DB_USER
        default: webstudio
      WEBSTUDIO_DB_PASSWORD:
        dc: services design.webstudio_db_password
        override: WEBSTUDIO_DB_PASSWORD
        auto: password 32
      # --- N8N ---
      N8N_DB_USER:
        dc: services design.n8n_db_user
        override: N8N_DB_USER
        default: n8n
      N8N_DB_PASSWORD:
        dc: services design.n8n_db_password
        override: N8N_DB_PASSWORD
        auto: password 32
      # --- Ghost (Postgres) ---
      GHOST_DB_USER:
        dc: auto ghost_pg_db_user
        override: GHOST_PG_DB_USER
        default: ghost
      GHOST_DB_PASSWORD:
        dc: auto ghost_pg_db_password
        override: GHOST_PG_DB_PASSWORD
        auto: password 32
      # --- Langfuse ---
      LANGFUSE_DB_USER:
        dc: services design.langfuse_db_user
        override: LANGFUSE_DB_USER
        default: langfuse
      LANGFUSE_DB_PASSWORD:
        dc: services design.langfuse_db_password
        override: LANGFUSE_DB_PASSWORD
        auto: password 32
      # --- Postiz ---
      POSTIZ_DB_USER:
        dc: services design.postiz_db_user
        override: POSTIZ_DB_USER
        default: postiz
      POSTIZ_DB_PASSWORD:
        dc: services design.postiz_db_password
        override: POSTIZ_DB_PASSWORD
        auto: password 32
      # --- BottleCRM ---
      BOTTLECRM_DB_USER:
        dc: auto bottlecrm_db_user
        override: BOTTLECRM_DB_USER
        default: bottlecrm
      BOTTLECRM_DB_PASSWORD:
        dc: services svc.bottlecrm_db_password
        override: BOTTLECRM_DB_PASSWORD
        auto: password 32
      # --- Listmonk ---
      LISTMONK_DB_USER:
        dc: auto listmonk_db_user
        override: LISTMONK_DB_USER
        default: listmonk
      LISTMONK_DB_PASSWORD:
        dc: services svc.listmonk_db_password
        override: LISTMONK_DB_PASSWORD
        auto: password 32
      # --- Docmost ---
      DOCMOST_DB_USER:
        dc: auto docmost_db_user
        override: DOCMOST_DB_USER
        default: docmost
      DOCMOST_DB_PASSWORD:
        dc: auto docmost_db_password
        override: DOCMOST_DB_PASSWORD
        auto: password 32
      # --- Taiga ---
      TAIGA_DB_USER:
        dc: auto taiga_db_user
        override: TAIGA_DB_USER
        default: taiga
      TAIGA_DB_PASSWORD:
        dc: auto taiga_db_password
        override: TAIGA_DB_PASSWORD
        auto: password 32
      # --- Nextcloud ---
      NEXTCLOUD_DB_USER:
        dc: auto nextcloud_db_user
        override: NEXTCLOUD_DB_USER
        default: nextcloud
      NEXTCLOUD_DB_PASSWORD:
        dc: auto nextcloud_db_password
        override: NEXTCLOUD_DB_PASSWORD
        auto: password 32
      # --- Plane ---
      PLANE_DB_USER:
        dc: auto plane_db_user
        override: PLANE_DB_USER
        default: plane
      PLANE_DB_PASSWORD:
        dc: auto plane_db_password
        override: PLANE_DB_PASSWORD
        auto: password 32
      # --- Phoenix ---
      PHOENIX_DB_USER:
        dc: auto phoenix_db_user
        override: PHOENIX_DB_USER
        default: phoenix
      PHOENIX_DB_PASSWORD:
        dc: auto phoenix_db_password
        override: PHOENIX_DB_PASSWORD
        auto: password 32
      # --- PostHog ---
      POSTHOG_DB_USER:
        dc: auto posthog_db_user
        override: POSTHOG_DB_USER
        default: posthog
      POSTHOG_DB_PASSWORD:
        dc: auto posthog_db_password
        override: POSTHOG_DB_PASSWORD
        auto: password 32
      # --- Keygen ---
      KEYGEN_DB_USER:
        dc: platform keygen.db_user
        override: KEYGEN_DB_USER
        default: keygen
      KEYGEN_DB_PASSWORD:
        dc: platform keygen.db_password
        override: KEYGEN_DB_PASSWORD
        auto: password 32
      # --- Mermaid ---
      MERMAID_DB_USER:
        dc: services design.mermaid_db_user
        override: MERMAID_DB_USER
        default: mermaid
      MERMAID_DB_PASSWORD:
        dc: services design.mermaid_db_password
        override: MERMAID_DB_PASSWORD
        auto: password 32
      # --- Codefresh ---
      CODEFRESH_DB_USER:
        dc: services apps.codefresh_db_user
        override: CODEFRESH_DB_USER
        default: codefresh
      CODEFRESH_DB_PASSWORD:
        dc: services apps.codefresh_db_password
        override: CODEFRESH_DB_PASSWORD
        auto: password 32
      # --- Startapp ---
      START_APP_DB_USER:
        dc: services apps.startapp_db_user
        override: START_APP_DB_USER
        default: startapp
      START_APP_DB_PASSWORD:
        dc: services apps.startapp_db_password
        override: START_APP_DB_PASSWORD
        auto: password 32

  # ===========================================================================
  # populate_data_mysql — /data/mysql
  # Shared MySQL root password + per-app passwords
  # ===========================================================================
  - id: data-mysql
    title: "Shared MySQL"
    path: /data/mysql
    secrets:
      MYSQL_ROOT_PASSWORD:
        dc: services svc.services_mysql_root_password
        override: SERVICES_MYSQL_ROOT_PASSWORD
        auto: password 32
      GHOST_DB_PASSWORD:
        dc: auto ghost_mysql_db_password
        override: GHOST_MYSQL_DB_PASSWORD
        auto: password 32
      MATOMO_DB_PASSWORD:
        dc: services svc.matomo_db_password
        override: MATOMO_DB_PASSWORD
        auto: password 32
      MAUTIC_DB_PASSWORD:
        dc: services svc.mautic_db_password
        override: MAUTIC_DB_PASSWORD
        auto: password 32
      ESPOCRM_DB_PASSWORD:
        dc: services svc.espocrm_db_password
        override: ESPOCRM_DB_PASSWORD
        auto: password 32
      SEONAUT_DB_PASSWORD:
        dc: services svc.seonaut_db_password
        override: SEONAUT_DB_PASSWORD
        auto: password 32

  # ===========================================================================
  # populate_data_redis — /data/redis
  # ===========================================================================
  - id: data-redis
    title: "Shared Redis"
    path: /data/redis
    secrets:
      REDIS_PASSWORD:
        dc: services apps.redis_password
        override: APPS_REDIS_PASSWORD
        auto: password 32

  # ===========================================================================
  # populate_data_valkey — /data/valkey
  # ===========================================================================
  - id: data-valkey
    title: "Shared Valkey"
    path: /data/valkey
    secrets:
      VALKEY_PASSWORD:
        dc: auto valkey_password
        override: VALKEY_PASSWORD
        auto: password 32

  # ===========================================================================
  # populate_data_clickhouse — /data/clickhouse
  # ===========================================================================
  - id: data-clickhouse
    title: "ClickHouse"
    path: /data/clickhouse
    secrets:
      SIGNOZ_TOKENIZER_JWT_SECRET:
        dc: services telemetry.signoz_tokenizer_jwt_secret
        override: SIGNOZ_TOKENIZER_JWT_SECRET
        auto: hex 32

  # ===========================================================================
  # populate_platform_valkey — /platform/valkey
  # Consumed by platform/init -> modules/valkey (platform-valkey-secrets).
  # ===========================================================================
  - id: platform-valkey
    title: "Platform Valkey (shared)"
    path: /platform/valkey
    secrets:
      VALKEY_PASSWORD:
        dc: auto platform_valkey_password
        override: PLATFORM_VALKEY_PASSWORD
        auto: password 32

  # ===========================================================================
  # populate_platform_mongodb — /platform/mongodb
  # Consumed by platform/init -> modules/mongodb (platform-mongodb-secrets).
  # Per-app user keys must exist (module injects them as required env refs);
  # initdb create_db is a no-op when a user value is empty. Apps: growthbook.
  # ===========================================================================
  - id: platform-mongodb
    title: "Platform MongoDB (shared)"
    path: /platform/mongodb
    secrets:
      MONGO_ROOT_USERNAME: { override: MONGO_ROOT_USERNAME, default: root }
      MONGO_ROOT_PASSWORD:
        dc: auto platform_mongodb_root_password
        override: PLATFORM_MONGODB_ROOT_PASSWORD
        auto: password 32
      GROWTHBOOK_DB_USER: { override: GROWTHBOOK_DB_USER, default: growthbook }
      GROWTHBOOK_DB_PASSWORD:
        dc: auto growthbook_mongodb_db_password
        override: GROWTHBOOK_DB_PASSWORD
        auto: password 32

  # ===========================================================================
  # populate_platform_mariadb — /platform/mariadb
  # Consumed by platform/init -> modules/mariadb (platform-mariadb-secrets).
  # Root + per-app user/password keys for the initdb.d apps (module injects all
  # <APP>_DB_USER/<APP>_DB_PASSWORD as required env refs). Passwords/root mirror
  # the shared /data/mysql dc sources so values stay consistent across paths.
  # ===========================================================================
  - id: platform-mariadb
    title: "Platform MariaDB (shared)"
    path: /platform/mariadb
    secrets:
      MARIADB_ROOT_PASSWORD:
        dc: services svc.services_mysql_root_password
        override: SERVICES_MYSQL_ROOT_PASSWORD
        auto: password 32
      ESPOCRM_DB_USER: { override: ESPOCRM_DB_USER, default: espocrm }
      ESPOCRM_DB_PASSWORD:
        dc: services svc.espocrm_db_password
        override: ESPOCRM_DB_PASSWORD
        auto: password 32
      GHOST_DB_USER: { override: GHOST_DB_USER, default: ghost }
      GHOST_DB_PASSWORD:
        dc: auto ghost_mysql_db_password
        override: GHOST_MYSQL_DB_PASSWORD
        auto: password 32
      MATOMO_DB_USER: { override: MATOMO_DB_USER, default: matomo }
      MATOMO_DB_PASSWORD:
        dc: services svc.matomo_db_password
        override: MATOMO_DB_PASSWORD
        auto: password 32
      MAUTIC_DB_USER: { override: MAUTIC_DB_USER, default: mautic }
      MAUTIC_DB_PASSWORD:
        dc: services svc.mautic_db_password
        override: MAUTIC_DB_PASSWORD
        auto: password 32
      SEONAUT_DB_USER: { override: SEONAUT_DB_USER, default: seonaut }
      SEONAUT_DB_PASSWORD:
        dc: services svc.seonaut_db_password
        override: SEONAUT_DB_PASSWORD
        auto: password 32

  # ===========================================================================
  # populate_platform_postgres — /platform/postgres
  # Consumed by platform/init -> modules/timescaledb (platform-timescaledb-secrets).
  # Root + per-app role/password keys for the initdb.d apps (module injects all
  # <APP>_DB_USER/<APP>_DB_PASSWORD as required env refs).
  # Apps: bottlecrm, docmost, listmonk, mermaid, nextcloud, penpot, webstudio.
  # ===========================================================================
  - id: platform-postgres
    title: "Platform PostgreSQL/TimescaleDB (shared)"
    path: /platform/postgres
    secrets:
      POSTGRES_USER: { override: PLATFORM_POSTGRES_USER, default: postgres }
      POSTGRES_PASSWORD:
        dc: auto platform_postgres_password
        override: PLATFORM_POSTGRES_PASSWORD
        auto: password 32
      BOTTLECRM_DB_USER: { override: BOTTLECRM_DB_USER, default: bottlecrm }
      BOTTLECRM_DB_PASSWORD:
        dc: auto bottlecrm_pg_db_password
        override: BOTTLECRM_DB_PASSWORD
        auto: password 32
      DOCMOST_DB_USER: { override: DOCMOST_DB_USER, default: docmost }
      DOCMOST_DB_PASSWORD:
        dc: auto docmost_pg_db_password
        override: DOCMOST_DB_PASSWORD
        auto: password 32
      LISTMONK_DB_USER: { override: LISTMONK_DB_USER, default: listmonk }
      LISTMONK_DB_PASSWORD:
        dc: auto listmonk_pg_db_password
        override: LISTMONK_DB_PASSWORD
        auto: password 32
      MERMAID_DB_USER: { override: MERMAID_DB_USER, default: mermaid }
      MERMAID_DB_PASSWORD:
        dc: auto mermaid_pg_db_password
        override: MERMAID_DB_PASSWORD
        auto: password 32
      NEXTCLOUD_DB_USER: { override: NEXTCLOUD_DB_USER, default: nextcloud }
      NEXTCLOUD_DB_PASSWORD:
        dc: auto nextcloud_pg_db_password
        override: NEXTCLOUD_DB_PASSWORD
        auto: password 32
      PENPOT_DB_USER: { override: PENPOT_DB_USER, default: penpot }
      PENPOT_DB_PASSWORD:
        dc: services design.penpot_db_password
        override: PENPOT_DB_PASSWORD
        auto: password 32
      WEBSTUDIO_DB_USER: { override: WEBSTUDIO_DB_USER, default: webstudio }
      WEBSTUDIO_DB_PASSWORD:
        dc: services design.webstudio_db_password
        override: WEBSTUDIO_DB_PASSWORD
        auto: password 32

  # ===========================================================================
  # populate_accounting — /accounting
  # Consumed by platform/accounting (ERPNext + Kimai), managed Secret
  # accounting-app-secrets (includeAllSecrets + KIMAI_DATABASE_URL template).
  # ===========================================================================
  - id: accounting
    title: "Accounting (ERPNext + Kimai)"
    path: /accounting
    secrets:
      <<: *smtp
      MARIADB_ROOT_PASSWORD:
        dc: auto accounting_erpnext_mariadb_root_password
        override: ACCOUNTING_ERPNEXT_MARIADB_ROOT_PASSWORD
        auto: password 32
      ERPNEXT_ADMIN_PASSWORD:
        dc: auto accounting_erpnext_admin_password
        override: ERPNEXT_ADMIN_PASSWORD
        auto: password 24
      KIMAI_MARIADB_ROOT_PASSWORD:
        dc: auto accounting_kimai_mariadb_root_password
        override: KIMAI_MARIADB_ROOT_PASSWORD
        auto: password 32
      KIMAI_DATABASE_PASSWORD:
        dc: auto accounting_kimai_database_password
        override: KIMAI_DATABASE_PASSWORD
        auto: password 32
      KIMAI_ADMIN_EMAIL: { override: KIMAI_ADMIN_EMAIL, default: admin@noizu.com }
      KIMAI_ADMIN_PASSWORD:
        dc: auto accounting_kimai_admin_password
        override: KIMAI_ADMIN_PASSWORD
        auto: password 24
      KIMAI_APP_SECRET:
        dc: auto accounting_kimai_app_secret
        override: KIMAI_APP_SECRET
        auto: hex 32

  # ===========================================================================
  # populate_analytics — /analytics
  # Consumed by platform/analytics (Matomo + GrowthBook), managed Secret
  # analytics-app-secrets (includeAllSecrets).
  # ===========================================================================
  - id: analytics
    title: "Analytics (Matomo + GrowthBook)"
    path: /analytics
    secrets:
      MATOMO_DB_PASSWORD:
        dc: services svc.matomo_db_password
        override: MATOMO_DB_PASSWORD
        auto: password 32
      GROWTHBOOK_JWT_SECRET:
        dc: services svc.growthbook_jwt_secret
        override: GROWTHBOOK_JWT_SECRET
        auto: hex 32
      GROWTHBOOK_MONGODB_URI:
        dc: services svc.growthbook_mongodb_uri
        override: GROWTHBOOK_MONGODB_URI
        default: "mongodb://shared-mongodb.data-ns.svc.cluster.local:27017/growthbook"
      GROWTHBOOK_ENCRYPTION_KEY:
        dc: services svc.growthbook_encryption_key
        override: GROWTHBOOK_ENCRYPTION_KEY
        auto: hex 32

  # ===========================================================================
  # populate_content — /content
  # Consumed by platform/content (Docmost + Ghost + Nextcloud), managed Secret
  # content-app-secrets (includeAllSecrets).
  # ===========================================================================
  - id: content
    title: "Content (Docmost + Ghost + Nextcloud)"
    path: /content
    vars:
      _docmost_db_user:
        dc: auto docmost_db_user
        override: DOCMOST_DB_USER
        default: docmost
      _docmost_db_pass:
        dc: auto docmost_db_password
        override: DOCMOST_DB_PASSWORD
        auto: password 32
      _apps_redis:
        dc: services apps.redis_password
        override: APPS_REDIS_PASSWORD
        optional: true
      _nextcloud_db_user:
        dc: auto nextcloud_db_user
        override: NEXTCLOUD_DB_USER
        default: nextcloud
      _nextcloud_db_pass:
        dc: auto nextcloud_db_password
        override: NEXTCLOUD_DB_PASSWORD
        auto: password 32
    secrets:
      <<: *smtp
      DOCMOST_JWT_SECRET:
        dc: services bob.docmost_jwt_secret
        override: DOCMOST_JWT_SECRET
        auto: hex 32
      DOCMOST_DB_USER:
        ref: _docmost_db_user
      DOCMOST_DB_PASSWORD:
        ref: _docmost_db_pass
      DOCMOST_DATABASE_URL:
        template: "postgresql://{{_docmost_db_user}}:{{_docmost_db_pass|urlencode}}@shared-postgres.data-ns.svc.cluster.local:5432/docmost"
      DOCMOST_REDIS_URL:
        template: "redis://:{{_apps_redis|urlencode}}@shared-redis.data-ns.svc.cluster.local:6379"
      SMTP_PASSWORD:
        dc: secrets sendgrid.docmost
      GHOST_DB_PASSWORD:
        dc: auto ghost_mysql_db_password
        override: GHOST_MYSQL_DB_PASSWORD
        auto: password 32
      NEXTCLOUD_ADMIN_USER:
        dc: services bob.nextcloud_admin_user
        override: NEXTCLOUD_ADMIN_USER
        default: admin
      NEXTCLOUD_ADMIN_PASSWORD:
        dc: services bob.nextcloud_admin_password
        override: NEXTCLOUD_ADMIN_PASSWORD
        auto: password 24
      NEXTCLOUD_DB_USER:
        ref: _nextcloud_db_user
      NEXTCLOUD_DB_PASSWORD:
        ref: _nextcloud_db_pass
      POSTGRES_USER:
        ref: _nextcloud_db_user
      POSTGRES_PASSWORD:
        ref: _nextcloud_db_pass
      REDIS_PASSWORD:
        dc: services apps.redis_password
        override: REDIS_PASSWORD
        optional: true

  # ===========================================================================
  # populate_crm — /crm
  # Consumed by platform/crm (EspoCRM + BottleCRM), managed Secret
  # crm-app-secrets (includeAllSecrets).
  # ===========================================================================
  - id: crm
    title: "CRM (EspoCRM + BottleCRM)"
    path: /crm
    secrets:
      ESPOCRM_DB_PASSWORD:
        dc: services svc.espocrm_db_password
        override: ESPOCRM_DB_PASSWORD
        auto: password 32
      ESPOCRM_ADMIN_USERNAME:
        dc: services svc.espocrm_admin_username
        override: ESPOCRM_ADMIN_USERNAME
        optional: true
      ESPOCRM_ADMIN_PASSWORD:
        dc: services svc.espocrm_admin_password
        override: ESPOCRM_ADMIN_PASSWORD
        optional: true
      BOTTLECRM_DB_USER:
        dc: auto bottlecrm_db_user
        override: BOTTLECRM_DB_USER
        default: bottlecrm
      BOTTLECRM_DB_PASSWORD:
        dc: services svc.bottlecrm_db_password
        override: BOTTLECRM_DB_PASSWORD
        auto: password 32
      BOTTLECRM_SECRET_KEY:
        dc: services svc.bottlecrm_secret_key
        override: BOTTLECRM_SECRET_KEY
        auto: hex 32
      BOTTLECRM_GOOGLE_CLIENT_ID:
        dc: services svc.bottlecrm_google_client_id
        override: BOTTLECRM_GOOGLE_CLIENT_ID
        optional: true
      BOTTLECRM_GOOGLE_CLIENT_SECRET:
        dc: services svc.bottlecrm_google_client_secret
        override: BOTTLECRM_GOOGLE_CLIENT_SECRET
        optional: true
      BOTTLECRM_EMAIL_PASSWORD:

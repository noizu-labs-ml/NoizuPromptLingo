databaseChangeLog:
  - changeSet:
      id: create-table-organizations
      author: starter-scaffold
      changes:
        - sql:
            sql: |
              CREATE TABLE organizations (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                slug citext NOT NULL UNIQUE,
                name varchar(255) NOT NULL,
                settings jsonb DEFAULT '{}',
                inserted_at timestamptz NOT NULL,
                updated_at timestamptz NOT NULL
              );
      rollback:
        - dropTable:
            tableName: organizations

  - changeSet:
      id: create-table-memberships
      author: starter-scaffold
      changes:
        - createTable:
            tableName: memberships
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
              - column:
                  name: organization_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_memberships_organization
                    references: organizations(id)
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_memberships_user
                    references: users(id)
              - column:
                  name: role
                  type: varchar(50)
                  defaultValue: viewer
                  constraints:
                    nullable: false
              - column:
                  name: inserted_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: memberships

  - changeSet:
      id: create-index-memberships-org-user-unique
      author: starter-scaffold
      changes:
        - addUniqueConstraint:
            constraintName: uq_memberships_org_user
            tableName: memberships
            columnNames: organization_id, user_id
      rollback:
        - dropUniqueConstraint:
            constraintName: uq_memberships_org_user
            tableName: memberships

databaseChangeLog:
  - changeSet:
      id: 011-create-webhooks
      author: starter
      changes:
        - createTable:
            tableName: webhooks
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: organization_id
                  type: uuid
                  constraints:
                    nullable: true
                    foreignKeyName: fk_webhooks_organization
                    references: organizations(id)
              - column:
                  name: url
                  type: varchar(2048)
                  constraints:
                    nullable: false
              - column:
                  name: secret
                  type: varchar(255)
              - column:
                  name: events
                  type: text[]
                  defaultValue: "{}"
              - column:
                  name: active
                  type: boolean
                  defaultValueBoolean: true
              - column:
                  name: inserted_at
                  type: timestamp with time zone
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
        - createIndex:
            tableName: webhooks
            indexName: idx_webhooks_org_active
            columns:
              - column:
                  name: organization_id
              - column:
                  name: active

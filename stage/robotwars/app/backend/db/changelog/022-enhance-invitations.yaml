databaseChangeLog:
  - changeSet:
      id: 022-add-invitation-status-columns
      author: starter-scaffold
      changes:
        - sql:
            sql: |
              ALTER TABLE invite_tokens
                ADD COLUMN status varchar(20) NOT NULL DEFAULT 'pending',
                ADD COLUMN accepted_by uuid REFERENCES users(id) ON DELETE SET NULL,
                ADD COLUMN accepted_at timestamptz;

              -- Backfill status from existing data
              UPDATE invite_tokens SET status = CASE
                WHEN revoked THEN 'revoked'
                WHEN expires_at < NOW() THEN 'expired'
                ELSE 'pending'
              END;
      rollback:
        - sql:
            sql: |
              ALTER TABLE invite_tokens
                DROP COLUMN IF EXISTS status,
                DROP COLUMN IF EXISTS accepted_by,
                DROP COLUMN IF EXISTS accepted_at;

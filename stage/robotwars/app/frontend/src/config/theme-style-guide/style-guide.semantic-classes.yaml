# ═══════════════════════════════════════════════════════════════
# SEMANTIC CLASSES — style-guide.semantic-classes.yaml
# ═══════════════════════════════════════════════════════════════
#
# Defines named semantic state classes (danger, warning, success,
# info, primary, brand) with their accent, background, and text
# color values.
#
# HOW IT WORKS:
#   - Each entry generates a .{class} CSS rule with scoped
#     --{class}-accent, --{class}-background, --{class}-color vars
#   - The engine also generates card, badge, and alert variants
#     using these accent values automatically
#   - `accent-style` controls border rendering (solid, dashed, etc.)
#
# HOW TO MODIFY:
#   - Change colors: edit the `vars` values under each class
#   - Add a class: append a `- name:` entry with class, title,
#     description, accent-style, and vars (accent, background, color)
#   - Run `npm run regen` after changes
#
# RELATED: style-guide.semantic-groups.yaml (viewer grouping labels)
#          style-guide.vars.yaml (base color tokens referenced here)
# ═══════════════════════════════════════════════════════════════

semantic-classes:
  - name: danger
    class: danger
    title: "Danger"
    description: "Destructive actions, error states, irreversible operations"
    accent-style: solid
    vars:
      - name: accent
        value: "#e20613"
      - name: background
        value: "rgba(226,6,19,0.06)"
      - name: color
        value: "#c41a1a"

  - name: warning
    class: warning
    title: "Warning"
    description: "Caution states, attention required, recoverable issues"
    accent-style: solid
    vars:
      - name: accent
        value: "#c27a00"
      - name: background
        value: "rgba(194,122,0,0.06)"
      - name: color
        value: "#c27a00"

  - name: success
    class: success
    title: "Success"
    description: "Positive outcomes, confirmed states, completed operations"
    accent-style: solid
    vars:
      - name: accent
        value: "#1a8a3f"
      - name: background
        value: "rgba(26,138,63,0.06)"
      - name: color
        value: "#1a8a3f"

  - name: info
    class: info
    title: "Info"
    description: "Informational states, guidance, system messages"
    accent-style: solid
    vars:
      - name: accent
        value: "#0047ab"
      - name: background
        value: "rgba(0,71,171,0.06)"
      - name: color
        value: "#0047ab"

  - name: primary
    class: primary
    title: "Primary / Black"
    description: "Primary actions, maximum-weight emphasis, structural elements"
    accent-style: solid
    vars:
      - name: accent
        value: "#000000"
      - name: background
        value: "rgba(0,0,0,0.04)"
      - name: color
        value: "#000000"

  - name: brand
    class: brand
    title: "Brand / Red"
    description: "Primary accent — the brand color for CTAs, key actions, and brand moments"
    accent-style: solid
    vars:
      - name: accent
        value: "#e20613"
      - name: background
        value: "rgba(226,6,19,0.06)"
      - name: color
        value: "#e20613"

semantic-classes:
  - name: danger
    class: danger
    group: States
    title: Danger
    description: Critical error states requiring immediate attention
    note: "Failures, destructive actions, error states"
    accent-style: bottom-bar
    vars:
      accent: "var(--error)"
      background: "var(--error-tint)"
      color: "var(--error)"
      font-weight: "var(--font-weight-bold)"
      text-transform: "uppercase"

  - name: warning
    class: warning
    group: States
    title: Warning
    description: Cautionary messages about potential issues
    note: "Cautions, pending states, attention required"
    accent-style: bottom-bar
    vars:
      accent: "var(--warning)"
      background: "var(--warning-tint)"
      color: "var(--warning)"
      font-weight: "var(--font-weight-semibold)"

  - name: info
    class: info
    group: States
    title: Information
    description: Helpful context and guidance
    note: "Guidance, links, informational states"
    accent-style: bottom-bar
    vars:
      accent: "var(--info)"
      background: "var(--info-tint)"
      color: "var(--info)"
      font-style: "italic"

  - name: success
    class: success
    group: States
    title: Success
    description: Confirmation of successful actions
    note: "Confirmations, published states, positive actions"
    accent-style: bottom-bar
    vars:
      accent: "var(--success)"
      background: "var(--success-tint)"
      color: "var(--success)"

  - name: aside
    class: aside
    group: Content
    title: Aside
    description: Supplementary information and notes
    note: "Supplementary context, editorial asides"
    accent-style: left-border
    vars:
      accent: "var(--teal)"
      background: "var(--teal-light)"
      color: "var(--teal)"

  - name: regal
    class: regal
    group: Content
    title: Regal
    description: Premium highlighted content
    note: "Premium content, editorial spotlights"
    accent-style: inner-shadow
    vars:
      accent: "var(--amber)"
      background: "var(--amber-light)"
      color: "var(--text)"
      font-family: "'Georgia', 'Times New Roman', serif"
      font-size: "1.25em"
      font-style: "italic"
      letter-spacing: "0.04em"

  - name: primary
    class: primary
    group: Actions
    title: Primary
    description: Main calls to action and most important content
    note: "CTAs, hero content, most important actions"
    accent-style: outer-shadow
    vars:
      accent: "var(--brand-blue)"
      background: "var(--brand-blue-light)"
      color: "var(--brand-blue)"

  - name: secondary
    class: secondary
    group: Actions
    title: Secondary
    description: Secondary actions and less prominent items
    note: "Supporting actions, secondary content"
    accent-style: none
    vars:
      accent: "var(--slate-400)"
      background: "var(--surface-alt)"
      color: "var(--text-secondary)"

  - name: neutral
    class: neutral
    group: Content
    title: Neutral
    description: General purpose content with no specific emphasis
    note: "Default content, no special emphasis"
    accent-style: bottom-bar
    vars:
      accent: "var(--sky)"
      background: "var(--sky-light)"
      color: "var(--sky)"

  - name: muted
    class: muted
    group: Content
    title: Muted
    description: De-emphasized subtle content
    note: "De-emphasized, background, low-priority content"
    accent-style: none
    vars:
      accent: "var(--slate-300)"
      background: "var(--surface-alt)"
      color: "var(--text-muted)"

  - name: brand
    class: brand
    group: Content
    title: Brand
    description: Company or product branded content
    note: "Brand identity, company, product marketing"
    accent-style: bottom-bar-glow
    vars:
      accent: "var(--brand-red)"
      background: "var(--brand-red-light)"
      color: "var(--brand-red)"

  - name: link
    class: link
    group: Actions
    title: Link
    description: Clickable navigational cards
    note: "Navigation, clickable cards, interactive elements"
    accent-style: outer-glow
    vars:
      accent: "var(--indigo)"
      background: "var(--indigo-light)"
      color: "var(--indigo)"

  - name: disabled
    class: disabled
    group: Workflow
    title: Disabled
    description: Inactive non-interactive states
    note: "Non-interactive, inactive, unavailable states"
    accent-style: none
    vars:
      accent: "var(--border-strong)"
      background: "var(--surface-alt)"
      color: "var(--text-muted)"

  - name: pending
    class: pending
    group: Workflow
    title: Pending
    description: Waiting or processing states
    note: "Processing, waiting, in-queue states"
    accent-style: bottom-bar
    vars:
      accent: "var(--orange)"
      background: "var(--orange-light)"
      color: "var(--orange)"

  - name: draft
    class: draft
    group: Workflow
    title: Draft
    description: Work-in-progress content
    note: "Work-in-progress, unfinished, under review"
    accent-style: left-dashed
    vars:
      accent: "var(--violet)"
      background: "var(--violet-light)"
      color: "var(--violet)"

  - name: published
    class: published
    group: Workflow
    title: Published
    description: Live completed content
    note: "Live, approved, completed content"
    accent-style: bottom-bar
    vars:
      accent: "var(--emerald)"
      background: "var(--emerald-light)"
      color: "var(--emerald)"
      border-radius: "var(--radius-md)"
      box-shadow: "0 var(--size-border-extra-heavy) var(--radius-md) color-mix(in srgb, var(--emerald) 25%, transparent), 0 var(--size-border-thin) var(--border-heavy) color-mix(in srgb, var(--emerald) 15%, transparent)"
      overflow: "hidden"

  - name: featured
    class: featured
    group: Workflow
    title: Featured
    description: Prominently displayed spotlight content
    note: "Spotlights, editorial picks, highlighted content"
    accent-style: inner-glow
    vars:
      accent: "var(--rose)"
      background: "var(--rose-light)"
      color: "var(--rose)"

  - name: new
    class: new
    group: Workflow
    title: New
    description: Recently added items
    note: "Recently added, fresh, just launched"
    accent-style: bottom-bar-glow
    vars:
      accent: "var(--cyan)"
      background: "var(--cyan-light)"
      color: "var(--cyan)"

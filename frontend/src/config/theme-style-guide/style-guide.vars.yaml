vars:
  groups:
    - name: "Seed Colors"
      vars:
        white: "#f7f9fb"    # cool light-mode canvas
        black: "#09090b"    # nocturne void
        red: "#b91c1c"      # light-mode danger signal
        blue: "#0e7490"     # accessible light-mode cyan signal
        yellow: "#a16207"   # light-mode warning only
    - name: "Semantic Colors"
      vars:
        success: "#15803d"
        warning: "#a16207"
        error: "#b91c1c"
        info: "#0e7490"
    - name: "Typography"
      vars:
        font-sans: "'Instrument Sans', Inter, system-ui, -apple-system, sans-serif"
        font-mono: "'IBM Plex Mono', 'Menlo', monospace"
        font-size-base: "16px"
    - name: "Shape"
      vars:
        radius: "8px"

vars:
  groups:
    - name: "Seed Colors"
      vars:
        white: "#fbf8f1"    # warm paper
        black: "#1c1917"    # warm near-black ink
        red: "#9a2c3f"      # primary accent — claret
        blue: "#1d4e5f"     # secondary accent — deep petrol
        yellow: "#b45309"   # tertiary accent — burnt ochre
    - name: "Semantic Colors"
      vars:
        success: "#3f6212"
        warning: "#b45309"
        error: "#9a2c3f"
        info: "#1d4e5f"
    - name: "Typography"
      vars:
        font-sans: "'Source Serif 4', 'Iowan Old Style', Georgia, serif"
        font-mono: "'IBM Plex Mono', 'Menlo', monospace"
    - name: "Shape"
      vars:
        radius: "2px"

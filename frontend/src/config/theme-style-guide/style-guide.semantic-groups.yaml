# ═══════════════════════════════════════════════════════════════
# SEMANTIC GROUPS — style-guide.semantic-groups.yaml
# ═══════════════════════════════════════════════════════════════
#
# Category labels for grouping semantic classes in the viewer.
#
# HOW IT WORKS:
#   - Each entry defines a group name and description
#   - The viewer uses these to organize the semantic class cards
#     from style-guide.semantic-classes.yaml into labeled sections
#
# HOW TO MODIFY:
#   - Add a `- name:` entry with a description
#   - Group names are display-only — no CSS generated
#
# RELATED: style-guide.semantic-classes.yaml (the classes themselves)
# ═══════════════════════════════════════════════════════════════

semantic-groups:
  - name: "States"
    description: "Functional state colors — success, warning, danger, info."
  - name: "Brand"
    description: "Primary accent colors — the structural colors of the system."

# ═══════════════════════════════════════════════════════════════
# SCOPED VARIABLES — style-guide.scoped-vars.yaml
# ═══════════════════════════════════════════════════════════════
#
# Defines CSS custom properties scoped to specific selectors, with
# per-mode (light/dark) values and layout container presets.
#
# HOW IT WORKS:
#   - `sections` declares named scopes (standard, dark, layout), each
#     with a CSS selector and variable prefix
#   - `vars[]` entries produce --{prefix}-{name} properties under
#     their respective selectors
#   - Vars with `selector` + `selector-body` also emit a CSS rule
#     applying the property to that selector (e.g. .content max-width)
#   - Multi-section vars generate overrides per mode (light → standard,
#     dark → dark selector)
#
# HOW TO MODIFY:
#   - Add a scoped var: append a `- name:` entry to the `vars` list
#   - Add a layout preset: add a `- name:` entry with section: layout,
#     a `selector`, and a `selector-body` string
#   - The `values:` map under a section expands to multiple prefixed vars
#     (e.g. `max-width: "1200px"` → --layout-{name}-max-width: 1200px)
#   - Run `npm run regen` after changes
#
# RELATED: style-guide.color-modes.yaml (simpler light/dark definitions)
#          style-guide.vars.yaml (global tokens these reference)
#          style-guide.page-layouts.yaml (layout presets for the viewer)
# ═══════════════════════════════════════════════════════════════

scoped-vars:
  prefix: "theme"

  sections:
    standard:
      selector: 'html[data-design-theme="style-guide"]'
      prefix: "theme"
    dark:
      selector: 'html[data-design-theme="style-guide"].dark'
      prefix: "theme"
    layout:
      selector: 'html[data-design-theme="style-guide"]'
      prefix: "layout"

  vars:
    - name: content-container-type
      value: "inline-size"
      selector: ".content"
      selector-body: "container-type: var(--theme-content-container-type)"

    - name: content-position
      value:
        - section: standard
          value: "relative"
      selector: ".content"
      selector-body: "position: var(--theme-content-position)"

    - name: surface
      value:
        - section: standard
          value: "var(--white)"
        - section: dark
          value: "#1a1a1a"

    - name: surface-alt
      value:
        - section: standard
          value: "var(--gray-50)"
        - section: dark
          value: "#252525"

    - name: surface-inverse
      value:
        - section: standard
          value: "var(--black)"
        - section: dark
          value: "var(--gray-200)"

    - name: text
      value:
        - section: standard
          value: "var(--black)"
        - section: dark
          value: "#e8e8e8"

    - name: text-secondary
      value:
        - section: standard
          value: "var(--gray-700)"
        - section: dark
          value: "var(--gray-400)"

    - name: text-muted
      value:
        - section: standard
          value: "var(--gray-500)"
        - section: dark
          value: "var(--gray-500)"

    - name: text-inverse
      value:
        - section: standard
          value: "var(--white)"
        - section: dark
          value: "var(--gray-900)"

    - name: border
      value:
        - section: standard
          value: "var(--gray-200)"
        - section: dark
          value: "#333333"

    - name: border-strong
      value:
        - section: standard
          value: "var(--gray-300)"
        - section: dark
          value: "var(--gray-600)"

    - name: shadow-color
      value:
        - section: standard
          value: "rgba(0,0,0,0.08)"
        - section: dark
          value: "rgba(0,0,0,0.3)"

    - name: surface-accent
      value:
        - section: standard
          value: "var(--blue-light)"
        - section: dark
          value: "rgba(0,71,171,0.18)"

    - name: surface-warning
      value:
        - section: standard
          value: "var(--yellow-light)"
        - section: dark
          value: "rgba(245,197,24,0.15)"

    - name: surface-danger
      value:
        - section: standard
          value: "var(--red-light)"
        - section: dark
          value: "rgba(226,6,19,0.15)"

    - name: text-link
      value:
        - section: standard
          value: "var(--blue)"
        - section: dark
          value: "#7eb8ff"

    - name: border-accent
      value:
        - section: standard
          value: "var(--black)"
        - section: dark
          value: "#cccccc"

    - name: focus-ring
      value:
        - section: standard
          value: "rgba(0,71,171,0.3)"
        - section: dark
          value: "rgba(126,184,255,0.35)"

    - name: bg
      value:
        - section: standard
          value: "var(--white)"
        - section: dark
          value: "#1a1a1a"

    - name: card-border-color
      value:
        - section: standard
          value: "var(--black)"
        - section: dark
          value: "#444444"

    - name: card-bg
      value:
        - section: standard
          value: "var(--white)"
        - section: dark
          value: "#1e1e1e"

    - name: radius-none
      value:
        - section: standard
          value: "0"

    - name: radius-sm
      value:
        - section: standard
          value: "2px"

    - name: standard
      value:
        - section: layout
          values:
            max-width: "1200px"
            padding: "var(--space-6)"
            margin: "0 auto"
            content-bg: "transparent"
      selector: ".content"
      selector-body: "max-width: var(--layout-standard-max-width); padding: var(--layout-standard-padding); margin: var(--layout-standard-margin); background: var(--layout-standard-content-bg)"

    - name: wide
      value:
        - section: layout
          values:
            max-width: "1200px"
            padding: "var(--space-6)"
            margin: "0 auto"
            content-bg: "transparent"
      selector: ".content.wide"
      selector-body: "max-width: var(--layout-wide-max-width); padding: var(--layout-wide-padding); margin: var(--layout-wide-margin); background: var(--layout-wide-content-bg)"

    - name: full
      value:
        - section: layout
          values:
            max-width: "100%"
            padding: "var(--space-4)"
            margin: "0"
            content-bg: "transparent"
      selector: ".content.full"
      selector-body: "max-width: var(--layout-full-max-width); padding: var(--layout-full-padding); margin: var(--layout-full-margin); background: var(--layout-full-content-bg)"

    - name: narrow
      value:
        - section: layout
          values:
            max-width: "600px"
            padding: "var(--space-6)"
            margin: "0 auto"
            content-bg: "transparent"
      selector: ".content.narrow"
      selector-body: "max-width: var(--layout-narrow-max-width); padding: var(--layout-narrow-padding); margin: var(--layout-narrow-margin); background: var(--layout-narrow-content-bg)"

    - name: article
      value:
        - section: layout
          values:
            max-width: "720px"
            padding: "var(--space-6)"
            margin: "0 auto"
            content-bg: "transparent"
      selector: ".content.article"
      selector-body: "max-width: var(--layout-article-max-width); padding: var(--layout-article-padding); margin: var(--layout-article-margin); background: var(--layout-article-content-bg)"

# ═══════════════════════════════════════════════════════════════
# COLOR PALETTE — style-guide.color-palette.yaml
# ═══════════════════════════════════════════════════════════════
#
# Defines color groups displayed in the styleguide viewer's
# Color Palette section.
#
# HOW IT WORKS:
#   - Each group renders as a swatch row with name, value, and notes
#   - `value` should reference a --var from style-guide.vars.yaml
#   - `cssClass` maps to a .swatch-{class} CSS class for styling
#   - `notes` provide usage guidance shown below each swatch group
#
# HOW TO MODIFY:
#   - Add colors to an existing group or create a new `- group:` entry
#   - Actual color hex values live in style-guide.vars.yaml — this file
#     references them via var() so they stay in sync
#   - Run `npm run regen` after changes
#
# RELATED: style-guide.vars.yaml (Neutrals, Accent Primaries, Semantic groups)
#          style-guide.color-modes.yaml (dark/light surface overrides)
# ═══════════════════════════════════════════════════════════════

color-palette:
  - group: "Primaries"
    description: "Five colors. Three primaries, black, white. That's the system."
    colors:
      - name: Black
        value: "var(--black)"
        cssClass: black
      - name: White
        value: "var(--white)"
        cssClass: white
      - name: Red
        value: "var(--red)"
        cssClass: red
      - name: Blue
        value: "var(--blue)"
        cssClass: blue
      - name: Yellow
        value: "var(--yellow)"
        cssClass: yellow
    notes:
      - label: "Black"
        text: "Primary text, borders, structural elements. The default."
        cssClass: black
      - label: "White"
        text: "Backgrounds, card surfaces, negative space."
        cssClass: white
      - label: "Red"
        text: "Accent, CTAs, destructive actions, top borders on cards."
        cssClass: red
      - label: "Blue"
        text: "Links, info states, secondary accent, interactive elements."
        cssClass: blue
      - label: "Yellow"
        text: "Highlights, warnings, text selection, attention markers."
        cssClass: yellow

  - group: "Neutral Scale"
    description: "Pure achromatic scale. The structural ground on which all color sits."
    colors:
      - name: White
        value: "var(--white)"
        cssClass: white
      - name: Off-white
        value: "var(--off-white)"
        cssClass: off-white
      - name: "50"
        value: "var(--gray-50)"
        cssClass: gray-50
      - name: "100"
        value: "var(--gray-100)"
        cssClass: gray-100
      - name: "200"
        value: "var(--gray-200)"
        cssClass: gray-200
      - name: "300"
        value: "var(--gray-300)"
        cssClass: gray-300
      - name: "400"
        value: "var(--gray-400)"
        cssClass: gray-400
      - name: "500"
        value: "var(--gray-500)"
        cssClass: gray-500
      - name: "600"
        value: "var(--gray-600)"
        cssClass: gray-600
      - name: "700"
        value: "var(--gray-700)"
        cssClass: gray-700
      - name: "800"
        value: "var(--gray-800)"
        cssClass: gray-800
      - name: "900"
        value: "var(--gray-900)"
        cssClass: gray-900

  - group: "Surfaces & Text (mode-aware)"
    description: "These tokens change when you toggle light/dark mode. They define the reading surface, text hierarchy, and structural borders. Toggle the color mode in the toolbar to see them shift."
    colors:
      - name: Surface
        value: "var(--surface)"
        cssClass: surface
      - name: Surface Alt
        value: "var(--surface-alt)"
        cssClass: surface-alt
      - name: Surface Inverse
        value: "var(--surface-inverse)"
        cssClass: surface-inverse
      - name: Text
        value: "var(--text)"
        cssClass: text
      - name: Text Secondary
        value: "var(--text-secondary)"
        cssClass: text-secondary
      - name: Text Muted
        value: "var(--text-muted)"
        cssClass: text-muted
      - name: Text Inverse
        value: "var(--text-inverse)"
        cssClass: text-inverse
      - name: Border
        value: "var(--border)"
        cssClass: border
      - name: Border Strong
        value: "var(--border-strong)"
        cssClass: border-strong
    notes:
      - label: "Surface"
        text: "Page background. White in light mode, near-black in dark mode."
        cssClass: surface
      - label: "Surface Alt"
        text: "Cards, elevated sections, alternate backgrounds."
        cssClass: surface-alt
      - label: "Text"
        text: "Primary text color. Flips between black and white across modes."
        cssClass: text
      - label: "Text Secondary"
        text: "Body text, descriptions — reduced but readable contrast."
        cssClass: text-secondary
      - label: "Text Muted"
        text: "Captions, placeholders, disabled labels — decorative only."
        cssClass: text-muted
      - label: "Border"
        text: "Structural dividers — subtle in both modes."
        cssClass: border

  - group: "Accent Surfaces (mode-aware)"
    description: "Tinted backgrounds for status and emphasis. These use transparency, so they adapt to the underlying surface in each mode."
    colors:
      - name: Surface Accent
        value: "var(--surface-accent)"
        cssClass: surface-accent
      - name: Surface Warning
        value: "var(--surface-warning)"
        cssClass: surface-warning
      - name: Surface Danger
        value: "var(--surface-danger)"
        cssClass: surface-danger
      - name: Text Link
        value: "var(--text-link)"
        cssClass: text-link
      - name: Focus Ring
        value: "var(--focus-ring)"
        cssClass: focus-ring

  - group: "Semantic"
    description: "Functional state colors. Each communicates exactly one meaning."
    colors:
      - name: Success
        value: "var(--success)"
        cssClass: success
      - name: Warning
        value: "var(--warning)"
        cssClass: warning
      - name: Error
        value: "var(--error)"
        cssClass: error
      - name: Info
        value: "var(--info)"
        cssClass: info

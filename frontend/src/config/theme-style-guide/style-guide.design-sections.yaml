# ═══════════════════════════════════════════════════════════════
# DESIGN SECTIONS — style-guide.design-sections.yaml
# ═══════════════════════════════════════════════════════════════
#
# Detailed component specifications for the styleguide viewer's
# expandable design reference panels. Each section documents
# principles, approach, and rationale for a component category.
#
# HOW IT WORKS:
#   - Each top-level `- name:` entry becomes a collapsible section
#   - `components[]` within each section document individual patterns
#   - The viewer renders these as structured reference cards with
#     principle, approach, and rationale fields
#
# HOW TO MODIFY:
#   - Add a component: append a `- name:` entry under the relevant
#     section's `components` list
#   - Add a section: append a new `- name:` entry at the top level
#   - Fields: name, title, principle (one sentence), approach (how),
#     rationale (why)
#   - These are documentation only — they don't generate CSS
#
# RELATED: style-guide.page-sections.yaml (viewer section nav)
#          style-guide.css-snippets.yaml (actual CSS for components)
# ═══════════════════════════════════════════════════════════════

design-sections:
  - name: navigation
    title: Navigation
    description: "The grid holds navigation accountable. Fixed header, clear hierarchy, no ambiguity about where you are or where you can go."
    icon: "→"
    components:
      - name: navbar
        title: Top Navigation Bar
        principle: "The primary navbar is always visible and structurally fixed. It does not move. It does not surprise."
        approach: "Fixed header at 56px height. Logo anchored left at 28px/700 weight. Primary nav links right-aligned. Active state: 2px bottom border in red. Max one level of dropdowns — prefer drawer for deep hierarchies. Black background in dark contexts, white with black border in light."
        rationale: "The fixed header is a structural commitment — it tells users the interface is stable. Consistency in position reduces the cognitive cost of re-orientation on every page load."
      - name: sidebar
        title: Sidebar Navigation
        principle: "Sidebar nav is earned. It exists only when the hierarchy requires a dedicated column."
        approach: "240px fixed width. Collapsible to 56px icon rail. Section headers in 11px uppercase label. Active item: 2px left border in red, light red background tint. Black or dark-900 background. Sticky within scroll context."
        rationale: "A sidebar column costs 240px of horizontal space on every screen. That cost is only justified in tool interfaces where users switch between many sections frequently. Reading flows do not pay this cost."
      - name: breadcrumbs
        title: Breadcrumbs
        principle: "Breadcrumbs are a locator, not a navigation primary. Display at depth 3 or greater."
        approach: "Horizontal list. Separator: /. Font-size 13px, color var(--gray-500). Current page: plain text in var(--black), not a link. Truncate middle segments at narrow viewports. No background, no border."
        rationale: "Deep hierarchies disorient users. Breadcrumbs restore position without consuming vertical space or requiring interaction. The current-page-as-plain-text convention clarifies what is clickable."
      - name: contextual-menu
        title: Contextual Right-Click Menu
        principle: "Context menus surface the correct action at the correct moment. No more than seven items. No nested menus."
        approach: "Override browser default only on interactive surfaces — canvas, table rows, cards. Sharp corners, 1px border var(--gray-200), white background. Offset shadow: 4px 4px 0 var(--black). Keyboard: arrow keys navigate, Enter confirms, Escape dismisses."
        rationale: "Power users depend on context menus for speed. Predictable, constrained menus reward this behavior. Nested menus and unpredictable triggers erode trust in the interface."
      - name: mobile-nav
        title: Mobile Navigation
        principle: "One entry point. Full disclosure on demand. No mega-menus on mobile."
        approach: "Hamburger icon at top-right triggers slide-in drawer from left. Full-height drawer, black background, white text. Tap targets minimum 44x44px. Close on outside tap or Escape. Bottom tab bar as alternative for 4-5 primary sections."
        rationale: "Mobile screen space is finite. A single drawer control preserves the content area while keeping the full navigation reachable in two taps. The 44px touch target is a WCAG hard floor — below it, errors compound."

  - name: status-indicators
    title: Status Indicators
    description: "Precise signals. Each indicator communicates one state. No ambiguity, no decoration beyond function."
    icon: "●"
    components:
      - name: badges
        title: Badges
        principle: "Badges answer one question — how many, or what state. They carry no other information."
        approach: "Rectangular, 0px radius. Semantic color fill, white text at 11px/700. Sizes: sm for count overlays, default for inline display. Counts above 99 show '99+'. Maximum one badge per element."
        rationale: "The pill shape is conventional for badges but the Swiss system uses rectangles — consistent with the 0-2px radius constraint. The hard number limit prevents badge clusters that users learn to ignore."
      - name: alerts
        title: Inline Alerts
        principle: "Alerts interrupt only when the information is directly relevant to the current action."
        approach: "Full-width block or contextual inline. 2px left border in semantic color. 16px horizontal padding. Icon plus bold heading plus optional body. Dismissible with × when not critical. Success auto-dismisses after 4s."
        rationale: "The 2px left border is the Swiss alert signature — a structural marker, not decoration. Inline placement ties the alert to its cause. Users should not have to search for the reason an operation failed."
      - name: toasts
        title: Toast Notifications
        principle: "Toasts confirm actions already completed. They never request input or decisions."
        approach: "Top-right corner, stacked with 8px gap. Slide-in from right. Auto-dismiss after 8s. Semantic class sets the 2px left border accent. Maximum 4 visible — queue the remainder. Sharp corners, 1px border, offset shadow."
        rationale: "Toast position top-right keeps the primary content area unobstructed while remaining within the user's peripheral attention zone. Queuing prevents notification stacks that destabilize the interface."
      - name: progress
        title: Progress & Loading
        principle: "Show progress whenever an operation takes more than 300ms. Unknown duration is not an excuse for no indicator."
        approach: "Determinate bar: 4px height, black fill, gray track, square ends. Indeterminate: sliding bar animation. Skeleton screens for content loads — block placeholders at correct proportions. No spinners for content areas."
        rationale: "The 4px bar height is dense but visible. Skeleton screens set accurate layout expectations and feel faster than blank states. Square ends match the 0px radius constraint."
      - name: status-dots
        title: Status Dots
        principle: "Dots communicate presence states. They always appear with a text label — color alone is not sufficient."
        approach: "8px circle. States: online (success green), away (warning amber), offline (gray-400), error (red). Always paired with a text label. Position: inline-left of the label at 4px gap."
        rationale: "WCAG 1.4.1 prohibits color as the sole means of conveying information. The text label is the accessible baseline. The dot accelerates comprehension for sighted users — it does not replace the label."
      - name: tags
        title: Tags & Labels
        principle: "Tags categorize. Labels describe. Both are scannable in under 200ms."
        approach: "Rectangle, 0px radius. Muted background at 8% opacity of the accent color. Accent text color at full opacity. 11px/700 uppercase. Max 3 tags inline — show '+N more' on overflow. Clickable tags use pointer cursor."
        rationale: "The muted background prevents tag clusters from competing with primary content. Uppercase at 11px is the label register — it signals metadata, not content. The overflow pattern is a commitment to density without clutter."
      - name: form-validation
        title: Form Input Warnings
        principle: "Validation feedback is inline, specific, and actionable. 'Invalid' is not a valid error message."
        approach: "Error: 2px red border on field, error icon in trailing slot, red helper text below at 13px. Warning: 2px amber border, amber helper text, no icon required. Success: 2px green border, optional checkmark. All states preserve the field label visibility."
        rationale: "Field-level errors localize the problem to its cause. The 2px border is a strong enough signal to be visible without requiring an icon — but the icon plus text combination is the accessible standard."

  - name: site-layout
    title: Site Layout
    description: "Page-level layout patterns. Each archetype has a specific use case. Do not mix patterns within a single page."
    icon: "⊞"
    components:
      - name: search-first
        title: Search-First Layout
        principle: "When the catalog is too large to browse, search is the interface. The search field is the homepage."
        approach: "Search bar full-width or dominant at top center, 48px height, 2px border. Results render below with no page navigation. Faceted filters as a left column or horizontal chip row. No marketing content on the primary view."
        rationale: "Search-first layouts match the mental model of tool users who know what they want. Adding decorative content or carousels to a search-primary interface creates friction for the primary use case."
      - name: hierarchy
        title: Hierarchy Layout
        principle: "Visual weight mirrors the decision tree. Primary action top-left. Supporting content below and right."
        approach: "Hero at top, full content width. Secondary content in cards or columns below. Tertiary — metadata, related links — in sidebars or footer. Size, weight, and whitespace establish hierarchy. Borders secondary to space."
        rationale: "F-pattern scanning means the top-left is the highest-attention zone on any page. The primary action must occupy this zone. Everything else is subordinate by position."
      - name: dashboard
        title: Dashboard Layout
        principle: "Dashboards are read, not navigated. The layout is stable so users do not re-orient on each visit."
        approach: "12-column grid. KPI cards at top in 4-col units. Chart area below — 8-col primary, 4-col supplemental. Data table full-width at bottom. Left sidebar nav. Fixed header at 56px."
        rationale: "Dashboard users return daily to the same information. A stable, consistent layout reduces cognitive overhead to near zero. Density is appropriate here — users are trained, not first-time visitors."
      - name: document
        title: Document Layout
        principle: "Reading layouts enforce line length discipline. 45–75 characters per line is not negotiable."
        approach: "720px content column, centered. Body text 16px, 1.6 line-height. Sticky TOC sidebar left at wide viewports — 200px wide, gray-50 background. Section headings as anchor links. No decorative sidebars."
        rationale: "The optimal line length for reading comprehension is a typographic axiom established over centuries. Constraining the content column enforces it across all display sizes without media queries."
      - name: multi-view
        title: Multi-View / Split Layout
        principle: "Split views work only when selecting in panel A directly updates panel B. The relationship must be causal."
        approach: "Master list left at 30–35% width. Detail pane right at 65–70%. Vertical divider — 1px, gray-200. Divider draggable within 20–50% range. Mobile: stack vertically, detail view with back navigation."
        rationale: "Email clients and IDEs established this pattern's mental model. It breaks when the two panels are not causally linked — using it in that case confuses rather than clarifies."
      - name: contextual-panels
        title: Contextual Panels
        principle: "Panels expand the workspace. They are tools, not destinations. Never use navigation inside a panel."
        approach: "Slide in from right, over content — not push. 400–600px wide. Close on × or outside click. Header: 48px, title in 16px/600, dismiss button. 2px left border in accent color. Never nest panels."
        rationale: "Navigation breaks context — the user must track their position before and after the navigate. A panel keeps the background visible and the context intact while surfacing relevant details or editing tools."
      - name: contextual-menu
        title: Contextual Right-Click Menu
        principle: "Context menus are a precision tool. Override only on interactive surfaces with predictable behavior."
        approach: "Trigger only on canvas, table rows, and cards — never on passive content. Max 7 items. Separator before destructive actions. Sharp corners, 1px border, 4px 4px 0 offset shadow. Keyboard: arrows navigate, Enter confirms, Escape dismisses."
        rationale: "Predictable right-click behavior on interactive surfaces rewards power users. Unexpected context menus on passive content areas — text, images — create confusion and override browser behaviors users depend on."

  - name: forms
    title: Forms & Input Fields
    description: "Inputs that work. Labels always visible. States always explicit. Validation always specific."
    icon: "✎"
    components:
      - name: text-input
        title: Text Input
        principle: "Every field has a visible label. Placeholder text is not a label — it disappears."
        approach: "Label above field in 13px/600. Field height 40px. 1px border var(--gray-300), 0px radius. Focus: 2px border var(--black). Error: 2px border var(--red), red helper text below. Padding 12px horizontal."
        rationale: "Placeholder text vanishes when the user starts typing, leaving no context for mid-form review. A persistent label above the field is the correct pattern — it costs 20px of vertical space and saves errors."
      - name: select
        title: Select & Dropdown
        principle: "Native select for under 7 options. Custom dropdown only when search or multi-select is required."
        approach: "Styled native select matches input dimensions and border treatment. Custom: keyboard navigable, type-ahead filter for 10+ options, checkmark for selected. Dropdown panel: 1px border, 4px 4px 0 offset shadow."
        rationale: "Native elements carry built-in accessibility at zero cost. Custom implementations require explicit ARIA, keyboard handling, and testing. The cost must be justified by a capability gap — multi-select or search."
      - name: checkbox-radio
        title: Checkboxes & Radio Buttons
        principle: "Checkboxes for multiple selection. Radios for single selection. The convention is not optional."
        approach: "16px square checkbox, 0px radius. 16px circle radio. 8px gap to label. Group label above the set in 13px/600. Vertical stack default. Horizontal only for 2–3 short options. Error: red outline on the group container."
        rationale: "The checkbox/radio distinction is a hard convention — users have 30 years of training. Violating it causes selection errors. The vertical stack minimizes horizontal scanning effort for longer labels."
      - name: textarea
        title: Textarea
        principle: "Size the textarea to match the expected length of input. A three-line field for a paragraph is a mismatch."
        approach: "Default 4 rows. Auto-resize with JS where possible. Max-height at 320px with overflow-y: auto. Character count below for length-limited fields. Same border treatment as text input."
        rationale: "Field size sets user expectations. A small textarea for long-form content signals the interface does not expect much — users write less. Sizing to the expected content improves both output quality and error rates."
      - name: form-layout
        title: Form Layout
        principle: "Single-column form layouts outperform multi-column on completion rate and error rate."
        approach: "Single column default. Two columns only for clearly paired short fields — first name / last name, city / zip. Section headings in 13px/700 uppercase to group related fields. Submit at bottom-right. Cancel left of submit."
        rationale: "Multi-column forms create ambiguous reading order. Eye tracking studies consistently show single-column completion is faster and produces fewer errors. The research is not contested."
      - name: validation
        title: Validation & Errors
        principle: "Validate on blur or submit. Never validate on every keystroke."
        approach: "Blur validation for field-level. Submit validation for form-level with summary alert at top. Error: 2px red border, red icon in trailing slot, red helper text below. Success state optional — use for passwords and usernames only."
        rationale: "Keystroke validation creates anxiety through false positives. A user mid-word in an email field does not have an invalid email — they are typing one. Blur validation catches errors at the earliest recoverable point."

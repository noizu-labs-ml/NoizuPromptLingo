# Alibaba Token Plan — Anthropic-compatible API (Qwen + third-party chat)
# Requires: QWEN_SUB_KEY (Token Plan dedicated key, typically sk-sp-*)
# Endpoint: https://token-plan.ap-southeast-1.maas.aliyuncs.com/apps/anthropic
# Tiers (best-of-breed across the catalog, not all-Qwen):
#   fable  = kimi-k3        (Claude Code fable alias → Kimi K3)
#   opus   = qwen3.8-max    (flagship, 1M, vision)

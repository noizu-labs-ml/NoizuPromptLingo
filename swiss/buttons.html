    <section class="sg-section" id="buttons">
      <div class="sg-section-header">
        <div class="sg-section-number">04</div>
        <div class="sg-section-title-group">
          <h2 class="sg-section-title">Buttons</h2>
          <p class="sg-section-desc">No border-radius. Color signals priority. Outline inverts on hover.</p>
        </div>
      </div>

      <div class="sg-subsection">
        <h3 class="sg-subsection-title">Primary</h3>
        <div class="button-row">
          <button class="btn btn-black">Deploy</button>
          <button class="btn btn-red">Generate</button>
          <button class="btn btn-blue">Connect</button>
          <button class="btn btn-black btn-lg">Start Project</button>
          <button class="btn btn-black btn-sm">Save</button>
        </div>
      </div>

      <div class="sg-subsection">
        <h3 class="sg-subsection-title">Outline &amp; Ghost</h3>
        <div class="button-row">
          <button class="btn btn-outline">View Details</button>

          <button class="btn btn-outline btn-sm">Export</button>
          <button class="btn btn-ghost btn-sm">Dismiss</button>
        </div>
      </div>

      <div class="sg-subsection">
        <h3 class="sg-subsection-title">Danger</h3>
        <div class="button-row">
          <button class="btn btn-danger">Delete Project</button>
          <button class="btn btn-danger btn-sm">Remove</button>
        </div>
      </div>

      <div class="sg-subsection">
        <h3 class="sg-subsection-title">Agent Controls</h3>
        <div class="button-row">
          <button class="btn btn-black btn-sm">Approve</button>
          <button class="btn btn-outline btn-sm">Request Changes</button>
          <button class="btn btn-ghost btn-sm">Pause</button>
          <button class="btn btn-ghost btn-sm">Skip</button>
          <button class="btn btn-danger btn-sm">Rollback</button>
        </div>
      </div>
    </section>

storage: /verdaccio/storage/data
plugins: /verdaccio/plugins

auth:
  htpasswd:
    file: /verdaccio/conf/htpasswd
    max_users: -1

uplinks:
  npmjs:
    url: https://registry.npmjs.org/
    maxage: 60m
    timeout: 30s
    max_fails: 3
    fail_timeout: 10m

packages:
  "@noizu/*":
    access: $authenticated
    publish: $authenticated
    unpublish: $authenticated

  "**":
    access: $all
    publish: $authenticated
    unpublish: $authenticated
    proxy: npmjs

server:
  keepAliveTimeout: 60

middlewares:
  audit:
    enabled: true

max_body_size: 100mb

web:
  enable: true
  title: "Noizu npm Registry"

log:
  type: stdout
  format: pretty
  level: warn

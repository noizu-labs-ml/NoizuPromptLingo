design-sections:
  - name: navigation
    title: Navigation
    description: "Principles for how users move through the application — menus, wayfinding, and contextual access patterns."
    icon: "→"
    components:
      - name: navbar
        title: Top Navigation Bar
        principle: "The primary navbar is always visible and never competes with content. It orients without dominating."
        approach: "Fixed header: logo anchored left, primary nav links center or right. Active state uses accent underline or fill. Max one level of dropdowns; prefer drawer for deep hierarchies."
        rationale: "Top nav is the universal convention for desktop interfaces. Fixing it keeps orientation constant during scroll and reduces cognitive load on returning users."
      - name: sidebar
        title: Sidebar Navigation
        principle: "Sidebar nav is for deep hierarchies and tool-heavy interfaces. It earns its column width."
        approach: "Collapsible rail (icon-only) expanding to labeled list. Sections grouped with headers. Active item uses accent-left-border highlight. Sticky within scroll context."
        rationale: "Sidebars shine in dashboards and editors where users switch contexts frequently. They fail on content-reading flows — don't add one there."
      - name: breadcrumbs
        title: Breadcrumbs
        principle: "Breadcrumbs are a safety net, not a primary navigation tool. Show them at depth ≥ 3."
        approach: "Horizontal list, separator character (/ or ›), truncate middle segments at small viewports. Current page is plain text, not a link. Font-size-sm."
        rationale: "Users lose their place in deep hierarchies. Breadcrumbs restore orientation without requiring a return to the top."
      - name: contextual-menu
        title: Contextual Right-Click Menu
        principle: "Context menus surface the right action at the right moment — never more than the user expects."
        approach: "Override browser default only on interactive surfaces (canvas, table rows, cards). Max 7 items. Dividers separate destructive actions. Keyboard accessible (arrow keys, Enter, Escape)."
        rationale: "Power users rely on context menus for speed. Surprising right-click behavior erodes trust; expected behavior rewards it."
      - name: mobile-nav
        title: Mobile Navigation
        principle: "Mobile nav hides complexity behind a single entry point and reveals it on demand."
        approach: "Hamburger icon triggers slide-in drawer from left or bottom sheet. No mega-menus. Tap targets min 44×44px. Close on outside tap or Escape."
        rationale: "Mobile screen space is a zero-sum resource. A drawer preserves content space while keeping all nav accessible within two taps."

  - name: status-indicators
    title: Status Indicators
    description: "Visual signals that communicate system state, feedback, and context without requiring user action."
    icon: "●"
    components:
      - name: badges
        title: Badges
        principle: "Badges answer 'how many' or 'what state' at a glance. They never carry critical information alone."
        approach: "Pill shape, semantic color fill, white text. Sizes: sm (count overlays) and default (inline). Counts >99 show '99+'. Use sparingly — only one badge per element."
        rationale: "Badges provide ambient awareness. Overuse creates noise that users learn to ignore, defeating the purpose."
      - name: alerts
        title: Inline Alerts
        principle: "Alerts interrupt the flow only when the information is directly relevant to the current context."
        approach: "Full-width banner or contextual block. Left accent bar in semantic color. Icon + heading + optional body text. Dismissible with × when appropriate. Success dismisses automatically after 4s."
        rationale: "Inline placement ties the alert to its cause. Positioned at top of a form, it explains what went wrong without the user having to hunt for the error."
      - name: toasts
        title: Toast Notifications
        principle: "Toasts confirm actions already taken. They never ask for decisions."
        approach: "Bottom-right corner, stacked. Slide-in animation, auto-dismiss after 3–5s. Semantic class sets accent. No more than 3 visible at once — queue the rest."
        rationale: "Toasts are acknowledgement, not dialogue. Keeping them ephemeral and out of the content area respects user focus."
      - name: progress
        title: Progress & Loading
        principle: "Always show progress when an operation takes more than 300ms. Uncertainty is worse than a slow bar."
        approach: "Determinate bar for known duration (file upload, multi-step). Indeterminate spinner/skeleton for unknown. Skeleton screens preferred over spinners for content loads."
        rationale: "Perceived performance is as important as actual performance. A skeleton screen that appears instantly feels faster than a blank page that populates quickly."
      - name: status-dots
        title: Status Dots
        principle: "Dots communicate presence and health states inline. They complement text — never replace it."
        approach: "8px circle, semantic fill color. States: online (success), away (warning), offline (gray), error (error). Always paired with a text label for accessibility."
        rationale: "Color alone fails WCAG 1.4.1. The text label is the accessible baseline; the dot is a visual accelerator for sighted users."
      - name: tags
        title: Tags & Labels
        principle: "Tags categorize; labels describe. Both should be scannable at a glance."
        approach: "Pill or rectangle, muted background (accent at 12% opacity), accent text color. Max 3 tags displayed inline; show '+N more' for overflow. Clickable tags use pointer cursor and filter behavior."
        rationale: "Tags reduce the need to open a record to understand what it is. The muted background prevents tag clusters from competing with primary content."
      - name: form-validation
        title: Form Input Warnings
        principle: "Validation feedback must be inline, specific, and actionable — never just 'invalid'."
        approach: "Error state: red border + error icon in trailing slot + red helper text below field. Warning state: amber border + helper text (no icon required). Success state: green border, optional checkmark. All states maintain label visibility."
        rationale: "Inline field-level feedback localizes the error to its cause. A summary alert at form top handles submission-level failures while field-level messages handle input-level ones — never use one for both."

  - name: forms
    title: Forms & Input Fields
    description: "Principles for data collection — inputs, validation, layout, and feedback patterns."
    icon: "✎"
    components:
      - name: text-input
        title: Text Input
        principle: "Every input needs a visible label and a clear affordance. Placeholder is not a label."
        approach: "Label above field, always visible. 1px border, focus ring on focus-visible. Error state replaces border with error accent. Helper text below field in font-size-sm. Min height 40px."
        rationale: "Placeholder text disappears on input, leaving users without context mid-form. A persistent label above prevents this while keeping the layout clean."
      - name: select
        title: Select & Dropdown
        principle: "Native selects for simple choices (under 7 items). Custom dropdowns only when you need search or multi-select."
        approach: "Style native select to match input aesthetic. Custom dropdown: same border/radius treatment, keyboard navigable, filtered with type-ahead if >10 options."
        rationale: "Native elements carry built-in accessibility. Custom implementations require explicit ARIA roles, keyboard handling, and screen reader testing — justify the cost."
      - name: checkbox-radio
        title: Checkboxes & Radio Buttons
        principle: "Checkboxes for multiple selections, radios for single. Never the reverse."
        approach: "16px control, 4px gap to label. Group label above the set. Vertical stack preferred; horizontal only for 2-3 short options. Error state outlines the group container."
        rationale: "The convention is load-bearing — swapping them causes errors. The vertical stack reduces horizontal scanning effort for longer labels."
      - name: textarea
        title: Textarea
        principle: "Textareas should suggest the expected length of input through their height."
        approach: "Default 3 rows. Auto-resize with JS where possible. Max-height with overflow-y: auto to prevent runaway expansion. Character count for fields with limits."
        rationale: "A tiny textarea for a long-form essay signals a mismatch. Sizing the field to the expected content sets the right expectation and reduces errors."
      - name: form-layout
        title: Form Layout
        principle: "Single-column form layouts outperform multi-column for completion rate and error rate."
        approach: "Single column for most forms. Two columns only for clearly related short pairs (first name / last name). Group related fields with a section heading. Submit action at the bottom-right."
        rationale: "Multi-column forms create ambiguous reading order and increase eye movement. The conversion research is consistent: single column completes faster."
      - name: validation
        title: Validation & Errors
        principle: "Validate on blur or submit — never on every keystroke."
        approach: "Inline error text below the field in error red. Error icon in field trailing slot. Summary alert at form top for submission errors. Success state optional — use for high-stakes fields (passwords, usernames)."
        rationale: "Keystroke validation creates anxiety and false positives. Blur validation catches errors at the earliest recoverable moment without interrupting input."

  - name: site-layout
    title: Site Layout
    description: "How content, navigation, and tools are organized across the full page — spatial hierarchy and layout archetypes."
    icon: "⊞"
    components:
      - name: search-first
        title: Search-First Layout
        principle: "When the dataset is large enough that browsing fails, search is the primary interface."
        approach: "Search bar dominant at top center or full-width. Results replace or animate below. Faceted filters in a left panel or horizontal chip row. No homepage clutter — the search field is the homepage."
        rationale: "Google trained users to expect instant answers. A search-first layout matches that mental model for tool-like interfaces with deep content catalogs."
      - name: hierarchy
        title: Hierarchy Layout
        principle: "The visual weight of elements on the page should mirror the decision tree the user navigates."
        approach: "Hero / primary action at top. Secondary content in cards below. Tertiary (metadata, related links) in sidebars or footers. Use size, color, and whitespace — not borders — to establish hierarchy."
        rationale: "Users scan in F or Z patterns. Placing the primary action at the top-left of the first scan zone maximizes engagement before attention drops."
      - name: dashboard
        title: Dashboard Layout
        principle: "Dashboards show the status of a system at a moment in time — they are read, not interacted with heavily."
        approach: "12-column grid. KPI cards row at top (4-col each). Chart area below (8-col main, 4-col supplemental). Data table at bottom full-width. Sidebar nav to the left. Fixed header."
        rationale: "Dashboard users return daily for the same information. Stable layout reduces re-orientation time. Density is acceptable because users are trained — contrast with onboarding flows."
      - name: document
        title: Document Layout
        principle: "Reading layouts optimize for comprehension — wide enough to scan, narrow enough to read."
        approach: "Max content width 720px, centered. Large body text (18–20px), 1.6 line-height. TOC sticky sidebar on the left at wide viewports. Section headings as anchor links."
        rationale: "The 45–75 character optimal line length is a typographic axiom. Constraining content width enforces it regardless of display size."
      - name: multi-view
        title: Multi-View / Split Layout
        principle: "Split views work when the two panels are causally linked — selecting in panel A updates panel B."
        approach: "Master list left (30–35%), detail pane right (65–70%). Divider draggable within constraints. On mobile: stack vertically with back navigation from detail to list."
        rationale: "Email clients and IDEs established this pattern. Users understand it instantly. It breaks down when the relationship between panels is ambiguous — don't use it then."
      - name: contextual-panels
        title: Contextual Panels
        principle: "Panels expand the workspace without navigating away — they are tools, not destinations."
        approach: "Slide in from right over content (not push). 400–600px wide. Close on × or outside click. Header with title and dismiss. Never nest panels."
        rationale: "Navigation breaks context. A panel keeps the background visible and the user oriented while surfacing relevant details or editing tools inline."
      - name: contextual-menu
        title: Contextual Right-Click Menu
        principle: "Context menus surface the right action at the right moment — never more than the user expects."
        approach: "Override browser default only on interactive surfaces (canvas, table rows, cards). Max 7 items. Dividers separate destructive actions. Keyboard accessible: arrow keys navigate, Enter confirms, Escape dismisses."
        rationale: "Power users rely on context menus for speed. Predictable right-click behavior rewards expertise. Surprising or absent context menus on interactive surfaces erode trust."

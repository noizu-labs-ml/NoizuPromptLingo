# ═══════════════════════════════════════════════════════════════
# Style Guide — Design Token Overrides
#
# Convention:
#   active entry    = value DIFFERS from what defaults.ts produces
#   # name: "val"   = matches default (shown for reference, using var() form)
#
# defaults.ts builds ~300 tokens from seeds. This file only stores
# the delta plus brand-identity anchors.
# ═══════════════════════════════════════════════════════════════

vars:
  groups:
    # ── Surfaces ──
    # All computed from white=#ffffff, black=#000000 via lerp in defaults.ts
    - name: Surfaces
      vars:
        # white: "#ffffff"
        # off-white: "#fafafa"
        # gray-50: "#f5f5f5"
        # gray-100: "#eeeeee"
        # gray-200: "#e0e0e0"
        # gray-300: "#bdbdbd"
        # gray-400: "#9e9e9e"
        # gray-500: "#757575"
        # gray-600: "#616161"
        # gray-700: "#424242"
        # gray-800: "#212121"
        # gray-900: "#121212"
        # black: "#000000"

    # ── Primaries ──
    # Hex seeds are brand identity — keep explicit. Light/mid derived.
    - name: Primaries - Bauhaus
      vars:
        brand-red: "#e20613"
        # brand-red-light: "color-mix(in srgb, #e20613 12%, var(--surface))"
        # brand-red-mid: "color-mix(in srgb, #e20613 20%, var(--surface))"
        brand-blue: "#0047ab"
        # brand-blue-light: "color-mix(in srgb, #0047ab 12%, var(--surface))"
        # brand-blue-mid: "color-mix(in srgb, #0047ab 20%, var(--surface))"
        brand-yellow: "#f5c518"
        # brand-yellow-light: "color-mix(in srgb, #f5c518 18%, var(--surface))"
        # brand-yellow-mid: "color-mix(in srgb, #f5c518 35%, var(--surface))"

    # ── Semantic ──
    # Aliases into palette/brand — change the palette color, semantic follows.
    # Tints derived via color-mix against surface.
    - name: Semantic
      vars:
        success: "var(--emerald)"
        # success-tint: "color-mix(in srgb, var(--success) 12%, var(--surface))"
        warning: "var(--amber)"
        # warning-tint: "color-mix(in srgb, var(--warning) 12%, var(--surface))"
        error: "var(--rose)"
        # error-tint: "color-mix(in srgb, var(--error) 12%, var(--surface))"
        info: "var(--brand-blue)"
        # info-tint: "color-mix(in srgb, var(--info) 12%, var(--surface))"

    # ── Palette ──
    # Extended color palette — NOT in defaults. All active.
    - name: Palette
      vars:
        rose: "#e11d48"
        rose-light: "color-mix(in srgb, #e11d48 12%, var(--surface))"
        orange: "#ea580c"
        orange-light: "color-mix(in srgb, #ea580c 12%, var(--surface))"
        amber: "#d97706"
        amber-light: "color-mix(in srgb, #d97706 12%, var(--surface))"
        lime: "#65a30d"
        lime-light: "color-mix(in srgb, #65a30d 12%, var(--surface))"
        emerald: "#059669"
        emerald-light: "color-mix(in srgb, #059669 12%, var(--surface))"
        teal: "#0d9488"
        teal-light: "color-mix(in srgb, #0d9488 12%, var(--surface))"
        cyan: "#0891b2"
        cyan-light: "color-mix(in srgb, #0891b2 12%, var(--surface))"
        sky: "#0284c7"
        sky-light: "color-mix(in srgb, #0284c7 12%, var(--surface))"
        indigo: "#4f46e5"
        indigo-light: "color-mix(in srgb, #4f46e5 12%, var(--surface))"
        violet: "#7c3aed"
        violet-light: "color-mix(in srgb, #7c3aed 12%, var(--surface))"
        purple: "#9333ea"
        purple-light: "color-mix(in srgb, #9333ea 12%, var(--surface))"
        fuchsia: "#c026d3"
        fuchsia-light: "color-mix(in srgb, #c026d3 12%, var(--surface))"
        pink: "#db2777"
        pink-light: "color-mix(in srgb, #db2777 12%, var(--surface))"

    # ── Typography ──
    # Font stacks are brand identity. Size refs use var(--size-*) path
    # (defaults produce px values via Math.round). Both kept active.
    - name: Typography
      vars:
        font-sans: "'Space Grotesk', -apple-system, sans-serif"
        font-mono: "'IBM Plex Mono', 'Menlo', monospace"
        font-size-base: "var(--size-md)"
        # line-height-base: "1.5"
        font-size-xs: "var(--size-xs)"
        font-size-sm: "var(--size-sm)"
        font-size-md: "var(--size-md)"
        font-size-lg: "var(--size-lg)"
        font-size-xl: "var(--size-xl)"
        font-size-2xl: "var(--space-4)"
        font-size-3xl: "var(--space-5)"
        font-size-display: "var(--space-7)"

    # ── Grid & Spacing ──
    # unit=8 matches default. Standard scale computed from unit — commented.

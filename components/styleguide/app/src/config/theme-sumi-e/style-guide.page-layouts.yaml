page-layouts:
  - name: standard
    title: Standard
    description: Max-width centered content with top nav and footer
    selector: ".content"
    vars:
      max-width: "1200px"
      padding: "var(--space-6)"
      margin: "0 auto"
      body-bg: "var(--surface)"
      content-bg: "var(--surface-alt)"
    chrome:
      navbar:
        height: "56px"
        background: "var(--surface-inverse)"
        color: "var(--text-inverse)"
        label: "Nav"
      footer:
        height: "48px"
        background: "var(--surface-alt)"
        color: "var(--text-muted)"
        label: "Footer"

  - name: wide
    title: Wide
    description: Broader max-width for content-rich pages
    selector: ".content.wide"
    vars:
      max-width: "80vw"
      padding: "var(--space-6)"
      margin: "0 auto"
      body-bg: "var(--surface)"
      content-bg: "var(--surface-alt)"
    chrome:
      navbar:
        height: "56px"
        background: "var(--surface-inverse)"
        color: "var(--text-inverse)"
        label: "Nav"
      footer:
        height: "48px"
        background: "var(--surface-alt)"
        color: "var(--text-muted)"
        label: "Footer"

  - name: full
    title: Full
    description: Edge-to-edge content with padding guardrails
    selector: ".content.full"
    vars:
      max-width: "100%"
      padding: "var(--space-4)"
      margin: "0"
      body-bg: "var(--surface)"
      content-bg: "var(--surface)"
    chrome:
      navbar:
        height: "56px"
        background: "var(--surface-inverse)"
        color: "var(--text-inverse)"
        label: "Nav"

  - name: narrow
    title: Narrow
    description: Focused reading experience, single column
    selector: ".content.narrow"
    vars:
      max-width: "var(--space-90)"
      padding: "var(--space-6)"
      margin: "0 auto"
      body-bg: "var(--surface)"
      content-bg: "var(--surface-alt)"
    chrome:
      navbar:
        height: "48px"
        background: "var(--surface-alt)"
        color: "var(--text)"
        label: "Nav"
      footer:
        height: "40px"
        background: "var(--surface-alt)"
        color: "var(--text-muted)"
        label: "Footer"

  - name: article
    title: Article
    description: Optimized for long-form reading with TOC sidebar
    selector: ".content.article"
    vars:
      max-width: "860px"
      padding: "var(--space-6)"
      margin: "0 auto"
      body-bg: "var(--surface)"
      content-bg: "var(--surface-alt)"
    chrome:
      navbar:
        height: "48px"
        background: "var(--surface-alt)"
        color: "var(--text)"
        label: "Nav"
      sidebar:
        width: "200px"
        background: "var(--surface-alt)"
        color: "var(--text-secondary)"
        label: "TOC"
      footer:
        height: "40px"
        background: "var(--surface-alt)"
        color: "var(--text-muted)"
        label: "Footer"

vars:
  groups:
    - name: Surfaces
      vars:
        white: "#f5f0e8"
        off-white: "#efe8dc"
        gray-50: "#e8e0d0"
        gray-100: "#e0dcd4"
        gray-200: "#ddd5c5"
        gray-300: "#ccc8be"
        gray-400: "#a8a89e"
        gray-500: "#7a7a72"
        gray-600: "#4a4a46"
        gray-700: "#2a2a28"
        gray-800: "#1a1a1a"
        gray-900: "#0f0f0f"
        black: "#0a0a0a"

    - name: "Sumi — Ink Wash Tones"
      vars:
        sumi-deep: "#0f0f0f"
        sumi: "#1a1a1a"
        sumi-strong: "#2a2a28"
        sumi-mid: "#4a4a46"
        sumi-light: "#7a7a72"
        sumi-wash: "#a8a89e"
        sumi-ghost: "#ccc8be"
        sumi-mist: "#e0dcd4"

    - name: "Washi — Paper Surfaces"
      vars:
        washi: "#f5f0e8"
        washi-warm: "#efe8dc"
        washi-cool: "#f0efe9"
        washi-aged: "#e8e0d0"
        washi-shadow: "#ddd5c5"

    - name: "Primaries - Bauhaus"
      vars:
        brand-red: "#c23b22"
        brand-red-light: "rgba(194,59,34,0.12)"
        brand-red-mid: "rgba(194,59,34,0.20)"
        brand-blue: "#2b4570"
        brand-blue-light: "rgba(43,69,112,0.10)"
        brand-blue-mid: "rgba(43,69,112,0.18)"
        brand-yellow: "#b8960c"
        brand-yellow-light: "rgba(184,150,12,0.10)"
        brand-yellow-mid: "rgba(184,150,12,0.18)"

    - name: Semantic
      vars:
        success: "#4a7a52"
        success-tint: "rgba(74,122,82,0.10)"
        warning: "#8b6914"
        warning-tint: "rgba(139,105,20,0.10)"
        error: "#9b2c2c"
        error-tint: "rgba(155,44,44,0.10)"
        info: "#2b4570"
        info-tint: "rgba(43,69,112,0.10)"

    - name: Palette
      vars:
        rose: "#c23b22"
        rose-light: "rgba(194,59,34,0.08)"
        orange: "#b8960c"
        orange-light: "rgba(184,150,12,0.08)"
        amber: "#8b6914"
        amber-light: "rgba(139,105,20,0.08)"
        lime: "#5a7247"
        lime-light: "rgba(90,114,71,0.08)"
        emerald: "#4a7a52"
        emerald-light: "rgba(74,122,82,0.08)"
        teal: "#2b4570"
        teal-light: "rgba(43,69,112,0.08)"
        cyan: "#2b4570"
        cyan-light: "rgba(43,69,112,0.08)"
        sky: "#2b4570"
        sky-light: "rgba(43,69,112,0.08)"
        indigo: "#2b4570"
        indigo-light: "rgba(43,69,112,0.08)"
        violet: "#5a4570"
        violet-light: "rgba(90,69,112,0.08)"
        purple: "#5a4570"
        purple-light: "rgba(90,69,112,0.08)"
        fuchsia: "#c23b22"
        fuchsia-light: "rgba(194,59,34,0.08)"
        pink: "#c23b22"
        pink-light: "rgba(194,59,34,0.08)"

    - name: Typography
      vars:
        font-sans: "'Cormorant Garamond', Georgia, serif"
        font-mono: "'IBM Plex Mono', 'Menlo', monospace"
        font-display: "'Cormorant Garamond', 'Noto Serif JP', Georgia, serif"
        font-body: "'Cormorant Garamond', Georgia, serif"
        font-decorative: "'Noto Serif JP', serif"
        font-size-base: "var(--size-md)"
        font-size-xs: "var(--size-xs)"
        font-size-sm: "var(--size-sm)"
        font-size-md: "var(--size-md)"
        font-size-lg: "var(--size-lg)"
        font-size-xl: "var(--size-xl)"
        font-size-2xl: "var(--space-4)"
        font-size-3xl: "var(--space-5)"
        font-size-display: "var(--space-7)"

    - name: Grid & Spacing
      vars: {}

    - name: Base
      vars:
        base-font-family: "var(--font-body)"
        base-font-color: "var(--text)"
        base-background: "var(--surface)"
        base-line-height: "1.8"
        base-font-size: "18px"

    - name: Branding
      vars:
        branding-logo-font-size: "20px"
        branding-logo-font-weight: "400"
        branding-logo-letter-spacing: "0.01em"
        branding-logo-text-transform: "none"
        branding-logo-bg: "#efe8dc"
        branding-border: "2px solid var(--sumi-mist)"

    - name: Cards
      vars:
        card-accent-side: "left"
        card-background: "#f0efe9"
        card-border-color: "#e0dcd4"
        card-header-background: "#f0efe9"
        card-footer-background: "#efe8dc"
        card-footer-font-size: "var(--font-size-xs)"

    - name: Buttons
      vars:
        btn-font-family: "var(--font-mono)"
        btn-font-weight: "500"
        btn-font-size: "11px"
        btn-letter-spacing: "0.12em"
        btn-background: "#1a1a1a"
        btn-color: "#f5f0e8"
        btn-border-color: "transparent"
        btn-hover-background: "#2a2a28"
        btn-hover-border-color: "transparent"
        btn-outline-background: "transparent"
        btn-outline-color: "#1a1a1a"
        btn-outline-hover-background: "#f0efe9"

    - name: Toggle
      vars:
        sg-section-title-font-family: "var(--font-display)"
        sg-section-title-text-transform: "none"
        sg-section-title-letter-spacing: "0.01em"
        sg-section-title-color: "var(--text)"
        sg-section-number-bg: "transparent"
        sg-section-number-border: "none"
        sg-section-number-color: "#a8a89e"
        sg-section-number-radius: "0"
        sg-section-desc-font-family: "var(--font-mono)"
        sg-section-desc-color: "var(--text-muted)"
        sg-type-specimen-bg: "#f0efe9"
        sg-type-specimen-border: "1px solid #e0dcd4"
        sg-type-specimen-border-bottom: "1px solid #e0dcd4"
        sg-type-specimen-radius: "2px"
        sg-type-specimen-padding: "var(--space-3)"
        sg-type-specimen-margin: "0 0 var(--space-3) 0"
        sg-type-specimen-name-color: "#1a1a1a"
        sg-type-specimen-name-font: "var(--font-display)"
        hr-section-height: "12px"
        hr-section-color: "none"
        hr-subsection-color: "linear-gradient(90deg, transparent 0%, #a8a89e 10%, #7a7a72 40%, #a8a89e 70%, transparent 100%)"
        hr-subsection-height: "1px"
        hr-accent-color: "#c23b22"

    - name: "HUI: Focus & Interaction"
      vars:
        hui-focus-ring-color: "rgba(194,59,34,0.2)"
        hui-focus-ring-width: "2px"

    - name: "HUI: Controls"
      vars:
        hui-control-color: "#1a1a1a"
        hui-control-bg: "#f5f0e8"
        hui-control-border: "#ccc8be"
        hui-control-shadow: "0 1px 3px rgba(26,26,26,0.06)"
        hui-switch-track-on-bg: "#1a1a1a"
        hui-switch-track-off-bg: "#ddd5c5"
        hui-switch-thumb-shadow: "0 1px 3px rgba(26,26,26,0.1)"
        hui-radio-option-border: "#e0dcd4"
        hui-radio-option-border-active: "#1a1a1a"
        hui-radio-option-bg-active: "rgba(26,26,26,0.03)"

    - name: "HUI: Trigger Buttons"
      vars:
        hui-trigger-bg: "#f5f0e8"
        hui-trigger-border: "#ccc8be"
        hui-trigger-border-hover: "#7a7a72"
        hui-trigger-color: "#1a1a1a"

    - name: "HUI: Overlay Panels"
      vars:
        hui-panel-bg: "#f5f0e8"
        hui-panel-border: "#e0dcd4"
        hui-panel-shadow: "0 3px 12px rgba(26,26,26,0.08)"
        hui-panel-item-active-bg: "#efe8dc"
        hui-panel-item-active-color: "#1a1a1a"
        hui-panel-sep-color: "#e0dcd4"

    - name: "HUI: Tabs"
      vars:
        hui-tab-color: "#a8a89e"
        hui-tab-color-selected: "#1a1a1a"
        hui-tab-border-selected: "#1a1a1a"
        hui-tab-color-hover: "#4a4a46"
        hui-tab-list-border: "#e0dcd4"

    - name: "HUI: Disclosure"
      vars:
        hui-disclosure-bg: "#efe8dc"
        hui-disclosure-bg-hover: "#e8e0d0"
        hui-disclosure-border: "#ddd5c5"
        hui-disclosure-color: "#1a1a1a"
        hui-disclosure-panel-bg: "#f5f0e8"
        hui-disclosure-panel-color: "#4a4a46"
        hui-disclosure-chevron-color: "#a8a89e"

    - name: "HUI: Field Controls"
      vars:
        hui-field-bg: "#f5f0e8"
        hui-field-border: "#ccc8be"
        hui-field-border-hover: "#a8a89e"
        hui-field-focus-border: "#1a1a1a"
        hui-field-color: "#1a1a1a"
        hui-field-shadow: "inset 0 1px 3px rgba(26,26,26,0.04)"
        hui-combo-placeholder-color: "#a8a89e"
        hui-combo-btn-color: "#a8a89e"

    - name: "HUI: Dialog"
      vars:
        hui-dialog-bg: "#f5f0e8"
        hui-dialog-shadow: "0 12px 48px rgba(26,26,26,0.12)"
        hui-dialog-title-color: "#1a1a1a"
        hui-dialog-body-color: "#4a4a46"
        hui-dialog-backdrop: "rgba(26,26,26,0.3)"

    - name: "HUI: Showcase Grid"
      vars:
        hui-showcase-accent: "#c23b22"
        hui-showcase-bg: "#efe8dc"
        hui-showcase-border: "#ddd5c5"
        hui-showcase-cell-bg: "#f5f0e8"
        hui-showcase-cell-border: "#e0dcd4"
        hui-showcase-label-color: "#a8a89e"

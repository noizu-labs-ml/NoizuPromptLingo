intent: "Sumi-e aesthetic for contemplative product tools. Warm washi paper, sumi ink at varying dilutions, and the vermillion seal. Every mark is deliberate, every absence chosen."
perception: "Serene, intentional, crafted. Users should feel like they're working with a tool that respects the space between actions as much as the actions themselves."
audience: "Designers, writers, and thoughtful builders who appreciate restraint, craft, and the beauty of empty space."
tone: "Quiet. Considered. Poetic but precise. Let the whitespace speak. The brush does not hurry."
keywords:
  - Sumi-e
  - Washi
  - Vermillion
  - Intentional
  - Ma
  - Brush


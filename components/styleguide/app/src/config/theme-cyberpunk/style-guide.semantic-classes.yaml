semantic-classes:
  - name: danger
    class: danger
    title: "Danger / Error"
    description: "Destructive actions, error states, critical alerts"
    accent-style: solid
    vars:
      - name: accent
        value: "var(--error)"
      - name: background
        value: "var(--error-tint)"
      - name: color
        value: "var(--error)"

  - name: warning
    class: warning
    title: "Warning / Caution"
    description: "Non-blocking warnings, attention-required states"
    accent-style: solid
    vars:
      - name: accent
        value: "var(--warning)"
      - name: background
        value: "var(--warning-tint)"
      - name: color
        value: "var(--warning)"

  - name: success
    class: success
    title: "Success / Confirmed"
    description: "Positive outcomes, completed actions, online states"
    accent-style: solid
    vars:
      - name: accent
        value: "var(--success)"
      - name: background
        value: "var(--success-tint)"
      - name: color
        value: "var(--success)"

  - name: info
    class: info
    title: "Info / Signal"
    description: "Informational states, links, guidance"
    accent-style: solid
    vars:
      - name: accent
        value: "var(--info)"
      - name: background
        value: "var(--info-tint)"
      - name: color
        value: "var(--info)"

  - name: primary
    class: primary
    title: "Primary / Cyan"
    description: "Primary actions, active states, focus indicators"
    accent-style: solid
    vars:
      - name: accent
        value: "var(--teal)"
      - name: background
        value: "rgba(0,255,240,0.1)"
      - name: color
        value: "var(--teal)"

  - name: brand
    class: brand
    title: "Brand / Lime"
    description: "Brand accent, highlights, featured content"
    accent-style: solid
    vars:
      - name: accent
        value: "var(--lime)"
      - name: background
        value: "rgba(170,255,0,0.1)"
      - name: color
        value: "var(--lime)"

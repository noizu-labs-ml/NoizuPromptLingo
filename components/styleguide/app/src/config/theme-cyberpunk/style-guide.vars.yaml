vars:
  groups:
    - name: Surfaces
      vars:
        white: "#e0e0e8"
        off-white: "#d0d0d8"
        gray-50: "#2a2a3a"
        gray-100: "#32324a"
        gray-200: "#3a3a52"
        gray-300: "#555570"
        gray-400: "#8888a0"
        gray-500: "#9999b0"
        gray-600: "#aaaabc"
        gray-700: "#1e1e2a"
        gray-800: "#111118"
        gray-900: "#0a0a0f"
        black: "#050508"

    - name: "Primaries - Bauhaus"
      vars:
        brand-red: "#ff3366"
        brand-red-light: "rgba(255,51,102,0.15)"
        brand-red-mid: "rgba(255,51,102,0.25)"
        brand-blue: "#4466ff"
        brand-blue-light: "rgba(68,102,255,0.15)"
        brand-blue-mid: "rgba(68,102,255,0.25)"
        brand-yellow: "#aaff00"
        brand-yellow-light: "rgba(170,255,0,0.15)"
        brand-yellow-mid: "rgba(170,255,0,0.25)"

    - name: Semantic
      vars:
        success: "#00ff88"
        success-tint: "rgba(0,255,136,0.15)"
        warning: "#ffaa00"
        warning-tint: "rgba(255,170,0,0.15)"
        error: "#ff3344"
        error-tint: "rgba(255,51,68,0.15)"
        info: "#4488ff"
        info-tint: "rgba(68,136,255,0.15)"

    - name: Palette
      vars:
        rose: "#ff3366"
        rose-light: "rgba(255,51,102,0.12)"
        orange: "#ff8800"
        orange-light: "rgba(255,136,0,0.12)"
        amber: "#ffaa00"
        amber-light: "rgba(255,170,0,0.12)"
        lime: "#aaff00"
        lime-light: "rgba(170,255,0,0.12)"
        emerald: "#00ff88"
        emerald-light: "rgba(0,255,136,0.12)"
        teal: "#00fff0"
        teal-light: "rgba(0,255,240,0.12)"
        cyan: "#00fff0"
        cyan-light: "rgba(0,255,240,0.12)"
        sky: "#4488ff"
        sky-light: "rgba(68,136,255,0.12)"
        indigo: "#4466ff"
        indigo-light: "rgba(68,102,255,0.12)"
        violet: "#aa44ff"
        violet-light: "rgba(170,68,255,0.12)"
        purple: "#aa44ff"
        purple-light: "rgba(170,68,255,0.12)"
        fuchsia: "#ff00aa"
        fuchsia-light: "rgba(255,0,170,0.12)"
        pink: "#ff3366"
        pink-light: "rgba(255,51,102,0.12)"

    - name: Typography
      vars:
        font-sans: "'Inter', -apple-system, sans-serif"
        font-mono: "'Fira Code', 'Share Tech Mono', monospace"
        font-display: "'Orbitron', sans-serif"
        font-body: "'Share Tech Mono', 'Fira Code', monospace"
        font-size-base: "var(--size-md)"
        font-size-xs: "var(--size-xs)"
        font-size-sm: "var(--size-sm)"
        font-size-md: "var(--size-md)"
        font-size-lg: "var(--size-lg)"
        font-size-xl: "var(--size-xl)"
        font-size-2xl: "var(--space-4)"
        font-size-3xl: "var(--space-5)"
        font-size-display: "var(--space-7)"

    - name: Grid & Spacing
      vars: {}

    - name: Base
      vars:
        base-font-family: "var(--font-body)"
        base-font-color: "var(--text)"
        base-background: "var(--surface)"
        base-line-height: "1.7"
        base-font-size: "var(--font-size-base)"

    - name: Cards
      vars:
        card-background: "#111118"
        card-border-color: "#2a2a3a"
        card-header-background: "#111118"
        card-footer-background: "#181822"
        card-footer-font-size: "var(--font-size-xs)"

    - name: Buttons
      vars:
        btn-font-family: "var(--font-display)"
        btn-font-weight: "600"
        btn-font-size: "12px"
        btn-letter-spacing: "0.1em"
        btn-background: "#00fff0"
        btn-color: "#0a0a0f"
        btn-border-color: "transparent"
        btn-hover-background: "#33fff3"
        btn-hover-border-color: "transparent"
        btn-outline-background: "transparent"
        btn-outline-color: "#00fff0"
        btn-outline-hover-background: "rgba(0,255,240,0.1)"

    - name: Toggle
      vars:
        sg-section-title-font-family: "var(--font-display)"
        sg-section-title-text-transform: "uppercase"
        sg-section-title-letter-spacing: "0.05em"
        sg-section-title-color: "var(--text)"
        sg-section-number-bg: "rgba(0,255,240,0.1)"
        sg-section-number-border: "1px solid rgba(0,255,240,0.3)"
        sg-section-number-color: "#00fff0"
        sg-section-number-radius: "var(--radius-md)"
        sg-section-desc-font-family: "var(--font-body, var(--font-mono))"
        sg-section-desc-color: "var(--text-muted)"
        hr-section-color: "linear-gradient(90deg, var(--teal), var(--fuchsia))"
        hr-section-height: "2px"
        hr-subsection-color: "linear-gradient(90deg, var(--teal), transparent)"
        hr-subsection-height: "1px"
        hr-accent-color: "var(--teal)"
        sg-type-specimen-bg: "#111118"
        sg-type-specimen-border: "1px solid #2a2a3a"
        sg-type-specimen-border-bottom: "1px solid #2a2a3a"
        sg-type-specimen-radius: "var(--radius-md)"
        sg-type-specimen-padding: "var(--space-3)"
        sg-type-specimen-margin: "0 0 var(--space-3) 0"
        sg-type-specimen-name-color: "#00fff0"
        sg-type-specimen-name-font: "var(--font-display)"

    - name: "HUI: Focus & Interaction"
      vars:
        hui-focus-ring-color: "rgba(0,255,240,0.3)"
        hui-focus-ring-width: "2px"

    - name: "HUI: Controls"
      vars:
        hui-control-color: "#00fff0"
        hui-control-bg: "#0a0a0f"
        hui-control-border: "#2a2a3a"
        hui-control-shadow: "inset 0 0 6px rgba(0,255,240,0.05)"
        hui-checkbox-radius: "2px"
        hui-switch-track-on-bg: "#00fff0"
        hui-switch-track-off-bg: "#2a2a3a"
        hui-switch-thumb-shadow: "0 0 6px rgba(0,255,240,0.3)"
        hui-radio-option-border: "#2a2a3a"
        hui-radio-option-border-active: "#00fff0"
        hui-radio-option-bg-active: "rgba(0,255,240,0.05)"

    - name: "HUI: Trigger Buttons"
      vars:
        hui-trigger-bg: "#111118"
        hui-trigger-border: "#2a2a3a"
        hui-trigger-border-hover: "#00fff0"
        hui-trigger-color: "#e0e0e8"
        hui-trigger-transition: "border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease"

    - name: "HUI: Overlay Panels"
      vars:
        hui-panel-bg: "#111118"
        hui-panel-border: "#2a2a3a"
        hui-panel-shadow: "0 8px 32px rgba(0,0,0,0.6), 0 0 1px rgba(0,255,240,0.1)"
        hui-panel-item-active-bg: "rgba(0,255,240,0.08)"
        hui-panel-item-active-color: "#00fff0"
        hui-panel-sep-color: "#2a2a3a"

    - name: "HUI: Tabs"
      vars:
        hui-tab-color: "#555570"
        hui-tab-color-selected: "#00fff0"
        hui-tab-border-selected: "#00fff0"
        hui-tab-color-hover: "#e0e0e8"
        hui-tab-list-border: "#2a2a3a"

    - name: "HUI: Disclosure"
      vars:
        hui-disclosure-bg: "#1e1e2a"
        hui-disclosure-bg-hover: "#32324a"
        hui-disclosure-border: "#2a2a3a"
        hui-disclosure-color: "#e0e0e8"
        hui-disclosure-panel-bg: "#111118"
        hui-disclosure-panel-color: "#8888a0"
        hui-disclosure-chevron-color: "#00fff0"

    - name: "HUI: Field Controls"
      vars:
        hui-field-bg: "#0a0a0f"
        hui-field-border: "#2a2a3a"
        hui-field-border-hover: "#555570"
        hui-field-focus-border: "#00fff0"
        hui-field-color: "#e0e0e8"
        hui-field-shadow: "inset 0 0 8px rgba(0,0,0,0.3)"
        hui-combo-placeholder-color: "#555570"
        hui-combo-btn-color: "#555570"

    - name: "HUI: Dialog"
      vars:
        hui-dialog-bg: "#111118"
        hui-dialog-shadow: "0 24px 64px rgba(0,0,0,0.7), 0 0 2px rgba(0,255,240,0.15)"
        hui-dialog-title-color: "#e0e0e8"
        hui-dialog-body-color: "#8888a0"
        hui-dialog-backdrop: "rgba(0,0,0,0.8)"

    - name: "HUI: Showcase Grid"
      vars:
        hui-showcase-accent: "#00fff0"
        hui-showcase-bg: "#111118"
        hui-showcase-border: "#2a2a3a"
        hui-showcase-cell-bg: "#0a0a0f"
        hui-showcase-cell-border: "#2a2a3a"
        hui-showcase-label-color: "#555570"

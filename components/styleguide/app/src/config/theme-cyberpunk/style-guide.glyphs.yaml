glyph-language:
  description: >
    Unicode glyphs are the primary symbol language — no icon fonts, no SVG sprites.
    Every glyph chosen for this system is a Unicode code point that renders natively in
    any font, scales infinitely, requires zero HTTP requests, and degrades gracefully
    in plain-text contexts. The rule is: if a standard Unicode character communicates
    the intent, use it.

  principles:
    - rule: "Unicode over icon fonts."
      detail: "Icon fonts are font-file dependencies that fail on load errors and produce invisible squares in plain-text fallback. Unicode glyphs are always available."
    - rule: "Semantic intent, not decoration."
      detail: "Every glyph must carry meaning that a screen reader can interpret via aria-label. Purely decorative symbols should be aria-hidden."
    - rule: "Consistency within context."
      detail: "Use the same glyph for the same action everywhere. ✕ always means close. → always means forward. Inconsistency breaks user expectations."
    - rule: "Size from the type scale, not px."
      detail: "Glyphs inherit font-size from their parent element. Do not hardcode sizes — let the component's type token control the glyph scale."
    - rule: "Test across platforms."
      detail: "Unicode rendering varies by OS and font stack. Test on macOS, Windows, and Android before finalising a glyph for production use."

  sections:
    - name: ui
      title: "UI & Navigation"
      description: >
        Controls, affordances, and navigational cues — the symbols users interact with.
        Prefer high-contrast geometric forms (arrows, circles, crosses) that read at 12–16px.
        Avoid characters that look similar across different fonts or could be confused
        with each other at small sizes.
      glyphs:
        # Navigation
        - glyph: "≡"
          name: "Trigram / Hamburger"
          code: "U+2261"
          use: "Mobile nav drawer toggle"
          example: "≡ Menu"
        - glyph: "⋮"
          name: "Vertical Ellipsis"
          code: "U+22EE"
          use: "More options / kebab menu"
          example: "⋮"
        - glyph: "⋯"
          name: "Horizontal Ellipsis"
          code: "U+22EF"
          use: "Overflow indicator, truncation"
          example: "Files ⋯"
        - glyph: "✕"
          name: "Cross / Close"
          code: "U+2715"
          use: "Dismiss, close modal, clear field"
          example: "✕ Close"
        - glyph: "←"
          name: "Left Arrow"
          code: "U+2190"
          use: "Back navigation"
          example: "← Back"
        - glyph: "→"
          name: "Right Arrow"
          code: "U+2192"
          use: "Forward, CTA, next step"
          example: "Continue →"
        - glyph: "↑"
          name: "Up Arrow"
          code: "U+2191"
          use: "Scroll to top, expand up"
          example: "↑ Top"
        - glyph: "↓"
          name: "Down Arrow"
          code: "U+2193"
          use: "Expand, collapse toggle"
          example: "Show more ↓"
        - glyph: "↗"
          name: "NE Arrow"
          code: "U+2197"
          use: "External link indicator"
          example: "Docs ↗"
        - glyph: "›"
          name: "Chevron Right"
          code: "U+203A"
          use: "Breadcrumb separator, nested nav"
          example: "Home › Settings › Profile"
        - glyph: "⌘"
          name: "Command"
          code: "U+2318"
          use: "Keyboard shortcut label (macOS)"
          example: "⌘K to search"
        # Actions
        - glyph: "⚙"
          name: "Gear"
          code: "U+2699"
          use: "Settings, configuration"
          example: "⚙ Settings"
        - glyph: "⊕"
          name: "Circled Plus"
          code: "U+2295"
          use: "Add, create new item"
          example: "⊕ New project"
        - glyph: "✓"
          name: "Check"
          code: "U+2713"
          use: "Confirm, done, success state"
          example: "✓ Saved"
        - glyph: "✎"
          name: "Pencil"
          code: "U+270E"
          use: "Edit, rename"
          example: "✎ Edit"
        - glyph: "⟳"
          name: "Clockwise Arrow"
          code: "U+27F3"
          use: "Refresh, retry, reload"
          example: "⟳ Refresh"
        - glyph: "⇄"
          name: "Left-Right Arrow"
          code: "U+21C4"
          use: "Swap, toggle between two states"
          example: "⇄ Switch view"
        # Status
        - glyph: "●"
          name: "Filled Circle"
          code: "U+25CF"
          use: "Active status, online presence"
          example: "● Online"
        - glyph: "○"
          name: "Empty Circle"
          code: "U+25CB"
          use: "Inactive, offline, unselected"
          example: "○ Offline"
        - glyph: "◉"
          name: "Bullseye"
          code: "U+25C9"
          use: "Radio button selected state"
          example: "◉ Selected"
        - glyph: "★"
          name: "Filled Star"
          code: "U+2605"
          use: "Favorite, bookmarked, pinned"
          example: "★ Starred"
        - glyph: "☆"
          name: "Empty Star"
          code: "U+2606"
          use: "Unfavorited, add to favorites"
          example: "☆ Star"
        - glyph: "▲"
          name: "Triangle Up"
          code: "U+25B2"
          use: "Warning indicator, sort asc"
          example: "▲ Warning"
        # Layout
        - glyph: "⊞"
          name: "Squared Plus"
          code: "U+229E"
          use: "Grid / tile view"
          example: "⊞ Grid view"
        - glyph: "⊟"
          name: "Squared Minus"
          code: "U+229F"
          use: "Collapse, minimize panel"
          example: "⊟ Collapse"
        - glyph: "⊠"
          name: "Squared X"
          code: "U+22A0"
          use: "Close panel, remove widget"
          example: "⊠ Remove"

    - name: typography
      title: "Typography & Text"
      description: >
        Typographic punctuation and inline markers used in editorial and body content.
        These glyphs follow print conventions — curly quotes instead of inch marks,
        em dashes instead of double hyphens, proper ellipsis instead of three periods.
        Apply consistently via content style guide and input sanitisation.
      glyphs:
        - glyph: "→"
          name: "Right Arrow"
          use: "Inline CTA, action prompt, list items"
          example: "→ Read the full guide"
        - glyph: "•"
          name: "Bullet"
          use: "Unordered list items"
          example: "• First item\n• Second item"
        - glyph: "›"
          name: "Chevron"
          use: "Breadcrumb separator"
          example: "Home › Docs › API"
        - glyph: "—"
          name: "Em Dash"
          use: "Parenthetical aside, range, attribution"
          example: "Designed — not just built."
        - glyph: "–"
          name: "En Dash"
          use: "Numeric range"
          example: "Pages 12–24"
        - glyph: "…"
          name: "Horizontal Ellipsis"
          use: "Text truncation, continuation"
          example: "Loading…"
        - glyph: "\u201C\u201D"
          name: "Curly Quotes"
          use: "Blockquotes, pull quotes, emphasis"
          example: "\u201CDesign is how it works.\u201D"
        - glyph: "×"
          name: "Multiplication Sign"
          use: "Dimensions, resolution (not letter x)"
          example: "1920×1080"
        - glyph: "°"
          name: "Degree"
          use: "Angle, temperature measurements"
          example: "Rotate 45°"
        - glyph: "↗"
          name: "NE Arrow"
          use: "External link in body text"
          example: "See RFC 2119 ↗"
        - glyph: "★"
          name: "Star"
          use: "Rating, highlight, featured callout"
          example: "★★★★☆ 4/5"
        - glyph: "§"
          name: "Section Sign"
          use: "Section reference in legal/doc text"
          example: "See §4.2"
        - glyph: "†"
          name: "Dagger"
          use: "Footnote marker"
          example: "Note†"

scoped-vars:
  prefix: "theme"

  sections:
    standard:
      selector: 'html[data-design-theme="cyberpunk"]'
      prefix: "theme"
    dark:
      selector: 'html[data-design-theme="cyberpunk"].dark'
      prefix: "theme"
    layout:
      selector: 'html[data-design-theme="cyberpunk"]'
      prefix: "layout"

  vars:
    # Content container
    - name: content-container-type
      value: "inline-size"
      selector: ".content"
      selector-body: "container-type: var(--theme-content-container-type)"

    - name: content-position
      value:
        - section: standard
          value: "relative"
      selector: ".content"
      selector-body: "position: var(--theme-content-position)"

    # Color modes — light (bright cyberpunk) / dark (void)
    - name: surface
      value:
        - section: standard
          value: "#f0f0f5"
        - section: dark
          value: "#0a0a0f"

    - name: surface-alt
      value:
        - section: standard
          value: "#e4e4ec"
        - section: dark
          value: "#111118"

    - name: surface-inverse
      value:
        - section: standard
          value: "#1a1a2e"
        - section: dark
          value: "#e0e0e8"

    - name: text
      value:
        - section: standard
          value: "#1a1a2e"
        - section: dark
          value: "#e0e0e8"

    - name: text-secondary
      value:
        - section: standard
          value: "#44445a"
        - section: dark
          value: "#8888a0"

    - name: text-muted
      value:
        - section: standard
          value: "#77779a"
        - section: dark
          value: "#555570"

    - name: text-inverse
      value:
        - section: standard
          value: "#f0f0f5"
        - section: dark
          value: "#0a0a0f"

    - name: border
      value:
        - section: standard
          value: "#c8c8d8"
        - section: dark
          value: "#2a2a3a"

    - name: border-strong
      value:
        - section: standard
          value: "#a8a8bc"
        - section: dark
          value: "#32324a"

    - name: shadow-color
      value:
        - section: standard
          value: "rgba(0,0,0,0.12)"
        - section: dark
          value: "rgba(0,0,0,0.6)"

    # Light-mode brand accent overrides (darken neons for contrast)
    - name: brand-red
      value:
        - section: standard
          value: "#cc2255"
    - name: brand-blue
      value:
        - section: standard
          value: "#3355dd"
    - name: brand-yellow
      value:
        - section: standard
          value: "#88cc00"

    # Layout presets
    - name: standard
      value:
        - section: layout
          values:
            max-width: "1200px"
            padding: "var(--space-6)"
            margin: "0 auto"
            content-bg: "transparent"
      selector: ".content"
      selector-body: "max-width: var(--layout-standard-max-width); padding: var(--layout-standard-padding); margin: var(--layout-standard-margin); background: var(--layout-standard-content-bg)"

    - name: wide
      value:
        - section: layout
          values:
            max-width: "1440px"
            padding: "var(--space-6)"
            margin: "0 auto"
            content-bg: "transparent"
      selector: ".content.wide"
      selector-body: "max-width: var(--layout-wide-max-width); padding: var(--layout-wide-padding); margin: var(--layout-wide-margin); background: var(--layout-wide-content-bg)"

    - name: full
      value:
        - section: layout
          values:
            max-width: "100%"
            padding: "var(--space-4)"
            margin: "0"
            content-bg: "transparent"
      selector: ".content.full"
      selector-body: "max-width: var(--layout-full-max-width); padding: var(--layout-full-padding); margin: var(--layout-full-margin); background: var(--layout-full-content-bg)"

    - name: narrow
      value:
        - section: layout
          values:
            max-width: "720px"
            padding: "var(--space-6)"
            margin: "0 auto"
            content-bg: "transparent"
      selector: ".content.narrow"
      selector-body: "max-width: var(--layout-narrow-max-width); padding: var(--layout-narrow-padding); margin: var(--layout-narrow-margin); background: var(--layout-narrow-content-bg)"

    - name: article
      value:
        - section: layout
          values:
            max-width: "860px"
            padding: "var(--space-6)"
            margin: "0 auto"
            content-bg: "transparent"
      selector: ".content.article"
      selector-body: "max-width: var(--layout-article-max-width); padding: var(--layout-article-padding); margin: var(--layout-article-margin); background: var(--layout-article-content-bg)"

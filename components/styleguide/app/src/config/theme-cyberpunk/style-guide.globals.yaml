toast:
  position: top-right
  duration: 8000
  gap: 16
  expand: true
  visible-toasts: 4

globals: |
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: var(--base-font-size); -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
  body {
    font-family: var(--base-font-family);
    color: var(--base-font-color);
    background: var(--base-background);
    line-height: var(--base-line-height);
  }
  html[data-design-theme="cyberpunk"] ::selection { background: rgba(0,255,240,0.2); color: #00fff0; }
  html[data-design-theme="cyberpunk"].dark ::selection { background: rgba(0,255,240,0.2); color: #00fff0; }
  html[data-design-theme="cyberpunk"]:not(.dark) ::selection { background: rgba(0,255,240,0.15); color: #008880; }
  /* Cyberpunk grid background — dark mode only */
  html[data-design-theme="cyberpunk"].dark body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image:
      linear-gradient(rgba(0,255,240,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,240,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: -1;
  }
  /* Scanline overlay — dark mode only */
  html[data-design-theme="cyberpunk"].dark body::after {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,255,240,0.015) 2px, rgba(0,255,240,0.015) 4px);
    pointer-events: none;
    z-index: 9999;
  }
  /* Light mode: subtle grid with muted tint */
  html[data-design-theme="cyberpunk"]:not(.dark) body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image:
      linear-gradient(rgba(0,100,100,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,100,100,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: -1;
  }

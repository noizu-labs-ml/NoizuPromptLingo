# Cyberpunk light: bright surfaces, dark neon accents
# Cyberpunk dark: void surfaces, glowing neon accents
color-modes:
  light:
    surface: "#f0f0f5"
    surface-alt: "#e4e4ec"
    surface-inverse: "#1a1a2e"
    text: "#1a1a2e"
    text-secondary: "#44445a"
    text-muted: "#77779a"
    text-inverse: "#f0f0f5"
    border: "#c8c8d8"
    border-strong: "#a8a8bc"
    shadow-color: "rgba(0,0,0,0.12)"
  dark:
    surface: "#0a0a0f"
    surface-alt: "#111118"
    surface-inverse: "#e0e0e8"
    text: "#e0e0e8"
    text-secondary: "#8888a0"
    text-muted: "#555570"
    text-inverse: "#0a0a0f"
    border: "#2a2a3a"
    border-strong: "#32324a"
    shadow-color: "rgba(0,0,0,0.6)"

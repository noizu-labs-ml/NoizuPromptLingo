typography:
  - var: font-sans
    name: Space Grotesk
    description: "Geometric sans-serif. The voice of the grid — rational, direct, precisely spaced. Every letterform follows the unit system."
    usage: "Everything except code. Headlines, body, labels, UI text, navigation."
    weights: [300, 400, 500, 600, 700]
    colors:
      - label: "Black"
        value: "#000000"
        note: "Primary text — maximum contrast, full weight."
      - label: "Bauhaus Red"
        value: "#e20613"
        note: "Accent — the primary structural color. Use for emphasis, links, accents."

  - var: font-mono
    name: IBM Plex Mono
    description: "Technical annotations, code, metadata. The machine's voice — neutral, reliable, exact."
    usage: "Code blocks, terminal output, labels, version numbers, data."
    weights: [300, 400, 500, 600]

typography-classes:
  - name: Display
    class: typography-display
    font-family: "var(--font-sans)"
    font-size: "56px"
    font-weight: "700"
    line-height: "0.95"
    letter-spacing: "-0.04em"
    sample: "The system works."
    usage: "Hero headlines, page titles"

  - name: Heading 1
    class: typography-h1
    font-family: "var(--font-sans)"
    font-size: "28px"
    font-weight: "700"
    line-height: "1.15"
    letter-spacing: "-0.02em"
    sample: "Agent Orchestrator"
    usage: "Section titles, primary headings"

  - name: Heading 2
    class: typography-h2
    font-family: "var(--font-sans)"
    font-size: "20px"
    font-weight: "600"
    line-height: "1.3"
    letter-spacing: "-0.01em"
    sample: "Story Implementation"
    usage: "Subsection headers, card titles"

  - name: Body
    class: typography-body
    font-family: "var(--font-sans)"
    font-size: "15px"
    font-weight: "400"
    line-height: "1.6"
    sample: "The guided pipeline transforms rough sketches into deployed products. Each phase is a focused, bounded interaction. AI agents handle the heavy lifting; the user steers. Put your pen down and let the machines work."
    usage: "Paragraphs, descriptions, long-form content"

  - name: Code
    class: typography-code
    font-family: "var(--font-mono)"
    font-size: "13px"
    font-weight: "400"
    line-height: "1.8"
    sample: "const agent = await orchestrator.spawn('coder', { story: 'INK-042' });\nagent.on('complete', (diff) => reviewer.submit(diff));"
    usage: "Code blocks, terminal output, data displays"

  - name: Label
    class: typography-label
    font-family: "var(--font-sans)"
    font-size: "11px"
    font-weight: "700"
    line-height: "1.4"
    letter-spacing: "0.06em"
    sample: "Agent Status · Last Updated 3s Ago · Phase: Ink"
    usage: "Section labels, status text, navigation items"

  - name: Data
    class: typography-data
    font-family: "var(--font-mono)"
    font-size: "10px"
    font-weight: "500"
    line-height: "1.4"
    sample: "INK-042 · 8,241 tokens · 12/12 passing · 40s elapsed"
    usage: "Metadata, timestamps, counters, mono-spaced details"

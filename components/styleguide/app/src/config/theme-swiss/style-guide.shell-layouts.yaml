shell-layouts:
  - name: navbar-only
    title: Navbar Only
    description: "Top navigation bar only. Clean horizontal chrome — content fills the full viewport below."
    chrome:
      navbar:
        height: "56px"
        background: "var(--black)"
        color: "var(--white)"
        label: "Nav"
      footer:
        height: "48px"
        background: "var(--gray-100)"
        color: "var(--gray-600)"
        label: "Footer"
    zones:
      - label: "Content"
        background: "var(--white)"
        color: "var(--black)"
        ratio: 1

  - name: sidebar-left
    title: Sidebar Left
    description: "Fixed left sidebar with top nav. Standard tool layout — navigation column, full content area right."
    chrome:
      navbar:
        height: "56px"
        background: "var(--black)"
        color: "var(--white)"
        label: "App Bar"
      sidebar:
        width: "240px"
        background: "var(--gray-900)"
        color: "var(--white)"
        label: "Nav"
      footer:
        height: "32px"
        background: "var(--gray-100)"
        color: "var(--gray-500)"
        label: "Status Bar"
    zones:
      - label: "Main Content"
        background: "var(--white)"
        color: "var(--black)"
        ratio: 1

  - name: sidebar-right
    title: Sidebar Right
    description: "Content primary, context secondary. Main content left, inspector or metadata column right."
    chrome:
      navbar:
        height: "56px"
        background: "var(--black)"
        color: "var(--white)"
        label: "App Bar"
      aside:
        width: "280px"
        background: "var(--gray-50)"
        color: "var(--gray-700)"
        label: "Inspector"
    zones:
      - label: "Content"
        background: "var(--white)"
        color: "var(--black)"
        ratio: 1

  - name: two-sidebar
    title: Two Sidebar
    description: "Three-column IDE layout. File tree left, editor center, properties right. Maximum information density."
    chrome:
      navbar:
        height: "40px"
        background: "var(--gray-900)"
        color: "var(--white)"
        label: "Toolbar"
      sidebar:
        width: "220px"
        background: "var(--gray-800)"
        color: "var(--gray-300)"
        label: "Files"
      aside:
        width: "260px"
        background: "var(--gray-800)"
        color: "var(--gray-300)"
        label: "Properties"
    zones:
      - label: "Editor"
        background: "var(--gray-900)"
        color: "var(--white)"
        ratio: 1

  - name: full-bleed
    title: Full Bleed
    description: "Edge-to-edge content. No sidebar. Minimal chrome. The grid fills the entire viewport."
    chrome:
      navbar:
        height: "48px"
        background: "var(--black)"
        color: "var(--white)"
        label: "Nav"
    zones:
      - label: "Hero"
        background: "var(--black)"
        color: "var(--white)"
        ratio: 2
      - label: "Content"
        background: "var(--white)"
        color: "var(--black)"
        ratio: 3
      - label: "CTA"
        background: "var(--red-light)"
        color: "var(--black)"
        ratio: 1

toast:
  position: top-right
  duration: 8000
  gap: 16
  expand: true
  visible-toasts: 4

globals: |
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: var(--base-font-size); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; scroll-behavior: smooth; }
  body {
    font-family: var(--base-font-family);
    color: var(--base-font-color);
    background: var(--base-background);
    line-height: var(--base-line-height);
  }
  html[data-design-theme="swiss"] ::selection { background: var(--yellow); color: var(--black); }
  [data-design-theme="swiss"] { font-variant-ligatures: none; }

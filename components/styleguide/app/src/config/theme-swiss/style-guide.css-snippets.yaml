  - name: Swiss Grid Effects & Dashboard
    slug: ink-effects-sumi
    title: "Grid effects panel and agent dashboard"
    description: "Animation demos with Bauhaus geometry, and a 3-panel agent dashboard."
    target-section: ink-effects
    body: |
      /* --- Keyframes (grid-drop, bar-slide, fade-up — bar-slide & grid-drop in intro-hero) --- */
      @keyframes grid-stamp {
        0% { transform: scale(1.15); opacity: 0; }
        60% { transform: scale(0.97); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
      }
      @keyframes pulse-block {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.08); opacity: 0.8; }
      }
      @keyframes fade-up {
        0% { opacity: 0; transform: translateY(12px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      /* --- Effects Grid --- */
      html[data-design-theme="swiss"] .effects-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: var(--space-3, 16px);
        margin-bottom: var(--space-6, 48px);
      }
      html[data-design-theme="swiss"] .effect-card {
        background: var(--surface, #ffffff);
        border: 2px solid var(--black, #0a0a0a);
        border-radius: 0;
        box-shadow: 4px 4px 0 var(--gray-200, #e0e0e0);
        min-height: 180px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: var(--space-3, 16px);
        gap: var(--space-2, 8px);
      }
      html[data-design-theme="swiss"] .effect-label {
        font-family: var(--font-mono);
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        color: var(--text-muted, #666);
      }

      /* Demo: Grid Stamp (replaces ink-bleed) */
      html[data-design-theme="swiss"] .ink-bleed-kanji {
        font-family: var(--font-sans);
        font-size: 64px;
        font-weight: 900;
        font-style: normal;
        color: var(--black, #0a0a0a);
        animation: grid-stamp 0.6s ease-out;
      }

      /* Demo: Slide-in text (replaces brush-in) */
      html[data-design-theme="swiss"] .brush-in-text {
        font-family: var(--font-sans);
        font-size: 32px;
        font-weight: 900;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        color: var(--black, #0a0a0a);
        animation: fade-up 0.5s ease-out;
      }

      /* Demo: Pulse block (replaces breath circle) */
      html[data-design-theme="swiss"] .breath-circle {
        display: block;
        width: 32px;
        height: 32px;
        border-radius: 0;
        background: var(--red, #e63329);
        animation: pulse-block 2s ease-in-out infinite;
      }

      /* Demo: Grid Stamp glyph (replaces seal-stamp) */
      html[data-design-theme="swiss"] .seal-stamp-glyph {
        font-family: var(--font-sans);
        font-size: 28px;
        font-weight: 900;
        color: var(--black, #0a0a0a);
        background: var(--yellow, #ffe600);
        border: 2px solid var(--black, #0a0a0a);
        border-radius: 0;
        width: 56px;
        height: 56px;
        line-height: 52px;
        text-align: center;
        display: inline-block;
        animation: grid-stamp 0.6s ease-out 0.2s both;
      }

      /* Demo: Color Bar (replaces ink-wash gradient) */
      html[data-design-theme="swiss"] .ink-wash-bar {
        width: 100%;
        height: 24px;
        border-radius: 0;
        border: 2px solid var(--black, #0a0a0a);
        background: linear-gradient(
          90deg,
          var(--black, #0a0a0a) 0%,
          var(--black, #0a0a0a) 25%,
          var(--red, #e63329) 25%,
          var(--red, #e63329) 50%,
          var(--blue, #0057b8) 50%,
          var(--blue, #0057b8) 75%,
          var(--yellow, #ffe600) 75%,
          var(--yellow, #ffe600) 100%
        );
      }

      /* Demo: Fade Up */
      html[data-design-theme="swiss"] .fade-up-text {
        font-family: var(--font-sans);
        font-size: 28px;
        font-weight: 900;
        font-style: normal;
        text-transform: uppercase;
        letter-spacing: -0.02em;
        color: var(--black, #0a0a0a);
        animation: fade-up 0.5s ease-out;
      }

      /* --- Reduced Motion --- */
      @media (prefers-reduced-motion: reduce) {
        html[data-design-theme="swiss"] .ink-bleed-kanji,
        html[data-design-theme="swiss"] .brush-in-text,
        html[data-design-theme="swiss"] .breath-circle,
        html[data-design-theme="swiss"] .seal-stamp-glyph,
        html[data-design-theme="swiss"] .fade-up-text {
          animation: none;
          opacity: 1;
          transform: none;
          clip-path: none;
        }
      }

      /* --- Agent Dashboard --- */
      html[data-design-theme="swiss"] .agent-dashboard {
        display: grid;
        grid-template-columns: 220px 1fr 240px;
        gap: 2px;
        margin-top: var(--space-4, 24px);
        background: var(--black, #0a0a0a);
        border: 2px solid var(--black, #0a0a0a);
        border-radius: 0;
        overflow: hidden;
      }
      html[data-design-theme="swiss"] .dashboard-panel {
        background: var(--surface, #ffffff);
        padding: var(--space-3, 16px);
      }
      html[data-design-theme="swiss"] .dashboard-panel-title {
        font-family: var(--font-mono);
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        color: var(--text-muted, #666);
        font-weight: 700;
        margin-bottom: var(--space-2, 8px);
        padding-bottom: var(--space-1, 4px);
        border-bottom: 1px solid var(--gray-200, #e0e0e0);
      }

      /* Stories Panel */
      html[data-design-theme="swiss"] .story-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      html[data-design-theme="swiss"] .story-item {
        font-family: var(--font-sans);
        font-size: 13px;
        color: var(--text-secondary, #444);
        padding: 6px 0;
        border-bottom: 1px solid var(--gray-200, #e0e0e0);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      html[data-design-theme="swiss"] .story-item:last-child {
        border-bottom: none;
      }
      html[data-design-theme="swiss"] .story-id {
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--text-muted, #666);
        letter-spacing: 0.05em;
      }
      html[data-design-theme="swiss"] .story-item--done {
        text-decoration: line-through;
        color: var(--text-muted, #999);
      }
      html[data-design-theme="swiss"] .story-item--active {
        color: var(--black, #0a0a0a);
        font-weight: 700;
      }
      html[data-design-theme="swiss"] .story-item--active .story-id {
        color: var(--red, #e63329);
      }
      html[data-design-theme="swiss"] .story-item--queued {
        color: var(--text-muted, #999);
      }

      /* Live Output Panel */
      html[data-design-theme="swiss"] .dashboard-panel--output {
        background: var(--black, #0a0a0a);
      }
      html[data-design-theme="swiss"] .dashboard-panel--output .dashboard-panel-title {
        color: var(--gray-400, #888);
        border-bottom-color: var(--gray-700, #333);
      }
      html[data-design-theme="swiss"] .live-output {
        font-family: var(--font-mono);
        font-size: 11px;
        line-height: 1.8;
        color: var(--gray-400, #aaa);
        margin-bottom: var(--space-2, 8px);
      }
      html[data-design-theme="swiss"] .output-line {
        padding: 2px 0;
      }
      html[data-design-theme="swiss"] .output-line--active {
        color: var(--yellow, #ffe600);
      }
      html[data-design-theme="swiss"] .output-ts {
        color: var(--gray-600, #555);
        margin-right: 8px;
      }

      /* Agent Controls */
      html[data-design-theme="swiss"] .agent-controls {
        display: flex;
        gap: 8px;
        padding-top: var(--space-2, 8px);
        border-top: 1px solid var(--gray-700, #333);
      }
      html[data-design-theme="swiss"] .agent-btn {
        font-family: var(--font-sans);
        font-size: 9px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        padding: 4px 12px;
        border: 2px solid var(--gray-400, #888);
        background: transparent;
        color: var(--gray-400, #aaa);
        border-radius: 0;
        cursor: pointer;
        transition: border-color 0.1s ease, color 0.1s ease;
      }
      html[data-design-theme="swiss"] .agent-btn:hover {
        border-color: var(--yellow, #ffe600);
        color: var(--yellow, #ffe600);
      }
      html[data-design-theme="swiss"] .agent-btn--primary {
        background: var(--red, #e63329);
        border-color: var(--red, #e63329);
        color: var(--white, #ffffff);
      }
      html[data-design-theme="swiss"] .agent-btn--primary:hover {
        background: var(--black, #0a0a0a);
        border-color: var(--red, #e63329);
        color: var(--red, #e63329);
      }

      /* Criteria Panel */
      html[data-design-theme="swiss"] .criteria-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      html[data-design-theme="swiss"] .criteria-item {
        font-family: var(--font-sans);
        font-size: 12px;
        color: var(--text-secondary, #444);
        padding: 5px 0;
        padding-left: 20px;
        position: relative;
        border-bottom: 1px solid var(--gray-200, #e0e0e0);
      }
      html[data-design-theme="swiss"] .criteria-item:last-child {
        border-bottom: none;
      }
      html[data-design-theme="swiss"] .criteria-item::before {
        position: absolute;
        left: 0;
        top: 5px;
        font-size: 11px;
        font-family: var(--font-mono);
      }
      html[data-design-theme="swiss"] .criteria-item--done::before {
        content: "\2713";
        color: var(--blue, #0057b8);
        font-weight: 700;
      }
      html[data-design-theme="swiss"] .criteria-item--done {
        color: var(--text-muted, #999);
        text-decoration: line-through;
      }
      html[data-design-theme="swiss"] .criteria-item--pending::before {
        content: "\25A1";
        color: var(--text-muted, #999);
      }


  - name: Swiss Screen Frames

        font-family: var(--font-mono);
      }
      html[data-design-theme="swiss"] .screen-dashboard-line-active {
        color: var(--yellow, #ffe600);
      }
      html[data-design-theme="swiss"] .screen-dashboard-criteria {
        font-family: var(--font-sans);
        font-size: 12px;
        color: var(--text-muted, #666);
        padding: 6px 0;
        border-bottom: 1px solid var(--gray-200, #e0e0e0);
      }
      html[data-design-theme="swiss"] .screen-dashboard-criteria:last-child {
        border-bottom: none;
      }
      html[data-design-theme="swiss"] .screen-dashboard-criteria.done::before {
        content: '\2713  ';
        color: var(--blue, #0057b8);
        font-weight: 700;
      }
      html[data-design-theme="swiss"] .screen-dashboard-criteria.pending::before {
        content: '\25A1  ';
        color: var(--gray-300, #ccc);
      }

      /* ── Responsive ── */
      @media (max-width: 640px) {
        html[data-design-theme="swiss"] .screen-features {
          grid-template-columns: 1fr;
        }
        html[data-design-theme="swiss"] .settings-layout {
          grid-template-columns: 1fr;
        }
        html[data-design-theme="swiss"] .screen-sidebar {
          flex-direction: row;
          flex-wrap: wrap;
          gap: 6px;
        }
        html[data-design-theme="swiss"] .screen-nav-links {
          display: none;
        }
      }

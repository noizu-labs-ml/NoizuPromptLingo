# Redundancy audit (2026-03-23): all snippets reviewed against scoped-vars.yaml.
# scoped-vars handles: surface, surface-alt, surface-inverse, text, text-secondary,
# text-muted, text-inverse, border, border-strong, shadow-color, and layout
# (.content max-width/padding/margin/bg).
# Every snippet below adds behavior beyond token declaration (@keyframes animations,
# pseudo-class hover effects, box-shadow, font-family/style overrides on specific
# component selectors). None are redundant — all retained.

css-snippets:
  - name: Swiss Intro Hero
    slug: intro-hero
    title: "Bauhaus intro with geometric glyph and color bar"
    description: "Heavy sans-serif title, geometric block glyph, color accent bar, uppercase label."
    target-section: intro
    body: |
      html[data-design-theme="swiss"] .sg-intro-hero {
        text-align: center;
        padding: 64px 32px 0;
        margin-bottom: 48px;
        border: 2px solid var(--black, #000);
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      html[data-design-theme="swiss"] .sg-intro-glyph {
        font-size: 36px;
        color: var(--gray-400, #9e9e9e);
        display: block;
        margin: 0 auto 24px;
        background: none;
        border: none;
        box-shadow: none;
        line-height: 1;
        order: -1;
      }
      html[data-design-theme="swiss"] .sg-intro-title {
        font-family: var(--font-sans);
        font-size: clamp(36px, 5vw, 56px);
        font-weight: 700;
        font-style: normal;
        letter-spacing: -0.04em;
        line-height: 1;
        color: var(--black, #000);
        text-transform: none;
        text-shadow: none;
      }
      html[data-design-theme="swiss"] .sg-intro-title::before,
      html[data-design-theme="swiss"] .sg-intro-title::after {
        content: none;
      }
      html[data-design-theme="swiss"] .sg-intro-subtitle {
        font-family: var(--font-sans);
        font-size: 11px;
        color: var(--gray-500, #757575);
        letter-spacing: 0.2em;
        text-transform: uppercase;
        margin-top: 16px;
        font-weight: 400;
      }
      html[data-design-theme="swiss"] .sg-intro-quote {
        font-family: var(--font-sans);
        font-size: 16px;
        font-style: italic;
        font-weight: 400;
        color: var(--gray-600, #616161);
        max-width: 560px;
        margin: 24px auto 48px;
        line-height: 1.6;
        border-left: none;
        padding-left: 0;
      }
      html[data-design-theme="swiss"] .sg-intro-meta {
        display: flex;
        gap: 24px;
        margin-top: 32px;
        font-family: var(--font-sans);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--gray-500, #757575);
        justify-content: center;
      }
      html[data-design-theme="swiss"] .sg-intro-color-bar {
        display: flex;
        height: 8px;
        margin-top: 40px;
        overflow: hidden;
        width: calc(100% + 64px);
        margin-left: -32px;
        margin-right: -32px;
      }
      html[data-design-theme="swiss"] .sg-intro-color-bar::before,
      html[data-design-theme="swiss"] .sg-intro-color-bar::after {
        content: none;
      }
      html[data-design-theme="swiss"] .sg-intro-color-bar > * {
        flex: 1;
      }
      html[data-design-theme="swiss"] .sg-intro-meta-cards {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0;
        width: calc(100% + 64px);
        margin-left: -32px;
        margin-right: -32px;
        border-top: 2px solid var(--black, #000);
      }
      html[data-design-theme="swiss"] .sg-intro-meta-card {
        padding: var(--space-2, 16px) var(--space-3, 24px);
        border-right: 1px solid var(--gray-200, #e0e0e0);
      }
      html[data-design-theme="swiss"] .sg-intro-meta-card:last-child {
        border-right: none;
      }
      html[data-design-theme="swiss"] .sg-intro-meta-card-label {
        font-family: var(--font-sans);
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--gray-500, #757575);
        margin-bottom: 4px;
      }
      html[data-design-theme="swiss"] .sg-intro-meta-card-value {
        font-family: var(--font-sans);
        font-size: 15px;
        font-weight: 500;
        color: var(--black, #000);
      }

  - name: Swiss Section Headers
    slug: section-headers
    title: "Large number, bold title, clean divider"
    description: "Section headers with oversized light-gray numbers and bold mixed-case titles."
    target-section: sections
    body: |
      html[data-design-theme="swiss"] .sg-section-header {
        padding: var(--space-4, 32px) 0 var(--space-3, 24px);
      }
      html[data-design-theme="swiss"] .sg-section-number {
        font-family: var(--font-sans);
        font-size: 48px;
        font-weight: 700;
        font-style: normal;
        color: var(--gray-200, #e0e0e0);
        background: none;
        border: none;
        border-radius: 0;
        padding: 0;
        min-width: auto;
        line-height: 1;
      }
      html[data-design-theme="swiss"] .sg-section-title {
        font-family: var(--font-sans);
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.02em;
        text-transform: none;
      }
      html[data-design-theme="swiss"] .sg-section-desc {
        font-family: var(--font-mono);
        font-size: 14px;
        color: var(--gray-500, #757575);
      }

  - name: Swiss Branding
    slug: branding-sumi
    title: "White-surface branding with black borders and red accents"
    description: "Heavy sans name, monospace field labels, offset box shadow cards."
    target-section: branding
    body: |
      html[data-design-theme="swiss"] .product-branding {
        background: var(--surface, #ffffff);
        border: 2px solid var(--black, #0a0a0a);
        box-shadow: 4px 4px 0 var(--gray-200, #e0e0e0);
      }
      html[data-design-theme="swiss"] .product-branding-name {
        font-family: var(--font-sans);
        font-weight: 700;
        font-style: normal;
        letter-spacing: -0.02em;
        text-transform: none;
      }
      html[data-design-theme="swiss"] .product-branding-field-label {
        font-family: var(--font-mono);
        font-weight: 700;
        color: var(--text, #0a0a0a);
        text-transform: uppercase;
        letter-spacing: 0.15em;
        font-size: 10px;
      }
      html[data-design-theme="swiss"] .product-branding-tag {
        border: 1px solid var(--gray-300, #bdbdbd);
        border-radius: 0;
        color: var(--gray-700, #424242);
        background: var(--white, #ffffff);
        font-family: var(--font-sans);
        font-weight: 500;
        font-size: 12px;
        text-transform: none;
        letter-spacing: 0;
      }
      /* Logo pane */
      html[data-design-theme="swiss"] .product-branding-logo {
        background: var(--gray-100, #eeeeee);
      }
      .swiss-logo-glyph {
        font-size: 36px;
        color: var(--red, #e20613);
        display: inline-block;
        margin-bottom: 8px;
      }
      .swiss-logo-text {
        font-family: var(--font-sans);
        font-size: 16px;
        font-weight: 700;
        color: var(--gray-700, #424242);
        letter-spacing: -0.02em;
      }

  - name: Swiss Cards & Components
    slug: cards
    title: "Sharp cards with 2px black borders"
    description: "No radius, no blur shadows. Color top-edge signals type. Filled cards invert."
    target-section: cards
    body: |
      html[data-design-theme="swiss"] .card {
        border: 2px solid var(--black, #000);
        border-radius: 0;
        box-shadow: none;
        background: var(--white, #fff);
      }
      html[data-design-theme="swiss"] .card:hover {
        background: var(--gray-100, #eeeeee) !important;
        box-shadow: none !important;
      }
      html[data-design-theme="swiss"] .card:hover > * {
        background: transparent !important;
      }
      html[data-design-theme="swiss"] .card:hover .card-header[class*="danger"],
      html[data-design-theme="swiss"] .card:hover .card-header[class*="warning"],
      html[data-design-theme="swiss"] .card:hover .card-header[class*="success"],
      html[data-design-theme="swiss"] .card:hover .card-header[class*="info"],
      html[data-design-theme="swiss"] .card:hover .card-header[class*="brand"],
      html[data-design-theme="swiss"] .card:hover .card-header[class*="primary"],
      html[data-design-theme="swiss"] .card:hover .card-footer[class*="danger"],
      html[data-design-theme="swiss"] .card:hover .card-footer[class*="warning"],
      html[data-design-theme="swiss"] .card:hover .card-footer[class*="success"],
      html[data-design-theme="swiss"] .card:hover .card-footer[class*="info"],
      html[data-design-theme="swiss"] .card:hover .card-footer[class*="brand"],
      html[data-design-theme="swiss"] .card:hover .card-footer[class*="primary"] {
        background: var(--accent) !important;
      }
      html[data-design-theme="swiss"] .card-header {
        border-bottom: none;
        border-radius: 0;
        background: var(--white, #fff);
      }
      html[data-design-theme="swiss"] .card-title {
        font-family: var(--font-sans);
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--black, #000);
      }
      html[data-design-theme="swiss"] .card-body {
        font-size: 14px;
        color: var(--black, #000);
        line-height: 1.6;
      }
      html[data-design-theme="swiss"] .card-body p {
        color: var(--gray-600, #616161);
      }
      html[data-design-theme="swiss"] .card-footer {
        border-top: none;
        border-radius: 0;
        background: transparent;
        border-color: transparent;
      }
      /* Swiss has no rounded variant — override to sharp */
      html[data-design-theme="swiss"] .card.rounded,
      html[data-design-theme="swiss"] .rounded {
        border-radius: 0;
      }
      html[data-design-theme="swiss"] .card.drop-shadow {
        box-shadow: 4px 4px 0 var(--accent, var(--gray-200, #e0e0e0)) !important;
      }
      html[data-design-theme="swiss"] .card.drop-shadow:hover {
        box-shadow: 4px 4px 0 var(--accent, var(--gray-200, #e0e0e0)) !important;
      }
      /* Semantic card text stays black, not semantic color */
      html[data-design-theme="swiss"] .card .card-body {
        color: var(--black, #000);
      }
      /* Card hover handled above — no duplicate rules */
      /* Accent cards: top border colored, sides/bottom black */
      html[data-design-theme="swiss"] .card[class*="accent-"] {
        border: 2px solid var(--black, #000) !important;
        border-top: 6px solid var(--accent, var(--red, #e20613)) !important;
      }
      html[data-design-theme="swiss"] .card.accent-danger,
      html[data-design-theme="swiss"] .card.accent-brand {
        border-top-color: var(--red, #e20613) !important;
      }
      html[data-design-theme="swiss"] .card.accent-info {
        border-top-color: var(--blue, #0047ab) !important;
      }
      html[data-design-theme="swiss"] .card.accent-success {
        border-top-color: var(--success, #1a8a3f) !important;
      }
      html[data-design-theme="swiss"] .card.accent-warning {
        border-top-color: var(--warning, #c27a00) !important;
      }
      html[data-design-theme="swiss"] .card.accent-primary {
        border-top-color: var(--black, #000) !important;
      }
      /* Card-level semantic: all borders use semantic color, uniform 2px, top 6px */
      html[data-design-theme="swiss"] .card.danger:not([class*="accent-"]),
      html[data-design-theme="swiss"] .card.brand:not([class*="accent-"]) {
        border-top: 6px solid var(--red, #e20613) !important;
        border-right: 2px solid var(--red, #e20613) !important;
        border-bottom: 2px solid var(--red, #e20613) !important;
        border-left: 2px solid var(--red, #e20613) !important;
      }
      html[data-design-theme="swiss"] .card.warning:not([class*="accent-"]) {
        border-top: 6px solid var(--warning, #c27a00) !important;
        border-right: 2px solid var(--warning, #c27a00) !important;
        border-bottom: 2px solid var(--warning, #c27a00) !important;
        border-left: 2px solid var(--warning, #c27a00) !important;
      }
      html[data-design-theme="swiss"] .card.success:not([class*="accent-"]) {
        border-top: 6px solid var(--success, #1a8a3f) !important;
        border-right: 2px solid var(--success, #1a8a3f) !important;
        border-bottom: 2px solid var(--success, #1a8a3f) !important;
        border-left: 2px solid var(--success, #1a8a3f) !important;
      }
      html[data-design-theme="swiss"] .card.info:not([class*="accent-"]) {
        border-top: 6px solid var(--blue, #0047ab) !important;
        border-right: 2px solid var(--blue, #0047ab) !important;
        border-bottom: 2px solid var(--blue, #0047ab) !important;
        border-left: 2px solid var(--blue, #0047ab) !important;
      }
      html[data-design-theme="swiss"] .card.primary:not([class*="accent-"]) {
        border-top: 6px solid var(--black, #000) !important;
        border-right: 2px solid var(--black, #000) !important;
        border-bottom: 2px solid var(--black, #000) !important;
        border-left: 2px solid var(--black, #000) !important;
      }
      /* Semantic card-level: header/footer stay white */
      html[data-design-theme="swiss"] .card.danger .card-header,
      html[data-design-theme="swiss"] .card.danger .card-footer,
      html[data-design-theme="swiss"] .card.warning .card-header,
      html[data-design-theme="swiss"] .card.warning .card-footer,
      html[data-design-theme="swiss"] .card.success .card-header,
      html[data-design-theme="swiss"] .card.success .card-footer,
      html[data-design-theme="swiss"] .card.info .card-header,
      html[data-design-theme="swiss"] .card.info .card-footer,
      html[data-design-theme="swiss"] .card.brand .card-header,
      html[data-design-theme="swiss"] .card.brand .card-footer,
      html[data-design-theme="swiss"] .card.primary .card-header,
      html[data-design-theme="swiss"] .card.primary .card-footer {
        background: var(--white, #fff) !important;
        color: var(--black, #000);
      }
      /* Tags / badges */
      html[data-design-theme="swiss"] .tag,
      html[data-design-theme="swiss"] .badge {
        border-radius: 0;
        font-family: var(--font-mono);
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.03em;
      }
      /* Buttons */
      html[data-design-theme="swiss"] .btn {
        border-radius: 0;
        font-family: var(--font-sans);
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      /* Alerts */
      html[data-design-theme="swiss"] .alert {
        border-radius: 0;
        border-width: 2px;
      }

  - name: Swiss Code Widgets
    slug: code-widgets
    title: "Code blocks and terminal with Swiss styling"
    description: "Dark background, red accent bar, language tags, no rounded corners."
    target-section: code-widgets
    body: |
      html[data-design-theme="swiss"] .widget-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: var(--space-3, 24px);
        margin-bottom: var(--space-5, 40px);
      }
      html[data-design-theme="swiss"] .code-widget {
        background: var(--white, #fff);
        border: 2px solid var(--black, #000);
        overflow: hidden;
      }
      html[data-design-theme="swiss"] .code-widget-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 16px;
        background: var(--gray-800, #212121);
        border-bottom: 1px solid var(--gray-700, #424242);
      }
      html[data-design-theme="swiss"] .code-widget-title {
        font-family: var(--font-sans);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--white, #fff);
      }
      html[data-design-theme="swiss"] .code-widget-badge {
        font-family: var(--font-mono);
        font-size: 9px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 2px 8px;
        border: 1px solid var(--gray-500, #757575);
        background: transparent;
      }
      html[data-design-theme="swiss"] .code-widget-badge--syntax {
        color: var(--gray-400, #9e9e9e);
        border-color: var(--gray-600, #616161);
      }
      html[data-design-theme="swiss"] .code-widget-badge--cli {
        color: var(--gray-400, #9e9e9e);
        border-color: var(--gray-600, #616161);
      }
      html[data-design-theme="swiss"] .code-widget-badge--lang {
        color: var(--white, #fff);
        background: var(--gray-600, #616161);
        border: none;
      }
      html[data-design-theme="swiss"] .code-widget-dots {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 16px;
        background: var(--gray-800, #212121);
        border-bottom: 2px solid var(--red, #e20613);
      }
      html[data-design-theme="swiss"] .code-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
      }
      html[data-design-theme="swiss"] .code-dot--red { background: #ff5f57; }
      html[data-design-theme="swiss"] .code-dot--yellow { background: #febc2e; }
      html[data-design-theme="swiss"] .code-dot--green { background: #28c840; }
      html[data-design-theme="swiss"] .code-widget-filename {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--gray-400, #9e9e9e);
        margin-left: 8px;
      }
      html[data-design-theme="swiss"] .code-widget-body {
        font-family: var(--font-mono);
        font-size: 13px;
        line-height: 1.8;
        padding: 20px 16px;
        margin: 0;
        color: var(--gray-300, #bdbdbd);
        background: var(--gray-900, #121212);
        white-space: pre;
        overflow-x: auto;
      }
      html[data-design-theme="swiss"] .code-comment { color: var(--gray-600, #616161); }
      html[data-design-theme="swiss"] .code-keyword { color: #ff6b6b; }
      html[data-design-theme="swiss"] .code-string { color: #69db7c; }
      html[data-design-theme="swiss"] .code-function { color: var(--white, #fff); }
      html[data-design-theme="swiss"] .code-number { color: var(--yellow, #f5c518); }
      html[data-design-theme="swiss"] .code-prompt { color: var(--gray-500, #757575); }
      html[data-design-theme="swiss"] .code-output { color: var(--gray-400, #9e9e9e); }
      html[data-design-theme="swiss"] .code-success { color: #69db7c; }
      html[data-design-theme="swiss"] .code-widget-desc {
        padding: 12px 16px;
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--gray-600, #616161);
        border-top: 1px solid var(--gray-200, #e0e0e0);
      }
      html[data-design-theme="swiss"] .effects-subsection-title {
        font-family: var(--font-sans);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--black, #000);
        margin-top: var(--space-5, 40px);
        padding-bottom: var(--space-1, 8px);
        border-bottom: 2px solid var(--red, #e20613);
      }
      @media (max-width: 700px) {
        html[data-design-theme="swiss"] .widget-grid {
          grid-template-columns: 1fr;
        }
      }

  - name: Swiss HUI
    slug: hui-sumi
    title: "Squared-off treatment for HUI components"
    description: "2px black borders, offset box shadows, uppercase labels, red focus accents."
    target-section: hui
    body: |
      /* Trigger buttons: sans uppercase */
      html[data-design-theme="swiss"] .hui.menu-btn,
      html[data-design-theme="swiss"] .hui.popover-btn {
        font-family: var(--font-sans);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        border-radius: 0;
        transition: box-shadow 0.15s ease;
      }
      html[data-design-theme="swiss"] .hui.menu-btn:hover,
      html[data-design-theme="swiss"] .hui.popover-btn:hover {
        box-shadow: 4px 4px 0 var(--gray-200, #e0e0e0);
      }
      /* Overlay panels: hard border, no blur */
      html[data-design-theme="swiss"] .hui.menu-items,
      html[data-design-theme="swiss"] .hui.listbox-options,
      html[data-design-theme="swiss"] .hui.combo-options,
      html[data-design-theme="swiss"] .hui.popover-panel {
        border: 2px solid var(--black, #0a0a0a);
        border-radius: 0;
        box-shadow: 4px 4px 0 var(--gray-200, #e0e0e0);
      }
      /* Active items: yellow highlight */
      html[data-design-theme="swiss"] .hui.menu-item[data-active],
      html[data-design-theme="swiss"] .hui.listbox-option[data-active],
      html[data-design-theme="swiss"] .hui.combo-option[data-active] {
        background: var(--yellow, #ffe600);
        color: var(--black, #0a0a0a);
      }
      /* Tabs: bold uppercase underline */
      html[data-design-theme="swiss"] .hui.tab-list {
        border-bottom: 2px solid var(--black, #0a0a0a);
        gap: 0;
      }
      html[data-design-theme="swiss"] .hui.tab {
        font-family: var(--font-sans);
        font-style: normal;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        border-radius: 0;
        padding: 8px 16px;
        border: 2px solid transparent;
      }
      html[data-design-theme="swiss"] .hui.tab[data-selected] {
        border-bottom-color: var(--red, #e63329);
        color: var(--red, #e63329);
      }
      /* Switch: square toggle */
      html[data-design-theme="swiss"] .hui.switch {
        border-radius: 0;
        border: 2px solid var(--black, #0a0a0a);
      }
      html[data-design-theme="swiss"] .hui.switch[data-checked] {
        background: var(--red, #e63329);
      }
      html[data-design-theme="swiss"] .hui.switch-thumb {
        border-radius: 0;
        background: var(--white, #ffffff);
        border: 1px solid var(--black, #0a0a0a);
      }
      /* Combo input: hard border */
      html[data-design-theme="swiss"] .hui.combo-input {
        font-family: var(--font-sans);
        font-size: 13px;
        border-radius: 0;

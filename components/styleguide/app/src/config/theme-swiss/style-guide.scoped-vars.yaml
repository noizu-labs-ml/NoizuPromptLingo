scoped-vars:
  prefix: "theme"

  sections:
    standard:
      selector: 'html[data-design-theme="swiss"]'
      prefix: "theme"
    dark:
      selector: 'html[data-design-theme="swiss"].dark'
      prefix: "theme"
    layout:
      selector: 'html[data-design-theme="swiss"]'
      prefix: "layout"

  vars:
    - name: content-container-type
      value: "inline-size"
      selector: ".content"
      selector-body: "container-type: var(--theme-content-container-type)"

    - name: content-position
      value:
        - section: standard
          value: "relative"
      selector: ".content"
      selector-body: "position: var(--theme-content-position)"

    - name: surface
      value:
        - section: standard
          value: "var(--white)"
        - section: dark
          value: "var(--gray-900)"

    - name: surface-alt
      value:
        - section: standard
          value: "var(--gray-50)"
        - section: dark
          value: "var(--gray-800)"

    - name: surface-inverse
      value:
        - section: standard
          value: "var(--black)"
        - section: dark
          value: "var(--white)"

    - name: text
      value:
        - section: standard
          value: "var(--black)"
        - section: dark
          value: "#ffffff"

    - name: text-secondary
      value:
        - section: standard
          value: "var(--gray-700)"
        - section: dark
          value: "var(--gray-300)"

    - name: text-muted
      value:
        - section: standard
          value: "var(--gray-500)"
        - section: dark
          value: "var(--gray-500)"

    - name: text-inverse
      value:
        - section: standard
          value: "var(--white)"
        - section: dark
          value: "var(--black)"

    - name: border
      value:
        - section: standard
          value: "var(--gray-200)"
        - section: dark
          value: "var(--gray-700)"

    - name: border-strong
      value:
        - section: standard
          value: "var(--gray-300)"
        - section: dark
          value: "var(--gray-600)"

    - name: shadow-color
      value:
        - section: standard
          value: "rgba(0,0,0,0.08)"
        - section: dark
          value: "rgba(0,0,0,0.4)"

    - name: bg
      value:
        - section: standard
          value: "var(--white)"
        - section: dark
          value: "var(--gray-900)"

    - name: card-border-color
      value:
        - section: standard
          value: "var(--black)"
        - section: dark
          value: "var(--white)"

    - name: card-bg
      value:
        - section: standard
          value: "var(--white)"
        - section: dark
          value: "var(--gray-900)"

    - name: radius-none
      value:
        - section: standard
          value: "0"

    - name: radius-sm
      value:
        - section: standard
          value: "2px"

    - name: standard
      value:
        - section: layout
          values:
            max-width: "1200px"
            padding: "var(--space-6)"
            margin: "0 auto"
            content-bg: "transparent"
      selector: ".content"
      selector-body: "max-width: var(--layout-standard-max-width); padding: var(--layout-standard-padding); margin: var(--layout-standard-margin); background: var(--layout-standard-content-bg)"

    - name: wide
      value:
        - section: layout
          values:
            max-width: "1200px"
            padding: "var(--space-6)"
            margin: "0 auto"
            content-bg: "transparent"
      selector: ".content.wide"
      selector-body: "max-width: var(--layout-wide-max-width); padding: var(--layout-wide-padding); margin: var(--layout-wide-margin); background: var(--layout-wide-content-bg)"

    - name: full
      value:
        - section: layout
          values:
            max-width: "100%"
            padding: "var(--space-4)"
            margin: "0"
            content-bg: "transparent"
      selector: ".content.full"
      selector-body: "max-width: var(--layout-full-max-width); padding: var(--layout-full-padding); margin: var(--layout-full-margin); background: var(--layout-full-content-bg)"

    - name: narrow
      value:
        - section: layout
          values:
            max-width: "600px"
            padding: "var(--space-6)"
            margin: "0 auto"
            content-bg: "transparent"
      selector: ".content.narrow"
      selector-body: "max-width: var(--layout-narrow-max-width); padding: var(--layout-narrow-padding); margin: var(--layout-narrow-margin); background: var(--layout-narrow-content-bg)"

    - name: article
      value:
        - section: layout
          values:
            max-width: "720px"
            padding: "var(--space-6)"
            margin: "0 auto"
            content-bg: "transparent"
      selector: ".content.article"
      selector-body: "max-width: var(--layout-article-max-width); padding: var(--layout-article-padding); margin: var(--layout-article-margin); background: var(--layout-article-content-bg)"

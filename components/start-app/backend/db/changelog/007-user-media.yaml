databaseChangeLog:
  - changeSet:
      id: create-table-user-media
      author: starter-scaffold
      changes:
        - sql:
            sql: |
              CREATE TABLE user_media (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                user_id uuid NOT NULL REFERENCES users(id),
                media_id uuid NOT NULL REFERENCES media(id),
                description_id uuid REFERENCES versioned_descriptions(id),
                media_type media_type_enum,
                settings jsonb,
                deleted_at timestamptz,
                inserted_at timestamptz NOT NULL,
                updated_at timestamptz NOT NULL
              );
      rollback:
        - dropTable:
            tableName: user_media

  - changeSet:
      id: create-index-user-media-user-id
      author: starter-scaffold
      changes:
        - createIndex:
            indexName: idx_user_media_user_id
            tableName: user_media
            columns:
              - column:
                  name: user_id
      rollback:
        - dropIndex:
            indexName: idx_user_media_user_id
            tableName: user_media

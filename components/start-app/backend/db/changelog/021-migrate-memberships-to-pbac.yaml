databaseChangeLog:
  - changeSet:
      id: 021-migrate-memberships-to-scoped
      author: starter-scaffold
      changes:
        - sql:
            sql: |
              -- Migrate existing memberships to scoped_memberships
              INSERT INTO scoped_memberships (id, group_id, resource_type, resource_id, member_type, member_id, added_by, created_at)
              SELECT
                m.id,
                g.id,
                'organization'::resource_type_enum,
                m.organization_id,
                'user'::member_type_enum,
                m.user_id,
                NULL,
                m.inserted_at
              FROM memberships m
              JOIN groups g ON g.name = (
                CASE m.role
                  WHEN 'editor' THEN 'member'::role_name_enum
                  ELSE m.role::role_name_enum
                END
              )
              ON CONFLICT DO NOTHING;

              -- Rename old table (keep for rollback safety)
              ALTER TABLE memberships RENAME TO memberships_legacy;
      rollback:
        - sql:
            sql: |
              ALTER TABLE memberships_legacy RENAME TO memberships;
              DELETE FROM scoped_memberships WHERE resource_type = 'organization';

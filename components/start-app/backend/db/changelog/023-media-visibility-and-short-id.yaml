databaseChangeLog:
  - changeSet:
      id: 023-add-media-short-id
      author: starter-scaffold
      changes:
        - sql:
            sql: |
              ALTER TABLE media ADD COLUMN short_id varchar(12);
              ALTER TABLE media ADD COLUMN visibility varchar(20) NOT NULL DEFAULT 'private';
              ALTER TABLE media ADD COLUMN owner_type resource_type_enum;
              ALTER TABLE media ADD COLUMN owner_id uuid;

              ALTER TABLE media ADD CONSTRAINT chk_media_visibility
                CHECK (visibility IN ('public', 'private', 'org'));

              CREATE UNIQUE INDEX idx_media_short_id ON media (short_id);
              CREATE INDEX idx_media_owner ON media (owner_type, owner_id) WHERE owner_id IS NOT NULL;
      rollback:
        - sql:
            sql: |
              DROP INDEX IF EXISTS idx_media_owner;
              DROP INDEX IF EXISTS idx_media_short_id;
              ALTER TABLE media DROP CONSTRAINT IF EXISTS chk_media_visibility;
              ALTER TABLE media DROP COLUMN IF EXISTS owner_id;
              ALTER TABLE media DROP COLUMN IF EXISTS owner_type;
              ALTER TABLE media DROP COLUMN IF EXISTS visibility;
              ALTER TABLE media DROP COLUMN IF EXISTS short_id;

  - changeSet:
      id: 023-backfill-media-short-ids
      author: starter-scaffold
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION generate_media_short_id()
              RETURNS TRIGGER AS $$
              DECLARE
                chars text := 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
                result text := '';
                i int;
                raw_bytes bytea;
              BEGIN
                IF NEW.short_id IS NULL THEN
                  raw_bytes := decode(replace(NEW.id::text, '-', ''), 'hex');
                  FOR i IN 0..7 LOOP
                    result := result || substr(chars, (get_byte(raw_bytes, i) % 62) + 1, 1);
                  END LOOP;
                  -- Handle collision by appending random chars
                  WHILE EXISTS (SELECT 1 FROM media WHERE short_id = result AND id != NEW.id) LOOP
                    result := result || substr(chars, (floor(random() * 62)::int) + 1, 1);
                  END LOOP;
                  NEW.short_id := result;
                END IF;
                RETURN NEW;
              END;
              $$ LANGUAGE plpgsql;

              CREATE TRIGGER generate_media_short_id
                BEFORE INSERT ON media
                FOR EACH ROW
                EXECUTE FUNCTION generate_media_short_id();

              -- Backfill existing rows
              UPDATE media SET short_id = NULL WHERE short_id IS NULL;
              -- Trigger won't fire on UPDATE, so generate manually for existing rows
              DO $$
              DECLARE
                r RECORD;
                chars text := 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
                result text;
                i int;
                raw_bytes bytea;
              BEGIN
                FOR r IN SELECT id FROM media WHERE short_id IS NULL LOOP
                  result := '';
                  raw_bytes := decode(replace(r.id::text, '-', ''), 'hex');
                  FOR i IN 0..7 LOOP
                    result := result || substr(chars, (get_byte(raw_bytes, i) % 62) + 1, 1);
                  END LOOP;
                  UPDATE media SET short_id = result WHERE id = r.id;
                END LOOP;
              END $$;

              -- Now make it NOT NULL
              ALTER TABLE media ALTER COLUMN short_id SET NOT NULL;
      rollback:
        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE media ALTER COLUMN short_id DROP NOT NULL;
              DROP TRIGGER IF EXISTS generate_media_short_id ON media;
              DROP FUNCTION IF EXISTS generate_media_short_id();

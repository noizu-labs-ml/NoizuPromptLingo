databaseChangeLog:
  - changeSet:
      id: create-table-auth-providers
      author: starter-scaffold
      changes:
        - createTable:
            tableName: auth_providers
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
              - column:
                  name: title
                  type: varchar(255)
              - column:
                  name: description
                  type: text
              - column:
                  name: settings
                  type: text
              - column:
                  name: deleted_at
                  type: timestamptz
              - column:
                  name: inserted_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: auth_providers

# ═══════════════════════════════════════════════════════════════
# BRANDING — branding.yaml
# ═══════════════════════════════════════════════════════════════
#
# Brand identity, logo, and the intro hero section displayed at
# the top of the style guide viewer. Replace all placeholder
# values with your project's actual brand.
#
# RELATED: style-guide.meta.yaml (theme slug/title)
#          style-guide.vars.yaml (color and font tokens)
# ═══════════════════════════════════════════════════════════════

# ── Brand Identity ────────────────────────────────────────────
name: "My Project"
logo-text: "MY PROJECT"

# Google Fonts URL — include all weights used in typography.yaml.
# Update this when you change font-sans or font-mono in vars.yaml.
font-url: "https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"

# Visual logo — raw HTML rendered in the style guide navbar.
# Reference your theme's CSS custom properties via var(--*).
logo-style:
  font: "var(--font-sans)"
  color: "var(--black)"
  html: '<span style="font-family:var(--font-sans);font-size:20px;font-weight:700;letter-spacing:-0.03em;color:currentColor">My Project</span>'

# ── Brand Voice ───────────────────────────────────────────────
# These fields guide design decisions and agent-generated content.

intent: "Replace with your visual strategy — what aesthetic tradition the design follows and how it serves your product's goals."

perception: "Replace with the impression users should form in the first 5 seconds."

audience: "Replace with who this design is for — their role, technical level, and what they value."

tone: "Replace with how the product speaks — the voice used in copy, errors, labels, and UI text."

keywords:
  - Replace
  - These
  - Keywords
  - With
  - Yours

# ── Intro Hero ────────────────────────────────────────────────
# The hero section at the top of the style guide viewer.
intro:
  title: "My Project"
  title-html: '<span style="font-family:var(--font-sans);font-weight:700">My Project</span>'
  glyph: ""
  subtitle: "STYLE GUIDE"
  quote: "\"Replace with your design philosophy.\""
  hide-meta: false
  hide-colors: false
  version: "v0.1.0"
  date: "2026-01-01"
  colors:
    - "#e53e3e"
    - "#3182ce"
    - "#d69e2e"
    - "#1a1a1a"
    - "#ffffff"
  meta:
    - label: "Typefaces"
      value: "Inter + JetBrains Mono"
    - label: "Grid"
      value: "12-col, 8px unit"
    - label: "Radius"
      value: "4px"
    - label: "Philosophy"
      value: "Replace with yours"

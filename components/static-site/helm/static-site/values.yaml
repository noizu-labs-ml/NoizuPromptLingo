replicas: 1
domain: example.com

image: nginx:alpine
port: 80

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

imagePullSecrets: []

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  cloudflareOnly: true

tls:
  enabled: true
  secretName: static-site-tls
  infisical:
    enabled: true
    resyncInterval: 300
    hostAPI: "https://infisical.noizu.com/api"
    credentialsSecret: universal-auth-credentials
    credentialsNamespace: infra
    projectSlug: k8-infra
    envSlug: prod
    secretsPath: "/shared/tls"
    crtKey: TLS_CRT
    keyKey: TLS_KEY
    caKey: ""

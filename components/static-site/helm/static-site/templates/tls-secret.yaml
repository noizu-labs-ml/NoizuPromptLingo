{{- if and .Values.tls.enabled .Values.tls.infisical.enabled }}
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: {{ include "static-site.fullname" . }}-tls
  labels:
    {{- include "static-site.labels" . | nindent 4 }}
spec:
  resyncInterval: {{ .Values.tls.infisical.resyncInterval }}
  hostAPI: {{ .Values.tls.infisical.hostAPI | quote }}
  authentication:
    universalAuth:
      credentialsRef:
        secretName: {{ .Values.tls.infisical.credentialsSecret }}
        secretNamespace: {{ .Values.tls.infisical.credentialsNamespace }}
      secretsScope:
        projectSlug: {{ .Values.tls.infisical.projectSlug }}
        envSlug: {{ .Values.tls.infisical.envSlug }}
        secretsPath: {{ .Values.tls.infisical.secretsPath | quote }}
  managedSecretReference:
    secretName: {{ .Values.tls.secretName }}
    secretNamespace: {{ .Release.Namespace }}
    secretType: kubernetes.io/tls
    creationPolicy: Owner
    template:
      includeAllSecrets: false
      data:
        tls.crt: "{{`{{ .`}}{{ .Values.tls.infisical.crtKey }}{{`.Value }}`}}"
        tls.key: "{{`{{ .`}}{{ .Values.tls.infisical.keyKey }}{{`.Value }}`}}"
        {{- if .Values.tls.infisical.caKey }}
        ca.crt: "{{`{{ .`}}{{ .Values.tls.infisical.caKey }}{{`.Value }}`}}"
        {{- end }}
{{- end }}

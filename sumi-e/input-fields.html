    <section class="sg-section" id="inputs">
      <div class="sg-section-header">
        <span class="sg-section-number">Section Five</span>
        <h2 class="sg-section-title">Input Fields</h2>
        <p class="sg-section-jp">入力</p>
      </div>

      <div class="input-demo">
        <div class="input-group">
          <label class="input-label">Project Name</label>
          <input type="text" class="input-field" placeholder="my-side-project">
        </div>
        <div class="input-group">
          <label class="input-label">Pitch</label>
          <textarea class="input-field input-textarea" placeholder="Describe your idea in a few sentences..."></textarea>
        </div>
        <div class="input-group">
          <label class="input-label">Error State</label>
          <input type="text" class="input-field error" value="invalid-format">
          <div style="font-size:12px;color:var(--error);margin-top:6px;font-family:var(--font-mono);font-size:10px;">Invalid format</div>
        </div>
        <div class="input-group">
          <label class="input-label">Disabled</label>
          <input type="text" class="input-field" disabled value="Locked during execution" style="opacity:0.4;cursor:not-allowed;">
        </div>
      </div>
    </section>

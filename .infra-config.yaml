# infra-config.yaml — Unified infrastructure config for k8-lib devops tools
#
# Scalar config (AWS, Docker, Helm, Infisical, etc.) lives in .envrc.k8.dc
# via direnv-config. This file contains structural/topology data and project
# build/deploy metadata.
#
# PATHS: All path values are resolved relative to this file's npl-directory.

apiVersion: k8-lib/v1

# --- Paths (relative to this file) ------------------------------------------
paths:
  helm_dir: kubernetes/helm
  terraform_dir: terraform
  projects_dir: .

# --- Cluster Status Patterns (grep -E regex) ---------------------------------
status_patterns: {}

# --- Cluster Layout -----------------------------------------------------------
nodepool_labels: {}

# --- Deploy One-Off -----------------------------------------------------------
placement_exclude_pattern: ""

# --- Deployment Tiers ---------------------------------------------------------
# Tier N completes before tier N+1 begins. Charts within a tier run in parallel.
tiers:
  - name: "Secrets Management"
    tier: 0
    charts:
      - infisical

  - name: "Data & Observability"
    tier: 1
    charts:
      - shared-zookeeper
      - shared-postgres
      - shared-mysql
      - shared-redis
      - shared-valkey
      - shared-mongodb
      - shared-clickhouse
      - signoz
      - otel-collector
      - phoenix
      - posthog
      - metabase

  - name: "Platform & Admin"
    tier: 2
    charts:
      - cockpit
      - headlamp
      - argocd
      - docker-registry
      - verdaccio
      - keygen
      - authentik
      - minio

  - name: "Core Applications"
    tier: 3
    charts:
      - codefresh
      - docmost
      - taiga
      - plane
      - nextcloud
      - ghost
      - espocrm
      - mautic
      - listmonk
      - postiz
      - bottlecrm
      - growthbook
      - matomo
      - seonaut
      - hakatime
      - n8n
      - portal
      - coming-soon
      - aifighter
      - bladeofeternity
      - derobotis
      - gottacc
      - iotgo
      - jailbreakingsite
      - mcphost
      - npl-mcp
      - noizu
      - noizurpg
      - robotsunite
      - therobotknows
      - therobotlearns
      - therobotlives
      - therobotmakes
      - start-app
      - tobornalp

  - name: "User-Facing & Creative"
    tier: 4
    charts:
      - penpot
      - webstudio
      - excalidraw
      - drawio
      - mermaid
      - chartdb
      - mydraft
      - kroki
      - plantuml
      - open-webui
      - langfuse
      - livebook
      - jupyterhub
      - label-studio
      - code-server
      - livecodes
      - serpbear

  - name: "Auxiliary & AI Infrastructure"
    tier: 5
    charts:
      - accounting-infra
      - mailu
      - vllm
      - weaviate
      - qdrant
      - chatterbox-tts
      - kitten-tts

  - name: "Health Tests"
    tier: 9
    charts:
      - health-tests

# --- Namespace Overrides ------------------------------------------------------
namespace_overrides:
  # Tier 0
  infisical: infisical
  # Tier 1 — Data
  shared-postgres: data-ns
  shared-mysql: data-ns
  shared-redis: data-ns
  shared-valkey: data-ns
  shared-mongodb: data-ns
  shared-clickhouse: data-ns
  shared-zookeeper: data-ns
  # Tier 1 — Observability
  signoz: observability-ns
  otel-collector: observability-ns
  phoenix: observability-ns
  posthog: observability-ns
  metabase: observability-ns
  # Tier 2 — Platform
  cockpit: platform-ns
  headlamp: platform-ns
  argocd: platform-ns
  docker-registry: platform-ns
  verdaccio: platform-ns
  keygen: platform-ns
  authentik: platform-ns
  minio: platform-ns
  health-tests: platform-ns
  # Tier 3-4 — Apps
  codefresh: apps-ns
  docmost: apps-ns
  taiga: apps-ns
  plane: apps-ns
  nextcloud: apps-ns
  ghost: apps-ns
  espocrm: apps-ns
  mautic: apps-ns
  listmonk: apps-ns
  postiz: apps-ns
  bottlecrm: apps-ns
  growthbook: apps-ns
  label-studio: apps-ns
  matomo: apps-ns
  serpbear: apps-ns
  seonaut: apps-ns
  hakatime: apps-ns
  code-server: apps-ns
  livecodes: apps-ns
  n8n: apps-ns
  portal: apps-ns
  coming-soon: apps-ns
  chatterbox-tts: apps-ns
  kitten-tts: apps-ns
  aifighter: apps-ns
  bladeofeternity: apps-ns
  derobotis: apps-ns
  gottacc: apps-ns
  iotgo: apps-ns
  jailbreakingsite: apps-ns
  mcphost: apps-ns
  npl-mcp: apps-ns
  noizu: apps-ns
  noizurpg: apps-ns
  robotsunite: apps-ns
  therobotknows: apps-ns
  therobotlearns: apps-ns
  therobotlives: apps-ns
  therobotmakes: apps-ns
  start-app: apps-ns
  tobornalp: apps-ns
  # Tier 4 — Creative
  penpot: creative-ns
  webstudio: creative-ns
  excalidraw: creative-ns
  drawio: creative-ns
  mermaid: creative-ns
  chartdb: creative-ns
  mydraft: creative-ns
  kroki: creative-ns
  plantuml: creative-ns
  # Tier 4-5 — AI/ML
  open-webui: ai-ns
  vllm: ai-ns
  langfuse: ai-ns
  livebook: ai-ns
  jupyterhub: ai-ns
  weaviate: ai-ns
  qdrant: ai-ns
  # Tier 5 — Accounting
  accounting-infra: accounting-ns
  # Tier 5 — Mail
  mailu: mail-ns

# --- Helm Scan Directories ----------------------------------------------------
helm_scan_dirs:
  - kubernetes/helm/platform
  - kubernetes/helm/apps
  - kubernetes/helm/data
  - kubernetes/helm/observability
  - kubernetes/helm/ai
  - kubernetes/helm/creative
  - kubernetes/helm/mail

# --- Chart Path Overrides -----------------------------------------------------
chart_path_overrides: {}

# --- Timeout Overrides --------------------------------------------------------
timeout_overrides:
  infisical: 10m
  cockpit: 10m
  jupyterhub: 15m
  weaviate: 10m
  vllm: 120m
  mailu: 10m
  chatterbox-tts: 10m
  penpot: 10m
  plane: 10m

# --- Liquibase Shell Targets --------------------------------------------------
# Used by incubator/utilities/devops/database-tools/bin/liquibase-shell.
# Paths are relative to this config file.
liquibase_targets:
  # Instance-level TimescaleDB targets. These are connection targets; add a
  # Liquibase --changelog-file argument or use an app-specific target below
  # when running migrations.
  shared-postgres:
    description: "Shared TimescaleDB instance in data-ns"
    namespace: data-ns
    service: svc/shared-postgres
    remote_port: 5432
    local_port: 54322
    db_type: postgresql
    db_name: postgres
    schema: public
    secret_name: data-postgres-secrets
    username: postgres
    secret_key: POSTGRES_PASSWORD
    safety: destructive

  hakatime:
    description: "Hakatime TimescaleDB instance in apps-ns"
    namespace: apps-ns
    service: svc/haka-db
    remote_port: 5432
    local_port: 54323
    db_type: postgresql
    db_name: haka
    schema: public
    secret_name: hakatime-secrets
    username: haka
    secret_key: HAKA_POSTGRES_PASSWORD
    safety: destructive

  hakatime-legacy:
    description: "Legacy Hakatime TimescaleDB instance in haka-ns"
    namespace: haka-ns
    service: svc/haka-db
    remote_port: 5432
    local_port: 54324
    db_type: postgresql
    db_name_key: POSTGRES_DB
    schema: public
    secret_name: haka-secrets
    username_key: POSTGRES_USER
    secret_key: POSTGRES_PASSWORD
    safety: destructive

  mailu-postgresql:
    description: "Mailu TimescaleDB instance in mail-ns"
    namespace: mail-ns
    service: svc/postgresql
    remote_port: 5432
    local_port: 54325
    db_type: postgresql
    db_name: postgres
    schema: public
    secret_name: mail-app-secrets
    username: postgres
    secret_key: POSTGRES_PASSWORD
    safety: destructive

  npl-mcp:
    description: "NPL MCP TimescaleDB instance in apps-ns"
    namespace: apps-ns
    service: svc/npl-mcp-postgresql
    remote_port: 5432
    local_port: 54326
    db_type: postgresql
    db_name: npl
    schema: public
    secret_name: npl-mcp-secrets
    username: npl
    secret_key: NPL_DB_PASSWORD
    safety: destructive
    changelog_dir: incubator/projects/NoizuPromptLingo/liquibase
    changelog_file: changelogs/changelog.yaml

  # App-level targets with concrete Liquibase changelogs.
  start-app:
    description: "Start App PostgreSQL on shared-postgres"
    namespace: data-ns
    service: svc/shared-postgres
    remote_port: 5432
    local_port: 54320
    db_type: postgresql
    db_name: startapp
    schema: public
    secret_name: data-postgres-secrets
    username_key: STARTAPP_DB_USER
    username_key_fallbacks:
      - START_APP_DB_USER
    secret_key: STARTAPP_DB_PASSWORD
    secret_key_fallbacks:
      - START_APP_DB_PASSWORD
    safety: destructive
    changelog_dir: incubator/start-app/backend/db
    changelog_file: changelog/db.changelog-master.yaml

  mermaid:
    description: "Mermaid Live Editor PostgreSQL on shared-postgres"
    namespace: data-ns
    service: svc/shared-postgres
    remote_port: 5432
    local_port: 54321
    db_type: postgresql
    db_name: mermaid
    schema: public
    secret_name: data-postgres-secrets
    username_key: MERMAID_DB_USER
    secret_key: MERMAID_DB_PASSWORD
    safety: destructive
    changelog_dir: repos/3rd/mermaid-live-editor/db
    changelog_file: changelog/db.changelog-master.yaml

# =============================================================================
# Project Registry — build/deploy metadata for portfolio projects
# =============================================================================
project:
  # Empty name keeps composite Docker targets rooted at this checkout instead of
  # adding the historical "incubator" path segment.
  name: ""
  status: active
  type: composite

  projects:
    - domain: codefre.sh
      services:
        - name: backend
          dockerfile: app/backend/Dockerfile
          context: app/backend
          registry_path: codefre.sh/backend
          auto_detect: false
          helm:
            chart_path: kubernetes/helm/apps/codefresh
            values_path: .codefresh.backend.image
            format: image
        - name: frontend
          dockerfile: app/frontend/Dockerfile
          context: app/frontend
          registry_path: codefre.sh/frontend
          build_args:
            NEXT_PUBLIC_API_URL: https://api.codefre.sh
          auto_detect: false
          helm:
            chart_path: kubernetes/helm/apps/codefresh
            values_path: .codefresh.frontend.image
            format: image
      helm:
        charts:
          - name: codefresh
            path: kubernetes/helm/apps/codefresh
    - domain: start-app
      base_path: components/start-app
      services:
        - name: backend
          dockerfile: backend/Dockerfile
          context: backend
          registry_path: start-app/backend
          platform: linux/amd64
          auto_detect: false
          helm:
            chart_path: kubernetes/helm/apps/start-app
            values_path: .start-app.backend.image
            format: image
        - name: frontend
          dockerfile: frontend/Dockerfile
          context: frontend
          registry_path: start-app/frontend
          platform: linux/amd64
          build_args:
            NEXT_PUBLIC_API_URL: https://start-app.noizu.com
          auto_detect: false
          helm:
            chart_path: kubernetes/helm/apps/start-app
            values_path: .start-app.frontend.image
            format: image
      helm:
        charts:
          - name: start-app
            path: kubernetes/helm/apps/start-app
    - domain: noizu.com
      services:
        - name: web
          dockerfile: Dockerfile
          context: .
          registry_path: noizu-website
          auto_detect: false
          helm:
            chart_path: projects/apps/apps-infra
            values_path: .noizuWebsite.image
            format: image
    - domain: aifighter.com
      services:
        - name: web
          dockerfile: web/Dockerfile
          context: web
    - domain: bladeofeternity.com
      services:
        - name: backend
          dockerfile: backend/Dockerfile
          context: backend
        - name: web
          dockerfile: web/Dockerfile
          context: web
    - domain: derobot.is
      services:
        - name: teaser
          dockerfile: app/teaser/Dockerfile
          context: app/teaser
          helm:
            chart_path: kubernetes/helm/apps/derobotis
            values_path: .derobotis.teaser.image
            format: image
      helm:
        charts:
          - name: derobotis
            path: kubernetes/helm/apps/derobotis
    - domain: noizurpg.com
      services:
        - name: web
          dockerfile: web/Dockerfile
          context: web
    - domain: robots-unite.com
      services:
        - name: web
          dockerfile: web/Dockerfile
          context: web
    - domain: therobotknows.com
      services:
        - name: web
          dockerfile: web/Dockerfile
          context: web
    - domain: therobotlives.com
      services:
        - name: web
          dockerfile: web/Dockerfile
          context: web
      helm:
        charts:
          - name: therobotlives
            path: kubernetes/helm/apps/therobotlives
    - domain: therobotmakes.com
      services:
        - name: web
          dockerfile: web/Dockerfile
          context: web
        - name: web-sumi-e
          dockerfile: web.sumi-e/Dockerfile
          context: web.sumi-e
    - domain: tobornalp.com
      services:
        - name: backend
          dockerfile: app/backend/Dockerfile
          context: app/backend
          registry_path: tobornalp.com/backend
          auto_detect: false
          helm:
            chart_path: kubernetes/helm/apps/tobornalp
            values_path: .backend.image
            format: image
        - name: frontend
          dockerfile: app/frontend/Dockerfile
          context: app/frontend
          registry_path: tobornalp.com/frontend
          build_args:
            NEXT_PUBLIC_API_URL: "https://tobornalp.com/api"
          auto_detect: false
          helm:
            chart_path: kubernetes/helm/apps/tobornalp
            values_path: .frontend.image
            format: image
    - domain: npl-mcp
      name: mcp.derobot.is 
      base_path: projects/NoizuPromptLingo
      services:
        - name: server
          dockerfile: Dockerfile
          context: .
          registry_path: npl-mcp
          auto_detect: false
          helm:
            chart_path: kubernetes/helm/apps/npl-mcp
            values_path: .npl-mcp.image.tag
            format: tag
      helm:
        charts:
          - name: npl-mcp
            path: charts/npl-mcp
    - domain: robotwars
      base_path: projects/game-workshop/stage/robotwars
      services:
        - name: frontend
          context: app/frontend
          registry_path: robotwars/frontend
          auto_detect: false
        - name: backend
          context: app/backend
          registry_path: robotwars/backend
          auto_detect: false
        - name: nginx
          context: app/nginx
          registry_path: robotwars/nginx
          auto_detect: false

  auto_detect_pattern:
    services:
      - name: backend
        dockerfile: app/backend/Dockerfile
        context: app/backend
      - name: frontend
        dockerfile: app/frontend/Dockerfile
        context: app/frontend
    skip_paths:
      - design
      - docs
      - .claude
      - logos
      - skills
      - start-app
      - portfolio-backburner
      - retired

  # ===========================================================================
  # Docker Images — standalone (non-composite) image builds from repos/3rd/
  # ===========================================================================
  docker:
    images:
      - name: mermaid-live-editor
        context: 3rd-party/mermaid-live-editor
        dockerfile: Dockerfile
        registry_path: mermaid-live-editor
        helm:
          chart_path: kubernetes/helm/creative/mermaid
          values_path: .image.tag
          format: tag

[global]
workgroup = WORKGROUP
server string = live-sandbox
security = user
map to guest = Never
log file = /var/log/samba/log.%m
max log size = 50
dns proxy = no
server min protocol = SMB2
# Faster for dev — disable oplocks to avoid stale-cache issues with watchers
oplocks = no
level2 oplocks = no

[workspace]
path = /workspace
browseable = yes
writable = yes
valid users = dev
create mask = 0644
directory mask = 0755
force user = dev
force group = dev

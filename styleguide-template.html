    /* ═══════════════════════════════════════
       THEME: {your-style}
       ═══════════════════════════════════════ */
    [data-design-theme="{your-style}"] {
      /* Surfaces */
      --white:       #ffffff;
      --off-white:   #fafafa;
      --gray-50:     #f5f5f5;
      --gray-100:    #eeeeee;
      --gray-200:    #e0e0e0;
      --gray-300:    #bdbdbd;
      --gray-400:    #9e9e9e;
      --gray-500:    #757575;
      --gray-600:    #616161;
      --gray-700:    #424242;
      --gray-800:    #212121;
      --gray-900:    #121212;
      --black:       #000000;

      /* Primaries — Bauhaus */
      --red:         #e20613;
      --red-light:   rgba(226, 6, 19, 0.08);
      --red-mid:     rgba(226, 6, 19, 0.15);
      --blue:        #0047ab;
      --blue-light:  rgba(0, 71, 171, 0.08);
      --blue-mid:    rgba(0, 71, 171, 0.15);
      --yellow:      #f5c518;
      --yellow-light:rgba(245, 197, 24, 0.12);
      --yellow-mid:  rgba(245, 197, 24, 0.25);

      /* Semantic */
      --success:     #1a8a3f;
      --success-bg:  rgba(26, 138, 63, 0.08);
      --warning:     #c27a00;
      --warning-bg:  rgba(194, 122, 0, 0.08);
      --error:       #c41a1a;
      --error-bg:    rgba(196, 26, 26, 0.08);
      --info:        #0047ab;
      --info-bg:     rgba(0, 71, 171, 0.08);

      /* Typography */
      --font-sans:   'Space Grotesk', -apple-system, sans-serif;
      --font-mono:   'IBM Plex Mono', 'Menlo', monospace;

      /* Grid */
      --unit:        8px;
      --col-gap:     16px;

      /* Spacing */
      --space-1:     8px;
      --space-2:     16px;
      --space-3:     24px;
      --space-4:     32px;
      --space-5:     40px;
      --space-6:     48px;
      --space-8:     64px;
      --space-10:    80px;
      --space-12:    96px;
      --space-16:    128px;

      /* Radius */
      --radius:      2px;
    }

/* ═══════════════════════════════════════

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
body {
  font-family: var(--font-sans);
  color: var(--black);
  background: var(--off-white);
  background-image:
    linear-gradient(var(--gray-100) 1px, transparent 1px),
    linear-gradient(90deg, var(--gray-100) 1px, transparent 1px);
  background-size: var(--space-4) var(--space-4);
  line-height: 1.5;
}
::selection { background: var(--yellow); color: var(--black); }

/* ═══════════════════════════════════════
   BUTTONS
   ═══════════════════════════════════════ */
.button-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  align-items: center;
  margin-bottom: var(--space-3);
}

.btn {
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: 600;
  padding: 10px 24px;
  border: none;
  border-radius: 0;
  cursor: pointer;
  transition: all 0.15s;
  letter-spacing: -0.01em;
}
.btn-black { background: var(--black); color: var(--white); }
.btn-black:hover { background: var(--gray-800); }
.btn-red { background: var(--red); color: var(--white); }
.btn-red:hover { background: #c80511; }
.btn-blue { background: var(--blue); color: var(--white); }
.btn-blue:hover { background: #003c91; }
.btn-outline {
  background: var(--white); color: var(--black);
  border: 2px solid var(--black); padding: 8px 22px;
}
.btn-outline:hover { background: var(--black); color: var(--white); }
.btn-ghost { background: transparent; color: var(--gray-600); border: none; }
.btn-ghost:hover { color: var(--black); background: var(--gray-100); }
.btn-danger {
  background: var(--white); color: var(--red);
  border: 2px solid var(--red); padding: 8px 22px;
}
.btn-danger:hover { background: var(--red); color: var(--white); }
.btn-sm { font-size: 11px; padding: 6px 16px; }
.btn-lg { font-size: 15px; padding: 14px 32px; }


/* ═══════════════════════════════════════
   CARDS
   ═══════════════════════════════════════ */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: var(--space-2);
}
.card {
  background: var(--white);
  border: 2px solid var(--black);
  padding: var(--space-3);
  transition: all 0.15s;
}
.card:hover { background: var(--gray-50); }
.card-accent {
  border-top: 8px solid var(--red);
  border-left: 2px solid var(--black);
  border-right: 2px solid var(--black);
  border-bottom: 2px solid var(--black);
}
.card-filled {
  background: var(--black);
  color: var(--white);
  border: 2px solid var(--black);
}
.card-filled:hover { background: var(--gray-900); }
.card-filled .card-body { color: var(--gray-400); }
.card-blue {
  border: 2px solid var(--blue);
  border-top: 8px solid var(--blue);
}
.card-title {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: var(--space-1);
}
.card-body {
  font-size: 14px;
  color: var(--gray-600);
  line-height: 1.6;
}
.card-tag {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  padding: 2px 8px;
  background: var(--gray-100);
  color: var(--gray-700);
  margin-top: var(--space-2);
}

/* ═══════════════════════════════════════
   INPUT FIELDS
   ═══════════════════════════════════════ */
.input-demo { max-width: 480px; }
.input-group { margin-bottom: var(--space-3); }
.input-label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--black);
  margin-bottom: 6px;
}
.input-field {
  width: 100%;
  font-family: var(--font-sans);
  font-size: 15px;
  color: var(--black);
  background: var(--white);
  border: 2px solid var(--gray-300);
  border-radius: 0;
  padding: 10px 12px;
  outline: none;
  transition: border-color 0.15s;
}
.input-field::placeholder { color: var(--gray-400); }
.input-field:focus { border-color: var(--black); }
.input-field.error { border-color: var(--red); }
.input-hint {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--gray-500);
  margin-top: 4px;
}
.input-hint.error { color: var(--red); }
.input-textarea {
  min-height: 100px;
  resize: vertical;
  line-height: 1.6;
}


  </style>
</head>

    /*
     * ═══════════════════════════════════════════════════════════════
     * CDN COMPONENTS — PROVIDED BY StyleGuide UMD BUNDLE
     * ═══════════════════════════════════════════════════════════════
     *
     * The following React components are loaded from the CDN via sg.js.
     * StyleGuide.unpack() registers them on window so they can be used
     * as bare JSX tags in <script type="text/babel"> blocks.
     *
     * All components render CSS classes scoped under .style-guide.
     * Default styles come from sg.css. To override any component's
     * appearance, redefine its CSS classes in the <style> block —
     * your local rules will take precedence over the CDN defaults.
     *
     * LAYOUT & STRUCTURE
     *   StyleGuideStyleCard      — Hero header card (title, subtitle, epigraph, color bar, meta grid)
     *   StyleGuideProductBranding — Brand identity card (logo, intent, perception, audience, tone, keywords)
     *   StyleGuideSectionHeader  — Numbered section divider (number, title, desc)
     *   StyleGuideSectionDesc    — Max-width intro paragraph
     *   StyleGuideScreenFrame    — Browser chrome mockup wrapper (url, label, children)
     *
     * DATA DISPLAY
     *   StyleGuideTokenCard      — CSS custom property group (title, type, tokens[][name,value])
     *   StyleGuideTokenPreview   — Inline token preview (color/font/space/radius/shadow/size)
     *   StyleGuideTypeSpecimen   — Two-column type sample (name, font, weight, size, lineHeight, sample)
     *   StyleGuideColorGrid      — Responsive color swatch grid (colors[], inline)
     *   StyleGuideColorSwatch    — Single color sample (name, hex, color, inline)
     *   StyleGuideNotesList      — Annotated list with color dots (notes[]{swatch, label, text})
     *   StyleGuideSpecTable      — Generic spec table (columns[], rows[][])
     *   StyleGuidePrinciples     — Numbered design rules (items[]{rule, detail})
     *
     * SPACING
     *   StyleGuideSpacingScale   — Horizontal bar chart (steps[]{px, label})
     *   StyleGuideSpacingDiagram — Page layout diagram (title, blocks[]{label, meta, compact})
     *
     * INTERACTIVE
     *   StyleGuideBtn            — Button (variant, size, label)
     *   StyleGuideButtonRow      — Flex button container
     *   StyleGuideInputGroup     — Form field wrapper (label, hint, error, children)
     *   StyleGuideInputField     — Text input/textarea (placeholder, value, error, disabled, textarea)
     *   StyleGuidePhaseTabs      — Segmented tab bar (tabs[]{label, state, style})
     *   StyleGuideStepProgress   — Step progress bar (total, done, current, label)
     *   StyleGuideStatusIndicator — Status item (status, label, desc)
     *   StyleGuideStatusGrid     — Status indicator grid (items[])
     *
     * CARDS & CONTAINERS
     *   StyleGuideCard           — Content card (variant, title, body, id, tags, children)
     *   StyleGuideCardGrid       — Auto-fill card grid (children, style)
     *   StyleGuideWidgetDemo     — Component showcase card (title, badge, desc, children)
     *   StyleGuideComponentRef   — API reference card (name, category, desc, props[], children)
     *
     * OVERRIDING STYLES
     *
     * CDN classes are scoped to .style-guide. To override, define
     * the same class in your <style> block with equal or higher
     * specificity:
     *
     *   .style-guide .btn { border-radius: 8px; }
     *   .style-guide .card { border: 1px solid var(--gray-300); }
     *
     * Or redefine the component entirely by declaring a local
     * function with the same name AFTER StyleGuide.unpack():
     *
     *   StyleGuide.unpack();
     *   function StyleGuideBtn({ variant, size, label }) {
     *     // your custom implementation
     *   }
     *
     * ═══════════════════════════════════════════════════════════════
     */

    /*
     * ═══════════════════════════════════════════════════════════════
     * STYLE GUIDE TEMPLATE — AGENT INSTRUCTIONS
     * ═══════════════════════════════════════════════════════════════
     *
     * WORKFLOW — 4 PHASES
     *
     * ┌─────────────────────────────────────────────────────────────┐
     * │ PHASE 1: COPY                                              │
     * │                                                            │
     * │ Copy this template to your project directory.              │
     * │ Rename to match the product: e.g. fivetillplan-sg.html     │
     * └─────────────────────────────────────────────────────────────┘
     *
     * ┌─────────────────────────────────────────────────────────────┐
     * │ PHASE 2: FOUNDATION (sections 00–04)                       │
     * │                                                            │
     * │ The lead agent populates the design foundation:            │
     * │                                                            │
     * │ a. CSS theme variables — Replace the [data-design-theme]   │
     * │    block with your theme's custom properties. Scope ALL    │
     * │    theme CSS to a root class:                              │
     * │                                                            │
     * │      .my-theme { --red: #e20613; ... }                     │
     * │      .my-theme .card { border: 2px solid var(--black); }   │
     * │      .my-theme .btn { ... }                                │
     * │      .my-theme .hui-menu-button { ... }                    │
     * │                                                            │
     * │    This prevents style bleed and allows multiple themes    │
     * │    in one page. Update the <html> or <body> to use the     │
     * │    class instead of data-design-theme.                     │
     * │                                                            │
     * │ b. StyleGuideStyleCard — Replace lorem ipsum with real values:       │
     * │    title, subtitle, epigraph, seal, color bar, meta grid.  │
     * │    See: styleguide-sections/00-header-branding.md          │
     * │                                                            │
     * │ c. StyleGuideProductBranding — Replace with real brand values:       │
     * │    intent, perception, audience, tone, keywords, logo.     │
     * │    See: styleguide-sections/00-header-branding.md          │
     * │                                                            │
     * │ d. Section 01: Design Tokens — StyleGuideTokenCard components with   │
     * │    the actual custom property values from step (a).        │
     * │    See: styleguide-sections/01-design-tokens.md            │
     * │                                                            │
     * │ e. Section 02: Color Palette — StyleGuideColorGrid + StyleGuideNotesList with  │
     * │    primaries, neutrals, semantics, and usage rules.        │
     * │    See: styleguide-sections/02-color-palette.md            │
     * │                                                            │
     * │ f. Section 03: Typography — StyleGuideTypeSpecimen for each level    │
     * │    in the hierarchy, with realistic sample text.           │
     * │    See: styleguide-sections/03-typography.md               │
     * │                                                            │
     * │ g. Section 04: Spacing — StyleGuideSpacingScale, StyleGuideSpecTable,│
     * │    StyleGuidePrinciples, and optionally StyleGuideSpacingDiagram.              │
     * │    See: styleguide-sections/04-spacing.md                  │
     * │                                                            │
     * │ After Phase 2 the file has: working CSS theme, populated   │
     * │ header/branding, and complete sections 01–04. Sections     │
     * │ 05–12 still have sg-instructions placeholders.             │
     * └─────────────────────────────────────────────────────────────┘
     *
     * ┌─────────────────────────────────────────────────────────────┐
     * │ PHASE 3: COMPONENTS (sections 05–12) — PARALLELIZABLE      │
     * │                                                            │
     * │ Copy the Phase 2 output so sub-agents can work in parallel │
     * │ on sections 05–12. Each sub-agent:                         │
     * │                                                            │
     * │   1. Reads the corresponding styleguide-sections/*.md doc  │
     * │   2. Replaces the sg-instructions block with real content  │
     * │   3. Adds any needed CSS classes to the <style> block      │
     * │   4. Removes sections that don't apply to this product     │
     * │                                                            │
     * │ Suggested parallelization:                                 │
     * │                                                            │
     * │   Agent A: 05 Buttons + 06 Inputs + 07 Navigation         │
     * │   Agent B: 08 Status + 09 Cards                           │
     * │   Agent C: 10 Core Components (largest section)            │
     * │   Agent D: 11 Project Components + 12 Screens              │
     * │                                                            │
     * │ Each agent writes to its own copy. The lead agent merges.  │
     * │                                                            │
     * │ IMPORTANT: Sub-agents must not modify sections 00–04 or    │
     * │ the CSS custom properties. They only ADD CSS classes for   │
     * │ their sections (e.g. .my-theme .btn-* for Agent A).       │
     * └─────────────────────────────────────────────────────────────┘
     *
     * ┌─────────────────────────────────────────────────────────────┐
     * │ PHASE 4: MERGE                                             │
     * │                                                            │
     * │ The lead agent merges sub-agent changes back together:     │
     * │                                                            │
     * │   1. Start from the Phase 2 file (has 00–04 populated)    │
     * │   2. For each sub-agent output, copy:                     │
     * │      - The populated <section> JSX (replacing the          │
     * │        sg-instructions placeholder)                        │
     * │      - Any new CSS classes they added to <style>           │
     * │   3. Remove any remaining sg-instructions blocks           │
     * │   4. Remove sections that were intentionally skipped       │
     * │   5. Validate: open in browser, check all sections render  │
     * └─────────────────────────────────────────────────────────────┘
     *
     * EXTENDING & OVERRIDING COMPONENTS
     *
     * The CDN components are tools to make building easier — NOT
     * constraints on the design. When the default component shape
     * doesn't serve your style, you have three options:
     *
     * 1. CSS OVERRIDE — Redefine sg.css classes in your <style>:
     *
     *      .style-guide .sg-section-header { border-color: cyan; }
     *      .style-guide .token-card { background: #111; }
     *
     * 2. COMPONENT OVERRIDE — Redeclare after unpack():
     *
     *      StyleGuide.unpack();
     *      // Override: cyberpunk needs centered glitch title
     *      function StyleGuideStyleCard({ title, subtitle }) {
     *        return <header className="sg-header">...</header>;
     *      }
     *
     * 3. RAW JSX — Skip the component entirely:
     *
     *      <header className="sg-header">
     *        <h1 className="sg-title glitch" data-text="NEON">NEON</h1>
     *      </header>
     *
     * The design leads. The components follow. If a cyberpunk style
     * guide needs neon glows, glitch text, and scanline overlays,
     * build those — don't flatten the design to fit a Swiss template.
     *
     * CSS SCOPING RULE
     *
     * All theme CSS must be scoped to a root class, NOT attribute
     * selectors. This allows theme reuse and prevents bleed:
     *
     *   WRONG:  [data-design-theme="swiss"] { ... }
     *   WRONG:  .card { border: 2px solid var(--black); }
     *   RIGHT:  .my-theme { --red: #e20613; ... }
     *   RIGHT:  .my-theme .card { border: 2px solid var(--black); }
     *
     * The root class name should match the product or style:
     *   .fivetillplan-theme, .swiss-theme, .aifighter-theme, etc.
     *
     * REFERENCES
     *
     * Section content docs:  references/outputs/styleguide-sections/
     * Construction process:  process/style-guide-construction.md
     * HTML output guidance:  outputs/html-style-guide.md
     * Worked example:        styleguide-reference.html (fivetillplan)
     * ═══════════════════════════════════════════════════════════════
     */
    function App() {
      return (
        <div className="sg-container">

          {/* see: references/outputs/styleguide-sections/00-header-branding.md for StyleGuideStyleCard + StyleGuideProductBranding guidance */}

          <section className="sg-section" id="tokens">
            <StyleGuideSectionHeader number="01" title="Design Tokens" desc="Lorem ipsum dolor sit amet." />
            {/* see: references/outputs/styleguide-sections/01-design-tokens.md */}
            <div className="sg-instructions">
              <strong>Purpose:</strong> The raw CSS custom properties that everything else is built on. This section is the single source of truth for the visual system.
              <ul>
                <li><strong>Available component:</strong> <code>StyleGuideTokenCard</code> — props: <code>title</code>, <code>type</code> (<code>color</code> | <code>font</code> | <code>space</code> | <code>radius</code> | <code>shadow</code> | <code>size</code>), <code>tokens</code> (array of <code>[name, value]</code>), <code>stylize</code> (boolean, default true).</li>

              <strong>Purpose:</strong> Document how space is used — the scale, the rules, and the reasoning.
              <ul>
                <li><strong>Available components:</strong> <code>StyleGuideSpacingScale</code> (props: <code>steps</code> array of <code>{'{'}px, label{'}'}</code>), <code>StyleGuideSpecTable</code> (props: <code>columns</code>, <code>rows</code>), <code>StyleGuidePrinciples</code> (props: <code>items</code> array of <code>{'{'}rule, detail{'}'}</code>), <code>StyleGuideSpacingDiagram</code> (props: <code>title</code>, <code>blocks</code>), <code>StyleGuideSectionDesc</code>.</li>
                <li>Use whichever of these are relevant. Not every design needs all of them.</li>
              </ul>
            </div>
         
          </section>

          <section className="sg-section" id="buttons">
            <StyleGuideSectionHeader number="05" title="Buttons" desc="Lorem ipsum dolor sit amet." />
            {/* see: references/outputs/styleguide-sections/05-buttons.md */}
            <div className="sg-instructions">
              <strong>Purpose:</strong> Show interactive controls — buttons, links, actions — in all their variants and states.
              <ul>
                <li><strong>Available components:</strong> <code>StyleGuideBtn</code> (props: <code>variant</code>, <code>size</code>, <code>label</code>), <code>StyleGuideButtonRow</code> (flex container).</li>
                <li>Define <code>.btn-*</code> CSS classes in the style tag. The variant names and what they look like are up to you.</li>
                <li>This section may not be needed if your design handles buttons differently — rename, restructure, or remove as appropriate.</li>
              </ul>
            </div>

          </section>

          <section className="sg-section" id="inputs">
            <StyleGuideSectionHeader number="06" title="Input Fields" desc="Lorem ipsum dolor sit amet." />
            {/* see: references/outputs/styleguide-sections/06-inputs.md */}
            <div className="sg-instructions">
              <strong>Purpose:</strong> Show how form elements look and behave across states.
              <ul>
                <li><strong>Available components:</strong> <code>StyleGuideInputGroup</code> (props: <code>label</code>, <code>hint</code>, <code>error</code>, <code>children</code>), <code>StyleGuideInputField</code> (props: <code>placeholder</code>, <code>value</code>, <code>error</code>, <code>disabled</code>, <code>textarea</code>, <code>type</code>).</li>
                <li>Wrap demos in <code>&lt;div className="input-demo"&gt;</code> for max-width constraint.</li>
                <li>Update <code>.input-field</code> CSS in the style tag for your theme. Rename or restructure this section as needed.</li>
              </ul>
            </div>
          </section>

          <section className="sg-section" id="navigation">
            <StyleGuideSectionHeader number="07" title="Navigation" desc="Lorem ipsum dolor sit amet." />
            {/* see: references/outputs/styleguide-sections/07-navigation.md */}
            <div className="sg-instructions">
              <strong>Purpose:</strong> Show how users move through the product — tabs, breadcrumbs, progress, steppers, or whatever patterns your design calls for.
              <ul>
                <li><strong>Available components:</strong> <code>StyleGuidePhaseTabs</code> (props: <code>tabs</code> array of <code>{'{'}label, state?, style?{'}'}</code>), <code>StyleGuideStepProgress</code> (props: <code>total</code>, <code>done</code>, <code>current</code>, <code>label</code>).</li>
                <li>These are starting points — replace, extend, or build entirely different navigation patterns as needed.</li>
                <li>Define corresponding CSS classes in the style tag.</li>
              </ul>
            </div>

          </section>

          <section className="sg-section" id="status">
            <StyleGuideSectionHeader number="08" title="Status Indicators" desc="Lorem ipsum dolor sit amet." />
            {/* see: references/outputs/styleguide-sections/08-status-indicators.md */}
            <div className="sg-instructions">
              <strong>Purpose:</strong> Show how the system communicates state — active, complete, error, waiting, or any other conditions relevant to your product.
              <ul>
                <li><strong>Available components:</strong> <code>StyleGuideStatusGrid</code> (props: <code>items</code> array), <code>StyleGuideStatusIndicator</code> (props: <code>status</code> CSS class, <code>label</code>, <code>desc</code>).</li>
                <li>Define <code>.status-indicator.yourstate</code> CSS classes for each state. Shape, color, and animation are all design decisions — not prescribed.</li>
                <li>This section may not apply to every product. Remove or repurpose as needed.</li>
              </ul>
            </div>
          </section>

          <section className="sg-section" id="cards">
            <StyleGuideSectionHeader number="09" title="Cards" desc="Lorem ipsum dolor sit amet." />
            {/* see: references/outputs/styleguide-sections/09-cards.md */}
            <div className="sg-instructions">
              <strong>Purpose:</strong> Show contained content blocks — however your design groups and presents information.
              <ul>
                <li><strong>Available components:</strong> <code>StyleGuideCard</code> (props: <code>variant</code>, <code>title</code>, <code>body</code>, <code>id</code>, <code>tags</code>, <code>children</code>), <code>StyleGuideCardGrid</code> (props: <code>children</code>, <code>style</code>).</li>
                <li><code>tags</code> accepts strings or <code>{'{'}label, bg, color{'}'}</code> objects for styled badges.</li>
                <li>Define <code>.card-*</code> CSS variant classes in the style tag. The variants and their visual treatment are up to you.</li>
              </ul>
            </div>

          </section>

          <section className="sg-section" id="components">
            <StyleGuideSectionHeader number="10" title="Core Component Reference" desc="Lorem ipsum dolor sit amet." />
            {/* see: references/outputs/styleguide-sections/10-core-components.md */}
            <div className="sg-instructions">
              <strong>Purpose:</strong> Show what the accessible Headless UI primitives look like when styled for this design system. These are the building blocks for interactive widgets.
              <ul>
                <li><strong>Available component:</strong> <code>StyleGuideWidgetDemo</code> (props: <code>title</code>, <code>badge</code>, <code>desc</code>, <code>children</code>) — renders a showcase card with a live preview.</li>
                <li>Headless UI provides: Menu, Disclosure, Dialog, Popover, Tabs, Transition, Button, Checkbox, Combobox, Fieldset, Input, Listbox, Radio Group, Select, Switch, Textarea. Include whichever your product uses.</li>
                <li>Style via <code>hui-*</code> CSS classes in the style tag. Use <code>.checked</code>, <code>.selected</code>, <code>.open</code> classes to show states statically.</li>
                <li>Not every product needs all 16. Only include what's relevant.</li>
              </ul>
            </div>

          </section>

          <section className="sg-section" id="project-components">
            <StyleGuideSectionHeader number="11" title="Project Component Reference" desc="Lorem ipsum dolor sit amet." />
            {/* see: references/outputs/styleguide-sections/11-project-components.md */}
            <div className="sg-instructions">
              <strong>Purpose:</strong> Composite widgets unique to this product — things that don't exist in a generic component library.
              <ul>
                <li><strong>Available component:</strong> <code>StyleGuideWidgetDemo</code> — same as section 10. Use <code>widget-grid--full</code> class on the grid for full-width cards.</li>
                <li>Build on top of core components and Headless UI primitives from sections 05–10.</li>
                <li>Add full-page composites (e.g. dashboards, multi-panel layouts) as <code>sg-subsection</code> entries after the widget grid.</li>
                <li>This section may be empty at first and grow as the product takes shape.</li>
              </ul>
            </div>

            {/* Add StyleGuideWidgetDemo entries here */}
          </section>

          <section className="sg-section" id="screens">
            <StyleGuideSectionHeader number="12" title="Screens" desc="Lorem ipsum dolor sit amet." />
            {/* see: references/outputs/styleguide-sections/12-screens.md */}
            <div className="sg-instructions">
              <strong>Purpose:</strong> Full-page compositions that show the design system in context — how users will actually experience the product.
              <ul>
                <li><strong>Available component:</strong> <code>StyleGuideScreenFrame</code> (props: <code>url</code>, <code>label</code>) — wraps content in browser chrome with traffic lights and URL bar.</li>
                <li>Build screens using inline styles and any components from sections 05–11. Wireframe-level fidelity is fine.</li>
                <li>Use realistic content. These screens should tell the product's story.</li>
                <li>Include whatever screens are most important to understanding the product.</li>
                <li><strong>Scroll & motion effects:</strong> For each screen, annotate parallax layers, scroll-triggered reveals, sticky headers, scroll-snap sections, and infinite scroll behavior. Use CSS comments or data attributes to mark what moves and at what rate. Include <code>prefers-reduced-motion</code> fallbacks.</li>
                <li><strong>Stock art / image placeholders:</strong> For each placeholder image, include a <code>data-image-brief</code> attribute with a search-ready description suitable for stock photo search or AI generation (e.g., <code>data-image-brief="aerial view of server farm at night, blue LED lighting, shallow DOF, 16:9 landscape"</code>). Use descriptive alt text that doubles as the image brief.</li>
              </ul>
            </div>
          </section>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "npl-mcp.fullname" . }}
  labels:
    {{- include "npl-mcp.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "npl-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "npl-mcp.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "npl-mcp.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ include "npl-mcp.name" . }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8765
              protocol: TCP
          env:
            - name: NPL_DB_HOST
              value: {{ include "npl-mcp.databaseHost" . | quote }}
            - name: NPL_DB_PORT
              value: {{ .Values.database.port | quote }}
            - name: NPL_DB_NAME
              value: {{ .Values.database.name | quote }}
            - name: NPL_DB_USER
              value: {{ .Values.database.user | quote }}
            - name: NPL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "npl-mcp.secretName" .) .Values.database.existingSecret }}
                  key: {{ .Values.database.passwordKey }}
            {{- if .Values.valkey.enabled }}
            - name: NPL_VALKEY_HOST
              value: {{ include "npl-mcp.valkeyHost" . | quote }}
            - name: NPL_VALKEY_PORT
              value: "6379"
            {{- end }}
            {{- range $key, $value := .Values.env }}
            {{- if $value }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- if hasKey .Values.secrets.data "NPL_LITELLM_KEY" }}
            - name: NPL_LITELLM_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "npl-mcp.secretName" . }}
                  key: NPL_LITELLM_KEY
                  optional: true
            {{- end }}
            {{- range .Values.extraEnv }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

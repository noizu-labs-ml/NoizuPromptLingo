databaseChangeLog:
  - changeSet:
      id: create-enum-status
      author: tobor-locker
      changes:
        - sql:
            sql: CREATE TYPE status_enum AS ENUM ('active', 'disabled', 'suspended', 'deleted');
      rollback:
        - sql:
            sql: DROP TYPE IF EXISTS status_enum;

  - changeSet:
      id: create-enum-user-status
      author: tobor-locker
      changes:
        - sql:
            sql: CREATE TYPE user_status_enum AS ENUM ('active', 'unverified', 'suspended', 'deleted');
      rollback:
        - sql:
            sql: DROP TYPE IF EXISTS user_status_enum;

  - changeSet:
      id: create-enum-api-key-status
      author: tobor-locker
      changes:
        - sql:
            sql: CREATE TYPE api_key_status_enum AS ENUM ('active', 'revoked', 'expired');
      rollback:
        - sql:
            sql: DROP TYPE IF EXISTS api_key_status_enum;

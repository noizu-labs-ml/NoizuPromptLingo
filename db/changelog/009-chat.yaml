databaseChangeLog:
  - changeSet:
      id: create-table-chat-rooms
      author: tobor-locker
      changes:
        - sql:
            sql: |
              CREATE TABLE chat_rooms (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                name varchar(255) NOT NULL,
                description text,
                session_id uuid,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
      rollback:
        - dropTable:
            tableName: chat_rooms

  - changeSet:
      id: create-index-chat-rooms-session
      author: tobor-locker
      changes:
        - createIndex:
            indexName: idx_chat_rooms_session_id
            tableName: chat_rooms
            columns:
              - column:
                  name: session_id
      rollback:
        - dropIndex:
            indexName: idx_chat_rooms_session_id

  - changeSet:
      id: create-table-chat-messages
      author: tobor-locker
      changes:
        - sql:
            sql: |
              CREATE TABLE chat_messages (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                room_id uuid NOT NULL REFERENCES chat_rooms(id) ON DELETE CASCADE,
                content text NOT NULL,
                sender varchar(255) NOT NULL,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
      rollback:
        - dropTable:
            tableName: chat_messages

  - changeSet:
      id: create-indexes-chat-messages
      author: tobor-locker
      changes:
        - createIndex:
            indexName: idx_chat_messages_room_id
            tableName: chat_messages
            columns:
              - column:
                  name: room_id
        - createIndex:
            indexName: idx_chat_messages_room_inserted
            tableName: chat_messages
            columns:
              - column:
                  name: room_id
              - column:
                  name: inserted_at
      rollback:
        - dropIndex:
            indexName: idx_chat_messages_room_id
        - dropIndex:
            indexName: idx_chat_messages_room_inserted

  - changeSet:
      id: create-table-chat-events
      author: tobor-locker
      changes:
        - sql:
            sql: |
              CREATE TABLE chat_events (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                room_id uuid NOT NULL REFERENCES chat_rooms(id) ON DELETE CASCADE,
                event_type varchar(255) NOT NULL,
                content text NOT NULL,
                sender varchar(255) NOT NULL,
                metadata jsonb,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
      rollback:
        - dropTable:
            tableName: chat_events

  - changeSet:
      id: create-indexes-chat-events
      author: tobor-locker
      changes:
        - createIndex:
            indexName: idx_chat_events_room_id
            tableName: chat_events
            columns:
              - column:
                  name: room_id
        - createIndex:
            indexName: idx_chat_events_room_type
            tableName: chat_events
            columns:
              - column:
                  name: room_id
              - column:
                  name: event_type
      rollback:
        - dropIndex:
            indexName: idx_chat_events_room_id
        - dropIndex:
            indexName: idx_chat_events_room_type

  - changeSet:
      id: create-table-chat-members
      author: tobor-locker
      changes:
        - sql:
            sql: |
              CREATE TABLE chat_members (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                room_id uuid NOT NULL REFERENCES chat_rooms(id) ON DELETE CASCADE,
                persona varchar(255) NOT NULL,
                role varchar(255) NOT NULL DEFAULT 'member',
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
      rollback:
        - dropTable:
            tableName: chat_members

  - changeSet:
      id: create-unique-index-chat-members
      author: tobor-locker
      changes:
        - createIndex:
            indexName: idx_chat_members_unique
            tableName: chat_members
            unique: true
            columns:
              - column:
                  name: room_id
              - column:
                  name: persona
      rollback:
        - dropIndex:
            indexName: idx_chat_members_unique

  - changeSet:
      id: create-table-chat-notifications
      author: tobor-locker
      changes:
        - sql:
            sql: |
              CREATE TABLE chat_notifications (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                room_id uuid NOT NULL REFERENCES chat_rooms(id) ON DELETE CASCADE,
                persona varchar(255) NOT NULL,
                message varchar(255) NOT NULL,
                read boolean NOT NULL DEFAULT false,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
      rollback:
        - dropTable:
            tableName: chat_notifications

  - changeSet:
      id: create-index-chat-notifications
      author: tobor-locker
      changes:
        - createIndex:
            indexName: idx_chat_notifications_persona_read
            tableName: chat_notifications
            columns:
              - column:
                  name: persona
              - column:
                  name: read
      rollback:
        - dropIndex:
            indexName: idx_chat_notifications_persona_read

databaseChangeLog:
  - changeSet:
      id: create-table-sessions
      author: tobor-locker
      changes:
        - sql:
            sql: |
              CREATE TABLE sessions (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                title varchar(255) NOT NULL,
                description text,
                status varchar(255) NOT NULL DEFAULT 'active',
                user_id uuid,
                project_id uuid REFERENCES projects(id) ON DELETE SET NULL,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
      rollback:
        - dropTable:
            tableName: sessions

  - changeSet:
      id: create-indexes-sessions
      author: tobor-locker
      changes:
        - createIndex:
            indexName: idx_sessions_status
            tableName: sessions
            columns:
              - column:
                  name: status
        - createIndex:
            indexName: idx_sessions_user_id
            tableName: sessions
            columns:
              - column:
                  name: user_id
        - createIndex:
            indexName: idx_sessions_project_id
            tableName: sessions
            columns:
              - column:
                  name: project_id
      rollback:
        - dropIndex:
            indexName: idx_sessions_status
        - dropIndex:
            indexName: idx_sessions_user_id
        - dropIndex:
            indexName: idx_sessions_project_id

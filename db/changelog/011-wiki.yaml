databaseChangeLog:
  - changeSet:
      id: create-table-wiki-spaces
      author: tobor-locker
      changes:
        - sql:
            sql: |
              CREATE TABLE wiki_spaces (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                slug varchar(255) NOT NULL,
                name varchar(255) NOT NULL,
                description text,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
      rollback:
        - dropTable:
            tableName: wiki_spaces

  - changeSet:
      id: create-unique-index-wiki-spaces-slug
      author: tobor-locker
      changes:
        - createIndex:
            indexName: idx_wiki_spaces_slug
            tableName: wiki_spaces
            unique: true
            columns:
              - column:
                  name: slug
      rollback:
        - dropIndex:
            indexName: idx_wiki_spaces_slug

  - changeSet:
      id: create-table-wiki-pages
      author: tobor-locker
      changes:
        - sql:
            sql: |
              CREATE TABLE wiki_pages (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                space_id uuid NOT NULL REFERENCES wiki_spaces(id) ON DELETE CASCADE,
                slug varchar(255) NOT NULL,
                title varchar(255) NOT NULL,
                artifact_id uuid,
                tags text[] DEFAULT '{}',
                parent_page_id uuid REFERENCES wiki_pages(id) ON DELETE SET NULL,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
      rollback:
        - dropTable:
            tableName: wiki_pages

  - changeSet:
      id: create-indexes-wiki-pages
      author: tobor-locker
      changes:
        - createIndex:
            indexName: idx_wiki_pages_space_id
            tableName: wiki_pages
            columns:
              - column:
                  name: space_id
        - createIndex:
            indexName: idx_wiki_pages_space_slug
            tableName: wiki_pages
            unique: true
            columns:
              - column:
                  name: space_id
              - column:
                  name: slug
        - createIndex:
            indexName: idx_wiki_pages_parent
            tableName: wiki_pages
            columns:
              - column:
                  name: parent_page_id
        - sql:
            sql: CREATE INDEX idx_wiki_pages_tags ON wiki_pages USING gin (tags);
      rollback:
        - dropIndex:
            indexName: idx_wiki_pages_space_id
        - dropIndex:
            indexName: idx_wiki_pages_space_slug
        - dropIndex:
            indexName: idx_wiki_pages_parent
        - dropIndex:
            indexName: idx_wiki_pages_tags

  - changeSet:
      id: create-table-wiki-permissions
      author: tobor-locker
      changes:
        - sql:
            sql: |
              CREATE TABLE wiki_permissions (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                entity_type varchar(255) NOT NULL,
                entity_id uuid NOT NULL,
                persona varchar(255) NOT NULL,
                permission varchar(255) NOT NULL,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
      rollback:
        - dropTable:
            tableName: wiki_permissions

  - changeSet:
      id: create-unique-index-wiki-permissions
      author: tobor-locker
      changes:
        - createIndex:
            indexName: idx_wiki_permissions_unique
            tableName: wiki_permissions
            unique: true
            columns:
              - column:
                  name: entity_type
              - column:
                  name: entity_id
              - column:
                  name: persona
      rollback:
        - dropIndex:
            indexName: idx_wiki_permissions_unique

databaseChangeLog:
  - changeSet:
      id: create-table-artifacts
      author: tobor-locker
      changes:
        - sql:
            sql: |
              CREATE TABLE artifacts (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                kind varchar(255) NOT NULL,
                title varchar(255) NOT NULL,
                mime_type varchar(255),
                project_id uuid REFERENCES projects(id) ON DELETE SET NULL,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
      rollback:
        - dropTable:
            tableName: artifacts

  - changeSet:
      id: create-indexes-artifacts
      author: tobor-locker
      changes:
        - createIndex:
            indexName: idx_artifacts_kind
            tableName: artifacts
            columns:
              - column:
                  name: kind
        - createIndex:
            indexName: idx_artifacts_project_id
            tableName: artifacts
            columns:
              - column:
                  name: project_id
      rollback:
        - dropIndex:
            indexName: idx_artifacts_kind
        - dropIndex:
            indexName: idx_artifacts_project_id

  - changeSet:
      id: create-table-artifact-revisions
      author: tobor-locker
      changes:
        - sql:
            sql: |
              CREATE TABLE artifact_revisions (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                artifact_id uuid NOT NULL REFERENCES artifacts(id) ON DELETE CASCADE,
                content text NOT NULL,
                note varchar(255),
                revision_number integer NOT NULL,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
      rollback:
        - dropTable:
            tableName: artifact_revisions

  - changeSet:
      id: create-indexes-artifact-revisions
      author: tobor-locker
      changes:
        - createIndex:
            indexName: idx_artifact_revisions_artifact_id
            tableName: artifact_revisions
            columns:
              - column:
                  name: artifact_id
        - createIndex:
            indexName: idx_artifact_revisions_unique
            tableName: artifact_revisions
            unique: true
            columns:
              - column:
                  name: artifact_id
              - column:
                  name: revision_number
      rollback:
        - dropIndex:
            indexName: idx_artifact_revisions_artifact_id
        - dropIndex:
            indexName: idx_artifact_revisions_unique

databaseChangeLog:
  - changeSet:
      id: create-table-agent-pipe-messages
      author: tobor-locker
      changes:
        - sql:
            sql: |
              CREATE TABLE agent_pipe_messages (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                target varchar(255) NOT NULL,
                sender varchar(255) NOT NULL,
                content text NOT NULL,
                priority varchar(255) NOT NULL DEFAULT 'normal',
                consumed boolean NOT NULL DEFAULT false,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
      rollback:
        - dropTable:
            tableName: agent_pipe_messages

  - changeSet:
      id: create-index-agent-pipe-messages
      author: tobor-locker
      changes:
        - createIndex:
            indexName: idx_agent_pipe_messages_target_consumed
            tableName: agent_pipe_messages
            columns:
              - column:
                  name: target
              - column:
                  name: consumed
      rollback:
        - dropIndex:
            indexName: idx_agent_pipe_messages_target_consumed

  - changeSet:
      id: create-table-agent-instructions
      author: tobor-locker
      changes:
        - sql:
            sql: |
              CREATE TABLE agent_instructions (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                title varchar(255) NOT NULL,
                content text NOT NULL,
                tags text[] DEFAULT '{}',
                session_id uuid,
                version integer NOT NULL DEFAULT 1,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
      rollback:
        - dropTable:
            tableName: agent_instructions

  - changeSet:
      id: create-indexes-agent-instructions
      author: tobor-locker
      changes:
        - sql:
            sql: CREATE INDEX idx_agent_instructions_tags ON agent_instructions USING gin (tags);
        - createIndex:
            indexName: idx_agent_instructions_session_id
            tableName: agent_instructions
            columns:
              - column:
                  name: session_id
      rollback:
        - dropIndex:
            indexName: idx_agent_instructions_tags
        - dropIndex:
            indexName: idx_agent_instructions_session_id

  - changeSet:
      id: create-table-agent-orchestrations
      author: tobor-locker
      changes:
        - sql:
            sql: |
              CREATE TABLE agent_orchestrations (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                pipeline varchar(255) NOT NULL,
                status varchar(255) NOT NULL DEFAULT 'pending',
                context jsonb,
                session_id uuid,
                result jsonb,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
      rollback:
        - dropTable:
            tableName: agent_orchestrations

  - changeSet:
      id: create-indexes-agent-orchestrations
      author: tobor-locker
      changes:
        - createIndex:
            indexName: idx_agent_orchestrations_pipeline
            tableName: agent_orchestrations
            columns:
              - column:
                  name: pipeline
        - createIndex:
            indexName: idx_agent_orchestrations_status
            tableName: agent_orchestrations
            columns:
              - column:
                  name: status
      rollback:
        - dropIndex:
            indexName: idx_agent_orchestrations_pipeline
        - dropIndex:
            indexName: idx_agent_orchestrations_status

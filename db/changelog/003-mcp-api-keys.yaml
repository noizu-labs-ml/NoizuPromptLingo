databaseChangeLog:
  - changeSet:
      id: create-table-mcp-api-keys
      author: tobor-locker
      changes:
        - sql:
            sql: |
              CREATE TABLE mcp_api_keys (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                user_id uuid NOT NULL REFERENCES users(id) ON DELETE CASCADE,
                label varchar(255) NOT NULL DEFAULT 'default',
                key_prefix varchar(8) NOT NULL,
                key_hash varchar(255) NOT NULL,
                status api_key_status_enum NOT NULL DEFAULT 'active',
                last_used_at timestamptz,
                expires_at timestamptz,
                inserted_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
      rollback:
        - dropTable:
            tableName: mcp_api_keys

  - changeSet:
      id: create-index-mcp-api-keys-user-id
      author: tobor-locker
      changes:
        - createIndex:
            indexName: idx_mcp_api_keys_user_id
            tableName: mcp_api_keys
            columns:
              - column:
                  name: user_id
      rollback:
        - dropIndex:
            indexName: idx_mcp_api_keys_user_id
            tableName: mcp_api_keys

  - changeSet:
      id: create-index-mcp-api-keys-prefix
      author: tobor-locker
      changes:
        - createIndex:
            indexName: idx_mcp_api_keys_prefix
            tableName: mcp_api_keys
            columns:
              - column:
                  name: key_prefix
      rollback:
        - dropIndex:
            indexName: idx_mcp_api_keys_prefix
            tableName: mcp_api_keys

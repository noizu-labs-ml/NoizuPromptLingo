name: basic-invocation
description: >
  Verify the skill activates when a user wants to build an MCP server but doesn't specify design vs implementation.
trigger:
  user_message: >
    I want to build an MCP server that lets Claude interact with my project management tool.
expected_activation: true
flow:
  - id: start
    type: start
    next: action_1
  - id: action_1
    type: action
    expected_behavior: >
      Skill should assess the request and route to mcp-architect for specification or mcp-forge for scaffolding.
    next: action_2
  - id: action_2
    type: action
    expected_behavior: >
      Skill should coordinate the full lifecycle, providing ecosystem context and SDK selection guidance.
    next: terminal
  - id: terminal
    type: terminal
    expected_outcome: >
      User receives a phased plan: specification via mcp-architect, then implementation via mcp-forge.

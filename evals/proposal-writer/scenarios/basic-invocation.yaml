name: basic-invocation
description: >
  Verify the skill activates when a user wants to write a project proposal for a client.
trigger:
  user_message: >
    I need to write a fixed-price proposal for a web app development project with milestones and acceptance criteria.
expected_activation: true
flow:
  - id: start
    type: start
    next: action_1
  - id: action_1
    type: action
    expected_behavior: >
      Skill should structure the proposal with scope, deliverables table, pricing model, and acceptance criteria.
    next: action_2
  - id: action_2
    type: action
    expected_behavior: >
      Skill should draft polished proposal prose with risk management, assumptions, and change order process.
    next: terminal
  - id: terminal
    type: terminal
    expected_outcome: >
      User receives a submission-ready proposal with all standard sections and professional formatting.

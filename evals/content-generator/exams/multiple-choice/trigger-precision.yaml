exam_type: multiple-choice
skill: content-generator
topic: trigger_precision
question_count: 5

questions:
  - id: tp-001
    question: >
      A user says "I need to do keyword mining for my technical blog."
      Which skill should activate?
    options:
      - label: A
        text: content-generator
        correct: true
        distractor_type: null
      - label: B
        text: content-publishing
        correct: false
        distractor_type: close_confusion
      - label: C
        text: seo-guru
        correct: false
        distractor_type: close_confusion
      - label: D
        text: ai-templates
        correct: false
        distractor_type: wrong_domain
    explanation: >
      Keyword mining is an explicit trigger for content-generator.
      seo-guru handles SEO optimization of existing content, while
      content-generator handles the ideation and research pipeline.

  - id: tp-002
    question: >
      Which request should NOT trigger content-generator?
    options:
      - label: A
        text: "Generate article ideas in batch for my newsletter"
        correct: false
        distractor_type: close_confusion
      - label: B
        text: "Validate topic demand for a series on WebAssembly"
        correct: false
        distractor_type: wrong_domain
      - label: C
        text: "Write a Dockerfile for my Node.js service"
        correct: true
        distractor_type: null
      - label: D
        text: "Plan a content calendar for Q3"
        correct: false
        distractor_type: over_generalized
    explanation: >
      Writing a Dockerfile is a DevOps task, not content generation.

  - id: tp-003
    question: >
      "Help me create an editorial calendar" triggers which skill?
    options:
      - label: A
        text: content-generator
        correct: true
        distractor_type: null
      - label: B
        text: content-publishing
        correct: false
        distractor_type: close_confusion
      - label: C
        text: market-intelligence
        correct: false
        distractor_type: wrong_domain
      - label: D
        text: conversion-engineer
        correct: false
        distractor_type: fabricated
    explanation: >
      "Editorial calendar" is an explicit trigger for content-generator.
      content-publishing is about building subscribers and monetizing
      existing writing, not ideation and calendar planning.

  - id: tp-004
    question: >
      A user asks about "article diagrams" and "data visualization for
      articles." Which skill handles this?
    options:
      - label: A
        text: user-experience-engineer
        correct: false
        distractor_type: close_confusion
      - label: B
        text: content-generator
        correct: true
        distractor_type: null
      - label: C
        text: tui-engineer
        correct: false
        distractor_type: fabricated
      - label: D
        text: seo-guru
        correct: false
        distractor_type: wrong_domain
    explanation: >
      "Article diagrams" and "data visualization for articles" are explicit
      triggers for content-generator as listed in the skill description.

  - id: tp-005
    question: >
      What distinguishes content-generator from content-publishing?
    options:
      - label: A
        text: "content-generator handles ideation and research; content-publishing handles audience building and monetization"
        correct: true
        distractor_type: null
      - label: B
        text: "content-publishing generates articles; content-generator sells them"
        correct: false
        distractor_type: fabricated
      - label: C
        text: "They are the same skill"
        correct: false
        distractor_type: over_generalized
      - label: D
        text: "content-generator is only for SEO; content-publishing is for newsletters"
        correct: false
        distractor_type: wrong_domain
    explanation: >
      content-generator is the operational pipeline for ideation and
      validation. content-publishing is about building authority and
      revenue through sustained writing.

name: basic-invocation
skill: site-walkthrough
description: >
  Verify that the skill correctly identifies a request to model a site as a
  structured inventory and produces a directed task-flow graph for a user goal.

nodes:
  - id: start
    type: start
    prompt: >
      Map out the pages and navigation for example.com. I want to verify that
      a new user can sign up, confirm their email, and reach the dashboard.
    expected_behavior: >
      Recognize the request as a site-walkthrough task. Begin by modeling the
      site inventory (pages, elements, navigation) and then define a task-flow
      graph for the signup-to-dashboard user goal.
    edges:
      - action

  - id: action
    type: action
    expected_behavior: >
      Produce a structured site inventory (YAML or organized list of pages with
      elements) and a directed task-flow graph with nodes representing each step
      in the signup journey, including edges for success and failure paths.
    edges:
      - terminal

  - id: terminal
    type: terminal
    expected_behavior: >
      Deliver a complete task flow that includes: homepage visit, signup form
      submission, email confirmation, and dashboard arrival — with conditional
      branching for failure cases (e.g., invalid email, expired token).
    pass_criteria:
      - Produces a site inventory or page map
      - Defines a directed graph with at least 4 nodes for the signup flow
      - Includes at least one conditional/failure branch
      - Defines completion criteria (user reaches dashboard)

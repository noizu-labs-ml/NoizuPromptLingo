exam: trigger-precision
skill: site-walkthrough
type: multiple_choice
question_count: 5
pass_threshold: 0.80

questions:
  - id: q1
    prompt: >
      A user says: "I need to map out all the pages on my e-commerce site and
      verify that users can complete a purchase from product page to order
      confirmation."
    should_trigger: true
    options:
      - label: A
        text: "This triggers site-walkthrough — it's a site inventory + task-flow validation request."
        distractor_type: correct
      - label: B
        text: "This triggers the user-experience-engineer skill — e-commerce UX is not walkthrough territory."
        distractor_type: wrong_domain
      - label: C
        text: "This triggers site-walkthrough but only if the user says 'task flow graph' explicitly."
        distractor_type: close_confusion
      - label: D
        text: "This triggers the seo-guru skill because it involves site pages."
        distractor_type: fabricated
    correct: A

  - id: q2
    prompt: >
      A user says: "Write me a Selenium test suite for my React app's login page."
    should_trigger: false
    options:
      - label: A
        text: "This triggers site-walkthrough because login page testing is a user journey."
        distractor_type: over_generalized
      - label: B
        text: "This triggers site-walkthrough and the rapid-prototype skill jointly."
        distractor_type: fabricated
      - label: C
        text: "This does NOT trigger site-walkthrough — it's a request for automated test code, not a site inventory or task-flow graph."
        distractor_type: correct
      - label: D
        text: "This triggers site-walkthrough because any mention of a 'page' activates the skill."
        distractor_type: close_confusion
    correct: C

  - id: q3
    prompt: >
      A user says: "Run a cognitive walkthrough of my documentation site to see
      if developers can find the API reference and understand the quickstart."
    should_trigger: true
    options:
      - label: A
        text: "This triggers the technical-writer skill — documentation quality is a writing concern."
        distractor_type: wrong_domain
      - label: B
        text: "This triggers site-walkthrough — cognitive walkthrough is explicitly listed as a trigger."
        distractor_type: correct
      - label: C
        text: "This triggers site-walkthrough but only for the accessibility dimension, not task completion."
        distractor_type: over_generalized
      - label: D
        text: "This does NOT trigger site-walkthrough because documentation sites are out of scope."
        distractor_type: fabricated
    correct: B

  - id: q4
    prompt: >
      A user says: "Can you model the navigation flow of my SaaS app and show
      me where users might get stuck trying to upgrade their plan?"
    should_trigger: true
    options:
      - label: A
        text: "This triggers site-walkthrough — modeling navigation flows with failure paths is a core use case."
        distractor_type: correct
      - label: B
        text: "This triggers the user-experience-engineer skill exclusively — plan upgrade UX is design work."
        distractor_type: close_confusion
      - label: C
        text: "This does NOT trigger site-walkthrough — the user didn't mention 'site inventory' or 'walkthrough'."
        distractor_type: over_generalized
      - label: D
        text: "This triggers the conversion-engineer skill — plan upgrades are a monetization concern."
        distractor_type: wrong_domain
    correct: A

  - id: q5
    prompt: >
      A user says: "Design a landing page for my SaaS product with a hero
      section, pricing table, and CTA button."
    should_trigger: false
    options:
      - label: A
        text: "This triggers site-walkthrough — a landing page is a site page and CTAs are site elements."
        distractor_type: over_generalized
      - label: B
        text: "This does NOT trigger site-walkthrough — it's a UI design request, not a journey validation or task-flow request."
        distractor_type: correct
      - label: C
        text: "This triggers site-walkthrough because the user is describing site elements."
        distractor_type: close_confusion
      - label: D
        text: "This triggers the technical-writer skill because landing pages involve copy."
        distractor_type: fabricated
    correct: B

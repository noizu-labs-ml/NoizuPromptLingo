name: basic-invocation
description: >
  Verify the skill activates when a user wants to plan a multi-stream
  passive income portfolio.
trigger:
  user_message: >
    I want to combine AI templates, content publishing, and merch into
    a coordinated passive income portfolio. How should I sequence these?
expected_activation: true
flow:
  - id: start
    type: start
    next: assess_streams
  - id: assess_streams
    type: action
    expected_behavior: >
      Skill should evaluate which stream to launch first based on
      user skills, timeline, and cross-promotion synergies.
    next: plan_cadence
  - id: plan_cadence
    type: action
    expected_behavior: >
      Skill should propose a weekly cadence balancing all active streams
      with realistic time allocations.
    next: terminal
  - id: terminal
    type: terminal
    expected_outcome: >
      User receives a sequenced launch plan with timeline, weekly cadence,
      and cross-promotion strategy.

name: basic-invocation
description: >
  Verify the skill activates when a user wants to validate whether a niche has real demand.
trigger:
  user_message: >
    I'm thinking about creating AI prompt packs for lawyers. Is there actually a market for this?
expected_activation: true
flow:
  - id: start
    type: start
    next: action_1
  - id: action_1
    type: action
    expected_behavior: >
      Skill should research demand signals: search volume, competitor analysis, audience size, and willingness to pay.
    next: action_2
  - id: action_2
    type: action
    expected_behavior: >
      Skill should produce a scored niche assessment with go/no-go recommendation and audience profile.
    next: terminal
  - id: terminal
    type: terminal
    expected_outcome: >
      User receives a validated niche report with demand score, competitor landscape, and audience psychographics.

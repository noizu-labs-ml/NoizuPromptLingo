name: basic-invocation
description: >
  Verify the skill activates when a user wants to learn a new subject
  and build a structured study plan.
trigger:
  user_message: >
    I want to learn Rust programming from scratch. Can you build me a
    learning path with books, articles, and a study schedule?
expected_activation: true
flow:
  - id: start
    type: start
    next: assess_learner
  - id: assess_learner
    type: action
    expected_behavior: >
      Skill should assess the learner's background, available time,
      and learning goals before dispatching resource discovery.
    next: build_path
  - id: build_path
    type: action
    expected_behavior: >
      Skill should produce a sequenced learning path with pedagogical
      framework, milestones, and resource annotations.
    next: terminal
  - id: terminal
    type: terminal
    expected_outcome: >
      User receives a complete learning path with prerequisites,
      milestones, annotated resources, and time estimates.

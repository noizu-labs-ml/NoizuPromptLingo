skill: trl-tui-engineer
version: 1.0.0
description: >
  Eval suite for the TUI Engineer skill. Measures trigger precision across
  six language ecosystems, layout design quality, and cross-platform correctness.

dimensions:
  - name: trigger_precision
    weight: 0.30
    description: Correctly activates on TUI/terminal-UI cues and rejects non-TUI requests.
  - name: language_selection
    weight: 0.20
    description: Recommends appropriate framework for the target language and use case.
  - name: layout_and_interaction
    weight: 0.25
    description: Produces correct grid layouts, keybindings, and interaction patterns.
  - name: cross_platform
    weight: 0.15
    description: Handles terminal quirks (tmux, SSH, Windows Terminal, Unicode).
  - name: build_tooling
    weight: 0.10
    description: Correct build system setup (Cargo, Go modules, Make, npm, etc.).

thresholds:
  pass: 0.70
  strong: 0.85
  excellent: 0.95

models_to_test:
  - claude-sonnet-4-20250514
  - claude-opus-4-20250115
  - gpt-4.1-2025-04-14
  - gemini-2.5-pro-preview-05-06

suites:
  - path: scenarios/basic-invocation.yaml
    type: directed_flow
  - path: exams/multiple-choice/trigger-precision.yaml
    type: mc_exam

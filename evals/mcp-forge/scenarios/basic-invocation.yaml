name: basic-invocation
description: >
  Verify the skill activates when a user wants to scaffold an MCP server project.
trigger:
  user_message: >
    Scaffold a quick MCP server with stdio transport that exposes 3 tools for file operations.
expected_activation: true
flow:
  - id: start
    type: start
    next: action_1
  - id: action_1
    type: action
    expected_behavior: >
      Skill should generate a Phase 1 quick scaffold: working MCP server with stdio transport and 3 tool definitions.
    next: action_2
  - id: action_2
    type: action
    expected_behavior: >
      Skill should produce runnable code with smoke tests, package.json, and tool implementations.
    next: terminal
  - id: terminal
    type: terminal
    expected_outcome: >
      User receives a working MCP server project ready to test with Claude Desktop.

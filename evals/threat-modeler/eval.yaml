skill: trl-threat-modeler
version: 1.0.0
description: >
  Eval suite for the Threat Modeler skill. Measures trigger precision,
  methodology selection, and actionable security recommendation quality.

dimensions:
  - name: trigger_precision
    weight: 0.30
    description: Correctly activates on security/threat-modeling cues and rejects non-security requests.
  - name: methodology_selection
    weight: 0.25
    description: Chooses appropriate framework (STRIDE, PASTA, OCTAVE) for the context.
  - name: threat_identification
    weight: 0.20
    description: Identifies relevant threat actors, attack vectors, and trust boundary violations.
  - name: risk_assessment
    weight: 0.15
    description: Provides actionable risk ratings with likelihood/impact justification.
  - name: compliance_mapping
    weight: 0.10
    description: Maps findings to SOC2, ISO 27001, NIST, GDPR, HIPAA as appropriate.

thresholds:
  pass: 0.70
  strong: 0.85
  excellent: 0.95

models_to_test:
  - claude-sonnet-4-20250514
  - claude-opus-4-20250115
  - gpt-4.1-2025-04-14
  - gemini-2.5-pro-preview-05-06

suites:
  - path: scenarios/basic-invocation.yaml
    type: directed_flow
  - path: exams/multiple-choice/trigger-precision.yaml
    type: mc_exam

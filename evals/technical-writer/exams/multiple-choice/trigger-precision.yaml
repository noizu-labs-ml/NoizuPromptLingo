exam: trigger-precision
skill: trl-technical-writer
type: multiple_choice
question_count: 5
pass_threshold: 0.80

questions:
  - id: q1
    prompt: >
      A user says: "My project's README is outdated and doesn't mention the new
      CLI commands. Can you update it?"
    should_trigger: true
    options:
      - label: A
        text: "This triggers technical-writer — README improvements are an explicit trigger."
        distractor_type: correct
      - label: B
        text: "This does NOT trigger technical-writer — README updates are maintenance, not writing."
        distractor_type: wrong_domain
      - label: C
        text: "This triggers the rapid-prototype skill — updating docs is part of prototyping."
        distractor_type: fabricated
      - label: D
        text: "This triggers technical-writer but only if the user says 'proof-edit' or 'author'."
        distractor_type: over_generalized
    correct: A

  - id: q2
    prompt: >
      A user says: "Write a blog post about the benefits of microservices
      architecture."
    should_trigger: false
    options:
      - label: A
        text: "This triggers technical-writer — blog posts are a form of writing."
        distractor_type: over_generalized
      - label: B
        text: "This triggers the content-generator skill — blog posts are content, not technical documentation."
        distractor_type: correct
      - label: C
        text: "This triggers technical-writer because it involves writing about a technical topic."
        distractor_type: close_confusion
      - label: D
        text: "This triggers the seo-guru skill exclusively — blog posts need SEO optimization."
        distractor_type: wrong_domain
    correct: B

  - id: q3
    prompt: >
      A user says: "Proof-edit my API reference documentation for consistency,
      accuracy, and clarity."
    should_trigger: true
    options:
      - label: A
        text: "This triggers technical-writer — proof editing and API reference review are core triggers."
        distractor_type: correct
      - label: B
        text: "This does NOT trigger technical-writer — proof editing is a generic task handled by any model."
        distractor_type: wrong_domain
      - label: C
        text: "This triggers the skill-engineer skill — API references are technical specifications."
        distractor_type: fabricated
      - label: D
        text: "This triggers technical-writer only if the user also specifies the audience level."
        distractor_type: over_generalized
    correct: A

  - id: q4
    prompt: >
      A user says: "I need a CONTRIBUTING.md for my open-source project that
      covers PR workflow, code style, and commit conventions."
    should_trigger: true
    options:
      - label: A
        text: "This triggers the agent-architect skill — contributing guidelines define agent workflows."
        distractor_type: fabricated
      - label: B
        text: "This triggers technical-writer — CLAUDE.md and CONTRIBUTING.md are explicitly listed triggers."
        distractor_type: correct
      - label: C
        text: "This does NOT trigger technical-writer — contributing guides are governance, not documentation."
        distractor_type: wrong_domain
      - label: D
        text: "This triggers technical-writer only for the code style section, not the whole file."
        distractor_type: close_confusion
    correct: B

  - id: q5
    prompt: >
      A user says: "Rewrite this marketing landing page copy to be more
      persuasive and conversion-optimized."
    should_trigger: false
    options:
      - label: A
        text: "This triggers technical-writer — landing page copy is a form of writing."
        distractor_type: over_generalized
      - label: B
        text: "This triggers the seo-guru skill — conversion optimization is an SEO concern."
        distractor_type: close_confusion
      - label: C
        text: "This does NOT trigger technical-writer — marketing copywriting and conversion optimization are outside the skill's scope of software documentation."
        distractor_type: correct
      - label: D
        text: "This triggers the user-experience-engineer skill — landing pages are UX."
        distractor_type: wrong_domain
    correct: C

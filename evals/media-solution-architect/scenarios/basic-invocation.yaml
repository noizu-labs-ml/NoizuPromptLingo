name: basic-invocation
description: >
  Verify the skill activates when a user wants to design a video streaming architecture.
trigger:
  user_message: >
    I want to set up a self-hosted video streaming platform with HLS delivery, adaptive bitrate, and edge caching.
expected_activation: true
flow:
  - id: start
    type: start
    next: action_1
  - id: action_1
    type: action
    expected_behavior: >
      Skill should design a full-stack streaming architecture from ingest through transcoding to edge delivery.
    next: action_2
  - id: action_2
    type: action
    expected_behavior: >
      Skill should propose encoding ladders, packaging strategy, CDN hierarchy, and bandwidth cost model.
    next: terminal
  - id: terminal
    type: terminal
    expected_outcome: >
      User receives a complete streaming system architecture with codec choices, encoding ladder, and cost projections.

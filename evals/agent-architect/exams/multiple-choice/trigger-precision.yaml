exam: trigger-precision
skill: agent-architect
type: multiple_choice
question_count: 5
pass_threshold: 0.80

questions:
  - id: q1
    prompt: >
      A user says: "I need to build an autonomous system that reads support
      tickets, classifies them by urgency, and drafts responses. What's the
      right architecture?"
    should_trigger: true
    options:
      - label: A
        text: "This triggers agent-architect — it's a request to design an autonomous AI system with architecture selection."
        distractor_type: correct
      - label: B
        text: "This does NOT trigger agent-architect — it's a customer support workflow, not an AI agent."
        distractor_type: wrong_domain
      - label: C
        text: "This triggers agent-architect but only if the user explicitly says 'AI agent' or 'subagent'."
        distractor_type: over_generalized
      - label: D
        text: "This triggers the kubernetes-engineer skill because ticket systems run on infrastructure."
        distractor_type: fabricated
    correct: A

  - id: q2
    prompt: >
      A user says: "Write me a Python script that calls the OpenAI API to
      summarize articles."
    should_trigger: false
    options:
      - label: A
        text: "This triggers agent-architect — any API call pattern is agent design."
        distractor_type: over_generalized
      - label: B
        text: "This triggers agent-architect because OpenAI is an LLM provider."
        distractor_type: close_confusion
      - label: C
        text: "This does NOT trigger agent-architect — it's a simple script request, not an autonomous agent system."
        distractor_type: correct
      - label: D
        text: "This triggers the rapid-prototype skill and agent-architect simultaneously."
        distractor_type: fabricated
    correct: C

  - id: q3
    prompt: >
      A user says: "My multi-agent handoff system keeps losing context between
      agents. Can you help me debug the memory pipeline?"
    should_trigger: true
    options:
      - label: A
        text: "This does NOT trigger agent-architect — debugging is outside its scope."
        distractor_type: wrong_domain
      - label: B
        text: "This triggers agent-architect — memory systems and multi-agent coordination are core concerns."
        distractor_type: correct
      - label: C
        text: "This triggers the threat-modeler skill because data loss is a security issue."
        distractor_type: fabricated
      - label: D
        text: "This triggers agent-architect only if the user says 'Claude Code subagent' specifically."
        distractor_type: close_confusion
    correct: B

  - id: q4
    prompt: >
      A user says: "Design guardrails so my agent can't exfiltrate data or
      execute arbitrary shell commands."
    should_trigger: true
    options:
      - label: A
        text: "This triggers the threat-modeler skill — guardrails are a security domain."
        distractor_type: wrong_domain
      - label: B
        text: "This triggers agent-architect — guardrails and safety are architectural concerns addressed by the skill."
        distractor_type: correct
      - label: C
        text: "This triggers agent-architect but only for the OWASP section, not the full skill."
        distractor_type: over_generalized
      - label: D
        text: "This does NOT trigger agent-architect — guardrails should be handled by the agentic-harness-engineer skill exclusively."
        distractor_type: close_confusion
    correct: B

  - id: q5
    prompt: >
      A user says: "What's the difference between a prompt chain and an
      orchestrator-workers pattern?"
    should_trigger: true
    options:
      - label: A
        text: "This does NOT trigger agent-architect — it's a theoretical question, not a build request."
        distractor_type: wrong_domain
      - label: B
        text: "This triggers the research-and-development skill because it asks for a comparison."
        distractor_type: fabricated
      - label: C
        text: "This triggers agent-architect — architecture selection and pattern comparison are core to the skill."
        distractor_type: correct
      - label: D
        text: "This triggers agent-architect only if the user also asks to implement one of the patterns."
        distractor_type: over_generalized
    correct: C

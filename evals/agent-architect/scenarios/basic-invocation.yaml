name: basic-invocation
skill: agent-architect
description: >
  Verify that the skill correctly identifies a request to design a new AI agent
  and produces an architecture recommendation with rationale.

nodes:
  - id: start
    type: start
    prompt: >
      I need to build a Claude Code subagent that reviews pull requests.
      It should read the diff, identify potential bugs, and post inline
      comments. What architecture would you recommend?
    expected_behavior: >
      Recognize the request as an agent-design task. Recommend a single-agent
      architecture with tool use (diff reading, comment posting) rather than
      jumping to multi-agent patterns without justification.
    edges:
      - action

  - id: action
    type: action
    expected_behavior: >
      Produce an architecture recommendation that includes: (1) pattern
      selection with rationale, (2) context engineering strategy for PR diffs,
      (3) tool design for reading diffs and posting comments, (4) at least
      one guardrail consideration.
    edges:
      - terminal

  - id: terminal
    type: terminal
    expected_behavior: >
      Deliver a structured response that demonstrates the "start simple" and
      "context engineering > prompt engineering" principles from the skill's
      core philosophy. No unnecessary multi-agent complexity.
    pass_criteria:
      - Recommends single-agent pattern or justifies multi-agent if chosen
      - Addresses context engineering for diff handling
      - Proposes at least one tool with structured output
      - Mentions at least one guardrail

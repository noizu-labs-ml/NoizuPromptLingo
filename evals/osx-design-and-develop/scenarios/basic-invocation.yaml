name: basic-invocation
description: >
  Verify the skill activates when a user wants to build a macOS desktop application.
trigger:
  user_message: >
    I want to build a macOS menu bar app with SwiftUI that shows system stats in a popover.
expected_activation: true
flow:
  - id: start
    type: start
    next: action_1
  - id: action_1
    type: action
    expected_behavior: >
      Skill should design MenuBarExtra architecture with SwiftUI popover, system stats data source, and AppKit interop if needed.
    next: action_2
  - id: action_2
    type: action
    expected_behavior: >
      Skill should generate the Xcode project structure with entitlements, sandboxing config, and notarization setup.
    next: terminal
  - id: terminal
    type: terminal
    expected_outcome: >
      User receives a complete macOS menu bar app scaffold with distribution guidance.

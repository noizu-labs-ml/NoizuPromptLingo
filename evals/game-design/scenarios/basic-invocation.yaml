name: basic-invocation
description: >
  Verify the skill activates when a user wants to design a mobile game
  concept with monetization strategy.
trigger:
  user_message: >
    I want to design a free-to-play mobile puzzle game with in-app
    purchases. Can you help me plan the core loop and monetization?
expected_activation: true
flow:
  - id: start
    type: start
    next: design_core_loop
  - id: design_core_loop
    type: action
    expected_behavior: >
      Skill should design the core gameplay loop with session structure,
      progression mechanics, and engagement hooks.
    next: plan_monetization
  - id: plan_monetization
    type: action
    expected_behavior: >
      Skill should propose an IAP monetization model with price points,
      virtual economy balance, and retention mechanics.
    next: terminal
  - id: terminal
    type: terminal
    expected_outcome: >
      User receives a game design document with core loop, monetization
      plan, and soft launch strategy.

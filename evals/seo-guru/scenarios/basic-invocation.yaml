name: basic-invocation
description: >
  Verify the skill activates when a user wants to audit content for SEO optimization.
trigger:
  user_message: >
    Audit my blog post for SEO optimization including schema markup, meta tags, and AI answer engine visibility.
expected_activation: true
flow:
  - id: start
    type: start
    next: action_1
  - id: action_1
    type: action
    expected_behavior: >
      Skill should run a comprehensive SEO audit: crawlability, structured data, meta tags, and content structure.
    next: action_2
  - id: action_2
    type: action
    expected_behavior: >
      Skill should produce an optimization plan with GEO/AEO recommendations and schema markup implementation.
    next: terminal
  - id: terminal
    type: terminal
    expected_outcome: >
      User receives a prioritized SEO audit report with actionable fixes and AI answer engine optimization.

name: basic-invocation
description: >
  Verify the skill activates when a user wants to design a database schema
  and optimize queries for a PostgreSQL application.
trigger:
  user_message: >
    I need to design a schema for a multi-tenant SaaS app on PostgreSQL.
    Can you help me with the schema design and index strategy?
expected_activation: true
flow:
  - id: start
    type: start
    next: requirements_gathering
  - id: requirements_gathering
    type: action
    expected_behavior: >
      Skill should gather entity relationships, access patterns, and
      multi-tenancy model requirements before proposing schema.
    next: schema_design
  - id: schema_design
    type: action
    expected_behavior: >
      Skill should produce a normalized schema with index recommendations,
      partitioning strategy, and migration plan.
    next: terminal
  - id: terminal
    type: terminal
    expected_outcome: >
      User receives a complete schema with indexes, a migration plan,
      and query optimization guidance.

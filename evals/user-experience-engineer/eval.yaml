skill: trl-user-experience-engineer
version: 1.0.0
description: >
  Eval suite for the User Experience Engineer skill. Measures trigger precision
  across design-to-implementation workflows, accessibility, and specification quality.

dimensions:
  - name: trigger_precision
    weight: 0.30
    description: Correctly activates on UX/design cues and rejects non-design requests.
  - name: design_methodology
    weight: 0.25
    description: Applies structured design process (brief, wireframe, mockup, implementation).
  - name: accessibility_compliance
    weight: 0.20
    description: Ensures WCAG compliance, semantic HTML, keyboard navigation, ARIA.
  - name: implementation_quality
    weight: 0.15
    description: Produces production-ready code (Next.js, HTML/CSS, SVG) from designs.
  - name: specification_handoff
    weight: 0.10
    description: Generates clear specs, personas, user stories, screen inventories.

thresholds:
  pass: 0.70
  strong: 0.85
  excellent: 0.95

models_to_test:
  - claude-sonnet-4-20250514
  - claude-opus-4-20250115
  - gpt-4.1-2025-04-14
  - gemini-2.5-pro-preview-05-06

suites:
  - path: scenarios/basic-invocation.yaml
    type: directed_flow
  - path: exams/multiple-choice/trigger-precision.yaml
    type: mc_exam

skill: trl-terraform-engineer
version: 1.0.0
description: >
  Eval suite for the Terraform Engineer skill. Measures trigger precision,
  scenario execution quality, and domain knowledge depth across IaC workflows.

dimensions:
  - name: trigger_precision
    weight: 0.30
    description: Correctly activates on Terraform/IaC cues and rejects non-IaC requests.
  - name: module_architecture
    weight: 0.25
    description: Produces composable, versioned modules with clean interfaces.
  - name: multi_cloud_fluency
    weight: 0.20
    description: Idiomatic patterns per cloud provider (AWS, GCP, Azure, Cloudflare).
  - name: state_and_testing
    weight: 0.15
    description: Proper state management, terraform test, Terratest, policy-as-code.
  - name: security_hardening
    weight: 0.10
    description: No secrets in state, least-privilege IAM, drift detection.

thresholds:
  pass: 0.70
  strong: 0.85
  excellent: 0.95

models_to_test:
  - claude-sonnet-4-20250514
  - claude-opus-4-20250115
  - gpt-4.1-2025-04-14
  - gemini-2.5-pro-preview-05-06

suites:
  - path: scenarios/basic-invocation.yaml
    type: directed_flow
  - path: exams/multiple-choice/trigger-precision.yaml
    type: mc_exam

type: multiple_choice
skill: trl-terraform-engineer
description: >
  Tests whether the skill correctly triggers on Terraform/IaC signals
  and rejects non-Terraform requests. 5 questions, 4 options each.

questions:
  - id: q1
    stem: "A user says: 'I need to refactor our tfstate files — we're splitting prod and staging into separate workspaces.' Should the Terraform Engineer skill activate?"
    options:
      - label: A
        text: "Yes — tfstate and workspace management are core Terraform concerns."
        correct: true
      - label: B
        text: "No — this is a DevOps pipeline concern, not Terraform-specific."
        distractor_type: wrong_domain
      - label: C
        text: "Only if the user also mentions the cloud provider (AWS, GCP, etc.)."
        distractor_type: close_confusion
      - label: D
        text: "No — workspace management is handled by Terragrunt exclusively."
        distractor_type: fabricated
    explanation: >
      tfstate, workspaces, and state management are explicitly listed trigger
      signals for this skill.

  - id: q2
    stem: "A user says: 'Our Kubernetes Helm chart needs a new ingress annotation.' Should the Terraform Engineer skill activate?"
    options:
      - label: A
        text: "Yes — Kubernetes infrastructure is a Terraform provider concern."
        distractor_type: over_generalized
      - label: B
        text: "No — Helm chart modifications are not Terraform/HCL tasks."
        correct: true
      - label: C
        text: "Only if the user is using the Helm provider to manage releases via Terraform."
        distractor_type: close_confusion
      - label: D
        text: "Yes — all infrastructure-as-code tasks route to this skill."
        distractor_type: over_generalized
    explanation: >
      Helm chart template editing is a Kubernetes/Helm concern, not Terraform.
      Only triggers if the Helm provider in Terraform is being used to manage releases.

  - id: q3
    stem: "A user says: 'Help me write a Checkov policy to ban unencrypted S3 buckets.' Should the Terraform Engineer skill activate?"
    options:
      - label: A
        text: "Yes — Checkov is listed as a trigger term and policy-as-code is in scope."
        correct: true
      - label: B
        text: "No — Checkov is a runtime security scanner, not Terraform-related."
        distractor_type: wrong_domain
      - label: C
        text: "Only if the user also mentions running terraform plan."
        distractor_type: close_confusion
      - label: D
        text: "No — policy-as-code belongs to a compliance skill."
        distractor_type: wrong_domain
    explanation: >
      Checkov and policy-as-code are explicit trigger terms in the skill description.

  - id: q4
    stem: "A user says: 'I want to migrate from Terraform 0.13 to OpenTofu 1.8.' Should the Terraform Engineer skill activate?"
    options:
      - label: A
        text: "Yes — OpenTofu migration and version migration are trigger signals."
        correct: true
      - label: B
        text: "No — OpenTofu is a separate tool with its own skill."
        distractor_type: fabricated
      - label: C
        text: "Only if the user says 'Terraform' explicitly."
        distractor_type: close_confusion
      - label: D
        text: "No — version upgrades are operational, not architectural."
        distractor_type: wrong_domain
    explanation: >
      OpenTofu and version migration are explicit trigger terms in the skill description.

  - id: q5
    stem: "A user says: 'My ansible playbook is failing to connect to the bastion host.' Should the Terraform Engineer skill activate?"
    options:
      - label: A
        text: "Yes — bastion hosts are infrastructure and this involves connectivity."
        distractor_type: over_generalized
      - label: B
        text: "Only if the bastion was provisioned with Terraform."
        distractor_type: close_confusion
      - label: C
        text: "No — Ansible playbook debugging is configuration management, not Terraform/HCL."
        correct: true
      - label: D
        text: "Yes — network troubleshooting falls under infrastructure as code."
        distractor_type: over_generalized
    explanation: >
      Ansible is configuration management, not Terraform. The skill does not cover
      Ansible playbook debugging unless the user is provisioning the bastion via Terraform.

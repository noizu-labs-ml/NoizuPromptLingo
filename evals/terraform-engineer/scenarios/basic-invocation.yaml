name: basic-invocation
skill: trl-terraform-engineer
description: >
  User asks to create a basic VPC module. Tests that the skill activates,
  produces idiomatic Terraform, and structures the module correctly.

nodes:
  - id: start
    type: prompt
    input: >
      I need a Terraform module that creates a VPC with public and private
      subnets across 3 availability zones in AWS. Include proper tagging.
    expected_skills:
      - trl-terraform-engineer
    max_tokens: 200

  - id: action
    type: evaluate
    depends_on: [start]
    criteria:
      - Produces valid HCL syntax
      - Declares variables for vpc_cidr, azs, environment
      - Uses aws_vpc, aws_subnet resources
      - Includes outputs for vpc_id and subnet_ids
      - Follows module convention (main.tf, variables.tf, outputs.tf)
    scoring:
      each_criterion: 0.20

  - id: terminal
    type: verify
    depends_on: [action]
    checks:
      - No hardcoded values (all configurable via variables)
      - Proper tagging via variable or default tags block
      - Passes: terraform fmt check
    pass_threshold: 0.60

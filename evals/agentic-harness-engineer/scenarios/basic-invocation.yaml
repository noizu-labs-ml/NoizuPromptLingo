name: basic-invocation
description: >
  Verify the skill activates when a user wants to build an AI agent system
  with tool use capabilities.
trigger:
  user_message: >
    I want to build an AI agent that can call tools, maintain conversation
    state, and handle multi-step tasks. What architecture should I use?
expected_activation: true
flow:
  - id: start
    type: start
    next: assess_requirements
  - id: assess_requirements
    type: action
    expected_behavior: >
      Skill should analyze the requirements and recommend an agentic pattern
      (ReAct, plan-and-execute, or router) based on task complexity.
    next: propose_architecture
  - id: propose_architecture
    type: action
    expected_behavior: >
      Skill should generate a harness architecture with tool integration,
      state management, guardrails, and eval recommendations.
    next: terminal
  - id: terminal
    type: terminal
    expected_outcome: >
      User receives a concrete architecture recommendation with code
      scaffolding plan, security considerations, and eval strategy.

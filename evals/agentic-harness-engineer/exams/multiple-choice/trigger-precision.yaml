exam_type: multiple-choice
skill: agentic-harness-engineer
topic: trigger_precision
question_count: 5

questions:
  - id: tp-001
    question: >
      A user says "I need to add prompt injection defenses to my chatbot."
      Which skill should activate?
    options:
      - label: A
        text: agentic-harness-engineer
        correct: true
        distractor_type: null
      - label: B
        text: threat-modeler
        correct: false
        distractor_type: close_confusion
      - label: C
        text: agent-architect
        correct: false
        distractor_type: close_confusion
      - label: D
        text: content-generator
        correct: false
        distractor_type: fabricated
    explanation: >
      Prompt injection defense is an explicit agentic security trigger.
      threat-modeler handles broader system threat modeling, not LLM-specific
      prompt injection defenses.

  - id: tp-002
    question: >
      Which request should NOT trigger agentic-harness-engineer?
    options:
      - label: A
        text: "Build me a ReAct agent with tool sandboxing"
        correct: false
        distractor_type: close_confusion
      - label: B
        text: "Design a supervisor agent that routes to worker agents"
        correct: false
        distractor_type: wrong_domain
      - label: C
        text: "Write a Helm chart for my Kubernetes deployment"
        correct: true
        distractor_type: null
      - label: D
        text: "Set up eval pipelines for my LLM agent"
        correct: false
        distractor_type: over_generalized
    explanation: >
      Helm charts are kubernetes-engineer territory. agentic-harness-engineer
      covers LLM agent systems, not Kubernetes infrastructure.


name: basic-invocation
description: >
  Verify the skill activates when a user wants to design and run a structured experiment.
trigger:
  user_message: >
    I want to run an A/B test to determine if lazy loading images improves conversion rates by >5%.
expected_activation: true
flow:
  - id: start
    type: start
    next: action_1
  - id: action_1
    type: action
    expected_behavior: >
      Skill should help formulate a testable hypothesis with null/alternative, sample size, and success criteria.
    next: action_2
  - id: action_2
    type: action
    expected_behavior: >
      Skill should design the experiment methodology with control variables, data collection plan, and analysis framework.
    next: terminal
  - id: terminal
    type: terminal
    expected_outcome: >
      User receives a complete experiment design ready for execution with statistical significance thresholds.

name: basic-invocation
description: >
  Verify the skill activates when a user wants to start a technical
  newsletter and build a subscriber base.
trigger:
  user_message: >
    I want to start a Substack newsletter about Kubernetes patterns.
    How do I build an audience and monetize it?
expected_activation: true
flow:
  - id: start
    type: start
    next: platform_selection
  - id: platform_selection
    type: action
    expected_behavior: >
      Skill should compare Substack vs alternatives, recommend a launch
      strategy, and outline the growth playbook.
    next: monetization_plan
  - id: monetization_plan
    type: action
    expected_behavior: >
      Skill should propose a monetization model with free/paid tiers,
      pricing guidance, and conversion strategies.
    next: terminal
  - id: terminal
    type: terminal
    expected_outcome: >
      User receives a complete newsletter launch plan with platform
      choice, content strategy, and monetization roadmap.

name: basic-invocation
description: >
  Verify the skill activates when a user asks to create a sellable AI
  prompt library or package prompts for sale on Gumroad.
trigger:
  user_message: >
    I want to create a collection of ChatGPT prompts for copywriters
    and sell them on Gumroad. Can you help me scope and build this?
expected_activation: true
flow:
  - id: start
    type: start
    next: scope_product
  - id: scope_product
    type: action
    expected_behavior: >
      Skill should propose a product scoping workflow: identify niche,
      define prompt categories, validate demand, and outline deliverables.
    next: generate_outline
  - id: generate_outline
    type: action
    expected_behavior: >
      Skill should produce a structured product outline with sections
      for prompts, usage instructions, and example outputs.
    next: terminal
  - id: terminal
    type: terminal
    expected_outcome: >
      User receives a actionable product plan with pricing guidance,
      platform recommendations, and next steps.

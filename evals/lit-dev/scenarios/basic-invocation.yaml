name: basic-invocation
description: >
  Verify the skill activates when a user wants to build a web component with Lit.
trigger:
  user_message: >
    I want to create a custom date-picker web component using Lit v3 with Shadow DOM and reactive properties.
expected_activation: true
flow:
  - id: start
    type: start
    next: action_1
  - id: action_1
    type: action
    expected_behavior: >
      Skill should propose component architecture with reactive properties, Shadow DOM styling, and event handling.
    next: action_2
  - id: action_2
    type: action
    expected_behavior: >
      Skill should generate the complete Lit element with @customElement decorator, CSS, and tests.
    next: terminal
  - id: terminal
    type: terminal
    expected_outcome: >
      User receives a production-ready Lit v3 web component with proper encapsulation and TypeScript types.

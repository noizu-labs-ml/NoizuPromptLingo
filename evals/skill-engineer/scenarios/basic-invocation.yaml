name: basic-invocation
skill: trl-skill-engineer
description: >
  Verify that the skill correctly identifies a request to create a new agent
  skill and produces a scaffolded file tree with trigger language.

nodes:
  - id: start
    type: start
    prompt: >
      I want to create a skill for generating Terraform modules. It should
      help users scaffold provider blocks, resource definitions, and variable
      files following best practices. Can you design and scaffold this?
    expected_behavior: >
      Recognize the request as a skill-engineering task. Initiate the
      discovery-driven process: extract requirements, identify audience,
      scope boundaries, then generate the scaffold.
    edges:
      - action

  - id: action
    type: action
    expected_behavior: >
      Produce a complete skill scaffold including SKILL.md with frontmatter
      (name, description with trigger language), structured content sections,
      and a file tree. Include engineered trigger language with the
      "even if they don't say X" pattern.
    edges:
      - terminal

  - id: terminal
    type: terminal
    expected_behavior: >
      Deliver a scaffolded skill with proper SKILL.md frontmatter, trigger
      language covering core use cases and synonyms, and a content structure
      appropriate for a Terraform-module-generation skill.
    pass_criteria:
      - Generates SKILL.md with valid YAML frontmatter
      - Trigger language includes "even if they don't say" clause
      - Includes at least 3 alias triggers (e.g., IaC, HCL, infrastructure modules)
      - Content structure covers scaffold generation and quality validation

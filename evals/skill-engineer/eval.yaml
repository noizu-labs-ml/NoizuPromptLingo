  requirement_extraction: 0.80
  scaffold_generation: 0.80
  trigger_language_engineering: 0.75
  mcp_tool_integration: 0.70
  quality_validation: 0.75

models_to_test:
  - claude-opus-4-20250514
  - claude-sonnet-4-20250514
  - gpt-4.1
  - gemini-2.5-pro

scenarios:
  - scenarios/basic-invocation.yaml

exams:
  - exams/multiple-choice/trigger-precision.yaml

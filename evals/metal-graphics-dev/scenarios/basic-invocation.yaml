name: basic-invocation
description: >
  Verify the skill activates when a user wants to write Metal shaders for a macOS graphics app.
trigger:
  user_message: >
    I want to write a Metal compute shader for image processing on macOS with an MTKView-based UI.
expected_activation: true
flow:
  - id: start
    type: start
    next: action_1
  - id: action_1
    type: action
    expected_behavior: >
      Skill should propose Metal compute pipeline architecture with shader code, buffer management, and GPU synchronization.
    next: action_2
  - id: action_2
    type: action
    expected_behavior: >
      Skill should generate MSL shader code and Swift integration with CAMetalLayer/MTKView rendering loop.
    next: terminal
  - id: terminal
    type: terminal
    expected_outcome: >
      User receives a complete Metal compute pipeline with shader code and Swift host application.

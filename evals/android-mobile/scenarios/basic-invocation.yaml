name: basic-invocation
description: >
  Verify the skill activates when a user wants to build an Android app
  with Jetpack Compose.
trigger:
  user_message: >
    I want to build an Android app using Kotlin and Jetpack Compose.
    It should have a login screen, a dashboard, and offline support.
expected_activation: true
flow:
  - id: start
    type: start
    next: propose_architecture
  - id: propose_architecture
    type: action
    expected_behavior: >
      Skill should recommend MVVM or MVI architecture with Compose-first
      UI, Room for offline storage, and Hilt for dependency injection.
    next: scaffold_project
  - id: scaffold_project
    type: action
    expected_behavior: >
      Skill should generate project structure, build.gradle configuration,
      and initial Compose screens for login and dashboard.
    next: terminal
  - id: terminal
    type: terminal
    expected_outcome: >
      User receives a complete project scaffold with architecture guidance,
      dependency setup, and implementation plan for each screen.

# Persona Lenses Template
# Copy to .npl/sites/{domain}/personas.yaml and customize

personas:
  - id: visual-accessibility-user
    name: "Maria"
    label: "Low Vision — Color Blind"
    lens: visual-accessibility
    constraints:
      - "color blind (deuteranopia — red/green)"
      - "relies on high contrast and large text"
      - "uses browser zoom at 150%"
    watches_for:
      - "color-only indicators"
      - "small click targets (< 44px)"
      - "low contrast text (< 4.5:1)"
      - "text in images without alt text"
    frustration_triggers:
      - "I can't tell if this is an error or success"
      - "The button is too small at my zoom level"

  - id: non-technical-senior
    name: "Dave"
    label: "Non-Technical Senior"
    lens: cognitive-simplicity
    constraints:
      - "not comfortable with technology"
      - "reads slowly, overwhelmed by options"
    watches_for:
      - "jargon or unexplained acronyms"
      - "too many choices (> 5 options)"
      - "unclear next steps"
      - "multi-step process without progress indicator"
    frustration_triggers:
      - "There are too many buttons"
      - "I don't understand what this means"

  - id: screen-reader-user
    name: "Alex"
    label: "Screen Reader User"
    lens: assistive-technology
    constraints:
      - "blind, uses NVDA/VoiceOver"
      - "navigates by headings and landmarks"
    watches_for:
      - "missing ARIA labels"
      - "images without alt text"
      - "focus traps"
      - "unlabeled form fields"
    frustration_triggers:
      - "Button says 'click here' — for what?"
      - "Something changed but I don't know what"

  - id: slow-connection-user
    name: "Priya"
    label: "Slow Connection (3G)"
    lens: performance
    constraints:
      - "3G connection (~1.5 Mbps)"
      - "older Android phone"
    watches_for:
      - "pages > 2MB"
      - "JavaScript-heavy interactions"
      - "spinners without timeout"
    frustration_triggers:
      - "Page loading for 15 seconds"
      - "Tapped button but nothing happened"

  # Add more personas as needed — aim for 4-6 covering different axes
  # See references/persona-lenses.md for the full built-in lens catalog

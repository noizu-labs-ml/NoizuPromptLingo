# Goal Flow Template
# Copy to .npl/sites/{domain}/goals/{goal-slug}.yaml and fill in

goal: goal-slug
description: "What the user wants to accomplish"
preconditions:
  - "condition that must be true before starting"
success_criteria:
  - "how we know the goal was achieved"
estimated_steps: 3-5

flow:
  - id: start
    action: navigate
    target: home
    next: step-two

  - id: step-two
    action: click  # navigate | search | click | interact | observe | form-fill | submit | redirect | verify
    target: element-id
    on_success: next-step
    on_failure: fallback-step
    # note: "Context for the tester"
    # requires_auth: true
    # auth_redirect: login
    # repeat_until: "condition"
    # max_iterations: 10
    # on_max: timeout-step
    # conditions:
    #   - value: "state A"
    #     next: path-a
    #   - value: "state B"
    #     next: path-b

  - id: done
    action: terminal
    result: success  # success | failure | blocked
    verify: "What to check"
    # reason: "Why it failed" (for failure terminals)

variables:
  variable_name:
    description: "What this variable represents"
    example: "example value"

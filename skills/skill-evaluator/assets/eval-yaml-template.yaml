# Eval Suite Template
# Copy to ~/.claude/evals/{skill-name}/eval.yaml

skill: ""  # Skill name (kebab-case)
version: "1.0"
description: ""
author: ""
created: 2025-01-01
last_run: null

dimensions:
  - task_accuracy
  - flow_adherence
  - recovery_ability
  - edge_case_handling
  - instruction_following
  - self_containment
  - cross_reference

thresholds:
  min_pass_rate: 0.80
  task_accuracy: 0.85
  flow_adherence: 0.80
  recovery_ability: 0.70
  regression_delta: -0.05

models_to_test:
  - model: claude-opus-4-7
    temperature: 0.3
  - model: claude-sonnet-4-6
    temperature: 0.3
  - model: claude-haiku-4-5
    temperature: 0.3

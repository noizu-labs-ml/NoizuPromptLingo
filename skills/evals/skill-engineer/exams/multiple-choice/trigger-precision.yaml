exam: trigger-precision
skill: trl-skill-engineer
type: multiple_choice
question_count: 5
pass_threshold: 0.80

questions:
  - id: q1
    prompt: >
      A user says: "I want to create a Claude Code skill that helps users write
      and refactor Terraform modules. Can you scaffold it?"
    should_trigger: true
    options:
      - label: A
        text: "This triggers skill-engineer — it's a direct request to create and scaffold a new agent skill."
        distractor_type: correct
      - label: B
        text: "This triggers the terraform-engineer skill — Terraform is the domain, not skill creation."
        distractor_type: wrong_domain
      - label: C
        text: "This triggers skill-engineer but only if the user says 'prompt playbook' or 'knowledge module'."
        distractor_type: close_confusion
      - label: D
        text: "This does NOT trigger skill-engineer — Claude Code skills are outside its scope."
        distractor_type: fabricated
    correct: A

  - id: q2
    prompt: >
      A user says: "Find me a good MCP server for reading GitHub issues and
      pull requests."
    should_trigger: true
    options:
      - label: A
        text: "This does NOT trigger skill-engineer — MCP server discovery is not part of the skill."
        distractor_type: fabricated
      - label: B
        text: "This triggers the rapid-prototype skill — finding tools is prototyping."
        distractor_type: wrong_domain
      - label: C
        text: "This triggers skill-engineer — MCP tool catalog and selection are listed as core capabilities."
        distractor_type: correct
      - label: D
        text: "This triggers skill-engineer only if the user is building a skill that uses MCP tools."
        distractor_type: over_generalized
    correct: C

  - id: q3
    prompt: >
      A user says: "Write me a system prompt for a customer service chatbot."
    should_trigger: false
    options:
      - label: A
        text: "This triggers skill-engineer — system prompts are part of skill/prompt engineering."
        distractor_type: over_generalized
      - label: B
        text: "This does NOT trigger skill-engineer — writing a single system prompt is not building a skill scaffold or agent capability."
        distractor_type: correct
      - label: C
        text: "This triggers skill-engineer because prompt engineering for agents is a listed trigger."
        distractor_type: close_confusion
      - label: D
        text: "This triggers the agent-architect skill exclusively."
        distractor_type: wrong_domain
    correct: B

  - id: q4
    prompt: >
      A user says: "I have a skill that's not triggering correctly. Can you
      review its trigger language and fix the description?"
    should_trigger: true
    options:
      - label: A
        text: "This triggers skill-evaluator — evaluating skill quality is that skill's domain."
        distractor_type: close_confusion
      - label: B
        text: "This triggers skill-engineer — trigger language engineering and quality validation are core to the skill."
        distractor_type: correct
      - label: C
        text: "This triggers skill-engineer only if the user asks to rebuild the entire skill."
        distractor_type: over_generalized
      - label: D
        text: "This does NOT trigger any skill — trigger debugging is not a documented capability."
        distractor_type: fabricated
    correct: B

  - id: q5
    prompt: >
      A user says: "Design a structured knowledge module for a medical diagnosis
      assistant, with decision trees and evidence weights."
    should_trigger: true
    options:
      - label: A
        text: "This does NOT trigger skill-engineer — medical diagnosis is outside the domain."
        distractor_type: wrong_domain
      - label: B
        text: "This triggers the research-and-development skill because it involves evidence weights."
        distractor_type: fabricated
      - label: C
        text: "This triggers skill-engineer — structuring a knowledge module is a core capability regardless of domain."
        distractor_type: correct
      - label: D
        text: "This triggers skill-engineer only if the user explicitly mentions 'skill' or 'agent'."
        distractor_type: close_confusion
    correct: C

skill: trl-technical-writer
version: "1.0.0"
description: >
  Evaluate the technical-writer skill's ability to author, proof-edit, and
  review software documentation — onboarding guides, API docs, READMEs,
  runbooks, changelogs, and architecture documents.

dimensions:
  - trigger_precision
  - authoring_methodology
  - proof_editing
  - structural_editing
  - audience_calibration
  - completeness_audit

thresholds:
  trigger_precision: 0.90
  authoring_methodology: 0.80
  proof_editing: 0.85
  structural_editing: 0.80
  audience_calibration: 0.75
  completeness_audit: 0.80

models_to_test:
  - claude-opus-4-20250514
  - claude-sonnet-4-20250514
  - gpt-4.1
  - gemini-2.5-pro

scenarios:
  - scenarios/basic-invocation.yaml

exams:
  - exams/multiple-choice/trigger-precision.yaml

name: basic-invocation
skill: trl-technical-writer
description: >
  Verify that the skill correctly identifies a documentation request and
  produces audience-calibrated technical writing following its methodology.

nodes:
  - id: start
    type: start
    prompt: >
      I have a Python library that wraps the Stripe API. There's no README or
      API docs. Can you write a getting-started guide and API reference for
      new users?
    expected_behavior: >
      Recognize the request as a technical-writing task requiring authoring
      from scratch. Begin with audience identification (new users) and
      document type selection (getting-started + API reference).
    edges:
      - action

  - id: action
    type: action
    expected_behavior: >
      Produce documentation that includes: installation instructions,
      quick-start example, configuration guide, and at least a skeleton API
      reference with endpoint/method signatures. Apply audience calibration
      for developers new to the library.
    edges:
      - terminal

  - id: terminal
    type: terminal
    expected_behavior: >
      Deliver clear, correct documentation with proper structure, code
      examples, and consistent terminology. The getting-started guide should
      be actionable (copy-paste friendly) and the API reference should be
      scannable.
    pass_criteria:
      - Produces a getting-started guide with installation and first example
      - Produces at least a skeleton API reference
      - Includes runnable code examples
      - Writing is audience-calibrated for new users (no unexplained jargon)

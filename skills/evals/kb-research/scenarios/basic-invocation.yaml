name: basic-invocation
description: >
  Verify the skill activates when a user wants to find learning resources on a topic.
trigger:
  user_message: >
    Find me the best books and academic papers on distributed consensus algorithms with ISBNs and synopses.
expected_activation: true
flow:
  - id: start
    type: start
    next: action_1
  - id: action_1
    type: action
    expected_behavior: >
      Skill should dispatch parallel subagents to search books, articles, and academic paper sources.
    next: action_2
  - id: action_2
    type: action
    expected_behavior: >
      Skill should compile an annotated bibliography with full metadata, quality scores, and deduplication.
    next: terminal
  - id: terminal
    type: terminal
    expected_outcome: >
      User receives a ranked, annotated bibliography with ISBNs, synopses, and open-access pointers.

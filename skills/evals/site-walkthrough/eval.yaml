skill: site-walkthrough
version: "1.0.0"
description: >
  Evaluate the site-walkthrough skill's ability to model websites as structured
  inventories, generate directed task-flow graphs for user journey validation,
  and run persona-driven journey logs.

dimensions:
  - trigger_precision
  - site_inventory_modeling
  - task_flow_generation
  - conditional_branching
  - persona_coverage
  - completion_validation

thresholds:
  trigger_precision: 0.90
  site_inventory_modeling: 0.80
  task_flow_generation: 0.80
  conditional_branching: 0.75
  persona_coverage: 0.75
  completion_validation: 0.80

models_to_test:
  - claude-opus-4-20250514
  - claude-sonnet-4-20250514
  - gpt-4.1
  - gemini-2.5-pro

scenarios:
  - scenarios/basic-invocation.yaml

exams:
  - exams/multiple-choice/trigger-precision.yaml

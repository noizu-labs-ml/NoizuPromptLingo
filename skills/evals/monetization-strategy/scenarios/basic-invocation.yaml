name: basic-invocation
description: >
  Verify the skill activates when a user wants to choose between different income stream options.
trigger:
  user_message: >
    I'm a developer with 10 hours a week. Should I build AI templates, start a newsletter, or do print on demand?
expected_activation: true
flow:
  - id: start
    type: start
    next: action_1
  - id: action_1
    type: action
    expected_behavior: >
      Skill should assess the user's strengths, constraints, timeline, and risk tolerance.
    next: action_2
  - id: action_2
    type: action
    expected_behavior: >
      Skill should compare all three streams and recommend the best fit with a sequenced rollout plan.
    next: terminal
  - id: terminal
    type: terminal
    expected_outcome: >
      User receives a personalized income stream recommendation with rationale and implementation roadmap.

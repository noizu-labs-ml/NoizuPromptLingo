name: basic-invocation
description: >
  Verify the skill activates when a user wants to build a React component with Next.js App Router.
trigger:
  user_message: >
    I need to build a Next.js 15 page with server components, streaming SSR, and RTK Query for data fetching.
expected_activation: true
flow:
  - id: start
    type: start
    next: action_1
  - id: action_1
    type: action
    expected_behavior: >
      Skill should architect the page with RSC data fetching, streaming boundaries, and RTK Query integration.
    next: action_2
  - id: action_2
    type: action
    expected_behavior: >
      Skill should generate the implementation with proper 'use client' boundaries, loading states, and type-safe API calls.
    next: terminal
  - id: terminal
    type: terminal
    expected_outcome: >
      User receives a working Next.js page with server components, streaming, and optimized data fetching.

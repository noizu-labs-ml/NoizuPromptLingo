name: basic-invocation
description: >
  Verify the skill activates when a user wants to build an iOS app
  with SwiftUI.
trigger:
  user_message: >
    I want to build an iOS app using SwiftUI with a list/detail layout,
    CloudKit sync, and App Store submission.
expected_activation: true
flow:
  - id: start
    type: start
    next: architecture_design
  - id: architecture_design
    type: action
    expected_behavior: >
      Skill should propose MVVM architecture with SwiftUI views,
      CloudKit integration pattern, and data layer design.
    next: implementation_plan
  - id: implementation_plan
    type: action
    expected_behavior: >
      Skill should provide Xcode project setup, view hierarchy, and
      App Store submission checklist.
    next: terminal
  - id: terminal
    type: terminal
    expected_outcome: >
      User receives a complete iOS app plan with SwiftUI architecture,
      CloudKit integration, and submission guidance.

name: basic-invocation
description: >
  Verify the skill activates when a user wants to plan and specify an MCP server before implementation.
trigger:
  user_message: >
    I want to design an MCP server that exposes my company's internal APIs as tools for Claude. Can you help me spec it out?
expected_activation: true
flow:
  - id: start
    type: start
    next: action_1
  - id: action_1
    type: action
    expected_behavior: >
      Skill should guide through checklist-driven specification: tool surface design, transport selection, and security review.
    next: action_2
  - id: action_2
    type: action
    expected_behavior: >
      Skill should produce a complete specification with tool manifest (JSON Schema), ADRs, and threat model worksheet.
    next: terminal
  - id: terminal
    type: terminal
    expected_outcome: >
      User receives a comprehensive MCP server specification ready for implementation by mcp-forge.

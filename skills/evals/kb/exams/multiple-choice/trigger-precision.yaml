exam_type: multiple-choice
skill: kb
topic: trigger_precision
question_count: 5

questions:
  - id: tp-001
    question: >
      "Build me a reading list for distributed systems." Which skill?
    options:
      - label: A
        text: kb
        correct: true
        distractor_type: null
      - label: B
        text: kb-research
        correct: false
        distractor_type: close_confusion
      - label: C
        text: content-generator
        correct: false
        distractor_type: wrong_domain
      - label: D
        text: kb-curriculum
        correct: false
        distractor_type: close_confusion
    explanation: >
      kb is the parent skill that orchestrates the full learning path
      including reading lists. kb-research handles resource discovery
      only. kb-curriculum handles sequencing.

  - id: tp-002
    question: >
      Which should NOT trigger kb?
    options:
      - label: A
        text: "Create a curriculum for learning machine learning"
        correct: false
        distractor_type: close_confusion
      - label: B
        text: "Produce a knowledge digest on quantum computing"
        correct: false
        distractor_type: wrong_domain
      - label: C
        text: "Debug my Terraform state lock issue"
        correct: true
        distractor_type: null
      - label: D
        text: "Help me research a topic in depth"
        correct: false
        distractor_type: over_generalized
    explanation: >
      Terraform state debugging is terraform-engineer territory.

  - id: tp-003
    question: >
      "Self-study" and "autodidact" are trigger phrases for which skill?
    options:
      - label: A
        text: kb
        correct: true
        distractor_type: null
      - label: B
        text: kb-curriculum
        correct: false
        distractor_type: close_confusion
      - label: C
        text: research-and-development
        correct: false
        distractor_type: wrong_domain
      - label: D
        text: kb-digest
        correct: false
        distractor_type: fabricated
    explanation: >
      "Self-study" and "autodidact" are explicit triggers for kb as
      the parent knowledge-gathering skill.

  - id: tp-004
    question: >
      A user asks for a "literature review" on a technical topic.
      Primary skill?
    options:
      - label: A
        text: content-generator
        correct: false
        distractor_type: wrong_domain
      - label: B
        text: kb
        correct: true
        distractor_type: null
      - label: C
        text: kb-research
        correct: false
        distractor_type: close_confusion
      - label: D
        text: technical-writer
        correct: false
        distractor_type: close_confusion
    explanation: >
      "Literature review" triggers kb as listed in the description.
      kb-research would handle the resource discovery subtask.

  - id: tp-005
    question: >
      What distinguishes kb from its sub-skills (kb-research, kb-curriculum,
      kb-digest)?
    options:
      - label: A
        text: "kb orchestrates the full pipeline; sub-skills handle individual stages"
        correct: true
        distractor_type: null
      - label: B
        text: "kb only handles books; sub-skills handle articles"
        correct: false
        distractor_type: fabricated
      - label: C
        text: "They are independent skills with overlapping triggers"
        correct: false
        distractor_type: wrong_domain
      - label: D
        text: "kb is deprecated in favor of the sub-skills"
        correct: false
        distractor_type: over_generalized
    explanation: >
      kb is the parent orchestrator that dispatches to sub-skills
      for resource discovery, curriculum design, and synthesis.

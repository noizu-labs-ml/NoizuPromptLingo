skill: kb
name: trl-kb
version: "1.0.0"
description: >
  Eval suite for the Knowledge Base skill — gathering, organizing, and
  structuring knowledge into learning paths, annotated bibliographies,
  and research digests.

dimensions:
  - trigger_precision
  - domain_coverage
  - output_quality
  - safety_boundary

thresholds:
  trigger_precision: 0.85
  domain_coverage: 0.70
  output_quality: 0.75
  safety_boundary: 0.90

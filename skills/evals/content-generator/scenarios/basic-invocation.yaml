name: basic-invocation
description: >
  Verify the skill activates when a user wants to research trending
  topics and generate article ideas.
trigger:
  user_message: >
    I want to find trending topics in the Kubernetes space and generate
    10 article ideas with abstracts for Dev.to.
expected_activation: true
flow:
  - id: start
    type: start
    next: research_trends
  - id: research_trends
    type: action
    expected_behavior: >
      Skill should search for trending Kubernetes topics across web,
      communities, and social media with keyword mining.
    next: generate_ideas
  - id: generate_ideas
    type: action
    expected_behavior: >
      Skill should produce 10 article ideas with titles, abstracts,
      metadata, and prioritization scores.
    next: terminal
  - id: terminal
    type: terminal
    expected_outcome: >
      User receives a prioritized list of article ideas with platform-optimized
      abstracts ready for drafting.

exam_type: multiple-choice
skill: ai-templates
topic: trigger_precision
question_count: 5

questions:
  - id: tp-001
    question: >
      A user says "I want to build a ChatGPT plugin that helps real estate
      agents write property descriptions and sell it as a digital product."
      Which skill should activate?
    options:
      - label: A
        text: ai-templates
        correct: true
        distractor_type: null
      - label: B
        text: mcp-forge
        correct: false
        distractor_type: close_confusion
      - label: C
        text: content-generator
        correct: false
        distractor_type: wrong_domain
      - label: D
        text: react-engineer
        correct: false
        distractor_type: fabricated
    explanation: >
      Building a sellable AI product (ChatGPT plugin sold as a digital
      product) is the core trigger for ai-templates. mcp-forge is about
      server implementation, not product monetization.

  - id: tp-002
    question: >
      Which of these requests should NOT trigger ai-templates?
    options:
      - label: A
        text: "I want to package my automation workflows as a product"
        correct: false
        distractor_type: close_confusion
      - label: B
        text: "Help me write a blog post about machine learning"
        correct: true
        distractor_type: null
      - label: C
        text: "I need to create a GPT configuration bundle to sell"
        correct: false
        distractor_type: wrong_domain
      - label: D
        text: "I want to optimize my Gumroad listing for prompt packs"
        correct: false
        distractor_type: over_generalized
    explanation: >
      Writing a blog post is content-generator territory. ai-templates
      is about building sellable AI digital products, not writing articles.

  - id: tp-003
    question: >
      A user mentions "prompt engineering for sale." Which skill is the
      primary match according to trigger language?
    options:
      - label: A
        text: ai-templates
        correct: true
        distractor_type: null
      - label: B
        text: skill-engineer
        correct: false
        distractor_type: close_confusion
      - label: C
        text: content-publishing
        correct: false
        distractor_type: wrong_domain
      - label: D
        text: monetization-strategy
        correct: false
        distractor_type: over_generalized
    explanation: >
      "Prompt engineering for sale" is an explicit trigger phrase for
      ai-templates. skill-engineer builds agent skills, not products
      for sale.

  - id: tp-004
    question: >
      A user asks "Can you help me design an MCP server tool surface?"
      Which skill should activate instead of ai-templates?
    options:
      - label: A
        text: ai-templates
        correct: false
        distractor_type: over_generalized
      - label: B
        text: mcp-architect
        correct: true
        distractor_type: null
      - label: C
        text: mcp-forge
        correct: false
        distractor_type: close_confusion
      - label: D
        text: plugin-architect
        correct: false
        distractor_type: wrong_domain
    explanation: >
      MCP server tool surface design is mcp-architect territory.
      mcp-forge is for scaffolding/implementation, not spec design.

  - id: tp-005
    question: >
      Which scenario is closest to the boundary between ai-templates and
      mcp-builder but should still trigger ai-templates?
    options:
      - label: A
        text: "I want to build and sell an MCP server as a digital product"
        correct: true
        distractor_type: null
      - label: B
        text: "I need to scaffold an MCP server for internal use"
        correct: false
        distractor_type: close_confusion
      - label: C
        text: "Help me write Terraform for my infrastructure"
        correct: false
        distractor_type: fabricated
      - label: D
        text: "I want to design a game monetization strategy"
        correct: false
        distractor_type: wrong_domain
    explanation: >
      Selling an MCP server as a digital product triggers ai-templates
      because the intent is product monetization. Internal MCP server
      building triggers mcp-builder instead.

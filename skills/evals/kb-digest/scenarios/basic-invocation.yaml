name: basic-invocation
description: >
  Verify the skill activates when a user wants a complexity-calibrated summary of a research topic.
trigger:
  user_message: >
    Give me an ELI5 explanation of transformer attention mechanisms with source citations.
expected_activation: true
flow:
  - id: start
    type: start
    next: action_1
  - id: action_1
    type: action
    expected_behavior: >
      Skill should assess the target complexity level (ELI5) and identify available sources for synthesis.
    next: action_2
  - id: action_2
    type: action
    expected_behavior: >
      Skill should produce a complexity-calibrated digest with citations, cross-references, and gap analysis.
    next: terminal
  - id: terminal
    type: terminal
    expected_outcome: >
      User receives an ELI5-level knowledge digest with proper source attribution and identified knowledge gaps.

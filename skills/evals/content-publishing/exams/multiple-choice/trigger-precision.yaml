exam_type: multiple-choice
skill: content-publishing
topic: trigger_precision
question_count: 5

questions:
  - id: tp-001
    question: >
      A user says "I want to monetize my writing on Substack." Which skill?
    options:
      - label: A
        text: content-publishing
        correct: true
        distractor_type: null
      - label: B
        text: content-generator
        correct: false
        distractor_type: close_confusion
      - label: C
        text: monetization-strategy
        correct: false
        distractor_type: close_confusion
      - label: D
        text: ai-templates
        correct: false
        distractor_type: wrong_domain
    explanation: >
      Monetizing writing on Substack is the core domain of content-publishing.
      content-generator handles ideation, not monetization strategy.

  - id: tp-002
    question: >
      Which should NOT trigger content-publishing?
    options:
      - label: A
        text: "How do I convert free readers to paid subscribers?"
        correct: false
        distractor_type: close_confusion
      - label: B
        text: "Plan my content calendar for SEO optimization"
        correct: false
        distractor_type: wrong_domain
      - label: C
        text: "Design a database schema for my SaaS app"
        correct: true
        distractor_type: null
      - label: D
        text: "Build a subscriber base for my technical blog"
        correct: false
        distractor_type: over_generalized
    explanation: >
      Database schema design is dba-db-designer-and-tuning territory,
      not content publishing.

  - id: tp-003
    question: >
      "Blogging for income" is an explicit trigger for which skill?
    options:
      - label: A
        text: monetization-strategy
        correct: false
        distractor_type: close_confusion
      - label: B
        text: content-publishing
        correct: true
        distractor_type: null
      - label: C
        text: content-generator
        correct: false
        distractor_type: wrong_domain
      - label: D
        text: conversion-engineer
        correct: false
        distractor_type: fabricated
    explanation: >
      "Blogging for income" is an explicit trigger phrase for
      content-publishing per the skill description.

  - id: tp-004
    question: >
      A user wants to "optimize articles for SEO." Is this content-publishing
      or seo-guru?
    options:
      - label: A
        text: "content-publishing — it covers SEO optimization for articles"
        correct: false
        distractor_type: over_generalized
      - label: B
        text: "seo-guru — it specializes in search engine optimization"
        correct: true
        distractor_type: null
      - label: C
        text: "Both equally — the boundary is unclear"
        correct: false
        distractor_type: close_confusion
      - label: D
        text: "content-generator — it handles article optimization"
        correct: false
        distractor_type: wrong_domain
    explanation: >
      SEO optimization is the primary domain of seo-guru. content-publishing
      may mention SEO but defers deep optimization to the specialist skill.

  - id: tp-005
    question: >
      "Building an audience through writing" triggers which skill?
    options:
      - label: A
        text: content-generator
        correct: false
        distractor_type: wrong_domain
      - label: B
        text: content-publishing
        correct: true
        distractor_type: null
      - label: C
        text: market-intelligence
        correct: false
        distractor_type: close_confusion
      - label: D
        text: proposal-writer
        correct: false
        distractor_type: fabricated
    explanation: >
      "Building an audience through writing" is an explicit trigger for
      content-publishing.

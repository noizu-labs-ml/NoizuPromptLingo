type: multiple_choice
skill: trl-threat-modeler
description: >
  Tests whether the skill correctly triggers on security/threat-modeling signals
  and rejects non-security requests. 5 questions, 4 options each.

questions:
  - id: q1
    stem: "A user says: 'We need to identify attack surfaces on our microservices architecture before launch.' Should the Threat Modeler skill activate?"
    options:
      - label: A
        text: "Yes — attack surface enumeration is a core trigger signal."
        correct: true
      - label: B
        text: "No — this is a penetration testing task requiring a pentester."
        distractor_type: wrong_domain
      - label: C
        text: "Only if the user specifies a methodology like STRIDE."
        distractor_type: close_confusion
      - label: D
        text: "Yes, but only for the network layer, not application logic."
        distractor_type: over_generalized
    explanation: >
      Attack surface identification is explicitly listed in the skill's trigger language.

  - id: q2
    stem: "A user says: 'I need to set up RBAC policies for our Kubernetes cluster.' Should the Threat Modeler skill activate?"
    options:
      - label: A
        text: "Yes — Kubernetes hardening and RBAC audits are trigger signals."
        correct: true
      - label: B
        text: "No — RBAC is an operational concern, not threat modeling."
        distractor_type: wrong_domain
      - label: C
        text: "Only if the user also mentions a compliance framework."
        distractor_type: close_confusion
      - label: D
        text: "No — Kubernetes RBAC belongs to a platform engineering skill."
        distractor_type: wrong_domain
    explanation: >
      Kubernetes hardening, container security, and RBAC audits are explicit trigger
      terms in the skill description.

  - id: q3
    stem: "A user says: 'Our SOC2 auditor asked for a gap analysis of our cloud infrastructure.' Should the Threat Modeler skill activate?"
    options:
      - label: A
        text: "Yes — SOC2 compliance mapping and gap analysis are trigger signals."
        correct: true
      - label: B
        text: "No — SOC2 audits should be handled by a compliance-only specialist."
        distractor_type: fabricated
      - label: C
        text: "Only if the user also mentions specific security controls."
        distractor_type: close_confusion
      - label: D
        text: "No — audit preparation is a project management task."
        distractor_type: wrong_domain
    explanation: >
      SOC2, compliance audit, and gap analysis are explicit trigger terms.

  - id: q4
    stem: "A user says: 'Help me configure Prometheus alerting rules for high CPU usage.' Should the Threat Modeler skill activate?"
    options:
      - label: A
        text: "Yes — monitoring is part of a defense-in-depth security posture."
        distractor_type: over_generalized
      - label: B
        text: "Only if the alerts are for security events (failed logins, etc.)."
        distractor_type: close_confusion
      - label: C
        text: "No — Prometheus alerting configuration is an observability/SRE task, not threat modeling."
        correct: true
      - label: D
        text: "Yes — all infrastructure hardening falls under threat modeling."
        distractor_type: over_generalized
    explanation: >
      General Prometheus alerting for CPU usage is an SRE/observability concern,
      not a threat modeling or security analysis task.

  - id: q5
    stem: "A user says: 'I need to create an incident response playbook for ransomware attacks.' Should the Threat Modeler skill activate?"
    options:
      - label: A
        text: "Yes — incident response planning is explicitly listed as a trigger signal."
        correct: true
      - label: B
        text: "No — incident response is handled by a separate IR skill."
        distractor_type: fabricated
      - label: C
        text: "Only if the user mentions specific compliance requirements."
        distractor_type: close_confusion
      - label: D
        text: "No — ransomware response is an operational runbook, not threat modeling."
        distractor_type: wrong_domain
    explanation: >
      Incident response plan creation is explicitly listed in the skill's trigger language.

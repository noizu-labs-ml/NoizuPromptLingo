name: basic-invocation
skill: trl-threat-modeler
description: >
  User asks to threat model a REST API. Tests that the skill activates,
  selects an appropriate methodology, and produces structured findings.

nodes:
  - id: start
    type: prompt
    input: >
      Can you threat model our REST API? It handles user authentication
      with JWT tokens, stores PII in PostgreSQL, and is exposed via
      an AWS ALB. We need to identify the top risks.
    expected_skills:
      - trl-threat-modeler
    max_tokens: 200

  - id: action
    type: evaluate
    depends_on: [start]
    criteria:
      - Selects a named methodology (STRIDE, PASTA, or OCTAVE)
      - Identifies trust boundaries (public internet, API layer, data layer)
      - Enumerates specific threats (e.g., token theft, SQL injection, PII exposure)
      - Provides risk ratings with likelihood and impact
      - References OWASP Top 10 or similar framework
    scoring:
      each_criterion: 0.20

  - id: terminal
    type: verify
    depends_on: [action]
    checks:
      - Output is structured (not freeform prose)
      - Includes at least 3 distinct threat categories
      - Recommendations are actionable, not generic ("use HTTPS")
    pass_threshold: 0.60

name: basic-invocation
description: >
  Verify the skill activates when a user wants to make their application extensible via plugins.
trigger:
  user_message: >
    I want to add a plugin system to my Node.js app so third parties can extend it without modifying core code.
expected_activation: true
flow:
  - id: start
    type: start
    next: action_1
  - id: action_1
    type: action
    expected_behavior: >
      Skill should analyze the application and identify appropriate extension points with hook/event/slot patterns.
    next: action_2
  - id: action_2
    type: action
    expected_behavior: >
      Skill should design a plugin registry with lifecycle management, security sandboxing, and developer SDK scaffold.
    next: terminal
  - id: terminal
    type: terminal
    expected_outcome: >
      User receives a complete plugin architecture with extension point contracts, registry, and SDK template.

exam: trigger-precision
skill: trl-skill-evaluator
type: multiple_choice
question_count: 5
pass_threshold: 0.80

questions:
  - id: q1
    prompt: >
      A user says: "I just wrote a new skill. Can you run an eval suite against
      it to see how it performs on Claude Opus vs Sonnet?"
    should_trigger: true
    options:
      - label: A
        text: "This triggers skill-evaluator — model comparison and eval suite creation are core triggers."
        distractor_type: correct
      - label: B
        text: "This triggers the skill-engineer skill — evaluation is part of the build cycle."
        distractor_type: close_confusion
      - label: C
        text: "This does NOT trigger skill-evaluator — the user needs to specify exact test cases first."
        distractor_type: over_generalized
      - label: D
        text: "This triggers the research-and-development skill — comparing models is an experiment."
        distractor_type: wrong_domain
    correct: A

  - id: q2
    prompt: >
      A user says: "Write unit tests for my Python FastAPI application."
    should_trigger: false
    options:
      - label: A
        text: "This triggers skill-evaluator — testing is evaluation."
        distractor_type: over_generalized
      - label: B
        text: "This does NOT trigger skill-evaluator — software unit tests are not skill evaluation."
        distractor_type: correct
      - label: C
        text: "This triggers skill-evaluator because test generation is a listed capability."
        distractor_type: close_confusion
      - label: D
        text: "This triggers the rapid-prototype skill exclusively."
        distractor_type: wrong_domain
    correct: B

  - id: q3
    prompt: >
      A user says: "Generate a multiple-choice exam that tests whether a skill
      correctly handles edge cases in Helm chart templating."
    should_trigger: true
    options:
      - label: A
        text: "This triggers skill-evaluator — exam generation for skills is a core trigger."
        distractor_type: correct
      - label: B
        text: "This triggers the kubernetes-engineer skill — Helm chart knowledge is K8s domain."
        distractor_type: wrong_domain
      - label: C
        text: "This triggers the technical-writer skill — exam questions are a form of documentation."
        distractor_type: fabricated
      - label: D
        text: "This triggers skill-evaluator only if the user also says 'eval suite' or 'regression'."
        distractor_type: over_generalized
    correct: A

  - id: q4
    prompt: >
      A user says: "My skill scored 85% on the last eval run but dropped to 72%
      after a prompt change. Can you generate a regression report?"
    should_trigger: true
    options:
      - label: A
        text: "This triggers skill-evaluator — regression tracking and diff reports are core capabilities."
        distractor_type: correct
      - label: B
        text: "This does NOT trigger skill-evaluator — regression analysis is a statistics concern."
        distractor_type: wrong_domain
      - label: C
        text: "This triggers the research-and-development skill — before/after comparison is an experiment."
        distractor_type: close_confusion
      - label: D
        text: "This triggers skill-evaluator only if the user provides the actual test outputs."
        distractor_type: over_generalized
    correct: A

  - id: q5
    prompt: >
      A user says: "Create a scoring rubric for evaluating how well a coding
      assistant handles refactoring tasks."
    should_trigger: false
    options:
      - label: A
        text: "This triggers skill-evaluator — scoring rubrics are listed as a capability."
        distractor_type: over_generalized
      - label: B
        text: "This triggers the skill-engineer skill — rubric creation is part of quality validation."
        distractor_type: close_confusion
      - label: C
        text: "This does NOT trigger skill-evaluator — evaluating a general coding assistant's refactoring ability is not evaluating a specific AI agent skill."
        distractor_type: correct
      - label: D
        text: "This triggers the code-review skill — refactoring evaluation is a code review concern."
        distractor_type: wrong_domain
    correct: C

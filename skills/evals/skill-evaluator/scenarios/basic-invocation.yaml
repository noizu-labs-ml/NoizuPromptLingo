name: basic-invocation
skill: trl-skill-evaluator
description: >
  Verify that the skill correctly identifies a request to evaluate another
  skill and produces a structured eval plan with dimensions and thresholds.

nodes:
  - id: start
    type: start
    prompt: >
      I have a skill called "kubernetes-engineer" that helps users write Helm
      charts and deploy to K8s. I want to evaluate how well it works across
      Claude Opus and Sonnet. Can you set up an eval suite?
    expected_behavior: >
      Recognize the request as a skill-evaluation task. Propose an eval
      structure with dimensions relevant to a Kubernetes/Helm skill, define
      thresholds, and specify models to benchmark.
    edges:
      - action

  - id: action
    type: action
    expected_behavior: >
      Generate an eval.yaml with dimensions (trigger_precision, helm_authoring,
      k8s_manifest_correctness, etc.), thresholds for each, a list of models
      to test, and at least one scenario or exam file reference.
    edges:
      - terminal

  - id: terminal
    type: terminal
    expected_behavior: >
      Deliver a complete eval suite skeleton that is internally consistent:
      dimensions map to thresholds, scenarios reference concrete task flows,
      and exam questions probe trigger precision.
    pass_criteria:
      - Produces eval.yaml with at least 4 dimensions
      - Defines numeric thresholds for each dimension
      - Lists at least 2 models for comparison
      - Includes scenario and/or exam file references

skill: trl-skill-evaluator
version: "1.0.0"
description: >
  Evaluate the skill-evaluator's ability to run structured task scenarios,
  generate exam batteries, compare skill performance across models, and
  produce regression reports.

dimensions:
  - trigger_precision
  - scenario_execution
  - exam_generation
  - interactive_dialogue
  - regression_tracking
  - model_benchmarking

thresholds:
  trigger_precision: 0.90
  scenario_execution: 0.80
  exam_generation: 0.80
  interactive_dialogue: 0.75
  regression_tracking: 0.75
  model_benchmarking: 0.70

models_to_test:
  - claude-opus-4-20250514
  - claude-sonnet-4-20250514
  - gpt-4.1
  - gemini-2.5-pro

scenarios:
  - scenarios/basic-invocation.yaml

exams:
  - exams/multiple-choice/trigger-precision.yaml

type: multiple_choice
skill: trl-user-experience-engineer
description: >
  Tests whether the skill correctly triggers on UX/design signals
  and rejects non-design requests. 5 questions, 4 options each.

questions:
  - id: q1
    stem: "A user says: 'I need wireframes for a mobile banking app with accessibility support.' Should the UX Engineer skill activate?"
    options:
      - label: A
        text: "Yes — wireframes and accessibility audits are core trigger signals."
        correct: true
      - label: B
        text: "No — mobile apps require a separate mobile design specialist."
        distractor_type: fabricated
      - label: C
        text: "Only if the user also mentions a specific design tool like Figma."
        distractor_type: close_confusion
      - label: D
        text: "No — banking apps have regulatory requirements beyond UX scope."
        distractor_type: wrong_domain
    explanation: >
      Wireframes and accessibility audits are explicit trigger terms.
      The skill covers design across web, terminal, and specification formats.

  - id: q2
    stem: "A user says: 'Write a database schema for a multi-tenant project management app.' Should the UX Engineer skill activate?"
    options:
      - label: A
        text: "Yes — the user is building an app and needs design input."
        distractor_type: over_generalized
      - label: B
        text: "No — database schema design is a backend/data engineering task."
        correct: true
      - label: C
        text: "Only if the schema affects the user-facing screens."
        distractor_type: close_confusion
      - label: D
        text: "Yes — all aspects of application design fall under UX engineering."
        distractor_type: over_generalized
    explanation: >
      Database schema design is backend engineering, not UX. The skill covers
      user-facing design, wireframes, and interface implementation.

  - id: q3
    stem: "A user says: 'Generate user personas for a fitness app targeting seniors.' Should the UX Engineer skill activate?"
    options:
      - label: A
        text: "Yes — generating user personas is an explicit trigger signal."
        correct: true
      - label: B
        text: "No — personas are a product management deliverable."
        distractor_type: wrong_domain
      - label: C
        text: "Only if the user also wants wireframes or mockups."
        distractor_type: close_confusion
      - label: D
        text: "No — persona generation requires user research data first."
        distractor_type: fabricated
    explanation: >
      User personas are explicitly listed as a trigger term in the skill description.

  - id: q4
    stem: "A user says: 'Create an SVG logo for my brand — a minimalist fox silhouette in navy and gold.' Should the UX Engineer skill activate?"
    options:
      - label: A
        text: "Yes — SVG logos and brand marks are explicit trigger terms."
        correct: true
      - label: B
        text: "No — logo design is a graphic design specialty, not UX engineering."
        distractor_type: wrong_domain
      - label: C
        text: "Only if the logo is part of a larger web design project."
        distractor_type: close_confusion
      - label: D
        text: "No — SVG creation requires specialized vector design tools."
        distractor_type: fabricated
    explanation: >
      SVG logos, brand marks, and logomarks are all explicit trigger terms
      in the skill description.

  - id: q5
    stem: "A user says: 'Optimize my PostgreSQL query that's doing a full table scan on a 10M row table.' Should the UX Engineer skill activate?"
    options:
      - label: A
        text: "Yes — performance optimization improves user experience."
        distractor_type: over_generalized
      - label: B
        text: "Only if the slow query affects page load times."
        distractor_type: close_confusion
      - label: C
        text: "No — SQL query optimization is a database engineering task."
        correct: true
      - label: D
        text: "Yes — all performance work contributes to the user experience."
        distractor_type: over_generalized
    explanation: >
      SQL query optimization is backend database work. While performance affects UX,
      the skill is focused on interface design, wireframes, and front-end implementation.

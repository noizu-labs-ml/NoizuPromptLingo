name: basic-invocation
skill: trl-user-experience-engineer
description: >
  User asks to design a landing page. Tests that the skill activates,
  produces a structured design process, and generates implementable output.

nodes:
  - id: start
    type: prompt
    input: >
      I need a landing page for my SaaS product that manages team
      projects. The target audience is engineering managers at
      mid-size companies. I want it to convert visitors to sign up
      for a free trial.
    expected_skills:
      - trl-user-experience-engineer
    max_tokens: 200

  - id: action
    type: evaluate
    depends_on: [start]
    criteria:
      - Proposes a structured design approach (not jumping straight to code)
      - Identifies key sections (hero, features, CTA, social proof)
      - Considers conversion optimization (above-the-fold CTA, clear value prop)
      - References the target audience in layout/content decisions
      - Produces wireframe or HTML skeleton with semantic markup
    scoring:
      each_criterion: 0.20

  - id: terminal
    type: verify
    depends_on: [action]
    checks:
      - CTA is prominent and above the fold
      - Layout is responsive (mobile-friendly structure)
      - Accessibility basics present (semantic tags, alt text placeholders)
    pass_threshold: 0.60

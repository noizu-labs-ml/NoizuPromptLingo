name: basic-invocation
description: >
  Verify the skill activates when a user asks about defining a Noizu entity with persistence.
trigger:
  user_message: >
    How do I define a Noizu entity with Ecto persistence and set up a GenAI thread with Anthropic?
expected_activation: true
flow:
  - id: start
    type: start
    next: action_1
  - id: action_1
    type: action
    expected_behavior: >
      Skill should explain def_entity and def_repo macros with field annotations and storage backend configuration.
    next: action_2
  - id: action_2
    type: action
    expected_behavior: >
      Skill should demonstrate GenAI.Thread setup with Anthropic provider and inference configuration.
    next: terminal
  - id: terminal
    type: terminal
    expected_outcome: >
      User receives working Elixir code examples for both entity persistence and GenAI thread setup.

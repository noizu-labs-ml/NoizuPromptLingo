type: multiple_choice
skill: trl-tui-engineer
description: >
  Tests whether the skill correctly triggers on TUI/terminal-UI signals
  and rejects non-TUI requests. 5 questions, 4 options each.

questions:
  - id: q1
    stem: "A user says: 'I want to build an interactive CLI dashboard using bubbletea and lipgloss in Go.' Should the TUI Engineer skill activate?"
    options:
      - label: A
        text: "Yes — bubbletea and lipgloss are explicit trigger terms for this skill."
        correct: true
      - label: B
        text: "No — bubbletea is a Go library, not a TUI framework."
        distractor_type: fabricated
      - label: C
        text: "Only if the user also mentions terminal-specific features like mouse support."
        distractor_type: close_confusion
      - label: D
        text: "No — CLI dashboards are just formatted text output, not TUI."
        distractor_type: wrong_domain
    explanation: >
      bubbletea, lipgloss, and CLI dashboards are all explicit trigger terms.

  - id: q2
    stem: "A user says: 'I need a web-based admin panel with charts and data tables using React.' Should the TUI Engineer skill activate?"
    options:
      - label: A
        text: "Yes — admin panels with data tables are universal UI patterns."
        distractor_type: over_generalized
      - label: B
        text: "No — React web UIs are not terminal user interfaces."
        correct: true
      - label: C
        text: "Only if the user mentions using Ink (TypeScript TUI framework)."
        distractor_type: close_confusion
      - label: D
        text: "Yes — all UI engineering falls under this skill."
        distractor_type: over_generalized
    explanation: >
      React web apps are not TUI. The skill covers terminal-based interfaces only.
      If the user mentioned Ink, that would be a TUI trigger.

  - id: q3
    stem: "A user says: 'How do I handle ANSI escape codes for colored output in my shell script?' Should the TUI Engineer skill activate?"
    options:
      - label: A
        text: "Yes — ANSI escape codes and terminal color schemes are trigger terms."
        correct: true
      - label: B
        text: "No — shell scripts are too simple for a TUI skill."
        distractor_type: wrong_domain
      - label: C
        text: "Only if the user is building a full TUI application."
        distractor_type: close_confusion
      - label: D
        text: "No — ANSI codes are a system programming concern."
        distractor_type: wrong_domain
    explanation: >
      ANSI escape codes and terminal color schemes are explicit trigger terms,
      and shell (gum/dialog/ANSI) is one of the six supported language stacks.

  - id: q4
    stem: "A user says: 'I want to add keyboard shortcuts to my Electron desktop app.' Should the TUI Engineer skill activate?"
    options:
      - label: A
        text: "Yes — keybinding support is a trigger term."
        distractor_type: over_generalized
      - label: B
        text: "No — Electron is a desktop GUI framework, not a terminal interface."
        correct: true
      - label: C
        text: "Only if the shortcuts are for terminal-style navigation."
        distractor_type: close_confusion
      - label: D
        text: "Yes — desktop and terminal UI share the same interaction patterns."
        distractor_type: over_generalized
    explanation: >
      Electron is a GUI framework. Keybindings in the trigger language refer to
      terminal keybindings (crossterm, termion, tcell), not desktop app shortcuts.

  - id: q5
    stem: "A user says: 'Help me build a REPL with syntax highlighting using Ink and TypeScript.' Should the TUI Engineer skill activate?"
    options:
      - label: A
        text: "Yes — Ink is a listed trigger term and REPLs are explicitly in scope."
        correct: true
      - label: B
        text: "No — REPLs are language runtime features, not TUI."
        distractor_type: wrong_domain
      - label: C
        text: "Only if the user is using Rust or Go, not TypeScript."
        distractor_type: fabricated
      - label: D
        text: "No — Ink is a React renderer, not a terminal tool."
        distractor_type: fabricated
    explanation: >
      Ink and REPLs are both explicit trigger terms. TypeScript/Ink is one of
      the six supported language stacks.

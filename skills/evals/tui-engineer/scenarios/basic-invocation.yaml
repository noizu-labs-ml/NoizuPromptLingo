name: basic-invocation
skill: trl-tui-engineer
description: >
  User asks to build a terminal dashboard in Go. Tests that the skill activates,
  selects bubbletea/lipgloss, and produces a working layout skeleton.

nodes:
  - id: start
    type: prompt
    input: >
      I want to build a terminal dashboard that shows system metrics
      (CPU, memory, disk) in a split-pane layout with a status bar at
      the bottom. I'd like to use Go. Can you scaffold this?
    expected_skills:
      - trl-tui-engineer
    max_tokens: 200

  - id: action
    type: evaluate
    depends_on: [start]
    criteria:
      - Recommends bubbletea and/or lipgloss for Go TUI
      - Produces a main.go with a basic bubbletea Model struct
      - Implements a split-pane layout (at least 2 panes)
      - Includes a status bar or footer component
      - Sets up go.mod with correct dependencies
    scoring:
      each_criterion: 0.20

  - id: terminal
    type: verify
    depends_on: [action]
    checks:
      - Code compiles (go build would succeed structurally)
      - Uses terminal width/height queries (tea.WindowSizeMsg)
      - No external GUI dependencies (pure terminal rendering)
    pass_threshold: 0.60

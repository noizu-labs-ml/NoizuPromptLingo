name: basic-invocation
description: >
  Verify the skill activates when a user wants to spike a feature and assess feasibility.
trigger:
  user_message: >
    Can we use WebAssembly to run real-time audio processing in the browser? Spike this and give me a go/no-go.
expected_activation: true
flow:
  - id: start
    type: start
    next: action_1
  - id: action_1
    type: action
    expected_behavior: >
      Skill should extract a testable hypothesis: 'WebAssembly can process real-time audio with <10ms latency in browsers.'
    next: action_2
  - id: action_2
    type: action
    expected_behavior: >
      Skill should propose a timeboxed spike plan, build a minimal demo, and produce a go/no-go with documented evidence.
    next: terminal
  - id: terminal
    type: terminal
    expected_outcome: >
      User receives a go/no-go recommendation with working demo, performance benchmarks, and risk assessment.

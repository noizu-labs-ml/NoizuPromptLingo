questions:
  - id: tp-001
    question: '"Spike a feature" and "proof of concept" are triggers for which skill?'
    options:
      - label: A
        text: rapid-prototype
        correct: true
      - label: B
        text: research-and-development
        correct: false
        distractor_type: close_confusion
      - label: C
        text: mcp-forge
        correct: false
        distractor_type: wrong_domain
      - label: D
        text: game-design
        correct: false
        distractor_type: fabricated
    explanation: "Spike" and "proof of concept" are explicit rapid-prototype triggers."

  - id: tp-002
    question: Which should NOT trigger rapid-prototype?
    options:
      - label: A
        text: "Validate if Stripe Connect supports my marketplace model"
        correct: false
      - label: B
        text: "Build a throwaway demo to test WebRTC feasibility"
        correct: false
      - label: C
        text: "Write production-ready Helm charts for my cluster"
        correct: true
      - label: D
        text: "Test whether this API works for my use case"
        correct: false
    explanation: Production Helm charts is kubernetes-engineer territory, not a throwaway prototype.


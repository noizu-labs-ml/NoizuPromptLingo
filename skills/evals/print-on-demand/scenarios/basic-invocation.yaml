name: basic-invocation
description: >
  Verify the skill activates when a user wants to create and sell merchandise designs.
trigger:
  user_message: >
    I want to create AI-generated t-shirt designs for the programming humor niche and sell them on Redbubble.
expected_activation: true
flow:
  - id: start
    type: start
    next: action_1
  - id: action_1
    type: action
    expected_behavior: >
      Skill should research the niche, propose design concepts, and plan a product line with optimized listings.
    next: action_2
  - id: action_2
    type: action
    expected_behavior: >
      Skill should generate design prompts, recommend fulfillment platforms, and create listing copy with SEO tags.
    next: terminal
  - id: terminal
    type: terminal
    expected_outcome: >
      User receives a POD product plan with designs, platform strategy, and listing optimization guidance.

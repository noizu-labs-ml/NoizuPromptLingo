  - id: tp-004
    question: >
      A user asks "Should I start with templates or content first?" Which
      skill handles this decision?
    options:
      - label: A
        text: monetization-strategy
        correct: false
        distractor_type: close_confusion
      - label: B
        text: conversion-engineer
        correct: true
        distractor_type: null
      - label: C
        text: ai-templates
        correct: false
        distractor_type: wrong_domain
      - label: D
        text: market-intelligence
        correct: false
        distractor_type: fabricated
    explanation: >
      Deciding which stream to prioritize in a portfolio is conversion-engineer
      territory. monetization-strategy is for initial stream selection before
      committing to a portfolio.

  - id: tp-005
    question: >
      What is the relationship between conversion-engineer and the three
      stream skills (ai-templates, content-publishing, print-on-demand)?
    options:
      - label: A
        text: "conversion-engineer coordinates across them; each handles its own execution"
        correct: true
        distractor_type: null
      - label: B
        text: "conversion-engineer replaces all three"
        correct: false
        distractor_type: fabricated
      - label: C
        text: "They are independent with no relationship"
        correct: false
        distractor_type: wrong_domain
      - label: D
        text: "conversion-engineer only works with ai-templates"
        correct: false
        distractor_type: over_generalized
    explanation: >
      conversion-engineer is the strategic coordinator that orchestrates
      across the three execution skills.

exam_type: multiple-choice
skill: conversion-engineer
topic: trigger_precision
question_count: 5

questions:
  - id: tp-001
    question: >
      "I want to understand how templates, articles, and merch work together
      for passive income." Which skill?
    options:
      - label: A
        text: conversion-engineer
        correct: true
        distractor_type: null
      - label: B
        text: monetization-strategy
        correct: false
        distractor_type: close_confusion
      - label: C
        text: ai-templates
        correct: false
        distractor_type: wrong_domain
      - label: D
        text: market-intelligence
        correct: false
        distractor_type: fabricated
    explanation: >
      Cross-stream coordination is the core purpose of conversion-engineer.
      monetization-strategy helps choose a stream, not coordinate multiple.

  - id: tp-002
    question: >
      Which should NOT trigger conversion-engineer?
    options:
      - label: A
        text: "Plan my weekly cadence across templates and content"
        correct: false
        distractor_type: close_confusion
      - label: B
        text: "Review my portfolio performance across streams"
        correct: false
        distractor_type: wrong_domain
      - label: C
        text: "Build a Kubernetes Helm chart from scratch"
        correct: true
        distractor_type: null
      - label: D
        text: "Understand cross-promotion synergies between products"
        correct: false
        distractor_type: over_generalized
    explanation: >
      Helm charts are kubernetes-engineer territory, not passive income
      portfolio coordination.

  - id: tp-003
    question: >
      "Passive income systems" is an explicit trigger for which skill?
    options:
      - label: A
        text: conversion-engineer
        correct: true
        distractor_type: null
      - label: B
        text: monetization-strategy
        correct: false
        distractor_type: close_confusion
      - label: C
        text: content-publishing
        correct: false
        distractor_type: wrong_domain
      - label: D
        text: print-on-demand
        correct: false
        distractor_type: over_generalized
    explanation: >
      "Passive income systems" (plural) triggers conversion-engineer as

name: basic-invocation
description: >
  Verify the skill activates when a user wants to write a Helm chart for a service.
trigger:
  user_message: >
    I need to create a Helm chart for my Go microservice with HPA, NetworkPolicy, and PodDisruptionBudget.
expected_activation: true
flow:
  - id: start
    type: start
    next: action_1
  - id: action_1
    type: action
    expected_behavior: >
      Skill should propose chart structure with templates for deployment, service, HPA, NetworkPolicy, and PDB.
    next: action_2
  - id: action_2
    type: action
    expected_behavior: >
      Skill should generate the complete chart with values schema, NOTES.txt, and security best practices applied.
    next: terminal
  - id: terminal
    type: terminal
    expected_outcome: >
      User receives a production-ready Helm chart with autoscaling, network policies, and disruption budgets.

name: basic-invocation
description: >
  Verify the skill activates when a user wants to design a structured
  study plan with prerequisites.
trigger:
  user_message: >
    I have a list of machine learning topics. Can you sequence them
    into a curriculum with prerequisites and milestones?
expected_activation: true
flow:
  - id: start
    type: start
    next: map_prerequisites
  - id: map_prerequisites
    type: action
    expected_behavior: >
      Skill should build a dependency graph between topics, identifying
      what must be learned before what.
    next: calibrate_and_sequence
  - id: calibrate_and_sequence
    type: action
    expected_behavior: >
      Skill should apply pedagogical framework, calibrate difficulty,
      and produce a sequenced learning path with milestones.
    next: terminal
  - id: terminal
    type: terminal
    expected_outcome: >
      User receives a sequenced curriculum with prerequisite graph,
      milestones, time estimates, and assessment criteria.

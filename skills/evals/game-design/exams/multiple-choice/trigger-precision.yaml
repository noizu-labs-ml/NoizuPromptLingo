exam_type: multiple-choice
skill: game-design
topic: trigger_precision
question_count: 5

questions:
  - id: tp-001
    question: >
      "I need to balance my game economy and plan a battle pass." Which skill?
    options:
      - label: A
        text: game-design
        correct: true
        distractor_type: null
      - label: B
        text: monetization-strategy
        correct: false
        distractor_type: close_confusion
      - label: C
        text: android-mobile
        correct: false
        distractor_type: wrong_domain
      - label: D
        text: user-experience-engineer
        correct: false
        distractor_type: fabricated
    explanation: >
      Game economy balance and battle pass design are core game-design
      triggers. monetization-strategy is for choosing income streams, not
      game-specific monetization.

  - id: tp-002
    question: >
      Which should NOT trigger game-design?
    options:
      - label: A
        text: "Create a sprite sheet for my game characters"
        correct: false
        distractor_type: close_confusion
      - label: B
        text: "Plan a soft launch strategy for my mobile game"
        correct: false
        distractor_type: wrong_domain
      - label: C
        text: "Build a REST API with Express and PostgreSQL"
        correct: true
        distractor_type: null
      - label: D
        text: "Write a game design document (GDD)"
        correct: false
        distractor_type: over_generalized
    explanation: >
      REST API development is not game design territory.


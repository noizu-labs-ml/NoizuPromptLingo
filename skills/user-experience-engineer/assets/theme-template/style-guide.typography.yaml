# ── Typography ──
# Optional. Extracted from §03 Typography.
#
# Defines font families and the type scale for the style guide viewer.
# If omitted, inherits from base theme.

typography:
  - var: font-sans
    name: "{Sans Font Name}"
    description: "{Role and character of this typeface}"
    usage: "{Where it's used: headings, body, UI labels}"
    weights: [400, 600, 700]

  - var: font-mono
    name: "{Mono Font Name}"
    description: "{Role: code, tokens, technical content}"
    usage: "{Where it's used: code blocks, tags, metadata}"
    weights: [400, 500]

# Type scale — maps to typography section demo in the style guide viewer.
# Sizes reference var(--font-size-*) tokens from the cascade.
typography-classes:
  - name: Display
    class: typography-display
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-display)"
    font-weight: "700"
    line-height: "1.05"
    letter-spacing: "-0.03em"

  - name: H1
    class: typography-h1
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-3xl)"
    font-weight: "700"
    line-height: "1.1"
    letter-spacing: "-0.02em"

  - name: H2
    class: typography-h2
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-2xl)"
    font-weight: "700"
    line-height: "1.2"

  - name: Body
    class: typography-body
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-md)"
    font-weight: "400"
    line-height: "1.6"

  - name: Code
    class: typography-code
    font-family: "var(--font-mono)"
    font-size: "var(--font-size-sm)"
    font-weight: "400"
    line-height: "1.6"

  - name: Label
    class: typography-label
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-xs)"
    font-weight: "700"
    line-height: "1.4"
    letter-spacing: "0.06em"
    text-transform: "uppercase"

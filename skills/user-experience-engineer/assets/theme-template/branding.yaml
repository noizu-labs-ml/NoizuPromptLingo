# From §00 brand identity block
intent: "{What the designer does — the design philosophy}"
perception: "{What the user feels — the desired emotional response}"
audience: "{Who this is for — target users and their context}"
tone: "{Voice and communication style}"
keywords:
  - "{keyword-1}"
  - "{keyword-2}"
  - "{keyword-3}"
  - "{keyword-4}"
  - "{keyword-5}"


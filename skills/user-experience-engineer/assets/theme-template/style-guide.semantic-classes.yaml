# ── Semantic Classes ──
# Optional. Extracted from §08 Status Indicators.
#
# Contextual modifier classes (.danger, .warning, .success, .info).
# If omitted, inherits from base theme.

semantic-classes:
  - name: danger
    class: danger
    group: States
    title: Danger
    description: "{Critical errors, destructive actions}"
    note: "{When to use this state}"
    accent-style: bottom-bar
    vars:
      accent: "var(--error)"
      background: "var(--error-tint)"
      color: "var(--error)"
      font-weight: "var(--font-weight-bold)"

  - name: warning
    class: warning
    group: States
    title: Warning
    description: "{Cautions, pending states}"
    note: "{When to use this state}"
    accent-style: bottom-bar
    vars:
      accent: "var(--warning)"
      background: "var(--warning-tint)"
      color: "var(--warning)"

  - name: info
    class: info
    group: States
    title: Information
    description: "{Guidance, links, context}"
    note: "{When to use this state}"
    accent-style: bottom-bar
    vars:
      accent: "var(--info)"
      background: "var(--info-tint)"
      color: "var(--info)"

  - name: success
    class: success
    group: States
    title: Success
    description: "{Confirmations, completed actions}"
    note: "{When to use this state}"
    accent-style: bottom-bar
    vars:
      accent: "var(--success)"
      background: "var(--success-tint)"
      color: "var(--success)"

# ── Shell Layouts ──
# Optional. Extracted from §07 Navigation.
#
# Defines full-page app shells (navbar, sidebar, footer, content zones).
# If omitted, inherits from base theme.

shell-layouts:
  - name: landing
    title: Landing Page
    description: "{Marketing layout — hero-first, minimal chrome}"
    chrome:
      navbar:
        height: "64px"
        background: "var(--surface-inverse)"
        color: "var(--text-inverse)"
        label: "Nav"
      footer:
        height: "80px"
        background: "var(--gray-900)"
        color: "var(--gray-400)"
        label: "Footer"
    zones:
      - label: "Hero"
        background: "var(--surface-inverse)"
        color: "var(--text-inverse)"
        ratio: 3
      - label: "Features"
        background: "var(--surface-alt)"
        color: "var(--text)"
        ratio: 2
      - label: "CTA"
        background: "var(--brand-red-light)"
        color: "var(--text)"
        ratio: 1


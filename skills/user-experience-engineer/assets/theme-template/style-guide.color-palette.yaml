# ── Color Palette ──
# Optional. Extracted from §02 Color Palette.
#
# Documents color groups for the style guide viewer.
# Uses var() references to tokens defined in vars.yaml.
# If omitted, inherits from base theme.

color-palette:
  - group: Brand
    description: "{Core brand colors and their purpose}"
    notes:
      - label: "{Color Name}"
        text: "{When and how to use this color}"
        cssClass: "{token-name}"
    colors:
      - name: "{Color Name}"
        value: "var(--brand-red)"
      - name: "{Color Name Light}"
        value: "var(--brand-red-light)"

  - group: Semantic
    description: "Status and feedback colors"
    colors:
      - name: Success
        value: "var(--success)"
      - name: Warning
        value: "var(--warning)"
      - name: Error
        value: "var(--error)"
      - name: Info
        value: "var(--info)"

  # - group: Extended Palette

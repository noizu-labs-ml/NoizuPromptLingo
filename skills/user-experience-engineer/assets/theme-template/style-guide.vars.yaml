# ── Design Tokens ──
# Required. Extracted from §01 Design Tokens.
#
# The engine's defaults.ts computes ~300 tokens from these seeds.
# Only include values that DIFFER from the base theme.
# Commented-out entries show defaults for reference.
#
# Seed tokens the cascade depends on:
#   white, black        → gray ramp (gray-50 through gray-900)
#   brand-red/blue/yellow → brand color variants (-light, -mid)
#   success/warning/error/info → semantic tints
#   font-sans, font-mono → typography stacks
#   radius              → border-radius scale
#
# See: styleguide-engine/app/docs/reference/cascade.md

vars:
  groups:
    # ── Surfaces ──
    # Seeds: white + black → engine derives full gray ramp
    - name: Surfaces
      vars:
        white: "#ffffff"
        black: "#000000"
        # off-white, gray-50 through gray-900 are auto-derived

    # ── Brand Colors ──
    # Hex seeds are required. Light/mid tints are auto-derived.
    - name: Brand
      vars:
        brand-red: "#e20613"
        brand-blue: "#0047ab"
        brand-yellow: "#f5c518"
        # brand-{color}-light and brand-{color}-mid are auto-derived

    # ── Semantic Colors ──
    # Used for status indicators, alerts, form validation.
    - name: Semantic
      vars:
        success: "#1a8a3f"
        warning: "#c27a00"
        error: "#c41a1a"
        info: "#0047ab"
        # {semantic}-tint is auto-derived

    # ── Typography ──
    # Font stacks. Must match fonts loaded via branding.yaml font-url.
    - name: Typography
      vars:
        font-sans: "'{Sans Font}', -apple-system, sans-serif"
        font-mono: "'{Mono Font}', 'Menlo', monospace"
        # font-size-base, line-height-base, and full size scale are auto-derived

    # ── Layout ──
    # Uncomment to override base spacing/radius.
    # - name: Layout
    #   vars:
    #     radius: "2px"
    #     unit: "8px"

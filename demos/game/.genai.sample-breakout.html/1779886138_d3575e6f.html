```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breakout</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0f0f1e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 2px solid #00d4ff;
            border-radius: 8px;
            background: #1a1a2e;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 18px;
            display: flex;
            gap: 40px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="game" width="800" height="600"></canvas>
    <div id="ui">
        <div>Score: <span id="score">0</span></div>
        <div>Lives: <span id="lives">3</span></div>
    </div>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const WIDTH = 800;
        const HEIGHT = 600;
        let score = 0;
        let lives = 3;
        let gameState = 'playing'; // playing, gameover, win
        // Paddle
        const paddle = {
            width: 100,
            height: 12,
            x: WIDTH / 2 - 50,
            y: HEIGHT - 40,
            speed: 8
        };
        // Ball
        const ball = {
            x: WIDTH / 2,
            y: HEIGHT - 60,
            radius: 8,
            dx: 4,
            dy: -4,
            speed: 4
        };
        // Bricks
        const brickRowCount = 5;
        const brickColumnCount = 8;
        const brickWidth = 85;
        const brickHeight = 22;
        const brickPadding = 8;
        const brickOffsetTop = 60;
        const brickOffsetLeft = 35;
        const bricks = [];
        const colors = ['#ff2d55', '#ff9500', '#ffcc00', '#34c759', '#5ac8fa'];
        function initBricks() {
            for (let r = 0; r < brickRowCount; r++) {
                bricks[r] = [];
                for (let c = 0; c < brickColumnCount; c++) {
                    bricks[r][c] = {
                        x: brickOffsetLeft + c * (brickWidth + brickPadding),
                        y: brickOffsetTop + r * (brickHeight + brickPadding),
                        status: 1,
                        color: colors[r]
                    };
                }
            }
        }
        function drawBricks() {
            for (let r = 0; r < brickRowCount; r++) {
                for (let c = 0; c < brickColumnCount; c++) {
                    const b = bricks[r][c];
                    if (b.status === 1) {
                        ctx.fillStyle = b.color;
                        ctx.fillRect(b.x, b.y, brickWidth, brickHeight);
                        ctx.strokeStyle = '#ffffff22';
                        ctx.strokeRect(b.x, b.y, brickWidth, brickHeight);
                    }
                }
            }
        }
        function drawPaddle() {
            ctx.fillStyle = '#00d4ff';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00d4ff';
            ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
            ctx.shadowBlur = 0;
        }
        function drawBall() {
            ctx.fillStyle = '#00d4ff';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#00d4ff';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }
        function draw() {
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
            drawBricks();
            drawPaddle();
            drawBall();
            // Update UI
            scoreEl.textContent = score;
            livesEl.textContent = lives;
        }
        function update() {
            if (gameState !== 'playing') return;
            // Move ball
            ball.x += ball.dx;
            ball.y += ball.dy;
            // Wall collisions
            if (ball.x + ball.radius > WIDTH || ball.x - ball.radius < 0) {
                ball.dx = -ball.dx;
            }
            if (ball.y - ball.radius < 0) {
                ball.dy = -ball.dy;
            }
            // Bottom wall (lose life)
            if (ball.y + ball.radius > HEIGHT) {
                lives--;
                if (lives <= 0) {
                    gameState = 'gameover';
                } else {
                    resetBall();
                }
            }
            // Paddle collision
            if (
                ball.y + ball.radius > paddle.y &&
                ball.x > paddle.x &&
                ball.x < paddle.x + paddle.width
            ) {
                ball.dy = -Math.abs(ball.dy);
                // Speed up
                const speedIncrease = 0.3;
                const currentSpeed = Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy);
                const newSpeed = Math.min(currentSpeed + speedIncrease, 9);
                const angle = Math.atan2(ball.dy, ball.dx);
                ball.dx = Math.cos(angle) * newSpeed;
                ball.dy = Math.sin(angle) * newSpeed;
                // Add slight horizontal influence based on hit position
                const hitPos = (ball.x - paddle.x) / paddle.width;
                ball.dx = ball.dx * 0.7 + (hitPos - 0.5) * 5;
            }
            // Brick collisions
            for (let r = 0; r < brickRowCount; r++) {
                for (let c = 0; c < brickColumnCount; c++) {
                    const b = bricks[r][c];
                    if (b.status === 1) {
                        if (
                            ball.x > b.x &&
                            ball.x < b.x + brickWidth &&
                            ball.y > b.y &&
                            ball.y < b.y + brickHeight
                        ) {
                            ball.dy = -ball.dy;
                            b.status = 0;
                            score += 10;
                            // Check win
                            if (checkWin()) {
                                gameState = 'win';
                            }
                        }
                    }
                }
            }
        }
        function checkWin() {
            for (let r = 0; r < brickRowCount; r++) {
                for (let c = 0; c < brickColumnCount; c++) {
                    if (bricks[r][c].status === 1) return false;
                }
            }
            return true;
        }
        function resetBall() {
            ball.x = WIDTH / 2;
            ball.y = HEIGHT - 60;
            ball.dx = (Math.random() * 4 + 3) * (Math.random() > 0.5 ? 1 : -1);
            ball.dy = -4;
        }
        function resetGame() {
            score = 0;
            lives = 3;
            paddle.x = WIDTH / 2 - paddle.width / 2;
            initBricks();
            resetBall();
            gameState = 'playing';
        }
        function drawOverlay() {
            if (gameState === 'gameover') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.fillRect(0, 0, WIDTH, HEIGHT);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 48px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', WIDTH / 2, HEIGHT / 2 - 30);
                ctx.font = '24px Arial';
                ctx.fillText('Score: ' + score, WIDTH / 2, HEIGHT / 2 + 20);
                ctx.fillText('Click to Restart', WIDTH / 2, HEIGHT / 2 + 70);
            } else if (gameState === 'win') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.fillRect(0, 0, WIDTH, HEIGHT);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 48px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('YOU WIN!', WIDTH / 2, HEIGHT / 2 - 30);
                ctx.font = '24px Arial';
                ctx.fillText('Score: ' + score, WIDTH / 2, HEIGHT / 2 + 20);
                ctx.fillText('Click to Play Again', WIDTH / 2, HEIGHT / 2 + 70);
            }
        }
        function gameLoop() {
            update();
            draw();
            drawOverlay();
            requestAnimationFrame(gameLoop);
        }
        // Mouse controls
        canvas.addEventListener('mousemove', (e) => {
            if (gameState !== 'playing') return;
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            paddle.x = mouseX - paddle.width / 2;
            // Clamp paddle
            if (paddle.x < 0) paddle.x = 0;
            if (paddle.x + paddle.width > WIDTH) paddle.x = WIDTH - paddle.width;
        });
        // Click to restart
        canvas.addEventListener('click', () => {
            if (gameState === 'gameover' || gameState === 'win') {
                resetGame();
            }
        });
        // Initialize
        function init() {
            initBricks();
            resetBall();
            gameLoop();
        }
        init();
    </script>
</body>
</html>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 200 200"
     width="200" height="200"
     role="img" aria-labelledby="ru-mark-title ru-mark-desc">

  <title id="ru-mark-title">Robots Unite</title>
  <desc id="ru-mark-desc">Two abstract robot forms connected by an orange energy bridge — the Robots Unite logomark</desc>

  <!-- Left robot -->
  <rect x="24" y="84" width="58" height="58" rx="13" fill="#171717"/>
  <rect x="50" y="68" width="6" height="20" rx="3" fill="#171717"/>
  <circle cx="53" cy="64" r="5" fill="#F97316"/>

  <!-- Right robot -->
  <rect x="118" y="84" width="58" height="58" rx="13" fill="#171717"/>
  <rect x="144" y="68" width="6" height="20" rx="3" fill="#171717"/>
  <circle cx="147" cy="64" r="5" fill="#F97316"/>

  <!-- Connection bridge -->
  <rect x="80" y="100" width="40" height="11" rx="5.5" fill="#F97316"/>
  <circle cx="100" cy="105.5" r="2.5" fill="#FFFFFF"/>

</svg>

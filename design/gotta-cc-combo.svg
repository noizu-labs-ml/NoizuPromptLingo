<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 400 100" width="400" height="100"
     role="img" aria-labelledby="combo-title combo-desc">

  <title id="combo-title">gotta.cc</title>
  <desc id="combo-desc">Gotta.cc logo — warm coral asterisk mark paired with editorial wordmark</desc>

  <!--
    DEVELOPMENT VERSION — text elements use Georgia as stand-in.

    For production:
    1. Replace font with chosen direction's display face
       (Fraunces for Direction B, Playfair Display for A, Space Grotesk for C)
    2. Convert all text to <path> elements (Inkscape: Path > Object to Path)
    3. Optionally replace the period in ".cc" with a miniature asterisk mark
    4. Tighten viewBox to actual content bounds after path conversion
  -->

  <defs>
    <symbol id="mark" viewBox="0 0 200 200">
      <g transform="translate(100,100)">
        <rect x="-8" y="-65" width="16" height="130" rx="8"/>
        <rect x="-8" y="-65" width="16" height="130" rx="8" transform="rotate(60)"/>
        <rect x="-8" y="-65" width="16" height="130" rx="8" transform="rotate(120)"/>
      </g>
    </symbol>
  </defs>

  <!-- Asterisk mark -->
  <use href="#mark" x="10" y="12" width="76" height="76" fill="#E8704A"/>

  <!-- Wordmark -->
  <text x="102" y="60" font-family="Georgia, 'Times New Roman', serif" font-size="38">
    <tspan font-weight="700" fill="#1A1A1A">gotta</tspan><tspan font-weight="400" fill="#E8704A">.cc</tspan>
  </text>

</svg>

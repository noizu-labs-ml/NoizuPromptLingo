<!DOCTYPE html>
<html lang="en" data-design-theme="grimoire">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Style Guide: NoizuRPG — Direction C: Grimoire</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="module">
    import * as HeadlessUI from 'https://esm.sh/@headlessui/react@2.2.4?external=react,react-dom';
    window.HeadlessUI = HeadlessUI;
    window.dispatchEvent(new Event('headlessui-ready'));
  </script>
  <script crossorigin src="https://noizu.github.io/react-assets/dist/sg.js"></script>
  <link rel="stylesheet" href="https://noizu.github.io/react-assets/dist/sg.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Alegreya:ital,wght@0,400;0,600;1,400&family=Alegreya+Sans:wght@400;500;600&family=Alegreya+SC:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* ═══════════════════════════════════════
       THEME: GRIMOIRE — Techno-Mage Workshop
       ═══════════════════════════════════════ */

    .grimoire-theme {
      /* Surfaces — warm dark with faint purple undertone */
      --bg: #0D0B0E;
      --surface: #16131A;
      --elevated: #1E1A24;
      --inset: #0A090C;

      /* Text — warm off-whites */
      --text-primary: #E8E2D9;
      --text-secondary: #9B9286;
      --text-tertiary: #5E574F;

      /* Borders */
      --border: #2A2530;
      --border-strong: #3D3644;

      /* Accent — Arcane Amber */
      --accent: #D4A04A;
      --accent-hover: #E8B75E;
      --accent-muted: rgba(212, 160, 74, 0.12);
      --accent-glow: rgba(212, 160, 74, 0.25);

      /* RPG Domain Colors */
      --health: #C23B3B;
      --health-bg: rgba(194, 59, 59, 0.10);
      --mana: #5B8DD9;
      --mana-bg: rgba(91, 141, 217, 0.10);
      --xp: #4AA866;
      --xp-bg: rgba(74, 168, 102, 0.10);
      --gold: #D4A04A;
      --gold-bg: rgba(212, 160, 74, 0.10);
      --stamina: #D4783A;
      --stamina-bg: rgba(212, 120, 58, 0.10);

      /* Semantic */
      --success: #4AA866;
      --success-bg: rgba(74, 168, 102, 0.10);
      --warning: #D4A04A;
      --warning-bg: rgba(212, 160, 74, 0.10);
      --error: #C23B3B;
      --error-bg: rgba(194, 59, 59, 0.10);
      --info: #5B8DD9;
      --info-bg: rgba(91, 141, 217, 0.10);

      /* Radius — angular (grimoire pages, bound book) */
      --radius: 2px;
      --radius-sm: 2px;
      --radius-md: 4px;
      --radius-lg: 6px;

      /* Spacing */
      --unit: 8px;
      --space-1: 8px;
      --space-2: 16px;
      --space-3: 24px;
      --space-4: 32px;
      --space-5: 40px;
      --space-6: 48px;
      --space-8: 64px;
      --space-10: 80px;
      --space-12: 96px;
      --space-16: 128px;

      /* Typography */
      --font-display: 'Cinzel', 'Trajan Pro', 'Times New Roman', serif;
      --font-heading: 'Alegreya Sans', 'Fira Sans', system-ui, sans-serif;
      --font-body: 'Alegreya', 'Source Serif 4', Georgia, serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
      --font-flavor: 'Alegreya SC', 'Cinzel', serif;

      /* Map for sg.js components */
      --font-sans: var(--font-heading);
      --font-serif: var(--font-body);

      background: var(--bg);
      color: var(--text-primary);
    }

    /* ═══════════════════════════════════════
       ANIMATIONS
       ═══════════════════════════════════════ */
    @keyframes inscribe {
      from { box-shadow: 0 0 0 0 var(--accent-glow); }
      to { box-shadow: 0 0 8px 2px var(--accent-glow); }
    }

    .grimoire-theme ::selection { background: var(--accent-muted); color: var(--text-primary); }
    .grimoire-theme *:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    @media (prefers-reduced-motion: reduce) {
      .grimoire-theme *, .grimoire-theme *::before, .grimoire-theme *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ═══════════════════════════════════════
       SG.CSS DARK THEME OVERRIDES
       ═══════════════════════════════════════ */
    .grimoire-theme.style-guide { background: var(--bg); color: var(--text-primary); }
    .grimoire-theme .sg-container { background: var(--bg); }
    .grimoire-theme .sg-section { border-color: var(--border); }
    .grimoire-theme .sg-section-header { color: var(--text-primary); }
    .grimoire-theme .sg-section-number { color: var(--accent); opacity: 0.6; }
    .grimoire-theme .sg-section-title { color: var(--text-primary); font-family: var(--font-display); }
    .grimoire-theme .sg-section-desc { color: var(--text-secondary); }
    .grimoire-theme .sg-description { color: var(--text-secondary); font-family: var(--font-body); }
    .grimoire-theme .sg-subsection-title { color: var(--text-secondary); font-family: var(--font-heading); border-color: var(--border); }

    /* StyleCard overrides */
    .grimoire-theme .style-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; }
    .grimoire-theme .style-card-hero { background: linear-gradient(135deg, var(--surface) 0%, var(--elevated) 100%); padding: 64px 48px; }
    .grimoire-theme .style-card-seal { font-size: 48px; margin-bottom: 16px; }
    .grimoire-theme .style-card-title { font-family: var(--font-display); font-size: clamp(36px, 5vw, 56px); font-weight: 700; color: var(--text-primary); line-height: 1.1; }
    .grimoire-theme .style-card-subtitle { font-family: var(--font-heading); font-size: 18px; color: var(--text-secondary); margin-top: 12px; }
    .grimoire-theme .style-card-epigraph { font-family: var(--font-body); font-style: italic; font-size: 16px; color: var(--text-tertiary); margin-top: 16px; max-width: 60ch; }
    .grimoire-theme .style-card-color-bar > div { height: 6px; }
    .grimoire-theme .style-card-meta { background: var(--inset); border-top: 1px solid var(--border); padding: 24px 48px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 24px; }
    .grimoire-theme .style-card-meta-label { font-family: var(--font-flavor); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-tertiary); margin-bottom: 4px; }
    .grimoire-theme .style-card-meta-value { font-family: var(--font-heading); font-size: 14px; color: var(--text-primary); }

    /* ProductBranding overrides */
    .grimoire-theme .product-branding { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); margin-top: 24px; }
    .grimoire-theme .product-branding-name { font-family: var(--font-display); color: var(--accent); }
    .grimoire-theme .product-branding-logo { background: var(--inset); border-right-color: var(--border); }
    .grimoire-theme .product-branding-logo-placeholder { font-family: var(--font-display); color: var(--accent); }
    .grimoire-theme .product-branding-field-label { color: var(--text-tertiary); font-family: var(--font-flavor); text-transform: uppercase; letter-spacing: 0.06em; }
    .grimoire-theme .product-branding-field-value { color: var(--text-secondary); font-family: var(--font-body); }
    .grimoire-theme .product-branding-tag { background: var(--accent-muted); color: var(--accent); border-radius: var(--radius-sm); font-family: var(--font-flavor); }
    .grimoire-theme .product-branding-grid { border-color: var(--border); }
    .grimoire-theme .product-branding-field { border-color: var(--border); }

    /* Token cards */
    .grimoire-theme .token-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); }
    .grimoire-theme .token-card-title { font-family: var(--font-heading); color: var(--text-primary); background: var(--inset); border-bottom-color: var(--border); }
    .grimoire-theme .token-row { border-bottom-color: var(--border); }
    .grimoire-theme .token-name { color: var(--text-secondary); font-family: var(--font-mono); }
    .grimoire-theme .token-value { color: var(--text-primary); font-family: var(--font-mono); }
    .grimoire-theme .token-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }

    /* Type specimens */
    .grimoire-theme .type-specimen { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); }
    .grimoire-theme .type-meta { color: var(--text-secondary); border-right-color: var(--border); }
    .grimoire-theme .type-meta strong { color: var(--accent); }
    .grimoire-theme .type-usage { color: var(--text-tertiary); }

    /* Color grid */
    .grimoire-theme .color-grid { gap: 12px; }
    .grimoire-theme .color-swatch { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); }
    .grimoire-theme .color-swatch-name { color: var(--text-primary); font-family: var(--font-heading); }
    .grimoire-theme .color-swatch-hex { color: var(--text-secondary); font-family: var(--font-mono); }
    .grimoire-theme .color-primary-block { border-radius: var(--radius-md); }

    /* Notes */
    .grimoire-theme .sg-notes { color: var(--text-secondary); }
    .grimoire-theme .sg-notes li { border-bottom-color: var(--border); }
    .grimoire-theme .sg-notes-label { color: var(--text-primary); font-family: var(--font-heading); font-weight: 600; }

    /* Spacing scale */
    .grimoire-theme .spacing-demo { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 24px; }
    .grimoire-theme .spacing-row { border-bottom-color: var(--border); }
    .grimoire-theme .spacing-label { color: var(--text-secondary); font-family: var(--font-mono); }
    .grimoire-theme .spacing-bar { background: var(--accent); border-radius: 1px; opacity: 0.7; }
    .grimoire-theme .spacing-value { color: var(--text-tertiary); font-family: var(--font-mono); }

    /* Spec table */
    .grimoire-theme .spec-table { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); }
    .grimoire-theme .spec-table th { background: var(--inset); color: var(--text-secondary); border-bottom-color: var(--border-strong); font-family: var(--font-flavor); text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px; }
    .grimoire-theme .spec-table td { color: var(--text-primary); border-bottom-color: var(--border); font-family: var(--font-body); }

    /* ═══════════════════════════════════════
       BUTTONS
       ═══════════════════════════════════════ */
    .grimoire-theme .btn {
      font-family: var(--font-heading);
      font-size: 13px;
      font-weight: 600;
      padding: 10px 24px;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.02em;
      border: none;
    }
    .grimoire-theme .btn-primary { background: var(--accent); color: #0D0B0E; }
    .grimoire-theme .btn-primary:hover { background: var(--accent-hover); box-shadow: 0 0 8px var(--accent-glow); }
    .grimoire-theme .btn-secondary { background: transparent; color: var(--text-primary); border: 1px solid var(--border-strong); }
    .grimoire-theme .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
    .grimoire-theme .btn-ghost { background: transparent; color: var(--text-secondary); border: none; }
    .grimoire-theme .btn-ghost:hover { color: var(--accent); }
    .grimoire-theme .btn-danger { background: transparent; color: var(--error); border: 1px solid var(--error); }
    .grimoire-theme .btn-danger:hover { background: var(--error); color: var(--text-primary); }
    .grimoire-theme .btn-sm { font-size: 11px; padding: 6px 16px; }
    .grimoire-theme .btn-lg { font-size: 15px; padding: 14px 32px; }
    .grimoire-theme .button-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; }

    /* ═══════════════════════════════════════
       INPUT FIELDS
       ═══════════════════════════════════════ */
    .grimoire-theme .input-group { margin-bottom: 20px; max-width: 500px; }
    .grimoire-theme .input-label {
      display: block;
      font-family: var(--font-flavor);
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 11px;
      margin-bottom: 8px;
    }
    .grimoire-theme .input-field {
      width: 100%;
      background: var(--inset);
      border: 1px solid var(--border);
      border-radius: 2px;
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 15px;
      padding: 10px 14px;
      outline: none;
      transition: all 0.15s;
    }
    .grimoire-theme .input-field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    .grimoire-theme .input-field.error { border-color: var(--error); }
    .grimoire-theme .input-field::placeholder { color: var(--text-tertiary); }
    .grimoire-theme .input-textarea { min-height: 100px; resize: vertical; }
    .grimoire-theme .input-hint { font-family: var(--font-mono); font-size: 11px; color: var(--text-tertiary); margin-top: 6px; }
    .grimoire-theme .input-hint.error { color: var(--error); }

    /* ═══════════════════════════════════════
       NAVIGATION / TABS
       ═══════════════════════════════════════ */
    .grimoire-theme .phase-tabs { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); }
    .grimoire-theme .phase-tab {
      font-family: var(--font-heading);
      font-size: 13px;
      color: var(--text-secondary);
      border-bottom-color: transparent;
    }
    .grimoire-theme .phase-tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
    .grimoire-theme .phase-tab.completed { color: var(--xp); }

    .grimoire-theme .phase-step-bar { gap: 3px; }
    .grimoire-theme .phase-step { background: var(--border); border-radius: 1px; }
    .grimoire-theme .phase-step.done { background: var(--accent); }
    .grimoire-theme .phase-step.current { background: var(--accent-hover); }

    /* ═══════════════════════════════════════
       STATUS INDICATORS
       ═══════════════════════════════════════ */
    .grimoire-theme .status-grid { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); }
    .grimoire-theme .status-item { border-bottom-color: var(--border); }
    .grimoire-theme .status-text strong { color: var(--text-primary); font-family: var(--font-heading); }
    .grimoire-theme .status-text { color: var(--text-secondary); }
    .grimoire-theme .status-indicator { border-radius: 50%; }
    .grimoire-theme .status-indicator.status-active { background: var(--accent); color: var(--accent); }
    .grimoire-theme .status-indicator.status-complete { background: var(--xp); color: var(--xp); }
    .grimoire-theme .status-indicator.status-failed { background: var(--error); color: var(--error); }
    .grimoire-theme .status-indicator.status-locked { background: var(--text-tertiary); color: var(--text-tertiary); }
    .grimoire-theme .status-indicator.status-legendary { background: var(--gold); color: var(--gold); box-shadow: 0 0 8px var(--accent-glow); animation: inscribe 2s ease-in-out infinite alternate; }

    /* ═══════════════════════════════════════
       CARDS
       ═══════════════════════════════════════ */
    .grimoire-theme .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 24px;
      transition: border-color 0.2s;
    }
    .grimoire-theme .card:hover { border-color: var(--border-strong); }
    .grimoire-theme .card-accent { border-top: 3px solid var(--accent); }
    .grimoire-theme .card-filled { background: var(--elevated); border: 1px solid var(--border-strong); }
    .grimoire-theme .card-title { font-family: var(--font-heading); font-weight: 600; color: var(--text-primary); }
    .grimoire-theme .card-body { font-family: var(--font-body); color: var(--text-secondary); line-height: 1.7; }
    .grimoire-theme .card-tag { font-family: var(--font-mono); font-size: 10px; background: var(--accent-muted); color: var(--accent); border-radius: 2px; display: inline-block; padding: 3px 8px; }
    .grimoire-theme .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }

    /* ═══════════════════════════════════════
       WIDGET DEMOS
       ═══════════════════════════════════════ */
    .grimoire-theme .widget-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); }
    .grimoire-theme .widget-card-header { background: var(--inset); border-bottom-color: var(--border); }
    .grimoire-theme .widget-card-title { color: var(--text-primary); font-family: var(--font-heading); }
    .grimoire-theme .widget-card-badge { background: var(--accent-muted); color: var(--accent); font-family: var(--font-mono); }
    .grimoire-theme .widget-card-desc { color: var(--text-secondary); border-top-color: var(--border); font-family: var(--font-body); }
    .grimoire-theme .widget-card-body { padding: 24px; }
    .grimoire-theme .widget-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 20px; margin-top: 24px; }

    /* HeadlessUI styled components */
    .grimoire-theme .hui-menu-button {
      font-family: var(--font-heading);
      font-size: 13px;
      font-weight: 600;
      padding: 10px 24px;
      background: transparent;
      color: var(--text-primary);
      border: 1px solid var(--border-strong);
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .grimoire-theme .hui-menu-button:hover { border-color: var(--accent); color: var(--accent); }
    .grimoire-theme .hui-menu-items {
      background: var(--elevated);
      border: 1px solid var(--border-strong);
      border-radius: 2px;
      padding: 4px 0;
      margin-top: 4px;
    }
    .grimoire-theme .hui-menu-item {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      border-left: 2px solid transparent;
      font-family: var(--font-heading);
      font-size: 13px;
      color: var(--text-secondary);
      padding: 8px 16px;
      cursor: pointer;
      transition: all 0.1s;
    }
    .grimoire-theme .hui-menu-item:hover { background: var(--accent-muted); color: var(--accent); border-left-color: var(--accent); }
    .grimoire-theme .hui-menu-item.danger { color: var(--error); }
    .grimoire-theme .hui-menu-item.danger:hover { background: var(--error-bg); border-left-color: var(--error); }
    .grimoire-theme .hui-menu-separator { height: 1px; background: var(--border); margin: 4px 0; }

    /* Disclosure */
    .grimoire-theme .hui-disclosure { border: 1px solid var(--border); border-radius: 2px; margin-bottom: 8px; overflow: hidden; }
    .grimoire-theme .hui-disclosure-button {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: var(--surface);
      border: none;
      font-family: var(--font-heading);
      font-size: 14px;
      color: var(--text-primary);
      padding: 12px 16px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .grimoire-theme .hui-disclosure-button:hover { background: var(--elevated); }
    .grimoire-theme .hui-disclosure-arrow { color: var(--accent); font-size: 12px; transition: transform 0.2s; }
    .grimoire-theme .hui-disclosure.open .hui-disclosure-arrow { transform: rotate(180deg); }
    .grimoire-theme .hui-disclosure-panel {
      padding: 12px 16px;
      background: var(--inset);
      font-family: var(--font-body);
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.7;
      border-top: 1px solid var(--border);
    }

    /* Switch */
    .grimoire-theme .hui-switch {
      position: relative;
      display: inline-flex;
      width: 44px;
      height: 24px;
      border-radius: 12px;
      background: var(--border-strong);
      border: none;
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .grimoire-theme .hui-switch.checked { background: var(--accent); }
    .grimoire-theme .hui-switch-thumb {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--text-primary);
      transition: transform 0.2s;
    }
    .grimoire-theme .hui-switch.checked .hui-switch-thumb { transform: translateX(20px); }
    .grimoire-theme .hui-switch-label {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .grimoire-theme .hui-switch-label-text { font-family: var(--font-heading); font-size: 14px; color: var(--text-primary); }
    .grimoire-theme .hui-switch-label-desc { font-family: var(--font-body); font-size: 12px; color: var(--text-tertiary); }

    /* Listbox */
    .grimoire-theme .hui-listbox-button {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--inset);
      border: 1px solid var(--border);
      border-radius: 2px;
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 15px;
      padding: 10px 14px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .grimoire-theme .hui-listbox-button:hover { border-color: var(--accent); }
    .grimoire-theme .hui-listbox-arrow { color: var(--accent); font-size: 12px; }
    .grimoire-theme .hui-listbox-options {
      background: var(--elevated);
      border: 1px solid var(--border-strong);
      border-radius: 2px;
      padding: 4px 0;
      margin-top: 4px;
    }
    .grimoire-theme .hui-listbox-option {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-heading);
      font-size: 14px;

scoped-vars:
  prefix: "theme"

  sections:
    standard:
      selector: 'html[data-design-theme="terminal"]'
      prefix: "theme"
    dark:
      selector: 'html[data-design-theme="terminal"].dark'
      prefix: "theme"
    layout:
      selector: 'html[data-design-theme="terminal"]'
      prefix: "layout"

  vars:
    - name: surface
      value:
        - section: standard
          value: "var(--gray-50)"
        - section: dark
          value: "#0D1117"

    - name: surface-alt
      value:
        - section: standard
          value: "var(--white)"
        - section: dark
          value: "#161B22"

    - name: surface-inverse
      value:
        - section: standard
          value: "var(--gray-900)"
        - section: dark
          value: "var(--gray-100)"

    - name: text
      value:
        - section: standard
          value: "#24292F"
        - section: dark
          value: "#C9D1D9"

    - name: text-secondary
      value:
        - section: standard
          value: "#57606A"
        - section: dark
          value: "#8B949E"

    - name: text-muted
      value:
        - section: standard
          value: "#8B949E"
        - section: dark
          value: "#484F58"

    - name: text-inverse
      value:
        - section: standard
          value: "var(--white)"
        - section: dark
          value: "var(--gray-900)"

    - name: text-link
      value:
        - section: standard
          value: "#0969DA"
        - section: dark
          value: "#58A6FF"

    - name: border
      value:
        - section: standard
          value: "#D0D7DE"
        - section: dark
          value: "#30363D"

    - name: border-strong
      value:
        - section: standard
          value: "#AFB8C1"
        - section: dark
          value: "#484F58"

    - name: shadow-color
      value:
        - section: standard
          value: "rgba(0,0,0,0.04)"
        - section: dark
          value: "rgba(0,0,0,0.4)"

    # Dark mode: brighten accents
    - name: emerald
      value:
        - section: dark
          value: "#3FB950"
    - name: emerald-light
      value:
        - section: dark
          value: "color-mix(in srgb, #3FB950 15%, var(--surface))"

    - name: success
      value:
        - section: dark
          value: "#3FB950"
    - name: success-tint
      value:
        - section: dark
          value: "color-mix(in srgb, #3FB950 15%, var(--surface))"

    - name: warning
      value:
        - section: dark
          value: "#D29922"
    - name: warning-tint
      value:
        - section: dark
          value: "color-mix(in srgb, #D29922 15%, var(--surface))"

    - name: error
      value:
        - section: dark
          value: "#F85149"
    - name: error-tint
      value:
        - section: dark
          value: "color-mix(in srgb, #F85149 15%, var(--surface))"

    - name: info
      value:
        - section: dark
          value: "#58A6FF"
    - name: info-tint
      value:
        - section: dark
          value: "color-mix(in srgb, #58A6FF 15%, var(--surface))"

    - name: violet
      value:
        - section: dark
          value: "#BC8CFF"
    - name: violet-light
      value:
        - section: dark
          value: "color-mix(in srgb, #BC8CFF 15%, var(--surface))"

    # Dark mode: component overrides
    - name: card-background
      value:
        - section: dark
          value: "#161B22"
    - name: card-border-color
      value:
        - section: dark
          value: "#30363D"
    - name: btn-background
      value:
        - section: dark
          value: "#238636"
    - name: btn-color
      value:
        - section: dark
          value: "#FFFFFF"
    - name: btn-hover-background
      value:
        - section: dark
          value: "#2EA043"

    # Layout presets
    - name: standard
      value:
        - section: layout
          values:
            max-width: "1600px"
            padding: "var(--space-3)"
            margin: "0 auto"
            content-bg: "var(--surface)"
      selector: ".content"
      selector-body: "max-width: var(--layout-standard-max-width); padding: var(--layout-standard-padding); margin: var(--layout-standard-margin); background: var(--layout-standard-content-bg)"

    - name: wide
      value:
        - section: layout
          values:
            max-width: "100%"
            padding: "var(--space-2)"
            margin: "0"
            content-bg: "var(--surface)"
      selector: ".content.wide"
      selector-body: "max-width: var(--layout-wide-max-width); padding: var(--layout-wide-padding); margin: var(--layout-wide-margin); background: var(--layout-wide-content-bg)"

    - name: narrow
      value:
        - section: layout
          values:
            max-width: "80ch"
            padding: "var(--space-3)"
            margin: "0 auto"
            content-bg: "var(--surface)"
      selector: ".content.narrow"
      selector-body: "max-width: var(--layout-narrow-max-width); padding: var(--layout-narrow-padding); margin: var(--layout-narrow-margin); background: var(--layout-narrow-content-bg)"

    - name: article
      value:
        - section: layout
          values:
            max-width: "80ch"
            padding: "var(--space-4)"
            margin: "0 auto"
            content-bg: "var(--surface-alt)"
      selector: ".content.article"
      selector-body: "max-width: var(--layout-article-max-width); padding: var(--layout-article-padding); margin: var(--layout-article-margin); background: var(--layout-article-content-bg)"

color-palette:
  - group: Terminal
    description: "Classic terminal output colors — green for success/stdout, amber for warnings, red for errors, blue for info."
    notes:
      - label: Green
        text: "stdout, success, active processes, healthy systems. The primary accent."
        cssClass: emerald
      - label: Amber
        text: "stderr warnings, attention needed, pending states."
        cssClass: amber
      - label: Red
        text: "Errors, failures, critical. stderr at its worst."
        cssClass: rose
    colors:
      - name: Green
        value: "var(--emerald)"
      - name: Green Light
        value: "var(--emerald-light)"
      - name: Amber
        value: "var(--amber)"
      - name: Amber Light
        value: "var(--amber-light)"
      - name: Red
        value: "var(--red)"
      - name: Red Light
        value: "var(--red-light)"
      - name: Blue
        value: "var(--blue)"
      - name: Blue Light
        value: "var(--blue-light)"
      - name: Violet
        value: "var(--violet)"
      - name: Violet Light
        value: "var(--violet-light)"

  - group: Semantic Surfaces
    description: "Mode-aware surface and text tokens."
    colors:
      - name: Surface
        value: "var(--surface)"
      - name: Surface Alt
        value: "var(--surface-alt)"
      - name: Surface Inverse
        value: "var(--surface-inverse)"
      - name: Text
        value: "var(--text)"
      - name: Text Secondary
        value: "var(--text-secondary)"
      - name: Text Muted
        value: "var(--text-muted)"
      - name: Border
        value: "var(--border)"
      - name: Border Strong
        value: "var(--border-strong)"

  - group: Gray
    description: "GitHub-dark neutral ramp."
    colors:
      - name: White
        value: "var(--white)"
      - name: Gray 100
        value: "var(--gray-100)"
      - name: Gray 200
        value: "var(--gray-200)"
      - name: Gray 300
        value: "var(--gray-300)"
      - name: Gray 400
        value: "var(--gray-400)"
      - name: Gray 500
        value: "var(--gray-500)"
      - name: Gray 600
        value: "var(--gray-600)"
      - name: Gray 700
        value: "var(--gray-700)"
      - name: Gray 800
        value: "var(--gray-800)"
      - name: Gray 900
        value: "var(--gray-900)"
      - name: Black
        value: "var(--black)"

  - group: Semantic States
    description: "Functional state colors — terminal convention: green/amber/red."
    colors:
      - name: Success
        value: "var(--success)"
      - name: Success Tint
        value: "var(--success-tint)"
      - name: Warning
        value: "var(--warning)"
      - name: Warning Tint
        value: "var(--warning-tint)"
      - name: Error
        value: "var(--error)"
      - name: Error Tint
        value: "var(--error-tint)"
      - name: Info
        value: "var(--info)"
      - name: Info Tint
        value: "var(--info-tint)"
    notes:
      - label: "[OK]"
        text: "Process completed successfully. Maps to green."
      - label: "[WARN]"
        text: "Non-fatal issue. Maps to amber."
      - label: "[ERR]"
        text: "Process failed. Maps to red."
      - label: "[INFO]"
        text: "Informational output. Maps to blue."

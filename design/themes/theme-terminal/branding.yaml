name: "tobornalp"
logo-text: "TOBORNALP"

font-url: "https://use.typekit.net/placeholder.css"

logo-style:
  font: "var(--font-mono)"
  color: "var(--text)"
  html: '<div style="display:inline-flex;align-items:center;gap:8px"><span style="font-family:var(--font-mono);font-size:14px;font-weight:400;color:var(--text-muted)">$</span><span style="font-family:var(--font-mono);font-size:16px;font-weight:600;letter-spacing:0.04em;line-height:1;color:var(--emerald)">tobornalp</span><span style="font-family:var(--font-mono);font-size:14px;font-weight:400;color:var(--text-muted);animation:blink 1.2s step-end infinite">_</span></div>'

intent: "Pure terminal aesthetic. Every surface reads like a console window. Borders are 1px solid, corners are square, shadows don't exist. Information is conveyed through text prefixes ([OK], [WARN], [ERR]), monospace alignment, and color-coded output — not through visual embellishment. The interface IS the output."

perception: "Raw, competent, no-nonsense. Like SSH-ing into a machine that just works."

audience: "Developers who think in terminals, write in Vim, and consider rounded corners a waste of pixels. They want their PM tool to feel like their editor — monospaced, dense, keyboard-driven."

tone: "Terse. Lowercase. No punctuation unless syntactically required. Reads like log output. Errors are stderr, not modals."

keywords:
  - terminal
  - monospace
  - raw
  - dense
  - hacker
  - stdout
  - pipe

intro:
  title: "tobornalp"
  title-html: '<span style="font-family:var(--font-mono);display:inline-flex;align-items:center;gap:10px"><span style="color:var(--text-muted);font-size:0.7em">$</span><span style="color:var(--emerald);font-weight:600;letter-spacing:0.04em">tobornalp</span><span style="color:var(--text-muted);font-size:0.8em">--theme terminal</span></span>'
  glyph: ""
  subtitle: "TERMINAL · MONOSPACE · RAW"
  quote: "\"stdout is the only UI that matters.\""
  hide-meta: false
  hide-colors: false
  version: "v0.1.0"
  date: "2026-05-27"
  repo: "the-robot-lives/tobornalp.com"
  colors:
    - "#22C55E"
    - "#F59E0B"
    - "#EF4444"
    - "#3B82F6"
    - "#A78BFA"
    - "#0D1117"
  meta:
    - label: "Typeface"
      value: "Source Code Pro (mono everywhere)"
    - label: "Grid"
      value: "4px unit, no gutters"
    - label: "Radius"
      value: "0px (square)"
    - label: "Philosophy"
      value: "stdout > UI"

page-layouts:
  - name: standard
    title: Standard
    description: "Full-width terminal output — no unnecessary margins."
    selector: ".content"
    vars:
      max-width: "1600px"
      padding: "var(--space-3)"
      margin: "0 auto"
      body-bg: "var(--surface)"
      content-bg: "var(--surface)"
    chrome:
      navbar:
        height: "32px"
        background: "var(--surface-alt)"
        color: "var(--text)"
        label: "status"
      footer:
        height: "24px"
        background: "var(--surface-alt)"
        color: "var(--text-muted)"
        label: "$ _"

  - name: wide
    title: Wide
    description: "Edge-to-edge for data tables and log output."
    selector: ".content.wide"
    vars:
      max-width: "100%"
      padding: "var(--space-2)"
      margin: "0"
      body-bg: "var(--surface)"
      content-bg: "var(--surface)"
    chrome:
      navbar:
        height: "32px"
        background: "var(--surface-alt)"
        color: "var(--text)"
        label: "status"

  - name: narrow
    title: Narrow
    description: "Constrained for reading — man page width."
    selector: ".content.narrow"
    vars:
      max-width: "80ch"
      padding: "var(--space-3)"
      margin: "0 auto"
      body-bg: "var(--surface)"
      content-bg: "var(--surface)"
    chrome:
      navbar:
        height: "32px"
        background: "var(--surface-alt)"
        color: "var(--text)"
        label: "status"

  - name: article
    title: Article
    description: "Man page layout — 80 columns, left-aligned."
    selector: ".content.article"
    vars:
      max-width: "80ch"
      padding: "var(--space-4)"
      margin: "0 auto"
      body-bg: "var(--surface)"
      content-bg: "var(--surface-alt)"
    chrome:
      navbar:
        height: "32px"
        background: "var(--surface-alt)"
        color: "var(--text)"
        label: "status"
      sidebar:
        width: "180px"
        background: "var(--surface)"
        color: "var(--text-muted)"
        label: "toc"

  - name: full
    title: Full
    description: "No chrome, no constraints. Raw output."
    selector: ".content.full"
    vars:
      max-width: "100%"
      padding: "var(--space-2)"
      margin: "0"
      body-bg: "var(--surface)"
      content-bg: "var(--surface)"
    chrome: {}

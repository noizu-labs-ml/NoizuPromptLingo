name: "tobornalp"
logo-text: "TOBORNALP"

font-url: "https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Overpass:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Fira+Code:wght@300;400;500;600&display=swap"

logo-style:
  font: "var(--font-display)"
  color: "var(--text)"
  html: '<div style="display:inline-flex;align-items:center;gap:10px"><svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="2" width="24" height="24" rx="2" stroke="var(--cyan)" stroke-width="1.5" filter="drop-shadow(0 0 4px var(--cyan))"/><rect x="6" y="6" width="7" height="7" rx="1" fill="var(--cyan)" opacity="0.8"/><rect x="15" y="6" width="7" height="7" rx="1" fill="var(--magenta)" opacity="0.8"/><rect x="6" y="15" width="7" height="7" rx="1" fill="var(--neon-green)" opacity="0.7"/><rect x="15" y="15" width="7" height="7" rx="1" fill="var(--violet)" opacity="0.6"/></svg><span style="font-family:var(--font-display);font-size:15px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;line-height:1;color:currentColor;text-shadow:0 0 8px var(--cyan)">tobornalp</span></div>'

intent: "Neon hallucination. The interface is a portal to a retro-future that never was — CRT phosphor glow, chrome reflections, and laser-grid horizons. Every surface feels like it's lit from within. The aesthetic is deliberate nostalgia weaponized as design language: synthwave's emotional palette applied to functional UI."

perception: "Electric and immersive. Walking into an 80s arcade that somehow runs your production infrastructure. Visually loud but structurally disciplined — the neon screams, the layout whispers."

audience: "Developers, creative technologists, and retrowave enthusiasts who want their tools to feel like a Kavinsky album cover. People who set their terminal to neon themes and think Tron: Legacy had the right idea about UI design."

tone: "Dramatic and electric. Headlines glow. Status colors pulse. Error states feel like a power grid failure. The interface speaks in the register of a synth bassline — deep, resonant, unmissable."

keywords:
  - synthwave
  - neon
  - retrowave
  - cyberpunk
  - glow
  - CRT
  - outrun
  - retro-futurist

intro:
  title: "tobornalp"
  title-html: '<span style="display:inline-flex;align-items:center;gap:14px"><svg width="40" height="40" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="2" width="24" height="24" rx="2" stroke="var(--cyan)" stroke-width="1.5" filter="drop-shadow(0 0 6px var(--cyan))"/><rect x="6" y="6" width="7" height="7" rx="1" fill="var(--cyan)" opacity="0.8"/><rect x="15" y="6" width="7" height="7" rx="1" fill="var(--magenta)" opacity="0.8"/><rect x="6" y="15" width="7" height="7" rx="1" fill="var(--neon-green)" opacity="0.7"/><rect x="15" y="15" width="7" height="7" rx="1" fill="var(--violet)" opacity="0.6"/></svg><span style="font-family:var(--font-display);font-weight:700;letter-spacing:0.12em;text-transform:uppercase;text-shadow:0 0 12px var(--cyan)">tobornalp</span></span>'

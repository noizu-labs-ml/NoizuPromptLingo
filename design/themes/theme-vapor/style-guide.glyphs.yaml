glyph-language:
  description: >
    Unicode glyphs for tobornalp vapor UI — status indicators, navigation cues, agent markers,
    and typographic punctuation. No icon fonts, no SVG sprites. Every glyph renders natively,
    scales infinitely, and degrades gracefully in plain-text contexts. In the vapor theme,
    glyphs pair with neon glow effects and synthwave color coding.

  principles:
    - rule: "Unicode over icon fonts."
      detail: "Icon fonts fail on load errors and produce invisible squares in fallback. Unicode is always available."
    - rule: "Semantic intent, not decoration."
      detail: "Every glyph carries meaning interpretable via aria-label. Decorative symbols are aria-hidden."
    - rule: "Consistency within context."
      detail: "Same glyph for the same action everywhere. ✕ always means close. → always means forward."
    - rule: "Size from the type scale."
      detail: "Glyphs inherit font-size from their parent. No hardcoded px sizes."
    - rule: "Test across platforms."
      detail: "Unicode rendering varies by OS and font. Test on macOS, Windows, and Android."

  sections:
    - name: status
      title: "Status & State"
      description: >
        System health, agent status, priority indicators, and operational state signals.
        These are the most frequently scanned glyphs — they must be instantly recognizable at 11-14px.
        In vapor, status glyphs pair with neon glow text-shadows for emphasis.
      glyphs:
        - glyph: "●"
          name: "Filled Circle"
          code: "U+25CF"
          use: "Active status dot — online, healthy, running"
          example: "● Online"
        - glyph: "○"
          name: "Empty Circle"
          code: "U+25CB"
          use: "Inactive status dot — offline, idle, stopped"
          example: "○ Offline"
        - glyph: "✓"
          name: "Check"
          code: "U+2713"
          use: "Complete, passed, shipped, approved"
          example: "✓ Deployed"
        - glyph: "✗"
          name: "Cross"
          code: "U+2717"
          use: "Failed, rejected, error"
          example: "✗ Build failed"
        - glyph: "⚠"
          name: "Warning"
          code: "U+26A0"
          use: "Degraded, attention needed, P1"
          example: "⚠ Latency elevated"
        - glyph: "⏱"
          name: "Stopwatch"
          code: "U+23F1"
          use: "In progress, timing, SLA countdown"
          example: "⏱ 2h remaining"
        - glyph: "◉"
          name: "Bullseye"
          code: "U+25C9"
          use: "Selected, focused, current item"
          example: "◉ Active sprint"

    - name: navigation
      title: "Navigation & Actions"
      description: >
        Controls, affordances, and navigational cues. Prefer high-contrast geometric forms
        that read clearly at 12px in dense UI. In vapor, navigation glyphs inherit the cyan
        accent glow on hover states.
      glyphs:
        - glyph: "→"
          name: "Right Arrow"
          code: "U+2192"
          use: "Forward, CTA, next step, flow direction"
          example: "Continue →"
        - glyph: "←"
          name: "Left Arrow"
          code: "U+2190"
          use: "Back navigation, previous"
          example: "← Back"
        - glyph: "↑"
          name: "Up Arrow"
          code: "U+2191"
          use: "Expand, scroll to top, sort ascending"
          example: "↑ Top"
        - glyph: "↓"
          name: "Down Arrow"
          code: "U+2193"
          use: "Collapse, expand, sort descending"
          example: "Show more ↓"
        - glyph: "↗"
          name: "NE Arrow"
          code: "U+2197"
          use: "External link indicator"
          example: "Docs ↗"
        - glyph: "›"
          name: "Chevron Right"
          code: "U+203A"
          use: "Breadcrumb separator, nested nav"
          example: "Home › Projects › Backend"
        - glyph: "⌘"
          name: "Command"
          code: "U+2318"
          use: "Keyboard shortcut label"
          example: "⌘K to search"
        - glyph: "✕"
          name: "Cross / Close"
          code: "U+2715"
          use: "Dismiss, close modal, clear field"
          example: "✕ Close"
        - glyph: "⊕"
          name: "Circled Plus"
          code: "U+2295"
          use: "Add, create new item"
          example: "⊕ New task"
        - glyph: "⚙"
          name: "Gear"
          code: "U+2699"
          use: "Settings, configuration"
          example: "⚙ Settings"

    - name: agents
      title: "Agent Identity"
      description: >
        Glyphs that mark AI agent presence, output, and status in the interface.
        Used alongside violet accent color to create consistent agent visual language.
        In vapor, agent glyphs pair with violet or magenta glow effects.
      glyphs:
        - glyph: "⬢"
          name: "Hexagon"
          code: "U+2B22"
          use: "Agent avatar shape, agent identity marker"
          example: "⬢ PM Agent"
        - glyph: "⚡"
          name: "Lightning"
          code: "U+26A1"
          use: "Automated action, agent-triggered event"
          example: "⚡ Auto-triaged"
        - glyph: "⟳"
          name: "Clockwise Arrow"
          code: "U+27F3"
          use: "Agent retry, refresh, re-evaluation"
          example: "⟳ Re-running"
        - glyph: "⇄"
          name: "Left-Right Arrow"
          code: "U+21C4"
          use: "Agent handoff, human-agent transition"
          example: "⇄ Escalated to human"

    - name: typography
      title: "Typography & Text"
      description: >
        Typographic punctuation for editorial content, wiki pages, and documentation.
      glyphs:
        - glyph: "•"
          name: "Bullet"
          use: "Unordered list items"
          example: "• First item"
        - glyph: "—"
          name: "Em Dash"
          use: "Parenthetical aside, attribution"
          example: "Designed — not just built."
        - glyph: "–"
          name: "En Dash"
          use: "Numeric range"
          example: "Sprint 12–14"
        - glyph: "…"
          name: "Horizontal Ellipsis"
          use: "Truncation, continuation"
          example: "Loading…"
        - glyph: "§"
          name: "Section Sign"
          use: "Section reference in docs"
          example: "See §4.2"

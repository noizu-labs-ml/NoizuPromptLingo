shell-layouts:
  - name: app-shell
    title: App Shell
    description: "Primary application layout — fixed sidebar for navigation, top bar for identity and actions, dense content area. Purple-black chrome with neon accent borders."
    chrome:
      navbar:
        height: "48px"
        background: "var(--gray-900)"
        color: "var(--gray-100)"
        label: "App Bar"
      sidebar:
        width: "240px"
        background: "var(--gray-800)"
        color: "var(--gray-200)"
        label: "Sidebar"
      footer:
        height: "28px"
        background: "var(--gray-800)"
        color: "var(--gray-500)"
        label: "Status Bar"
    zones:
      - label: "Command Bar"
        background: "var(--surface)"
        ratio: 1
      - label: "Content"
        background: "var(--surface)"
        ratio: 4
      - label: "Detail Panel"
        background: "var(--surface-alt)"
        ratio: 2

  - name: focus-shell
    title: Focus Mode
    description: "Distraction-free layout — no sidebar, minimal chrome. Deep void-black background for maximum contrast with neon content."
    chrome:
      navbar:
        height: "48px"
        background: "var(--surface-alt)"
        color: "var(--text)"
        label: "Nav"
    zones:
      - label: "Content"
        background: "var(--surface)"
        ratio: 1

  - name: editor
    title: Editor
    description: "Three-panel layout for code editing, wiki writing, and agent prompt authoring. Deep purple-black panels with cyan accent borders between zones."
    chrome:
      navbar:
        height: "40px"
        background: "var(--gray-900)"
        color: "var(--gray-100)"
        label: "Toolbar"
      sidebar:
        width: "220px"
        background: "var(--gray-800)"
        color: "var(--gray-300)"
        label: "Files"
      aside:
        width: "260px"
        background: "var(--gray-800)"
        color: "var(--gray-300)"
        label: "Inspector"
    zones:
      - label: "Editor"
        background: "var(--gray-900)"
        color: "var(--gray-100)"
        ratio: 1

  - name: document
    title: Document Reader
    description: "Long-form reading layout for wiki pages and ADRs — constrained width, sticky TOC. Lifted surface-alt panel against the void for comfortable reading."
    chrome:
      navbar:
        height: "48px"
        background: "var(--surface-alt)"
        color: "var(--text)"
        label: "Nav"
      sidebar:
        width: "200px"
        background: "var(--surface-alt)"
        color: "var(--text-secondary)"
        label: "TOC"
    zones:
      - label: "Article"
        background: "var(--surface)"
        ratio: 1

scoped-vars:
  prefix: "theme"

  sections:
    standard:
      selector: 'html[data-design-theme="vapor"]'
      prefix: "theme"
    dark:
      selector: 'html[data-design-theme="vapor"].dark'
      prefix: "theme"
    layout:
      selector: 'html[data-design-theme="vapor"]'
      prefix: "layout"

  vars:
    # ═══════════════════════════════════════
    # Color modes: surfaces, text, borders
    # Deep purple-black for the void, lavender
    # pastels for the washed-out light mode
    # ═══════════════════════════════════════
    - name: surface
      value:
        - section: standard
          value: "#F0E8FF"
        - section: dark
          value: "#0A0A1A"

    - name: surface-alt
      value:
        - section: standard
          value: "#E8E0F8"
        - section: dark
          value: "#161233"

    - name: surface-inverse
      value:
        - section: standard
          value: "#0A0A1A"
        - section: dark
          value: "#E8E0FF"

    - name: text
      value:
        - section: standard
          value: "#1A1030"
        - section: dark
          value: "#E8E0FF"

    - name: text-secondary
      value:
        - section: standard
          value: "#3A3060"
        - section: dark
          value: "#B8B0D4"

    - name: text-muted
      value:
        - section: standard
          value: "#6E6690"
        - section: dark
          value: "#6E6690"

    - name: text-inverse
      value:
        - section: standard
          value: "#E8E0FF"
        - section: dark
          value: "#0A0A1A"

    - name: text-link
      value:
        - section: standard
          value: "#0099AA"
        - section: dark
          value: "#00FFFF"

    - name: border
      value:
        - section: standard
          value: "#D4CCF0"
        - section: dark
          value: "#252048"

    - name: border-strong
      value:
        - section: standard
          value: "#B8B0D4"
        - section: dark
          value: "#3A3260"

    - name: shadow-color
      value:
        - section: standard
          value: "rgba(10,10,26,0.08)"
        - section: dark
          value: "rgba(0,0,0,0.4)"

    # ═══════════════════════════════════════
    # Dark mode: neon accent tuning
    # Full-saturation neon — these are already
    # vivid in vars, but scoped-vars override
    # for mode-specific adjustments
    # ═══════════════════════════════════════
    - name: blue
      value:
        - section: dark
          value: "#00FFFF"
    - name: blue-light
      value:
        - section: dark
          value: "rgba(0,255,255,0.10)"
    - name: blue-mid
      value:
        - section: dark
          value: "rgba(0,255,255,0.20)"

    - name: violet
      value:
        - section: dark
          value: "#8B5CF6"
    - name: violet-light
      value:
        - section: dark
          value: "rgba(139,92,246,0.12)"
    - name: violet-mid
      value:
        - section: dark
          value: "rgba(139,92,246,0.22)"

    # ═══════════════════════════════════════
    # Dark mode: palette neon colors
    # Already vivid — minor brightness boosts
    # to ensure readability on deep surfaces
    # ═══════════════════════════════════════
    - name: rose
      value:
        - section: dark
          value: "#FF2D6F"
    - name: rose-light
      value:
        - section: dark
          value: "rgba(255,45,111,0.10)"

    - name: emerald
      value:
        - section: dark
          value: "#39FF14"
    - name: emerald-light
      value:
        - section: dark
          value: "rgba(57,255,20,0.10)"

    - name: amber
      value:
        - section: dark
          value: "#FFE744"
    - name: amber-light
      value:
        - section: dark
          value: "rgba(255,231,68,0.10)"

    - name: cyan
      value:
        - section: dark
          value: "#00FFFF"
    - name: cyan-light
      value:
        - section: dark
          value: "rgba(0,255,255,0.10)"

    - name: indigo
      value:
        - section: dark
          value: "#6366F1"
    - name: indigo-light
      value:
        - section: dark
          value: "rgba(99,102,241,0.10)"

    - name: teal
      value:
        - section: dark
          value: "#00FFFF"
    - name: teal-light
      value:
        - section: dark
          value: "rgba(0,255,255,0.10)"

    - name: orange
      value:
        - section: dark
          value: "#FF6B2B"
    - name: orange-light
      value:
        - section: dark
          value: "rgba(255,107,43,0.10)"

    - name: sky
      value:
        - section: dark
          value: "#00D4FF"
    - name: sky-light
      value:
        - section: dark
          value: "rgba(0,212,255,0.10)"

    - name: lime
      value:
        - section: dark
          value: "#39FF14"
    - name: lime-light
      value:
        - section: dark
          value: "rgba(57,255,20,0.10)"

    - name: pink
      value:
        - section: dark
          value: "#FF69B4"
    - name: pink-light
      value:
        - section: dark
          value: "rgba(255,105,180,0.10)"

    - name: fuchsia
      value:
        - section: dark
          value: "#FF00FF"
    - name: fuchsia-light
      value:
        - section: dark
          value: "rgba(255,0,255,0.10)"

    - name: purple
      value:
        - section: dark
          value: "#A855F7"
    - name: purple-light
      value:
        - section: dark
          value: "rgba(168,85,247,0.10)"

    # ═══════════════════════════════════════
    # Dark mode: semantic state colors
    # Neon-tuned — full saturation for glow
    # ═══════════════════════════════════════
    - name: success
      value:
        - section: dark
          value: "#39FF14"
    - name: success-tint
      value:
        - section: dark
          value: "rgba(57,255,20,0.12)"

    - name: warning
      value:
        - section: dark
          value: "#FFE744"
    - name: warning-tint
      value:
        - section: dark
          value: "rgba(255,231,68,0.12)"

    - name: error
      value:
        - section: dark
          value: "#FF2D6F"
    - name: error-tint
      value:
        - section: dark
          value: "rgba(255,45,111,0.12)"

    - name: info
      value:
        - section: dark
          value: "#00FFFF"
    - name: info-tint
      value:
        - section: dark
          value: "rgba(0,255,255,0.12)"

    # ═══════════════════════════════════════
    # Dark mode: component overrides
    # Purple-tinted card surfaces, cyan buttons
    # ═══════════════════════════════════════
    - name: card-background
      value:
        - section: dark
          value: "var(--gray-800)"
    - name: card-border-color
      value:
        - section: dark
          value: "var(--gray-700)"
    - name: btn-background
      value:
        - section: dark
          value: "#00FFFF"
    - name: btn-hover-background
      value:
        - section: dark
          value: "#33FFFF"

    # ═══════════════════════════════════════
    # Layout presets
    # ═══════════════════════════════════════
    - name: dashboard
      value:
        - section: layout
          values:
            max-width: "1440px"
            padding: "var(--space-3)"
            margin: "0 auto"
            content-bg: "var(--surface)"
      selector: ".content"
      selector-body: "max-width: var(--layout-dashboard-max-width); padding: var(--layout-dashboard-padding); margin: var(--layout-dashboard-margin); background: var(--layout-dashboard-content-bg)"

    - name: standard
      value:
        - section: layout
          values:
            max-width: "1200px"
            padding: "var(--space-4)"
            margin: "0 auto"
            content-bg: "var(--surface-alt)"
      selector: ".content.standard"
      selector-body: "max-width: var(--layout-standard-max-width); padding: var(--layout-standard-padding); margin: var(--layout-standard-margin); background: var(--layout-standard-content-bg)"

    - name: article
      value:
        - section: layout
          values:
            max-width: "72ch"
            padding: "var(--space-6)"
            margin: "0 auto"
            content-bg: "var(--surface-alt)"
      selector: ".content.article"
      selector-body: "max-width: var(--layout-article-max-width); padding: var(--layout-article-padding); margin: var(--layout-article-margin); background: var(--layout-article-content-bg)"

    - name: focus
      value:
        - section: layout
          values:
            max-width: "960px"
            padding: "var(--space-6)"
            margin: "0 auto"
            content-bg: "var(--surface)"
      selector: ".content.focus"
      selector-body: "max-width: var(--layout-focus-max-width); padding: var(--layout-focus-padding); margin: var(--layout-focus-margin); background: var(--layout-focus-content-bg)"

# ═══════════════════════════════════════════════════════════════
# COLOR MODES — tobornalp brutalist
# ═══════════════════════════════════════════════════════════════
#
# Dark mode is home — black background, white text, orange accent.
# Light mode inverts: white background, black text, same orange.
# No subtlety. Maximum contrast. No opacity tricks.
# ═══════════════════════════════════════════════════════════════

color-modes:
  # ── Light mode ─────────────────────────────────────────────
  # White ground, black text, heavy borders. Orange accent
  # stays the same — it is loud enough for any background.
  light:
    surface: "#FFFFFF"
    surface-alt: "#F5F5F5"
    surface-inverse: "#111111"
    surface-accent: "rgba(255,85,0,0.08)"
    surface-warning: "rgba(255,214,0,0.10)"
    surface-danger: "rgba(255,0,0,0.10)"
    surface-success: "rgba(0,204,68,0.10)"
    text: "#111111"
    text-secondary: "#404040"
    text-muted: "#737373"
    text-inverse: "#FFFFFF"
    text-link: "#FF5500"
    border: "#D4D4D4"
    border-strong: "#111111"
    border-accent: "#FF5500"
    shadow-color: "transparent"
    focus-ring: "#FF5500"

  # ── Dark mode ──────────────────────────────────────────────
  # Pure black ground, white text, same orange. This is the
  # natural habitat of brutalism — raw, unadorned, confrontational.
  dark:
    surface: "#111111"
    surface-alt: "#1A1A1A"
    surface-inverse: "#FFFFFF"
    surface-accent: "rgba(255,85,0,0.12)"
    surface-warning: "rgba(255,214,0,0.15)"
    surface-danger: "rgba(255,0,0,0.15)"
    surface-success: "rgba(0,204,68,0.15)"
    text: "#FFFFFF"
    text-secondary: "#A3A3A3"
    text-muted: "#737373"
    text-inverse: "#111111"
    text-link: "#FF5500"
    border: "#404040"
    border-strong: "#FFFFFF"
    border-accent: "#FF5500"
    shadow-color: "transparent"
    focus-ring: "#FF5500"

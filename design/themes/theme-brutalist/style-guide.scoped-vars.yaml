scoped-vars:
  prefix: "theme"

  sections:
    standard:
      selector: 'html[data-design-theme="brutalist"]'
      prefix: "theme"
    dark:
      selector: 'html[data-design-theme="brutalist"].dark'
      prefix: "theme"
    layout:
      selector: 'html[data-design-theme="brutalist"]'
      prefix: "layout"

  vars:
    # ═══════════════════════════════════════
    # Color modes: surfaces, text, borders
    # ═══════════════════════════════════════
    - name: surface
      value:
        - section: standard
          value: "var(--white)"
        - section: dark
          value: "var(--black)"

    - name: surface-alt
      value:
        - section: standard
          value: "var(--gray-50)"
        - section: dark
          value: "var(--gray-900)"

    - name: surface-inverse
      value:
        - section: standard
          value: "var(--black)"
        - section: dark
          value: "var(--white)"

    - name: text
      value:
        - section: standard
          value: "var(--black)"
        - section: dark
          value: "var(--white)"

    - name: text-secondary
      value:
        - section: standard
          value: "var(--gray-600)"
        - section: dark
          value: "var(--gray-400)"

    - name: text-muted
      value:
        - section: standard
          value: "var(--gray-400)"
        - section: dark
          value: "var(--gray-500)"

    - name: text-inverse
      value:
        - section: standard
          value: "var(--white)"
        - section: dark
          value: "var(--black)"

    - name: text-link
      value:
        - section: standard
          value: "var(--red)"
        - section: dark
          value: "var(--red)"

    - name: border
      value:
        - section: standard
          value: "var(--gray-300)"
        - section: dark
          value: "var(--gray-700)"

    - name: border-strong
      value:
        - section: standard
          value: "var(--black)"
        - section: dark
          value: "var(--white)"

    - name: shadow-color
      value:
        - section: standard
          value: "transparent"
        - section: dark
          value: "transparent"

    # ═══════════════════════════════════════
    # Dark mode: accent colors — no brightening tricks,
    # raw values only
    # ═══════════════════════════════════════
    - name: blue
      value:
        - section: dark
          value: "#4488FF"
    - name: blue-light
      value:
        - section: dark
          value: "rgba(0,85,255,0.15)"
    - name: blue-mid
      value:
        - section: dark
          value: "rgba(0,85,255,0.30)"

    - name: violet
      value:
        - section: dark
          value: "#9933FF"
    - name: violet-light
      value:
        - section: dark
          value: "rgba(119,0,255,0.15)"
    - name: violet-mid
      value:
        - section: dark
          value: "rgba(119,0,255,0.30)"

    # ═══════════════════════════════════════
    # Dark mode: palette color adjustments
    # Raw hex values — no color-mix, no blending
    # ═══════════════════════════════════════
    - name: rose
      value:
        - section: dark
          value: "#FF3377"
    - name: rose-light
      value:
        - section: dark
          value: "rgba(255,0,85,0.15)"

    - name: emerald
      value:
        - section: dark
          value: "#33DD66"
    - name: emerald-light
      value:
        - section: dark
          value: "rgba(0,204,68,0.15)"

    - name: amber
      value:
        - section: dark
          value: "#FFE033"
    - name: amber-light
      value:
        - section: dark
          value: "rgba(255,214,0,0.15)"

    - name: cyan
      value:
        - section: dark
          value: "#33DDDD"
    - name: cyan-light
      value:
        - section: dark
          value: "rgba(0,204,204,0.15)"

    - name: indigo
      value:
        - section: dark
          value: "#6633FF"
    - name: indigo-light
      value:
        - section: dark
          value: "rgba(68,0,255,0.15)"

    - name: teal
      value:
        - section: dark
          value: "#33CCAA"
    - name: teal-light
      value:
        - section: dark
          value: "rgba(0,170,136,0.15)"

    - name: orange
      value:
        - section: dark
          value: "#FF7733"
    - name: orange-light
      value:
        - section: dark
          value: "rgba(255,85,0,0.15)"

    - name: sky
      value:
        - section: dark
          value: "#33AAFF"
    - name: sky-light
      value:
        - section: dark
          value: "rgba(0,136,255,0.15)"

    - name: lime
      value:
        - section: dark
          value: "#AADD33"
    - name: lime-light
      value:
        - section: dark
          value: "rgba(136,204,0,0.15)"

    - name: pink
      value:
        - section: dark
          value: "#FF33AA"
    - name: pink-light
      value:
        - section: dark
          value: "rgba(255,0,136,0.15)"

    - name: purple
      value:
        - section: dark
          value: "#AA33FF"
    - name: purple-light
      value:
        - section: dark
          value: "rgba(136,0,255,0.15)"

    - name: fuchsia
      value:
        - section: dark
          value: "#DD33FF"
    - name: fuchsia-light
      value:
        - section: dark
          value: "rgba(204,0,255,0.15)"

    # ═══════════════════════════════════════
    # Dark mode: semantic state adjustments
    # ═══════════════════════════════════════
    - name: success
      value:
        - section: dark
          value: "#33DD66"
    - name: success-tint
      value:
        - section: dark
          value: "rgba(0,204,68,0.15)"

    - name: warning
      value:
        - section: dark
          value: "#FFE033"
    - name: warning-tint
      value:
        - section: dark
          value: "rgba(255,214,0,0.15)"

    - name: error
      value:
        - section: dark
          value: "#FF3333"
    - name: error-tint
      value:
        - section: dark
          value: "rgba(255,0,0,0.15)"

    - name: info
      value:
        - section: dark
          value: "#4488FF"
    - name: info-tint
      value:
        - section: dark
          value: "rgba(0,85,255,0.15)"

    # ═══════════════════════════════════════
    # Dark mode: component overrides
    # No shadows anywhere. Borders only.
    # ═══════════════════════════════════════
    - name: card-background
      value:
        - section: dark
          value: "var(--gray-900)"
    - name: card-border-color
      value:
        - section: dark
          value: "var(--gray-600)"
    - name: btn-background
      value:
        - section: dark
          value: "var(--red)"
    - name: btn-hover-background
      value:
        - section: dark
          value: "#CC4400"

    # ═══════════════════════════════════════
    # Layout presets
    # ═══════════════════════════════════════
    - name: dashboard
      value:
        - section: layout
          values:
            max-width: "1440px"
            padding: "var(--space-3)"
            margin: "0 auto"
            content-bg: "var(--surface)"
      selector: ".content"
      selector-body: "max-width: var(--layout-dashboard-max-width); padding: var(--layout-dashboard-padding); margin: var(--layout-dashboard-margin); background: var(--layout-dashboard-content-bg)"

    - name: standard
      value:
        - section: layout
          values:
            max-width: "1200px"
            padding: "var(--space-4)"
            margin: "0 auto"
            content-bg: "var(--surface-alt)"
      selector: ".content.standard"
      selector-body: "max-width: var(--layout-standard-max-width); padding: var(--layout-standard-padding); margin: var(--layout-standard-margin); background: var(--layout-standard-content-bg)"

    - name: article
      value:
        - section: layout
          values:
            max-width: "72ch"
            padding: "var(--space-6)"
            margin: "0 auto"
            content-bg: "var(--surface-alt)"
      selector: ".content.article"
      selector-body: "max-width: var(--layout-article-max-width); padding: var(--layout-article-padding); margin: var(--layout-article-margin); background: var(--layout-article-content-bg)"

    - name: focus
      value:
        - section: layout
          values:
            max-width: "960px"
            padding: "var(--space-6)"
            margin: "0 auto"
            content-bg: "var(--surface)"
      selector: ".content.focus"
      selector-body: "max-width: var(--layout-focus-max-width); padding: var(--layout-focus-padding); margin: var(--layout-focus-margin); background: var(--layout-focus-content-bg)"

color-palette:
  - group: Brand
    description: "Orange-anchored single-accent palette. Orange is the only permitted color. Everything else is black or white."
    notes:
      - label: Orange (Red)
        text: "Primary action — buttons, links, focus rings, active states. The one violent accent."
        cssClass: red
      - label: Blue
        text: "Secondary structural accent — used sparingly for informational states."
        cssClass: blue
    colors:
      - name: Red (Orange)
        value: "var(--red)"
      - name: Red Light
        value: "var(--red-light)"
      - name: Red Mid
        value: "var(--red-mid)"
      - name: Blue
        value: "var(--blue)"
      - name: Blue Light
        value: "var(--blue-light)"
      - name: Blue Mid
        value: "var(--blue-mid)"

  - group: Semantic Surfaces
    description: "Mode-aware surface and text colors — high contrast, no half-measures."
    colors:
      - name: Surface
        value: "var(--surface)"
      - name: Surface Alt
        value: "var(--surface-alt)"
      - name: Surface Inverse
        value: "var(--surface-inverse)"
      - name: Text
        value: "var(--text)"
      - name: Text Secondary
        value: "var(--text-secondary)"
      - name: Text Muted
        value: "var(--text-muted)"
      - name: Text Inverse
        value: "var(--text-inverse)"
      - name: Border
        value: "var(--border)"
      - name: Border Strong
        value: "var(--border-strong)"

  - group: Palette
    description: "Utility colors for agent avatars, feature domains, tags, data visualization, and status coding."
    colors:
      - name: Rose
        value: "var(--rose)"
      - name: Rose Light
        value: "var(--rose-light)"
      - name: Emerald
        value: "var(--emerald)"
      - name: Emerald Light
        value: "var(--emerald-light)"
      - name: Cyan
        value: "var(--cyan)"
      - name: Cyan Light
        value: "var(--cyan-light)"
      - name: Amber
        value: "var(--amber)"
      - name: Amber Light
        value: "var(--amber-light)"
      - name: Indigo
        value: "var(--indigo)"
      - name: Indigo Light
        value: "var(--indigo-light)"
      - name: Teal
        value: "var(--teal)"
      - name: Teal Light
        value: "var(--teal-light)"
      - name: Orange
        value: "var(--orange)"
      - name: Orange Light
        value: "var(--orange-light)"
      - name: Sky
        value: "var(--sky)"
      - name: Sky Light
        value: "var(--sky-light)"
      - name: Lime
        value: "var(--lime)"
      - name: Lime Light
        value: "var(--lime-light)"
      - name: Pink
        value: "var(--pink)"
      - name: Pink Light
        value: "var(--pink-light)"
      - name: Purple
        value: "var(--purple)"
      - name: Purple Light
        value: "var(--purple-light)"
      - name: Fuchsia
        value: "var(--fuchsia)"
      - name: Fuchsia Light
        value: "var(--fuchsia-light)"

  - group: Gray
    description: "Pure neutrals — no warmth, no tinting, no personality. Raw concrete tones."
    colors:
      - name: White
        value: "var(--white)"
      - name: Gray 50
        value: "var(--gray-50)"
      - name: Gray 100
        value: "var(--gray-100)"
      - name: Gray 200
        value: "var(--gray-200)"
      - name: Gray 300
        value: "var(--gray-300)"
      - name: Gray 400
        value: "var(--gray-400)"
      - name: Gray 500
        value: "var(--gray-500)"
      - name: Gray 600
        value: "var(--gray-600)"
      - name: Gray 700
        value: "var(--gray-700)"
      - name: Gray 800
        value: "var(--gray-800)"
      - name: Gray 900
        value: "var(--gray-900)"
      - name: Black
        value: "var(--black)"

  - group: Semantic States
    description: "Functional state colors — priority, health, and feedback encoding. No ambiguity."
    colors:
      - name: Success
        value: "var(--success)"
      - name: Success Tint
        value: "var(--success-tint)"
      - name: Warning
        value: "var(--warning)"
      - name: Warning Tint
        value: "var(--warning-tint)"
      - name: Error
        value: "var(--error)"
      - name: Error Tint
        value: "var(--error-tint)"
      - name: Info
        value: "var(--info)"
      - name: Info Tint
        value: "var(--info-tint)"
    notes:
      - label: Success
        text: "Healthy, complete, shipped, passed. Pure green."
      - label: Warning
        text: "Attention needed, approaching limit, P1. Electric yellow."
      - label: Error
        text: "Broken, failed, critical, P0. Pure red."
      - label: Info
        text: "Informational, links, agent status. Blue."

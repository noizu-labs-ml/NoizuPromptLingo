typography:
  - var: font-sans
    name: Space Grotesk
    description: "Display typeface. Geometric, bold, industrial. Purpose-built for oversized headings and all-caps labels."
    usage: "Headings, card titles, buttons, labels, navigation"
    weights: [400, 500, 600, 700]

  - var: font-mono
    name: IBM Plex Mono
    description: "Body typeface. Industrial monospace — readable at all sizes, designed by IBM for technical content."
    usage: "Body copy, code blocks, agent logs, metric values, terminal, form inputs"
    weights: [300, 400, 500, 600, 700]

typography-classes:
  - name: Display
    class: typography-display
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-display)"
    font-weight: "700"
    line-height: "1.0"
    letter-spacing: "-0.02em"

  - name: H1
    class: typography-h1
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-3xl)"
    font-weight: "700"
    line-height: "1.1"
    letter-spacing: "-0.01em"

  - name: H2
    class: typography-h2
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-2xl)"
    font-weight: "700"
    line-height: "1.15"
    letter-spacing: "0"

  - name: H3
    class: typography-h3
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-xl)"
    font-weight: "600"
    line-height: "1.2"
    letter-spacing: "0.01em"

  - name: H4
    class: typography-h4
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-lg)"
    font-weight: "600"
    line-height: "1.3"

  - name: Body
    class: typography-body
    font-family: "var(--font-mono)"
    font-size: "var(--font-size-md)"
    font-weight: "400"
    line-height: "1.6"

  - name: Small
    class: typography-small
    font-family: "var(--font-mono)"
    font-size: "var(--font-size-sm)"
    font-weight: "400"
    line-height: "1.5"

  - name: Label
    class: typography-label
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-xs)"
    font-weight: "700"
    line-height: "1.4"
    letter-spacing: "0.08em"
    text-transform: "uppercase"

  - name: Code
    class: typography-code
    font-family: "var(--font-mono)"
    font-size: "var(--font-size-sm)"
    font-weight: "400"
    line-height: "1.5"

  - name: Caption
    class: typography-caption
    font-family: "var(--font-mono)"
    font-size: "var(--font-size-xs)"
    font-weight: "400"
    line-height: "1.4"
    color: "var(--text-muted)"

  - name: Data
    class: typography-data
    font-family: "var(--font-mono)"
    font-size: "var(--font-size-xs)"
    font-weight: "500"
    line-height: "1.3"

# ═══════════════════════════════════════════════════════════════
# PAGE SECTIONS — tobornalp brutalist
# ═══════════════════════════════════════════════════════════════

page-sections:
  - group: Visual Foundation
    desc: "Raw materials — type, color, space, and glyphs. No decoration, only structure."
    sections:
      - id: design-tokens
        title: Design Tokens
        desc: "Full CSS custom property reference — all variables in the system."
      - id: color
        title: Color
        desc: "Black, white, orange accent, and functional state colors. No decorative palette."
      - id: typography
        title: Typography
        desc: "Space Grotesk display, IBM Plex Mono body. Oversized headings, all-caps labels."
      - id: spacing
        title: "Spacing & Grid"
        desc: "12px base unit, exposed grid lines, structural rhythm."

  - group: Structure
    desc: "How pages and shells are assembled — heavy borders as dividers, no shadow elevation."
    sections:
      - id: shell-layouts
        title: Shell Layouts
        desc: "Full-page application shells — bordered panels, no shadow-based depth."
      - id: content-layouts
        title: Content Layouts
        desc: "Content width and spacing presets — standard, wide, narrow, article."
      - id: site-archetypes
        title: Site Archetypes
        desc: "Page-level layout archetypes — dashboard, document, focus mode."
      - id: dividers
        title: "Dividers & Rules"
        desc: "Heavy horizontal rules — 2px solid black, 4px orange accent. No gradients, no fades."
      - id: navigation
        title: Navigation
        desc: "Bordered nav panels, all-caps labels, no hover transitions."

  - group: Interaction
    desc: "Semantic states, status signals, and interactive controls. Heavy borders, square corners."
    sections:
      - id: semantic-classes
        title: Semantic Classes
        desc: "Contextual modifiers — priority, agent status, feedback, and system state."
      - id: ui-elements
        title: UI Elements
        desc: "Cards, buttons, forms — 2px borders, 0px radius, no shadows."
      - id: status-indicators
        title: Status Indicators
        desc: "Badges, alerts, toasts, progress. All-caps, heavy borders, square dots."
      - id: custom-components
        title: Custom Components
        desc: "Project-specific composites — unified badge system with square corners and heavy borders."

  - group: Component Library
    desc: "Browse all exported components — brutalist variants with exposed structure."
    sections:
      - id: component-browser
        title: Component Browser
        desc: "Interactive catalog of all @noizu/styleguide components with live previews and import paths."

  - group: Reference
    desc: "Tokens, generated CSS, YAML config, and live snippets."
    sections:
      - id: generated-css
        title: Generated CSS
        desc: "Output CSS by section — vars, cards, buttons, semantic, utilities."
      - id: theme-config
        title: Theme Config
        desc: "YAML source for this theme."
      - id: snippets
        title: Snippets & Demos
        desc: "CSS and JSX snippets defined in YAML — live previews."
      - id: glyphs
        title: Glyph Language
        desc: "Canonical glyphs for UI controls, navigation, and typography."
      - id: design-sections
        title: Design Principles
        desc: "Core design decisions and rationale — brutalist philosophy applied to interface design."

# ═══════════════════════════════════════════════════════════════
# DESIGN TOKEN SEEDS — style-guide.vars.yaml
# ═══════════════════════════════════════════════════════════════
#
# This is the primary configuration surface. Change these ~12 seed
# values and the engine generates the full design system from them.
#
# HOW IT WORKS:
#   - The engine's cascade (defaults.ts) auto-generates extended
#     scales from seed values (e.g. `unit: 8px` -> full spacing scale)
#   - Values here override any engine defaults
#   - Run `npm run regen` after changes
#
# SEED VALUES (engine auto-expands):
#   unit         -> spacing scale (space-1 through space-160)
#   radius       -> border-radius variants
#   font-sans    -> type scale, component fonts
#   white, black -> gray ramp (gray-50 through gray-900)
#   red, blue, yellow -> accent color variants
#   success, warning, error, info -> semantic states
# ═══════════════════════════════════════════════════════════════

vars:
  groups:
    # ── Core Seeds ──
    # Change these 12 values to define your entire color system.
    # The engine derives gray ramps, tints, and light/mid variants
    # automatically from white, black, and the accent colors.
    - name: Seeds
      vars:
        white: "#ffffff"
        black: "#1a1a1a"
        red: "#e53e3e"
        blue: "#3182ce"
        yellow: "#d69e2e"
        success: "#38a169"
        warning: "#c27a00"
        error: "#c53030"
        info: "#3182ce"

    # ── Typography ──
    # Replace with your project's fonts.
    # Update branding.yaml `font-url` to load the matching Google Fonts.
    - name: Typography
      vars:
        font-sans: "'Inter', sans-serif"
        font-mono: "'JetBrains Mono', monospace"

    # ── Spacing ──
    # `unit` is the base spacing multiplier.
    # 8px is a safe default. 4px for dense UIs, 12px for spacious.
    - name: Spacing
      vars:
        unit: "8px"

    # ── Radius ──
    # 4px is a soft default. 0px for sharp, 8px+ for rounded.
    - name: Radius
      vars:
        radius: "4px"

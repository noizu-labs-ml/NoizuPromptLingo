# ═══════════════════════════════════════════════════════════════
# COLOR MODES — tobornalp editorial
# ═══════════════════════════════════════════════════════════════
#
# Light: warm white (#FAFAF9), stone-tinted grays.
# Dark: warm dark (#1C1917), cream-on-dark text. Closer to
# aged paper under lamplight than a terminal in a dark room.
# ═══════════════════════════════════════════════════════════════

color-modes:
  light:
    surface: "#FAFAF9"
    surface-alt: "#F5F5F4"
    surface-inverse: "#1C1917"
    surface-accent: "rgba(30,64,175,0.05)"
    surface-warning: "rgba(180,83,9,0.06)"
    surface-danger: "rgba(185,28,28,0.06)"
    surface-success: "rgba(22,101,52,0.06)"
    text: "#1C1917"
    text-secondary: "#57534E"
    text-muted: "#A8A29E"
    text-inverse: "#FAFAF9"
    text-link: "#1E40AF"
    border: "#E7E5E4"
    border-strong: "#D6D3D1"
    border-accent: "#1E40AF"
    shadow-color: "rgba(28,25,23,0.06)"
    focus-ring: "rgba(30,64,175,0.4)"

  dark:
    surface: "#1C1917"
    surface-alt: "#292524"
    surface-inverse: "#F5F5F4"
    surface-accent: "rgba(96,165,250,0.10)"
    surface-warning: "rgba(251,191,36,0.10)"
    surface-danger: "rgba(248,113,113,0.10)"
    surface-success: "rgba(52,211,153,0.10)"
    text: "#E7E5E4"
    text-secondary: "#A8A29E"
    text-muted: "#78716C"
    text-inverse: "#1C1917"
    text-link: "#93C5FD"
    border: "#44403C"
    border-strong: "#57534E"
    border-accent: "#93C5FD"
    shadow-color: "rgba(0,0,0,0.3)"
    focus-ring: "rgba(147,197,253,0.4)"

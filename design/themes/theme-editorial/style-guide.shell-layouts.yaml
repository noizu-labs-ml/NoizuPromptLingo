# ═══════════════════════════════════════════════════════════════
# SHELL LAYOUTS — tobornalp editorial
# ═══════════════════════════════════════════════════════════════

shell-layouts:
  - name: app-shell
    title: App Shell
    description: "Primary layout — warm dark sidebar, editorial content area, status footer."
    chrome:
      navbar:
        height: "48px"
        background: "var(--gray-900)"
        color: "var(--gray-200)"
        label: "App Bar"
      sidebar:
        width: "240px"
        background: "var(--gray-800)"
        color: "var(--gray-300)"
        label: "Sidebar"
      footer:
        height: "28px"
        background: "var(--gray-100)"
        color: "var(--gray-500)"
        label: "Status Bar"
    zones:
      - label: "Command Bar"
        background: "var(--surface)"
        ratio: 1
      - label: "Content"
        background: "var(--surface)"
        ratio: 4
      - label: "Detail Panel"
        background: "var(--surface-alt)"
        ratio: 2

  - name: focus-shell
    title: Focus Mode
    description: "Distraction-free — no sidebar, minimal chrome. Serif headers shine here."
    chrome:
      navbar:
        height: "48px"
        background: "var(--surface-alt)"
        color: "var(--text)"
        label: "Nav"
    zones:
      - label: "Content"
        background: "var(--surface)"
        ratio: 1

  - name: editor
    title: Editor
    description: "Three-panel for wiki writing and prompt authoring. Dark panels, warm content."
    chrome:
      navbar:
        height: "40px"
        background: "var(--gray-900)"
        color: "var(--gray-200)"
        label: "Toolbar"
      sidebar:
        width: "220px"
        background: "var(--gray-800)"
        color: "var(--gray-300)"
        label: "Files"
      aside:
        width: "260px"
        background: "var(--gray-800)"
        color: "var(--gray-300)"
        label: "Inspector"
    zones:
      - label: "Editor"
        background: "var(--surface)"
        color: "var(--text)"
        ratio: 1

  - name: document
    title: Document Reader
    description: "Long-form reading — constrained width, sticky TOC. The editorial theme's natural habitat."
    chrome:
      navbar:
        height: "48px"
        background: "var(--surface-alt)"
        color: "var(--text)"
        label: "Nav"
      sidebar:
        width: "200px"
        background: "var(--surface-alt)"
        color: "var(--text-secondary)"
        label: "TOC"
    zones:
      - label: "Article"
        background: "var(--surface)"
        ratio: 1

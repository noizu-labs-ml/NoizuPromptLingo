# ═══════════════════════════════════════════════════════════════
# GLYPH LANGUAGE — tobornalp editorial
# ═══════════════════════════════════════════════════════════════
#
# Same glyph set as the primary theme — consistent cross-theme
# behavior. Glyphs are typographic, not visual-theme-dependent.
# ═══════════════════════════════════════════════════════════════

glyph-language:
  description: >
    Unicode glyphs for tobornalp UI. Theme-independent — the same symbols
    render in every theme variant. Serif headers may change the feel but
    glyphs remain geometric and unambiguous.

  principles:
    - rule: "Unicode over icon fonts."
      detail: "Icon fonts fail on load errors. Unicode is always available."
    - rule: "Semantic intent, not decoration."
      detail: "Every glyph carries meaning interpretable via aria-label."
    - rule: "Consistency within context."
      detail: "Same glyph for the same action everywhere."
    - rule: "Size from the type scale."
      detail: "Glyphs inherit font-size from their parent."
    - rule: "Test across platforms."
      detail: "Unicode rendering varies by OS and font."

  sections:
    - name: status
      title: "Status & State"
      description: "System health, agent status, priority indicators."
      glyphs:
        - glyph: "●"
          name: "Filled Circle"
          code: "U+25CF"
          use: "Active status dot — online, healthy, running"
          example: "● Online"
        - glyph: "○"
          name: "Empty Circle"
          code: "U+25CB"
          use: "Inactive status dot — offline, idle, stopped"
          example: "○ Offline"
        - glyph: "✓"
          name: "Check"
          code: "U+2713"
          use: "Complete, passed, shipped, approved"
          example: "✓ Deployed"
        - glyph: "✗"
          name: "Cross"
          code: "U+2717"
          use: "Failed, rejected, error"
          example: "✗ Build failed"
        - glyph: "⚠"
          name: "Warning"
          code: "U+26A0"
          use: "Degraded, attention needed, P1"
          example: "⚠ Latency elevated"
        - glyph: "⏱"
          name: "Stopwatch"
          code: "U+23F1"
          use: "In progress, timing, SLA countdown"
          example: "⏱ 2h remaining"
        - glyph: "◉"
          name: "Bullseye"
          code: "U+25C9"
          use: "Selected, focused, current item"
          example: "◉ Active sprint"

    - name: navigation
      title: "Navigation & Actions"
      description: "Controls, affordances, and navigational cues."
      glyphs:
        - glyph: "→"
          name: "Right Arrow"
          code: "U+2192"
          use: "Forward, CTA, next step"
          example: "Continue →"
        - glyph: "←"
          name: "Left Arrow"
          code: "U+2190"
          use: "Back navigation, previous"
          example: "← Back"
        - glyph: "↑"
          name: "Up Arrow"
          code: "U+2191"
          use: "Expand, scroll to top, sort ascending"
          example: "↑ Top"
        - glyph: "↓"
          name: "Down Arrow"
          code: "U+2193"
          use: "Collapse, expand, sort descending"
          example: "Show more ↓"
        - glyph: "↗"
          name: "NE Arrow"
          code: "U+2197"
          use: "External link indicator"
          example: "Docs ↗"
        - glyph: "›"
          name: "Chevron Right"
          code: "U+203A"
          use: "Breadcrumb separator, nested nav"
          example: "Home › Projects › Backend"
        - glyph: "⌘"
          name: "Command"
          code: "U+2318"
          use: "Keyboard shortcut label"
          example: "⌘K to search"
        - glyph: "✕"
          name: "Cross / Close"
          code: "U+2715"
          use: "Dismiss, close modal, clear field"
          example: "✕ Close"
        - glyph: "⊕"
          name: "Circled Plus"
          code: "U+2295"
          use: "Add, create new item"
          example: "⊕ New task"
        - glyph: "⚙"
          name: "Gear"
          code: "U+2699"
          use: "Settings, configuration"
          example: "⚙ Settings"

    - name: agents
      title: "Agent Identity"
      description: "Glyphs marking AI agent presence and output."
      glyphs:
        - glyph: "⬢"
          name: "Hexagon"
          code: "U+2B22"
          use: "Agent avatar shape, agent identity marker"
          example: "⬢ PM Agent"
        - glyph: "⚡"
          name: "Lightning"
          code: "U+26A1"
          use: "Automated action, agent-triggered event"
          example: "⚡ Auto-triaged"
        - glyph: "⟳"
          name: "Clockwise Arrow"
          code: "U+27F3"
          use: "Agent retry, refresh, re-evaluation"
          example: "⟳ Re-running"
        - glyph: "⇄"
          name: "Left-Right Arrow"
          code: "U+21C4"
          use: "Agent handoff, human-agent transition"
          example: "⇄ Escalated to human"

    - name: typography
      title: "Typography & Text"
      description: "Editorial typographic punctuation."
      glyphs:
        - glyph: "•"
          name: "Bullet"
          use: "Unordered list items"
          example: "• First item"
        - glyph: "—"
          name: "Em Dash"
          use: "Parenthetical aside, attribution"
          example: "Designed — not just built."
        - glyph: "–"
          name: "En Dash"
          use: "Numeric range"
          example: "Sprint 12–14"
        - glyph: "…"
          name: "Horizontal Ellipsis"
          use: "Truncation, continuation"
          example: "Loading…"
        - glyph: "§"
          name: "Section Sign"
          use: "Section reference in docs"
          example: "See §4.2"

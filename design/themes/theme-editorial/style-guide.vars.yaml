# ═══════════════════════════════════════════════════════════════
# DESIGN TOKENS — tobornalp editorial
# ═══════════════════════════════════════════════════════════════
#
# Bloomberg Terminal meets The Economist.
#
# TYPOGRAPHY STRATEGY:
#   Display/Headers: Source Serif Pro — refined serif for authority
#   Body/UI: Source Sans Pro — humanist sans for sustained readability
#   Code/Data: Source Code Pro — clean monospace, same family harmony
#   (Adobe Fonts alternatives: Freight Display, Tiempos, Aktiv Grotesk)
#
# COLOR STRATEGY:
#   Stone-tinted neutrals (warm grays) replace slate (cool grays).
#   Same functional color encoding as primary theme but slightly
#   muted — status through typography weight, not loud badges.
#
# SPACING STRATEGY:
#   Same 8px unit. Generous line-height (1.65 body). Tighter header
#   tracking. Editorial whitespace between sections.
# ═══════════════════════════════════════════════════════════════

vars:
  groups:
    - name: "Seeds"
      vars:
        white: "#FAFAF9"
        black: "#1C1917"
        red: "#B91C1C"
        blue: "#1E40AF"
        yellow: "#B45309"
        font-sans: "'Source Sans Pro', 'Aktiv Grotesk', -apple-system, BlinkMacSystemFont, sans-serif"
        font-mono: "'Source Code Pro', 'Fira Code', monospace"
        radius: "8px"
        unit: "8px"

    # ── Stone-Tinted Neutrals ──
    # Warm gray foundation — closer to newsprint than steel
    - name: "Neutrals"
      vars:
        gray-50: "#FAFAF9"
        gray-100: "#F5F5F4"
        gray-200: "#E7E5E4"
        gray-300: "#D6D3D1"
        gray-400: "#A8A29E"
        gray-500: "#78716C"
        gray-600: "#57534E"
        gray-700: "#44403C"
        gray-800: "#292524"
        gray-900: "#1C1917"

    - name: "Accent Primaries"
      vars:
        red-light: "rgba(185,28,28,0.07)"
        red-mid: "rgba(185,28,28,0.14)"
        blue-light: "rgba(30,64,175,0.07)"
        blue-mid: "rgba(30,64,175,0.14)"
        yellow-light: "rgba(180,83,9,0.08)"
        yellow-mid: "rgba(180,83,9,0.16)"

    - name: "Semantic"
      vars:
        success: "#166534"
        success-tint: "rgba(22,101,52,0.08)"
        warning: "#B45309"
        warning-tint: "rgba(180,83,9,0.08)"
        error: "#B91C1C"
        error-tint: "rgba(185,28,28,0.08)"
        info: "#1E40AF"
        info-tint: "rgba(30,64,175,0.08)"

    # ── Extended Palette ──
    # Deeper, more muted — editorial restraint
    - name: "Extended Palette"
      vars:
        violet: "#6D28D9"
        violet-light: "rgba(109,40,217,0.07)"
        violet-mid: "rgba(109,40,217,0.14)"
        emerald: "#166534"
        emerald-light: "rgba(22,101,52,0.07)"
        cyan: "#0E7490"
        cyan-light: "rgba(14,116,144,0.07)"
        rose: "#BE123C"
        rose-light: "rgba(190,18,60,0.07)"
        amber: "#B45309"
        amber-light: "rgba(180,83,9,0.07)"
        indigo: "#4338CA"
        indigo-light: "rgba(67,56,202,0.07)"
        teal: "#0F766E"
        teal-light: "rgba(15,118,110,0.07)"
        orange: "#C2410C"
        orange-light: "rgba(194,65,12,0.07)"
        sky: "#0369A1"
        sky-light: "rgba(3,105,161,0.07)"
        lime: "#4D7C0F"
        lime-light: "rgba(77,124,15,0.07)"
        pink: "#BE185D"
        pink-light: "rgba(190,24,93,0.07)"
        fuchsia: "#A21CAF"
        fuchsia-light: "rgba(162,28,175,0.07)"
        purple: "#7E22CE"
        purple-light: "rgba(126,34,206,0.07)"

    # ── Typography ──
    # Serif display, humanist sans body, clean mono for data.
    # Slightly larger base (15px) for sustained readability.
    - name: "Typography"
      vars:
        font-display: "'Source Serif Pro', 'Freight Display Pro', 'Tiempos Headline', Georgia, serif"
        font-body: "'Source Sans Pro', 'Aktiv Grotesk', sans-serif"
        font-decorative: "'Source Serif Pro', Georgia, serif"
        size-xs: "11px"
        size-sm: "13px"
        size-md: "15px"
        size-lg: "17px"
        size-xl: "21px"
        font-size-2xs: "10px"
        font-size-xs: "var(--size-xs)"
        font-size-sm: "var(--size-sm)"
        font-size-md: "var(--size-md)"
        font-size-lg: "var(--size-lg)"
        font-size-xl: "var(--size-xl)"
        font-size-2xl: "26px"
        font-size-3xl: "34px"
        font-size-display: "44px"
        font-size-base: "var(--size-md)"

    # ── Spacing ──
    # Same 8px unit, slightly wider gutter for editorial breathing room
    - name: "Spacing"
      vars:
        space-quarter: "2px"
        space-half: "4px"
        space-1: "8px"
        space-2: "16px"
        space-3: "24px"
        space-4: "32px"
        space-5: "40px"
        space-6: "48px"
        space-8: "64px"
        space-10: "80px"
        space-12: "96px"
        col-gap: "16px"

    # ── Radius ──
    # Softer, more editorial
    - name: "Radius"
      vars:
        radius-sm: "6px"
        radius-md: "8px"
        radius-lg: "12px"

    - name: "Base"
      vars:
        base-font-size: "15px"
        base-line-height: "1.65"
        base-font-family: "var(--font-sans)"
        base-font-color: "var(--text, var(--black))"
        base-background: "var(--surface, var(--white))"
        bg: "var(--surface, var(--white))"

    - name: "Branding"
      vars:
        branding-logo-font-size: "20px"
        branding-logo-font-weight: "600"
        branding-logo-letter-spacing: "-0.01em"
        branding-logo-text-transform: "none"
        branding-logo-bg: "var(--surface)"
        branding-border: "1px solid var(--border)"

    # ── Cards ──
    # Subtle drop shadows instead of borders. Softer edges.
    - name: "Cards"
      vars:
        card-accent-side: "left"
        card-background: "var(--surface)"
        card-border-color: "transparent"
        card-header-background: "var(--surface-alt)"
        card-footer-background: "var(--surface-alt)"
        card-footer-font-size: "11px"

    # ── Buttons ──
    - name: "Buttons"
      vars:
        btn-font-family: "var(--font-sans)"
        btn-font-weight: "600"
        btn-font-size: "13px"
        btn-letter-spacing: "0.01em"
        btn-background: "var(--blue)"
        btn-color: "#FFFFFF"
        btn-border-color: "transparent"
        btn-hover-background: "#1E3A8A"
        btn-hover-border-color: "transparent"
        btn-outline-background: "transparent"
        btn-outline-color: "var(--text)"
        btn-outline-hover-background: "var(--surface-alt)"

    # ── Section Chrome ──
    - name: "Section Chrome"
      vars:
        sg-section-title-font-family: "var(--font-display)"
        sg-section-title-text-transform: "none"
        sg-section-title-letter-spacing: "-0.02em"
        sg-section-title-color: "var(--text)"
        sg-section-number-bg: "var(--blue)"
        sg-section-number-border: "none"
        sg-section-number-color: "#FFFFFF"
        sg-section-number-radius: "50%"
        sg-section-desc-font-family: "var(--font-sans)"
        sg-section-desc-color: "var(--text-muted)"
        sg-type-specimen-bg: "var(--surface-alt)"
        sg-type-specimen-border: "none"
        sg-type-specimen-border-bottom: "2px solid var(--blue)"
        sg-type-specimen-radius: "var(--radius-md)"
        sg-type-specimen-padding: "var(--space-3)"
        sg-type-specimen-margin: "0 0 var(--space-3) 0"
        sg-type-specimen-name-color: "var(--text)"
        sg-type-specimen-name-font: "var(--font-display)"
        hr-section-height: "1px"
        hr-section-color: "var(--border)"
        hr-subsection-color: "var(--border)"
        hr-subsection-height: "1px"
        hr-accent-color: "var(--blue)"

    # ── HUI: Focus & Interaction ──
    - name: "HUI: Focus & Interaction"
      vars:
        hui-focus-ring-color: "rgba(30,64,175,0.4)"
        hui-focus-ring-width: "2px"

    # ── HUI: Controls ──
    - name: "HUI: Controls"
      vars:
        hui-control-color: "var(--text)"
        hui-control-bg: "var(--surface)"
        hui-control-border: "var(--gray-300)"
        hui-control-shadow: "0 1px 2px rgba(28,25,23,0.05)"
        hui-switch-track-on-bg: "var(--blue)"
        hui-switch-track-off-bg: "var(--gray-300)"
        hui-switch-thumb-shadow: "0 1px 3px rgba(28,25,23,0.12)"
        hui-radio-option-border: "var(--border)"
        hui-radio-option-border-active: "var(--blue)"
        hui-radio-option-bg-active: "var(--blue-light)"

    - name: "HUI: Trigger Buttons"
      vars:
        hui-trigger-bg: "var(--surface)"
        hui-trigger-border: "var(--gray-300)"
        hui-trigger-border-hover: "var(--gray-400)"
        hui-trigger-color: "var(--text)"

    - name: "HUI: Overlay Panels"
      vars:
        hui-panel-bg: "var(--surface)"
        hui-panel-border: "var(--border)"
        hui-panel-shadow: "0 8px 24px rgba(28,25,23,0.12)"
        hui-panel-item-active-bg: "var(--blue-light)"
        hui-panel-item-active-color: "var(--text)"
        hui-panel-sep-color: "var(--border)"

    - name: "HUI: Tabs"
      vars:
        hui-tab-color: "var(--text-muted)"
        hui-tab-color-selected: "var(--text)"
        hui-tab-border-selected: "var(--blue)"
        hui-tab-color-hover: "var(--text-secondary)"
        hui-tab-list-border: "var(--border)"

    - name: "HUI: Disclosure"
      vars:
        hui-disclosure-bg: "var(--surface-alt)"
        hui-disclosure-bg-hover: "var(--gray-200)"
        hui-disclosure-border: "var(--border)"
        hui-disclosure-color: "var(--text)"
        hui-disclosure-panel-bg: "var(--surface)"
        hui-disclosure-panel-color: "var(--text-secondary)"
        hui-disclosure-chevron-color: "var(--text-muted)"

    - name: "HUI: Field Controls"
      vars:
        hui-field-bg: "var(--surface)"
        hui-field-border: "var(--gray-300)"
        hui-field-border-hover: "var(--gray-400)"
        hui-field-focus-border: "var(--blue)"
        hui-field-color: "var(--text)"
        hui-field-shadow: "0 1px 2px rgba(28,25,23,0.05)"
        hui-combo-placeholder-color: "var(--text-muted)"
        hui-combo-btn-color: "var(--text-muted)"

    - name: "HUI: Dialog"
      vars:
        hui-dialog-bg: "var(--surface)"
        hui-dialog-shadow: "0 12px 40px rgba(28,25,23,0.16)"
        hui-dialog-title-color: "var(--text)"
        hui-dialog-body-color: "var(--text-secondary)"
        hui-dialog-backdrop: "rgba(28,25,23,0.5)"

    - name: "HUI: Showcase Grid"
      vars:
        hui-showcase-accent: "var(--blue)"
        hui-showcase-bg: "var(--surface-alt)"
        hui-showcase-border: "var(--border)"
        hui-showcase-cell-bg: "var(--surface)"
        hui-showcase-cell-border: "var(--border)"
        hui-showcase-label-color: "var(--text-muted)"

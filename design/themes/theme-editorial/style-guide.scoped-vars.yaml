# ═══════════════════════════════════════════════════════════════
# SCOPED VARS — tobornalp editorial
# ═══════════════════════════════════════════════════════════════

scoped-vars:
  prefix: "theme"

  sections:
    standard:
      selector: 'html[data-design-theme="editorial"]'
      prefix: "theme"
    dark:
      selector: 'html[data-design-theme="editorial"].dark'
      prefix: "theme"
    layout:
      selector: 'html[data-design-theme="editorial"]'
      prefix: "layout"

  vars:
    # ═══════════════════════════════════════
    # Color modes: warm surfaces, stone text
    # ═══════════════════════════════════════
    - name: surface
      value:
        - section: standard
          value: "#FAFAF9"
        - section: dark
          value: "#1C1917"

    - name: surface-alt
      value:
        - section: standard
          value: "#F5F5F4"
        - section: dark
          value: "#292524"

    - name: surface-inverse
      value:
        - section: standard
          value: "#1C1917"
        - section: dark
          value: "#F5F5F4"

    - name: text
      value:
        - section: standard
          value: "#1C1917"
        - section: dark
          value: "#E7E5E4"

    - name: text-secondary
      value:
        - section: standard
          value: "#57534E"
        - section: dark
          value: "#A8A29E"

    - name: text-muted
      value:
        - section: standard
          value: "#A8A29E"
        - section: dark
          value: "#78716C"

    - name: text-inverse
      value:
        - section: standard
          value: "#FAFAF9"
        - section: dark
          value: "#1C1917"

    - name: text-link
      value:
        - section: standard
          value: "#1E40AF"
        - section: dark
          value: "#93C5FD"

    - name: border
      value:
        - section: standard
          value: "#E7E5E4"
        - section: dark
          value: "#44403C"

    - name: border-strong
      value:
        - section: standard
          value: "#D6D3D1"
        - section: dark
          value: "#57534E"

    - name: shadow-color
      value:
        - section: standard
          value: "rgba(28,25,23,0.06)"
        - section: dark
          value: "rgba(0,0,0,0.3)"

    # ═══════════════════════════════════════
    # Dark mode: accent brightening
    # ═══════════════════════════════════════
    - name: blue
      value:
        - section: dark
          value: "#93C5FD"
    - name: blue-light
      value:
        - section: dark
          value: "color-mix(in srgb, #1E40AF 18%, var(--surface))"
    - name: blue-mid
      value:
        - section: dark
          value: "color-mix(in srgb, #1E40AF 30%, var(--surface))"

    - name: violet
      value:
        - section: dark
          value: "color-mix(in srgb, #6D28D9 65%, white)"
    - name: violet-light
      value:
        - section: dark
          value: "color-mix(in srgb, #6D28D9 18%, var(--surface))"
    - name: violet-mid
      value:
        - section: dark
          value: "color-mix(in srgb, #6D28D9 30%, var(--surface))"

    # ── Dark mode palette brightening ──
    - name: rose
      value:
        - section: dark
          value: "color-mix(in srgb, #BE123C 65%, white)"
    - name: rose-light
      value:
        - section: dark
          value: "color-mix(in srgb, #BE123C 18%, var(--surface))"
    - name: emerald
      value:
        - section: dark
          value: "color-mix(in srgb, #166534 60%, white)"
    - name: emerald-light
      value:
        - section: dark
          value: "color-mix(in srgb, #166534 18%, var(--surface))"
    - name: amber
      value:
        - section: dark
          value: "color-mix(in srgb, #B45309 65%, white)"
    - name: amber-light
      value:
        - section: dark
          value: "color-mix(in srgb, #B45309 18%, var(--surface))"
    - name: cyan
      value:
        - section: dark
          value: "color-mix(in srgb, #0E7490 65%, white)"
    - name: cyan-light
      value:
        - section: dark
          value: "color-mix(in srgb, #0E7490 18%, var(--surface))"
    - name: indigo
      value:
        - section: dark
          value: "color-mix(in srgb, #4338CA 65%, white)"
    - name: indigo-light
      value:
        - section: dark
          value: "color-mix(in srgb, #4338CA 18%, var(--surface))"
    - name: teal
      value:
        - section: dark
          value: "color-mix(in srgb, #0F766E 60%, white)"
    - name: teal-light
      value:
        - section: dark
          value: "color-mix(in srgb, #0F766E 18%, var(--surface))"
    - name: orange
      value:
        - section: dark
          value: "color-mix(in srgb, #C2410C 65%, white)"
    - name: orange-light
      value:
        - section: dark
          value: "color-mix(in srgb, #C2410C 18%, var(--surface))"
    - name: sky
      value:
        - section: dark
          value: "color-mix(in srgb, #0369A1 65%, white)"
    - name: sky-light
      value:
        - section: dark
          value: "color-mix(in srgb, #0369A1 18%, var(--surface))"
    - name: lime
      value:
        - section: dark
          value: "color-mix(in srgb, #4D7C0F 60%, white)"
    - name: lime-light
      value:
        - section: dark
          value: "color-mix(in srgb, #4D7C0F 18%, var(--surface))"
    - name: pink
      value:
        - section: dark
          value: "color-mix(in srgb, #BE185D 65%, white)"
    - name: pink-light
      value:
        - section: dark
          value: "color-mix(in srgb, #BE185D 18%, var(--surface))"
    - name: purple
      value:
        - section: dark
          value: "color-mix(in srgb, #7E22CE 65%, white)"
    - name: purple-light
      value:
        - section: dark
          value: "color-mix(in srgb, #7E22CE 18%, var(--surface))"
    - name: fuchsia
      value:
        - section: dark
          value: "color-mix(in srgb, #A21CAF 65%, white)"
    - name: fuchsia-light
      value:
        - section: dark
          value: "color-mix(in srgb, #A21CAF 18%, var(--surface))"

    # ── Dark mode semantic state brightening ──
    - name: success
      value:
        - section: dark
          value: "color-mix(in srgb, #166534 55%, white)"
    - name: success-tint
      value:
        - section: dark
          value: "color-mix(in srgb, #166534 18%, var(--surface))"
    - name: warning
      value:
        - section: dark
          value: "color-mix(in srgb, #B45309 65%, white)"
    - name: warning-tint
      value:
        - section: dark
          value: "color-mix(in srgb, #B45309 18%, var(--surface))"
    - name: error
      value:
        - section: dark
          value: "color-mix(in srgb, #B91C1C 65%, white)"
    - name: error-tint
      value:
        - section: dark
          value: "color-mix(in srgb, #B91C1C 18%, var(--surface))"
    - name: info
      value:
        - section: dark
          value: "color-mix(in srgb, #1E40AF 65%, white)"
    - name: info-tint
      value:
        - section: dark
          value: "color-mix(in srgb, #1E40AF 18%, var(--surface))"

    # ── Dark mode component overrides ──
    - name: card-background
      value:
        - section: dark
          value: "var(--gray-800)"
    - name: card-border-color
      value:
        - section: dark
          value: "transparent"
    - name: btn-background
      value:
        - section: dark
          value: "#2563EB"
    - name: btn-hover-background
      value:
        - section: dark
          value: "#3B82F6"

    # ═══════════════════════════════════════
    # Layout presets
    # ═══════════════════════════════════════
    - name: dashboard
      value:
        - section: layout
          values:
            max-width: "1440px"
            padding: "var(--space-3)"
            margin: "0 auto"
            content-bg: "var(--surface)"
      selector: ".content"
      selector-body: "max-width: var(--layout-dashboard-max-width); padding: var(--layout-dashboard-padding); margin: var(--layout-dashboard-margin); background: var(--layout-dashboard-content-bg)"

    - name: standard
      value:
        - section: layout
          values:
            max-width: "1200px"
            padding: "var(--space-4)"
            margin: "0 auto"
            content-bg: "var(--surface-alt)"
      selector: ".content.standard"
      selector-body: "max-width: var(--layout-standard-max-width); padding: var(--layout-standard-padding); margin: var(--layout-standard-margin); background: var(--layout-standard-content-bg)"

    - name: article
      value:
        - section: layout
          values:
            max-width: "68ch"
            padding: "var(--space-8)"
            margin: "0 auto"
            content-bg: "var(--surface-alt)"
      selector: ".content.article"
      selector-body: "max-width: var(--layout-article-max-width); padding: var(--layout-article-padding); margin: var(--layout-article-margin); background: var(--layout-article-content-bg)"

    - name: focus
      value:
        - section: layout
          values:
            max-width: "960px"
            padding: "var(--space-8)"
            margin: "0 auto"
            content-bg: "var(--surface)"
      selector: ".content.focus"
      selector-body: "max-width: var(--layout-focus-max-width); padding: var(--layout-focus-padding); margin: var(--layout-focus-margin); background: var(--layout-focus-content-bg)"

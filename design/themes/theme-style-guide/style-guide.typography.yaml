typography:
  - var: font-sans
    name: Inter
    description: "Primary typeface. Best-in-class legibility at 11-14px with variable weight and optical sizing."
    usage: "Headings, card titles, buttons, body copy, form labels"
    weights: [300, 400, 500, 600, 700]

  - var: font-mono
    name: JetBrains Mono
    description: "Monospace typeface. Ligatures, clear disambiguation at 12px. Used for code, agent output, and data values."
    usage: "Code blocks, agent logs, metric values, commit hashes, terminal"
    weights: [300, 400, 500, 600]

typography-classes:
  - name: Display
    class: typography-display
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-display)"
    font-weight: "600"
    line-height: "1.1"
    letter-spacing: "-0.03em"

  - name: H1
    class: typography-h1
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-3xl)"
    font-weight: "600"
    line-height: "1.2"
    letter-spacing: "-0.02em"

  - name: H2
    class: typography-h2
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-2xl)"
    font-weight: "600"
    line-height: "1.25"
    letter-spacing: "-0.015em"

  - name: H3
    class: typography-h3
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-xl)"
    font-weight: "500"
    line-height: "1.3"
    letter-spacing: "-0.01em"

  - name: H4
    class: typography-h4
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-lg)"
    font-weight: "500"
    line-height: "1.4"

  - name: Body
    class: typography-body
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-md)"
    font-weight: "400"
    line-height: "1.5"

  - name: Small
    class: typography-small
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-sm)"
    font-weight: "400"
    line-height: "1.5"

  - name: Label
    class: typography-label
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-xs)"
    font-weight: "600"
    line-height: "1.4"
    letter-spacing: "0.04em"
    text-transform: "uppercase"

  - name: Code
    class: typography-code
    font-family: "var(--font-mono)"
    font-size: "var(--font-size-sm)"
    font-weight: "400"
    line-height: "1.5"

  - name: Caption
    class: typography-caption
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-xs)"
    font-weight: "400"
    line-height: "1.4"
    color: "var(--text-muted)"

  - name: Data
    class: typography-data
    font-family: "var(--font-mono)"
    font-size: "var(--font-size-xs)"
    font-weight: "500"
    line-height: "1.3"

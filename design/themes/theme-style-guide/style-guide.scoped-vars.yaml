scoped-vars:
  prefix: "theme"

  sections:
    standard:
      selector: 'html[data-design-theme="style-guide"]'
      prefix: "theme"
    dark:
      selector: 'html[data-design-theme="style-guide"].dark'
      prefix: "theme"
    layout:
      selector: 'html[data-design-theme="style-guide"]'
      prefix: "layout"

  vars:
    # ═══════════════════════════════════════
    # Color modes: surfaces, text, borders
    # ═══════════════════════════════════════
    - name: surface
      value:
        - section: standard
          value: "var(--white)"
        - section: dark
          value: "#0F172A"

    - name: surface-alt
      value:
        - section: standard
          value: "var(--gray-50)"
        - section: dark
          value: "#1E293B"

    - name: surface-inverse
      value:
        - section: standard
          value: "var(--gray-900)"
        - section: dark
          value: "var(--gray-200)"

    - name: text
      value:
        - section: standard
          value: "var(--gray-900)"
        - section: dark
          value: "var(--gray-200)"

    - name: text-secondary
      value:
        - section: standard
          value: "var(--gray-600)"
        - section: dark
          value: "var(--gray-400)"

    - name: text-muted
      value:
        - section: standard
          value: "var(--gray-400)"
        - section: dark
          value: "var(--gray-500)"

    - name: text-inverse
      value:
        - section: standard
          value: "var(--white)"
        - section: dark
          value: "var(--gray-900)"

    - name: text-link
      value:
        - section: standard
          value: "#2563EB"
        - section: dark
          value: "#60A5FA"

    - name: border
      value:
        - section: standard
          value: "var(--gray-200)"
        - section: dark
          value: "#334155"

    - name: border-strong
      value:
        - section: standard
          value: "var(--gray-300)"
        - section: dark
          value: "var(--gray-600)"

    - name: shadow-color
      value:
        - section: standard
          value: "rgba(15,23,42,0.06)"
        - section: dark
          value: "rgba(0,0,0,0.3)"

    # ═══════════════════════════════════════
    # Dark mode: accent brightening
    # ═══════════════════════════════════════
    - name: blue
      value:
        - section: dark
          value: "#60A5FA"
    - name: blue-light
      value:
        - section: dark
          value: "color-mix(in srgb, #3B82F6 18%, var(--surface))"
    - name: blue-mid
      value:
        - section: dark
          value: "color-mix(in srgb, #3B82F6 30%, var(--surface))"

    - name: violet
      value:
        - section: dark
          value: "color-mix(in srgb, #8B5CF6 75%, white)"
    - name: violet-light
      value:
        - section: dark
          value: "color-mix(in srgb, #8B5CF6 18%, var(--surface))"
    - name: violet-mid
      value:
        - section: dark
          value: "color-mix(in srgb, #8B5CF6 30%, var(--surface))"

    # ═══════════════════════════════════════
    # Dark mode: palette color brightening
    # ═══════════════════════════════════════
    - name: rose
      value:
        - section: dark
          value: "color-mix(in srgb, #F43F5E 75%, white)"
    - name: rose-light
      value:
        - section: dark
          value: "color-mix(in srgb, #F43F5E 18%, var(--surface))"

    - name: emerald
      value:
        - section: dark
          value: "color-mix(in srgb, #10B981 75%, white)"
    - name: emerald-light
      value:
        - section: dark
          value: "color-mix(in srgb, #10B981 18%, var(--surface))"

    - name: amber
      value:
        - section: dark
          value: "color-mix(in srgb, #F59E0B 75%, white)"
    - name: amber-light
      value:
        - section: dark
          value: "color-mix(in srgb, #F59E0B 18%, var(--surface))"

    - name: cyan
      value:
        - section: dark
          value: "color-mix(in srgb, #06B6D4 75%, white)"
    - name: cyan-light
      value:
        - section: dark
          value: "color-mix(in srgb, #06B6D4 18%, var(--surface))"

    - name: indigo
      value:
        - section: dark
          value: "color-mix(in srgb, #6366F1 75%, white)"
    - name: indigo-light
      value:
        - section: dark
          value: "color-mix(in srgb, #6366F1 18%, var(--surface))"

    - name: teal
      value:
        - section: dark
          value: "color-mix(in srgb, #14B8A6 75%, white)"
    - name: teal-light
      value:
        - section: dark
          value: "color-mix(in srgb, #14B8A6 18%, var(--surface))"

    - name: orange
      value:
        - section: dark
          value: "color-mix(in srgb, #F97316 75%, white)"
    - name: orange-light
      value:
        - section: dark
          value: "color-mix(in srgb, #F97316 18%, var(--surface))"

    - name: sky
      value:
        - section: dark
          value: "color-mix(in srgb, #0EA5E9 75%, white)"
    - name: sky-light
      value:
        - section: dark
          value: "color-mix(in srgb, #0EA5E9 18%, var(--surface))"

    - name: lime
      value:
        - section: dark
          value: "color-mix(in srgb, #84CC16 75%, white)"
    - name: lime-light
      value:
        - section: dark
          value: "color-mix(in srgb, #84CC16 18%, var(--surface))"

    - name: pink
      value:
        - section: dark
          value: "color-mix(in srgb, #EC4899 75%, white)"
    - name: pink-light
      value:
        - section: dark
          value: "color-mix(in srgb, #EC4899 18%, var(--surface))"

    - name: purple
      value:
        - section: dark
          value: "color-mix(in srgb, #A855F7 75%, white)"
    - name: purple-light
      value:
        - section: dark
          value: "color-mix(in srgb, #A855F7 18%, var(--surface))"

    - name: fuchsia
      value:
        - section: dark
          value: "color-mix(in srgb, #D946EF 75%, white)"
    - name: fuchsia-light
      value:
        - section: dark
          value: "color-mix(in srgb, #D946EF 18%, var(--surface))"

    # ═══════════════════════════════════════
    # Dark mode: semantic state brightening
    # ═══════════════════════════════════════
    - name: success
      value:
        - section: dark
          value: "color-mix(in srgb, #10B981 75%, white)"
    - name: success-tint
      value:
        - section: dark
          value: "color-mix(in srgb, #10B981 18%, var(--surface))"

    - name: warning
      value:
        - section: dark
          value: "color-mix(in srgb, #F59E0B 75%, white)"
    - name: warning-tint
      value:
        - section: dark
          value: "color-mix(in srgb, #F59E0B 18%, var(--surface))"

    - name: error
      value:
        - section: dark
          value: "color-mix(in srgb, #EF4444 75%, white)"
    - name: error-tint
      value:
        - section: dark
          value: "color-mix(in srgb, #EF4444 18%, var(--surface))"

    - name: info
      value:
        - section: dark
          value: "color-mix(in srgb, #3B82F6 75%, white)"
    - name: info-tint
      value:
        - section: dark
          value: "color-mix(in srgb, #3B82F6 18%, var(--surface))"

    # ═══════════════════════════════════════
    # Dark mode: component overrides
    # ═══════════════════════════════════════
    - name: card-background
      value:
        - section: dark
          value: "var(--gray-800)"
    - name: card-border-color
      value:
        - section: dark
          value: "var(--gray-700)"
    - name: btn-background
      value:
        - section: dark
          value: "#2563EB"
    - name: btn-hover-background
      value:
        - section: dark
          value: "#3B82F6"

    # ═══════════════════════════════════════
    # Layout presets
    # ═══════════════════════════════════════
    - name: dashboard
      value:
        - section: layout
          values:
            max-width: "1440px"
            padding: "var(--space-3)"
            margin: "0 auto"
            content-bg: "var(--surface)"
      selector: ".content"
      selector-body: "max-width: var(--layout-dashboard-max-width); padding: var(--layout-dashboard-padding); margin: var(--layout-dashboard-margin); background: var(--layout-dashboard-content-bg)"

    - name: standard
      value:
        - section: layout
          values:
            max-width: "1200px"
            padding: "var(--space-4)"
            margin: "0 auto"
            content-bg: "var(--surface-alt)"
      selector: ".content.standard"
      selector-body: "max-width: var(--layout-standard-max-width); padding: var(--layout-standard-padding); margin: var(--layout-standard-margin); background: var(--layout-standard-content-bg)"

    - name: article
      value:
        - section: layout
          values:
            max-width: "72ch"
            padding: "var(--space-6)"
            margin: "0 auto"
            content-bg: "var(--surface-alt)"
      selector: ".content.article"
      selector-body: "max-width: var(--layout-article-max-width); padding: var(--layout-article-padding); margin: var(--layout-article-margin); background: var(--layout-article-content-bg)"

    - name: focus
      value:
        - section: layout
          values:
            max-width: "960px"
            padding: "var(--space-6)"
            margin: "0 auto"
            content-bg: "var(--surface)"
      selector: ".content.focus"
      selector-body: "max-width: var(--layout-focus-max-width); padding: var(--layout-focus-padding); margin: var(--layout-focus-margin); background: var(--layout-focus-content-bg)"

# ═══════════════════════════════════════════════════════════════
# SEMANTIC CLASSES — tobornalp
# ═══════════════════════════════════════════════════════════════
#
# Contextual modifier classes for status, priority, and feedback.
# Applied as CSS classes to cards, badges, borders, and indicators.
# ═══════════════════════════════════════════════════════════════

semantic-classes:
  # ── Feedback ──
  - name: danger
    class: danger
    group: Feedback
    title: Danger
    description: Critical error states requiring immediate attention
    note: "Failures, destructive actions, error states"
    accent-style: bottom-bar
    vars:
      accent: "var(--error)"
      background: "var(--error-tint)"
      color: "var(--error)"

  - name: success
    class: success
    group: Feedback
    title: Success
    description: Positive confirmation of completed actions
    note: "Task complete, deploy succeeded, check passed"
    accent-style: bottom-bar
    vars:
      accent: "var(--success)"
      background: "var(--success-tint)"
      color: "var(--success)"

  - name: warning
    class: warning
    group: Feedback
    title: Warning
    description: Cautionary messages about potential issues
    note: "Degraded state, approaching limits, needs attention"
    accent-style: bottom-bar
    vars:
      accent: "var(--warning)"
      background: "var(--warning-tint)"
      color: "var(--warning)"

  - name: info
    class: info
    group: Feedback
    title: Info
    description: Neutral informational context
    note: "Status updates, tips, contextual help"
    accent-style: bottom-bar
    vars:
      accent: "var(--info)"
      background: "var(--info-tint)"
      color: "var(--info)"

  # ── Priority ──
  - name: priority-critical
    class: priority-critical
    group: Priority
    title: Critical (P0)
    description: Highest priority — immediate action required
    note: "Production down, data loss risk, security incident"
    accent-style: left-bar
    vars:
      accent: "var(--error)"
      background: "var(--error-tint)"
      color: "var(--error)"
      font-weight: "var(--font-weight-bold)"

  - name: priority-high
    class: priority-high
    group: Priority
    title: High (P1)
    description: High priority — address within current sprint
    note: "Blocking issues, SLA breaches, key deliverables"
    accent-style: left-bar
    vars:
      accent: "var(--warning)"
      background: "var(--warning-tint)"
      color: "var(--warning)"
      font-weight: "var(--font-weight-semibold)"

  - name: priority-medium
    class: priority-medium
    group: Priority
    title: Medium (P2)
    description: Standard priority — normal queue order
    note: "Feature work, improvements, planned tasks"
    accent-style: left-bar
    vars:
      accent: "var(--blue)"
      background: "var(--blue-light)"
      color: "var(--blue)"

  - name: priority-low
    class: priority-low
    group: Priority
    title: Low (P3)
    description: Low priority — address when bandwidth allows
    note: "Nice-to-haves, minor polish, backlog grooming"
    accent-style: left-bar
    vars:
      accent: "var(--gray-400)"
      background: "rgba(148,163,184,0.1)"
      color: "var(--gray-400)"

  # ── Agent Status ──
  - name: agent-active
    class: agent-active
    group: Agent Status
    title: Agent Active
    description: Agent is online and responding to events
    note: "Monitoring, listening, ready to act"
    accent-style: left-bar
    vars:
      accent: "var(--emerald)"
      background: "var(--emerald-light)"
      color: "var(--emerald)"

  - name: agent-working
    class: agent-working
    group: Agent Status
    title: Agent Working
    description: Agent is actively executing a task
    note: "Processing, building, deploying, reviewing"
    accent-style: left-bar
    vars:
      accent: "var(--violet)"
      background: "var(--violet-light)"
      color: "var(--violet)"

  - name: agent-idle
    class: agent-idle
    group: Agent Status
    title: Agent Idle
    description: Agent is available but not actively working
    note: "Waiting for assignment, between tasks"
    accent-style: none
    vars:
      accent: "var(--gray-400)"
      background: "rgba(148,163,184,0.1)"
      color: "var(--gray-400)"

  # ── System State ──
  - name: state-healthy
    class: state-healthy
    group: System State
    title: Healthy
    description: System operating normally
    note: "All checks passing, within SLA"
    accent-style: bottom-bar
    vars:
      accent: "var(--success)"
      background: "var(--success-tint)"
      color: "var(--success)"

  - name: state-degraded
    class: state-degraded
    group: System State
    title: Degraded
    description: System operational but with reduced performance
    note: "Elevated latency, partial outage, approaching limits"
    accent-style: bottom-bar
    vars:
      accent: "var(--warning)"
      background: "var(--warning-tint)"
      color: "var(--warning)"

  - name: state-down
    class: state-down
    group: System State
    title: Down
    description: System is unavailable
    note: "Full outage, unreachable, failed health checks"
    accent-style: bottom-bar
    vars:
      accent: "var(--error)"
      background: "var(--error-tint)"
      color: "var(--error)"
      font-weight: "var(--font-weight-bold)"
      text-transform: "uppercase"

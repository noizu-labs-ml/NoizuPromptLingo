design-sections:
  - name: density
    title: Breathing Room & Information Architecture
    description: "How the platform balances information density with generous whitespace."
    icon: "⊞"
    components:
      - name: density-principle
        title: Breathing Room Serves Clarity
        principle: "Give every element space to exist -- generous margins, tall line-heights, and padding that lets the eye rest."
        approach: "15px base font, 16px gutters, 10px spacing unit. Cards, tables, and lists use comfortable spacing by default. Whitespace is intentional -- it is part of the design, not wasted space."
        rationale: "Dense layouts create cognitive load. Generous spacing creates calm. Users who manage their operational life need an interface that feels like a well-organized desk, not a crowded dashboard."
      - name: command-palette
        title: Command Palette
        principle: "The command palette is the universal entry point -- every action in the system reachable in 2 keystrokes."
        approach: "Cmd+K opens a filterable, fuzzy-searchable command list. Recent commands first, then global actions, then contextual. Results ranked by frequency and recency."
        rationale: "Keyboard-first users are our primary audience. The command palette is faster than any menu hierarchy and scales better than toolbars."

  - name: color-system
    title: Earth-Toned Color System
    description: "How color creates warmth and encodes meaning across the platform -- using natural earth tones."
    icon: "●"
    components:
      - name: color-principle
        title: Color Is Natural
        principle: "Colors are drawn from nature -- forest, earth, amber, sage. They encode meaning while maintaining organic warmth."
        approach: "Priority: P0=terracotta, P1=amber, P2=forest green, P3=warm gray. System state: healthy=forest green, degraded=amber, down=terracotta. Agent: active=forest green, working=warm brown, idle=warm gray."
        rationale: "Industrial color palettes create stress. Earth tones create calm while still carrying functional weight. Terracotta for danger feels urgent without feeling hostile."
      - name: agent-identity
        title: Agent Visual Identity
        principle: "AI agents are styled as peer team members -- same card structure, same status indicators, same typography as human content."
        approach: "Warm brown accent marks agent-generated output via left-border stripe or inline badge. No sparkles, no gradients, no 'AI glow'. Agent avatars use hexagon shape to differentiate from human circle avatars."
        rationale: "Agents that look like features get treated like features -- optional, ignorable. Agents that look like team members get treated as team members -- accountable, reliable."

  - name: dark-mode
    title: Light Mode First
    description: "Design philosophy for the platform's primary color mode -- born in daylight."
    icon: "◐"
    components:
      - name: dark-principle
        title: Light Mode Is Primary
        principle: "Organic warmth is born in daylight. Design light first -- cream backgrounds, earth tones, natural shadows. Dark mode is the cozy cabin at night."
        approach: "Warm cream (#FAF7F2) base, not pure white. Linen-textured surfaces create tactile depth. Earth-toned accents darken slightly for light-background contrast. Dark mode uses deep brown (#2C1810) -- not black -- with muted amber warmth."
        rationale: "Pure white is harsh and clinical. Warm cream feels like natural paper, handmade and intentional. The organic aesthetic is most authentic in daylight -- dark mode adapts, not leads."

  - name: keyboard-interaction
    title: Keyboard-First Interaction
    description: "Interaction model designed for power users who live on the keyboard."
    icon: "⌘"
    components:
      - name: keyboard-principle
        title: Every Action by Keyboard
        principle: "Every action reachable by keyboard. Mouse is the fallback, not the primary input."
        approach: "Global shortcuts (Cmd+K command palette, Cmd+/ help). Contextual shortcuts (j/k navigation, Enter to open, Escape to dismiss). Vim-style navigation in lists and tables. Focus management follows logical tab order."
        rationale: "Mouse interaction interrupts flow. Keyboard interaction maintains it. For users managing 50+ tasks daily, the efficiency gap compounds."

  - name: status-indicators
    title: Status Indicators
    description: "Badges, alerts, toasts, progress bars, and system status signals."
    icon: "◉"
    components:
      - name: badges
        title: Status Badges
        principle: "Compact, warmly-toned labels for priority, agent status, and system state."
        approach: "Semantic class system: danger/success/warning/info for feedback, priority-critical/high/medium/low for task priority, agent-active/working/idle for AI status, state-healthy/degraded/down for systems."
        rationale: "Badges are the primary visual language for status. They must be instantly scannable while maintaining the organic warmth of the theme."
      - name: alerts
        title: Inline Alerts
        principle: "Contextual messages that appear inline with content, not as modal interruptions."
        approach: "Accent-bar left or bottom with semantic background tint. Icon + message + optional action. Dismissible but not auto-dismissing for error states."
        rationale: "Modal alerts break flow. Inline alerts inform without interrupting."
      - name: toasts
        title: Toast Notifications
        principle: "Ephemeral feedback for completed actions -- confirm, then disappear."
        approach: "Top-right position, 8s duration, stacked with 20px gap. Success states are quiet (checkmark + text). Error states persist until dismissed."
        rationale: "Toasts confirm that an action worked without requiring the user to look for confirmation."
      - name: progress
        title: Progress Indicators
        principle: "Visible progress for any operation longer than 500ms."
        approach: "Linear progress bar for determinate operations, spinner for indeterminate. Step progress for multi-phase workflows. Always show percentage or step count."
        rationale: "Invisible progress creates anxiety. Visible progress creates trust."

  - name: custom-components
    title: Custom Components
    description: "Project-specific composite components built from the design system. The Badge is the T0 foundational atomic -- 9 components depend on it, 11 screens reference it."
    icon: "⬢"
    components:
      - name: badge
        title: Badge
        principle: "One component, every status context. The Badge is a semantic class consumer -- apply .badge for the shell, add a semantic class for the color."
        approach: "Base .badge provides structure: inline-flex, monospace font, comfortable padding (2px 10px), xs font size. Semantic classes (danger, success, priority-critical, agent-working, state-healthy, etc.) inject --accent, --background, --color via CSS custom properties. Variants: .badge-dot (prepend colored dot), .badge-pill (fully rounded), .badge-solid (filled), .badge-outline (border only), .badge-sm/.badge-lg (size), .badge-agent (agent-specific styling)."
        rationale: "The existing agent-badge, priority-dot, and status-pill snippets were three separate components doing variations of the same thing. A unified Badge with modifiers is more composable, more maintainable, and produces consistent visual weight across all status contexts. Usage: <span class='badge danger'>P0</span>, <span class='badge badge-dot agent-working'>PM Agent</span>, <span class='badge badge-pill state-healthy'>healthy</span>."
      - name: badge-priority
        title: "Badge: Priority Variants"
        principle: "Priority levels are color-coded badges with optional dot indicators."
        approach: "P0=danger (terracotta), P1=priority-high (amber), P2=priority-medium (forest green), P3=priority-low (warm gray). Add .badge-dot for the status dot prefix. The dot color inherits from the semantic class --accent. In dense lists, use .badge-sm for tighter spacing."
        rationale: "Priority is the most frequently scanned property in a task list. Badges must be distinguishable at a glance -- earth-toned color is the primary signal, text is the confirmation."
      - name: badge-agent
        title: "Badge: Agent Status"
        principle: "Agent status badges identify which agents are online, working, or idle."
        approach: "agent-active (forest green), agent-working (warm brown), agent-idle (warm gray). Add .badge-agent for monospace letter-spacing. Add .badge-dot for the status dot. In team views, badges appear next to agent avatars (hexagon shape) to show current state."
        rationale: "Agents are team members. Their status must be as visible as a human's online/offline indicator. The warm brown accent for 'working' distinguishes agent activity from human activity at a glance."
      - name: badge-system
        title: "Badge: System State"
        principle: "System health badges for monitoring dashboards and status pages."
        approach: "state-healthy (forest green), state-degraded (amber), state-down (terracotta). Use .badge-dot for the classic status dot pattern. In monitoring dashboards, badges appear in service lists and status grids."
        rationale: "System state is binary-ish: green/amber/red. The badge provides consistent encoding whether it appears in a sidebar, a table cell, or a status page."

  - name: forms
    title: Form Controls
    description: "Input fields, selectors, validation, and form layout patterns."
    icon: "☐"
    components:
      - name: inputs
        title: Input Fields
        principle: "Generous but readable inputs -- every field has room to breathe."
        approach: "36px height for standard inputs (matches 15px base + generous padding). Monospace for code/data inputs. Inline validation with semantic color. Labels above, not inline (prevents layout shift). Soft rounded corners (radius-md)."
        rationale: "Compact inputs feel cramped in an organic aesthetic. Generous input sizing with warm borders and soft shadows creates a tactile, paper-like feel."
      - name: selectors
        title: Selectors & Dropdowns
        principle: "Keyboard-navigable selectors with search for long lists."
        approach: "HeadlessUI Listbox for short lists, Combobox with search for 10+ items. Multi-select via checkboxes in dropdown. Selected values shown as compact pills with soft radius."
        rationale: "Power users manage hundreds of items. Scrolling through unsearchable dropdowns doesn't scale."

color-palette:
  - group: Brand
    description: "Earth-toned action palette. Forest green is primary action; warm brown marks grounded emphasis."
    notes:
      - label: Forest Green
        text: "Primary action -- buttons, links, focus rings, active states."
        cssClass: blue
      - label: Warm Brown
        text: "Grounding accent -- marks depth, emphasis, and editorial weight."
        cssClass: violet
    colors:
      - name: Forest Green
        value: "var(--blue)"
      - name: Forest Green Light
        value: "var(--blue-light)"
      - name: Forest Green Mid
        value: "var(--blue-mid)"
      - name: Warm Brown
        value: "var(--violet)"
      - name: Warm Brown Light
        value: "var(--violet-light)"
      - name: Warm Brown Mid
        value: "var(--violet-mid)"

  - group: Semantic Surfaces
    description: "Mode-aware surface and text colors -- cream/linen in light, deep brown in dark."
    colors:
      - name: Surface
        value: "var(--surface)"
      - name: Surface Alt
        value: "var(--surface-alt)"
      - name: Surface Inverse
        value: "var(--surface-inverse)"
      - name: Text
        value: "var(--text)"
      - name: Text Secondary
        value: "var(--text-secondary)"
      - name: Text Muted
        value: "var(--text-muted)"
      - name: Text Inverse
        value: "var(--text-inverse)"
      - name: Border
        value: "var(--border)"
      - name: Border Strong
        value: "var(--border-strong)"

  - group: Palette
    description: "Earth-toned utility colors for feature domains, tags, data visualization, and status coding."
    colors:
      - name: Rose
        value: "var(--rose)"
      - name: Rose Light
        value: "var(--rose-light)"
      - name: Emerald
        value: "var(--emerald)"
      - name: Emerald Light
        value: "var(--emerald-light)"
      - name: Cyan
        value: "var(--cyan)"
      - name: Cyan Light
        value: "var(--cyan-light)"
      - name: Amber
        value: "var(--amber)"
      - name: Amber Light
        value: "var(--amber-light)"
      - name: Indigo
        value: "var(--indigo)"
      - name: Indigo Light
        value: "var(--indigo-light)"
      - name: Teal
        value: "var(--teal)"
      - name: Teal Light
        value: "var(--teal-light)"
      - name: Orange
        value: "var(--orange)"
      - name: Orange Light
        value: "var(--orange-light)"
      - name: Sky
        value: "var(--sky)"
      - name: Sky Light
        value: "var(--sky-light)"
      - name: Lime
        value: "var(--lime)"
      - name: Lime Light
        value: "var(--lime-light)"
      - name: Pink
        value: "var(--pink)"
      - name: Pink Light
        value: "var(--pink-light)"
      - name: Purple
        value: "var(--purple)"
      - name: Purple Light
        value: "var(--purple-light)"
      - name: Fuchsia
        value: "var(--fuchsia)"
      - name: Fuchsia Light
        value: "var(--fuchsia-light)"

  - group: Gray
    description: "Warm-tinted neutrals -- earthy, natural tones. Foundation for all surfaces."
    colors:
      - name: White
        value: "var(--white)"
      - name: Gray 50
        value: "var(--gray-50)"
      - name: Gray 100
        value: "var(--gray-100)"
      - name: Gray 200
        value: "var(--gray-200)"
      - name: Gray 300
        value: "var(--gray-300)"
      - name: Gray 400
        value: "var(--gray-400)"
      - name: Gray 500
        value: "var(--gray-500)"
      - name: Gray 600
        value: "var(--gray-600)"
      - name: Gray 700
        value: "var(--gray-700)"
      - name: Gray 800
        value: "var(--gray-800)"
      - name: Gray 900
        value: "var(--gray-900)"
      - name: Black
        value: "var(--black)"

  - group: Semantic States
    description: "Functional state colors -- priority, health, and feedback with organic warmth."
    colors:
      - name: Success
        value: "var(--success)"
      - name: Success Tint
        value: "var(--success-tint)"
      - name: Warning
        value: "var(--warning)"
      - name: Warning Tint
        value: "var(--warning-tint)"
      - name: Error
        value: "var(--error)"
      - name: Error Tint
        value: "var(--error-tint)"
      - name: Info
        value: "var(--info)"
      - name: Info Tint
        value: "var(--info-tint)"
    notes:
      - label: Success
        text: "Healthy, complete, shipped, passed. Maps to forest green."
      - label: Warning
        text: "Attention needed, approaching limit, P1. Maps to amber."
      - label: Error
        text: "Broken, failed, critical, P0. Maps to terracotta."
      - label: Info
        text: "Informational, links, contextual help. Maps to sage green."

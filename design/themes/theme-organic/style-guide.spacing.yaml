spacing-contexts:
  grid:
    columns: 12
    gutter-token: col-gap
    margin-token: space-4

  page-container:
    max-width: "1440px"
    padding-x-token: space-4
    padding-y-token: space-3

  section-spacing:
    - role: "Major section gap"
      token: space-8
    - role: "Subsection gap"
      token: space-4
    - role: "Component gap"
      token: space-3
    - role: "Element gap"
      token: space-2

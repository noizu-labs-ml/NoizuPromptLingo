  font: "var(--font-display)"
  color: "var(--text)"
  html: '<div style="display:inline-flex;align-items:center;gap:10px"><svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="14" cy="14" r="12" stroke="var(--blue)" stroke-width="1.2"/><path d="M8 20 C10 10, 18 10, 20 20" stroke="var(--blue)" stroke-width="1" fill="none" opacity="0.5"/><circle cx="10" cy="12" r="2" fill="var(--blue)" opacity="0.4"/><circle cx="18" cy="11" r="2.5" fill="var(--blue)" opacity="0.3"/><circle cx="14" cy="16" r="1.5" fill="var(--blue)" opacity="0.5"/></svg><span style="font-family:var(--font-display);font-size:19px;font-weight:400;letter-spacing:0.01em;line-height:1;color:currentColor">tobornalp</span></div>'

intent: "Warm minimalism. The interface is a living surface — like handmade paper or a well-worn wooden desk. Every element breathes. The design language draws from wabi-sabi (beauty in imperfection), Scandinavian simplicity (function with warmth), and editorial typography (serifs that reward slow reading). Color is earth, not signal."

perception: "Calm and grounded. The kind of tool that feels like a greenhouse — structured but alive, functional but beautiful. Like opening a well-made notebook."

audience: "Thoughtful makers, writers, and planners who value craft over speed. People who use notebooks alongside digital tools, who prefer linen textures over glass effects, and who find beauty in restraint. They want an operational tool that doesn't feel industrial."

tone: "Considered and unhurried. Proper punctuation, occasional em-dashes. Success messages feel like quiet affirmations. Errors are gentle but clear. The interface speaks in the register of someone who values your time and attention equally."

keywords:
  - organic
  - warm
  - natural
  - wabi-sabi
  - editorial
  - grounded
  - breathing


shell-layouts:
  - name: app-shell
    title: App Shell
    description: "Primary application layout -- warm sidebar, soft top bar, generous content area with organic textures."
    chrome:
      navbar:
        height: "52px"
        background: "var(--gray-900)"
        color: "var(--gray-100)"
        label: "App Bar"
      sidebar:
        width: "260px"
        background: "var(--gray-800)"
        color: "var(--gray-200)"
        label: "Sidebar"
      footer:
        height: "32px"
        background: "var(--gray-100)"
        color: "var(--gray-500)"
        label: "Status Bar"
    zones:
      - label: "Command Bar"
        background: "var(--surface)"
        ratio: 1
      - label: "Content"
        background: "var(--surface)"
        ratio: 4
      - label: "Detail Panel"
        background: "var(--surface-alt)"
        ratio: 2

  - name: focus-shell
    title: Focus Mode
    description: "Distraction-free layout -- no sidebar, minimal chrome. For deep work, writing, and reflection."
    chrome:
      navbar:
        height: "52px"
        background: "var(--surface-alt)"
        color: "var(--text)"
        label: "Nav"
    zones:
      - label: "Content"
        background: "var(--surface)"
        ratio: 1

  - name: editor
    title: Editor
    description: "Three-panel layout for code editing, wiki writing, and agent prompt authoring."
    chrome:
      navbar:
        height: "44px"
        background: "var(--gray-900)"
        color: "var(--gray-100)"
        label: "Toolbar"
      sidebar:
        width: "240px"
        background: "var(--gray-800)"
        color: "var(--gray-300)"
        label: "Files"
      aside:
        width: "280px"
        background: "var(--gray-800)"
        color: "var(--gray-300)"
        label: "Inspector"
    zones:
      - label: "Editor"
        background: "var(--gray-900)"
        color: "var(--gray-100)"
        ratio: 1

  - name: document
    title: Document Reader
    description: "Long-form reading layout for wiki pages and documentation -- constrained width, generous margins, sticky TOC."
    chrome:
      navbar:
        height: "52px"
        background: "var(--surface-alt)"
        color: "var(--text)"
        label: "Nav"
      sidebar:
        width: "220px"
        background: "var(--surface-alt)"
        color: "var(--text-secondary)"
        label: "TOC"
    zones:
      - label: "Article"
        background: "var(--surface)"
        ratio: 1

  STATUS: Draft
  Accent: Spectral Violet #8B5CF6
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 60" width="400" height="60">
  <title>SafeMCP</title>
  <desc>SafeMCP sub-product lockup — security control plane</desc>

  <!-- Platform mark (small, 40x40) -->
  <g transform="translate(4, 10) scale(0.167)">
    <path d="M 120 20 L 200 60 L 200 140 Q 200 190 120 220 Q 40 190 40 140 L 40 60 Z" fill="#3B82F6"/>
    <path d="M 120 44 L 180 74 L 180 138 Q 180 178 120 202 Q 60 178 60 138 L 60 74 Z" fill="#FFFFFF"/>
    <circle cx="120" cy="72" r="16" fill="#3B82F6"/>
    <circle cx="82" cy="148" r="16" fill="#3B82F6"/>
    <circle cx="158" cy="148" r="16" fill="#3B82F6"/>
    <line x1="120" y1="72" x2="82" y2="148" stroke="#3B82F6" stroke-width="6" stroke-linecap="round"/>
    <line x1="120" y1="72" x2="158" y2="148" stroke="#3B82F6" stroke-width="6" stroke-linecap="round"/>
    <line x1="82" y1="148" x2="158" y2="148" stroke="#3B82F6" stroke-width="6" stroke-linecap="round"/>
    <circle cx="120" cy="122" r="10" fill="#FFFFFF"/>
    <circle cx="120" cy="122" r="6" fill="#3B82F6"/>
  </g>

  <!-- Violet lock icon -->
  <g transform="translate(52, 16)">
    <!-- Lock body -->
    <rect x="0" y="12" width="18" height="14" rx="2" fill="#8B5CF6"/>
    <!-- Lock shackle -->
    <path d="M 4 12 L 4 8 Q 4 2 9 2 Q 14 2 14 8 L 14 12" fill="none" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Keyhole -->
    <circle cx="9" cy="20" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Wordmark -->
  <text x="78" y="40" font-family="Geist, Inter, system-ui, sans-serif" font-size="26" font-weight="500" fill="#171717" letter-spacing="-0.01em">
    <tspan fill="#8B5CF6">Safe</tspan><tspan>MCP</tspan>
  </text>
</svg>

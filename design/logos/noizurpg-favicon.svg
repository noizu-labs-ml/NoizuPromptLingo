<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 32 32" width="32" height="32">

  <!-- Dark background for favicon visibility -->
  <rect width="32" height="32" rx="7" fill="#171720"/>

  <!-- Simplified hex cube — max 3 shapes -->
  <!-- Top face -->
  <polygon points="7,11 16,6 25,11 16,16" fill="#A78BFA"/>
  <!-- Left face -->
  <polygon points="7,11 16,16 16,26 7,21" fill="#7C5CFC"/>
  <!-- Right face -->
  <polygon points="16,16 25,11 25,21 16,26" fill="#5B35D5"/>

</svg>

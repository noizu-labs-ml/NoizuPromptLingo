<?xml version="1.0" encoding="UTF-8"?>
<!--
  MCP Host — Platform Logomark (Reversed / Dark Background)
  VERSION: 1.0
  DATE: 2026-05-12
  STATUS: Draft
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <title>MCP Host</title>
  <desc>MCP Host platform logomark — reversed variant for dark backgrounds</desc>

  <!-- Shield body -->
  <path d="
    M 120 20
    L 200 60
    L 200 140
    Q 200 190 120 220
    Q 40 190 40 140
    L 40 60
    Z
  " fill="#FFFFFF" stroke="none"/>

  <!-- Inner negative space -->
  <path d="
    M 120 44
    L 180 74
    L 180 138
    Q 180 178 120 202
    Q 60 178 60 138
    L 60 74
    Z
  " fill="#0C0C10" stroke="none"/>

  <!-- Three interconnected nodes -->
  <circle cx="120" cy="72" r="16" fill="#FFFFFF"/>
  <circle cx="82" cy="148" r="16" fill="#FFFFFF"/>
  <circle cx="158" cy="148" r="16" fill="#FFFFFF"/>

  <!-- Connection lines -->
  <line x1="120" y1="72" x2="82" y2="148" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <line x1="120" y1="72" x2="158" y2="148" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <line x1="82" y1="148" x2="158" y2="148" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>

  <!-- Center node -->
  <circle cx="120" cy="122" r="10" fill="#0C0C10"/>
  <circle cx="120" cy="122" r="6" fill="#FFFFFF"/>
</svg>

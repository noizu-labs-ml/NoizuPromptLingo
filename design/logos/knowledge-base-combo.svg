<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 460 120" width="460" height="120"
     role="img" aria-labelledby="kb-combo-title kb-combo-desc">

  <title id="kb-combo-title">Knowledge Base</title>
  <desc id="kb-combo-desc">Knowledge Base logo: an open book with three interconnected graph nodes, followed by the product name in serif typography</desc>

  <!-- === LOGOMARK (scaled to ~88px tall, centered in 120px height) === -->
  <g transform="translate(16, 16) scale(0.44)">

    <!-- Left page -->
    <path d="M 98,88 L 32,80 L 32,164 L 98,164 Z" fill="#1A1A1A"/>

    <!-- Right page -->
    <path d="M 102,88 L 168,80 L 168,164 L 102,164 Z" fill="#252118"/>

    <!-- Spine accent -->
    <line x1="100" y1="78" x2="100" y2="166"
          stroke="#8B4513" stroke-width="5.7" stroke-linecap="round"/>

    <!-- Connections -->
    <line x1="55" y1="52" x2="100" y2="28"
          stroke="#8B4513" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="145" y1="52" x2="100" y2="28"
          stroke="#8B4513" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="55" y1="52" x2="145" y2="52"
          stroke="#8B4513" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Nodes -->
    <circle cx="55" cy="52" r="16" fill="#8B4513"/>
    <circle cx="100" cy="28" r="16" fill="#8B4513"/>
    <circle cx="145" cy="52" r="16" fill="#8B4513"/>

  </g>

  <!-- === LOGOTYPE === -->
  <!--
    DEVELOPMENT VERSION: Uses live text for easy iteration.
    PRODUCTION: Convert to <path> elements using:
      inkscape input.svg - -export-text-to-path - -export-filename=output.svg
    Then verify at all target sizes.
  -->

  <!-- "KNOWLEDGE" — primary word -->
  <text x="128" y="52"
        font-family="'Lora', 'Georgia', 'Times New Roman', serif"
        font-size="30" font-weight="700"
        letter-spacing="2" fill="#1A1A1A">
    KNOWLEDGE
  </text>

  <!-- "BASE" — secondary word, wider tracking -->
  <text x="129" y="80"
        font-family="'Lora', 'Georgia', 'Times New Roman', serif"
        font-size="16" font-weight="400"
        letter-spacing="7" fill="#6B6560">
    BASE
  </text>

</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-labelledby="trl-mark-mono-title trl-mark-mono-desc">

  <title id="trl-mark-mono-title">TheRobotLives</title>
  <desc id="trl-mark-mono-desc">A geometric robot head — single color version</desc>

  <!-- Antenna tip -->
  <circle cx="100" cy="28" r="7" fill="#1A1726"/>

  <!-- Antenna stem -->
  <rect x="96" y="35" width="8" height="20" rx="2" fill="#1A1726"/>

  <!-- Head -->
  <rect x="35" y="50" width="130" height="120" rx="24" fill="#1A1726"/>

  <!-- Eyes as negative space -->
  <circle cx="70" cy="98" r="14" fill="#FFFFFF"/>
  <circle cx="130" cy="98" r="14" fill="#FFFFFF"/>

</svg>

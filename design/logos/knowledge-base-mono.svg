<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-labelledby="kb-mono-title kb-mono-desc">

  <title id="kb-mono-title">Knowledge Base</title>
  <desc id="kb-mono-desc">Knowledge Base logo mark in single-color black, for print and monochrome contexts</desc>

  <!-- === BOOK === -->

  <!-- Left page -->
  <path d="M 98,88 L 32,80 L 32,164 L 98,164 Z" fill="#000000"/>

  <!-- Right page -->
  <path d="M 102,88 L 168,80 L 168,164 L 102,164 Z" fill="#000000" opacity="0.8"/>

  <!-- Spine -->
  <line x1="100" y1="78" x2="100" y2="166"
        stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>

  <!-- === KNOWLEDGE GRAPH === -->

  <!-- Connections -->
  <line x1="55" y1="52" x2="100" y2="28"
        stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="145" y1="52" x2="100" y2="28"
        stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  <line x1="55" y1="52" x2="145" y2="52"
        stroke="#000000" stroke-width="2" stroke-linecap="round"/>

  <!-- Nodes -->
  <circle cx="55" cy="52" r="7" fill="#000000"/>
  <circle cx="100" cy="28" r="7" fill="#000000"/>
  <circle cx="145" cy="52" r="7" fill="#000000"/>

</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-labelledby="kb-rev-title kb-rev-desc">

  <title id="kb-rev-title">Knowledge Base</title>
  <desc id="kb-rev-desc">Knowledge Base logo mark in white, for use on dark backgrounds</desc>

  <!-- === BOOK === -->

  <!-- Left page -->
  <path d="M 98,88 L 32,80 L 32,164 L 98,164 Z" fill="#FFFFFF"/>

  <!-- Right page (slight transparency for depth) -->
  <path d="M 102,88 L 168,80 L 168,164 L 102,164 Z" fill="#E8E2D9"/>

  <!-- Spine accent -->
  <line x1="100" y1="78" x2="100" y2="166"
        stroke="#C4956A" stroke-width="2.5" stroke-linecap="round"/>

  <!-- === KNOWLEDGE GRAPH === -->

  <!-- Connections -->
  <line x1="55" y1="52" x2="100" y2="28"
        stroke="#C4956A" stroke-width="2" stroke-linecap="round"/>
  <line x1="145" y1="52" x2="100" y2="28"
        stroke="#C4956A" stroke-width="2" stroke-linecap="round"/>
  <line x1="55" y1="52" x2="145" y2="52"
        stroke="#C4956A" stroke-width="2" stroke-linecap="round"/>

  <!-- Nodes -->
  <circle cx="55" cy="52" r="7" fill="#C4956A"/>
  <circle cx="100" cy="28" r="7" fill="#C4956A"/>
  <circle cx="145" cy="52" r="7" fill="#C4956A"/>

</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-labelledby="mono-black-title mono-black-desc">

  <title id="mono-black-title">NoizuRPG</title>
  <desc id="mono-black-desc">NoizuRPG logomark in monochrome black — three tones preserve the isometric cube structure</desc>

  <!-- Top face — lightest gray -->
  <polygon points="39,65 100,30 161,65 100,100" fill="#555555"/>
  <!-- Left face — darkest -->
  <polygon points="39,65 100,100 100,170 39,135" fill="#000000"/>
  <!-- Right face — medium -->
  <polygon points="100,100 161,65 161,135 100,170" fill="#2A2A2A"/>

</svg>

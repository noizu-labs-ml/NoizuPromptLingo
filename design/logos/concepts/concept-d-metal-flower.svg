<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-labelledby="concept-d-title concept-d-desc">

  <title id="concept-d-title">TheRobotLives — Metal Flower</title>
  <desc id="concept-d-desc">A stylized flower with chrome-metallic petals and a bioluminescent core — a machine that has bloomed into life</desc>

  <defs>
    <!-- Metallic petal gradients — each petal catches light differently -->
    <linearGradient id="petal-1" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#C8CDD8"/>
      <stop offset="35%" stop-color="#E8EAF0"/>
      <stop offset="50%" stop-color="#A0A8B8"/>
      <stop offset="75%" stop-color="#6B7388"/>
      <stop offset="100%" stop-color="#3A4058"/>
    </linearGradient>
    <linearGradient id="petal-2" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#B8BDC8"/>
      <stop offset="30%" stop-color="#DDE0E8"/>
      <stop offset="55%" stop-color="#8890A0"/>
      <stop offset="80%" stop-color="#5A6278"/>
      <stop offset="100%" stop-color="#2E3448"/>
    </linearGradient>
    <linearGradient id="petal-3" x1="70%" y1="0%" x2="30%" y2="100%">
      <stop offset="0%" stop-color="#D0D4DE"/>
      <stop offset="40%" stop-color="#F0F1F5"/>
      <stop offset="60%" stop-color="#959DAD"/>
      <stop offset="85%" stop-color="#505870"/>
      <stop offset="100%" stop-color="#282E40"/>
    </linearGradient>

    <!-- Bio-luminescent center glow -->
    <radialGradient id="bio-core" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#4AEDC4" stop-opacity="1"/>
      <stop offset="50%" stop-color="#4AEDC4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7B61FF" stop-opacity="0.2"/>
    </radialGradient>

    <!-- Outer ambient glow -->
    <radialGradient id="ambient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4AEDC4" stop-opacity="0"/>
      <stop offset="70%" stop-color="#4AEDC4" stop-opacity="0"/>
      <stop offset="100%" stop-color="#4AEDC4" stop-opacity="0.06"/>
    </radialGradient>
  </defs>

  <!-- Ambient glow behind the whole flower -->
  <circle cx="100" cy="100" r="95" fill="url(#ambient)"/>

  <!--
    Six petals arranged radially.
    Each petal is a rounded path — slightly geometric edges
    to suggest fabrication, but curved enough to feel organic.
    The petals taper to points and widen toward the center.
  -->

  <!-- Petal 1 — top -->
  <path d="
    M 100,18
    C 108,28 116,45 114,62
    C 112,72 108,80 100,82
    C 92,80 88,72 86,62
    C 84,45 92,28 100,18
    Z
  " fill="url(#petal-1)" opacity="0.95"/>

  <!-- Petal 2 — top right -->
  <path d="
    M 100,18
    C 108,28 116,45 114,62
    C 112,72 108,80 100,82
    C 92,80 88,72 86,62
    C 84,45 92,28 100,18
    Z
  " fill="url(#petal-2)" opacity="0.9"
     transform="rotate(60, 100, 100)"/>

  <!-- Petal 3 — bottom right -->
  <path d="
    M 100,18
    C 108,28 116,45 114,62
    C 112,72 108,80 100,82
    C 92,80 88,72 86,62
    C 84,45 92,28 100,18
    Z
  " fill="url(#petal-3)" opacity="0.9"
     transform="rotate(120, 100, 100)"/>

  <!-- Petal 4 — bottom -->
  <path d="
    M 100,18
    C 108,28 116,45 114,62
    C 112,72 108,80 100,82
    C 92,80 88,72 86,62
    C 84,45 92,28 100,18
    Z
  " fill="url(#petal-1)" opacity="0.85"
     transform="rotate(180, 100, 100)"/>

  <!-- Petal 5 — bottom left -->
  <path d="
    M 100,18
    C 108,28 116,45 114,62
    C 112,72 108,80 100,82
    C 92,80 88,72 86,62
    C 84,45 92,28 100,18
    Z
  " fill="url(#petal-2)" opacity="0.85"
     transform="rotate(240, 100, 100)"/>

  <!-- Petal 6 — top left -->
  <path d="
    M 100,18
    C 108,28 116,45 114,62
    C 112,72 108,80 100,82
    C 92,80 88,72 86,62
    C 84,45 92,28 100,18
    Z
  " fill="url(#petal-3)" opacity="0.88"
     transform="rotate(300, 100, 100)"/>

  <!-- Inner ring — stamens, metallic -->
  <circle cx="100" cy="100" r="18" fill="none"
          stroke="#8890A0" stroke-width="1.5" opacity="0.5"/>

  <!-- Core glow — the life inside the machine -->
  <circle cx="100" cy="100" r="14" fill="url(#bio-core)"/>

  <!-- Core highlight — bright center pip -->
  <circle cx="100" cy="97" r="5" fill="#4AEDC4" opacity="0.9"/>

  <!-- Tiny specular highlight on core -->
  <circle cx="98" cy="95" r="2" fill="#FFFFFF" opacity="0.7"/>

</svg>

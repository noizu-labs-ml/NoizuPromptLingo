<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-labelledby="concept-a-title concept-a-desc">

  <title id="concept-a-title">TheRobotLives — Living Node</title>
  <desc id="concept-a-desc">A bioluminescent node: concentric rings emanating from a central glowing core, like a deep-sea organism pulsing light</desc>

  <defs>
    <!-- Radial glow for the core -->
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4AEDC4" stop-opacity="1"/>
      <stop offset="60%" stop-color="#4AEDC4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4AEDC4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outermost ring — barely visible, like a ripple fading -->
  <circle cx="100" cy="100" r="78" fill="none"
          stroke="#4AEDC4" stroke-width="1.5" stroke-opacity="0.12"/>

  <!-- Third ring -->
  <circle cx="100" cy="100" r="62" fill="none"
          stroke="#4AEDC4" stroke-width="2" stroke-opacity="0.25"/>

  <!-- Second ring — neural purple blended in -->
  <circle cx="100" cy="100" r="45" fill="none"
          stroke="#7B61FF" stroke-width="2.5" stroke-opacity="0.35"/>

  <!-- Inner ring — strong bio -->
  <circle cx="100" cy="100" r="28" fill="none"
          stroke="#4AEDC4" stroke-width="3" stroke-opacity="0.7"/>

  <!-- Core glow halo -->
  <circle cx="100" cy="100" r="18" fill="url(#core-glow)"/>

  <!-- Core — solid, bright, alive -->
  <circle cx="100" cy="100" r="10" fill="#4AEDC4"/>

</svg>

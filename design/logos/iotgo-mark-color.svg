<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-labelledby="iotgo-mark-title iotgo-mark-desc">

  <title id="iotgo-mark-title">IoTGo</title>
  <desc id="iotgo-mark-desc">A teal ring containing a forward-pointing arrow, representing the closed-loop autonomous IoT agent</desc>

  <!-- Ring (observation loop) — evenodd creates transparent center -->
  <path fill-rule="evenodd"
        d="M 100,28 A 72,72 0 1,1 99.999,28 Z
           M 100,50 A 50,50 0 1,0 99.999,50 Z"
        fill="#14B8A6"/>

  <!-- Forward arrow (Go/action) — tip merges with ring at right edge -->
  <polygon points="82,66 82,134 152,100" fill="#14B8A6"/>

</svg>

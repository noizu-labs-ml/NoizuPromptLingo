<?xml version="1.0" encoding="UTF-8"?>
<!--
  MCP Host — Platform Logomark
  VERSION: 1.0
  DATE: 2026-05-12
  AUTHOR: Design System
  STATUS: Draft

  Concept: Abstract shield form composed of three interlocking nodes
  representing the M-C-P initials as a connectivity + security mark.
  Built on 24x24 grid. Reads as monochrome silhouette at 16px.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <title>MCP Host</title>
  <desc>MCP Host platform logomark — abstract shield with interlocking protocol nodes</desc>

  <!-- Construction grid (hidden in production) -->
  <g id="construction-grid" display="none" stroke="#E5E5E5" stroke-width="0.5" fill="none">
    <rect x="0" y="0" width="240" height="240"/>
    <line x1="120" y1="0" x2="120" y2="240"/>
    <line x1="0" y1="120" x2="240" y2="120"/>
    <circle cx="120" cy="120" r="100"/>
  </g>

  <!-- Shield body — abstract geometric form -->
  <!-- Outer shield silhouette: pointed base, broad shoulders -->
  <path d="
    M 120 20
    L 200 60
    L 200 140
    Q 200 190 120 220
    Q 40 190 40 140
    L 40 60
    Z
  " fill="#3B82F6" stroke="none"/>

  <!-- Inner negative space — creates the "protocol channel" -->
  <path d="
    M 120 44
    L 180 74
    L 180 138
    Q 180 178 120 202
    Q 60 178 60 138
    L 60 74
    Z
  " fill="#FFFFFF" stroke="none"/>

  <!-- Three interconnected nodes forming M-C-P abstraction -->
  <!-- Top node (M) — apex of shield -->
  <circle cx="120" cy="72" r="16" fill="#3B82F6"/>
  <!-- Bottom-left node (C) -->
  <circle cx="82" cy="148" r="16" fill="#3B82F6"/>
  <!-- Bottom-right node (P) -->
  <circle cx="158" cy="148" r="16" fill="#3B82F6"/>

  <!-- Connection lines between nodes -->
  <line x1="120" y1="72" x2="82" y2="148" stroke="#3B82F6" stroke-width="6" stroke-linecap="round"/>
  <line x1="120" y1="72" x2="158" y2="148" stroke="#3B82F6" stroke-width="6" stroke-linecap="round"/>
  <line x1="82" y1="148" x2="158" y2="148" stroke="#3B82F6" stroke-width="6" stroke-linecap="round"/>

  <!-- Center node — intersection point, slightly smaller -->
  <circle cx="120" cy="122" r="10" fill="#FFFFFF"/>
  <circle cx="120" cy="122" r="6" fill="#3B82F6"/>
</svg>

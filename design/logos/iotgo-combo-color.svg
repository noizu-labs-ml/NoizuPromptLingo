<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 440 120" width="440" height="120"
     role="img" aria-labelledby="iotgo-combo-title">

  <title id="iotgo-combo-title">IoTGo — Autonomous AI agents for IoT fleet management</title>

  <!--
    DEVELOPMENT VERSION — text elements require Inter font.
    For production: convert all text to paths using:
      inkscape input.svg - -export-text-to-path - -export-filename=output.svg
  -->

  <defs>
    <symbol id="mark" viewBox="0 0 200 200">
      <path fill-rule="evenodd"
            d="M 100,28 A 72,72 0 1,1 99.999,28 Z
               M 100,50 A 50,50 0 1,0 99.999,50 Z"
            fill="currentColor"/>
      <polygon points="82,66 82,134 152,100" fill="currentColor"/>
    </symbol>
  </defs>

  <!-- Logomark -->
  <use href="#mark" x="12" y="12" width="96" height="96" color="#14B8A6"/>

  <!-- Logotype — two-tone: "IoT" dark + "Go" teal -->
  <text x="128" y="73"
        font-family="Inter, 'Geist', system-ui, -apple-system, sans-serif"
        font-size="52" font-weight="700"
        letter-spacing="-1.5" fill="#0F172A">
    IoT<tspan fill="#14B8A6">Go</tspan>
  </text>

</svg>

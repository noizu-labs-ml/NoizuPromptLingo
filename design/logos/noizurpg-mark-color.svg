<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-labelledby="mark-title mark-desc">

  <title id="mark-title">NoizuRPG</title>
  <desc id="mark-desc">Isometric hexagonal cube in three shades of purple, representing composable building blocks for AI-powered RPGs</desc>

  <!-- Top face — lightest -->
  <polygon points="39,65 100,30 161,65 100,100" fill="#A78BFA"/>
  <!-- Left face — medium -->
  <polygon points="39,65 100,100 100,170 39,135" fill="#7C5CFC"/>
  <!-- Right face — darkest -->
  <polygon points="100,100 161,65 161,135 100,170" fill="#5B35D5"/>

</svg>

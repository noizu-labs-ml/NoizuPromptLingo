<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robots Unite — Logo Preview</title>
  <link rel="icon" type="image/svg+xml" href="robots-unite-favicon.svg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Inter, system-ui, sans-serif; background: #F5F5F5; color: #171717; }
    h1 { font-size: 14px; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; color: #525252; padding: 40px 40px 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; padding: 0 40px 40px; }
    .card { background: #fff; border-radius: 12px; padding: 32px; border: 1px solid #E5E5E5; }
    .card.dark { background: #0A0A0A; border-color: #262626; }
    .card h2 { font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 20px; color: #A3A3A3; }
    .card.dark h2 { color: #525252; }
    .card img, .card svg { display: block; margin: 0 auto; }
    .size-row { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
    .size-row span { font-size: 11px; color: #A3A3A3; }
    hr { border: none; border-top: 1px solid #E5E5E5; margin: 40px; }
  </style>
</head>
<body>

  <h1>Robots Unite — Logo System</h1>

  <div class="grid">

    <!-- Logomark on light -->
    <div class="card">
      <h2>Logomark — Light</h2>
      <img src="robots-unite-mark.svg" alt="Robots Unite logomark" width="160" height="160">
    </div>

    <!-- Logomark on dark -->
    <div class="card dark">
      <h2>Logomark — Dark (Reversed)</h2>
      <img src="robots-unite-mark-reversed.svg" alt="Robots Unite logomark reversed" width="160" height="160">
    </div>

    <!-- Combo mark -->
    <div class="card" style="grid-column: 1 / -1;">
      <h2>Combo Mark — Horizontal</h2>
      <img src="robots-unite-logo.svg" alt="Robots Unite logo" width="420" height="120">
    </div>

    <!-- Favicon -->
    <div class="card">
      <h2>Favicon / App Icon</h2>
      <div class="size-row">
        <div>
          <img src="robots-unite-favicon.svg" alt="Favicon 16px" width="16" height="16">
          <span>16px</span>
        </div>
        <div>
          <img src="robots-unite-favicon.svg" alt="Favicon 32px" width="32" height="32">
          <span>32px</span>
        </div>
        <div>
          <img src="robots-unite-favicon.svg" alt="Favicon 64px" width="64" height="64">
          <span>64px</span>
        </div>
        <div>
          <img src="robots-unite-favicon.svg" alt="Favicon 128px" width="128" height="128">
          <span>128px</span>
        </div>
      </div>
    </div>

    <!-- Size test on light -->
    <div class="card">
      <h2>Scale Test — Logomark</h2>
      <div class="size-row">
        <div>
          <img src="robots-unite-mark.svg" alt="Mark 32px" width="32" height="32">
          <span>32px</span>
        </div>
        <div>
          <img src="robots-unite-mark.svg" alt="Mark 64px" width="64" height="64">
          <span>64px</span>
        </div>
        <div>
          <img src="robots-unite-mark.svg" alt="Mark 120px" width="120" height="120">
          <span>120px</span>
        </div>
        <div>
          <img src="robots-unite-mark.svg" alt="Mark 200px" width="200" height="200">
          <span>200px</span>
        </div>
      </div>
    </div>

  </div>

  <hr>

  <div style="padding: 0 40px 60px;">
    <h2 style="font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: #A3A3A3; margin-bottom: 16px;">Color Palette</h2>
    <div style="display: flex; gap: 12px; flex-wrap: wrap;">
      <div style="width: 80px;">
        <div style="width: 80px; height: 80px; background: #171717; border-radius: 8px; border: 1px solid #E5E5E5;"></div>
        <div style="font-size: 11px; color: #525252; margin-top: 6px;">#171717<br>Primary</div>
      </div>
      <div style="width: 80px;">
        <div style="width: 80px; height: 80px; background: #F97316; border-radius: 8px;"></div>
        <div style="font-size: 11px; color: #525252; margin-top: 6px;">#F97316<br>Accent</div>
      </div>
      <div style="width: 80px;">
        <div style="width: 80px; height: 80px; background: #525252; border-radius: 8px;"></div>
        <div style="font-size: 11px; color: #525252; margin-top: 6px;">#525252<br>Secondary</div>
      </div>
      <div style="width: 80px;">
        <div style="width: 80px; height: 80px; background: #FAFAFA; border-radius: 8px; border: 1px solid #E5E5E5;"></div>
        <div style="font-size: 11px; color: #525252; margin-top: 6px;">#FAFAFA<br>Background</div>
      </div>
      <div style="width: 80px;">
        <div style="width: 80px; height: 80px; background: #FB923C; border-radius: 8px;"></div>
        <div style="font-size: 11px; color: #525252; margin-top: 6px;">#FB923C<br>Accent Dark</div>
      </div>
    </div>
  </div>

</body>
</html>

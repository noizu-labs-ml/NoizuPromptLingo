<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 32 32" width="32" height="32">

  <!--
    Favicon variant — simplified for 16-32px rendering.
    Bars thickened to 5px wide (vs 16px in 200px mark) for legibility.
    Solid coral background ensures visibility on any browser chrome color.
    Corner radius matches iOS/Android icon rounding conventions.
  -->

  <rect width="32" height="32" rx="7" fill="#E8704A"/>

  <g transform="translate(16,16)" fill="#FFFFFF">
    <rect x="-2.5" y="-10" width="5" height="20" rx="2.5"/>
    <rect x="-2.5" y="-10" width="5" height="20" rx="2.5" transform="rotate(60)"/>
    <rect x="-2.5" y="-10" width="5" height="20" rx="2.5" transform="rotate(120)"/>
  </g>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="ui-sans-serif, system-ui, sans-serif">

  <!--
    VERSION: 1.0
    DATE: 2026-05-12
    STATUS: Draft
    PAGE: SafeMCP Policy Editor — /policies/new
    PALETTE:
      bg          #F8F8F8
      surface     #FFFFFF
      border      #D4D4D4
      text-primary  #171717
      text-secondary #737373
      placeholder #A3A3A3
      interactive #3B82F6
      success     #22C55E
      error       #EF4444
      warning     #EAB308
  -->

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- PAGE BACKGROUND                                         -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect width="1440" height="900" fill="#F8F8F8"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- 1. GLOBAL NAV  y:0  h:64                               -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="0" y="0" width="1440" height="64" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>

  <!-- Logo mark -->
  <rect x="24" y="16" width="28" height="28" rx="6" fill="#3B82F6"/>
  <text x="38" y="35" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">S</text>

  <!-- Logo text -->
  <text x="60" y="35" fill="#171717" font-size="15" font-weight="700">SafeMCP</text>

  <!-- Platform switcher nav -->
  <!-- Dashboard -->
  <text x="160" y="36" fill="#737373" font-size="13" font-weight="500">Dashboard</text>
  <!-- Servers -->
  <text x="248" y="36" fill="#737373" font-size="13" font-weight="500">Servers</text>
  <!-- Policies — active with underline -->
  <text x="318" y="36" fill="#3B82F6" font-size="13" font-weight="600">Policies</text>
  <line x1="318" y1="58" x2="362" y2="58" stroke="#3B82F6" stroke-width="2"/>
  <!-- Callers -->
  <text x="380" y="36" fill="#737373" font-size="13" font-weight="500">Callers</text>
  <!-- Audit Log -->
  <text x="438" y="36" fill="#737373" font-size="13" font-weight="500">Audit Log</text>

  <!-- Right nav: avatar + org label -->
  <rect x="1348" y="14" width="32" height="32" rx="16" fill="#D4D4D4"/>
  <text x="1364" y="35" fill="#737373" font-size="11" font-weight="600" text-anchor="middle">KB</text>
  <text x="1310" y="35" fill="#737373" font-size="13" text-anchor="end">keith@noizu.com</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- 2. PAGE HEADER  y:64  h:56                             -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="0" y="64" width="1440" height="56" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>

  <!-- Breadcrumb -->
  <text x="32" y="97" fill="#737373" font-size="13">Policies</text>
  <text x="90" y="97" fill="#A3A3A3" font-size="13">/</text>
  <text x="102" y="97" fill="#171717" font-size="13" font-weight="600">New Policy</text>

  <!-- Save Draft button (secondary) -->
  <rect x="1204" y="76" width="108" height="32" rx="6" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1.5"/>
  <text x="1258" y="96" fill="#171717" font-size="13" font-weight="500" text-anchor="middle">Save Draft</text>

  <!-- Publish button (primary) -->
  <rect x="1324" y="76" width="92" height="32" rx="6" fill="#3B82F6"/>
  <text x="1370" y="96" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle">Publish</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- 3. POLICY META  y:136  h:80                            -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="24" y="144" width="1392" height="64" rx="8" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>

  <!-- Policy Name label -->
  <text x="40" y="163" fill="#737373" font-size="11" font-weight="600">POLICY NAME</text>
  <!-- Policy Name input -->
  <rect x="40" y="168" width="672" height="32" rx="5" fill="#F8F8F8" stroke="#D4D4D4" stroke-width="1"/>
  <text x="54" y="189" fill="#A3A3A3" font-size="13">e.g., Production Read-Only</text>

  <!-- Scope label -->
  <text x="736" y="163" fill="#737373" font-size="11" font-weight="600">SCOPE</text>
  <!-- Scope dropdown -->
  <rect x="736" y="168" width="664" height="32" rx="5" fill="#F8F8F8" stroke="#D4D4D4" stroke-width="1"/>
  <text x="750" y="189" fill="#171717" font-size="13">Server</text>
  <!-- dropdown arrow -->
  <polygon points="1378,178 1390,178 1384,190" fill="#737373"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- 4. MAIN EDITOR AREA  y:232  h:400                      -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- Left Column: Rule Builder  w~792 (55%) -->
  <rect x="24" y="232" width="788" height="400" rx="8" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>

  <!-- Tab bar -->
  <rect x="24" y="232" width="788" height="40" rx="8" fill="#F8F8F8" stroke="#D4D4D4" stroke-width="1"/>
  <!-- fix bottom of tab bar -->
  <rect x="24" y="256" width="788" height="16" fill="#F8F8F8"/>
  <line x1="24" y1="272" x2="812" y2="272" stroke="#D4D4D4" stroke-width="1"/>

  <!-- Visual Builder tab (active) -->
  <rect x="32" y="240" width="130" height="32" rx="5" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="97" y="261" fill="#3B82F6" font-size="12" font-weight="600" text-anchor="middle">Visual Builder</text>

  <!-- YAML Editor tab -->
  <rect x="170" y="240" width="104" height="32" rx="5" fill="none"/>
  <text x="222" y="261" fill="#737373" font-size="12" font-weight="500" text-anchor="middle">YAML Editor</text>

  <!-- RULE 1 — Allow -->
  <rect x="40" y="280" width="756" height="96" rx="6" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <!-- Allow badge -->
  <rect x="56" y="300" width="52" height="22" rx="4" fill="#22C55E"/>
  <text x="82" y="315" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">ALLOW</text>
  <!-- Rule 1 pattern -->
  <text x="120" y="312" fill="#171717" font-size="13" font-weight="600">search.*</text>
  <text x="120" y="330" fill="#737373" font-size="12">Tool pattern</text>
  <!-- Caller -->
  <text x="340" y="312" fill="#171717" font-size="13">All callers</text>
  <text x="340" y="330" fill="#737373" font-size="12">Caller scope</text>
  <!-- Constraints -->
  <text x="560" y="312" fill="#A3A3A3" font-size="13" font-style="italic">No constraints</text>
  <text x="560" y="330" fill="#737373" font-size="12">Constraints</text>
  <!-- drag handle / edit icons -->
  <text x="762" y="315" fill="#D4D4D4" font-size="16" text-anchor="end">⋮⋮</text>
  <text x="782" y="315" fill="#A3A3A3" font-size="13" text-anchor="end">✎</text>

  <!-- RULE 2 — Deny -->
  <rect x="40" y="384" width="756" height="96" rx="6" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <!-- Deny badge -->
  <rect x="56" y="404" width="48" height="22" rx="4" fill="#EF4444"/>
  <text x="80" y="419" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">DENY</text>
  <!-- Rule 2 pattern -->
  <text x="120" y="416" fill="#171717" font-size="13" font-weight="600">*.delete</text>
  <text x="120" y="434" fill="#737373" font-size="12">Tool pattern</text>
  <!-- Caller -->
  <text x="340" y="416" fill="#171717" font-size="13">All callers</text>
  <text x="340" y="434" fill="#737373" font-size="12">Caller scope</text>
  <!-- Exceptions -->
  <text x="560" y="416" fill="#A3A3A3" font-size="13" font-style="italic">No exceptions</text>
  <text x="560" y="434" fill="#737373" font-size="12">Exceptions</text>
  <text x="762" y="419" fill="#D4D4D4" font-size="16" text-anchor="end">⋮⋮</text>
  <text x="782" y="419" fill="#A3A3A3" font-size="13" text-anchor="end">✎</text>

  <!-- RULE 3 — Confirm -->
  <rect x="40" y="488" width="756" height="96" rx="6" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <!-- Confirm badge -->
  <rect x="56" y="508" width="64" height="22" rx="4" fill="#EAB308"/>
  <text x="88" y="523" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">CONFIRM</text>
  <!-- Rule 3 pattern -->
  <text x="134" y="520" fill="#171717" font-size="13" font-weight="600">gmail.send</text>
  <text x="134" y="538" fill="#737373" font-size="12">Tool pattern</text>
  <!-- Caller -->
  <text x="340" y="520" fill="#171717" font-size="13">All callers</text>
  <text x="340" y="538" fill="#737373" font-size="12">Caller scope</text>
  <!-- Approval -->
  <text x="560" y="520" fill="#171717" font-size="13">Require human approval</text>
  <text x="560" y="538" fill="#737373" font-size="12">Approval gate</text>
  <text x="762" y="523" fill="#D4D4D4" font-size="16" text-anchor="end">⋮⋮</text>
  <text x="782" y="523" fill="#A3A3A3" font-size="13" text-anchor="end">✎</text>

  <!-- + Add Rule button (dashed) -->
  <rect x="40" y="594" width="756" height="32" rx="6" fill="none" stroke="#A3A3A3" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="418" y="615" fill="#737373" font-size="13" font-weight="500" text-anchor="middle">+ Add Rule</text>

  <!-- Right Column: Inline Simulator  w~596 (45%) -->
  <rect x="828" y="232" width="588" height="400" rx="8" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>

  <!-- Simulator header -->
  <text x="848" y="260" fill="#171717" font-size="14" font-weight="700">Test Policy</text>
  <line x1="828" y1="272" x2="1416" y2="272" stroke="#D4D4D4" stroke-width="1"/>

  <!-- Caller label + input -->
  <text x="848" y="296" fill="#737373" font-size="11" font-weight="600">CALLER</text>
  <rect x="848" y="300" width="548" height="32" rx="5" fill="#F8F8F8" stroke="#D4D4D4" stroke-width="1"/>
  <text x="862" y="321" fill="#A3A3A3" font-size="13">claude-desktop</text>

  <!-- User label + input -->
  <text x="848" y="350" fill="#737373" font-size="11" font-weight="600">USER</text>
  <rect x="848" y="354" width="548" height="32" rx="5" fill="#F8F8F8" stroke="#D4D4D4" stroke-width="1"/>
  <text x="862" y="375" fill="#A3A3A3" font-size="13">keith@noizu.com</text>

  <!-- Tool label + input -->
  <text x="848" y="404" fill="#737373" font-size="11" font-weight="600">TOOL</text>
  <rect x="848" y="408" width="548" height="32" rx="5" fill="#F8F8F8" stroke="#D4D4D4" stroke-width="1"/>
  <text x="862" y="429" fill="#A3A3A3" font-size="13">gmail.send</text>

  <!-- Arguments label + textarea -->
  <text x="848" y="458" fill="#737373" font-size="11" font-weight="600">ARGUMENTS</text>
  <rect x="848" y="462" width="548" height="48" rx="5" fill="#F8F8F8" stroke="#D4D4D4" stroke-width="1"/>
  <text x="862" y="481" fill="#A3A3A3" font-size="12" font-family="ui-monospace, monospace">{"to": "...", "body": "..."}</text>

  <!-- Simulate button -->
  <rect x="848" y="520" width="548" height="32" rx="6" fill="#3B82F6"/>
  <text x="1122" y="541" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle">Simulate</text>

  <!-- Result card (success/green bordered) -->
  <rect x="848" y="562" width="548" height="58" rx="6" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.5"/>
  <!-- Result label -->
  <rect x="858" y="571" width="72" height="18" rx="3" fill="#22C55E"/>
  <text x="894" y="584" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">CONFIRM</text>
  <text x="938" y="584" fill="#171717" font-size="12" font-weight="600">Rule #3 matched: gmail.send requires human approval</text>
  <!-- Trace -->
  <text x="858" y="610" fill="#737373" font-size="11" font-family="ui-monospace, monospace">Rule 1: no match  →  Rule 2: no match  →  Rule 3: MATCH</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- 5. BOTTOM BAR  y:648  h:236                            -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="24" y="648" width="1392" height="232" rx="8" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>

  <!-- Section heading -->
  <text x="40" y="672" fill="#171717" font-size="14" font-weight="700">Policy Preview (YAML)</text>
  <line x1="24" y1="680" x2="1416" y2="680" stroke="#D4D4D4" stroke-width="1"/>

  <!-- Dark code block bg -->
  <rect x="40" y="688" width="1360" height="180" rx="6" fill="#1A1A1A"/>

  <!-- Line numbers gutter -->
  <text x="62" y="712" fill="#4B4B4B" font-size="12" font-family="ui-monospace, monospace">1</text>
  <text x="62" y="730" fill="#4B4B4B" font-size="12" font-family="ui-monospace, monospace">2</text>
  <text x="62" y="748" fill="#4B4B4B" font-size="12" font-family="ui-monospace, monospace">3</text>
  <text x="62" y="766" fill="#4B4B4B" font-size="12" font-family="ui-monospace, monospace">4</text>
  <text x="62" y="784" fill="#4B4B4B" font-size="12" font-family="ui-monospace, monospace">5</text>
  <text x="62" y="802" fill="#4B4B4B" font-size="12" font-family="ui-monospace, monospace">6</text>
  <text x="62" y="820" fill="#4B4B4B" font-size="12" font-family="ui-monospace, monospace">7</text>
  <text x="62" y="838" fill="#4B4B4B" font-size="12" font-family="ui-monospace, monospace">8</text>
  <text x="62" y="856" fill="#4B4B4B" font-size="12" font-family="ui-monospace, monospace">9</text>

  <!-- Gutter separator -->
  <line x1="82" y1="688" x2="82" y2="868" stroke="#2D2D2D" stroke-width="1"/>

  <!-- YAML code lines -->
  <!-- key color: #9ECBFF (blue-ish placeholder tone) — kept readable on dark bg -->
  <text x="96" y="712" fill="#9ECBFF" font-size="12" font-family="ui-monospace, monospace">name:</text>
  <text x="144" y="712" fill="#A3D4A3" font-size="12" font-family="ui-monospace, monospace"> production-read-only</text>

  <text x="96" y="730" fill="#9ECBFF" font-size="12" font-family="ui-monospace, monospace">scope:</text>
  <text x="152" y="730" fill="#A3D4A3" font-size="12" font-family="ui-monospace, monospace"> server</text>

  <text x="96" y="748" fill="#9ECBFF" font-size="12" font-family="ui-monospace, monospace">rules:</text>

  <text x="112" y="766" fill="#D4A3D4" font-size="12" font-family="ui-monospace, monospace">- action:</text>
  <text x="184" y="766" fill="#A3D4A3" font-size="12" font-family="ui-monospace, monospace"> allow</text>

  <text x="120" y="784" fill="#9ECBFF" font-size="12" font-family="ui-monospace, monospace">  tools:</text>
  <text x="168" y="784" fill="#A3D4A3" font-size="12" font-family="ui-monospace, monospace"> ["search.*"]</text>

  <text x="112" y="802" fill="#D4A3D4" font-size="12" font-family="ui-monospace, monospace">- action:</text>
  <text x="184" y="802" fill="#EF9F9F" font-size="12" font-family="ui-monospace, monospace"> deny</text>

  <text x="120" y="820" fill="#9ECBFF" font-size="12" font-family="ui-monospace, monospace">  tools:</text>
  <text x="168" y="820" fill="#A3D4A3" font-size="12" font-family="ui-monospace, monospace"> ["*.delete"]</text>

  <text x="112" y="838" fill="#D4A3D4" font-size="12" font-family="ui-monospace, monospace">- action:</text>
  <text x="184" y="838" fill="#EAD080" font-size="12" font-family="ui-monospace, monospace"> confirm</text>

  <text x="120" y="856" fill="#9ECBFF" font-size="12" font-family="ui-monospace, monospace">  tools:</text>
  <text x="168" y="856" fill="#A3D4A3" font-size="12" font-family="ui-monospace, monospace"> ["gmail.send"]</text>

</svg>

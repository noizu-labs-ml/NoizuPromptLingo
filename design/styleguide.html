<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Robots-Unite — Circuit Arena Style Guide</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/geist@1.2.0/dist/fonts/geist-mono/style.min.css" rel="stylesheet" />

  <!-- React 18 + Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- HeadlessUI -->
  <script type="module">
    import * as HeadlessUI from 'https://esm.sh/@headlessui/react@2.2.4?external=react,react-dom';
    window.HeadlessUI = HeadlessUI;
    window.dispatchEvent(new Event('headlessui-ready'));
  </script>

  <!-- StyleGuide UMD -->
  <script crossorigin src="https://noizu.github.io/react-assets/dist/sg.js"></script>
  <link rel="stylesheet" href="https://noizu.github.io/react-assets/dist/sg.css" />

  <!-- Lucide -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <style>
    /* ═══════════════════════════════════════
       THEME: Circuit Arena
       ═══════════════════════════════════════ */
    .circuit-arena {
      /* ── Background Layers ── */
      --ru-bg-void: #09090B;
      --ru-bg-surface: #111114;
      --ru-bg-elevated: #1A1A1F;
      --ru-bg-inset: #0D0D10;

      /* ── Text Hierarchy ── */
      --ru-text-primary: #FAFAFA;
      --ru-text-secondary: #A1A1AA;
      --ru-text-tertiary: #52525B;
      --ru-text-on-accent: #FFFFFF;

      /* ── Border System ── */
      --ru-border-default: #27272A;
      --ru-border-subtle: #1E1E22;
      --ru-border-strong: #3F3F46;

      /* ── Dual Accent: Signal Orange ── */
      --ru-orange: #F97316;
      --ru-orange-hover: #EA580C;
      --ru-orange-active: #C2410C;
      --ru-orange-muted: rgba(249, 115, 22, 0.15);
      --ru-orange-subtle: rgba(249, 115, 22, 0.08);
      --ru-orange-glow: rgba(249, 115, 22, 0.25);

      /* ── Dual Accent: Circuit Cyan ── */
      --ru-cyan: #06B6D4;
      --ru-cyan-hover: #0891B2;
      --ru-cyan-active: #0E7490;
      --ru-cyan-muted: rgba(6, 182, 212, 0.15);
      --ru-cyan-subtle: rgba(6, 182, 212, 0.08);
      --ru-cyan-glow: rgba(6, 182, 212, 0.25);

      /* ── Semantic Colors ── */
      --ru-success: #4ADE80;
      --ru-success-muted: rgba(74, 222, 128, 0.12);
      --ru-warning: #FACC15;
      --ru-warning-muted: rgba(250, 204, 21, 0.12);
      --ru-error: #F87171;
      --ru-error-muted: rgba(248, 113, 113, 0.12);
      --ru-info: #60A5FA;
      --ru-info-muted: rgba(96, 165, 250, 0.12);

      /* ── Live/Status ── */
      --ru-live: #4ADE80;
      --ru-live-pulse: rgba(74, 222, 128, 0.30);

      /* ── Shadows ── */
      --ru-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.5);
      --ru-shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
      --ru-shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.5);
      --ru-shadow-orange: 0 0 20px var(--ru-orange-glow);
      --ru-shadow-cyan: 0 0 20px var(--ru-cyan-glow);

      /* ── Transitions ── */
      --ru-duration-micro: 100ms;
      --ru-duration-transition: 200ms;
      --ru-duration-arena: 400ms;
      --ru-ease-default: ease;
      --ru-ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);

      /* ── Radii ── */
      --ru-radius-sm: 4px;
      --ru-radius-md: 8px;
      --ru-radius-lg: 12px;
      --ru-radius-xl: 16px;

      /* ── Spacing ── */
      --ru-space-1: 4px;
      --ru-space-2: 8px;
      --ru-space-3: 12px;
      --ru-space-4: 16px;
      --ru-space-5: 20px;
      --ru-space-6: 24px;
      --ru-space-8: 32px;
      --ru-space-10: 40px;
      --ru-space-12: 48px;
      --ru-space-16: 64px;
      --ru-space-24: 96px;

      /* ── Typography ── */
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'Geist Mono', 'JetBrains Mono', Consolas, monospace;
      --ru-font-display: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --ru-font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --ru-font-mono: 'Geist Mono', 'JetBrains Mono', Consolas, monospace;
    }

    /* ═══════════════════════════════════════
       BASE OVERRIDES
       ═══════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; scroll-behavior: smooth; }

    .circuit-arena {
      font-family: var(--ru-font-body);
      color: var(--ru-text-primary);
      background: var(--ru-bg-void);
      background-image: none;
      line-height: 1.6;
    }

    .circuit-arena ::selection {
      background: var(--ru-orange-muted);
      color: var(--ru-text-primary);
    }

    /* ── SG Container & Layout Padding ── */
    .circuit-arena .sg-container {
      background: transparent;
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 40px;
    }
    @media (max-width: 768px) {
      .circuit-arena .sg-container { padding: 0 20px; }
    }

    /* ── SG Shell Overrides ── */
    .circuit-arena .sg-section {
      background: transparent;
      padding-top: 64px;
      padding-bottom: 64px;
      border-bottom: 1px solid var(--ru-border-subtle);
    }
    .circuit-arena .sg-section:last-child { border-bottom: none; }
    .circuit-arena .sg-section-number {
      color: var(--ru-cyan);
      font-family: var(--ru-font-mono);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .circuit-arena .sg-section-title,
    .circuit-arena h1, .circuit-arena h2, .circuit-arena h3 {
      font-family: var(--ru-font-display);
      color: var(--ru-text-primary);
    }
    .circuit-arena .sg-section-title {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
      line-height: 1.2;
    }
    .circuit-arena .sg-section-desc,
    .circuit-arena .sg-section > p:first-of-type {
      color: var(--ru-text-secondary);
      font-size: 15px;
      max-width: 65ch;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .circuit-arena p {
      color: var(--ru-text-secondary);
    }
    .circuit-arena .sg-instructions {
      background: var(--ru-bg-surface);
      border: 1px solid var(--ru-border-default);
      color: var(--ru-text-secondary);
      padding: 20px;
      border-radius: var(--ru-radius-md);
    }

    /* ── Hero Style Card Spacing ── */
    .circuit-arena .sg-style-card {
      background: var(--ru-bg-surface);
      border: 1px solid var(--ru-border-default);
      border-radius: var(--ru-radius-lg);
      margin-bottom: 24px;
      overflow: hidden;
    }
    .circuit-arena .sg-hero-bg {
      background: var(--ru-bg-void) !important;
      padding: 64px 40px 48px;
    }
    .circuit-arena .sg-hero-bg h1 {
      font-size: 48px;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 12px;
    }
    .circuit-arena .sg-epigraph {
      color: var(--ru-text-secondary);
      font-style: italic;
      font-size: 15px;
      max-width: 50ch;
      margin: 0 auto;
      line-height: 1.6;
    }
    .circuit-arena .sg-seal {
      color: var(--ru-cyan);
      opacity: 0.12;
    }
    .circuit-arena .sg-color-bar {
      height: 4px;
    }
    .circuit-arena .sg-meta-grid {
      padding: 20px 40px;
      gap: 0;
    }
    .circuit-arena .sg-meta-cell {
      padding: 12px 16px 12px 0;
    }
    .circuit-arena .sg-meta-label {
      color: var(--ru-text-tertiary);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .circuit-arena .sg-meta-value {
      color: var(--ru-text-primary);
      font-size: 14px;
    }

    /* ── Branding Card Spacing ── */
    .circuit-arena .sg-branding-card {
      background: var(--ru-bg-surface);
      border: 1px solid var(--ru-border-default);
      border-radius: var(--ru-radius-lg);
      padding: 32px 40px;
      margin-bottom: 48px;
    }
    .circuit-arena .sg-branding-card h2 {
      font-size: 28px;
      margin-bottom: 24px;
    }
    .circuit-arena .sg-brand-grid {
      display: grid;
      grid-template-columns: 200px 1fr 1fr;
      gap: 24px 32px;
    }
    @media (max-width: 768px) {
      .circuit-arena .sg-brand-grid {
        grid-template-columns: 1fr;
      }
    }
    .circuit-arena .sg-brand-label {
      color: var(--ru-text-tertiary);
      text-transform: uppercase;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }
    .circuit-arena .sg-brand-value {
      color: var(--ru-text-primary);
      font-size: 14px;
      line-height: 1.6;
    }
    .circuit-arena .sg-brand-keyword {
      background: var(--ru-bg-elevated);
      color: var(--ru-text-secondary);
      border: 1px solid var(--ru-border-default);
      padding: 5px 14px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
    }
    .circuit-arena .sg-brand-keywords {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    /* ── Token Card Overrides ── */
    .circuit-arena .sg-token-card {
      background: var(--ru-bg-surface);
      border: 1px solid var(--ru-border-default);
      border-radius: var(--ru-radius-lg);
      padding: 24px;
      margin-bottom: 20px;
    }
    .circuit-arena .sg-token-card h4,
    .circuit-arena .sg-token-card .sg-token-group-title {
      color: var(--ru-text-primary);
      font-family: var(--ru-font-display);
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--ru-border-subtle);
    }
    .circuit-arena .sg-token-card .sg-token-name {
      color: var(--ru-text-secondary);
      font-family: var(--ru-font-mono);
      font-size: 13px;
    }
    .circuit-arena .sg-token-card .sg-token-value {
      color: var(--ru-text-primary);
      font-family: var(--ru-font-mono);
      font-size: 13px;
    }
    .circuit-arena .sg-token-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--ru-border-subtle);
    }
    .circuit-arena .sg-token-row:last-child { border-bottom: none; }
    .circuit-arena .sg-token-preview {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      border: 1px solid var(--ru-border-default);
      flex-shrink: 0;
      margin-left: 8px;
    }

    /* ── Subsection Labels ── */
    .circuit-arena .sg-subsection-title,
    .circuit-arena h3.sg-subsection-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--ru-text-secondary);
      margin-top: 40px;
      margin-bottom: 16px;
    }

    /* ── Type Specimen Overrides ── */
    .circuit-arena .sg-type-specimen {
      border-bottom: 1px solid var(--ru-border-subtle);
      padding: 20px 0;
    }
    .circuit-arena .sg-type-specimen:last-child { border-bottom: none; }
    .circuit-arena .sg-type-meta {
      color: var(--ru-text-tertiary);
      font-family: var(--ru-font-mono);
      font-size: 12px;
      min-width: 180px;
    }
    .circuit-arena .sg-type-meta strong {
      color: var(--ru-text-secondary);
      font-weight: 600;
      display: block;
      margin-bottom: 4px;
    }

    /* ── Color Swatch Overrides ── */
    .circuit-arena .sg-color-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .circuit-arena .sg-color-swatch {
      border: 1px solid var(--ru-border-default);
      border-radius: var(--ru-radius-md);
      overflow: hidden;
    }
    .circuit-arena .sg-swatch-block {
      height: 64px;
    }
    .circuit-arena .sg-swatch-info {
      background: var(--ru-bg-surface);
      padding: 10px 12px;
    }
    .circuit-arena .sg-swatch-name {
      color: var(--ru-text-primary);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 2px;
    }
    .circuit-arena .sg-swatch-hex {
      color: var(--ru-text-secondary);
      font-family: var(--ru-font-mono);
      font-size: 12px;
    }
    .circuit-arena .sg-swatch-var {
      color: var(--ru-text-tertiary);
      font-family: var(--ru-font-mono);
      font-size: 11px;
      margin-top: 2px;
    }

    /* ── Spacing Scale Overrides ── */
    .circuit-arena .sg-spacing-scale {
      margin-bottom: 32px;
    }
    .circuit-arena .sg-spacing-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 6px 0;
    }
    .circuit-arena .sg-spacing-bar {
      height: 28px;
      background: var(--ru-cyan-muted);
      border-left: 3px solid var(--ru-cyan);
      border-radius: 0 4px 4px 0;
      display: flex;
      align-items: center;
      padding-left: 12px;
    }
    .circuit-arena .sg-spacing-label {
      color: var(--ru-text-secondary);
      font-family: var(--ru-font-mono);
      font-size: 12px;
      min-width: 70px;
      text-align: right;
      flex-shrink: 0;
    }
    .circuit-arena .sg-spacing-name {
      font-family: var(--ru-font-mono);
      font-size: 11px;
      color: var(--ru-text-secondary);
      white-space: nowrap;
    }

    /* ── Spec Table Overrides ── */
    .circuit-arena .sg-spec-table {
      border: 1px solid var(--ru-border-default);
      border-radius: var(--ru-radius-md);
      overflow: hidden;
      margin-bottom: 24px;
    }
    .circuit-arena .sg-spec-table th {
      background: var(--ru-bg-elevated);
      color: var(--ru-text-secondary);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border-bottom: 1px solid var(--ru-border-default);
    }
    .circuit-arena .sg-spec-table td {
      background: var(--ru-bg-surface);
      color: var(--ru-text-primary);
      border-bottom: 1px solid var(--ru-border-subtle);
      font-family: var(--ru-font-mono);
      font-size: 13px;
    }

    /* Principles overrides */
    .circuit-arena .sg-principles {
      margin-bottom: 24px;
    }
    .circuit-arena .sg-principle {
      display: flex;
      gap: 16px;
      padding: 16px 0;
      border-bottom: 1px solid var(--ru-border-subtle);
    }
    .circuit-arena .sg-principle:last-child { border-bottom: none; }
    .circuit-arena .sg-principle-number {
      color: var(--ru-cyan);
      font-family: var(--ru-font-mono);
      font-size: 14px;
      font-weight: 700;
      flex-shrink: 0;
      width: 28px;
    }
    .circuit-arena .sg-principle-rule {
      color: var(--ru-text-primary);
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 4px;
    }
    .circuit-arena .sg-principle-detail {
      color: var(--ru-text-secondary);
      font-size: 14px;
      line-height: 1.6;
    }

    /* Notes list overrides */
    .circuit-arena .sg-notes-list {
      background: var(--ru-bg-surface);
      border: 1px solid var(--ru-border-default);
      border-radius: var(--ru-radius-md);
      padding: 20px 24px;
      margin-top: 20px;
    }
    .circuit-arena .sg-note {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--ru-border-subtle);
    }
    .circuit-arena .sg-note:last-child { border-bottom: none; }
    .circuit-arena .sg-note-swatch {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      flex-shrink: 0;
      margin-top: 4px;
    }
    .circuit-arena .sg-note-label {
      color: var(--ru-text-primary);
      font-weight: 600;
      font-size: 14px;
      margin-right: 4px;
    }
    .circuit-arena .sg-note-text {
      color: var(--ru-text-secondary);
      font-size: 14px;
      line-height: 1.5;
    }

    /* Widget demo overrides */
    .circuit-arena .widget-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }
    .circuit-arena .widget-grid--full {
      grid-template-columns: 1fr;
    }
    .circuit-arena .sg-widget-demo {
      background: var(--ru-bg-surface);
      border: 1px solid var(--ru-border-default);
      border-radius: var(--ru-radius-lg);
      padding: 24px;
      overflow: hidden;
    }
    .circuit-arena .sg-widget-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .circuit-arena .sg-widget-title {
      color: var(--ru-text-primary);
      font-family: var(--ru-font-display);
      font-size: 16px;
      font-weight: 600;
    }
    .circuit-arena .sg-widget-badge {
      background: var(--ru-cyan-muted);
      color: var(--ru-cyan);
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .circuit-arena .sg-widget-desc {
      color: var(--ru-text-tertiary);
      font-family: var(--ru-font-mono);
      font-size: 12px;
      margin-bottom: 16px;
      line-height: 1.5;
      font-size: 12px;
    }

    /* Screen frame overrides */
    .circuit-arena .sg-screen-frame {
      border: 1px solid var(--ru-border-default);
      border-radius: var(--ru-radius-lg);
      overflow: hidden;
      margin-bottom: 32px;
    }
    .circuit-arena .sg-screen-chrome {
      background: var(--ru-bg-elevated);
      border-bottom: 1px solid var(--ru-border-default);
      padding: 10px 16px;
    }
    .circuit-arena .sg-screen-url {
      color: var(--ru-text-tertiary);
      font-family: var(--ru-font-mono);
      font-size: 12px;
    }
    .circuit-arena .sg-screen-label {
      color: var(--ru-text-tertiary);
      font-size: 11px;
    }
    .circuit-arena .sg-screen-body {
      background: var(--ru-bg-void);
    }

    /* Component showcase containers */
    .circuit-arena .component-group {
      margin-bottom: 40px;
    }
    .circuit-arena .component-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--ru-text-secondary);
      margin-bottom: 12px;
      font-family: var(--ru-font-display);
    }
    .circuit-arena .component-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 20px;
      padding: 28px;
      background: var(--ru-bg-surface);
      border: 1px solid var(--ru-border-default);
      border-radius: var(--ru-radius-lg);
    }
    .circuit-arena .state-label {
      font-family: var(--ru-font-mono);
      font-size: 11px;
      color: var(--ru-text-tertiary);
    }

    /* Status grid layout */
    .circuit-arena .sg-status-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }
    .circuit-arena .sg-status-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 16px 20px;
      background: var(--ru-bg-surface);
      border: 1px solid var(--ru-border-default);
      border-radius: var(--ru-radius-md);
      min-width: 200px;
      flex: 1;
    }
    .circuit-arena .sg-status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 4px;
    }
    .circuit-arena .sg-status-label {
      color: var(--ru-text-primary);
      font-size: 14px;
      font-weight: 500;
    }
    .circuit-arena .sg-status-desc {
      color: var(--ru-text-secondary);
      font-size: 13px;
      margin-top: 2px;
    }

    /* ═══════════════════════════════════════
       BUTTONS
       ═══════════════════════════════════════ */
    .circuit-arena .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
    }
    .circuit-arena .btn {
      font-family: var(--ru-font-body);
      font-size: 14px;
      font-weight: 500;
      padding: 12px 20px;
      border: 1px solid transparent;
      border-radius: var(--ru-radius-md);
      cursor: pointer;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;

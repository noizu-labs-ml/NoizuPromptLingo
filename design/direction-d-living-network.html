<style>
/* ═══════════════════════════════════════
   THEME: Living Network
   ═══════════════════════════════════════ */
.living-network {
  /* Substrate */
  --color-deep: #080B14;
  --color-substrate: #0E1221;
  --color-raised: #151A2E;
  --color-glow: #1C2340;
  --color-border: #1E2438;
  --color-border-subtle: #141828;

  /* Text */
  --color-text-primary: #E8E6F0;
  --color-text-secondary: #8B8DA3;
  --color-text-tertiary: #4E5068;

  /* Bioluminescent Accents */
  --color-bio: #4AEDC4;
  --color-bio-dim: rgba(74, 237, 196, 0.12);
  --color-bio-glow: rgba(74, 237, 196, 0.06);
  --color-neural: #7B61FF;
  --color-neural-dim: rgba(123, 97, 255, 0.12);
  --color-warm: #E8A83E;
  --color-warm-dim: rgba(232, 168, 62, 0.10);

  /* Semantic */
  --color-success: #34D399;
  --color-warning: #E8A83E;
  --color-error: #F87171;
  --color-info: #4AEDC4;

  /* Typography */
  --font-sans: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;

  /* Spacing */
  --unit: 8px;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 16px;
  --space-4: 24px;
  --space-5: 32px;
  --space-6: 48px;
  --space-8: 64px;

  /* Radius */
  --radius: 16px;
  --radius-sm: 8px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-full: 9999px;

  /* Shadows */
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.35);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.4);
  --glow-bio: 0 0 16px rgba(74,237,196,0.2);
  --glow-neural: 0 0 16px rgba(123,97,255,0.2);
  --glow-warm: 0 0 16px rgba(232,168,62,0.15);

  /* Semantic aliases for CDN components */
  --black: #E8E6F0;
  --white: #080B14;
  --off-white: #0E1221;
  --gray-50: #151A2E;
  --gray-100: #1C2340;
  --gray-200: #1E2438;
  --gray-300: #2D2F48;
  --gray-400: #4E5068;
  --gray-500: #6B6D85;
  --gray-600: #8B8DA3;
  --gray-700: #A8AAB8;
  --gray-800: #D0D1DA;
  --gray-900: #E8E6F0;
  --red: #F87171;
  --red-light: rgba(248,113,113,0.08);
  --blue: #4AEDC4;
  --blue-light: rgba(74,237,196,0.08);
  --blue-mid: rgba(74,237,196,0.15);
  --yellow: #E8A83E;
  --yellow-light: rgba(232,168,62,0.12);
  --success: #34D399;
  --success-bg: rgba(52,211,153,0.08);
  --warning: #E8A83E;
  --warning-bg: rgba(232,168,62,0.08);
  --error: #F87171;
  --error-bg: rgba(248,113,113,0.08);
  --info: #4AEDC4;
  --info-bg: rgba(74,237,196,0.08);
  --col-gap: 16px;
}

/* ═══════════════════════════════════════
   BASE OVERRIDES
   ═══════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }

.living-network {
  font-family: var(--font-sans);
  color: var(--color-text-primary);
  background: var(--color-deep);
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
.living-network ::selection {
  background: var(--color-bio);
  color: var(--color-deep);
}

/* ═══════════════════════════════════════
   SG.CSS DARK THEME OVERRIDES
   ═══════════════════════════════════════ */
.living-network .sg-section-header { border-color: var(--color-border); }
.living-network .sg-section-header .sg-section-number { color: var(--color-bio); }
.living-network .sg-section-header .sg-section-title { color: var(--color-text-primary); }
.living-network .sg-section-header .sg-section-desc { color: var(--color-text-secondary); }
.living-network .style-card { background: var(--color-substrate); border: 1px solid var(--color-border); }
.living-network .product-branding { background: var(--color-substrate); border: 1px solid var(--color-border); color: var(--color-text-primary); }
.living-network .product-branding .pb-label { color: var(--color-text-secondary); }
.living-network .product-branding .pb-keyword { background: var(--color-raised); color: var(--color-bio); border: 1px solid var(--color-border); }
.living-network .token-card { background: var(--color-substrate); border: 1px solid var(--color-border); }
.living-network .token-card .tc-title { color: var(--color-text-primary); }
.living-network .token-card .tc-name { color: var(--color-bio); }
.living-network .token-card .tc-value { color: var(--color-text-secondary); }
.living-network .color-swatch { border: 1px solid var(--color-border); border-radius: var(--radius-sm); }
.living-network .type-specimen { border-color: var(--color-border); }
.living-network .type-specimen .ts-meta { color: var(--color-text-secondary); }
.living-network .type-specimen .ts-label { color: var(--color-text-tertiary); }
.living-network .spacing-bar { background: var(--color-bio-dim); border: 1px solid rgba(74,237,196,0.2); }
.living-network .spec-table { border-color: var(--color-border); }
.living-network .spec-table th { background: var(--color-substrate); color: var(--color-text-secondary); border-color: var(--color-border); }
.living-network .spec-table td { border-color: var(--color-border); color: var(--color-text-primary); }
.living-network .notes-list .nl-label { color: var(--color-text-primary); }
.living-network .notes-list .nl-text { color: var(--color-text-secondary); }
.living-network .sg-instructions { display: none; }
.living-network .widget-demo { background: var(--color-substrate); border: 1px solid var(--color-border); }
.living-network .widget-demo .wd-title { color: var(--color-text-primary); }
.living-network .widget-demo .wd-badge { background: var(--color-bio-dim); color: var(--color-bio); border: none; }
.living-network .widget-demo .wd-desc { color: var(--color-text-secondary); }
.living-network .widget-demo .wd-preview { background: var(--color-deep); border-color: var(--color-border); }
.living-network .screen-frame { border: 1px solid var(--color-border); }
.living-network .screen-frame .sf-chrome { background: var(--color-substrate); border-bottom-color: var(--color-border); }
.living-network .screen-frame .sf-url { color: var(--color-text-secondary); background: var(--color-raised); }
.living-network .screen-frame .sf-body { background: var(--color-deep); }
.living-network .screen-frame .sf-label { color: var(--color-text-tertiary); }
.living-network .principle-item .pi-number { color: var(--color-bio); }
.living-network .principle-item .pi-rule { color: var(--color-text-primary); }
.living-network .principle-item .pi-detail { color: var(--color-text-secondary); }
.living-network .spacing-diagram { background: var(--color-substrate); border: 1px solid var(--color-border); }
.living-network .spacing-diagram .sd-block { background: var(--color-raised); border: 1px solid var(--color-border); color: var(--color-text-primary); }
.living-network .phase-tab { background: var(--color-raised); color: var(--color-text-secondary); border: 1px solid var(--color-border); }
.living-network .phase-tab.phase-active { background: var(--color-bio); color: var(--color-deep); }
.living-network .phase-tab.phase-completed { background: var(--color-raised); color: var(--color-success); border-color: var(--color-success); }
.living-network .phase-tab.phase-locked { opacity: 0.4; }
.living-network .step-progress .sp-bar { background: var(--color-raised); }
.living-network .step-progress .sp-fill { background: var(--color-bio); }
.living-network .step-progress .sp-label { color: var(--color-text-secondary); }

/* ═══════════════════════════════════════
   BUTTONS
   ═══════════════════════════════════════ */
.living-network .btn {
  font-family: var(--font-sans);
  font-size: 14px;
  font-weight: 500;
  padding: 10px 24px;
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: all 0.2s ease-out;
}
.living-network .btn-black {
  background: var(--color-bio);
  color: var(--color-deep);
}
.living-network .btn-black:hover {
  box-shadow: var(--glow-bio);
  filter: brightness(1.1);
}
.living-network .btn-red {
  background: var(--color-error);
  color: var(--color-deep);
  border-radius: var(--radius-md);
}
.living-network .btn-red:hover {
  box-shadow: 0 0 16px rgba(248,113,113,0.3);
}
.living-network .btn-blue {
  background: var(--color-neural);
  color: var(--white);
  border-radius: var(--radius-md);
}
.living-network .btn-blue:hover {
  box-shadow: var(--glow-neural);
}
.living-network .btn-outline {
  background: transparent;
  color: var(--color-text-primary);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: 9px 23px;
}
.living-network .btn-outline:hover {
  border-color: var(--color-bio);
  color: var(--color-bio);
  background: var(--color-bio-dim);
}
.living-network .btn-ghost {
  background: transparent;
  color: var(--color-text-secondary);
  border: none;
  border-radius: var(--radius-md);
}
.living-network .btn-ghost:hover {
  color: var(--color-text-primary);
  background: var(--color-raised);
}
.living-network .btn-danger {
  background: transparent;
  color: var(--color-error);
  border: 1px solid var(--color-error);
  border-radius: var(--radius-md);
  padding: 9px 23px;
}
.living-network .btn-danger:hover {
  background: var(--error-bg);
}
.living-network .btn-sm { font-size: 12px; padding: 6px 16px; }
.living-network .btn-lg { font-size: 16px; padding: 14px 32px; }
.living-network .btn:disabled,
.living-network .btn[disabled] {
  opacity: 0.4;
  cursor: not-allowed;
  pointer-events: none;
}
.living-network .btn:focus-visible {
  outline: 2px solid var(--color-bio);
  outline-offset: 2px;
}

/* ═══════════════════════════════════════
   CARDS
   ═══════════════════════════════════════ */
.living-network .card {
  background: var(--color-substrate);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-4);
  transition: all 0.25s ease-out;
}
.living-network .card:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 0 1px var(--color-bio-dim), var(--shadow-md);
}
.living-network .card-accent {
  border-top: 3px solid var(--color-bio);
  border-left: 1px solid var(--color-border);
  border-right: 1px solid var(--color-border);
  border-bottom: 1px solid var(--color-border);
}
.living-network .card-filled {
  background: var(--color-raised);
  border: 1px solid var(--color-border);
}
.living-network .card-filled:hover { background: var(--color-glow); }
.living-network .card-blue {
  border: 1px solid rgba(74,237,196,0.3);
  border-top: 3px solid var(--color-bio);
}
.living-network .card-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--color-text-primary);
  letter-spacing: -0.01em;
  margin-bottom: var(--space-1);
}
.living-network .card-body {
  font-size: 14px;
  color: var(--color-text-secondary);
  line-height: 1.6;
}
.living-network .card-tag {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 400;
  padding: 2px 8px;
  background: var(--color-raised);
  color: var(--color-bio);
  border-radius: var(--radius-sm);
  border: 1px solid var(--color-border);
  margin-top: var(--space-2);
}

/* ═══════════════════════════════════════
   INPUT FIELDS
   ═══════════════════════════════════════ */
.living-network .input-demo { max-width: 480px; }
.living-network .input-group { margin-bottom: var(--space-3); }
.living-network .input-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--color-text-secondary);
}
.living-network .input-field {
  font-family: var(--font-sans);
  font-size: 15px;
  color: var(--color-text-primary);
  background: var(--color-deep);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: 10px 14px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.living-network .input-field::placeholder { color: var(--color-text-tertiary); }
.living-network .input-field:focus {
  border-color: var(--color-bio);
  box-shadow: 0 0 0 3px var(--color-bio-dim);
}
.living-network .input-field.error {
  border-color: var(--color-error);
  box-shadow: 0 0 0 3px var(--error-bg);
}
.living-network .input-field:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.living-network .input-hint {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--color-text-tertiary);
}
.living-network .input-hint.error { color: var(--color-error); }
.living-network .input-textarea {
  min-height: 100px;
  resize: vertical;
  line-height: 1.6;
}

/* ═══════════════════════════════════════
   STATUS INDICATORS
   ═══════════════════════════════════════ */
.living-network .status-indicator .indicator-dot {
  border-radius: var(--radius-full);
}
.living-network .status-indicator.queued .indicator-dot { background: var(--color-text-tertiary); }
.living-network .status-indicator.active .indicator-dot {
  background: var(--color-bio);
  box-shadow: 0 0 8px rgba(74,237,196,0.4);
  animation: bio-pulse 2s ease-in-out infinite;
}
.living-network .status-indicator.warning .indicator-dot {
  background: var(--color-warm);
  box-shadow: 0 0 8px rgba(232,168,62,0.3);
}
.living-network .status-indicator.success .indicator-dot {
  background: var(--color-success);
}
.living-network .status-indicator.error .indicator-dot {
  background: var(--color-error);
  box-shadow: 0 0 8px rgba(248,113,113,0.3);
}
.living-network .status-indicator .si-label { color: var(--color-text-primary); }
.living-network .status-indicator .si-desc { color: var(--color-text-secondary); }

/* ═══════════════════════════════════════
   HEADLESS UI COMPONENTS
   ═══════════════════════════════════════ */
.living-network .hui-menu {
  background: var(--color-substrate);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-1);
  box-shadow: var(--shadow-lg);
}
.living-network .hui-menu-item {
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  color: var(--color-text-primary);
  font-size: 14px;
  cursor: pointer;
  transition: background 0.15s;
}
.living-network .hui-menu-item:hover,
.living-network .hui-menu-item.hui-menu-item--active {
  background: var(--color-bio-dim);
  color: var(--color-bio);
}
.living-network .hui-switch {
  width: 44px;
  height: 24px;
  border-radius: var(--radius-full);
  transition: background 0.2s;
  position: relative;
  cursor: pointer;
}
.living-network .hui-switch::after {
  content: '';
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--color-text-primary);
  position: absolute;
  top: 3px;
  transition: left 0.2s;
}
.living-network .hui-switch.hui-switch--off {
  background: var(--color-raised);
  border: 1px solid var(--color-border);
}
.living-network .hui-switch.hui-switch--off::after { left: 3px; }
.living-network .hui-switch.hui-switch--on {
  background: var(--color-bio);
  border: 1px solid var(--color-bio);
}
.living-network .hui-switch.hui-switch--on::after { left: 23px; background: var(--color-deep); }

.living-network .hui-dialog-backdrop {
  background: rgba(8,11,20,0.8);
  backdrop-filter: blur(4px);
}
.living-network .hui-dialog-panel {
  background: var(--color-substrate);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
  box-shadow: var(--shadow-lg);
  max-width: 480px;
}

/* ═══════════════════════════════════════
   ANIMATIONS
   ═══════════════════════════════════════ */
@keyframes bio-pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.7; transform: scale(1.15); }
}
@keyframes agent-breathe {
  0%, 100% { box-shadow: 0 0 16px rgba(74,237,196,0.25); }
  50% { box-shadow: 0 0 28px rgba(74,237,196,0.45); }
}
@keyframes hadal-pulse {
  0%, 100% { filter: brightness(1); }
  50% { filter: brightness(1.3); }
}
@keyframes vote-spring {
  0% { transform: translateY(0); }
  40% { transform: translateY(-4px); }
  70% { transform: translateY(1px); }
  100% { transform: translateY(0); }
}

@media (prefers-reduced-motion: reduce) {
  .living-network * {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

/* ═══════════════════════════════════════
   PROJECT COMPONENTS — Thread, Rep, Agent
   ═══════════════════════════════════════ */

/* Thread Post */
.living-network .thread-post {
  background: var(--color-substrate);
  padding: 20px;
  border-bottom: 1px solid var(--color-border-subtle);
  display: grid;
  grid-template-columns: 48px 1fr auto;
  gap: 12px;
  position: relative;
}
.living-network .thread-post--agent {
  border-left: 3px solid transparent;
  border-image: linear-gradient(180deg, var(--color-bio), transparent) 1;
}
.living-network .thread-avatar {
  width: 40px;
  height: 40px;
  border-radius: var(--radius-full);
  background: var(--color-raised);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  color: var(--color-text-secondary);
  position: relative;
}
.living-network .thread-avatar--agent {
  box-shadow: 0 0 16px rgba(74,237,196,0.25);
}
.living-network .thread-avatar--agent.processing {
  animation: agent-breathe 2.5s ease-in-out infinite;
}
.living-network .thread-meta {
  font-size: 13px;
  color: var(--color-text-secondary);
  display: flex;
  align-items: center;
  gap: 8px;
}
.living-network .thread-meta .agent-badge {
  font-size: 10px;
  font-weight: 500;
  color: var(--color-bio);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.living-network .thread-body {
  font-size: 15px;
  line-height: 1.7;
  color: var(--color-text-primary);
  margin-top: 4px;
}
.living-network .thread-body code {
  font-family: var(--font-mono);
  font-size: 13px;
  background: var(--color-bio-glow);
  border: 1px solid rgba(74,237,196,0.08);
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  display: block;
  margin-top: 8px;
  color: var(--color-bio);
}
.living-network .thread-actions {
  display: flex;
  gap: 16px;
  margin-top: 8px;
  font-size: 12px;
  color: var(--color-text-tertiary);
}
.living-network .thread-actions span:hover {
  color: var(--color-text-secondary);
  cursor: pointer;
}
.living-network .thread-votes {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--color-text-secondary);
}
.living-network .thread-votes .vote-btn {
  cursor: pointer;
  color: var(--color-text-tertiary);
  transition: color 0.15s;
  font-size: 14px;
  background: none;
  border: none;
  padding: 2px;
}
.living-network .thread-votes .vote-btn:hover { color: var(--color-bio); }
.living-network .thread-votes .vote-btn.active { color: var(--color-bio); }
.living-network .thread-votes .vote-count { font-weight: 500; }
.living-network .thread-votes .vote-btn.downvote:hover { color: var(--color-error); }

/* Reputation Ring */
.living-network .rep-ring {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.living-network .rep-ring::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 2px solid transparent;
}
.living-network .rep-ring--surface::before { border-color: rgba(74,237,196,0.4); }
.living-network .rep-ring--pelagic::before { border-color: rgba(74,237,196,0.8); }
.living-network .rep-ring--abyssal::before { border-color: var(--color-neural); }
.living-network .rep-ring--hadal::before {
  border: none;
  background: conic-gradient(var(--color-bio), var(--color-neural), var(--color-bio));
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));

  animation: hadal-pulse 8s ease-in-out infinite;
}
.living-network .rep-ring .rep-inner {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--color-raised);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}

/* Space Palette Dots */
.living-network .space-palette {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.living-network .space-dot {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  position: relative;
  transition: transform 0.2s;
}
.living-network .space-dot:hover {
  transform: scale(1.2);
}
.living-network .space-dot-label {
  font-size: 10px;
  color: var(--color-text-tertiary);
  text-align: center;
  margin-top: 4px;
  font-family: var(--font-mono);
}

/* Agent Profile */
.living-network .agent-profile {
  background: var(--color-substrate);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-4);
  text-align: center;
}
.living-network .agent-profile .ap-avatar {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: var(--color-raised);
  margin: 0 auto var(--space-3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  box-shadow: 0 0 20px rgba(74,237,196,0.3);
}
.living-network .agent-profile .ap-name {
  font-size: 18px;
  font-weight: 600;
  color: var(--color-text-primary);
}
.living-network .agent-profile .ap-rep {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--color-neural);
  margin-top: 4px;
}
.living-network .agent-profile .ap-owner {
  font-size: 13px;
  color: var(--color-text-secondary);
  margin-top: 2px;
}
.living-network .agent-profile .ap-tags {
  display: flex;
  gap: 6px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: var(--space-3);
}
.living-network .agent-profile .ap-tag {
  font-size: 11px;
  padding: 3px 10px;
  border-radius: var(--radius-sm);
  background: var(--color-raised);
  color: var(--color-text-secondary);
  border: 1px solid var(--color-border);
}
.living-network .agent-profile .ap-stats {
  display: flex;
  gap: var(--space-3);
  justify-content: center;
  margin-top: var(--space-3);
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--color-text-secondary);
}
.living-network .agent-profile .ap-stat-num {
  font-weight: 500;
  color: var(--color-text-primary);
}
.living-network .agent-profile .ap-sparkline {
  display: flex;
  gap: 2px;
  align-items: flex-end;
  justify-content: center;
  height: 32px;
  margin-top: var(--space-3);
}
.living-network .agent-profile .ap-spark-bar {
  width: 4px;
  background: var(--color-bio-dim);

  transition: background 0.2s;

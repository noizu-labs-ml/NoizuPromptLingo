color-palette:
  - group: Brand
    description: Core brand colors from Bauhaus primary theory. These brighten automatically in dark mode for visibility.
    notes:
      - label: Brand Red
        text: "Brand accent. CTAs, active states, logo mark, error reinforcement."
        cssClass: brand-red
      - label: Brand Blue
        text: "Primary actions, links, focus rings, info states."
        cssClass: brand-blue
      - label: Brand Yellow
        text: "Highlights, selection, featured content, warnings."
        cssClass: brand-yellow
    colors:
      - name: Brand Red
        value: "var(--brand-red)"
      - name: Brand Red Light
        value: "var(--brand-red-light)"
      - name: Brand Red Mid
        value: "var(--brand-red-mid)"
      - name: Brand Blue
        value: "var(--brand-blue)"
      - name: Brand Blue Light
        value: "var(--brand-blue-light)"
      - name: Brand Blue Mid
        value: "var(--brand-blue-mid)"
      - name: Brand Yellow
        value: "var(--brand-yellow)"
      - name: Brand Yellow Light
        value: "var(--brand-yellow-light)"
      - name: Brand Yellow Mid
        value: "var(--brand-yellow-mid)"

  - group: Semantic Surfaces
    description: Mode-aware surface and text colors — these flip automatically in dark mode.
    colors:
      - name: Surface
        value: "var(--surface)"
      - name: Surface Alt
        value: "var(--surface-alt)"
      - name: Surface Inverse
        value: "var(--surface-inverse)"
      - name: Text
        value: "var(--text)"
      - name: Text Secondary
        value: "var(--text-secondary)"
      - name: Text Muted
        value: "var(--text-muted)"
      - name: Text Inverse
        value: "var(--text-inverse)"
      - name: Border
        value: "var(--border)"
      - name: Border Strong
        value: "var(--border-strong)"

  - group: Palette
    description: Non-branded utility colors for data visualization, tags, categories, and decorative use. Brighten in dark mode. Light variants auto-tint against surface.
    colors:
      - name: Rose
        value: "var(--rose)"
      - name: Rose Light
        value: "var(--rose-light)"
      - name: Orange
        value: "var(--orange)"
      - name: Orange Light
        value: "var(--orange-light)"
      - name: Amber
        value: "var(--amber)"
      - name: Amber Light
        value: "var(--amber-light)"
      - name: Lime
        value: "var(--lime)"
      - name: Lime Light
        value: "var(--lime-light)"
      - name: Emerald
        value: "var(--emerald)"
      - name: Emerald Light
        value: "var(--emerald-light)"
      - name: Teal
        value: "var(--teal)"
      - name: Teal Light
        value: "var(--teal-light)"
      - name: Cyan
        value: "var(--cyan)"
      - name: Cyan Light
        value: "var(--cyan-light)"
      - name: Sky
        value: "var(--sky)"
      - name: Sky Light
        value: "var(--sky-light)"
      - name: Indigo
        value: "var(--indigo)"
      - name: Indigo Light
        value: "var(--indigo-light)"
      - name: Violet
        value: "var(--violet)"
      - name: Violet Light
        value: "var(--violet-light)"
      - name: Purple
        value: "var(--purple)"
      - name: Purple Light
        value: "var(--purple-light)"
      - name: Fuchsia
        value: "var(--fuchsia)"
      - name: Fuchsia Light
        value: "var(--fuchsia-light)"
      - name: Pink
        value: "var(--pink)"
      - name: Pink Light
        value: "var(--pink-light)"

  - group: Gray
    description: Neutral backgrounds, surfaces, borders, and text values. Foundation for all UI layers.
    colors:
      - name: White
        value: "var(--white)"
      - name: Off-White
        value: "var(--off-white)"
      - name: Gray 50
        value: "var(--gray-50)"
      - name: Gray 100
        value: "var(--gray-100)"
      - name: Gray 200
        value: "var(--gray-200)"
      - name: Gray 300
        value: "var(--gray-300)"
      - name: Gray 400
        value: "var(--gray-400)"
      - name: Gray 500
        value: "var(--gray-500)"
      - name: Gray 600
        value: "var(--gray-600)"
      - name: Gray 700
        value: "var(--gray-700)"
      - name: Gray 800
        value: "var(--gray-800)"
      - name: Gray 900
        value: "var(--gray-900)"
      - name: Black
        value: "var(--black)"

  - group: Slate
    description: Blue-tinted neutrals for surfaces and backgrounds. Used by the semantic surface layer — flips in dark mode.
    colors:
      - name: Slate 50
        value: "var(--slate-50)"
      - name: Slate 100
        value: "var(--slate-100)"
      - name: Slate 200
        value: "var(--slate-200)"
      - name: Slate 300
        value: "var(--slate-300)"
      - name: Slate 400
        value: "var(--slate-400)"
      - name: Slate 500
        value: "var(--slate-500)"
      - name: Slate 600
        value: "var(--slate-600)"
      - name: Slate 700
        value: "var(--slate-700)"
      - name: Slate 800
        value: "var(--slate-800)"
      - name: Slate 900
        value: "var(--slate-900)"
      - name: Slate 950
        value: "var(--slate-950)"

  - group: Semantic States
    description: "Functional state colors aliased into the palette — not fixed hex. Change the palette color, the semantic follows."
    colors:
      - name: Success
        value: "var(--success)"
      - name: Success Tint
        value: "var(--success-tint)"
      - name: Warning
        value: "var(--warning)"
      - name: Warning Tint
        value: "var(--warning-tint)"
      - name: Error
        value: "var(--error)"
      - name: Error Tint
        value: "var(--error-tint)"
      - name: Info
        value: "var(--info)"
      - name: Info Tint
        value: "var(--info-tint)"
    notes:
      - label: Success
        text: "→ emerald. Confirmations, published states, positive actions."
      - label: Warning
        text: "→ amber. Cautions, pending states, attention required."
      - label: Error
        text: "→ rose. Failures, danger states, destructive actions."
      - label: Info
        text: "→ brand-blue. Guidance, links, informational states."

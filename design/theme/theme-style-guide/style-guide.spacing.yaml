spacing-contexts:
  grid:
    columns: 12
    gutter-token: col-gap
    margin-token: space-5

  page-container:
    max-width: "1280px"
    padding-x-token: space-5
    padding-y-token: space-4

  section-spacing:
    - role: "Major section gap"
      token: space-8
    - role: "Subsection gap"
      token: space-6
    - role: "Component gap"
      token: space-3
    - role: "Element gap"
      token: space-2

typography:
  - var: font-sans
    name: Space Grotesk
    description: "Primary typeface. Used for headings, UI labels, and body text. Geometric sans with humanist proportions."
    usage: "Headings, card titles, buttons, body copy"
    weights: [400, 600, 700]

  - var: font-mono
    name: IBM Plex Mono
    description: "Monospace typeface. Used for code, token names, tags, and technical labels."
    usage: "Code, token values, tags, metadata"
    weights: [400, 500, 700]
    colors:
      - label: "Brand Red"
        value: "var(--brand-red)"
        background: "var(--slate-800)"
        note: "Terminal prompts, error output, and interactive shell highlights — draws the eye to actionable lines."
      - label: "Brand Yellow"
        value: "var(--brand-yellow)"
        background: "var(--slate-900)"
        note: "Warnings, diff markers, and syntax emphasis — signals caution without halting the reader."

typography-classes:
  - name: Display
    class: typography-display
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-display)"
    font-weight: "700"
    line-height: "1.05"
    letter-spacing: "-0.03em"

  - name: H1
    class: typography-h1
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-3xl)"
    font-weight: "700"
    line-height: "1.1"
    letter-spacing: "-0.02em"

  - name: H2
    class: typography-h2
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-2xl)"
    font-weight: "700"
    line-height: "1.2"
    letter-spacing: "-0.015em"

  - name: H3
    class: typography-h3
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-xl)"
    font-weight: "600"
    line-height: "1.3"
    letter-spacing: "-0.01em"

  - name: H4
    class: typography-h4
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-lg)"
    font-weight: "600"
    line-height: "1.4"

  - name: Body
    class: typography-body
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-md)"
    font-weight: "400"
    line-height: "1.6"

  - name: Small
    class: typography-small
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-sm)"
    font-weight: "400"
    line-height: "1.5"

  - name: Label
    class: typography-label
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-xs)"
    font-weight: "700"
    line-height: "1.4"
    letter-spacing: "0.06em"
    text-transform: "uppercase"

  - name: Code
    class: typography-code
    font-family: "var(--font-mono)"
    font-size: "var(--font-size-sm)"
    font-weight: "400"
    line-height: "1.6"

  - name: Caption
    class: typography-caption
    font-family: "var(--font-sans)"
    font-size: "var(--font-size-xs)"
    font-weight: "400"
    line-height: "1.5"
    color: "var(--gray-500)"

  - name: Mono
    class: typography-mono
    font-family: "var(--font-mono)"
    font-size: "var(--font-size-md)"
    font-weight: "400"
    line-height: "1.6"

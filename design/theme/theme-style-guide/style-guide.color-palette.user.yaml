color-palette:
  - group: Surfaces
    description: Neutral backgrounds, surfaces, borders, and text values. Foundation for all UI layers.
    colors:
      - name: White
        value: "var(--white)"
      - name: Off-White
        value: "var(--off-white)"
      - name: Gray 50
        value: "var(--gray-50)"
      - name: Gray 100
        value: "var(--gray-100)"
      - name: Gray 200
        value: "var(--gray-200)"
      - name: Gray 300
        value: "var(--gray-300)"
      - name: Gray 400
        value: "var(--gray-400)"
      - name: Gray 500
        value: "var(--gray-500)"
      - name: Gray 600
        value: "var(--gray-600)"
      - name: Gray 700
        value: "var(--gray-700)"
      - name: Gray 800
        value: "var(--gray-800)"
      - name: Gray 900
        value: "var(--gray-900)"
      - name: Black
        value: "var(--black)"

  - group: Slate
    description: Blue-tinted neutrals for surfaces and backgrounds. Used by the semantic surface layer — flips in dark mode.
    colors:
      - name: Slate 50
        value: "var(--slate-50)"
      - name: Slate 100
        value: "var(--slate-100)"
      - name: Slate 200
        value: "var(--slate-200)"
      - name: Slate 300
        value: "var(--slate-300)"
      - name: Slate 400
        value: "var(--slate-400)"
      - name: Slate 500
        value: "var(--slate-500)"
      - name: Slate 600
        value: "var(--slate-600)"
      - name: Slate 700
        value: "var(--slate-700)"
      - name: Slate 800
        value: "var(--slate-800)"
      - name: Slate 900
        value: "var(--slate-900)"
      - name: Slate 950
        value: "var(--slate-950)"

  - group: Semantic Surfaces
    description: Mode-aware surface and text colors — these flip automatically in dark mode.
    colors:
      - name: Surface
        value: "var(--surface)"
      - name: Surface Alt
        value: "var(--surface-alt)"
      - name: Surface Inverse
        value: "var(--surface-inverse)"
      - name: Text
        value: "var(--text)"
      - name: Text Secondary
        value: "var(--text-secondary)"
      - name: Text Muted
        value: "var(--text-muted)"
      - name: Text Inverse
        value: "var(--text-inverse)"
      - name: Border
        value: "var(--border)"
      - name: Border Strong
        value: "var(--border-strong)"

  - group: Primaries - Bauhaus
    description: Core brand colors drawn from Bauhaus primary theory — used for accents, actions, and semantic reinforcement.
    notes:
      - label: Red
        text: "Brand accent. CTAs, active states, logo mark, error reinforcement."
        swatch: "var(--brand-red)"
      - label: Blue
        text: "Primary actions, links, focus rings, info states."
        swatch: "var(--brand-blue)"
      - label: Yellow
        text: "Highlights, selection, featured content, warnings."
        swatch: "var(--brand-yellow)"
    colors:
      - name: Red
        value: "var(--brand-red)"
      - name: Blue
        value: "var(--brand-blue)"
      - name: Yellow
        value: "var(--brand-yellow)"

  - group: Semantic
    description: "Functional state colors aliased into the palette — not fixed hex."
    colors:
      - name: Success
        value: "var(--success)"
      - name: Warning
        value: "var(--warning)"
      - name: Error
        value: "var(--error)"
      - name: Info
        value: "var(--info)"
    notes:
      - label: Success
        text: "→ emerald. Confirmations, published states, positive actions."
        swatch: "var(--success)"
      - label: Warning
        text: "→ amber. Cautions, pending states, attention required."
        swatch: "var(--warning)"
      - label: Error
        text: "→ rose. Failures, danger states, destructive actions."
        swatch: "var(--error)"
      - label: Info
        text: "→ brand-blue. Guidance, links, informational states."
        swatch: "var(--info)"

font-url: "https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap"
intent: Cyberpunk design system for agent-driven development tools. Neon accents on void backgrounds — every glow earns its place.
perception: High-tech, immersive, alive. Users should feel they're interfacing with something powerful and slightly dangerous.
audience: Developers and hackers who live in dark terminals, appreciate visual density, and want their tools to feel like they belong in a Gibson novel.
tone: Terse. Technical. Glowing. Speak in commands, not paragraphs. Let the neon do the talking.
keywords:
  - Neon
  - Void
  - Signal
  - Protocol
  - Glow
  - Cyberpunk

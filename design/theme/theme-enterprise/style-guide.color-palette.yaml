color-palette:
  - group: Slate Foundation
    description: "Blue-tinted gray scale. The structural backbone of the enterprise UI — every surface, border, and muted text value draws from this scale. The cool undertone signals composure and precision."
    notes:
      - label: Usage Rule
        text: "Prefer slate over neutral gray throughout. The blue cast is a deliberate trust signal — it reads as 'institutional' rather than 'warm.'"
    colors:
      - name: White
        value: "#FFFFFF"
      - name: Off White
        value: "#F8FAFC"
      - name: Slate 50
        value: "#F1F5F9"
      - name: Slate 100
        value: "#E2E8F0"
      - name: Slate 200
        value: "#CBD5E1"
      - name: Slate 300
        value: "#94A3B8"
      - name: Slate 400
        value: "#64748B"
      - name: Slate 500
        value: "#475569"
      - name: Slate 600
        value: "#334155"
      - name: Slate 700
        value: "#1E293B"
      - name: Slate 800
        value: "#0F172A"
      - name: Slate 900
        value: "#020617"
      - name: Black
        value: "#000000"

  - group: Brand & Accent
    description: "Core brand identity and sub-product accents. Navy anchors the platform. Trust Blue drives all interactive states. Teal and Indigo are scoped to JustMCP.it and Jumpstart sub-products respectively."
    notes:
      - label: Navy (#1E3A5F)
        text: "Platform anchor. Logo, primary headings, SafeMCP product. Do not use as a button background — reserve for identity and structural framing."
      - label: Trust Blue (#2563EB)
        text: "Primary interactive color. All CTAs, links, focus rings, active states. The only color that should appear at full saturation in UI controls."
      - label: Teal (#0D9488)
        text: "JustMCP.it sub-product accent only. Do not use in core platform UI."
      - label: Indigo (#4F46E5)
        text: "Jumpstart sub-product accent only. Do not use in core platform UI."
    colors:
      - name: Brand Navy
        value: "#1E3A5F"
      - name: Brand Navy Light
        value: "rgba(30,58,95,0.08)"
      - name: Trust Blue
        value: "#2563EB"
      - name: Trust Blue Light
        value: "rgba(37,99,235,0.08)"
      - name: JustMCP Teal
        value: "#0D9488"
      - name: JustMCP Teal Light
        value: "rgba(13,148,136,0.08)"
      - name: Jumpstart Indigo
        value: "#4F46E5"
      - name: Jumpstart Indigo Light
        value: "rgba(79,70,229,0.08)"

  - group: Semantic States
    description: "Fixed functional state colors. Intentionally stable — not aliased to the broader palette. Enterprise users expect consistent, predictable feedback states across compliance and audit interfaces."
    notes:
      - label: Success
        text: "Emerald green. Confirmations, deployment success, positive compliance status."
      - label: Warning
        text: "Amber. Attention required, pending review, approaching limits."
      - label: Error
        text: "Red. Failures, violations, destructive or irreversible actions."
      - label: Info
        text: "Trust Blue. Guidance, documentation links, informational banners."
    colors:
      - name: Success
        value: "#059669"
      - name: Success Tint
        value: "color-mix(in srgb, #059669 12%, var(--surface))"
      - name: Warning
        value: "#D97706"
      - name: Warning Tint
        value: "color-mix(in srgb, #D97706 12%, var(--surface))"
      - name: Error
        value: "#DC2626"
      - name: Error Tint
        value: "color-mix(in srgb, #DC2626 12%, var(--surface))"
      - name: Info
        value: "#2563EB"
      - name: Info Tint
        value: "color-mix(in srgb, #2563EB 12%, var(--surface))"

  - group: Text Hierarchy
    description: "Mode-aware text and surface tokens. These flip automatically in dark mode. Use the semantic aliases rather than raw slate values in components."
    notes:
      - label: Hierarchy Rule
        text: "Four levels: text (primary content), text-secondary (supporting copy), text-muted (metadata, placeholders), text-inverse (text on dark/filled backgrounds)."
    colors:
      - name: Text
        value: "var(--text)"
      - name: Text Secondary
        value: "var(--text-secondary)"
      - name: Text Muted
        value: "var(--text-muted)"
      - name: Text Inverse
        value: "var(--text-inverse)"
      - name: Surface
        value: "var(--surface)"
      - name: Surface Alt
        value: "var(--surface-alt)"
      - name: Border
        value: "var(--border)"
      - name: Border Strong
        value: "var(--border-strong)"

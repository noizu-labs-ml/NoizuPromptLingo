# ═══════════════════════════════════════════════════════════════
# MCP Host Enterprise — Design Token Overrides
#
# Slate-scale surfaces (blue-tinted, NOT neutral gray).
# Navy anchor + Trust Blue accent. Serif display headings.
# Three weights: 400 body, 500 emphasis, 600 headings/controls.
# ═══════════════════════════════════════════════════════════════

vars:
  groups:
    # ── Surfaces ──
    # Slate scale: blue-tinted throughout. Overrides neutral gray defaults.
    - name: Surfaces
      vars:
        white: "#FFFFFF"
        off-white: "#F8FAFC"
        gray-50: "#F1F5F9"
        gray-100: "#E2E8F0"
        gray-200: "#CBD5E1"
        gray-300: "#94A3B8"
        gray-400: "#64748B"
        gray-500: "#475569"
        gray-600: "#334155"
        gray-700: "#1E293B"
        gray-800: "#0F172A"
        gray-900: "#020617"
        black: "#000000"

    # ── Primaries ──
    # Navy anchor + Trust Blue primary. Teal/Indigo sub-product accents.
    - name: Primaries
      vars:
        brand-blue: "#2563EB"
        brand-blue-light: "rgba(37,99,235,0.08)"
        brand-navy: "#1E3A5F"
        brand-navy-light: "rgba(30,58,95,0.08)"
        brand-teal: "#0D9488"
        brand-teal-light: "rgba(13,148,136,0.08)"
        brand-indigo: "#4F46E5"
        brand-indigo-light: "rgba(79,70,229,0.08)"

    # ── Semantic ──
    # Fixed enterprise-grade semantic values. Not aliased to palette —
    # these are intentionally stable and compliance-predictable.
    - name: Semantic
      vars:
        success: "#059669"
        # success-tint: "color-mix(in srgb, #059669 12%, var(--surface))"
        warning: "#D97706"
        # warning-tint: "color-mix(in srgb, #D97706 12%, var(--surface))"
        error: "#DC2626"
        # error-tint: "color-mix(in srgb, #DC2626 12%, var(--surface))"
        info: "#2563EB"
        # info-tint: "color-mix(in srgb, #2563EB 12%, var(--surface))"

    # ── Typography ──
    # Source Serif Pro for display/headings. Inter for body. JetBrains Mono for code.
    - name: Typography
      vars:
        font-sans: "'Inter', system-ui, -apple-system, sans-serif"
        font-mono: "'JetBrains Mono', 'Menlo', 'Consolas', monospace"
        font-display: "'Source Serif 4', 'Source Serif Pro', 'Georgia', serif"
        font-body: "'Inter', system-ui, -apple-system, sans-serif"
        font-size-base: "var(--size-md)"
        # line-height-base: "1.5"
        font-size-xs: "var(--size-xs)"
        font-size-sm: "var(--size-sm)"
        font-size-md: "var(--size-md)"
        font-size-lg: "var(--size-lg)"
        font-size-xl: "var(--size-xl)"
        font-size-2xl: "var(--space-4)"
        font-size-3xl: "var(--space-5)"
        font-size-display: "var(--space-7)"

    # ── Grid & Spacing ──
    - name: Grid & Spacing
      vars:
        # col-gap: "var(--space-2)"
        # radius: "2px"
        # unit: "8px"

    # ── Base ──
    - name: Base
      vars:
        # base-font-family: "var(--font-sans)"
        # base-font-color: "var(--text)"
        # base-background: "var(--surface)"
        # base-line-height: "1.5"
        # base-font-size: "var(--font-size-base)"

    # ── Cards ──
    # Blue-tinted visible borders. Professional shadow. Striped table feel.
    - name: Cards
      vars:
        card-background: "#FFFFFF"
        card-border-color: "#CBD5E1"
        # card-border-width: "var(--border-thin)"
        # card-border-style: "solid"
        # card-padding: "var(--space-3)"
        card-drop-shadow: "0 1px 3px rgba(30,58,95,0.08), 0 1px 2px rgba(30,58,95,0.06)"
        card-drop-shadow-color: "rgba(30,58,95,0.08)"
        card-footer-font-size: "var(--font-size-xs)"
        card-footer-font-weight: "var(--font-weight-medium)"
        card-footer-padding: "var(--space-1) var(--card-padding)"
        card-separator-style: "solid"
        card-separator-color: "#CBD5E1"
        card-separator-inset: "var(--card-padding)"
        # card-hover-background: "var(--surface-alt)"
        card-accent-color: "var(--brand-blue)"
        card-title-font-size: "var(--font-size-md)"
        card-title-font-weight: "600"
        card-tag-color: "var(--text-muted)"

    # ── Buttons ──
    # Trust Blue primary. Weighted, with subtle lift shadow — not flat.
    - name: Buttons
      vars:
        btn-background: "#2563EB"
        btn-color: "#FFFFFF"
        btn-font-weight: "600"
        btn-font-size: "14px"
        btn-border-color: "#2563EB"
        btn-hover-background: "#1D4ED8"
        btn-drop-shadow: "0 1px 2px rgba(37,99,235,0.20), 0 1px 1px rgba(0,0,0,0.06)"

    # ── Toggle ──
    # Serif section titles. Professional styling.
    - name: Toggle
      vars:
        # toggle-icon-collapsed: "'\\25B6'"
        # toggle-icon-expanded: "'\\25BC'"
        # toggle-icon-color: "var(--gray-400)"

    # ── HR / Section Dividers ──
    - name: Dividers
      vars:
        hr-section-color: "#CBD5E1"

    # ── HUI: Focus & Interaction ──
    - name: "HUI: Focus & Interaction"
      vars:
        hui-focus-ring-color: "rgba(37,99,235,0.25)"
        # hui-focus-ring-width: "var(--border-heavy)"

    # ── HUI: Controls ──
    # All controls use Trust Blue accent. Blue-tinted borders throughout.
    - name: "HUI: Controls"
      vars:
        hui-control-color: "var(--brand-blue)"
        hui-control-bg: "var(--surface)"
        hui-control-border: "#CBD5E1"
        # hui-control-size: "var(--size-lg)"
        hui-radio-option-bg-active: "rgba(37,99,235,0.08)"
        hui-control-gap: "9px"
        hui-control-shadow: "inset 0 1px 3px rgba(30,58,95,0.06)"
        hui-switch-track-on-bg: "var(--brand-blue)"
        # hui-radio-option-border-active: "var(--brand-blue)"

    # ── HUI: Trigger Buttons ──
    - name: "HUI: Trigger Buttons"
      vars:
        # hui-trigger-bg: "var(--surface)"
        hui-trigger-border: "#CBD5E1"
        hui-trigger-border-hover: "#94A3B8"
        # hui-trigger-color: "var(--text)"

    # ── HUI: Overlay Panels ──
    # Professional card/panel styling with institutional shadows.
    - name: "HUI: Overlay Panels"
      vars:
        hui-panel-bg: "var(--surface)"
        hui-panel-border: "#CBD5E1"
        hui-panel-shadow: "0 4px 16px rgba(30,58,95,0.12), 0 2px 6px rgba(30,58,95,0.08), 0 0 1px rgba(30,58,95,0.08)"
        hui-combo-placeholder-color: "var(--text-muted)"
        hui-combo-btn-color: "var(--text-muted)"

    # ── HUI: Tabs ──
    - name: "HUI: Tabs"
      vars:
        hui-tab-color: "var(--text-muted)"
        hui-tab-color-hover: "var(--text-secondary)"
        hui-tab-color-selected: "var(--brand-blue)"
        hui-tab-border-selected: "var(--brand-blue)"
        hui-tab-list-border: "#CBD5E1"

    # ── HUI: Disclosure ──
    - name: "HUI: Disclosure"
      vars:
        hui-disclosure-border: "#CBD5E1"
        hui-disclosure-chevron-color: "#94A3B8"

    # ── HUI: Field Controls ──
    - name: "HUI: Field Controls"
      vars:
        hui-field-border: "#CBD5E1"
        hui-field-border-hover: "#94A3B8"
        hui-field-focus-border: "var(--brand-blue)"
        hui-field-shadow: "inset 0 1px 3px rgba(30,58,95,0.06)"
        hui-field-chevron-color: "#94A3B8"
        hui-field-gap: "6px"

    # ── HUI: Dialog ──
    - name: "HUI: Dialog"
      vars:
        hui-dialog-shadow: "0 16px 48px rgba(30,58,95,0.16), 0 8px 24px rgba(30,58,95,0.10), 0 0 2px rgba(30,58,95,0.08)"
        hui-dialog-body-line-height: "1.65"

    # ── HUI: Showcase Grid ──
    - name: "HUI: Showcase Grid"
      vars:
        hui-showcase-accent: "var(--brand-blue)"
        hui-showcase-bg: "var(--surface-alt)"
        hui-showcase-border: "#CBD5E1"
        hui-showcase-cell-bg: "var(--surface)"
        hui-showcase-cell-border: "#CBD5E1"

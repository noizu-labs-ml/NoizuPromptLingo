# NPL — Prism · scoped-var deltas (ACCUMULATE onto the base; pre-v3 remediation).
#
# DARK BASE-CASCADE LEAK: theme-style-guide/style-guide.scoped-vars.yaml brightens
# the dark brand-red/-blue/-yellow tints from LITERAL hex values (#e20613 / #0047ab
# / #f5c518 — Bauhaus red/navy/gold) rather than var(--brand-*), so in dark mode the
# base silently reverts every non-Bauhaus theme's accents back to those literals
# (this base-cascade defect is escalated in conformance-npl-minimal.md §7 and
# conformance-npl-prism.md; the durable fix belongs in the base file, pending
# review — do not edit the base from here).
#
# Unlike theme-npl-minimal (which only re-points brand-red because its blue/yellow
# slots are reserved/off-chrome), Prism uses ALL THREE accent slots on visible
# chrome — brand-red (violet) drives buttons/focus/mesh, and brand-blue (cyan) +
# brand-yellow (fuchsia) both appear in the spectrum mesh, the glass-featured
# border-image gradient, and the display text-gradient — so all three families are
# re-pointed here, each mirroring the base's own red/-light/-mid shape, at prism's
# own spectrum hexes (violet #7c3aed / cyan #06b6d4 / fuchsia #d946ef).
#
# A scoped-vars file needs its own `sections` (they do not inherit from the base
# file); the generator substitutes the active theme slug into these selectors.
# prefix "theme" makes these emit as --theme-brand-*, which the cascade's
# --brand-*: var(--theme-brand-*) dark alias then resolves to prism's own spectrum.
scoped-vars:
  prefix: "theme"
  sections:
    standard:
      selector: 'html[data-design-theme="npl-prism"]'
      prefix: "theme"
    dark:
      selector: 'html[data-design-theme="npl-prism"].dark'
      prefix: "theme"
  vars:
    - name: brand-red
      value:
        - section: dark
          value: "color-mix(in srgb, #7c3aed 75%, white)"
    - name: brand-red-light
      value:
        - section: dark
          value: "color-mix(in srgb, #7c3aed 18%, var(--surface))"
    - name: brand-red-mid
      value:
        - section: dark
          value: "color-mix(in srgb, #7c3aed 30%, var(--surface))"
    - name: brand-blue
      value:
        - section: dark
          value: "color-mix(in srgb, #06b6d4 75%, white)"
    - name: brand-blue-light
      value:
        - section: dark
          value: "color-mix(in srgb, #06b6d4 18%, var(--surface))"
    - name: brand-blue-mid
      value:
        - section: dark
          value: "color-mix(in srgb, #06b6d4 30%, var(--surface))"
    - name: brand-yellow
      value:
        - section: dark
          value: "color-mix(in srgb, #d946ef 75%, white)"
    - name: brand-yellow-light
      value:
        - section: dark
          value: "color-mix(in srgb, #d946ef 18%, var(--surface))"
    - name: brand-yellow-mid
      value:
        - section: dark
          value: "color-mix(in srgb, #d946ef 30%, var(--surface))"

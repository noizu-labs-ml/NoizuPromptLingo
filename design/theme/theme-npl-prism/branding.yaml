name: "NPL — Prism"
logo-text: "NPL"
font-url: "https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
intent: "Give NPL a vivid, contemporary face for its outward and creative moments — the landing page, the creative/marketing suite (campaigns, ad copy, landing-page generation, competitor research), and reviews. Where the expert themes recede, Prism presents: spectrum color, frosted glass, soft light."
perception: "Premium, energetic, current within a second — 'these people ship modern software.' Vibrant but composed, not a rave."
audience: "The Growth Operator working the creative suite, prospects hitting the landing page, and anyone reviewing generated creative — audiences who respond to polish and color, not density."
tone: "Confident, contemporary, a little bold. Marketing-literate."
keywords: [vibrant, luminous, spectrum, premium, glass]

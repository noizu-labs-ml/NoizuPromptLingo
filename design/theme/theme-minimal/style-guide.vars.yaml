# ═══════════════════════════════════════════════════════════════
# MCP Host — Minimal Theme — Design Token Overrides
#
# Single accent: Electric Blue #2563EB
# Near-monochrome base. No glow. No decorative colors.
# Active entries = value differs from engine defaults.
# Commented = matches default (shown for reference).
# ═══════════════════════════════════════════════════════════════

vars:
  groups:
    # ── Surfaces ──
    # Pure neutral scale — no blue tint (overrides default slate-based grays)
    - name: Surfaces
      vars:
        white: "#FFFFFF"
        off-white: "#FAFAFA"
        gray-50: "#F5F5F5"
        gray-100: "#F0F0F0"
        gray-200: "#E5E5E5"
        gray-300: "#D4D4D4"
        gray-400: "#A3A3A3"
        gray-500: "#737373"
        gray-600: "#525252"
        gray-700: "#404040"
        gray-800: "#262626"
        gray-900: "#171717"
        black: "#0A0A0A"

    # ── Primaries ──
    # Single accent only. No brand-red, no brand-yellow.
    - name: Primaries
      vars:
        brand-blue: "#2563EB"
        brand-blue-light: "rgba(37, 99, 235, 0.08)"
        brand-blue-mid: "rgba(37, 99, 235, 0.15)"

    # ── Semantic ──
    # Standard states. Tints at 0.08 opacity.
    - name: Semantic
      vars:
        success: "#22C55E"
        success-tint: "rgba(34, 197, 94, 0.08)"
        warning: "#EAB308"
        warning-tint: "rgba(234, 179, 8, 0.08)"
        error: "#EF4444"
        error-tint: "rgba(239, 68, 68, 0.08)"
        info: "#3B82F6"
        info-tint: "rgba(59, 130, 246, 0.08)"

    # ── Typography ──
    # Inter only. No display font distinction.
    - name: Typography
      vars:
        font-sans: "'Inter', system-ui, -apple-system, sans-serif"
        font-mono: "'JetBrains Mono', 'Menlo', 'Monaco', monospace"
        font-display: "'Inter', system-ui, -apple-system, sans-serif"
        font-body: "'Inter', system-ui, -apple-system, sans-serif"
        font-size-base: "var(--size-md)"
        line-height-base: "1.5"
        font-size-xs: "var(--size-xs)"
        font-size-sm: "var(--size-sm)"
        font-size-md: "var(--size-md)"
        font-size-lg: "var(--size-lg)"
        font-size-xl: "var(--size-xl)"
        font-size-2xl: "var(--space-4)"
        font-size-3xl: "var(--space-5)"
        font-size-display: "48px"

    # ── Grid & Spacing ──
    # Standard 8px unit. No overrides needed.
    - name: Grid & Spacing
      vars:
        # unit: "8px"
        # col-gap: "var(--space-2)"
        radius: "6px"

    # ── Base ──
    - name: Base
      vars:
        # base-font-family: "var(--font-sans)"
        # base-font-color: "var(--text)"
        # base-background: "var(--surface)"
        # base-line-height: "var(--line-height-base)"
        # base-font-size: "var(--font-size-base)"

    # ── Cards ──
    # Light border, no shadow. Clean white background.
    - name: Cards
      vars:
        card-background: "#FFFFFF"
        card-border-color: "#E5E5E5"
        # card-border-width: "var(--border-thin)"
        # card-border-style: "solid"
        card-separator-style: "solid"
        card-separator-color: "var(--border)"
        card-footer-font-size: "var(--font-size-xs)"
        card-footer-font-weight: "400"
        card-footer-padding: "var(--space-1) var(--card-padding)"
        card-tag-color: "var(--text-muted)"

    # ── Buttons ──
    # Blue primary. Semibold 14px. Outline variant uses blue border.
    - name: Buttons
      vars:
        btn-background: "#2563EB"
        btn-color: "#FFFFFF"
        btn-font-weight: "600"
        btn-font-size: "14px"
        btn-border-color: "#2563EB"
        btn-hover-background: "#1D4ED8"
        btn-outline-background: "transparent"
        btn-outline-color: "#2563EB"
        btn-outline-hover-background: "rgba(37, 99, 235, 0.06)"
        # btn-border-width: "var(--border-thin)"
        # btn-border-style: "solid"

    # ── Toggle ──
    # No glow. Subtle section dividers.
    - name: Toggle
      vars:
        hr-section-color: "#E5E5E5"
        hr-section-height: "1px"
        # toggle-icon-color: "var(--gray-400)"

    # ── HUI: Focus & Interaction ──
    - name: "HUI: Focus & Interaction"
      vars:
        hui-focus-ring-color: "rgba(37, 99, 235, 0.3)"
        # hui-focus-ring-width: "var(--border-heavy)"

    # ── HUI: Controls ──
    # Blue accent. White panel. Clean #E5E5E5 borders. No glow.
    - name: "HUI: Controls"
      vars:
        hui-control-color: "#2563EB"
        hui-control-bg: "#FFFFFF"
        hui-control-border: "#E5E5E5"
        # hui-control-size: "var(--size-lg)"
        hui-radio-option-bg-active: "rgba(37, 99, 235, 0.06)"
        # hui-switch-track-on-bg: "var(--brand-blue)"
        # hui-switch-thumb-bg: "var(--white)"
        hui-control-gap: "9px"
        hui-control-shadow: "none"

    # ── HUI: Trigger Buttons ──
    - name: "HUI: Trigger Buttons"
      vars:
        hui-trigger-bg: "#FFFFFF"
        hui-trigger-border: "#E5E5E5"
        hui-trigger-border-hover: "#D4D4D4"
        # hui-trigger-color: "var(--text)"

    # ── HUI: Overlay Panels ──
    # No heavy shadow. Subtle elevation only.
    - name: "HUI: Overlay Panels"
      vars:
        hui-panel-bg: "#FFFFFF"
        hui-panel-border: "#E5E5E5"
        hui-panel-shadow: "0 4px 16px rgba(0, 0, 0, 0.08), 0 1px 4px rgba(0, 0, 0, 0.04), 0 0 1px rgba(0, 0, 0, 0.04)"
        hui-combo-placeholder-color: "var(--text-muted)"
        hui-combo-btn-color: "var(--text-muted)"

    # ── HUI: Tabs ──
    - name: "HUI: Tabs"
      vars:
        hui-tab-color: "var(--text-muted)"
        hui-tab-color-hover: "var(--text-secondary)"
        # hui-tab-color-selected: "var(--text)"
        # hui-tab-border-selected: "var(--text)"

    # ── HUI: Field Controls ──
    - name: "HUI: Field Controls"
      vars:
        # hui-field-bg: "var(--surface)"
        hui-field-border: "#E5E5E5"
        hui-field-border-hover: "#D4D4D4"
        hui-field-focus-border: "#2563EB"
        hui-field-shadow: "none"
        hui-field-chevron-color: "var(--text-muted)"
        hui-field-gap: "6px"

    # ── HUI: Dialog ──
    - name: "HUI: Dialog"
      vars:
        hui-dialog-shadow: "0 16px 48px rgba(0, 0, 0, 0.12), 0 4px 16px rgba(0, 0, 0, 0.06), 0 0 1px rgba(0, 0, 0, 0.04)"
        # hui-dialog-bg: "var(--surface)"
        hui-dialog-body-line-height: "1.6"

    # ── HUI: Showcase Grid ──
    - name: "HUI: Showcase Grid"
      vars:
        hui-showcase-accent: "#2563EB"
        # hui-showcase-bg: "var(--surface-alt)"
        # hui-showcase-border: "var(--border-strong)"
        # hui-showcase-cell-bg: "var(--surface)"

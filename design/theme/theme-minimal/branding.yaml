name: "MCP Host"
logo-text: "MCP Host"
font-url: "https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400&display=swap"

logo-style:
  font: "Inter"
  color: "#171717"
  weight: "600"
  letter-spacing: "-0.02em"
  glow: none
  decoration: none

intent: "Clean infrastructure tooling for developers who build with MCP. No ceremony — just a fast, reliable platform that stays out of the way."
perception: "Competent, calm, and precise. Users should feel they're working with something that was built by engineers who hate clutter as much as they do."
audience: "Developers integrating MCP servers into production systems. They live in terminals and code editors, value speed and clarity, and distrust flashy UIs."
tone: "Direct and concise. Say the thing. No marketing language. Every word earns its place."

keywords:
  - Clean
  - Precise
  - Minimal
  - Restrained
  - Functional

intro: |
  MCP Host uses a single-accent, near-monochrome design system inspired by Vercel, Linear, and Resend.
  Electric Blue (#2563EB) is the only chromatic accent — reserved for primary CTAs and active states.
  Everything else is neutral. Whitespace does the heavy lifting.
  Two weights only: 400 for body, 600 for emphasis. No display weights, no decorative type.

vars:
  groups:
    - name: Surfaces
      vars:
        white: "#e8e8e8"
        off-white: "#d0d0d8"
        gray-50: "#1e2030"
        gray-100: "#252840"
        gray-200: "#2e3150"
        gray-300: "#4a4d6a"
        gray-400: "#6b6f8a"
        gray-500: "#8a8ea8"
        gray-600: "#a8abc2"
        gray-700: "#181a2a"
        gray-800: "#0f1020"
        gray-900: "#0a0b15"
        black: "#060712"

    - name: Brand
      vars:
        brand-red: "#F59E0B"
        brand-red-light: "rgba(245,158,11,0.12)"
        brand-red-mid: "rgba(245,158,11,0.25)"
        brand-blue: "#3B82F6"
        brand-blue-light: "rgba(59,130,246,0.12)"
        brand-blue-mid: "rgba(59,130,246,0.25)"
        brand-yellow: "#F59E0B"
        brand-yellow-light: "rgba(245,158,11,0.12)"
        brand-yellow-mid: "rgba(245,158,11,0.25)"

    - name: Semantic
      vars:
        success: "#22c55e"
        success-tint: "rgba(34,197,94,0.15)"
        warning: "#eab308"
        warning-tint: "rgba(234,179,8,0.15)"
        error: "#ef4444"
        error-tint: "rgba(239,68,68,0.15)"
        info: "#3b82f6"
        info-tint: "rgba(59,130,246,0.15)"

    - name: Typography
      vars:
        font-sans: "'Inter', -apple-system, BlinkMacSystemFont, sans-serif"
        font-mono: "'JetBrains Mono', 'Menlo', monospace"
        font-display: "'JetBrains Mono', monospace"

    - name: Layout
      vars:
        radius: "4px"

    - name: Base
      vars:
        base-font-family: "var(--font-sans)"
        base-font-color: "var(--text)"
        base-background: "var(--surface)"
        base-line-height: "1.6"

    - name: Cards
      vars:
        card-background: "#0f1020"
        card-border-color: "#252840"
        card-header-background: "#0f1020"
        card-footer-background: "#181a2a"

    - name: Buttons
      vars:
        btn-font-family: "var(--font-mono)"
        btn-font-weight: "600"
        btn-font-size: "13px"
        btn-letter-spacing: "0.02em"
        btn-background: "#F59E0B"
        btn-color: "#060712"
        btn-border-color: "transparent"
        btn-hover-background: "#FBBF24"
        btn-hover-border-color: "transparent"
        btn-outline-background: "transparent"
        btn-outline-color: "#F59E0B"
        btn-outline-hover-background: "rgba(245,158,11,0.1)"

    - name: Toggle
      vars:
        sg-section-title-font-family: "var(--font-mono)"
        sg-section-title-text-transform: "none"
        sg-section-title-letter-spacing: "0.01em"
        sg-section-title-color: "var(--text)"
        sg-section-number-bg: "rgba(245,158,11,0.1)"
        sg-section-number-border: "1px solid rgba(245,158,11,0.3)"
        sg-section-number-color: "#F59E0B"
        sg-section-number-radius: "var(--radius-md)"
        sg-section-desc-color: "var(--text-muted)"
        hr-section-color: "linear-gradient(90deg, #F59E0B, transparent)"
        hr-section-height: "1px"
        hr-subsection-color: "linear-gradient(90deg, rgba(245,158,11,0.4), transparent)"
        hr-subsection-height: "1px"
        hr-accent-color: "#F59E0B"

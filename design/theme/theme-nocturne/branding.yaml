name: MCP Host
logo-text: "MCP HOST"
font-url: "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
logo-style:
  font: "'Inter', 'Geist', system-ui, sans-serif"
  color: "#3B82F6"
  effect: "text-shadow: 0 0 20px rgba(59,130,246,0.5), 0 0 40px rgba(59,130,246,0.2)"
intent: Dark-native developer platform for MCP hosting and orchestration. Phosphor Blue glow on void canvas — luminosity speaks; silence is structure.
perception: Authoritative, precise, alive at night. Developers should feel they are operating within a system that is both capable and trustworthy — powerful without theatrics.
audience: Platform engineers, AI developers, and technical architects who build and deploy MCP servers at scale. Lives in the terminal. Thinks in protocols.
tone: Direct. Technical. Unhurried. The platform does the work. The interface stays out of the way.
keywords:
  - Protocol
  - Glow
  - Void
  - Signal
  - Precision
  - Nocturne
  - Phosphor
  - Platform


vars:
  groups:
    - name: Surfaces
      vars:
        white: "#ffffff"
        off-white: "#f8fafc"
        black: "#0f172a"

    - name: Brand
      vars:
        brand-red: "#0A66C2"
        brand-red-light: "rgba(10,102,194,0.08)"
        brand-red-mid: "rgba(10,102,194,0.16)"
        brand-blue: "#0A66C2"
        brand-blue-light: "rgba(10,102,194,0.08)"
        brand-blue-mid: "rgba(10,102,194,0.16)"
        brand-yellow: "#0A66C2"
        brand-yellow-light: "rgba(10,102,194,0.08)"
        brand-yellow-mid: "rgba(10,102,194,0.16)"

    - name: Semantic
      vars:
        success: "#16a34a"
        success-tint: "rgba(22,163,74,0.10)"
        warning: "#ca8a04"
        warning-tint: "rgba(202,138,4,0.10)"
        error: "#dc2626"
        error-tint: "rgba(220,38,38,0.10)"
        info: "#0A66C2"
        info-tint: "rgba(10,102,194,0.10)"

    - name: Typography
      vars:
        font-sans: "'Geist', -apple-system, BlinkMacSystemFont, 'Inter', sans-serif"
        font-mono: "'Geist Mono', 'Menlo', monospace"
        font-display: "'Geist', sans-serif"

    - name: Layout
      vars:
        radius: "6px"

    - name: Base
      vars:
        base-font-family: "var(--font-sans)"
        base-font-color: "var(--text)"
        base-background: "var(--surface)"
        base-line-height: "1.6"

    - name: Cards
      vars:
        card-background: "var(--white)"
        card-border-color: "var(--gray-200)"
        card-header-background: "var(--white)"
        card-footer-background: "var(--gray-50)"

    - name: Buttons
      vars:
        btn-font-family: "var(--font-sans)"
        btn-font-weight: "500"
        btn-font-size: "14px"
        btn-letter-spacing: "0"
        btn-background: "#0A66C2"
        btn-color: "#ffffff"
        btn-border-color: "transparent"
        btn-hover-background: "#0856A8"
        btn-hover-border-color: "transparent"
        btn-outline-background: "transparent"
        btn-outline-color: "#0A66C2"
        btn-outline-hover-background: "rgba(10,102,194,0.06)"

    - name: Toggle
      vars:
        sg-section-title-font-family: "var(--font-sans)"
        sg-section-title-text-transform: "none"
        sg-section-title-letter-spacing: "0"
        sg-section-title-color: "var(--text)"
        sg-section-number-bg: "rgba(10,102,194,0.06)"
        sg-section-number-border: "1px solid rgba(10,102,194,0.15)"
        sg-section-number-color: "#0A66C2"
        sg-section-number-radius: "var(--radius-md)"
        sg-section-desc-color: "var(--text-muted)"
        hr-section-color: "var(--gray-200)"
        hr-section-height: "1px"
        hr-subsection-color: "var(--gray-100)"
        hr-subsection-height: "1px"
        hr-accent-color: "#0A66C2"

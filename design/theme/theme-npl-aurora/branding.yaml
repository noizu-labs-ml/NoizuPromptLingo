name: "NPL — Aurora"
logo-text: "NPL"
font-url: "https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
intent: "Make NPL feel welcoming — a warm, soft, rounded surface for the humans who supervise agents rather than live in a terminal. Where the shipped themes optimize for expert density, Aurora optimizes for arrival: onboarding, invitations, first-run, and the marketing funnel."
perception: "Friendly, calm, unintimidating within five seconds — 'this is going to be okay.' Soft light, gentle depth, nothing sharp."
audience: "The Evaluating Newcomer and the human supervisor (Delivery Lead in her 'invite the team / set things up' moments) — people who have not used NPL before and must not feel they've walked into a hacker tool."
tone: "Warm, plain-spoken, encouraging. Explains before it demands."
keywords: [warm, soft, welcoming, rounded, humane]

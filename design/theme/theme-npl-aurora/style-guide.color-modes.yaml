# NPL — Aurora color modes (treatise §3 Mode strategy).
# Light is primary and the design home: warm cream with gentle warm-tinted neutrals.
# Dark is a COZY translation — a warm plum-charcoal canvas (#221d29, never a cold
# slate), the violet primary lightened for contrast, shadows deepened to warm glows.
# shadow-color is warm-tinted per §6 (resting soft shadows are the elevation model).
# Contrast verified in conformance-npl-aurora.md §Contrast. NOTE: the legacy
# generate-css path does not emit these literal maps — dark values here are
# reasoned from the seed cascade, not serve-verified (see conformance §3).
color-modes:
  light:
    surface: "#fff9f4"          # warm cream canvas
    surface-alt: "#fdf3ea"      # warm tone step (cards / raised panels)
    surface-inverse: "#37303a"  # plum ink
    text: "#37303a"             # ink on cream ≈ 12:1 (AAA-comfortable, not harsh 21:1)
    text-secondary: "#4f4757"   # warm plum-gray ≈ 8.5:1
    text-muted: "#726879"       # warm plum-gray ≈ 5.0:1 (clears body)
    text-inverse: "#fff9f4"
    border: "#f0e2d6"           # soft warm hairline — barely there (shadow does the separating, §6)
    border-strong: "#e5d3c4"    # warm, still soft
    shadow-color: "rgba(120, 80, 90, 0.10)"  # warm resting soft-shadow (§6 signature)
  dark:
    surface: "#221d29"          # warm plum-charcoal (cozy, not cold slate)
    surface-alt: "#2c2634"      # raised warm plum step
    surface-inverse: "#fff9f4"
    text: "#f4ecf3"             # warm near-white on plum ≈ 14:1
    text-secondary: "#c8bcd0"   # ≈ 9:1
    text-muted: "#9a8ea6"       # ≈ 5.3:1 on #221d29 (clears body)
    text-inverse: "#221d29"
    border: "#3a3342"           # warm plum border
    border-strong: "#4a4152"
    shadow-color: "rgba(10, 6, 14, 0.50)"    # deeper warm shadow so cards still read as floating on dark

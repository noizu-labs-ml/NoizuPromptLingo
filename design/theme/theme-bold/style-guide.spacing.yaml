spacing-contexts:
  grid:
    columns: 12
    gutter-token: col-gap
    margin-token: space-5

  page-container:
    max-width: "1440px"
    padding-x-token: space-6
    padding-y-token: space-5

  section-spacing:
    - role: "Major section gap"
      token: space-10
    - role: "Subsection gap"
      token: space-7
    - role: "Component gap"
      token: space-4
    - role: "Element gap"
      token: space-2

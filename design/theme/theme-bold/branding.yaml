name: MCP Host
logo-text: "MCP HOST"
font-url: "https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
logo-style:
  font: "'Space Grotesk', system-ui, sans-serif"
  color: "#7C3AED"
  effect: "background: linear-gradient(135deg, #7C3AED, #EC4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 20px rgba(124,58,237,0.4)) drop-shadow(0 0 40px rgba(236,72,153,0.2))"

intent: >
  Bold differentiation in the MCP space. MCP Host is not another gray developer tool —
  it is an infrastructure platform with personality, built by developers who believe
  that power and expressiveness are not in conflict. Vivid gradients on void canvas.
  The brand announces itself.

perception: >
  Confident. Innovative. Electric. Developers should feel they are working with a platform
  that has an opinion — one that chose violet-to-pink not by accident, but because it
  understands that strong tools deserve strong identity. Capable and alive.

audience: >
  Developers who want their tools to have personality. Platform engineers who are tired
  of boring gray SaaS. Technical builders who see brand quality as a signal of
  engineering quality. They live in dark mode and expect their infrastructure to look as
  sharp as their output.

tone: Confident. Slightly irreverent. Developer-native. The platform knows what it is.

keywords:
  - Bold
  - Vivid
  - Gradient
  - Confident
  - Electric
  - Expressive
  - Developer-native

intro:
  title: "MCP Host — Bold Expressive"
  subtitle: "High-energy dark developer brand with vivid gradient accents"
  version: "1.0.0"
  date: "2026-05-12"
  colors:
    - label: "Primary Gradient Start"
      value: "#7C3AED"
      note: "Electric Violet — gradient anchor, primary CTAs, logo mark"
    - label: "Primary Gradient End"

      note: "Hot Pink — gradient terminus, hover states, emphasis"
    - label: "Secondary Gradient Start"
      value: "#06B6D4"
      note: "Cyan — secondary gradient anchor, JustMCP sub-product"
    - label: "Secondary Gradient End"
      value: "#3B82F6"
      note: "Blue — secondary gradient terminus, info states"
    - label: "JustMCP.it"
      value: "#06B6D4"
      note: "Plasma Cyan — JustMCP sub-product gradient anchor"

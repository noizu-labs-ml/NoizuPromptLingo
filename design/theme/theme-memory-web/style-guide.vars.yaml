vars:
  groups:
    - name: Surfaces
      vars:
        white: "#e8ecf0"
        off-white: "#d8dce2"
        gray-50: "#1a1e2e"
        gray-100: "#222640"
        gray-200: "#2a2e48"
        gray-300: "#4a4e68"
        gray-400: "#6a6e88"
        gray-500: "#8a8ea8"
        gray-600: "#aab0c2"
        gray-700: "#141828"
        gray-800: "#0e1220"
        gray-900: "#0a0e18"
        black: "#060812"

    - name: "Emotion Palette"
      vars:
        brand-red: "#EC4899"
        brand-red-light: "rgba(236,72,153,0.12)"
        brand-red-mid: "rgba(236,72,153,0.25)"
        brand-blue: "#6366F1"
        brand-blue-light: "rgba(99,102,241,0.12)"
        brand-blue-mid: "rgba(99,102,241,0.25)"
        brand-yellow: "#F59E0B"
        brand-yellow-light: "rgba(245,158,11,0.12)"
        brand-yellow-mid: "rgba(245,158,11,0.25)"

    - name: Palette
      vars:
        rose: "#EC4899"
        rose-light: "rgba(236,72,153,0.12)"
        orange: "#F97316"
        orange-light: "rgba(249,115,22,0.12)"
        amber: "#F59E0B"
        amber-light: "rgba(245,158,11,0.12)"
        lime: "#84CC16"
        lime-light: "rgba(132,204,22,0.12)"
        emerald: "#10B981"
        emerald-light: "rgba(16,185,129,0.12)"
        teal: "#14B8A6"
        teal-light: "rgba(20,184,166,0.12)"
        cyan: "#06B6D4"
        cyan-light: "rgba(6,182,212,0.12)"
        sky: "#38BDF8"
        sky-light: "rgba(56,189,248,0.12)"
        indigo: "#6366F1"
        indigo-light: "rgba(99,102,241,0.12)"
        violet: "#8B5CF6"
        violet-light: "rgba(139,92,246,0.12)"
        purple: "#A855F7"
        purple-light: "rgba(168,85,247,0.12)"
        fuchsia: "#D946EF"
        fuchsia-light: "rgba(217,70,239,0.12)"
        pink: "#EC4899"
        pink-light: "rgba(236,72,153,0.12)"

    - name: Semantic
      vars:
        success: "#10B981"
        success-tint: "rgba(16,185,129,0.15)"
        warning: "#F59E0B"
        warning-tint: "rgba(245,158,11,0.15)"
        error: "#EF4444"
        error-tint: "rgba(239,68,68,0.15)"
        info: "#6366F1"
        info-tint: "rgba(99,102,241,0.15)"

    - name: Typography
      vars:
        font-sans: "'Plus Jakarta Sans', -apple-system, sans-serif"
        font-mono: "'Fira Code', 'Menlo', monospace"
        font-display: "'Plus Jakarta Sans', sans-serif"

    - name: Layout
      vars:
        radius: "8px"

    - name: Base
      vars:
        base-font-family: "var(--font-sans)"
        base-font-color: "var(--text)"
        base-background: "var(--surface)"
        base-line-height: "1.6"

    - name: Cards
      vars:
        card-background: "#0e1220"
        card-border-color: "#222640"
        card-header-background: "#0e1220"
        card-footer-background: "#141828"

    - name: Buttons
      vars:
        btn-font-family: "var(--font-display)"
        btn-font-weight: "600"
        btn-font-size: "14px"
        btn-letter-spacing: "0.01em"
        btn-background: "#6366F1"
        btn-color: "#ffffff"
        btn-border-color: "transparent"
        btn-hover-background: "#818CF8"
        btn-hover-border-color: "transparent"
        btn-outline-background: "transparent"
        btn-outline-color: "#6366F1"
        btn-outline-hover-background: "rgba(99,102,241,0.1)"

    - name: Toggle
      vars:
        sg-section-title-font-family: "var(--font-display)"
        sg-section-title-text-transform: "none"
        sg-section-title-letter-spacing: "0"
        sg-section-title-color: "var(--text)"
        sg-section-number-bg: "rgba(99,102,241,0.1)"
        sg-section-number-border: "1px solid rgba(99,102,241,0.3)"
        sg-section-number-color: "#6366F1"
        sg-section-number-radius: "12px"
        sg-section-desc-color: "var(--text-muted)"
        hr-section-color: "linear-gradient(90deg, #6366F1, #EC4899, transparent)"
        hr-section-height: "2px"
        hr-subsection-color: "linear-gradient(90deg, rgba(99,102,241,0.4), transparent)"
        hr-subsection-height: "1px"
        hr-accent-color: "#6366F1"

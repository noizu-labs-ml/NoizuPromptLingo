# Stage B screen allocation for NoizuPromptLingo → Stage C render targets.
# 8 themes; unique-set = 40 (clamp(inventory=47, 30, 40)); overlap = 2 comparison
# pairs. Per-theme totals: brutalist/nocturne/prism/meridian = 6, the rest = 5.
# Total image slots = 40 + (2×2) = 44 (within the ~35–45 aim).
# Screens are matched to theme mood; 5 lower-weight screens are intentionally left
# unallocated (03-sso-callback, 16-admin-media-providers, 33-agent-personas-management,
# 37-github-repos-list, 38-github-repo-detail-prs) to keep the unique set at 40.
version: 1
inventory_total: 47

unique:
  # npl-brutalist — raw NPL machinery, structural tooling, loud reference surfaces
  - screen: "42-unicode-npl-glyph-codex"
    theme: "npl-brutalist"
  - screen: "43-npl-conventions-browser"
    theme: "npl-brutalist"
  - screen: "08-mcp-api-keys-setup"
    theme: "npl-brutalist"
  - screen: "40-mock-mcp-builder"
    theme: "npl-brutalist"
  - screen: "27-ticket-field-type-admin"
    theme: "npl-brutalist"

  # npl-editorial — spec/craft reading surfaces (wiki, prompts, artifacts, long detail)
  - screen: "28-wiki-browser"

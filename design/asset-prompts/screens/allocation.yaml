  # Landing page: loud/raw structure vs luminous/premium glass — the widest brand gap.
  - screen: "01-landing-page"
    themes: ["npl-brutalist", "npl-prism"]
  # Org dashboard: cool terminal dark vs warm luxe dark — a direct dark-vs-dark study.
  - screen: "17-org-dashboard"
    themes: ["npl-nocturne", "npl-meridian"]

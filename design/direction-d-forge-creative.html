<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeFresh — Direction D: Forge (Creative)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="module">
    import * as HeadlessUI from 'https://esm.sh/@headlessui/react@2.2.4?external=react,react-dom';
    window.HeadlessUI = HeadlessUI;
    window.dispatchEvent(new Event('headlessui-ready'));
  </script>
  <script crossorigin src="https://noizu.github.io/react-assets/dist/sg.js"></script>
  <link rel="stylesheet" href="https://noizu.github.io/react-assets/dist/sg.css">

  <style>
    /* ═══════════════════════════════════════
       FORGE CREATIVE — CSS FOUNDATION
       ═══════════════════════════════════════ */
    :root {
      --bg-void: #08090D;
      --bg-primary: #0E1017;
      --bg-surface: #151820;
      --bg-elevated: #1D2029;
      --bg-well: #0B0C11;
      --text-primary: #E8E5E0;
      --text-secondary: #908D87;
      --text-tertiary: #5C5A55;
      --text-ghost: #3A3835;
      --border-default: #2A2D33;
      --border-subtle: #1D2029;
      --border-strong: #3D4048;
      --copper: #D4915E;
      --copper-bright: #E8A474;
      --copper-dim: #A06B3F;
      --copper-muted: rgba(212, 145, 94, 0.12);
      --copper-wash: rgba(212, 145, 94, 0.06);
      --eval-pass: #3EC97E;
      --eval-pass-strong: #2DB86A;
      --eval-pass-muted: rgba(62, 201, 126, 0.10);
      --eval-pass-wash: rgba(62, 201, 126, 0.05);
      --eval-warn: #E5C53E;
      --eval-warn-strong: #D4B42D;
      --eval-warn-muted: rgba(229, 197, 62, 0.10);
      --eval-warn-wash: rgba(229, 197, 62, 0.05);
      --eval-fail: #E54E4E;
      --eval-fail-strong: #D43D3D;
      --eval-fail-muted: rgba(229, 78, 78, 0.10);
      --eval-fail-wash: rgba(229, 78, 78, 0.05);
      --eval-freeball: #E8863D;
      --eval-freeball-strong: #D4752C;
      --eval-freeball-muted: rgba(232, 134, 61, 0.10);
      --eval-freeball-wash: rgba(232, 134, 61, 0.05);
      --info: #5DA4E8;
      --info-muted: rgba(93, 164, 232, 0.10);
      --font-sans: 'Plus Jakarta Sans', 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;
      --radius: 6px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
    body {
      font-family: var(--font-sans);
      color: var(--text-primary);
      background: var(--bg-void);
      line-height: 1.6;
    }
    ::selection { background: rgba(212, 145, 94, 0.3); color: #E8E5E0; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ═══ LAYOUT ═══ */
    .forge-wrap { max-width: 1200px; margin: 0 auto; padding: 0 32px; }
    .forge-act { padding: 80px 0 40px; }
    .forge-act + .forge-act { padding-top: 0; }

    /* ═══ CIRCUIT TRACE DIVIDER ═══ */
    .circuit-divider { width: 100%; margin: 48px 0; opacity: 1; }

    /* ═══ TEXTURE BACKGROUND ═══ */
    .has-texture {
      position: relative;
    }
    .has-texture::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 120 24' width='120' height='24' fill='none' stroke='%23D4915E' stroke-width='0.75' opacity='0.04' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 12h20l3-6h14l3 6h10l3 6h14l3-6h10l3-6h14l3 6h20'/%3E%3C/svg%3E");
      background-repeat: repeat;
      pointer-events: none;
      z-index: 0;
    }
    .has-texture > * { position: relative; z-index: 1; }

    /* ═══ ACT HEADINGS ═══ */
    .act-label {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--copper);
      margin-bottom: 8px;
    }
    .act-title {
      font-family: var(--font-sans);
      font-size: 26px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.015em;
      line-height: 1.2;
      margin-bottom: 12px;
    }
    .act-desc {
      font-size: 14px;
      color: var(--text-secondary);
      max-width: 60ch;
      line-height: 1.6;
    }

    /* ═══ HERO ═══ */
    .hero-section {
      padding: 120px 0 80px;
      text-align: center;
      position: relative;
      overflow: hidden;
      background: var(--bg-primary);
      border-bottom: 1.5px solid var(--border-default);
    }
    .hero-wordmark {
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: clamp(56px, 10vw, 120px);
      color: var(--text-primary);
      letter-spacing: -0.03em;
      line-height: 1;
      margin-bottom: 24px;
    }
    .hero-wordmark .dot { color: var(--copper); }
    .hero-manifesto {
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--copper);
      max-width: 48ch;
      margin: 0 auto 48px;
      line-height: 1.5;
    }

    /* ═══ COLOR BAR ═══ */
    .color-bar {
      display: flex;
      height: 48px;
      border-radius: 6px;
      overflow: hidden;
      border: 1.5px solid var(--border-default);
    }
    .color-bar-segment {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      transition: flex 200ms ease;
    }
    .color-bar-segment:hover { flex: 1.5; }

    /* ═══ COLOR CANVAS ═══ */
    .color-canvas {
      background: var(--bg-void);
      border: 1.5px solid var(--border-default);
      border-radius: 6px;
      padding: 32px;
    }
    .color-layer-label {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-ghost);
      margin-bottom: 12px;
    }
    .color-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .color-swatch {
      width: 100px;
      border-radius: 6px;
      overflow: hidden;
      border: 1.5px solid var(--border-default);
      transition: transform 120ms ease;
    }
    .color-swatch:hover { transform: translateY(-2px); }
    .color-swatch-fill {
      height: 48px;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 4px 6px;
    }
    .color-swatch-contrast {
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 500;
      background: rgba(0,0,0,0.5);
      padding: 1px 4px;
      border-radius: 3px;
      color: var(--text-primary);
    }
    .color-swatch-info {
      padding: 6px 8px;
      background: var(--bg-surface);
    }
    .color-swatch-name {
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .color-swatch-hex {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-tertiary);
    }

    /* ═══ PAIRING MATRIX ═══ */
    .pair-matrix {
      display: inline-grid;
      gap: 2px;
      font-family: var(--font-mono);
      font-size: 10px;
    }
    .pair-cell {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      font-size: 14px;
    }
    .pair-cell.ok { background: var(--eval-pass-wash); color: var(--eval-pass); }
    .pair-cell.warn { background: var(--eval-warn-wash); color: var(--eval-warn); }
    .pair-cell.no { background: var(--eval-fail-wash); color: var(--eval-fail); }
    .pair-cell.header {
      background: none;
      color: var(--text-tertiary);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .pair-cell.empty { background: none; }

    /* ═══ VOICE CONVERSATION ═══ */
    .voice-turn {
      display: grid;
      grid-template-columns: 32px 1fr 200px;
      gap: 16px;
      align-items: start;
      padding: 20px 0;
    }
    .voice-turn + .voice-turn { border-top: 1px solid var(--border-subtle); }
    .voice-glyph {
      padding-top: 6px;
      display: flex;
      justify-content: center;
    }
    .voice-spec {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--copper);
      line-height: 1.6;
    }
    .voice-spec span { display: block; }
    .voice-author-text {
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.5;
      color: var(--text-secondary);
      padding: 12px 16px;
      background: var(--bg-well);
      border-radius: 6px;
      border-left: 3px solid var(--border-default);
    }
    .voice-agent-text {
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.7;
      letter-spacing: 0.005em;
      color: var(--text-primary);
      padding: 16px 20px;
      border-left: 3px solid var(--text-tertiary);
    }
    .voice-eval-text {
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      line-height: 1.5;
      letter-spacing: 0.02em;
      color: var(--copper);
      padding: 8px 16px;
      background: var(--copper-wash);
      border-radius: 4px;
      border-left: 3px solid var(--copper-dim);
    }

    /* ═══ TYPE SCALE TABLE ═══ */
    .type-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 32px;
    }
    .type-table th {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      text-align: left;
      padding: 8px 12px;
      border-bottom: 1.5px solid var(--border-default);
    }
    .type-table td {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-secondary);
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-subtle);
      vertical-align: middle;
    }
    .type-table td:first-child {
      font-family: var(--font-sans);
      font-weight: 600;
      color: var(--text-primary);
    }

    /* ═══ ATOM DIAGRAM ═══ */
    .atom-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      padding: 48px 0;
    }
    .atom-node {
      background: var(--bg-surface);
      border: 1.5px solid var(--border-default);
      border-radius: 6px;
      padding: 20px;
      min-width: 200px;
      text-align: center;
      transition: border-color 120ms ease, background 120ms ease, box-shadow 120ms ease;
    }
    .atom-node:hover { border-color: var(--border-strong); }
    .atom-node.selected { border-color: var(--copper); box-shadow: 0 0 0 3px var(--copper-muted); }
    .atom-node.pass { border-color: var(--eval-pass); background: var(--eval-pass-wash); }
    .atom-node.warn { border-color: var(--eval-warn); background: var(--eval-warn-wash); }
    .atom-node.fail { border-color: var(--eval-fail); background: var(--eval-fail-wash); }
    .atom-node.freeball {
      border: 2px dashed var(--eval-freeball);
      background: var(--eval-freeball-wash);
    }
    .atom-node.freeball.pulse {
      animation: freeball-pulse 2s ease-in-out infinite;
    }
    @keyframes freeball-pulse {
      0%, 100% { border-color: var(--eval-freeball); box-shadow: none; }
      50% { border-color: var(--eval-freeball-strong); box-shadow: 0 0 12px var(--eval-freeball-muted); }
    }
    .atom-node .node-label {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 4px;
      color: var(--text-primary);
    }
    .atom-node .node-meta {
      font-size: 12px;
      color: var(--text-secondary);
    }
    .propagation-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      max-width: 800px;
      margin: 0 auto;
    }
    .prop-card {
      background: var(--bg-surface);
      border: 1.5px solid var(--border-default);
      border-radius: 6px;
      padding: 16px;
      text-align: center;
    }
    .prop-card .prop-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    .prop-card .prop-inherit {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--copper);
    }

    /* ═══ NODE STATES ROW ═══ */
    .node-states-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .node-states-row .atom-node {
      min-width: 120px;
      max-width: 160px;
      flex: 1;
      padding: 16px;
    }

    /* ═══ GLYPH GALLERY ═══ */
    .glyph-group {
      margin-bottom: 40px;
    }
    .glyph-group-title {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-ghost);
      margin-bottom: 16px;
    }
    .glyph-row {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }
    .glyph-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 16px 20px;
      background: var(--bg-surface);
      border: 1.5px solid var(--border-default);
      border-radius: 6px;
      min-width: 100px;
    }
    .glyph-sizes {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .glyph-label {
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .glyph-code {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-tertiary);
    }

    /* ═══ BUTTONS ═══ */
    .btn {
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 600;
      padding: 8px 20px;
      border: 1.5px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      transition: all 120ms ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-copper { background: var(--copper); color: var(--bg-void); border-color: var(--copper); }
    .btn-copper:hover { background: var(--copper-bright); border-color: var(--copper-bright); }
    .btn-copper:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-secondary { background: transparent; color: var(--text-primary); border-color: var(--border-default); }
    .btn-secondary:hover { border-color: var(--border-strong); background: var(--bg-elevated); }
    .btn-ghost { background: transparent; color: var(--text-secondary); border: 1.5px solid transparent; }
    .btn-ghost:hover { color: var(--text-primary); }
    .btn-eval { background: transparent; padding: 6px 12px; border: 1.5px solid currentColor; border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer; font-family: var(--font-sans); }
    .btn-eval.pass { color: var(--eval-pass); }
    .btn-eval.warn { color: var(--eval-warn); }
    .btn-eval.fail { color: var(--eval-fail); }
    .btn-eval.freeball { color: var(--eval-freeball); }
    .btn-sm { font-size: 12px; padding: 6px 14px; }
    .btn-lg { font-size: 14px; padding: 12px 28px; }

    /* ═══ INPUTS ═══ */
    .input-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .input-field {
      width: 100%;
      font-family: var(--font-sans);
      font-size: 14px;
      color: var(--text-primary);
      background: var(--bg-well);
      border: 1.5px solid var(--border-default);
      border-radius: 6px;
      padding: 10px 14px;
      outline: none;
      transition: border-color 120ms ease, box-shadow 120ms ease;
    }
    .input-field::placeholder { color: var(--text-tertiary); }
    .input-field:focus { border-color: var(--copper); box-shadow: 0 0 0 3px var(--copper-muted); }
    .input-field.error { border-color: var(--eval-fail); box-shadow: 0 0 0 3px var(--eval-fail-muted); }
    .input-field.code { font-family: var(--font-mono); font-size: 13px; }
    .input-hint {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-tertiary);
      margin-top: 4px;
    }
    .input-hint.error { color: var(--eval-fail); }

    /* ═══ NAVIGATION ═══ */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      height: 52px;
      background: var(--bg-void);
      border: 1.5px solid var(--border-default);
      border-radius: 6px;
    }
    .topbar-left { display: flex; align-items: center; gap: 24px; }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .logo { font-family: var(--font-sans); font-size: 16px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.01em; }
    .logo .dot { color: var(--copper); }
    .nav-tabs { display: flex; gap: 4px; }
    .nav-tab {
      padding: 14px 16px;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 400;
      color: var(--text-secondary);
      border: none;
      border-bottom: 2px solid transparent;
      background: none;
      cursor: pointer;
      transition: color 120ms ease;
    }
    .nav-tab:hover { color: var(--text-primary); }
    .nav-tab.active { color: var(--copper); border-bottom-color: var(--copper); font-weight: 600; }
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 24px;
      background: var(--bg-primary);
      border: 1.5px solid var(--border-subtle);
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 12px;
    }
    .breadcrumb-item { color: var(--text-secondary); }
    .breadcrumb-item.current { color: var(--copper); font-weight: 500; }
    .breadcrumb-sep { color: var(--text-ghost); }
    .cmd-trigger {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border: 1.5px solid var(--border-default);
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-tertiary);
      background: none;
      cursor: pointer;
    }

    /* ═══ SCORE BADGES ═══ */
    .score-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
    }
    .score-badge.pass { background: var(--eval-pass-muted); color: var(--eval-pass); }
    .score-badge.warn { background: var(--eval-warn-muted); color: var(--eval-warn); }
    .score-badge.fail { background: var(--eval-fail-muted); color: var(--eval-fail); }
    .score-badge.freeball { background: var(--eval-freeball-muted); color: var(--eval-freeball); border: 1px dashed var(--eval-freeball); }
    .score-bar { width: 40px; height: 4px; background: var(--bg-well); border-radius: 2px; overflow: hidden; display: inline-block; vertical-align: middle; }
    .score-bar-fill { height: 100%; border-radius: 2px; }

    /* ═══ PERSONA TAGS ═══ */
    .tag {
      display: inline-flex;
      padding: 2px 8px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      background: var(--bg-elevated);
      color: var(--text-secondary);
      border: 1px solid var(--border-subtle);
    }
    .tag.hostile { color: var(--eval-fail); border-color: var(--eval-fail-muted); }
    .tag.confused { color: var(--eval-warn); border-color: var(--eval-warn-muted); }
    .tag.adversarial { color: var(--eval-freeball); border-color: var(--eval-freeball-muted); }
    .tag.broken-english { color: var(--info); border-color: var(--info-muted); }

    /* ═══ HEADLESS UI ═══ */
    .hui-menu-button {
      background: var(--bg-surface);
      color: var(--text-primary);
      border: 1.5px solid var(--border-default);
      border-radius: 6px;
      padding: 8px 16px;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .hui-menu-items {
      background: var(--bg-elevated);
      border: 1.5px solid var(--border-default);
      border-radius: 6px;
      padding: 4px;
      min-width: 180px;
      margin-top: 4px;
    }
    .hui-menu-item {
      display: block;
      width: 100%;
      text-align: left;
      padding: 8px 12px;
      font-size: 13px;
      color: var(--text-secondary);
      background: none;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-family: var(--font-sans);
    }
    .hui-menu-item:hover { background: var(--copper-wash); color: var(--text-primary); }
    .hui-menu-item.danger { color: var(--eval-fail); }
    .hui-menu-item.danger:hover { background: var(--eval-fail-wash); }
    .hui-menu-separator { height: 1px; background: var(--border-subtle); margin: 4px 0; }

    .hui-disclosure { border: 1.5px solid var(--border-default); border-radius: 6px; margin-bottom: 8px; overflow: hidden; }
    .hui-disclosure.open { border-color: var(--copper-dim); }
    .hui-disclosure-button {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 12px 16px;
      background: var(--bg-surface);
      color: var(--text-primary);
      border: none;
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    .hui-disclosure-arrow { font-size: 10px; color: var(--text-tertiary); transition: transform 120ms ease; }
    .hui-disclosure.open .hui-disclosure-arrow { transform: rotate(180deg); }
    .hui-disclosure-panel {
      padding: 12px 16px;
      font-size: 14px;
      color: var(--text-secondary);
      background: var(--bg-primary);
      border-top: 1px solid var(--border-subtle);
    }

    .hui-tab-group { display: flex; gap: 4px; margin-bottom: 16px; }
    .hui-tab {
      padding: 8px 16px;
      background: none;
      border: 1.5px solid var(--border-default);
      border-radius: 6px;
      color: var(--text-secondary);
      font-family: var(--font-sans);
      font-size: 13px;
      cursor: pointer;
    }
    .hui-tab:hover { border-color: var(--border-strong); color: var(--text-primary); }
    .hui-tab.selected { background: var(--copper-wash); border-color: var(--copper); color: var(--copper); font-weight: 600; }
    .hui-tab-panel {
      padding: 16px;
      background: var(--bg-surface);
      border: 1.5px solid var(--border-default);
      border-radius: 6px;
      font-size: 14px;
      color: var(--text-secondary);
    }

    .hui-switch-label { display: flex; align-items: center; gap: 12px; }
    .hui-switch {
      width: 44px;
      height: 24px;
      border-radius: 12px;
      background: var(--bg-well);
      border: 1.5px solid var(--border-default);
      position: relative;
      cursor: pointer;
      padding: 0;
      transition: all 120ms ease;
    }
    .hui-switch.checked { background: var(--copper); border-color: var(--copper); }
    .hui-switch-thumb {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--text-primary);
      transition: transform 120ms ease;
    }
    .hui-switch.checked .hui-switch-thumb { transform: translateX(20px); background: var(--bg-void); }

    /* ═══ FORGE SEQUENCE ═══ */
    .forge-graph {
      display: flex;
      align-items: center;
      gap: 0;
      justify-content: center;
      padding: 32px 0;
      overflow-x: auto;
    }
    .forge-edge {
      width: 48px;
      height: 2px;
      background: var(--border-default);
      position: relative;
      transition: background 200ms ease;
      flex-shrink: 0;
    }
    .forge-edge.lit { background: var(--copper); }
    .forge-edge::after {
      content: '';
      position: absolute;
      right: -4px;
      top: -3px;
      width: 0;
      height: 0;
      border-left: 6px solid var(--border-default);
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
      transition: border-left-color 200ms ease;
    }
    .forge-edge.lit::after { border-left-color: var(--copper); }
    .forge-node {
      background: var(--bg-surface);
      border: 1.5px solid var(--border-default);
      border-radius: 6px;
      padding: 14px 18px;
      min-width: 130px;
      text-align: center;
      transition: all 200ms ease;
      flex-shrink: 0;
    }
    .forge-node.dark {
      background: var(--bg-well);
      border-color: var(--border-subtle);
    }
    .forge-node.dark .node-label,
    .forge-node.dark .node-meta { color: var(--text-ghost); }
    .forge-node .score-fade {
      opacity: 0;
      transition: opacity 300ms ease;
      margin-top: 8px;
    }
    .forge-node .score-fade.visible { opacity: 1; }

    /* ═══ SCREEN MOCKUPS ═══ */
    .screen-frame {
      border: 1.5px solid var(--border-default);
      border-radius: 8px;
      overflow: hidden;
      background: var(--bg-void);
    }
    .screen-chrome {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background: var(--bg-primary);
      border-bottom: 1px solid var(--border-default);
    }
    .screen-dots {
      display: flex;
      gap: 6px;
    }
    .screen-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--border-default);
    }
    .screen-url {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-tertiary);
      background: var(--bg-well);
      padding: 3px 12px;
      border-radius: 4px;
    }
    .screen-topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      height: 44px;
      background: var(--bg-void);
      border-bottom: 1.5px solid var(--border-default);
    }
    .screen-breadcrumb-inner {
      padding: 8px 16px;
      background: var(--bg-primary);
      border-bottom: 1px solid var(--border-subtle);
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-secondary);
    }
    .screen-workspace-inner {
      padding: 24px;
      background: var(--bg-primary);
      min-height: 280px;
    }

    /* ═══ COMPONENT SHOWCASE ROW ═══ */
    .component-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 24px;
    }
    .component-section {
      margin-bottom: 40px;
    }
    .component-label {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-ghost);
      margin-bottom: 12px;
    }

    /* ═══ SG OVERRIDES ═══ */
    .style-guide .sg-screen-frame { background: var(--bg-surface); border-color: var(--border-default); }
    .style-guide .sg-screen-chrome { background: var(--bg-primary); border-color: var(--border-default); }
    .style-guide .sg-screen-url { background: var(--bg-well); color: var(--text-tertiary); }

    /* ═══ RESPONSIVE ═══ */
    @media (max-width: 768px) {
      .forge-wrap { padding: 0 16px; }
      .voice-turn { grid-template-columns: 24px 1fr; }
      .voice-spec { display: none; }
      .hero-wordmark { font-size: 48px; }
      .forge-graph { flex-direction: column; }
      .forge-edge { width: 2px; height: 32px; }
    }
  </style>
</head>
<body class="style-guide forge-creative">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    /* ═══════════════════════════════════════
       SHARED SVG COMPONENTS
       ═══════════════════════════════════════ */

    const CircuitDivider = () => (

    const SealGlyph = ({size = 24, color = 'currentColor'}) => (

    const DriftGlyph = ({size = 24, color = 'currentColor'}) => (

        <rect x="3" y="5" width="18" height="14" rx="3" strokeDasharray="4 3"/>

    const PromptGlyph = ({size = 16, color = 'currentColor'}) => (

    const EyeGlyph = ({size = 16, color = 'currentColor'}) => (

        <circle cx="8" cy="8" r="5.5"/>

    const GaugeGlyph = ({size = 16, color = 'currentColor'}) => (
      <svg viewBox="0 0 16 16" width={size} height={size} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
        <path d="M3 11a5.5 5.5 0 0110 0"/>

    const BranchGlyph = ({size = 24, color = 'currentColor'}) => (
      <svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="6" cy="12" r="2.5"/>
        <circle cx="18" cy="7" r="2.5"/>
        <circle cx="18" cy="17" r="2.5"/>
        <path d="M8.5 11l5 -3.5"/>

    const TerminalGlyph = ({size = 24, color = 'currentColor'}) => (
      <svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round">
        <circle cx="12" cy="12" r="6"/>
        <circle cx="12" cy="12" r="3" fill={color} stroke="none"/>

    const EdgeArrowGlyph = ({size = 12, color = 'currentColor'}) => (
      <svg viewBox="0 0 12 10" width={size} height={Math.round(size * 10/12)} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
        <path d="M1 1l5 4-5 4"/>

    const FreeballArrowGlyph = ({size = 16, color = 'currentColor'}) => (
      <svg viewBox="0 0 16 10" width={size} height={Math.round(size * 10/16)} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
        <path d="M1 1l5 4-5 4"/>
        <line x1="10" y1="2" x2="10" y2="8"/>
      </svg>
    );


    /* ═══════════════════════════════════════
       ACT 1: THE FORGE — IDENTITY
       ═══════════════════════════════════════ */

    function ActTheForge() {
      return (
        <div className="hero-section has-texture">
          <div className="forge-wrap">
            <div className="hero-wordmark">
              codefre<span className="dot">.</span>sh
            </div>
            <CircuitDivider />
            <p className="hero-manifesto">
              Eval-first design. The product IS the visual system. Every color, every radius, every typographic voice grows from the conversation graph outward.
            </p>
            <div className="color-bar" style={{maxWidth: 600, margin: '0 auto'}}>
              <div className="color-bar-segment" style={{background: '#D4915E', color: '#08090D'}}>Copper</div>
              <div className="color-bar-segment" style={{background: '#3EC97E', color: '#08090D'}}>Pass</div>
              <div className="color-bar-segment" style={{background: '#E5C53E', color: '#08090D'}}>Warn</div>
              <div className="color-bar-segment" style={{background: '#E54E4E', color: '#fff'}}>Fail</div>
              <div className="color-bar-segment" style={{background: '#E8863D', color: '#08090D'}}>Freeball</div>
            </div>
          </div>
        </div>
      );
    }


    /* ═══════════════════════════════════════
       ACT 2: THE PALETTE — COLOR AS PRODUCT
       ═══════════════════════════════════════ */

    function ActThePalette() {
      const bgColors = [
        { name: 'Void', hex: '#08090D', contrast: '---' },
        { name: 'Primary', hex: '#0E1017', contrast: '---' },
        { name: 'Surface', hex: '#151820', contrast: '---' },
        { name: 'Elevated', hex: '#1D2029', contrast: '---' },
        { name: 'Well', hex: '#0B0C11', contrast: '---' },
      ];
      const textColors = [
        { name: 'Primary', hex: '#E8E5E0', contrast: '14.8:1' },
        { name: 'Secondary', hex: '#908D87', contrast: '5.4:1' },
        { name: 'Tertiary', hex: '#5C5A55', contrast: '3.1:1' },
        { name: 'Ghost', hex: '#3A3835', contrast: '1.8:1' },
      ];
      const accentColors = [
        { name: 'Copper', hex: '#D4915E', contrast: '7.2:1' },
        { name: 'Bright', hex: '#E8A474', contrast: '8.8:1' },
        { name: 'Dim', hex: '#A06B3F', contrast: '4.6:1' },
      ];
      const evalColors = [
        { name: 'Pass', hex: '#3EC97E', contrast: '8.9:1' },
        { name: 'Warn', hex: '#E5C53E', contrast: '10.8:1' },
        { name: 'Fail', hex: '#E54E4E', contrast: '4.5:1' },
        { name: 'Freeball', hex: '#E8863D', contrast: '6.8:1' },
      ];

      const Swatch = ({name, hex, contrast, textColor}) => (
        <div className="color-swatch">
          <div className="color-swatch-fill" style={{background: hex}}>
            {contrast && contrast !== '---' && (
              <span className="color-swatch-contrast">{contrast}</span>
            )}
          </div>
          <div className="color-swatch-info">
            <div className="color-swatch-name">{name}</div>
            <div className="color-swatch-hex">{hex}</div>
          </div>
        </div>
      );

      // Pairing matrix data
      const pairLabels = ['Cu', 'Ps', 'Wn', 'Fl', 'Fb'];
      const pairData = [
        // Cu  Ps  Wn  Fl  Fb
        ['--', 'ok', 'ok', 'ok', 'no'],  // Cu
        ['ok', '--', 'ok', 'ok', 'ok'],  // Ps
        ['ok', 'ok', '--', 'ok', 'ok'],  // Wn
        ['ok', 'ok', 'ok', '--', 'ok'],  // Fl
        ['no', 'ok', 'ok', 'ok', '--'],  // Fb
      ];

      return (
        <div className="forge-act">
          <div className="forge-wrap">
            <div className="act-label">The Palette</div>
            <div className="act-title">Color as Product</div>
            <p className="act-desc" style={{marginBottom: 32}}>
              The palette is built outward from the four eval states. Warm-shifted backgrounds create a neutral field where pass, warn, fail, and freeball pop equally. Copper connects them.
            </p>

            <div className="color-canvas">
              <div className="color-layer-label">Base layer: Backgrounds (warm ink)</div>
              <div className="color-row">
                {bgColors.map(c => <Swatch key={c.name} {...c} />)}
              </div>

              <div className="color-layer-label">Text layer: Warm white</div>
              <div className="color-row">
                {textColors.map(c => <Swatch key={c.name} {...c} />)}
              </div>

              <div className="color-layer-label">Accent: Copper</div>
              <div className="color-row">
                {accentColors.map(c => <Swatch key={c.name} {...c} />)}
              </div>

              <div className="color-layer-label">Signal layer: Eval states</div>
              <div className="color-row">
                {evalColors.map(c => <Swatch key={c.name} {...c} />)}
              </div>

              <div className="color-layer-label">Borders</div>
              <div className="color-row">
                <Swatch name="Default" hex="#2A2D33" />
                <Swatch name="Subtle" hex="#1D2029" />
                <Swatch name="Strong" hex="#3D4048" />
              </div>
            </div>

            <div style={{marginTop: 40}}>
              <div className="act-label">Color Pairing Matrix</div>
              <p style={{fontSize: 13, color: 'var(--text-secondary)', marginBottom: 16, maxWidth: '50ch'}}>
                Which signal colors can sit adjacent. Copper and Freeball share warm-orange territory and must never be placed side by side without a separator.
              </p>
              <div className="pair-matrix" style={{gridTemplateColumns: `repeat(${pairLabels.length + 1}, 36px)`}}>
                <div className="pair-cell empty"></div>
                {pairLabels.map(l => <div key={l} className="pair-cell header">{l}</div>)}
                {pairData.map((row, ri) => (
                  <React.Fragment key={ri}>
                    <div className="pair-cell header">{pairLabels[ri]}</div>
                    {row.map((v, ci) => (
                      <div key={ci} className={`pair-cell ${v === 'ok' ? 'ok' : v === 'no' ? 'no' : ''}`} style={v === '--' ? {background: 'var(--bg-elevated)', color: 'var(--text-ghost)'} : {}}>
                        {v === 'ok' ? '\u2713' : v === 'no' ? '\u26A0' : '\u2022'}
                      </div>
                    ))}
                  </React.Fragment>
                ))}
              </div>
            </div>

            <div style={{marginTop: 32}}>
              <div style={{display: 'flex', gap: 16, flexWrap: 'wrap', fontSize: 12, color: 'var(--text-tertiary)', fontFamily: 'var(--font-mono)'}}>
                <span>Dark mode only</span>
                <span style={{color: 'var(--text-ghost)'}}>|</span>
                <span>No gradients</span>
                <span style={{color: 'var(--text-ghost)'}}>|</span>
                <span>Eval colors louder than accent</span>
                <span style={{color: 'var(--text-ghost)'}}>|</span>
                <span>4 depth steps: void &rarr; primary &rarr; surface &rarr; elevated</span>
              </div>
            </div>
          </div>
          <CircuitDivider />
        </div>
      );
    }


    /* ═══════════════════════════════════════
       ACT 3: THE VOICES — TYPOGRAPHY
       ═══════════════════════════════════════ */

    function ActTheVoices() {
      return (
        <div className="forge-act">
          <div className="forge-wrap">
            <div className="act-label">The Voices</div>
            <div className="act-title">Typography as Character</div>
            <p className="act-desc" style={{marginBottom: 32}}>

            <div style={{background: 'var(--bg-primary)', border: '1.5px solid var(--border-default)', borderRadius: 6, padding: '8px 0', maxWidth: 900}}>

              <div className="voice-turn">

                <div>

                  <div className="voice-author-text">

                  </div>
                </div>
                <div className="voice-spec">
                  <span>JetBrains Mono</span>
                  <span>13px / 400</span>
                  <span>line-height: 1.5</span>
                  <span>color: --text-secondary</span>
                  <span>bg: --bg-well</span>
                  <span>border-left: --border-default</span>
                </div>
              </div>

              {/* Turn 2: Agent */}
              <div className="voice-turn">
                <div className="voice-glyph" style={{color: 'var(--text-primary)'}}>
                  <EyeGlyph size={16} />
                </div>
                <div>
                  <div style={{fontFamily: 'var(--font-mono)', fontSize: 10, color: 'var(--text-ghost)', textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: 6}}>The Eye &mdash; Agent Under Test</div>
                  <div className="voice-agent-text">
                    I'd be happy to help you understand our pricing! We have three plans available. Before I walk through them, could you tell me a bit about how large your team is? That way I can recommend the best fit.
                  </div>
                </div>
                <div className="voice-spec">
                  <span>Plus Jakarta Sans</span>
                  <span>15px / 400</span>
                  <span>line-height: 1.7</span>
                  <span>letter-spacing: 0.005em</span>
                  <span>color: --text-primary</span>
                  <span>border-left: --text-tertiary</span>
                </div>
              </div>

              {/* Turn 3: Evaluator */}
              <div className="voice-turn">
                <div className="voice-glyph" style={{color: 'var(--copper)'}}>
                  <GaugeGlyph size={16} />
                </div>
                <div>
                  <div style={{fontFamily: 'var(--font-mono)', fontSize: 10, color: 'var(--text-ghost)', textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: 6}}>The Gauge &mdash; Evaluator</div>
                  <div className="voice-eval-text">
                    asks clarifying questions: 0.92 &nbsp;|&nbsp; does not correct grammar: 1.00 &nbsp;|&nbsp; professional tone: 0.95
                  </div>
                </div>
                <div className="voice-spec">
                  <span>Plus Jakarta Sans</span>
                  <span>12px / 500</span>
                  <span>line-height: 1.5</span>
                  <span>letter-spacing: 0.02em</span>
                  <span>color: --copper</span>
                  <span>bg: --copper-wash</span>
                </div>
              </div>
            </div>

            {/* Type scale reference */}
            <table className="type-table">
              <thead>

        fail: { border: 'var(--eval-fail)', bg: 'var(--eval-fail-wash)' },
        freeball: { border: 'var(--eval-freeball)', bg: 'var(--eval-freeball-wash)' },
      };

      const badgeClass = {
        pass: 'pass', warn: 'warn', fail: 'fail', freeball: 'freeball',
      };

      const [phase, setPhase] = useState('idle'); // idle | dark | running | done
      const [litIndex, setLitIndex] = useState(-1);
      const [showScores, setShowScores] = useState(false);
      const timerRef = useRef(null);

      const runSequence = useCallback(() => {
        if (prefersReduced) {
          setPhase('done');
          setLitIndex(nodes.length - 1);
          setShowScores(true);
          return;
        }

        // Phase 1: darken all
        setPhase('dark');
        setLitIndex(-1);
        setShowScores(false);

        setTimeout(() => {
          setPhase('running');
          let i = 0;
          const step = () => {
            setLitIndex(i);
            i++;
            if (i < nodes.length) {
              timerRef.current = setTimeout(step, 120);
            } else {
              timerRef.current = setTimeout(() => {
                setPhase('done');
                setShowScores(true);
              }, 300);
            }
          };
          timerRef.current = setTimeout(step, 100);
        }, 200);
      }, [prefersReduced]);

      const reset = () => {
        clearTimeout(timerRef.current);
        setPhase('idle');
        setLitIndex(-1);
        setShowScores(false);
      };

      const getNodeStyle = (index) => {
        if (phase === 'idle') return {};
        if (phase === 'dark') return { background: 'var(--bg-well)', borderColor: 'var(--border-subtle)' };
        if (phase === 'running' || phase === 'done') {
          if (index <= litIndex) {
            const st = stateColors[nodes[index].evalState];
            const extra = nodes[index].evalState === 'freeball'
              ? { borderStyle: 'dashed', borderWidth: '2px' }
              : {};
            return { borderColor: st.border, background: st.bg, ...extra };
          }
          return { background: 'var(--bg-well)', borderColor: 'var(--border-subtle)' };
        }
        return {};
      };

      const getEdgeClass = (index) => {
        if ((phase === 'running' || phase === 'done') && index <= litIndex - 1) return 'forge-edge lit';
        return 'forge-edge';
      };

      const getLabelStyle = (index) => {
        if (phase === 'dark') return { color: 'var(--text-ghost)' };
        if ((phase === 'running' || phase === 'done') && index > litIndex) return { color: 'var(--text-ghost)' };
        return {};
      };

      return (
        <div className="forge-act has-texture" style={{background: 'var(--bg-primary)', padding: '64px 0'}}>
          <div className="forge-wrap">
            <div className="act-label">The Forge Sequence</div>
            <div className="act-title">Motion as Narrative</div>
            <p className="act-desc" style={{marginBottom: 32}}>
              The forge sequence is the signature animation. Nodes go dark, then illuminate to their eval state one by one as the evaluation path propagates through the graph.
            </p>

            <div style={{textAlign: 'center', marginBottom: 24}}>
              {phase === 'idle' || phase === 'done' ? (
                <div style={{display: 'flex', gap: 12, justifyContent: 'center'}}>
                  <button className="btn btn-copper" onClick={runSequence}>
                    {'\u25B6'} Run Forge Sequence
                  </button>
                  {phase === 'done' && (
                    <button className="btn btn-secondary" onClick={reset}>Reset</button>
                  )}
                </div>
              ) : (
                <span style={{fontFamily: 'var(--font-mono)', fontSize: 12, color: 'var(--copper)'}}>
                  Evaluating...
                </span>
              )}
            </div>

            <div className="forge-graph">
              {nodes.map((node, i) => (
                <React.Fragment key={node.id}>
                  <div className="forge-node" style={getNodeStyle(i)}>
                    <div className="node-label" style={getLabelStyle(i)}>{node.id}</div>
                    <div className="node-meta" style={getLabelStyle(i)}>
                      {node.evalState === 'freeball' ? 'off-script' : `${nodes.length - i} expects`}
                    </div>
                    <div className={`score-fade ${showScores ? 'visible' : ''}`}>
                      <span className={`score-badge ${badgeClass[node.evalState]}`} style={{fontSize: 10, padding: '1px 6px'}}>
                        {node.score}
                      </span>
                    </div>
                  </div>
                  {i < nodes.length - 1 && (
                    <div className={getEdgeClass(i)} />
                  )}
                </React.Fragment>
              ))}
            </div>
          </div>
          <CircuitDivider />
        </div>
      );
    }

name: CI

# Build on native amd64 (colo target), validate, push sha-tagged images, bump
# the chart — ArgoCD (app "npl-mcp") rolls it out from main.
# Pattern: therobotlearns.com/.github/workflows/ci.yml

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ops.noizu.com

jobs:
  test-backend:
    runs-on: ubuntu-latest # amd64
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # timescaledb-ha bundles postgis + pgvector, matching prod
        # (app-timescaledb); plain postgres:16 lacks the vector extension
        # and fails changelog 000-extensions.
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: noizu_prompt_lingua
          POSTGRES_PASSWORD: npl_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U noizu_prompt_lingua"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        # TokenStore refresh-JTIs, Notifications delivery rate-limit, chat
        # presence etc. talk to Redis at runtime even under --exclude redis
        # (config default redis://localhost:6379/0 — see backend/config.exs).
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "28"
      - uses: actions/cache@v4
        with:
          path: |
            backend/deps
            backend/_build
          key: mix-${{ runner.os }}-${{ hashFiles('backend/mix.lock') }}
          restore-keys: mix-${{ runner.os }}-
      - run: mix deps.get
      - run: mix compile
      # Liquibase owns the base schema; Ecto migrations are supplementary.
      # MIX_ENV=test so ecto.create makes noizu_prompt_lingua_test — the DB the
      # changelog is applied against (see backend/config/test.exs).
      - run: MIX_ENV=test mix ecto.create --quiet
      - name: Apply base schema (Liquibase)
        run: |
          docker run --rm --network host \
            -v "$PWD/db:/liquibase/workdir" -w /liquibase/workdir \
            liquibase/liquibase:4.29 \
            --url="jdbc:postgresql://localhost:5432/noizu_prompt_lingua_test" \
            --username=noizu_prompt_lingua --password=npl_dev \
            --changeLogFile=changelog/db.changelog-master.yaml \
            update
      # :memory hits live Weaviate (Cloudflare-Access-authed; unauthed in CI) —
      # excluded in CI; run locally with Weaviate access to exercise it.
      # Redis-tagged tests run: a redis service container is provided above.
      # :live_trp (ContractLiveTest) hits a real TRP deployment via
      # TRP_LIVE_CONTRACT_URL/KEY — CI has neither; excluded here, run at
      # activation per the module doc.
      - run: mix test --exclude memory --exclude live_trp

  test-frontend:
    # Smoke only: npm ci + tsc. Not a full Next build and not Cypress.
    # npm ci talks to npm.noizu.com — cap so a dead registry cannot sit 40+ min.
    timeout-minutes: 10
    runs-on: ubuntu-latest # amd64
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Next config must be TypeScript (standalone)
        # next.config.js wins over next.config.ts and the leftover Phoenix
        # static export used distDir: '../src/npl_mcp/web/static', which
        # crashes Next 16 Turbopack in docker build-push.
        run: |
          if [ -f next.config.js ] || [ -f next.config.mjs ]; then
            echo "next.config.js/.mjs would override next.config.ts and break the image build" >&2
            ls -l next.config.* >&2
            exit 1
          fi
          if [ -d app ]; then
            echo "root frontend/app/ would win over src/app and break next build" >&2
            exit 1
          fi
          test -f next.config.ts
          grep -q 'output: "standalone"' next.config.ts
      - run: npx tsc --noEmit

  build-push:
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/npl-mcp/server:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://tobor.locker
          secrets: |
            npm_token=${{ secrets.NPM_TOKEN }}
          tags: ${{ env.REGISTRY }}/npl-mcp/frontend:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  bump-chart:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Need write credentials on main so the tag bump can push.
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.sha }}
      - name: Install yq
        # ubuntu-latest does not ship mikefarah/yq; without this the bump job
        # fails and helm tags stay split (backend v1.0.* vs frontend sha-*).
        run: |
          sudo curl -fsSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version
      - name: Bump image tags
        # yq, not sed — the chart nests repository/tag, and a bare `tag:` sed
        # would also clobber .liquibase.image.tag (manually versioned, job off).
        run: |
          SHORT=${GITHUB_SHA::7}
          yq -i ".backend.image.tag = \"sha-${SHORT}\"" helm/npl-mcp/values.yaml
          yq -i ".frontend.image.tag = \"sha-${SHORT}\"" helm/npl-mcp/values.yaml
          echo "backend.image.tag=$(yq -r '.backend.image.tag' helm/npl-mcp/values.yaml)"
          echo "frontend.image.tag=$(yq -r '.frontend.image.tag' helm/npl-mcp/values.yaml)"
      - name: Commit & push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "npl-mcp-ci"
          git config user.email "ci@noizu.com"
          git add helm/npl-mcp/values.yaml
          git diff --cached --quiet && exit 0
          git commit -m "ci: deploy sha-${GITHUB_SHA::7} [skip ci]"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin HEAD:main

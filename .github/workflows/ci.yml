name: CI

# Build on native amd64 (colo target): image builds start immediately on push
# (parallel to the test jobs) and publish candidate `-rc` tags; once tests
# pass, a promote job re-tags the candidates to the final sha tags (no
# rebuild) and the chart bump follows — ArgoCD (app "npl-mcp") rolls it out
# from main.
# Stage lane: pushes to `stage` build sha-<short>-stage images and bump
# values-stage.yaml — ArgoCD (app "npl-mcp-stage") rolls those to
# tobor-stage.noizu.com. Main-gated jobs below are untouched by the stage path.
# `feat/tool-sets-integration` pushes gate the integration merge through the
# test jobs only — every image-build job stays ref-gated (main / stage).
# Pattern: therobotlearns.com/.github/workflows/ci.yml
#
# Push triggers: `stage` drives the stage lane (build-push-stage /
# bump-chart-stage — its jobs are refs/heads/stage-gated); the 7e70c1194
# e2e-stage-lane merge accidentally dropped it from this list while keeping
# the jobs. `feat/tool-sets-integration` gates the integration merge through
# the test jobs only — every image-build job stays ref-gated (main / stage).

on:
  push:
    # develop: test jobs only (no image job is develop-gated) — seeds
    # develop-ref mix/npm caches that feature-PR runs can restore (PR-ref
    # caches are invisible to sibling PRs).
    branches: [main, develop, stage, feat/tool-sets-integration]
  pull_request:
  # Manual "exhaustive" full-suite run (test-backend-exhaustive below); the
  # push gate runs only the curated smoke subset.
  workflow_dispatch: {}
  # Nightly on the default branch (main): exhaustive full suite (regression +
  # full-pass coverage report) and cache warming. GHA evicts caches unused for
  # 7 days and main only reads main-ref caches, so releases weeks apart built
  # cold; the nightly keeps main's mix/npm/buildx caches alive. Every image
  # push / chart bump job stays gated on `github.event_name == 'push'`.
  schedule:
    - cron: "23 7 * * *"

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs only — never a main/stage push (those carry the
  # build-promote-bump release lane).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ops.noizu.com

jobs:
  test-backend:
    runs-on: ubuntu-latest # amd64
    env:
      MIX_ENV: test
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # timescaledb-ha bundles postgis + pgvector, matching prod
        # (app-timescaledb); plain postgres:16 lacks the vector extension
        # and fails changelog 000-extensions.
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: noizu_prompt_lingua
          POSTGRES_PASSWORD: npl_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U noizu_prompt_lingua"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        # TokenStore refresh-JTIs, Notifications delivery rate-limit, chat
        # presence etc. talk to Redis at runtime even under --exclude redis
        # (config default redis://localhost:6379/0 — see backend/config.exs).
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: "1.19.5"
          otp-version: "28"
      # Saved every run (sha suffix) so _build/test tracks the latest source:
      # the exact lock-hash key never re-saved after its first hit, so a stale
      # _build forced a near-full recompile on every run.
      - uses: actions/cache@v4
        with:
          path: |
            backend/deps
            backend/_build
          key: mix-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('backend/mix.lock') }}-${{ github.sha }}
          restore-keys: |
            mix-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('backend/mix.lock') }}-
            mix-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-
      - run: mix deps.get
      # Compile once, in the test env the suite runs in (a bare `mix compile`
      # built :dev — unused — and ecto.create then recompiled everything for
      # :test: ~170s + ~170s cold).
      - run: mix compile
      # Liquibase owns the base schema; Ecto migrations are supplementary.
      # MIX_ENV=test so ecto.create makes noizu_prompt_lingua_test — the DB the
      # changelog is applied against (see backend/config/test.exs).
      - run: mix ecto.create --quiet
      - name: Apply base schema (Liquibase)
        run: |
          docker run --rm --network host \
            -v "$PWD/db:/liquibase/workdir" -w /liquibase/workdir \
            liquibase/liquibase:4.29 \
            --url="jdbc:postgresql://localhost:5432/noizu_prompt_lingua_test" \
            --username=noizu_prompt_lingua --password=npl_dev \
            --changeLogFile=changelog/db.changelog-master.yaml \
            update
      # PUSH GATE = smoke subset (mix smoke, ~20s of tests): curated hermetic
      # suites only — no Weaviate / TRP / LLM-provider-key / external-network
      # dependencies. The full exhaustive suite runs via workflow_dispatch
      # (test-backend-exhaustive) and locally (`mix test`); it IS currently
      # green in CI too (sha af2683bfe), but the gate stays fast so a
      # host-dependent test can never block a stage deploy again.
      # MIX_ENV is pinned because aliases do not inherit `mix test`'s builtin
      # test-env default (without it dev.exs' tobor_locker user leaks in).
      # --cover: ExCoveralls summary + coverage gate (backend/coveralls.json
      # minimum_coverage). Alias args append to the alias' last task (`test`).
      - run: mix smoke --cover 2>&1 | tee smoke-coverage.txt
        shell: bash -o pipefail {0}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-smoke
          path: backend/smoke-coverage.txt
          if-no-files-found: ignore

  test-backend-exhaustive:
    # Manual full-suite run: `gh workflow run ci.yml` (Actions → CI → Run
    # workflow). Same env as the smoke gate — must stay green via test-level
    # hermetic hardening, never env-dependent passes. Not a push gate; no job
    # depends on it.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest # amd64
    env:
      MIX_ENV: test
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # timescaledb-ha bundles postgis + pgvector, matching prod
        # (app-timescaledb); plain postgres:16 lacks the vector extension
        # and fails changelog 000-extensions.
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: noizu_prompt_lingua
          POSTGRES_PASSWORD: npl_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U noizu_prompt_lingua"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        # TokenStore refresh-JTIs, Notifications delivery rate-limit, chat
        # presence etc. talk to Redis at runtime even under --exclude redis
        # (config default redis://localhost:6379/0 — see backend/config.exs).
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: "1.19.5"
          otp-version: "28"
      # Saved every run (sha suffix) so _build/test tracks the latest source:
      # the exact lock-hash key never re-saved after its first hit, so a stale
      # _build forced a near-full recompile on every run.
      - uses: actions/cache@v4
        with:
          path: |
            backend/deps
            backend/_build
          key: mix-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('backend/mix.lock') }}-${{ github.sha }}
          restore-keys: |
            mix-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('backend/mix.lock') }}-
            mix-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-
      - run: mix deps.get
      # Compile once, in the test env the suite runs in (a bare `mix compile`
      # built :dev — unused — and ecto.create then recompiled everything for
      # :test: ~170s + ~170s cold).
      - run: mix compile
      - run: mix ecto.create --quiet
      - name: Apply base schema (Liquibase)
        run: |
          docker run --rm --network host \
            -v "$PWD/db:/liquibase/workdir" -w /liquibase/workdir \
            liquibase/liquibase:4.29 \
            --url="jdbc:postgresql://localhost:5432/noizu_prompt_lingua_test" \
            --username=noizu_prompt_lingua --password=npl_dev \
            --changeLogFile=changelog/db.changelog-master.yaml \
            update
      # :memory hits live Weaviate (Cloudflare-Access-authed; unauthed in CI) —
      # excluded in CI; run locally with Weaviate access to exercise it.
      # Redis-tagged tests run: a redis service container is provided above.
      # :live_trp (ContractLiveTest) hits a real TRP deployment via
      # TRP_LIVE_CONTRACT_URL/KEY — CI has neither; excluded here, run at
      # activation per the module doc.
      - run: mix test --exclude memory --exclude live_trp --cover 2>&1 | tee full-coverage.txt
        shell: bash -o pipefail {0}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-full
          path: backend/full-coverage.txt
          if-no-files-found: ignore

  test-frontend:
    # Smoke only: npm ci + tsc. Not a full Next build and not Cypress.
    # npm ci talks to npm.noizu.com — cap so a dead registry cannot sit 40+ min.
    timeout-minutes: 10
    runs-on: ubuntu-latest # amd64
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Next config must be TypeScript (standalone)
        # next.config.js wins over next.config.ts and the leftover Phoenix
        # static export used distDir: '../src/npl_mcp/web/static', which
        # crashes Next 16 Turbopack in docker build-push.
        run: |
          if [ -f next.config.js ] || [ -f next.config.mjs ]; then
            echo "next.config.js/.mjs would override next.config.ts and break the image build" >&2
            ls -l next.config.* >&2
            exit 1
          fi
          if [ -d app ]; then
            echo "root frontend/app/ would win over src/app and break next build" >&2
            exit 1
          fi
          test -f next.config.ts
          grep -q 'output: "standalone"' next.config.ts
      - run: npx tsc --noEmit

  # Candidate build: no `needs` — starts immediately on push, parallel to the
  # test jobs, publishing `sha-<short>-rc` candidate tags. promote-release
  # re-tags them to the final sha tags only after tests pass.
  build-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { image: backend, repo: server }
          - { image: frontend, repo: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # One matrix leg per image: the two builds run on separate runners in
      # parallel (they ran back-to-back: cold ~253s + ~170s). Same job name,
      # `if:` and downstream `needs:`; the gha cache scopes are unchanged.
      - name: Build & push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          platforms: linux/amd64
          push: true
          build-args: ${{ matrix.image == 'frontend' && 'NEXT_PUBLIC_API_URL=https://promptlingo.dev' || '' }}
          secrets: ${{ matrix.image == 'frontend' && format('npm_token={0}', secrets.NPM_TOKEN) || '' }}
          tags: ${{ env.REGISTRY }}/npl-mcp/${{ matrix.repo }}:sha-${{ steps.sha.outputs.short }}-rc
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  # Nightly build-only cache warmer (schedule runs on main): same gha scopes
  # and build inputs as build-push, `push: false`, no load — keeps main-ref
  # buildx caches alive between releases (gaps of 7–12 days evicted them, so
  # the 2026-09-21 release built cold: 452s vs 100s warm). Pushes nothing.
  warm-docker-cache:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.image }} (cache only)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          platforms: linux/amd64
          push: false
          build-args: ${{ matrix.image == 'frontend' && 'NEXT_PUBLIC_API_URL=https://promptlingo.dev' || '' }}
          secrets: ${{ matrix.image == 'frontend' && format('npm_token={0}', secrets.NPM_TOKEN) || '' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  # Promotion gate: runs only when the test jobs AND the candidate builds
  # succeeded (same ref gate as build-push). Re-tags the -rc candidates to
  # the final sha tags via buildx imagetools — a manifest-level re-tag, no
  # rebuild; the image digest is unchanged.
  promote-release:
    needs: [test-backend, test-frontend, build-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Promote backend image (sha-<short>-rc → sha-<short>)
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/npl-mcp/server:sha-${{ steps.sha.outputs.short }} \
            ${{ env.REGISTRY }}/npl-mcp/server:sha-${{ steps.sha.outputs.short }}-rc
      - name: Promote frontend image (sha-<short>-rc → sha-<short>)
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/npl-mcp/frontend:sha-${{ steps.sha.outputs.short }} \
            ${{ env.REGISTRY }}/npl-mcp/frontend:sha-${{ steps.sha.outputs.short }}-rc

  bump-chart:
    needs: promote-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Need write credentials on main so the tag bump can push.
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.sha }}
      - name: Install yq
        # ubuntu-latest does not ship mikefarah/yq; without this the bump job
        # fails and helm tags stay split (backend v1.0.* vs frontend sha-*).
        run: |
          sudo curl -fsSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version
      - name: Bump image tags
        # yq, not sed — the chart nests repository/tag, and a bare `tag:` sed
        # would also clobber .liquibase.image.tag (manually versioned, job off).
        run: |
          SHORT=${GITHUB_SHA::7}
          yq -i ".backend.image.tag = \"sha-${SHORT}\"" helm/npl-mcp/values.yaml
          yq -i ".frontend.image.tag = \"sha-${SHORT}\"" helm/npl-mcp/values.yaml
          echo "backend.image.tag=$(yq -r '.backend.image.tag' helm/npl-mcp/values.yaml)"
          echo "frontend.image.tag=$(yq -r '.frontend.image.tag' helm/npl-mcp/values.yaml)"
      - name: Commit & push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "npl-mcp-ci"
          git config user.email "ci@noizu.com"
          git add helm/npl-mcp/values.yaml
          git diff --cached --quiet && exit 0
          git commit -m "ci: deploy sha-${GITHUB_SHA::7} [skip ci]"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin HEAD:main

  # ── Stage lane (refs/heads/stage) ─────────────────────────────────────────
  # Mirrors build-push with a distinct `-stage` tag suffix so stage images can
  # never collide with prod tags, and a stage NEXT_PUBLIC_API_URL. The
  # main-gated jobs above are not modified.
  # Stage twin of build-push: candidate builds start immediately on push and
  # publish `sha-<short>-stage-rc` tags; promote-release-stage re-tags them
  # to the final `-stage` tags once tests pass.
  build-push-stage:
    if: github.event_name == 'push' && github.ref == 'refs/heads/stage'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { image: backend, repo: server }
          - { image: frontend, repo: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # One matrix leg per image: the two builds run on separate runners in
      # parallel (they ran back-to-back: cold ~253s + ~170s). Same job name,
      # `if:` and downstream `needs:`; the gha cache scopes are unchanged.
      - name: Build & push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          platforms: linux/amd64
          push: true
          build-args: ${{ matrix.image == 'frontend' && 'NEXT_PUBLIC_API_URL=https://tobor-stage.noizu.com' || '' }}
          secrets: ${{ matrix.image == 'frontend' && format('npm_token={0}', secrets.NPM_TOKEN) || '' }}
          tags: ${{ env.REGISTRY }}/npl-mcp/${{ matrix.repo }}:sha-${{ steps.sha.outputs.short }}-stage-rc
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  # Stage twin of promote-release: re-tags the -stage-rc candidates to the
  # final -stage tags once the test jobs pass (same ref gate as
  # build-push-stage). Manifest-level re-tag, no rebuild.
  promote-release-stage:
    needs: [test-backend, test-frontend, build-push-stage]
    if: github.event_name == 'push' && github.ref == 'refs/heads/stage'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Promote backend image (sha-<short>-stage-rc → sha-<short>-stage)
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/npl-mcp/server:sha-${{ steps.sha.outputs.short }}-stage \
            ${{ env.REGISTRY }}/npl-mcp/server:sha-${{ steps.sha.outputs.short }}-stage-rc
      - name: Promote frontend image (sha-<short>-stage-rc → sha-<short>-stage)
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/npl-mcp/frontend:sha-${{ steps.sha.outputs.short }}-stage \
            ${{ env.REGISTRY }}/npl-mcp/frontend:sha-${{ steps.sha.outputs.short }}-stage-rc

  # Stage twin of bump-chart: bumps helm/npl-mcp/values-stage.yaml (Argo app
  # npl-mcp-stage tracks the stage branch) — never the prod values.yaml.
  bump-chart-stage:
    needs: promote-release-stage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Need write credentials on stage so the tag bump can push.
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.sha }}
      - name: Install yq
        # Same rationale as bump-chart: yq, not sed, so .liquibase.image.tag
        # (manually versioned) is never clobbered.
        run: |
          sudo curl -fsSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version
      - name: Bump image tags
        run: |
          SHORT=${GITHUB_SHA::7}
          yq -i ".backend.image.tag = \"sha-${SHORT}-stage\"" helm/npl-mcp/values-stage.yaml
          yq -i ".frontend.image.tag = \"sha-${SHORT}-stage\"" helm/npl-mcp/values-stage.yaml
          echo "backend.image.tag=$(yq -r '.backend.image.tag' helm/npl-mcp/values-stage.yaml)"
          echo "frontend.image.tag=$(yq -r '.frontend.image.tag' helm/npl-mcp/values-stage.yaml)"
      - name: Commit & push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "npl-mcp-ci"
          git config user.email "ci@noizu.com"
          git add helm/npl-mcp/values-stage.yaml
          git diff --cached --quiet && exit 0
          git commit -m "ci: deploy stage sha-${GITHUB_SHA::7} [skip ci]"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin HEAD:stage

name: story-status

on:
  pull_request:
    paths:
      - "app/backend/**"
      - "app/frontend/**"
      - "docs/user-stories/**"

jobs:
  status-advanced:
    name: verify story status advanced
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff user-stories frontmatter status
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          # Collect all US-*.md files touched in the diff
          changed=$(git diff --name-only "$BASE" "$HEAD" -- 'docs/user-stories/US-*.md' || true)

          # If the PR also touches app/backend or app/frontend, at least one story must advance status
          app_changed=$(git diff --name-only "$BASE" "$HEAD" -- 'app/backend' 'app/frontend' | head -1 || true)

          if [ -z "$app_changed" ]; then
            echo "PR does not touch application code — story advancement not required."
            exit 0
          fi

          if [ -z "$changed" ]; then
            echo "::error::Application code changed but no user story advanced — update status frontmatter in docs/user-stories/."
            exit 1
          fi

          advanced=0
          for f in $changed; do
            before=$(git show "$BASE:$f" 2>/dev/null | awk '/^status:/ {print $2; exit}')
            after=$(git show "$HEAD:$f" 2>/dev/null | awk '/^status:/ {print $2; exit}')

            if [ -n "$before" ] && [ -n "$after" ] && [ "$before" != "$after" ]; then
              echo "$f: $before → $after"
              advanced=$((advanced+1))
            fi
          done

          if [ "$advanced" -eq 0 ]; then
            echo "::error::Application code changed but no story's status field advanced."
            exit 1
          fi

          echo "✓ $advanced story status transition(s) detected"

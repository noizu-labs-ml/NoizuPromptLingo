name: backend

on:
  push:
    branches: [main]
    paths:
      - "app/backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "app/backend/**"
      - ".github/workflows/backend.yml"

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: mix test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      db:
        image: timescale/timescaledb-ha:pg17.9-ts2.25.2-all
        env:
          POSTGRES_USER: codefresh
          POSTGRES_PASSWORD: codefresh_test
          POSTGRES_DB: codefresh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U codefresh"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: app/backend

    env:
      MIX_ENV: test
      PHX_SERVER: "false"
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: codefresh
      DB_PASSWORD: codefresh_test
      DB_NAME: codefresh

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "28.0"

      - name: Cache deps + build
        uses: actions/cache@v4
        with:
          path: |
            app/backend/deps
            app/backend/_build
          key: mix-${{ runner.os }}-${{ hashFiles('app/backend/mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - name: Grant superuser for pgvector extension
        run: |
          PGPASSWORD=codefresh_test psql -h localhost -U codefresh -d codefresh_test \
            -c "ALTER USER codefresh WITH SUPERUSER;"

      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix ecto.create
      - run: mix ecto.migrate
      - run: mix test --cover
      - run: mix credo --strict

      - name: Generate OpenAPI spec + verify no breaking diff
        run: |
          mix codefresh.gen.openapi
          if [ -f ../../docs/openapi.json ]; then
            # If a committed snapshot exists, diff — additions/new paths pass,
            # but renamed/removed paths fail until explicitly promoted.
            if ! diff -u ../../docs/openapi.json <(cat docs/openapi.json 2>/dev/null || mix codefresh.gen.openapi) > /tmp/openapi.diff; then
              echo "OpenAPI spec changed. Review diff:"
              cat /tmp/openapi.diff
              if grep -E '^-\s*"(operationId|path)":' /tmp/openapi.diff; then
                echo "::error::breaking change detected in OpenAPI spec (operationId or path removed)"
                exit 1
              fi
            fi
          fi

  rollback-check:
    name: migrations up-down-up
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test

    services:
      db:
        image: timescale/timescaledb-ha:pg17.9-ts2.25.2-all
        env:
          POSTGRES_USER: codefresh
          POSTGRES_PASSWORD: codefresh_test
          POSTGRES_DB: codefresh_rollback
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U codefresh"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: app/backend

    env:
      MIX_ENV: dev
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: codefresh
      DB_PASSWORD: codefresh_test
      DB_NAME: codefresh_rollback

    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "28.0"

      - name: Grant superuser for extension creation
        run: |
          PGPASSWORD=codefresh_test psql -h localhost -U codefresh -d codefresh_rollback \
            -c "ALTER USER codefresh WITH SUPERUSER;"

      - run: mix deps.get
      - run: mix ecto.migrate
      - run: mix ecto.rollback --all
      - run: mix ecto.migrate

name: frontend

on:
  push:
    branches: [main]
    paths:
      - "app/frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "app/frontend/**"
      - ".github/workflows/frontend.yml"

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: lint + tsc --noEmit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: app/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/frontend/package-lock.json

      - run: npm ci
      # Project convention: don't `next build` in dev CI; use tsc for type-check.
      - run: npm run lint
      - run: npm run typecheck

  cypress-smoke:
    name: cypress smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-typecheck

    services:
      db:
        image: timescale/timescaledb-ha:pg17.9-ts2.25.2-all
        env:
          POSTGRES_USER: codefresh
          POSTGRES_PASSWORD: codefresh_test
          POSTGRES_DB: codefresh_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U codefresh"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: codefresh
      DB_PASSWORD: codefresh_test
      DB_NAME: codefresh_dev
      PHX_SERVER: "true"
      CYPRESS_BASE_URL: http://localhost:4000
      SECRET_KEY_BASE: "ci-secret-key-base-must-be-at-least-64-bytes-long-for-phoenix!!!!!!"
      GUARDIAN_SECRET_KEY: "ci-guardian-key-padded-to-at-least-sixty-four-bytes-for-safety-!!"

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "28.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/frontend/package-lock.json

      - name: Grant superuser + migrate backend
        run: |
          PGPASSWORD=codefresh_test psql -h localhost -U codefresh -d codefresh_dev \
            -c "ALTER USER codefresh WITH SUPERUSER;"
          cd app/backend
          mix deps.get
          mix ecto.migrate
          mix run priv/repo/seeds.exs

      - name: Start backend (background)
        run: |
          cd app/backend
          nohup mix phx.server > /tmp/phx.log 2>&1 &
          echo $! > /tmp/phx.pid
          # wait for health
          for i in $(seq 1 30); do
            if curl -fs http://localhost:4000/health; then exit 0; fi
            sleep 1
          done
          echo "backend didn't come up"; cat /tmp/phx.log; exit 1

      - name: Install frontend deps
        run: |
          cd app/frontend
          npm ci

      - name: Start frontend (background)
        run: |
          cd app/frontend
          nohup npm run dev > /tmp/next.log 2>&1 &
          echo $! > /tmp/next.pid
          for i in $(seq 1 30); do
            if curl -fs http://localhost:3000; then exit 0; fi
            sleep 1
          done
          echo "frontend didn't come up"; cat /tmp/next.log; exit 1

      - name: Cypress smoke
        env:
          CYPRESS_BASE_URL: http://localhost:3000
        run: |
          cd app/frontend
          npm run cypress:smoke

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: app/frontend/cypress/screenshots
          if-no-files-found: ignore

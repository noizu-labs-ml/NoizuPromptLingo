# ── Page Layouts ──
# Optional. Extracted from §04 Spacing & Layout.
#
# Defines content width presets for the style guide viewer.
# If omitted, inherits from base theme.

page-layouts:
  - name: standard
    title: Standard
    description: "{Primary content layout — max-width centered}"
    selector: ".content"
    vars:
      max-width: "1200px"
      padding: "var(--space-6)"
      margin: "0 auto"
      body-bg: "var(--surface)"
      content-bg: "var(--surface-alt)"
    chrome:
      navbar:
        height: "56px"
        background: "var(--surface-inverse)"
        color: "var(--text-inverse)"
        label: "Nav"
      footer:
        height: "48px"
        background: "var(--surface-alt)"
        color: "var(--text-muted)"
        label: "Footer"

  - name: narrow
    title: Narrow
    description: "{Reading-focused single column}"
    selector: ".content.narrow"
    vars:
      max-width: "720px"
      padding: "var(--space-6)"
      margin: "0 auto"
      body-bg: "var(--surface)"
      content-bg: "var(--surface-alt)"

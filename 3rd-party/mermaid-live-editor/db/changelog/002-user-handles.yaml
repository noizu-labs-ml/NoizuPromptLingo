databaseChangeLog:
  # Handle column was added after initial better-auth scaffold to support
  # user-facing profile URLs (/u/:handle) and @-mentions in sharing.
  - changeSet:
      id: add-column-users-handle
      author: mermaid-live-editor
      comment: "Add handle column for user profile URLs and @-mention resolution"
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: handle
                  type: text
      rollback:
        - dropColumn:
            tableName: users
            columnName: handle

  - changeSet:
      id: create-unique-index-users-handle
      author: mermaid-live-editor
      comment: "Handles must be unique across all users for URL routing"
      changes:
        - createIndex:
            indexName: idx_users_handle
            tableName: users
            unique: true
            columns:
              - column:
                  name: handle
      rollback:
        - dropIndex:
            indexName: idx_users_handle
            tableName: users

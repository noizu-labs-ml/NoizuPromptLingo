databaseChangeLog:
  # ─── Diagram description & tags ──────────────────────────────────────────────
  - changeSet:
      id: add-column-diagrams-description
      author: omar-hassan
      comment: "Free-text description for diagram metadata / search"
      changes:
        - addColumn:
            tableName: diagrams
            columns:
              - column:
                  name: description
                  type: text
      rollback:
        - dropColumn:
            tableName: diagrams
            columnName: description

  - changeSet:
      id: add-column-diagrams-tags
      author: omar-hassan
      comment: >
        JSONB array of string tags for categorisation and filtering.
        CHECK constraint ensures the column always holds a JSON array.
      changes:
        - sql:
            sql: |
              ALTER TABLE diagrams
                ADD COLUMN tags jsonb NOT NULL DEFAULT '[]'::jsonb
                  CONSTRAINT chk_diagrams_tags_array
                    CHECK (jsonb_typeof(tags) = 'array');
      rollback:
        - sql:
            sql: |
              ALTER TABLE diagrams
                DROP CONSTRAINT IF EXISTS chk_diagrams_tags_array;
              ALTER TABLE diagrams
                DROP COLUMN IF EXISTS tags;

  - changeSet:
      id: create-index-diagrams-tags
      author: omar-hassan
      comment: "GIN index on tags for @> containment queries (e.g. WHERE tags @> '[\"flowchart\"]')"
      changes:
        - sql:
            sql: >
              CREATE INDEX idx_diagrams_tags
              ON diagrams USING gin (tags);
      rollback:
        - dropIndex:
            indexName: idx_diagrams_tags
            tableName: diagrams

  # ─── Projects ────────────────────────────────────────────────────────────────
  - changeSet:
      id: create-table-projects
      author: omar-hassan
      comment: >
        Projects group related diagrams. owner_id CASCADE: deleting owner
        deletes all their projects. visibility CHECK mirrors diagrams table.
      changes:
        - sql:
            sql: |
              CREATE TABLE projects (
                id text PRIMARY KEY,
                owner_id text NOT NULL REFERENCES users(id) ON DELETE CASCADE,
                name text NOT NULL,
                description text,
                visibility text NOT NULL DEFAULT 'private'
                  CONSTRAINT chk_projects_visibility
                    CHECK (visibility IN ('private', 'unlisted', 'public')),
                created_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
      rollback:
        - dropTable:
            tableName: projects

  - changeSet:
      id: create-index-projects-owner-id
      author: omar-hassan
      changes:
        - createIndex:
            indexName: idx_projects_owner_id
            tableName: projects
            columns:
              - column:
                  name: owner_id
      rollback:
        - dropIndex:
            indexName: idx_projects_owner_id
            tableName: projects

  # ─── Project–Diagram join table ──────────────────────────────────────────────
  - changeSet:
      id: create-table-project-diagrams
      author: omar-hassan
      comment: >
        Many-to-many join: a diagram can belong to multiple projects.
        Both FKs CASCADE: removing either side cleans up the link.
        Unique constraint prevents duplicate membership.
      changes:
        - sql:
            sql: |
              CREATE TABLE project_diagrams (
                id text PRIMARY KEY,
                project_id text NOT NULL REFERENCES projects(id) ON DELETE CASCADE,
                diagram_id text NOT NULL REFERENCES diagrams(id) ON DELETE CASCADE,
                position integer NOT NULL DEFAULT 0,
                added_at timestamptz NOT NULL DEFAULT now()
              );
      rollback:
        - dropTable:
            tableName: project_diagrams

  - changeSet:
      id: create-unique-index-project-diagrams
      author: omar-hassan
      comment: "Prevent adding the same diagram to a project twice"
      changes:
        - createIndex:
            indexName: idx_project_diagrams_unique
            tableName: project_diagrams
            unique: true
            columns:
              - column:
                  name: project_id
              - column:
                  name: diagram_id
      rollback:
        - dropIndex:
            indexName: idx_project_diagrams_unique
            tableName: project_diagrams

  - changeSet:
      id: create-index-project-diagrams-diagram-id
      author: omar-hassan
      comment: "Reverse lookup: which projects contain a given diagram"
      changes:
        - createIndex:
            indexName: idx_project_diagrams_diagram_id
            tableName: project_diagrams
            columns:
              - column:
                  name: diagram_id
      rollback:
        - dropIndex:
            indexName: idx_project_diagrams_diagram_id
            tableName: project_diagrams

databaseChangeLog:
  # ─── Organizations ────────────────────────────────────────────────────────────
  - changeSet:
      id: create-table-organizations
      author: mermaid-live-editor
      changes:
        - sql:
            sql: |
              CREATE TABLE organizations (
                id text PRIMARY KEY,
                name text NOT NULL,
                slug text NOT NULL,
                created_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
      rollback:
        - dropTable:
            tableName: organizations

  - changeSet:
      id: create-unique-index-organizations-slug
      author: mermaid-live-editor
      changes:
        - createIndex:
            indexName: idx_organizations_slug
            tableName: organizations
            unique: true
            columns:
              - column:
                  name: slug
      rollback:
        - dropIndex:
            indexName: idx_organizations_slug
            tableName: organizations

  # ─── Organization Members ─────────────────────────────────────────────────────
  - changeSet:
      id: create-table-org-members
      author: mermaid-live-editor
      changes:
        - sql:
            sql: |
              CREATE TABLE org_members (
                id text PRIMARY KEY,
                org_id text NOT NULL REFERENCES organizations(id) ON DELETE CASCADE,
                user_id text NOT NULL REFERENCES users(id) ON DELETE CASCADE,
                role text NOT NULL DEFAULT 'member',
                created_at timestamptz NOT NULL DEFAULT now()
              );
      rollback:
        - dropTable:
            tableName: org_members

  - changeSet:
      id: create-unique-index-org-members
      author: mermaid-live-editor
      changes:
        - createIndex:
            indexName: idx_org_members_unique
            tableName: org_members
            unique: true
            columns:
              - column:
                  name: org_id
              - column:
                  name: user_id
      rollback:
        - dropIndex:
            indexName: idx_org_members_unique
            tableName: org_members

  - changeSet:
      id: create-index-org-members-user-id
      author: mermaid-live-editor
      changes:
        - createIndex:
            indexName: idx_org_members_user_id
            tableName: org_members
            columns:
              - column:
                  name: user_id
      rollback:
        - dropIndex:
            indexName: idx_org_members_user_id
            tableName: org_members

  # ─── Diagram Shares ───────────────────────────────────────────────────────────
  - changeSet:
      id: create-table-diagram-shares
      author: mermaid-live-editor
      comment: >
        Schema review fix #6: XOR constraint ensures exactly one of
        shared_with_user_id / shared_with_org_id is set per row.
        Original Drizzle schema only enforced "at least one."
      changes:
        - sql:
            sql: |
              CREATE TABLE diagram_shares (
                id text PRIMARY KEY,
                diagram_id text NOT NULL REFERENCES diagrams(id) ON DELETE CASCADE,
                shared_with_user_id text REFERENCES users(id) ON DELETE CASCADE,
                shared_with_org_id text REFERENCES organizations(id) ON DELETE CASCADE,
                permission text NOT NULL DEFAULT 'view',
                created_at timestamptz NOT NULL DEFAULT now(),
                CONSTRAINT chk_share_target_xor
                  CHECK ((shared_with_user_id IS NOT NULL) != (shared_with_org_id IS NOT NULL))
              );
      rollback:
        - dropTable:
            tableName: diagram_shares

  - changeSet:
      id: create-index-diagram-shares-diagram
      author: mermaid-live-editor
      changes:
        - createIndex:
            indexName: idx_diagram_shares_diagram
            tableName: diagram_shares
            columns:
              - column:
                  name: diagram_id
      rollback:
        - dropIndex:
            indexName: idx_diagram_shares_diagram
            tableName: diagram_shares

  - changeSet:
      id: create-index-diagram-shares-user
      author: mermaid-live-editor
      changes:
        - createIndex:
            indexName: idx_diagram_shares_user
            tableName: diagram_shares
            columns:
              - column:
                  name: shared_with_user_id
      rollback:
        - dropIndex:
            indexName: idx_diagram_shares_user
            tableName: diagram_shares

  - changeSet:
      id: create-index-diagram-shares-org
      author: mermaid-live-editor
      changes:
        - createIndex:
            indexName: idx_diagram_shares_org
            tableName: diagram_shares
            columns:
              - column:
                  name: shared_with_org_id
      rollback:
        - dropIndex:
            indexName: idx_diagram_shares_org
            tableName: diagram_shares

  # Schema review fix #6: partial unique indexes prevent duplicate shares
  - changeSet:
      id: create-unique-index-diagram-shares-user
      author: elena-voss
      comment: "Prevents sharing same diagram to same user multiple times"
      changes:
        - sql:
            sql: >
              CREATE UNIQUE INDEX idx_diagram_shares_user_unique
              ON diagram_shares (diagram_id, shared_with_user_id)
              WHERE shared_with_user_id IS NOT NULL;
      rollback:
        - dropIndex:
            indexName: idx_diagram_shares_user_unique
            tableName: diagram_shares

  - changeSet:
      id: create-unique-index-diagram-shares-org
      author: elena-voss
      comment: "Prevents sharing same diagram to same org multiple times"
      changes:
        - sql:
            sql: >
              CREATE UNIQUE INDEX idx_diagram_shares_org_unique
              ON diagram_shares (diagram_id, shared_with_org_id)
              WHERE shared_with_org_id IS NOT NULL;
      rollback:
        - dropIndex:
            indexName: idx_diagram_shares_org_unique
            tableName: diagram_shares

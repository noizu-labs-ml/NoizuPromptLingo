databaseChangeLog:
  # ─── Extensions ───────────────────────────────────────────────────────────────
  - changeSet:
      id: create-extension-pg-trgm
      author: mermaid-live-editor
      comment: "Required for trigram-based ILIKE search indexes on diagram titles"
      changes:
        - sql:
            sql: CREATE EXTENSION IF NOT EXISTS pg_trgm;
      rollback:
        - sql:
            sql: DROP EXTENSION IF EXISTS pg_trgm;

  # ─── Users ────────────────────────────────────────────────────────────────────
  - changeSet:
      id: create-table-users
      author: mermaid-live-editor
      changes:
        - sql:
            sql: |
              CREATE TABLE users (
                id text PRIMARY KEY,
                email text NOT NULL,
                email_verified boolean NOT NULL DEFAULT false,
                image text,
                name text,
                created_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
      rollback:
        - dropTable:
            tableName: users

  - changeSet:
      id: create-unique-index-users-email
      author: mermaid-live-editor
      changes:
        - createIndex:
            indexName: idx_users_email
            tableName: users
            unique: true
            columns:
              - column:
                  name: email
      rollback:
        - dropIndex:
            indexName: idx_users_email
            tableName: users

  # ─── Accounts ─────────────────────────────────────────────────────────────────
  - changeSet:
      id: create-table-accounts
      author: mermaid-live-editor
      changes:
        - sql:
            sql: |
              CREATE TABLE accounts (
                id text PRIMARY KEY,
                user_id text NOT NULL REFERENCES users(id) ON DELETE CASCADE,
                provider_id text NOT NULL,
                account_id text NOT NULL,
                access_token text,
                refresh_token text,
                id_token text,
                scope text,
                token_type text,
                password text,
                expires_at timestamptz,
                created_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
      rollback:
        - dropTable:
            tableName: accounts

  - changeSet:
      id: create-index-accounts-user-id
      author: mermaid-live-editor
      changes:
        - createIndex:
            indexName: idx_accounts_user_id
            tableName: accounts
            columns:
              - column:
                  name: user_id
      rollback:
        - dropIndex:
            indexName: idx_accounts_user_id
            tableName: accounts

  # ─── Sessions ─────────────────────────────────────────────────────────────────
  - changeSet:
      id: create-table-sessions
      author: mermaid-live-editor
      changes:
        - sql:
            sql: |
              CREATE TABLE sessions (
                id text PRIMARY KEY,
                user_id text NOT NULL REFERENCES users(id) ON DELETE CASCADE,
                token text NOT NULL,
                ip_address text,
                user_agent text,
                expires_at timestamptz NOT NULL,
                created_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
      rollback:
        - dropTable:
            tableName: sessions

  - changeSet:
      id: create-unique-index-sessions-token
      author: mermaid-live-editor
      changes:
        - createIndex:
            indexName: idx_sessions_token
            tableName: sessions
            unique: true
            columns:
              - column:
                  name: token
      rollback:
        - dropIndex:
            indexName: idx_sessions_token
            tableName: sessions

  - changeSet:
      id: create-index-sessions-user-id
      author: mermaid-live-editor
      changes:
        - createIndex:
            indexName: idx_sessions_user_id
            tableName: sessions
            columns:
              - column:
                  name: user_id
      rollback:
        - dropIndex:
            indexName: idx_sessions_user_id
            tableName: sessions

  # Schema review #9: index for expired session cleanup queries
  - changeSet:
      id: create-index-sessions-expires-at
      author: elena-voss
      comment: "Enables efficient DELETE FROM sessions WHERE expires_at < now()"
      changes:
        - createIndex:
            indexName: idx_sessions_expires_at
            tableName: sessions
            columns:
              - column:
                  name: expires_at
      rollback:
        - dropIndex:
            indexName: idx_sessions_expires_at
            tableName: sessions

  # ─── Verifications ────────────────────────────────────────────────────────────
  - changeSet:
      id: create-table-verifications
      author: mermaid-live-editor
      changes:
        - sql:
            sql: |
              CREATE TABLE verifications (
                id text PRIMARY KEY,
                identifier text NOT NULL,
                value text NOT NULL,
                expires_at timestamptz NOT NULL,
                created_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
      rollback:
        - dropTable:
            tableName: verifications

  - changeSet:
      id: create-index-verifications-identifier
      author: mermaid-live-editor
      changes:
        - createIndex:
            indexName: idx_verifications_identifier
            tableName: verifications
            columns:
              - column:
                  name: identifier
      rollback:
        - dropIndex:
            indexName: idx_verifications_identifier
            tableName: verifications

  # Schema review #9: index for expired verification cleanup queries
  - changeSet:
      id: create-index-verifications-expires-at
      author: elena-voss
      comment: "Enables efficient DELETE FROM verifications WHERE expires_at < now()"
      changes:
        - createIndex:
            indexName: idx_verifications_expires_at
            tableName: verifications
            columns:
              - column:
                  name: expires_at
      rollback:
        - dropIndex:
            indexName: idx_verifications_expires_at
            tableName: verifications

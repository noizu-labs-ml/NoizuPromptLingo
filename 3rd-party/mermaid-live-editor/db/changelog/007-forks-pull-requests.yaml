databaseChangeLog:
  # ─── Diagram Forks ───────────────────────────────────────────────────────────
  - changeSet:
      id: create-table-diagram-forks
      author: omar-hassan
      comment: >
        Tracks fork lineage between diagrams.
        source_diagram_id SET NULL: if the original is deleted the fork record
        survives (orphaned-fork detection). forked_diagram_id CASCADE: if the
        fork itself is deleted the record is meaningless. forked_by SET NULL:
        user deletion keeps the audit trail.
      changes:
        - sql:
            sql: |
              CREATE TABLE diagram_forks (
                id text PRIMARY KEY,
                source_diagram_id text REFERENCES diagrams(id) ON DELETE SET NULL,
                forked_diagram_id text NOT NULL REFERENCES diagrams(id) ON DELETE CASCADE,
                forked_by text REFERENCES users(id) ON DELETE SET NULL,
                created_at timestamptz NOT NULL DEFAULT now()
              );
      rollback:
        - dropTable:
            tableName: diagram_forks

  - changeSet:
      id: create-index-diagram-forks-source
      author: omar-hassan
      changes:
        - createIndex:
            indexName: idx_diagram_forks_source
            tableName: diagram_forks
            columns:
              - column:
                  name: source_diagram_id
      rollback:
        - dropIndex:
            indexName: idx_diagram_forks_source
            tableName: diagram_forks

  - changeSet:
      id: create-index-diagram-forks-forked
      author: omar-hassan
      changes:
        - createIndex:
            indexName: idx_diagram_forks_forked
            tableName: diagram_forks
            columns:
              - column:
                  name: forked_diagram_id
      rollback:
        - dropIndex:
            indexName: idx_diagram_forks_forked
            tableName: diagram_forks

  - changeSet:
      id: create-unique-index-diagram-forks
      author: omar-hassan
      comment: "Prevent duplicate fork records for the same source→fork pair"
      changes:
        - sql:
            sql: >
              CREATE UNIQUE INDEX idx_diagram_forks_unique
              ON diagram_forks (source_diagram_id, forked_diagram_id)
              WHERE source_diagram_id IS NOT NULL;
      rollback:
        - dropIndex:
            indexName: idx_diagram_forks_unique
            tableName: diagram_forks

  # ─── Diagram Pull Requests ──────────────────────────────────────────────────
  - changeSet:
      id: create-table-diagram-pull-requests
      author: omar-hassan
      comment: >
        Pull requests propose merging changes from a source diagram into a
        target diagram. source_diagram_id SET NULL: source deletion keeps the
        PR for audit. target_diagram_id CASCADE: target deletion invalidates
        the PR entirely. created_by SET NULL: user deletion preserves history.
        Status CHECK constrains lifecycle states.
      changes:
        - sql:
            sql: |
              CREATE TABLE diagram_pull_requests (
                id text PRIMARY KEY,
                source_diagram_id text REFERENCES diagrams(id) ON DELETE SET NULL,
                target_diagram_id text NOT NULL REFERENCES diagrams(id) ON DELETE CASCADE,
                created_by text REFERENCES users(id) ON DELETE SET NULL,
                title text NOT NULL,
                description text,
                status text NOT NULL DEFAULT 'open'
                  CONSTRAINT chk_diagram_pull_requests_status
                    CHECK (status IN ('open', 'merged', 'closed')),
                closed_at timestamptz,
                created_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
      rollback:
        - dropTable:
            tableName: diagram_pull_requests

  - changeSet:
      id: create-index-diagram-pull-requests-source
      author: omar-hassan
      changes:
        - createIndex:
            indexName: idx_diagram_pull_requests_source
            tableName: diagram_pull_requests
            columns:
              - column:
                  name: source_diagram_id
      rollback:
        - dropIndex:
            indexName: idx_diagram_pull_requests_source
            tableName: diagram_pull_requests

  - changeSet:
      id: create-index-diagram-pull-requests-target
      author: omar-hassan
      changes:
        - createIndex:
            indexName: idx_diagram_pull_requests_target
            tableName: diagram_pull_requests
            columns:
              - column:
                  name: target_diagram_id
      rollback:
        - dropIndex:
            indexName: idx_diagram_pull_requests_target
            tableName: diagram_pull_requests

  - changeSet:
      id: create-index-diagram-pull-requests-created-by
      author: omar-hassan
      changes:
        - createIndex:
            indexName: idx_diagram_pull_requests_created_by
            tableName: diagram_pull_requests
            columns:
              - column:
                  name: created_by
      rollback:
        - dropIndex:
            indexName: idx_diagram_pull_requests_created_by
            tableName: diagram_pull_requests

  - changeSet:
      id: create-index-diagram-pull-requests-status
      author: omar-hassan
      comment: "Filter PRs by status (open/merged/closed)"
      changes:
        - createIndex:
            indexName: idx_diagram_pull_requests_status
            tableName: diagram_pull_requests
            columns:
              - column:
                  name: status
      rollback:
        - dropIndex:
            indexName: idx_diagram_pull_requests_status
            tableName: diagram_pull_requests

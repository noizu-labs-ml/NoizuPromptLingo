databaseChangeLog:
  # ─── Diagram Branches ────────────────────────────────────────────────────────
  - changeSet:
      id: create-table-diagram-branches
      author: omar-hassan
      comment: >
        Named branches per diagram for version-control workflows.
        diagram_id CASCADE: diagram deletion removes all its branches.
        created_by SET NULL: user deletion keeps the branch.
        Unique constraint on (diagram_id, name) prevents duplicate branch names.
      changes:
        - sql:
            sql: |
              CREATE TABLE diagram_branches (
                id text PRIMARY KEY,
                diagram_id text NOT NULL REFERENCES diagrams(id) ON DELETE CASCADE,
                name text NOT NULL,
                created_by text REFERENCES users(id) ON DELETE SET NULL,
                created_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
      rollback:
        - dropTable:
            tableName: diagram_branches

  - changeSet:
      id: create-unique-index-diagram-branches
      author: omar-hassan
      comment: "Branch names must be unique within a diagram"
      changes:
        - createIndex:
            indexName: idx_diagram_branches_unique
            tableName: diagram_branches
            unique: true
            columns:
              - column:
                  name: diagram_id
              - column:
                  name: name
      rollback:
        - dropIndex:
            indexName: idx_diagram_branches_unique
            tableName: diagram_branches

  - changeSet:
      id: create-index-diagram-branches-diagram-id
      author: omar-hassan
      changes:
        - createIndex:
            indexName: idx_diagram_branches_diagram_id
            tableName: diagram_branches
            columns:
              - column:
                  name: diagram_id
      rollback:
        - dropIndex:
            indexName: idx_diagram_branches_diagram_id
            tableName: diagram_branches

  # ─── Diagram Commits ─────────────────────────────────────────────────────────
  - changeSet:
      id: create-table-diagram-commits
      author: omar-hassan
      comment: >
        Immutable commit records per branch. Each commit stores a snapshot of
        code + config. branch_id CASCADE: branch deletion removes all its
        commits. parent_commit_id SET NULL: allows root commits and preserves
        children if a parent is somehow removed. committed_by SET NULL: user
        deletion keeps the commit trail.
      changes:
        - sql:
            sql: |
              CREATE TABLE diagram_commits (
                id text PRIMARY KEY,
                branch_id text NOT NULL REFERENCES diagram_branches(id) ON DELETE CASCADE,
                parent_commit_id text REFERENCES diagram_commits(id) ON DELETE SET NULL,
                code text NOT NULL,
                config text,
                message text,
                committed_by text REFERENCES users(id) ON DELETE SET NULL,
                created_at timestamptz NOT NULL DEFAULT now()
              );
      rollback:
        - dropTable:
            tableName: diagram_commits

  - changeSet:
      id: create-index-diagram-commits-branch-id
      author: omar-hassan
      changes:
        - createIndex:
            indexName: idx_diagram_commits_branch_id
            tableName: diagram_commits
            columns:
              - column:
                  name: branch_id
      rollback:
        - dropIndex:
            indexName: idx_diagram_commits_branch_id
            tableName: diagram_commits

  - changeSet:
      id: create-index-diagram-commits-parent
      author: omar-hassan
      changes:
        - createIndex:
            indexName: idx_diagram_commits_parent
            tableName: diagram_commits
            columns:
              - column:
                  name: parent_commit_id
      rollback:
        - dropIndex:
            indexName: idx_diagram_commits_parent
            tableName: diagram_commits

  # ─── Active branch pointer on diagrams ───────────────────────────────────────
  - changeSet:
      id: add-column-diagrams-active-branch-id
      author: omar-hassan
      comment: >
        Nullable FK to diagram_branches. SET NULL on branch deletion so the
        diagram remains intact — application layer can detect the null and
        prompt the user to select a new active branch.
      changes:
        - sql:
            sql: |
              ALTER TABLE diagrams
                ADD COLUMN active_branch_id text
                  REFERENCES diagram_branches(id) ON DELETE SET NULL;
      rollback:
        - dropColumn:
            tableName: diagrams
            columnName: active_branch_id

  - changeSet:
      id: create-index-diagrams-active-branch-id
      author: omar-hassan
      comment: "Lookup diagrams by active branch (e.g. orphan detection)"
      changes:
        - createIndex:
            indexName: idx_diagrams_active_branch_id
            tableName: diagrams
            columns:
              - column:
                  name: active_branch_id
      rollback:
        - dropIndex:
            indexName: idx_diagrams_active_branch_id
            tableName: diagrams

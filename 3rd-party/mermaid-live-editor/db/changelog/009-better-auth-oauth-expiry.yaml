databaseChangeLog:
  - changeSet:
      id: 009-add-better-auth-oauth-token-expiry-columns
      author: codex
      comment: "Adds Better Auth OAuth account token expiry columns used by generic OAuth providers."
      changes:
        - sql:
            sql: |
              ALTER TABLE accounts
                ADD COLUMN IF NOT EXISTS access_token_expires_at timestamptz,
                ADD COLUMN IF NOT EXISTS refresh_token_expires_at timestamptz;
      rollback:
        - sql:
            sql: |
              ALTER TABLE accounts
                DROP COLUMN IF EXISTS refresh_token_expires_at,
                DROP COLUMN IF EXISTS access_token_expires_at;

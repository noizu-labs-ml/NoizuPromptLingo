databaseChangeLog:
  # ─── Folders ──────────────────────────────────────────────────────────────────
  - changeSet:
      id: create-table-folders
      author: mermaid-live-editor
      comment: >
        Schema review fix #4: parent_id has FK to folders(id) ON DELETE SET NULL,
        preventing orphaned parent references under concurrent requests.
      changes:
        - sql:
            sql: |
              CREATE TABLE folders (
                id text PRIMARY KEY,
                user_id text NOT NULL REFERENCES users(id) ON DELETE CASCADE,
                name text NOT NULL,
                parent_id text REFERENCES folders(id) ON DELETE SET NULL,
                created_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
      rollback:
        - dropTable:
            tableName: folders

  - changeSet:
      id: create-index-folders-user-id
      author: mermaid-live-editor
      changes:
        - createIndex:
            indexName: idx_folders_user_id
            tableName: folders
            columns:
              - column:
                  name: user_id
      rollback:
        - dropIndex:
            indexName: idx_folders_user_id
            tableName: folders

  - changeSet:
      id: create-index-folders-parent-id
      author: mermaid-live-editor
      changes:
        - createIndex:
            indexName: idx_folders_parent_id
            tableName: folders
            columns:
              - column:
                  name: parent_id
      rollback:
        - dropIndex:
            indexName: idx_folders_parent_id
            tableName: folders

  # ─── Diagrams ─────────────────────────────────────────────────────────────────
  - changeSet:
      id: create-table-diagrams
      author: mermaid-live-editor
      comment: >
        Schema review fix #8: visibility column has CHECK constraint enforcing
        valid values at the database level. Application limits: code <= 500KB,
        title <= 200 chars, config and thumbnail should be bounded in app layer.
      changes:
        - sql:
            sql: |
              CREATE TABLE diagrams (
                id text PRIMARY KEY,
                user_id text REFERENCES users(id) ON DELETE SET NULL,
                title text,
                code text NOT NULL,
                config text,
                visibility text NOT NULL DEFAULT 'private'
                  CONSTRAINT chk_diagrams_visibility
                    CHECK (visibility IN ('private', 'unlisted', 'public')),
                starred boolean NOT NULL DEFAULT false,
                thumbnail text,
                folder_id text REFERENCES folders(id) ON DELETE SET NULL,
                created_at timestamptz NOT NULL DEFAULT now(),
                updated_at timestamptz NOT NULL DEFAULT now()
              );
      rollback:
        - dropTable:
            tableName: diagrams

  # Schema review fix #2: composite index covering the primary listing query
  # SELECT ... FROM diagrams WHERE user_id = ? ORDER BY updated_at DESC LIMIT 20
  # Eliminates in-memory sort on every list request. Also covers plain
  # equality lookups on user_id, making a separate single-column index redundant.
  - changeSet:
      id: create-index-diagrams-user-id-updated-at
      author: elena-voss
      comment: "Composite covering filter + sort for the primary listing query"
      changes:
        - sql:
            sql: >
              CREATE INDEX idx_diagrams_user_id_updated
              ON diagrams (user_id, updated_at DESC);
      rollback:
        - dropIndex:
            indexName: idx_diagrams_user_id_updated
            tableName: diagrams

  - changeSet:
      id: create-index-diagrams-folder-id
      author: mermaid-live-editor
      changes:
        - createIndex:
            indexName: idx_diagrams_folder_id
            tableName: diagrams
            columns:
              - column:
                  name: folder_id
      rollback:
        - dropIndex:
            indexName: idx_diagrams_folder_id
            tableName: diagrams

  # Partial index: only indexes starred=true rows.
  # Covers WHERE user_id = ? AND starred = true ORDER BY updated_at DESC.
  # Much smaller than a full composite on (user_id, starred).
  - changeSet:
      id: create-index-diagrams-starred
      author: elena-voss
      comment: "Partial index for starred diagrams — fraction of the size of full composite"
      changes:
        - sql:
            sql: >
              CREATE INDEX idx_diagrams_starred
              ON diagrams (user_id, updated_at DESC)
              WHERE starred = true;
      rollback:
        - dropIndex:
            indexName: idx_diagrams_starred
            tableName: diagrams

  # Schema review fix #7: partial index for public diagrams replaces the
  # useless full-column visibility index (3 values = ~33% selectivity = never used).
  - changeSet:
      id: create-index-diagrams-public
      author: elena-voss
      comment: "Partial index for future public gallery. Replaces dropped low-cardinality visibility index"
      changes:
        - sql:
            sql: >
              CREATE INDEX idx_diagrams_public
              ON diagrams (user_id, updated_at DESC)
              WHERE visibility = 'public';
      rollback:
        - dropIndex:
            indexName: idx_diagrams_public
            tableName: diagrams

  # Schema review fix #3: pg_trgm GIN index on title for ILIKE '%q%' search.
  # Code-column search should be restricted to title-only in application layer.
  - changeSet:
      id: create-index-diagrams-title-trgm
      author: elena-voss
      comment: "Trigram index for substring search on titles. Requires pg_trgm extension (001)"
      changes:
        - sql:
            sql: >
              CREATE INDEX idx_diagrams_title_trgm
              ON diagrams USING gin (title gin_trgm_ops);
      rollback:
        - dropIndex:
            indexName: idx_diagrams_title_trgm
            tableName: diagrams

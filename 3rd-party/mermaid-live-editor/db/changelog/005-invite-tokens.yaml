databaseChangeLog:
  - changeSet:
      id: 005-create-invite-tokens
      author: jin
      changes:
        - createTable:
            tableName: invite_tokens
            columns:
              - column:
                  name: id
                  type: text
                  constraints:
                    primaryKey: true
              - column:
                  name: token
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: text
              - column:
                  name: used_by
                  type: text
              - column:
                  name: used_at
                  type: timestamptz
              - column:
                  name: max_uses
                  type: int
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
              - column:
                  name: use_count
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: timestamptz
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_invite_tokens_token
            tableName: invite_tokens
            unique: true
            columns:
              - column:
                  name: token
